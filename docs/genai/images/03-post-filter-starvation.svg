  <rect class="card" x="1" y="1" width="798" height="468" rx="14"/>
  <text class="h" x="28" y="40">Filter after the index: LIMIT 10 returns 4 rows</text>
  <text class="sub" x="28" y="62">WHERE tenant = 'acme' matches 10% of rows. Green = acme, grey = other tenants.</text>
