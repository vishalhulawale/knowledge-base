  <text class="tx badt" x="28" y="344">A request needing 40 ms of CPU finishes at ~115 ms, while average CPU looks low.</text>
  <text class="sub" x="28" y="368">Measured: a CPU loop took 3.11 s unlimited, 6.15 s at 0.5 CPU and 12.61 s at 0.25 CPU.</text>
  <text class="sub" x="28" y="390">Common fix for latency-sensitive JVMs: CPU request (for scheduling) without a CPU limit, memory request = limit,</text>
  <text class="sub" x="28" y="408">and -XX:ActiveProcessorCount set explicitly so thread pools match the CPU you really get.</text>
