<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Star schema for claims analytics</title>
  <desc id="d">A warehouse star schema. In the centre, the fact table fact_claim has one row per claim line with foreign keys to four dimensions and numeric measures: quantity, amount billed and amount paid. Around it are the dimension tables dim_member with plan and region, dim_drug with name, class and generic flag, dim_pharmacy with chain and state, and dim_date with day, month, quarter and year. A report like paid amount by drug class and quarter joins the fact to two dimensions and aggregates, which column stores scan very fast.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <defs><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">Analytics: one fact table, several dimensions</text>
  <text class="sub" x="28" y="62">Denormalised on purpose: wide dimensions, narrow facts. Column stores scan the facts fast.</text>
  <rect class="bp" x="300" y="150" width="200" height="170" rx="10" stroke-width="1.5"/>
  <text class="lbl" x="312" y="171">fact_claim</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="312" y="194">member_key  FK</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="312" y="214">drug_key    FK</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="312" y="234">pharmacy_key FK</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="312" y="254">date_key    FK</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="312" y="274">quantity</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="312" y="294">amount_billed</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="312" y="314">amount_paid</text>
  <rect class="bt" x="28" y="90" width="200" height="90" rx="10" stroke-width="1.5"/>
  <text class="lbl" x="40" y="111">dim_member</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="40" y="134">member_key PK</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="40" y="154">plan, region</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="40" y="174">age_band (SCD2)</text>
  <rect class="bt" x="572" y="90" width="200" height="90" rx="10" stroke-width="1.5"/>
  <text class="lbl" x="584" y="111">dim_drug</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="584" y="134">drug_key PK</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="584" y="154">name, drug_class</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="584" y="174">is_generic</text>
  <rect class="bt" x="28" y="290" width="200" height="70" rx="10" stroke-width="1.5"/>
  <text class="lbl" x="40" y="311">dim_pharmacy</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="40" y="334">pharmacy_key PK</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="40" y="354">chain, state</text>
  <rect class="bt" x="572" y="290" width="200" height="90" rx="10" stroke-width="1.5"/>
  <text class="lbl" x="584" y="311">dim_date</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="584" y="334">date_key PK</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="584" y="354">day, month,</text>
  <text class="sm" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px" x="584" y="374">quarter, year</text>
  <line class="lnp" x1="298" y1="200" x2="230" y2="140" marker-end="url(#arp)"/>
  <line class="lnp" x1="502" y1="200" x2="570" y2="140" marker-end="url(#arp)"/>
  <line class="lnp" x1="298" y1="270" x2="230" y2="320" marker-end="url(#arp)"/>
  <line class="lnp" x1="502" y1="270" x2="570" y2="320" marker-end="url(#arp)"/>
  <text class="sm prit" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px" x="28" y="400">SELECT d.drug_class, t.quarter, sum(f.amount_paid) … GROUP BY 1, 2</text>
  <text class="sub" x="28" y="420">OLTP stays normalised; the warehouse is fed by CDC or batch loads and can afford the duplication.</text>
</svg>
