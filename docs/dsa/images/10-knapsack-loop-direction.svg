<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">0/1 versus unbounded knapsack: the capacity loop direction</title>
  <desc id="d">Item 1 has weight 1 and value 15, and the dp array for capacities 0 to 4 starts at zero. On the left the capacity loop runs downwards, 4 to 1: each dp[c] reads dp[c - 1] before it has been updated, so every cell becomes 15 and item 1 is used at most once. On the right the loop runs upwards, 1 to 4: dp[c - 1] already includes item 1, so the cells become 15, 30, 45, 60, using it repeatedly. After all three items the downward loop returns 35 and the upward loop returns 60.</desc>
  <style>.card{fill:#f8fafc;stroke:#e2e8f0}
.h{fill:#0f172a;font-size:19px;font-weight:700}
.t{fill:#334155;font-size:14px}
.tb{fill:#334155;font-size:14px;font-weight:700}
.lb{fill:#334155;font-size:15px;font-weight:600}
.m{fill:#64748b;font-size:13px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.box{fill:#ffffff;stroke:#cbd5e1}
.pri{fill:#4f46e5}.spri{stroke:#4f46e5}.tpri{fill:#4f46e5}
.tea{fill:#0ea5a4}.stea{stroke:#0ea5a4}.ttea{fill:#0f766e}
.ok{fill:#16a34a}.sok{stroke:#16a34a}.tok{fill:#16a34a}
.bad{fill:#dc2626}.sbad{stroke:#dc2626}.tbad{fill:#dc2626}
.warn{fill:#d97706}.swarn{stroke:#d97706}.twarn{fill:#d97706}
.smut{stroke:#94a3b8}.mut{fill:#94a3b8}
.tint{fill:#4f46e5;fill-opacity:.14}.ttint{fill:#0ea5a4;fill-opacity:.16}
.gtint{fill:#16a34a;fill-opacity:.16}.rtint{fill:#dc2626;fill-opacity:.14}.atint{fill:#d97706;fill-opacity:.16}
.on{fill:#ffffff;font-size:14px;font-weight:700}
.ln{fill:none;stroke-width:2}
.ah{stroke:none}
@media (prefers-color-scheme: dark){
.card{fill:#1f2430;stroke:#334155}
.h{fill:#f1f5f9}.t,.tb,.lb{fill:#e2e8f0}.m{fill:#94a3b8}
.box{fill:#111827;stroke:#475569}
.pri,.tint{fill:#818cf8}.spri{stroke:#818cf8}.tpri{fill:#818cf8}
.tea,.ttint{fill:#2dd4bf}.stea{stroke:#2dd4bf}.ttea{fill:#5eead4}
.ok,.gtint{fill:#4ade80}.sok{stroke:#4ade80}.tok{fill:#4ade80}
.bad,.rtint{fill:#f87171}.sbad{stroke:#f87171}.tbad{fill:#f87171}
.warn,.atint{fill:#fbbf24}.swarn{stroke:#fbbf24}.twarn{fill:#fbbf24}
.smut{stroke:#64748b}.mut{fill:#64748b}
.on{fill:#0f172a}
}
.fr{opacity:0;animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes k0{0%,15.40%{opacity:1}16.00%,100%{opacity:0}}.f0{animation-name:k0}
@keyframes k1{0%,16.00%{opacity:0}16.60%,31.40%{opacity:1}32.00%,100%{opacity:0}}.f1{animation-name:k1}
@keyframes k2{0%,32.00%{opacity:0}32.60%,47.40%{opacity:1}48.00%,100%{opacity:0}}.f2{animation-name:k2}
@keyframes k3{0%,48.00%{opacity:0}48.60%,63.40%{opacity:1}64.00%,100%{opacity:0}}.f3{animation-name:k3}
@keyframes k4{0%,64.00%{opacity:0}64.60%,99.40%{opacity:1}100%{opacity:0}}.f4{animation-name:k4}
@media (prefers-reduced-motion: reduce){.fr{animation:none!important;opacity:0}.f4{opacity:1}}</style>
  <rect class="card" x="1" y="1" width="798" height="358" rx="14"/>
  <text class="h" x="28" y="40">Knapsack: the capacity loop direction decides reuse</text>
  <text class="m" x="28" y="62">dp[c] = max(dp[c], dp[c − w] + v) for item 1 (weight 1, value 15), starting from an empty dp array.</text>
  <text class="tok" x="40" y="104" font-weight="700" font-size="15">0/1 knapsack: c = 4 down to 1</text>
  <text class="m" x="68" y="132" text-anchor="middle">c=0</text>
  <text class="m" x="130" y="132" text-anchor="middle">c=1</text>
  <text class="m" x="192" y="132" text-anchor="middle">c=2</text>
  <text class="m" x="254" y="132" text-anchor="middle">c=3</text>
  <text class="m" x="316" y="132" text-anchor="middle">c=4</text>
  <text class="twarn" x="420" y="104" font-weight="700" font-size="15">Unbounded: c = 1 up to 4</text>
  <text class="m" x="448" y="132" text-anchor="middle">c=0</text>
  <text class="m" x="510" y="132" text-anchor="middle">c=1</text>
  <text class="m" x="572" y="132" text-anchor="middle">c=2</text>
  <text class="m" x="634" y="132" text-anchor="middle">c=3</text>
  <text class="m" x="696" y="132" text-anchor="middle">c=4</text>
  <g class="fr f0"><rect class="box" x="40" y="142" width="56" height="46" rx="8"/><text class="lb" x="68" y="171" text-anchor="middle">0</text><rect class="box" x="102" y="142" width="56" height="46" rx="8"/><text class="lb" x="130" y="171" text-anchor="middle">0</text><rect class="box" x="164" y="142" width="56" height="46" rx="8"/><text class="lb" x="192" y="171" text-anchor="middle">0</text><rect class="tint" x="226" y="142" width="56" height="46" rx="8"/><text class="lb" x="254" y="171" text-anchor="middle">0</text><rect class="ok" x="288" y="142" width="56" height="46" rx="8"/><text class="on" x="316" y="171" text-anchor="middle">15</text><path class="ln sok" stroke-width="2" fill="none" d="M254,196 Q285.0,226 312,198"/><text class="t" x="40" y="254">dp[4] = max(0, dp[3] + 15)</text><text class="tb" x="40" y="276">= max(0, 0 + 15) = 15</text><text class="m" x="40" y="298">dp[3] = 0 (still the value before item 1)</text><rect class="tint" x="420" y="142" width="56" height="46" rx="8"/><text class="lb" x="448" y="171" text-anchor="middle">0</text><rect class="warn" x="482" y="142" width="56" height="46" rx="8"/><text class="on" x="510" y="171" text-anchor="middle">15</text><rect class="box" x="544" y="142" width="56" height="46" rx="8"/><text class="lb" x="572" y="171" text-anchor="middle">0</text><rect class="box" x="606" y="142" width="56" height="46" rx="8"/><text class="lb" x="634" y="171" text-anchor="middle">0</text><rect class="box" x="668" y="142" width="56" height="46" rx="8"/><text class="lb" x="696" y="171" text-anchor="middle">0</text><path class="ln swarn" stroke-width="2" fill="none" d="M448,196 Q479.0,226 506,198"/><text class="t" x="420" y="254">dp[1] = max(0, dp[0] + 15)</text><text class="tb" x="420" y="276">= max(0, 0 + 15) = 15</text><text class="m" x="420" y="298">dp[0] = 0 (capacity 0 holds nothing)</text></g>
  <g class="fr f1"><rect class="box" x="40" y="142" width="56" height="46" rx="8"/><text class="lb" x="68" y="171" text-anchor="middle">0</text><rect class="box" x="102" y="142" width="56" height="46" rx="8"/><text class="lb" x="130" y="171" text-anchor="middle">0</text><rect class="tint" x="164" y="142" width="56" height="46" rx="8"/><text class="lb" x="192" y="171" text-anchor="middle">0</text><rect class="ok" x="226" y="142" width="56" height="46" rx="8"/><text class="on" x="254" y="171" text-anchor="middle">15</text><rect class="box" x="288" y="142" width="56" height="46" rx="8"/><text class="lb" x="316" y="171" text-anchor="middle">15</text><path class="ln sok" stroke-width="2" fill="none" d="M192,196 Q223.0,226 250,198"/><text class="t" x="40" y="254">dp[3] = max(0, dp[2] + 15)</text><text class="tb" x="40" y="276">= max(0, 0 + 15) = 15</text><text class="m" x="40" y="298">dp[2] = 0 (still the value before item 1)</text><rect class="box" x="420" y="142" width="56" height="46" rx="8"/><text class="lb" x="448" y="171" text-anchor="middle">0</text><rect class="tint" x="482" y="142" width="56" height="46" rx="8"/><text class="lb" x="510" y="171" text-anchor="middle">15</text><rect class="warn" x="544" y="142" width="56" height="46" rx="8"/><text class="on" x="572" y="171" text-anchor="middle">30</text><rect class="box" x="606" y="142" width="56" height="46" rx="8"/><text class="lb" x="634" y="171" text-anchor="middle">0</text><rect class="box" x="668" y="142" width="56" height="46" rx="8"/><text class="lb" x="696" y="171" text-anchor="middle">0</text><path class="ln swarn" stroke-width="2" fill="none" d="M510,196 Q541.0,226 568,198"/><text class="t" x="420" y="254">dp[2] = max(0, dp[1] + 15)</text><text class="tb" x="420" y="276">= max(0, 15 + 15) = 30</text><text class="m" x="420" y="298">dp[1] = 15 (already includes item 1)</text></g>
  <g class="fr f2"><rect class="box" x="40" y="142" width="56" height="46" rx="8"/><text class="lb" x="68" y="171" text-anchor="middle">0</text><rect class="tint" x="102" y="142" width="56" height="46" rx="8"/><text class="lb" x="130" y="171" text-anchor="middle">0</text><rect class="ok" x="164" y="142" width="56" height="46" rx="8"/><text class="on" x="192" y="171" text-anchor="middle">15</text><rect class="box" x="226" y="142" width="56" height="46" rx="8"/><text class="lb" x="254" y="171" text-anchor="middle">15</text><rect class="box" x="288" y="142" width="56" height="46" rx="8"/><text class="lb" x="316" y="171" text-anchor="middle">15</text><path class="ln sok" stroke-width="2" fill="none" d="M130,196 Q161.0,226 188,198"/><text class="t" x="40" y="254">dp[2] = max(0, dp[1] + 15)</text><text class="tb" x="40" y="276">= max(0, 0 + 15) = 15</text><text class="m" x="40" y="298">dp[1] = 0 (still the value before item 1)</text><rect class="box" x="420" y="142" width="56" height="46" rx="8"/><text class="lb" x="448" y="171" text-anchor="middle">0</text><rect class="box" x="482" y="142" width="56" height="46" rx="8"/><text class="lb" x="510" y="171" text-anchor="middle">15</text><rect class="tint" x="544" y="142" width="56" height="46" rx="8"/><text class="lb" x="572" y="171" text-anchor="middle">30</text><rect class="warn" x="606" y="142" width="56" height="46" rx="8"/><text class="on" x="634" y="171" text-anchor="middle">45</text><rect class="box" x="668" y="142" width="56" height="46" rx="8"/><text class="lb" x="696" y="171" text-anchor="middle">0</text><path class="ln swarn" stroke-width="2" fill="none" d="M572,196 Q603.0,226 630,198"/><text class="t" x="420" y="254">dp[3] = max(0, dp[2] + 15)</text><text class="tb" x="420" y="276">= max(0, 30 + 15) = 45</text><text class="m" x="420" y="298">dp[2] = 30 (already includes item 1)</text></g>
  <g class="fr f3"><rect class="tint" x="40" y="142" width="56" height="46" rx="8"/><text class="lb" x="68" y="171" text-anchor="middle">0</text><rect class="ok" x="102" y="142" width="56" height="46" rx="8"/><text class="on" x="130" y="171" text-anchor="middle">15</text><rect class="box" x="164" y="142" width="56" height="46" rx="8"/><text class="lb" x="192" y="171" text-anchor="middle">15</text><rect class="box" x="226" y="142" width="56" height="46" rx="8"/><text class="lb" x="254" y="171" text-anchor="middle">15</text><rect class="box" x="288" y="142" width="56" height="46" rx="8"/><text class="lb" x="316" y="171" text-anchor="middle">15</text><path class="ln sok" stroke-width="2" fill="none" d="M68,196 Q99.0,226 126,198"/><text class="t" x="40" y="254">dp[1] = max(0, dp[0] + 15)</text><text class="tb" x="40" y="276">= max(0, 0 + 15) = 15</text><text class="m" x="40" y="298">dp[0] = 0 (capacity 0 holds nothing)</text><rect class="box" x="420" y="142" width="56" height="46" rx="8"/><text class="lb" x="448" y="171" text-anchor="middle">0</text><rect class="box" x="482" y="142" width="56" height="46" rx="8"/><text class="lb" x="510" y="171" text-anchor="middle">15</text><rect class="box" x="544" y="142" width="56" height="46" rx="8"/><text class="lb" x="572" y="171" text-anchor="middle">30</text><rect class="tint" x="606" y="142" width="56" height="46" rx="8"/><text class="lb" x="634" y="171" text-anchor="middle">45</text><rect class="warn" x="668" y="142" width="56" height="46" rx="8"/><text class="on" x="696" y="171" text-anchor="middle">60</text><path class="ln swarn" stroke-width="2" fill="none" d="M634,196 Q665.0,226 692,198"/><text class="t" x="420" y="254">dp[4] = max(0, dp[3] + 15)</text><text class="tb" x="420" y="276">= max(0, 45 + 15) = 60</text><text class="m" x="420" y="298">dp[3] = 45 (already includes item 1)</text></g>
  <g class="fr f4"><rect class="box" x="40" y="142" width="56" height="46" rx="8"/><text class="lb" x="68" y="171" text-anchor="middle">0</text><rect class="box" x="102" y="142" width="56" height="46" rx="8"/><text class="lb" x="130" y="171" text-anchor="middle">15</text><rect class="box" x="164" y="142" width="56" height="46" rx="8"/><text class="lb" x="192" y="171" text-anchor="middle">15</text><rect class="box" x="226" y="142" width="56" height="46" rx="8"/><text class="lb" x="254" y="171" text-anchor="middle">15</text><rect class="box" x="288" y="142" width="56" height="46" rx="8"/><text class="lb" x="316" y="171" text-anchor="middle">15</text><text class="tok" x="40" y="254" font-weight="700" font-size="14">Item 1 used at most once.</text><text class="tb" x="40" y="276">After all three items: dp[4] = 35</text><text class="m" x="40" y="298">(items 1 + 3: 15 + 20)</text><rect class="box" x="420" y="142" width="56" height="46" rx="8"/><text class="lb" x="448" y="171" text-anchor="middle">0</text><rect class="box" x="482" y="142" width="56" height="46" rx="8"/><text class="lb" x="510" y="171" text-anchor="middle">15</text><rect class="box" x="544" y="142" width="56" height="46" rx="8"/><text class="lb" x="572" y="171" text-anchor="middle">30</text><rect class="box" x="606" y="142" width="56" height="46" rx="8"/><text class="lb" x="634" y="171" text-anchor="middle">45</text><rect class="box" x="668" y="142" width="56" height="46" rx="8"/><text class="lb" x="696" y="171" text-anchor="middle">60</text><text class="twarn" x="420" y="254" font-weight="700" font-size="14">Item 1 used up to four times.</text><text class="tb" x="420" y="276">After all three items: dp[4] = 60</text><text class="m" x="420" y="298">(item 1 four times: 4 × 15)</text></g>
  <text class="m" x="28" y="342">The lighter cell is dp[c − w], the value being read. Items: (1, 15), (3, 20), (4, 30); measured 35 vs 60.</text>
</svg>
