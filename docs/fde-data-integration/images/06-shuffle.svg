<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Spark shuffle</title>
  <desc id="d">Animation: three executors each hold a mix of rows with keys A, B and C on the map side. During groupBy on member_id, every executor sends rows to every other across disk and network, shown as crossing arrows. Afterwards executor 1 holds only A rows, executor 2 only B and executor 3 only C. To shuffle less, filter and project first, broadcast the small side of a join, and let adaptive query execution coalesce partitions or split a skewed key.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes before{0%,44.99%{opacity:1}45%,100%{opacity:0}}.before{animation-name:before}
    @keyframes after{0%,44.99%{opacity:0}45%,100%{opacity:1}}.after{animation-name:after}
    @keyframes arrows{0%,24.99%{opacity:0}25%,59.99%{opacity:1}60%,100%{opacity:0}}.arrows{animation-name:arrows}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.after,.arrows{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="390" rx="14"/>
  <text class="h" x="28" y="40">groupBy(member_id): the shuffle</text><text class="sub" x="28" y="62">Narrow steps stay inside an executor; wide steps send rows across the network by key.</text><rect class="bm" x="28" y="96" width="250" height="64" rx="8"/><text class="sub" x="40" y="114">executor 1 · map side</text><g class="k before"><rect class="pri" x="40" y="122" width="48" height="28" rx="5"/><text class="on13" x="64" y="141" text-anchor="middle">A</text><rect class="tea" x="96" y="122" width="48" height="28" rx="5"/><text class="on13" x="120" y="141" text-anchor="middle">B</text><rect class="wrnf" x="152" y="122" width="48" height="28" rx="5"/><text class="on13" x="176" y="141" text-anchor="middle">C</text><rect class="pri" x="208" y="122" width="48" height="28" rx="5"/><text class="on13" x="232" y="141" text-anchor="middle">A</text></g><g class="k after"><rect class="pri" x="40" y="122" width="48" height="28" rx="5"/><text class="on13" x="64" y="141" text-anchor="middle">A</text><rect class="tea" x="96" y="122" width="48" height="28" rx="5"/><text class="on13" x="120" y="141" text-anchor="middle">B</text><rect class="wrnf" x="152" y="122" width="48" height="28" rx="5"/><text class="on13" x="176" y="141" text-anchor="middle">C</text><rect class="pri" x="208" y="122" width="48" height="28" rx="5"/><text class="on13" x="232" y="141" text-anchor="middle">A</text></g><rect class="bm" x="522" y="96" width="250" height="64" rx="8"/><text class="sub" x="534" y="114">executor 1 · reduce side</text><g class="k after"><rect class="pri" x="534" y="122" width="48" height="28" rx="5"/><text class="on13" x="558" y="141" text-anchor="middle">A</text><rect class="pri" x="590" y="122" width="48" height="28" rx="5"/><text class="on13" x="614" y="141" text-anchor="middle">A</text><rect class="pri" x="646" y="122" width="48" height="28" rx="5"/><text class="on13" x="670" y="141" text-anchor="middle">A</text><rect class="pri" x="702" y="122" width="48" height="28" rx="5"/><text class="on13" x="726" y="141" text-anchor="middle">A</text></g><rect class="bm" x="28" y="176" width="250" height="64" rx="8"/><text class="sub" x="40" y="194">executor 2 · map side</text><g class="k before"><rect class="tea" x="40" y="202" width="48" height="28" rx="5"/><text class="on13" x="64" y="221" text-anchor="middle">B</text><rect class="wrnf" x="96" y="202" width="48" height="28" rx="5"/><text class="on13" x="120" y="221" text-anchor="middle">C</text><rect class="pri" x="152" y="202" width="48" height="28" rx="5"/><text class="on13" x="176" y="221" text-anchor="middle">A</text><rect class="tea" x="208" y="202" width="48" height="28" rx="5"/><text class="on13" x="232" y="221" text-anchor="middle">B</text></g><g class="k after"><rect class="tea" x="40" y="202" width="48" height="28" rx="5"/><text class="on13" x="64" y="221" text-anchor="middle">B</text><rect class="wrnf" x="96" y="202" width="48" height="28" rx="5"/><text class="on13" x="120" y="221" text-anchor="middle">C</text><rect class="pri" x="152" y="202" width="48" height="28" rx="5"/><text class="on13" x="176" y="221" text-anchor="middle">A</text><rect class="tea" x="208" y="202" width="48" height="28" rx="5"/><text class="on13" x="232" y="221" text-anchor="middle">B</text></g><rect class="bm" x="522" y="176" width="250" height="64" rx="8"/><text class="sub" x="534" y="194">executor 2 · reduce side</text><g class="k after"><rect class="tea" x="534" y="202" width="48" height="28" rx="5"/><text class="on13" x="558" y="221" text-anchor="middle">B</text><rect class="tea" x="590" y="202" width="48" height="28" rx="5"/><text class="on13" x="614" y="221" text-anchor="middle">B</text><rect class="tea" x="646" y="202" width="48" height="28" rx="5"/><text class="on13" x="670" y="221" text-anchor="middle">B</text><rect class="tea" x="702" y="202" width="48" height="28" rx="5"/><text class="on13" x="726" y="221" text-anchor="middle">B</text></g><rect class="bm" x="28" y="256" width="250" height="64" rx="8"/><text 