  <text class="h" x="28" y="40">OWASP Top 10: from 2021 to 2025</text><text class="sub" x="28" y="62">Lines join each 2021 category to where it sits in 2025.</text><text class="lbl" x="40" y="92">2021</text><text class="lbl" x="486" y="92">2025</text><rect class="box" x="28" y="99" width="288" height="26" rx="6" stroke-width="1"/><text class="sm" x="38" y="117">A01 Broken Access Control</text><rect class="box" x="476" y="99" width="296" height="26" rx="6" stroke-width="1"/><text class="sm" x="486" y="117">A01 Broken Access Control</text><rect class="box" x="28" y="131" width="288" height="26" rx="6" stroke-width="1"/><text class="sm" x="38" y="149">A02 Cryptographic Failures</text><rect class="box" x="476" y="131" width="296" height="26" rx="6" stroke-width="1"/><text class="sm" x="486" y="149">A02 Security Misconfiguration</text><rect class="box" x="28" y="163" width="288" height="26" rx="6" stroke-width="1"/><text class="sm" x="38" y="181">A03 Injection</text><rect class="bt" x="476" y="163" width="296" height="26" rx="6" stroke-width="1"/><text class="sm" x="486" y="181">A03 Software Supply Chain</text><rect class="box" x="28" y="195" width="288" height="26" rx="6" stroke-width="1"/><text class="sm" x="38" y="213">A04 Insecure Design</text><rect class="box" x="476" y="195" width="296" height="26" rx="6" stroke-width="1"/><text class="sm" x="486" y="213">A04 Cryptographic Failures</text><rect class="box" x="28" y="227" width="288" height="26" rx="6" stroke-width="1"/><text class="sm" x="38" y="245">A05 Security Misconfiguration</text><rect class="box" x="476" y="227" width="296" height="26" rx="6" stroke-width="1"/><text class="sm" x="486" y="245">A05 Injection</text><rect class="box" x="28" y="259" width="288" height="26" rx="6" stroke-width="1"/><text class="sm" x="38" y="277">A06 Vulnerable &amp; Outdated Comp.</text><rect class="box" x="476" y="259" width="296" height="26" rx="6" stroke-width="1"/><text class="sm" x="486" y="277">A06 Insecure Design</text><rect class="box" x="28" y="291" width="288" height="26" rx="6" stroke-width="1"/><text class="sm" x="38" y="309">A07 Identification &amp; Auth Failures</text><rect class="box" x="476" y="291" width="296" height="26" rx="6" stroke-width="1"/><text class="sm" x="486" y="309">A07 Authentication Failures</text><rect class="box" x="28" y="323" width="288" height="26" rx="6" stroke-width="1"/><text class="sm" x="38" y="341">A08 Software &amp; Data Integrity</text><rect class="box" x="476" y="323" width="296" height="26" rx="6" stroke-width="1"/><text class="sm" x="486" y="341">A08 Software &amp; Data Integrity</text><rect class="box" x="28" y="355" width="288" height="26" rx="6" stroke-width="1"/><text class="sm" x="38" y="373">A09 Logging &amp; Monitoring</text><rect class="box" x="476" y="355" width="296" height="26" rx="6" stroke-width="1"/><text class="sm" x="486" y="373">A09 Logging &amp; Alerting</text><rect class="box" x="28" y="387" width="288" height="26" rx="6" stroke-width="1"/><text class="sm" x="38" y="405">A10 SSRF</text><rect class="bt" x="476" y="387" width="296" height="26" rx="6" stroke-width="1"/><text class="sm" x="486" y="405">A10 Exceptional Conditions</text><rect class="tea" x="722" y="167" width="42" height="18" rx="9"/><text class="on13" x="743" y="180" text-anchor="middle" style="font-size:11px">new</text><rect class="tea" x="722" y="391" width="42" height="18" rx="9"/><text class="on13" x="743" y="404" text-anchor="middle" style="font-size:11px">new</text><path class="ln" d="M 318 112 C 396 112 396 112 470 112"/><path class="lnw" d="M 318 144 C 396 144 396 208 470 208" marker-end="url(#arw)"/><path class="lnw" d="M 318 176 C 396 176 396 240 470 240" marker-end="url(#arw)"/><path class="lnw" d="M 318 208 C 396 208 396 272 470 272" marker-end="url(#arw)"/><path class="lno" d="M 318 240 C 396 240 396 144 470 144" marker-end="url(#aro)"/><path class="lno dash" d="M 318 272 C 396 272 396 176 470 176" marker-end="url(#aro)"/><path class="ln" d="M 318 304