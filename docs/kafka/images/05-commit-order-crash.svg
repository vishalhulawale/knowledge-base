<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">A crash mid-batch: commit before vs commit after processing</title>
  <desc id="d">A consumer polls records 100 to 109. On the left it commits offset 110 before processing, then crashes after processing 100 to 104. On restart it resumes from the committed offset 110, so records 105 to 109 are never processed: at-most-once, data lost. On the right it processes all ten records first and crashes before committing. On restart it resumes from the last commit, 100, and processes all ten again: at-least-once, duplicates that an idempotent consumer must absorb.</desc>
