"258" width="52" height="30" rx="6" stroke-width="1.2"/><text class="h2" x="420" y="84">Forward Deployed Engineer</text><text class="sub" x="420" y="104">Owns what one customer needs, in production</text><text class="sub" x="566" y="134" text-anchor="middle">Cust A</text><text class="sub" x="624" y="134" text-anchor="middle">Cust B</text><text class="sub" x="682" y="134" text-anchor="middle">Cust C</text><text class="sub" x="740" y="134" text-anchor="middle">Cust D</text><text class="sm" x="420" y="164">Data pipeline</text><rect class="box" x="540" y="144" width="52" height="30" rx="6" stroke-width="1.2"/><rect class="tea" x="598" y="144" width="52" height="30" rx="6" stroke-width="1.2"/><rect class="box" x="656" y="144" width="52" height="30" rx="6" stroke-width="1.2"/><rect class="box" x="714" y="144" width="52" height="30" rx="6" stroke-width="1.2"/><text class="sm" x="420" y="202">Workflow app</text><rect class="box" x="540" y="182" width="52" height="30" rx="6" stroke-width="1.2"/><rect class="tea" x="598" y="182" width="52" height="30" rx="6" stroke-width="1.2"/><rect class="box" x="656" y="182" width="52" height="30" rx="6" stroke-width="1.2"/><rect class="box" x="714" y="182" width="52" height="30" rx="6" stroke-width="1.2"/><text class="sm" x="420" y="240">Identity / SSO</text><rect class="box" x="540" y="220" width="52" height="30" rx="6" stroke-width="1.2"/><rect class="tea" x="598" y="220" width="52" height="30" rx="6" stroke-width="1.2"/><rect class="box" x="656" y="220" width="52" height="30" rx="6" stroke-width="1.2"/><rect class="box" x="714" y="220" width="52" height="30" rx="6" stroke-width="1.2"/><text class="sm" x="420" y="278">Model + evals</text><rect class="box" x="540" y="258" width="52" height="30" rx="6" stroke-width="1.2"/><rect class="tea" x="598" y="258" width="52" height="30" rx="6" stroke-width="1.2"/><rect class="box" x="656" y="258" width="52" height="30" rx="6" stroke-width="1.2"/><rect class="box" x="714" y="258" width="52" height=