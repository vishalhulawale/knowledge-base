    @keyframes lb1{0%,12.99%{opacity:0}13%,100%{opacity:1}}.lb1{animation-name:lb1}
    @keyframes lb2{0%,19.99%{opacity:0}20%,100%{opacity:1}}.lb2{animation-name:lb2}
