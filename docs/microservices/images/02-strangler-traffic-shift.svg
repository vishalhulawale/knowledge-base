<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Strangler fig: moving one path</title>
  <desc id="d">A gateway sits in front of a legacy monolith. Everything except the member profile path keeps going to the monolith. The profile path is split by weight: 10% to the new member-profile-service, then 50%, then 100%. In the last step the legacy profile code inside the monolith is deleted.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ring{fill:#ffffff;stroke:#d97706;stroke-width:2.5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
      .ring{fill:#111827;stroke:#fbbf24}
    }

    .ph{animation:12s infinite steps(1,end)}
    @keyframes p0{0%,24%{opacity:1}25%,100%{opacity:0}}
@keyframes p1{0%,24%{opacity:0}25%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes p2{0%,49%{opacity:0}50%,74%{opacity:1}75%,100%{opacity:0}}
@keyframes p3{0%,74%{opacity:0}75%,97%{opacity:1}100%{opacity:0}}

    .p0{animation-name:p0}.p1{animation-name:p1;opacity:0}.p2{animation-name:p2;opacity:0}.p3{animation-name:p3;opacity:0}
    @media (prefers-reduced-motion: reduce){.ph{animation:none}.p0,.p1,.p2{opacity:0}.p3{opacity:1}}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="382" rx="14"/>
  <text class="h" x="28" y="40">Strangler fig: moving one path</text>
  <rect class="box" x="28" y="155" width="100" height="50" rx="10" stroke-width="1.5"/><text class="lbl" x="78" y="185" text-anchor="middle">Clients</text>
  <line class="ln" x1="128" y1="180" x2="176" y2="180" marker-end="url(#ar)"/>
  <rect class="bp" x="180" y="135" width="150" height="90" rx="10" stroke-width="1.5"/><text class="lbl" x="255" y="175" text-anchor="middle">Gateway</text><text class="sub" x="255" y="195" text-anchor="middle">(routing layer)</text>
  <rect class="box" x="510" y="84" width="262" height="166" rx="10" stroke-width="1.5"/><text class="lbl" x="528" y="110">Legacy monolith</text>
  <rect class="bp" x="668" y="170" width="88" height="46" rx="10" stroke-width="1.5"/><text class="sub" x="712" y="189" text-anchor="middle">Other</text><text class="sub" x="712" y="205" text-anchor="middle">modules</text>
  <line class="lnp" x1="330" y1="150" x2="506" y2="150" stroke-width="5" marker-end="url(#arp)"/>
  <text class="sub" x="345" y="142">/** everything else 100%</text>
  <rect class="bt" x="510" y="262" width="262" height="54" rx="10" stroke-width="1.5"/><text class="lbl" x="641" y="294" text-anchor="middle">member-profile-service</text>
  <g class="ph p0">
    <text class="lbl teat" x="28" y="68">Step 1: new service takes 10% of one path</text>
    <line class="lnp" x1="330" y1="193" x2="506" y2="193" stroke-width="6" marker-end="url(#arp)"/><text class="sub" x="345" y="185">/profile 90%</text>
    <path class="lnt" d="M330,218 C400,218 420,286 506,286" stroke-width="1.5" marker-end="url(#art)"/><text class="sub" x="410" y="316">/profile 10%</text>
    <rect class="bp" x="528" y="170" width="128" height="46" rx="10" stroke-width="1.5"/>
    <text class="tx" x="592" y="198" text-anchor="middle">Member profile</text>
  </g>
  <g class="ph p1">
    <text class="lbl teat" x="28" y="68">Step 2: metrics look good, shift to 50%</text>
    <line class="lnp" x1="330" y1="193" x2="506" y2="193" stroke-width="3.33333" marker-end="url(#arp)"/><text class="sub" x="345" y="185">/profile 50%</text>
    <path class="lnt" d="M330,218 C400,218 420,286 506,286" stroke-width="3.33333" marker-end="url(#art)"/><text class="sub" x="410" y="316">/profile 50%</text>
    <rect class="bp" x="528" y="170" width="128" height="46" rx="10" stroke-width="1.5"/>
    <text class="tx" x="592" y="198" text-anchor="middle">Member profile</text>
  </g>
  <g class="ph p2">
    <text class="lbl teat" x="28" y="68">Step 3: all of that path goes to the new service</text>
    <path class="lnt" d="M330,218 C400,218 420,286 506,286" stroke-width="6.66667" marker-end="url(#art)"/><text class="sub" x="410" y="316">/profile 100%</text>
    <rect class="bp" x="528" y="170" width="128" height="46" rx="10" stroke-width="1.5"/>
    <text class="tx" x="592" y="198" text-anchor="middle">Member profile</text>
  </g>
  <g class="ph p3">
    <text class="lbl teat" x="28" y="68">Step 4: delete the legacy code for that path</text>
    <path class="lnt" d="M330,218 C400,218 420,286 506,286" stroke-width="6.66667" marker-end="url(#art)"/><text class="sub" x="410" y="316">/profile 100%</text>
    <rect class="bb" x="528" y="170" width="128" height="46" rx="8" stroke-width="1.5"/>
    <line class="lnb" x1="536" y1="193" x2="648" y2="193"/>
    <text class="sub badt" x="592" y="240" text-anchor="middle">legacy code deleted</text>
    <text class="tx" x="592" y="198" text-anchor="middle">Member profile</text>
  </g>
  <text class="sub" x="28" y="346">Weights after the first 10% step are illustrative. Until the old code is deleted,</text>
  <text class="sub" x="28" y="364">each step can be reversed by changing the route.</text>
</svg>
