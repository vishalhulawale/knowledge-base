<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">BAA chain for PHI</title>
  <desc id="d">Two panels. Hosted product: the payer or provider, the covered entity, signs a BAA with your hosted product, the business associate, which signs a BAA with its cloud or model provider, a subcontractor business associate, covering eligible APIs only. A new fallback model or embeddings API without a BAA breaks the chain. Customer-VPC deployment: your software runs inside the payer's cloud account next to Bedrock or Azure OpenAI, and inference sits under the payer's own BAA with its cloud provider. BAA terms include purpose-limited use, Security Rule safeguards, breach reporting within 60 days, flow-down to subcontractors, and return or destruction of PHI; there is no HIPAA certification.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="402" rx="14"/>
  <text class="h" x="28" y="40">Every link that touches PHI needs a BAA</text><text class="sub" x="28" y="62">Agreements flow down the chain, and cover only the services and endpoints they name.</text><text class="lbl" x="28" y="98">Hosted product</text><rect class="bp" x="40" y="112" width="196" height="50" rx="8" stroke-width="1.5"/><text class="sm" x="54" y="133" font-weight="700">Payer or provider</text><text class="sub" x="54" y="152">covered entity</text><rect class="bp" x="40" y="196" width="196" height="50" rx="8" stroke-width="1.5"/><text class="sm" x="54" y="217" font-weight="700">Your hosted product</text><text class="sub" x="54" y="236">business associate</text><rect class="bp" x="40" y="280" width="196" height="50" rx="8" stroke-width="1.5"/><text class="sm" x="54" y="301" font-weight="700">Cloud / model provider</text><text class="sub" x="54" y="320">subcontractor BA</text><line class="lno" x1="138" y1="164" x2="138" y2="192" marker-end="url(#aro)"/><text class="okt" x="148" y="183" style="font-size:13px">BAA</text><line class="lno" x1="138" y1="248" x2="138" y2="276" marker-end="url(#aro)"/><text class="okt" x="148" y="267" style="font-size:13px">BAA, eligible APIs only</text><line class="lnb dash" x1="238" y1="221" x2="254" y2="221" marker-end="url(#arb)"/><rect class="bb" x="258" y="190" width="132" height="62" rx="8" stroke-width="1.5"/><text class="sm" x="268" y="208">New fallback or</text><text class="sm" x="268" y="225">embeddings API</text><text class="badt" x="268" y="243" style="font-size:12.5px">no BAA: broken</text><line class="grid" x1="404" y1="90" x2="404" y2="336"/><text class="lbl" x="424" y="98">Customer-VPC deployment</text><rect class="bp" x="424" y="112" width="348" height="50" rx="8" stroke-width="1.5"/><text class="sm" x="438" y="133" font-weight="700">Payer or provider</text><text class="sub" x="438" y="152">covered entity, owns the cloud account</text><rect class="bm" x="424" y="196" width="348" height="136" rx="10" stroke-dasharray="6 4"/><text class="sub" x="438" y="216">Payer's cloud account</text><rect class="box" x="438" y="230" width="150" height="54" rx="8" stroke-width="1.5"/><text class="sm" x="450" y="252">Your software</text><text class="sm" x="450" y="270">runs here</text><rect class="bt" x="608" y="230" width="152" height="54" rx="8" stroke-width="1.5"/><text class="sm" x="620" y="252">Bedrock / Azure</text><text class="sm" x="620" y="270">OpenAI inference</text><line class="ln" x1="590" y1="257" x2="604" y2="257" marker-end="url(#ar)"/><line class="lno" x1="684" y1="164" x2="684" y2="226" marker-end="url(#aro)"/><text class="okt" x="676" y="184" text-anchor="end" style="font-size:13px">payer's own BAA with its cloud</text><text class="sm" x="438" y="312">Inference sits under the payer's own cloud BAA.</text><text class="sm" x="28" y="366">BAA terms: use limited to the contracted purpose, Security Rule safeguards, breach report within 60 days,</text><text class="sm" x="28" y="385">flow-down to subcontractors, return or destroy PHI. There is no HIPAA certification to claim.</text>
</svg>
