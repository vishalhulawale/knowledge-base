  <rect class="card" x="1" y="1" width="798" height="448" rx="14"/>
  <text class="h" x="28" y="40">kubectl apply -f web.yaml (replicas: 3)</text>
  <text class="sub" x="28" y="62">Each actor watches the API server and reacts. kubectl returns after step 1.</text>
  <g class="a s0">
  <rect class="pri" x="28" y="96" width="190" height="36" rx="8"/>
  <text class="on13" x="123" y="118.5" text-anchor="middle">kubectl → API server</text>
  </g>
  <text class="sm a s0" x="230" y="119">authn · RBAC · admission · etcd write</text>
  <g class="a s1">
  <rect class="tea" x="28" y="146" width="190" height="36" rx="8"/>
  <text class="on13" x="123" y="168.5" text-anchor="middle">Deployment controller</text>
  </g>
  <text class="sm a s1" x="230" y="169">creates ReplicaSet web-796cf</text>
  <g class="a s2">
  <rect class="tea" x="28" y="196" width="190" height="36" rx="8"/>
  <text class="on13" x="123" y="218.5" text-anchor="middle">ReplicaSet controller</text>
  </g>
  <text class="sm a s2" x="230" y="219">creates 3 Pods, nodeName empty</text>
  <g class="a s3">
  <rect class="wrnf" x="28" y="246" width="190" height="36" rx="8"/>
  <text class="on13" x="123" y="268.5" text-anchor="middle">kube-scheduler</text>
  </g>
  <text class="sm a s3" x="230" y="269">binds Pods to nodes</text>
  <g class="a s4">
  <rect class="okf" x="28" y="296" width="190" height="36" rx="8"/>
  <text class="on13" x="123" y="318.5" text-anchor="middle">kubelets</text>
  </g>
  <text class="sm a s4" x="230" y="319">pull · start · probes · Ready</text>
  <text class="sm wrnt a ret" x="230" y="135">← kubectl returns here</text>
  <text class="lbl" x="470" y="104">Objects in etcd</text>
  <g class="a o0">
  <rect class="bp" x="470" y="116" width="140" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="540" y="141" text-anchor="middle" font-weight="700">Deployment web</text>
  </g>
  <g class="a o1">
  <rect class="bt" x="632" y="116" width="140" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="702" y="141" text-anchor="middle" font-weight="700">ReplicaSet</text>
  </g>
  <g class="a pp0">
  <rect class="box" x="470" y="176" width="302" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="621" y="201" text-anchor="middle" font-weight="600">Pod web-…-a  Pending, node &lt;none&gt;</text>
  </g>
  <g class="a pb0">
  <rect class="bw" x="470" y="176" width="302" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="621" y="201" text-anchor="middle" font-weight="600">Pod web-…-a  Pending, node-1</text>
  </g>
  <g class="a pr0">
  <rect class="bo" x="470" y="176" width="302" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="621" y="201" text-anchor="middle" font-weight="600">Pod web-…-a  Running, Ready</text>
  </g>
  <g class="a pp1">
  <rect class="box" x="470" y="228" width="302" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="621" y="253" text-anchor="middle" font-weight="600">Pod web-…-b  Pending, node &lt;none&gt;</text>
  </g>
  <g class="a pb1">
  <rect class="bw" x="470" y="228" width="302" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="621" y="253" text-anchor="middle" font-weight="600">Pod web-…-b  Pending, node-2</text>
  </g>
  <g class="a pr1">
  <rect class="bo" x="470" y="228" width="302" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="621" y="253" text-anchor="middle" font-weight="600">Pod web-…-b  Running, Ready</text>
  </g>
  <g class="a pp2">
  <rect class="box" x="470" y="280" width="302" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="621" y="305" text-anchor="middle" font-weight="600">Pod web-…-c  Pending, node &lt;none&gt;</text>
  </g>
  <g class="a pb2">
  <rect class="bw" x="470" y="280" width="302" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="621" y="305" text-anchor="middle" font-weight="600">Pod web-…-c  Pending, node-3</text>
  </g>
  <g class="a pr2">
  <rect class="bo" x="470" y="280" width="302" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="621" y="305" text-anchor="middle" font-weight="600">Pod web-…-c  Running, Ready</text>
  </g>
  <text class="tx" x="28" y="380">Nothing talks to anything else directly: each component watches the API server and writes back to it.</text>
  <text class="sub" x="28" y="404">That&#x27;s why you check kubectl rollout status instead of trusting a successful apply.</text>
  <text class="sub" x="28" y="424">Measured on the page: a deleted pod was replaced, scheduled and running again in 184 ms.</text>
</svg>
