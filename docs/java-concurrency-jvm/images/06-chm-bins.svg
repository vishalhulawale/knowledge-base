<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">ConcurrentHashMap bins in Java 8 and later</title>
  <desc id="d">A ConcurrentHashMap table of 64 bins, of which the first 16 are drawn. Bin 1 is empty, so put adds the new node with a compare-and-swap and takes no lock. Bin 5 holds a short linked list; a writer locks only the head node of that bin with synchronized. Bin 10 has become a red-black tree bin because its list reached 8 nodes and the table has at least 64 bins, so lookups there are O(log n). Bin 14 holds a ForwardingNode because a resize is in progress; a writer that meets it helps move bins into the new table, which is twice the size. Reads never lock.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:19px;font-weight:700}
    .lbl{fill:#334155;font-size:14px;font-weight:700}
    .t{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .idx{fill:#64748b;font-size:13px}
    .slot{fill:#ffffff;stroke:#cbd5e1}
    .sg{fill:#ffffff;stroke:#16a34a;stroke-width:2.5}
    .sa{fill:#ffffff;stroke:#d97706;stroke-width:2.5}
    .sp{fill:#ffffff;stroke:#4f46e5;stroke-width:2.5}
    .st{fill:#0ea5a4;stroke:#0ea5a4;stroke-width:2.5}
    .nd{fill:#ffffff;stroke:#64748b}
    .ndg{fill:#f0fdf4;stroke:#16a34a;stroke-dasharray:4 3;stroke-width:2}
    .hd{fill:#fffbeb;stroke:#d97706;stroke-width:3}
    .tn{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.5}
    .ln{stroke:#94a3b8;stroke-width:1.5;fill:none}
    .lnt{stroke:#0ea5a4;stroke-width:2;fill:none}
    .mk{fill:#0ea5a4}
    .wt{fill:#fff;font-size:14px;font-weight:700}
    .tg{fill:#15803d}.ta{fill:#b45309}.tp{fill:#4f46e5}.tt{fill:#0f766e}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.t{fill:#e2e8f0}.sub,.idx{fill:#94a3b8}
      .slot,.sg,.sa,.sp,.nd{fill:#111827}.slot{stroke:#475569}.sg{stroke:#4ade80}.sa{stroke:#fbbf24}.sp{stroke:#818cf8}
      .st{fill:#2dd4bf;stroke:#2dd4bf}.nd{stroke:#94a3b8}
      .ndg{fill:#14301f;stroke:#4ade80}.hd{fill:#3a2c10;stroke:#fbbf24}.tn{fill:#262b47;stroke:#818cf8}
      .ln{stroke:#64748b}.lnt{stroke:#2dd4bf}.mk{fill:#2dd4bf}.wt{fill:#0f172a}
      .tg{fill:#4ade80}.ta{fill:#fbbf24}.tp{fill:#a5b4fc}.tt{fill:#5eead4}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="422" rx="14"/>
  <text class="h" x="28" y="40">ConcurrentHashMap (Java 8+): the lock is one bin</text>
  <text class="sub" x="28" y="62">Table of 64 bins, first 16 drawn. Four bins show the four cases a put can meet.</text>

  <rect class="slot" x="42" y="112" width="36" height="36" rx="5"/><text class="idx" x="60" y="104" text-anchor="middle">0</text><rect class="sg" x="82" y="112" width="36" height="36" rx="5"/><text class="idx" x="100" y="104" text-anchor="middle">1</text><rect class="slot" x="122" y="112" width="36" height="36" rx="5"/><text class="idx" x="140" y="104" text-anchor="middle">2</text><rect class="slot" x="162" y="112" width="36" height="36" rx="5"/><text class="idx" x="180" y="104" text-anchor="middle">3</text><rect class="slot" x="202" y="112" width="36" height="36" rx="5"/><text class="idx" x="220" y="104" text-anchor="middle">4</text><rect class="sa" x="242" y="112" width="36" height="36" rx="5"/><text class="idx" x="260" y="104" text-anchor="middle">5</text><rect class="slot" x="282" y="112" width="36" height="36" rx="5"/><text class="idx" x="300" y="104" text-anchor="middle">6</text><rect class="slot" x="322" y="112" width="36" height="36" rx="5"/><text class="idx" x="340" y="104" text-anchor="middle">7</text><rect class="slot" x="362" y="112" width="36" height="36" rx="5"/><text class="idx" x="380" y="104" text-anchor="middle">8</text><rect class="slot" x="402" y="112" width="36" height="36" rx="5"/><text class="idx" x="420" y="104" text-anchor="middle">9</text><rect class="sp" x="442" y="112" width="36" height="36" rx="5"/><text class="idx" x="460" y="104" text-anchor="middle">10</text><rect class="slot" x="482" y="112" width="36" height="36" rx="5"/><text class="idx" x="500" y="104" text-anchor="middle">11</text><rect class="slot" x="522" y="112" width="36" height="36" rx="5"/><text class="idx" x="540" y="104" text-anchor="middle">12</text><rect class="slot" x="562" y="112" width="36" height="36" rx="5"/><text class="idx" x="580" y="104" text-anchor="middle">13</text><rect class="st" x="602" y="112" width="36" height="36" rx="5"/><text class="idx" x="620" y="104" text-anchor="middle">14</text><rect class="slot" x="642" y="112" width="36" height="36" rx="5"/><text class="idx" x="660" y="104" text-anchor="middle">15</text>
  <text class="sub" x="690" y="136">… 63</text>

  <!-- bin 1: CAS into empty bin -->
  <line class="ln" x1="100" y1="148" x2="100" y2="172"/>
  <rect class="ndg" x="80" y="172" width="40" height="30" rx="5"/><text class="t tg" x="100" y="192" text-anchor="middle">new</text>

  <!-- bin 5: linked list, head locked -->
  <line class="ln" x1="260" y1="148" x2="260" y2="168"/>
  <rect class="hd" x="240" y="168" width="40" height="30" rx="5"/>
  <line class="ln" x1="260" y1="198" x2="260" y2="210"/>
  <rect class="nd" x="240" y="210" width="40" height="30" rx="5"/>
  <line class="ln" x1="260" y1="240" x2="260" y2="252"/>
  <rect class="nd" x="240" y="252" width="40" height="30" rx="5"/>
  <text class="t ta" x="290" y="188">← locked</text>

  <!-- bin 10: tree bin -->
  <path class="ln" d="M460,148 L460,166 M460,180 L430,224 M460,180 L490,224 M430,224 L415,266 M430,224 L445,266 M490,224 L475,266 M490,224 L505,266 M505,278 L520,296"/>
  <circle class="tn" cx="460" cy="180" r="13"/>
  <circle class="tn" cx="430" cy="224" r="12"/><circle class="tn" cx="490" cy="224" r="12"/>
  <circle class="tn" cx="415" cy="268" r="10"/><circle class="tn" cx="445" cy="268" r="10"/><circle class="tn" cx="475" cy="268" r="10"/><circle class="tn" cx="505" cy="268" r="10"/><circle class="tn" cx="520" cy="300" r="9"/>

  <!-- bin 14: forwarding node -->
  <text class="wt" x="620" y="136" text-anchor="middle">F</text>
  <path class="lnt" d="M620,150 L620,206" marker-end="url(#ar)"/>
  <rect class="slot" x="600" y="214" width="16" height="22" rx="3"/><rect class="slot" x="620" y="214" width="16" height="22" rx="3"/><rect class="slot" x="640" y="214" width="16" height="22" rx="3"/><rect class="slot" x="660" y="214" width="16" height="22" rx="3"/><rect class="slot" x="680" y="214" width="16" height="22" rx="3"/><rect class="slot" x="700" y="214" width="16" height="22" rx="3"/><rect class="slot" x="720" y="214" width="16" height="22" rx="3"/><rect class="slot" x="740" y="214" width="16" height="22" rx="3"/>
  <text class="sub" x="600" y="256">new table, 2 × size</text>

  <!-- explanations -->
  <text class="lbl tg" x="60" y="320">Empty bin</text>
  <text class="t" x="60" y="340">CAS the new node in.</text>
  <text class="t" x="60" y="358">No lock at all.</text>

  <text class="lbl ta" x="225" y="320">Collision</text>
  <text class="t" x="225" y="340">synchronized on the</text>
  <text class="t" x="225" y="358">head node of this bin.</text>

  <text class="lbl tp" x="400" y="320">Tree bin</text>
  <text class="t" x="400" y="340">List reached 8 and the</text>
  <text class="t" x="400" y="358">table has ≥ 64 bins.</text>

  <text class="lbl tt" x="580" y="320">Resize running</text>
  <text class="t" x="580" y="340">ForwardingNode: writers</text>
  <text class="t" x="580" y="358">help move bins.</text>

  <text class="sub" x="28" y="396">get() never locks: it follows volatile fields, and through a ForwardingNode into the new table.</text>
  <text class="sub" x="28" y="414">Writers to different bins never wait for each other. Bin contents are illustrative.</text>
</svg>
