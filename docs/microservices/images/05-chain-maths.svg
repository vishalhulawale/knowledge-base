  <rect class="card" x="1" y="1" width="798" height="464" rx="14"/>
  <text class="h" x="28" y="40">Why chains and fan-out hurt</text>
  <text class="h2" x="28" y="74">Serial chain: availability multiplies</text>
  <rect class="bp" x="28" y="90" width="96" height="54" rx="10" stroke-width="1.5"/><text class="tx" x="76" y="113" text-anchor="middle">Service 1</text><text class="sub" x="76" y="133" text-anchor="middle">99.9%</text>
  <line class="ln" x1="124" y1="117" x2="138" y2="117" marker-end="url(#ar)"/>
  <rect class="bp" x="140" y="90" width="96" height="54" rx="10" stroke-width="1.5"/><text class="tx" x="188" y="113" text-anchor="middle">Service 2</text><text class="sub" x="188" y="133" text-anchor="middle">99.9%</text>
  <line class="ln" x1="236" y1="117" x2="250" y2="117" marker-end="url(#ar)"/>
  <rect class="bp" x="252" y="90" width="96" height="54" rx="10" stroke-width="1.5"/><text class="tx" x="300" y="113" text-anchor="middle">Service 3</text><text class="sub" x="300" y="133" text-anchor="middle">99.9%</text>
  <line class="ln" x1="348" y1="117" x2="362" y2="117" marker-end="url(#ar)"/>
  <rect class="bp" x="364" y="90" width="96" height="54" rx="10" stroke-width="1.5"/><text class="tx" x="412" y="113" text-anchor="middle">Service 4</text><text class="sub" x="412" y="133" text-anchor="middle">99.9%</text>
  <line class="ln" x1="460" y1="117" x2="474" y2="117" marker-end="url(#ar)"/>
  <rect class="bp" x="476" y="90" width="96" height="54" rx="10" stroke-width="1.5"/><text class="tx" x="524" y="113" text-anchor="middle">Service 5</text><text class="sub" x="524" y="133" text-anchor="middle">99.9%</text>
  <line class="ln" x1="582" y1="117" x2="600" y2="117" marker-end="url(#ar)"/>
  <rect class="bb" x="604" y="86" width="168" height="62" rx="10" stroke-width="1.5"/><text class="lbl badt" x="688" y="112" text-anchor="middle">0.999⁵ ≈ 99.5%</text><text class="sub" x="688" y="134" text-anchor="middle">for the whole request</text>
  <text class="tx" x="28" y="176">One service at 99.9% is down about 43 minutes a month; the chain of five is down about 3.6 hours.</text>
  <text class="h2" x="28" y="222">Fan-out: tail latency spreads</text>
  <text class="sub" x="28" y="244">Each call has a 1% chance of being slow (one red square in a hundred). One request fans out to 100 calls.</text>
