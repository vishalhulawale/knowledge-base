<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Unbounded vs bounded queue under overload</title>
<desc id="d">Animation of two services receiving twice the traffic their fixed worker pool can handle. Top: with an unbounded queue, items pile up without limit and the latency bar keeps growing until every request waits behind the backlog, times out and is retried. Bottom: with a bounded queue of capacity N, the queue fills, further arrivals are rejected immediately with 503 and Retry-After, and latency for accepted work stays short and bounded.</desc>
<style>
.card{fill:#f8fafc;stroke:#e2e8f0}.cv{fill:#f8fafc}
.h{fill:#0f172a;font-size:20px;font-weight:700}
.lbl{fill:#334155;font-size:15px;font-weight:600}
.txt{fill:#334155;font-size:14px}.sm{fill:#334155;font-size:13px}
.sub{fill:#64748b;font-size:13px}.b{font-weight:700}
.slot{fill:#ffffff;stroke:#cbd5e1}
.fp{fill:#4f46e5}.ft{fill:#0ea5a4}.fg{fill:#16a34a}.fr{fill:#dc2626}.fa{fill:#d97706}.fmu{fill:#64748b}
.zp{fill:#4f46e5;fill-opacity:.1}.zg{fill:#16a34a;fill-opacity:.12}.zr{fill:#dc2626;fill-opacity:.1}.za{fill:#d97706;fill-opacity:.14}
.on{fill:#ffffff}
.sp{stroke:#4f46e5}.st{stroke:#0ea5a4}.sg{stroke:#16a34a}.sr{stroke:#dc2626}.sa{stroke:#d97706}.smu{stroke:#64748b}.sax{stroke:#cbd5e1}
.tp{fill:#4f46e5}.tt{fill:#0f766e}.tg{fill:#15803d}.tr{fill:#dc2626}.ta{fill:#b45309}.tm{fill:#64748b}
.nf{fill:none}
@media (prefers-color-scheme: dark){
.card{fill:#1f2430;stroke:#334155}.cv{fill:#1f2430}
.h{fill:#f1f5f9}.lbl,.txt,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}
.slot{fill:#111827;stroke:#475569}
.fp{fill:#818cf8}.ft{fill:#2dd4bf}.fg{fill:#4ade80}.fr{fill:#f87171}.fa{fill:#fbbf24}.fmu{fill:#94a3b8}
.zp{fill:#818cf8;fill-opacity:.16}.zg{fill:#4ade80;fill-opacity:.14}.zr{fill:#f87171;fill-opacity:.14}.za{fill:#fbbf24;fill-opacity:.14}
.on{fill:#0f172a}
.sp{stroke:#818cf8}.st{stroke:#2dd4bf}.sg{stroke:#4ade80}.sr{stroke:#f87171}.sa{stroke:#fbbf24}.smu{stroke:#94a3b8}.sax{stroke:#475569}
.tp{fill:#818cf8}.tt{fill:#5eead4}.tg{fill:#4ade80}.tr{fill:#f87171}.ta{fill:#fbbf24}.tm{fill:#94a3b8}
}

.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 10s linear infinite}
@keyframes grow{0%{transform:scaleX(.06)}62%,94%{transform:scaleX(1)}97%,100%{transform:scaleX(.06)}}

.a,.d,.w{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:linear}
.a{opacity:0}.w{opacity:0}
@keyframes kp5{0%,3%{opacity:0}5%,92%{opacity:1}96%,100%{opacity:0}}.p5{animation-name:kp5}
@keyframes kp10{0%,8%{opacity:0}10%,92%{opacity:1}96%,100%{opacity:0}}.p10{animation-name:kp10}
@keyframes kp15{0%,13%{opacity:0}15%,92%{opacity:1}96%,100%{opacity:0}}.p15{animation-name:kp15}
@keyframes kp20{0%,18%{opacity:0}20%,92%{opacity:1}96%,100%{opacity:0}}.p20{animation-name:kp20}
@keyframes kp25{0%,23%{opacity:0}25%,92%{opacity:1}96%,100%{opacity:0}}.p25{animation-name:kp25}
@keyframes kp30{0%,28%{opacity:0}30%,92%{opacity:1}96%,100%{opacity:0}}.p30{animation-name:kp30}
@keyframes kp32{0%,30%{opacity:0}32%,92%{opacity:1}96%,100%{opacity:0}}.p32{animation-name:kp32}
@keyframes kp35{0%,33%{opacity:0}35%,92%{opacity:1}96%,100%{opacity:0}}.p35{animation-name:kp35}
@keyframes kp40{0%,38%{opacity:0}40%,92%{opacity:1}96%,100%{opacity:0}}.p40{animation-name:kp40}
@keyframes kp45{0%,43%{opacity:0}45%,92%{opacity:1}96%,100%{opacity:0}}.p45{animation-name:kp45}
@keyframes kp50{0%,48%{opacity:0}50%,92%{opacity:1}96%,100%{opacity:0}}.p50{animation-name:kp50}
@keyframes kp55{0%,53%{opacity:0}55%,92%{opacity:1}96%,100%{opacity:0}}.p55{animation-name:kp55}
@keyframes kp60{0%,58%{opacity:0}60%,92%{opacity:1}96%,100%{opacity:0}}.p60{animation-name:kp60}
@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.d{animation:none;opacity:0}.w{animation:none;opacity:0}.grow{animation:none}}
</style>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fmu" d="M0,0L10,5L0,10z"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fp" d="M0,0L10,5L0,10z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fg" d="M0,0L10,5L0,10z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fr" d="M0,0L10,5L0,10z"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fa" d="M0,0L10,5L0,10z"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ft" d="M0,0L10,5L0,10z"/></marker>
</defs>
<rect class="card" x="1" y="1" width="798" height="418" rx="14"/>

<text class="h" x="28" y="40">Overload with an unbounded vs a bounded queue</text>
<text class="sub" x="28" y="62">Clients send twice what the workers can process.</text>
<text class="lbl tr" x="28" y="98">Unbounded queue</text>
<rect class="slot" x="28" y="107" width="92" height="50" rx="10"/><text class="sm b" x="74" y="129" text-anchor="middle">clients</text><text class="sub" x="74" y="147" text-anchor="middle">2× capacity</text><rect class="slot" x="600" y="107" width="120" height="50" rx="10"/><text class="sm b" x="660" y="129" text-anchor="middle">workers</text><text class="sub" x="660" y="147" text-anchor="middle">fixed pool</text>
<line x1="122" y1="132" x2="138" y2="132" class="smu" stroke-width="2" marker-end="url(#am)"/>

<rect class="slot" x="524" y="112" width="30" height="40" rx="5"/><rect class="slot" x="490" y="112" width="30" height="40" rx="5"/><rect class="slot" x="456" y="112" width="30" height="40" rx="5"/><rect class="slot" x="422" y="112" width="30" height="40" rx="5"/><rect class="slot" x="388" y="112" width="30" height="40" rx="5"/><rect class="slot" x="354" y="112" width="30" height="40" rx="5"/><rect class="slot" x="320" y="112" width="30" height="40" rx="5"/><rect class="slot" x="286" y="112" width="30" height="40" rx="5"/><rect class="slot" x="252" y="112" width="30" height="40" rx="5"/><rect class="slot" x="218" y="112" width="30" height="40" rx="5"/><rect class="slot" x="184" y="112" width="30" height="40" rx="5"/><rect class="slot" x="150" y="112" width="30" height="40" rx="5"/><rect class="fp a p5" x="524" y="112" width="30" height="40" rx="5"/><rect class="fp a p10" x="490" y="112" width="30" height="40" rx="5"/><rect class="fp a p15" x="456" y="112" width="30" height="40" rx="5"/><rect class="fp a p20" x="422" y="112" width="30" height="40" rx="5"/><rect class="fp a p25" x="388" y="112" width="30" height="40" rx="5"/><rect class="fp a p30" x="354" y="112" width="30" height="40" rx="5"/><rect class="fp a p35" x="320" y="112" width="30" height="40" rx="5"/><rect class="fp a p40" x="286" y="112" width="30" height="40" rx="5"/><rect class="fp a p45" x="252" y="112" width="30" height="40" rx="5"/><rect class="fp a p50" x="218" y="112" width="30" height="40" rx="5"/><rect class="fp a p55" x="184" y="112" width="30" height="40" rx="5"/><rect class="fp a p60" x="150" y="112" width="30" height="40" rx="5"/>
<line x1="556" y1="132" x2="596" y2="132" class="smu" stroke-width="2" marker-end="url(#am)"/>
<text class="sm b" x="28" y="186">latency</text>
<rect class="slot" x="150" y="174" width="408" height="16" rx="5"/>
<rect class="fr grow" x="150" y="174" width="408" height="16" rx="5"/>
<g class="a p55"><text class="sm tr b" x="150" y="214">Every request waits behind the backlog, then times out and is retried.</text></g>
<line x1="28" y1="234" x2="772" y2="234" class="sax"/>
<text class="lbl tg" x="28" y="258">Bounded queue (capacity N) + rejection</text>
<rect class="slot" x="28" y="267" width="92" height="50" rx="10"/><text class="sm b" x="74" y="289" text-anchor="middle">clients</text><text class="sub" x="74" y="307" text-anchor="middle">2× capacity</text><rect class="slot" x="600" y="267" width="120" height="50" rx="10"/><text class="sm b" x="660" y="289" text-anchor="middle">workers</text><text class="sub" x="660" y="307" text-anchor="middle">fixed pool</text>
<line x1="122" y1="292" x2="342" y2="292" class="smu" stroke-width="2" marker-end="url(#am)"/>
<line x1="350" y1="264" x2="350" y2="320" class="sg" stroke-width="4"/>
<rect class="slot" x="524" y="272" width="30" height="40" rx="5"/><rect class="slot" x="490" y="272" width="30" height="40" rx="5"/><rect class="slot" x="456" y="272" width="30" height="40" rx="5"/><rect class="slot" x="422" y="272" width="30" height="40" rx="5"/><rect class="slot" x="388" y="272" width="30" height="40" rx="5"/><rect class="slot" x="354" y="272" width="30" height="40" rx="5"/><rect class="fp a p5" x="524" y="272" width="30" height="40" rx="5"/><rect class="fp a p10" x="490" y="272" width="30" height="40" rx="5"/><rect class="fp a p15" x="456" y="272" width="30" height="40" rx="5"/><rect class="fp a p20" x="422" y="272" width="30" height="40" rx="5"/><rect class="fp a p25" x="388" y="272" width="30" height="40" rx="5"/><rect class="fp a p30" x="354" y="272" width="30" height="40" rx="5"/>
<line x1="556" y1="292" x2="596" y2="292" class="smu" stroke-width="2" marker-end="url(#am)"/>
<g class="a p32"><path class="nf sr" stroke-width="2" d="M342,300 C300,336 170,336 124,306" marker-end="url(#ar)"/><text class="sm tr b" x="236" y="342" text-anchor="middle">full: 503 + Retry-After</text></g>
<text class="sm b" x="28" y="370">latency</text>
<rect class="slot" x="150" y="358" width="408" height="16" rx="5"/>
<rect class="fg" x="150" y="358" width="110" height="16" rx="5"/>
<g class="a p40"><text class="sm tg b" x="272" y="371">stays bounded for accepted work</text></g>
<text class="sub" x="28" y="404">Illustrative. Reject early and cheaply; size the pool and queue from Little's law.</text>

</svg>
