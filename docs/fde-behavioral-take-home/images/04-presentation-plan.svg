  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="354" rx="14"/>
  <text class="h" x="28" y="40">A 10-minute take-home presentation</text><text class="sub" x="28" y="62">Story first, code on request. Q&amp;A afterwards is where most of the scoring happens.</text><rect class="pri" x="41" y="96" width="70" height="46" rx="6"/><text class="sub" x="76" y="162" text-anchor="middle">User + problem</text><rect class="okf" x="113" y="96" width="214" height="46" rx="6"/><text class="on13" x="220" y="124" text-anchor="middle">Live demo of the after</text><rect class="tea" x="329" y="96" width="142" height="46" rx="6"/><text class="on13" x="400" y="124" text-anchor="middle">How it works</text><rect class="wrnf" x="473" y="96" width="142" height="46" rx="6"/><text class="on13" x="544" y="124" text-anchor="middle">How we know: evals</text><rect class="mutf" x="617" y="96" width="70" height="46" rx="6"/><text class="on13" x="652" y="124" text-anchor="middle">Limits</text><rect class="pri" x="689" y="96" width="70" height="46" rx="6"/><text class="on13" x="724" y="124" text-anchor="middle">Next</text><text class="sub" x="40" y="184" text-anchor="middle">0</text><text class="sub" x="112" y="184" text-anchor="middle">1</text><text class="sub" x="184" y="184" text-anchor="middle">2</text><text class="sub" x="256" y="184" text-anchor="middle">3</text><text class="sub" x="328" y="184" text-anchor="middle">4</text><text class="sub" x="400" y="184" text-anchor="middle">5</text><text class="sub" x="472" y="184" text-anchor="middle">6</text><text class="sub" x="544" y="184" text-anchor="middle">7</text><text class="sub" x="616" y="184" text-anchor="middle">8</text><text class="sub" x="688" y="184" text-anchor="middle">9</text><text class="sub" x="760" y="184" text-anchor="middle">10</text><rect class="bm" x="28" y="210" width="744" height="96" rx="8"/><text class="sm" x="44" y="234" font-weight="700">Opening line that works:</text><text class="sm" x="44" y="258">"A claims handler gets a call asking whether physio after surgery is covered beyond ten sessions.</text><text class="sm" x="44" y="277">Let me show you the same question in the prototype…" then the demo, then the eval numbers.</text><text class="badt" x="28" y="336" style="font-size:13px">Not: "I used FastAPI and LangChain, let me open the code…"</text>
</svg>
