  <text class="lbl" x="28" y="256">Spikes at each deploy</text>
  <text class="sm" x="28" y="274">rebalances</text>
  <line class="axis" x1="38" x2="368" y1="374" y2="374"/>
  <polyline class="s1" points="38.0,369.7 120.5,369.7 137.0,335.3 156.8,368.8 269.0,368.8 285.5,339.6 305.3,369.7 368.0,369.7"/>
  <polyline class="s1" points="38.0,368.0 120.5,368.0 137.0,331.0 156.8,368.0 269.0,368.0 285.5,332.7 305.3,368.0 368.0,368.0"/>
  <polyline class="s1" points="38.0,370.6 120.5,370.6 137.0,341.3 156.8,370.6 269.0,370.6 285.5,343.9 305.3,370.6 368.0,370.6"/>
  <text class="sm" x="137" y="390" text-anchor="middle">deploy</text>
  <text class="sm" x="285.5" y="390" text-anchor="middle">deploy</text>
  <text class="lbl" x="408" y="256">Straight line, commits frozen</text>
  <text class="sm" x="408" y="274">group stopped or crashed</text>
  <line class="axis" x1="418" x2="748" y1="374" y2="374"/>
  <polyline class="s3" points="418.0,369.7 484.0,369.7 748.0,298.3"/>
  <polyline class="s3" points="418.0,370.6 484.0,370.6 748.0,302.6"/>
  <polyline class="s3" points="418.0,368.8 484.0,368.8 748.0,294.9"/>
  <text class="sm" x="484" y="390" text-anchor="middle">consumer stops</text>
  <text class="sub" x="28" y="418">Three partitions per chart; grey = partitions behaving normally. Illustrative shapes.</text>
</svg>
