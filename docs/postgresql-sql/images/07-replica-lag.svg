<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Replication lag and read-your-writes</title>
  <desc id="d">The primary appends WAL records and acknowledges each commit straight away. An asynchronous standby receives and replays the same records a little later, so its replay position trails the primary. The application commits its write as record 7 on the primary and immediately reads it from the standby: the standby hasn't replayed record 7 yet, so the row isn't found. Moments later the standby replays it and the same read would succeed. Measured: 198 of 200 immediate reads missed on a local replica, and a bulk insert put it 30 MB or 360 ms behind.</desc>
