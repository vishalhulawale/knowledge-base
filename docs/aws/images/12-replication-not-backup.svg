<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Why replication is not a backup</title>
  <desc id="d">A primary database replicates asynchronously to a replica in a DR Region. Good writes are copied across. Then a bad write corrupts data on the primary, and within seconds replication copies the corruption to the replica too, so both are bad. Recovery comes from point-in-time backups kept in a separate account with vault lock: the database is restored to a recovery point from before the bad write.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .txt{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .db{fill:#4f46e5}
    .bad{fill:#dc2626}
    .good{fill:#16a34a}
    .bk{fill:#0ea5a4}
    .on{fill:#fff;font-size:14px;font-weight:700}
    .arr{stroke:#334155;stroke-width:2.5;fill:none}
    .head{fill:#334155}
    .badt{fill:#dc2626;font-size:14px;font-weight:700}
    .okt{fill:#16a34a;font-size:14px;font-weight:700}
    .line{stroke:#94a3b8;stroke-width:3}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.txt{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .db{fill:#818cf8}.bad,.badt{fill:#f87171}.good,.okt{fill:#4ade80}.bk{fill:#2dd4bf}
      .on{fill:#0f172a}.arr{stroke:#e2e8f0}.head{fill:#e2e8f0}.line{stroke:#64748b}
    }
    /* 12 s loop: bad write on primary 26 % | reaches replica 34 % | restore 56-62 % | hold to 94 % */
    .a{opacity:0;animation:12s infinite linear}
    @keyframes bp{0%,25%{opacity:0}27%,94%{opacity:1}98%,100%{opacity:0}}
    @keyframes br{0%,33%{opacity:0}35%,94%{opacity:1}98%,100%{opacity:0}}
    @keyframes bx{0%,25%{opacity:0}27%,94%{opacity:1}98%,100%{opacity:0}}
    @keyframes rs{0%,55%{opacity:0}58%,94%{opacity:1}98%,100%{opacity:0}}
    @keyframes rd{0%,61%{opacity:0}64%,94%{opacity:1}98%,100%{opacity:0}}
    @keyframes m1{0%,35%{opacity:0}37%,94%{opacity:1}98%,100%{opacity:0}}
    .kbp{animation-name:bp}.kbr{animation-name:br}.kbx{animation-name:bx}.krs{animation-name:rs}.krd{animation-name:rd}.km1{animation-name:m1}
    @media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Replication copies mistakes too</text>
  <text class="sub" x="28" y="62">A bad write reaches the DR replica in seconds. Only a point-in-time backup goes back before it.</text>

  <!-- primary and replica -->
  <text class="lbl" x="28" y="98">Primary Region</text>
  <rect class="db" x="28" y="108" width="200" height="60" rx="8"/><text class="on" x="128" y="143" text-anchor="middle">Primary DB</text>
  <g class="a kbp"><rect class="bad" x="28" y="108" width="200" height="60" rx="8"/><text class="on" x="128" y="134" text-anchor="middle">Primary DB</text><text class="on" x="128" y="154" text-anchor="middle">corrupted</text></g>

  <path class="arr" d="M228 138 H526"/><path class="head" d="M534 138 l-10 -6 v12z"/>
  <text class="sub" x="380" y="128" text-anchor="middle">async replication, seconds</text>

  <text class="lbl" x="540" y="98">DR Region</text>
  <rect class="db" x="540" y="108" width="200" height="60" rx="8"/><text class="on" x="640" y="143" text-anchor="middle">Replica</text>
  <g class="a kbr"><rect class="bad" x="540" y="108" width="200" height="60" rx="8"/><text class="on" x="640" y="134" text-anchor="middle">Replica</text><text class="on" x="640" y="154" text-anchor="middle">corrupted too</text></g>
  <text class="badt a km1" x="380" y="160" text-anchor="middle">✗ the bad write replicated</text>

  <!-- backups timeline -->
  <rect class="box" x="28" y="196" width="744" height="120" rx="10"/>
  <text class="lbl" x="44" y="220">Point-in-time backups, separate account + vault lock</text>
  <line class="line" x1="60" y1="262" x2="740" y2="262"/>
  <rect class="bk" x="111" y="253" width="18" height="18" rx="3" transform="rotate(45 120 262)"/>
  <rect class="bk" x="231" y="253" width="18" height="18" rx="3" transform="rotate(45 240 262)"/>
  <rect class="bk" x="351" y="253" width="18" height="18" rx="3" transform="rotate(45 360 262)"/>
  <text class="sub" x="360" y="296" text-anchor="middle">last good point</text>
  <g class="a kbx"><circle class="bad" cx="500" cy="262" r="10"/><text class="badt" x="500" y="296" text-anchor="middle">bad write</text></g>

  <!-- restore -->
  <g class="a krs">
    <path class="arr" d="M372 304 C420 350 500 356 548 355"/><path class="head" d="M556 355 l-10 -6 v12z"/>
  </g>
  <g class="a krd">
    <rect class="good" x="560" y="330" width="200" height="50" rx="8"/><text class="on" x="660" y="361" text-anchor="middle">Restored DB</text>
    <text class="okt" x="28" y="362">✓ Restore to a point before the bad write.</text>
  </g>
</svg>
