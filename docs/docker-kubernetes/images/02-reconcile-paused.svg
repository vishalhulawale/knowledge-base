  <text class="h2 a p2" x="580" y="261">5</text>
  <text class="lbl a p0" x="28" y="316">1  Steady state: 3 everywhere</text>
  <text class="lbl wrnt a p1" x="28" y="316">2  controller-manager paused, scale to 5: spec says 5, nothing else moves</text>
  <text class="lbl okt a p2" x="28" y="316">3  Resumed: one reconcile compares desired 5 with actual 3 and fixes it</text>
  <text class="sub" x="28" y="352">A restarted or lagging controller never needs the events it missed: the next reconcile reads the whole state.</text>
  <text class="sub" x="28" y="372">With the scheduler paused instead, new pods sat Pending with nodeName &lt;none&gt; until it resumed.</text>
</svg>
