<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Three permission planes</title>
  <desc id="d">Three columns compare permission systems. Entra roles govern the directory, with roles such as Global Administrator and Application Administrator that manage users, groups, app registrations and consent, near AWS IAM Identity Center and Organizations administration. Azure RBAC governs the Azure Resource Manager control plane, with Owner, Contributor and User Access Administrator, letting you create a vault, set its firewall and, for Owner or User Access Administrator only, assign roles, near IAM permissions on control actions like kms:CreateKey. Key Vault data roles govern the data plane, with Key Vault Secrets User, Crypto User and Administrator, letting you read secrets or wrap and sign with keys, near kms:Decrypt and secretsmanager:GetSecretValue. Two boxes contrast a legacy access-policy vault, where a Contributor can edit access policies and read secrets, with an RBAC vault, the default from API version 2026-02-01, where a Contributor manages the vault but cannot read data or assign itself a data role.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="486" rx="14"/>
  <text class="h" x="28" y="40">Three permission systems people mix up</text><text class="sub" x="28" y="62">Each answers a different question. Assigning one does not grant the others.</text><rect class="bp" x="28" y="84" width="236" height="56" rx="10" stroke-width="1.5"/><text class="prit" x="146" y="108" text-anchor="middle" style="font-size:16px">Entra roles</text><text class="sub" x="146" y="128" text-anchor="middle">directory</text><text class="sub" x="40" y="166">Example roles</text><text class="mono" x="40" y="188" xml:space="preserve" style="font-size:12px">Global Administrator</text><text class="mono" x="40" y="208" xml:space="preserve" style="font-size:12px">Application Administrator</text><text class="mono" x="40" y="228" xml:space="preserve" style="font-size:12px">Groups Administrator</text><text class="sub" x="40" y="262">Lets you</text><text class="sm" x="40" y="282">manage users, groups,</text><text class="sm" x="40" y="300">app registrations, consent</text><rect class="bm" x="28" y="312" width="236" height="50" rx="8" stroke-width="1"/><text class="sm" x="40" y="332">IAM Identity Center admin,</text><text class="sm" x="40" y="350">Organizations</text><rect class="bt" x="282" y="84" width="236" height="56" rx="10" stroke-width="1.5"/><text class="teat" x="400" y="108" text-anchor="middle" style="font-size:16px">Azure RBAC</text><text class="sub" x="400" y="128" text-anchor="middle">control plane (ARM)</text><text class="sub" x="294" y="166">Example roles</text><text class="mono" x="294" y="188" xml:space="preserve" style="font-size:12px">Owner</text><text class="mono" x="294" y="208" xml:space="preserve" style="font-size:12px">Contributor</text><text class="mono" x="294" y="228" xml:space="preserve" style="font-size:12px">User Access Administrator</text><text class="sub" x="294" y="262">Lets you</text><text class="sm" x="294" y="282">create the vault, set</text><text class="sm" x="294" y="300">firewall, assign roles*</text><rect class="bm" x="282" y="312" width="236" height="50" rx="8" stroke-width="1"/><text class="sm" x="294" y="332">IAM on control actions:</text><text class="sm" x="294" y="350">kms:CreateKey, PutKeyPolicy</text><rect class="bw" x="536" y="84" width="236" height="56" rx="10" stroke-width="1.5"/><text class="wrnt" x="654" y="108" text-anchor="middle" style="font-size:16px">Key Vault data roles</text><text class="sub" x="654" y="128" text-anchor="middle">data plane (RBAC model)</text><text class="sub" x="548" y="166">Example roles</text><text class="mono" x="548" y="188" xml:space="preserve" style="font-size:12px">Key Vault Secrets User</text><text class="mono" x="548" y="208" xml:space="preserve" style="font-size:12px">Key Vault Crypto User</text><text class="mono" x="548" y="228" xml:space="preserve" style="font-size:12px">Key Vault Administrator</text><text class="sub" x="548" y="262">Lets you</text><text class="sm" x="548" y="282">read a secret, wrap or</text><text class="sm" x="548" y="300">sign with a key</text><rect class="bm" x="536" y="312" width="236" height="50" rx="8" stroke-width="1"/><text class="sm" x="548" y="332">kms:Decrypt / Sign, secrets-</text><text class="sm" x="548" y="350">manager:GetSecretValue</text><text class="sub" x="28" y="380">Bottom boxes: the nearest AWS idea. * Only Owner or User Access Administrator can assign roles.</text><rect class="bb" x="28" y="394" width="362" height="74" rx="10" stroke-width="1.2"/><text class="badt" x="44" y="416">Access-policy vault (legacy)</text><text class="sm" x="44" y="436">Contributor can edit access policies,</text><text class="sm" x="44" y="454">grant itself get/list and read secrets.</text><rect class="bo" x="410" y="394" width="362" height="74" rx="10" stroke-width="1.2"/><text class="okt" x="426" y="416">RBAC vault (default from API 2026-02-01)</text><text class="sm" x="426" y="436">Contributor manages the vault but can't</text><text class="sm" x="426" y="454">read data or assign itself a data role.</text>
</svg>
