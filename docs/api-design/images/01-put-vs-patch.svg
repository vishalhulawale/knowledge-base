<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">PUT replaces, PATCH merges</title>
  <desc id="d">A prescription resource has five fields: drug, dose, refills 3, pharmacy CVS and notes. A client that only knows about dose sends dose 20 mg. With PUT, the body is the full new representation, so drug, refills, pharmacy and notes are removed or reset and only dose remains. With PATCH using JSON Merge Patch, only dose changes and every other field is kept.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:14s infinite linear}
    @keyframes p0{0%,35%{opacity:1}36%{opacity:0}100%{opacity:0}}
    .p0{animation-name:p0}
    @keyframes p1{0%{opacity:0}35%{opacity:0}36%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p1{animation-name:p1}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .p0{opacity:0!important}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">Client sends {&quot;dose&quot;: &quot;20 mg&quot;}</text>
  <text class="sub" x="28" y="62">PUT means &quot;here is the whole resource&quot;; PATCH means &quot;here is the change&quot;.</text>
  <line class="ln dash" x1="400" y1="84" x2="400" y2="330"/>
  <text class="h2" x="28" y="102">PUT /prescriptions/rx_9f2</text>
  <rect class="box" x="28" y="118" width="340" height="32" rx="6"/>
  <text class="tx" x="40" y="139" font-weight="700">drug</text>
  <text class="tx a p0" x="356" y="139" text-anchor="end">atorvastatin</text>
  <g class="a p1">
  <rect class="badf" x="228" y="121" width="136" height="26" rx="5"/>
  <text class="on13" x="296" y="138.5" text-anchor="middle">null / gone</text>
  </g>
  <rect class="box" x="28" y="156" width="340" height="32" rx="6"/>
  <text class="tx" x="40" y="177" font-weight="700">dose</text>
  <text class="tx a p0" x="356" y="177" text-anchor="end">10 mg</text>
  <g class="a p1">
  <rect class="pri" x="228" y="159" width="136" height="26" rx="5"/>
  <text class="on13" x="296" y="176.5" text-anchor="middle">20 mg</text>
  </g>
  <rect class="box" x="28" y="194" width="340" height="32" rx="6"/>
  <text class="tx" x="40" y="215" font-weight="700">refills</text>
  <text class="tx a p0" x="356" y="215" text-anchor="end">3</text>
  <g class="a p1">
  <rect class="badf" x="228" y="197" width="136" height="26" rx="5"/>
  <text class="on13" x="296" y="214.5" text-anchor="middle">null / gone</text>
  </g>
  <rect class="box" x="28" y="232" width="340" height="32" rx="6"/>
  <text class="tx" x="40" y="253" font-weight="700">pharmacy</text>
  <text class="tx a p0" x="356" y="253" text-anchor="end">CVS</text>
  <g class="a p1">
  <rect class="badf" x="228" y="235" width="136" height="26" rx="5"/>
  <text class="on13" x="296" y="252.5" text-anchor="middle">null / gone</text>
  </g>
  <rect class="box" x="28" y="270" width="340" height="32" rx="6"/>
  <text class="tx" x="40" y="291" font-weight="700">notes</text>
  <text class="tx a p0" x="356" y="291" text-anchor="end">take at night</text>
  <g class="a p1">
  <rect class="badf" x="228" y="273" width="136" height="26" rx="5"/>
  <text class="on13" x="296" y="290.5" text-anchor="middle">null / gone</text>
  </g>
  <text class="h2" x="420" y="102">PATCH (merge-patch+json)</text>
  <rect class="box" x="420" y="118" width="340" height="32" rx="6"/>
  <text class="tx" x="432" y="139" font-weight="700">drug</text>
  <text class="tx a p0" x="748" y="139" text-anchor="end">atorvastatin</text>
  <text class="tx okt a p1" x="748" y="139" text-anchor="end">atorvastatin</text>
  <rect class="box" x="420" y="156" width="340" height="32" rx="6"/>
  <text class="tx" x="432" y="177" font-weight="700">dose</text>
  <text class="tx a p0" x="748" y="177" text-anchor="end">10 mg</text>
  <g class="a p1">
  <rect class="pri" x="620" y="159" width="136" height="26" rx="5"/>
  <text class="on13" x="688" y="176.5" text-anchor="middle">20 mg</text>
  </g>
  <rect class="box" x="420" y="194" width="340" height="32" rx="6"/>
  <text class="tx" x="432" y="215" font-weight="700">refills</text>
  <text class="tx a p0" x="748" y="215" text-anchor="end">3</text>
  <text class="tx okt a p1" x="748" y="215" text-anchor="end">3</text>
  <rect class="box" x="420" y="232" width="340" height="32" rx="6"/>
  <text class="tx" x="432" y="253" font-weight="700">pharmacy</text>
  <text class="tx a p0" x="748" y="253" text-anchor="end">CVS</text>
  <text class="tx okt a p1" x="748" y="253" text-anchor="end">CVS</text>
  <rect class="box" x="420" y="270" width="340" height="32" rx="6"/>
  <text class="tx" x="432" y="291" font-weight="700">notes</text>
  <text class="tx a p0" x="748" y="291" text-anchor="end">take at night</text>
  <text class="tx okt a p1" x="748" y="291" text-anchor="end">take at night</text>
  <text class="lbl badt a p1" x="28" y="336">4 fields wiped</text>
  <text class="lbl okt a p1" x="420" y="336">only dose changed</text>
  <text class="sub" x="28" y="372">PUT needs the full representation: fine for upserts with natural keys, dangerous from partial clients.</text>
  <text class="sub" x="28" y="392">Guard both with If-Match: &quot;v7&quot; so a stale write gets 412 instead of overwriting someone else&#x27;s edit.</text>
</svg>
