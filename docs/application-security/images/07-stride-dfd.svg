<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">STRIDE on a DFD</title>
  <desc id="d">A data-flow diagram of a claims API. The member browser sits in an untrusted internet boundary, PingFederate in an identity provider boundary, and the API gateway, claims service, PostgreSQL with PHI, a Kafka topic and an adjudication worker inside a cloud VPC boundary. STRIDE letter badges mark threats: spoofing, tampering, information disclosure and denial of service on the browser-to-gateway flow; spoofing on the login flow; spoofing and elevation into the claims service; elevation and repudiation at the claims service; tampering and information disclosure on database and Kafka flows; spoofing and tampering on the consumer flow; tampering and repudiation on the worker's database writes.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="464" rx="14"/>
  <text class="h" x="28" y="40">STRIDE on a data-flow diagram</text><text class="sub" x="28" y="62">Dashed lines are trust boundaries. Letters mark the threats to examine there.</text><rect class="card" x="236" y="86" width="540" height="300" rx="12" stroke-dasharray="7 5" stroke-width="1.5" style="fill:none"/><text class="sub" x="250" y="106">Cloud VPC</text><rect class="card" x="24" y="86" width="190" height="140" rx="12" stroke-dasharray="7 5" stroke-width="1.5" style="fill:none"/><text class="sub" x="36" y="106">Internet (untrusted)</text><rect class="card" x="24" y="262" width="190" height="124" rx="12" stroke-dasharray="7 5" stroke-width="1.5" style="fill:none"/><text class="sub" x="36" y="282">Identity provider</text><rect class="box" x="44" y="140" width="150" height="46" rx="8" stroke-width="1.5"/><text class="sm" x="119" y="168" text-anchor="middle">Member browser</text><rect class="box" x="44" y="310" width="150" height="46" rx="8" stroke-width="1.5"/><text class="sm" x="119" y="338" text-anchor="middle">PingFederate</text><rect class="bp" x="266" y="140" width="120" height="46" rx="23" stroke-width="1.5"/><text class="sm" x="326" y="168" text-anchor="middle">API gateway</text><rect class="bp" x="440" y="140" width="130" height="46" rx="23" stroke-width="1.5"/><text class="sm" x="505" y="168" text-anchor="middle">Claims service</text><rect class="bm" x="624" y="140" width="130" height="46" rx="4" stroke-width="1.5"/><text class="sm" x="689" y="168" text-anchor="middle">PostgreSQL (PHI)</text><rect class="bm" x="440" y="296" width="130" height="46" rx="4" stroke-width="1.5"/><text class="sm" x="505" y="324" text-anchor="middle">Kafka topic</text><rect class="bp" x="624" y="296" width="130" height="46" rx="23" stroke-width="1.5"/><text class="sm" x="689" y="324" text-anchor="middle">Adjudication</text><line class="ln" x1="196" y1="163" x2="262" y2="163" marker-end="url(#ar)"/><line class="ln" x1="170" y1="188" x2="170" y2="306" marker-end="url(#ar)"/><line class="ln" x1="388" y1="163" x2="436" y2="163" marker-end="url(#ar)"/><line class="ln" x1="572" y1="163" x2="620" y2="163" marker-end="url(#ar)"/><line class="ln" x1="505" y1="188" x2="505" y2="292" marker-end="url(#ar)"/><line class="ln" x1="572" y1="319" x2="620" y2="319" marker-end="url(#ar)"/><line class="ln" x1="689" y1="294" x2="689" y2="190" marker-end="url(#ar)"/><rect class="bb" x="199" y="129" width="60" height="22" rx="11" stroke-width="1.2"/><text class="badt" x="229" y="145" text-anchor="middle" style="font-size:13px;letter-spacing:1px">STID</text><rect class="bb" x="180.5" y="236" width="27" height="22" rx="11" stroke-width="1.2"/><text class="badt" x="194" y="252" text-anchor="middle" style="font-size:13px;letter-spacing:1px">S</text><rect class="bb" x="393" y="129" width="38" height="22" rx="11" stroke-width="1.2"/><text class="badt" x="412" y="145" text-anchor="middle" style="font-size:13px;letter-spacing:1px">SE</text><rect class="bb" x="486" y="205" width="38" height="22" rx="11" stroke-width="1.2"/><text class="badt" x="505" y="221" text-anchor="middle" style="font-size:13px;letter-spacing:1px">ER</text><rect class="bb" x="577" y="129" width="38" height="22" rx="11" stroke-width="1.2"/><text class="badt" x="596" y="145" text-anchor="middle" style="font-size:13px;letter-spacing:1px">TI</text><rect class="bb" x="451" y="244" width="38" height="22" rx="11" stroke-width="1.2"/><text class="badt" x="470" y="260" text-anchor="middle" style="font-size:13px;letter-spacing:1px">TI</text><rect class="bb" x="577" y="285" width="38" height="22" rx="11" stroke-width="1.2"/><text class="badt" x="596" y="301" text-anchor="middle" style="font-size:13px;letter-spacing:1px">ST</text><rect class="bb" x="701" y="234" width="38" height="22" rx="11" stroke-width="1.2"/><text class="badt" x="720" y="250" text-anchor="middle" style="font-size:13px;letter-spacing:1px">TR</text><text class="badt" x="28" y="418" style="font-size:14px">S</text><text class="sub" x="42" y="418">Spoofing</text><text class="badt" x="115.6" y="418" style="font-size:14px">T</text><text class="sub" x="129.6" y="418">Tampering</text><text class="badt" x="210.4" y="418" style="font-size:14px">R</text><text class="sub" x="224.4" y="418">Repudiation</text><text class="badt" x="319.6" y="418" style="font-size:14px">I</text><text class="sub" x="333.6" y="418">Info disclosure</text><text class="badt" x="457.6" y="418" style="font-size:14px">D</text><text class="sub" x="471.6" y="418">DoS</text><text class="badt" x="509.2" y="418" style="font-size:14px">E</text><text class="sub" x="523.2" y="418">Elevation</text><text class="sm" x="28" y="446">Badges cluster on arrows that cross a dashed line: start there.</text>
</svg>
