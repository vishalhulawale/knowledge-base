  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="454" rx="14"/>
  <text class="h" x="28" y="40">One canary gate, three windows, three decisions</text><text class="sub" x="28" y="62">canary_gate.py compares canary with stable over the same window. Numbers from the page's example.</text><rect class="bm" x="28" y="80" width="112" height="28" rx="14"/><text class="sm" x="84" y="99" text-anchor="middle">Window 1</text><g class="k f0"><rect class="pri" x="28" y="80" width="112" height="28" rx="14"/><text class="on13" x="84" y="99" text-anchor="middle">Window 1</text></g><rect class="bm" x="150" y="80" width="112" height="28" rx="14"/><text class="sm" x="206" y="99" text-anchor="middle">Window 2</text><g class="k f1"><rect class="pri" x="150" y="80" width="112" height="28" rx="14"/><text class="on13" x="206" y="99" text-anchor="middle">Window 2</text></g><rect class="bm" x="272" y="80" width="112" height="28" rx="14"/><text class="sm" x="328" y="99" text-anchor="middle">Window 3</text><g class="k f2"><rect class="pri" x="272" y="80" width="112" height="28" rx="14"/><text class="on13" x="328" y="99" text-anchor="middle">Window 3</text></g><text class="sub" x="40" y="140" font-weight="700">Gate</text><text class="sub" x="196" y="140" font-weight="700">Rule (vs stable)</text><text class="sub" x="384" y="140" font-weight="700">Stable</text><text class="sub" x="504" y="140" font-weight="700">Canary</text><text class="sub" x="624" y="140" font-weight="700">Result</text><line class="grid" x1="28" y1="148" x2="772" y2="148"/><text class="sm" x="40" y="174" font-weight="700">Sample size</text><text class="sm" x="196" y="174">≥ 500 requests</text><text class="mono" x="384" y="174" xml:space="preserve">18,000</text><g class="k f0"><text class="mono" x="504" y="174" xml:space="preserve">300</text><rect class="bw" x="624" y="157" width="140" height="24" rx="12" stroke-width="1.2"/><text class="wrnt" x="694" y="174" text-anchor="middle" style="font-size:13px">too few</text></g><g class="k f1"><text class="mono" x="504" y="174" xml:space="preserve">2,000</text><rect class="bo" x="624" y="157" width="140" height="24" rx="12" stroke-width="1.2"/><text class="okt" x="694" y="174" text-anchor="middle" style="font-size:13px">pass</text></g><g class="k f2"><text class="mono" x="504" y="174" xml:space="preserve">2,000</text><rect class="bo" x="624" y="157" width="140" height="24" rx="12" stroke-width="1.2"/><text class="okt" x="694" y="174" text-anchor="middle" style="font-size:13px">pass</text></g><text class="sm" x="40" y="210" font-weight="700">Error rate</text><text class="sm" x="196" y="210">≤ +0.5 pt</text><text class="mono" x="384" y="210" xml:space="preserve">0.20%</text><g class="k f0"><text class="mono" x="504" y="210" xml:space="preserve">0.00%</text><rect class="bm" x="624" y="193" width="140" height="24" rx="12" stroke-width="1.2"/><text class="sub" x="694" y="210" text-anchor="middle" style="font-size:13px">not judged</text></g><g class="k f1"><text class="mono" x="504" y="210" xml:space="preserve">0.25%</text><rect class="bo" x="624" y="193" width="140" height="24" rx="12" stroke-width="1.2"/><text class="okt" x="694" y="210" text-anchor="middle" style="font-size:13px">pass</text></g><g class="k f2"><text class="mono" x="504" y="210" xml:space="preserve">0.20%</text><rect class="bo" x="624" y="193" width="140" height="24" rx="12" stroke-width="1.2"/><text class="okt" x="694" y="210" text-anchor="middle" style="font-size:13px">pass</text></g><text class="sm" x="40" y="246" font-weight="700">p95 latency</text><text class="sm" x="196" y="246">≤ 1.20× (5,040 ms)</text><text class="mono" x="384" y="246" xml:space="preserve">4,200 ms</text><g class="k f0"><text class="mono" x="504" y="246" xml:space="preserve">3,900 ms</text><rect class="bm" x="624" y="229" width="140" height="24" rx="12" stroke-width="1.2"/><text class="sub" x="694" y="246" text-anchor="middle" style="font-size:13px">not judged</text></g><g class="k f1"><text class="mono" x="504" y="246" xml:space="preserve">4,400 ms</text><rect class="bo" x="624" y="229" width="140" height="24" rx="12" stroke-width="1.2"/><text class="okt" x="694" y="246" text-anchor="middle" style="font-size:13px">pass</text></g><g class="k f2"><text class="mono" x="504" y="246" xml:space="preserve">4,300 ms</text><rect class="bo" x="624" y="229" width="140" height="24" rx="12" stroke-width="1.2"/><text class="okt" x="694" y="246" text-anchor="middle" style="font-size:13px">pass</text></g><text class="sm" x="40" y="282" font-weight="700">Eval pass rate</text><text class="sm" x="196" y="282">drop ≤ 2 pts</text><text class="mono" x="384" y="282" xml:space="preserve">94.0%</text><g class="k f0"><text class="mono" x="504" y="282" xml:space="preserve">95.0%</text><rect class="bm" x="624" y="265" width="140" height="24" rx="12" stroke-width="1.2"/><text class="sub" x="694" y="282" text-anchor="middle" style="font-size:13px">not judged</text></g><g class="k f1"><text class="mono" x="504" y="282" xml:space="preserve">93.5%</text><rect class="bo" x="624" y="265" width="140" height="24" rx="12" stroke-width="1.2"/><text class="okt" x="694" y="282" text-anchor="middle" style="font-size:13px">pass</text></g><g class="k f2"><text class="mono" x="504" y="282" xml:space="preserve">90.0%</text><rect class="bb" x="624" y="265" width="140" height="24" rx="12" stroke-width="1.2"/><text class="badt" x="694" y="282" text-anchor="middle" style="font-size:13px">FAIL −4 pts</text></g><text class="sm" x="40" y="318" font-weight="700">Cost per task</text><text class="sm" x="196" y="318">≤ 1.15× ($0.0357)</text><text class="mono" x="384" y="318" xml:space="preserve">$0.031</text><g class="k f0"><text class="mono" x="504" y="318" xml:space="preserve">$0.030</text><rect class="bm" x="624" y="301" width="140" height="24" rx="12" stroke-width="1.2"/><text class="sub" x="694" y="318" text-anchor="middle" style="font-size:13px">not judged</text></g><g class="k f1"><text class="mono" x="504" y="318" xml:space="preserve">$0.032</text><rect class="bo" x="624" y="301" width="140" height="24" rx="12" stroke-width="1.2"/><text class="okt" x="694" y="318" text-anchor="middle" style="font-size:13px">pass</text></g><g class="k f2"><text class="mono" x="504" y="318" xml:space="preserve">$0.041</text><rect class="bb" x="624" y="301" width="140" height="24" rx="12" stroke-width="1.2"/><text class="badt" x="694" y="318" text-anchor="middle" style="font-size:13px">FAIL 1.32×</text></g><g class="k f0"><rect class="bw" x="28" y="352" width="744" height="56" rx="10" stroke-width="1.5"/><text class="wrnt" x="48" y="386" style="font-size:18px">HOLD</text><text class="sm" x="170" y="385">Only 300 canary requests; need 500. Wait, don't guess.</text></g><g class="k f1"><rect class="bo" x="28" y="352" width="744" height="56" rx="10" stroke-width="1.5"/><text class="okt" x="48" y="386" style="font-size:18px">PROMOTE</text><text class="sm" x="170" y="385">All gates passed: move to the next stage.</text></g><g class="k f2"><rect class="bb" x="28" y="352" width="744" height="56" rx="10" stroke-width="1.5"/><text class="badt" x="48" y="386" style="font-size:18px">ROLLBACK</text><text class="sm" x="170" y="376">No errors, latency fine, yet quality and cost regressed.</text><text class="sm" x="170" y="396">An error-rate-only gate would have promoted this release.</text></g><text class="sm" x="28" y="436">Gate on quality and cost as well as errors and latency, relative to the baseline, with a minimum sample.</text>
</svg>
