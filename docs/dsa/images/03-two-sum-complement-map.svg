<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Two sum with a complement map</title>
  <desc id="d">Array 3, 8, 4, 11, 6 with target 10. For each element the code looks up target minus the element in a map of values already seen, then inserts the element. 3 needs 7: not seen, store 3 at 0. 8 needs 2: not seen, store 8 at 1. 4 needs 6: not seen, store 4 at 2. 11 needs -1: not seen, store 11 at 3. 6 needs 4: found at index 2, so the answer is indices 2 and 4, in one pass.</desc>
  <style>.card{fill:#f8fafc;stroke:#e2e8f0}
.h{fill:#0f172a;font-size:19px;font-weight:700}
.t{fill:#334155;font-size:14px}
.tb{fill:#334155;font-size:14px;font-weight:700}
.lb{fill:#334155;font-size:15px;font-weight:600}
.m{fill:#64748b;font-size:13px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.box{fill:#ffffff;stroke:#cbd5e1}
.pri{fill:#4f46e5}.spri{stroke:#4f46e5}.tpri{fill:#4f46e5}
.tea{fill:#0ea5a4}.stea{stroke:#0ea5a4}.ttea{fill:#0f766e}
.ok{fill:#16a34a}.sok{stroke:#16a34a}.tok{fill:#16a34a}
.bad{fill:#dc2626}.sbad{stroke:#dc2626}.tbad{fill:#dc2626}
.warn{fill:#d97706}.swarn{stroke:#d97706}.twarn{fill:#d97706}
.smut{stroke:#94a3b8}.mut{fill:#94a3b8}
.tint{fill:#4f46e5;fill-opacity:.14}.ttint{fill:#0ea5a4;fill-opacity:.16}
.gtint{fill:#16a34a;fill-opacity:.16}.rtint{fill:#dc2626;fill-opacity:.14}.atint{fill:#d97706;fill-opacity:.16}
.on{fill:#ffffff;font-size:14px;font-weight:700}
.ln{fill:none;stroke-width:2}
.ah{stroke:none}
@media (prefers-color-scheme: dark){
.card{fill:#1f2430;stroke:#334155}
.h{fill:#f1f5f9}.t,.tb,.lb{fill:#e2e8f0}.m{fill:#94a3b8}
.box{fill:#111827;stroke:#475569}
.pri,.tint{fill:#818cf8}.spri{stroke:#818cf8}.tpri{fill:#818cf8}
.tea,.ttint{fill:#2dd4bf}.stea{stroke:#2dd4bf}.ttea{fill:#5eead4}
.ok,.gtint{fill:#4ade80}.sok{stroke:#4ade80}.tok{fill:#4ade80}
.bad,.rtint{fill:#f87171}.sbad{stroke:#f87171}.tbad{fill:#f87171}
.warn,.atint{fill:#fbbf24}.swarn{stroke:#fbbf24}.twarn{fill:#fbbf24}
.smut{stroke:#64748b}.mut{fill:#64748b}
.on{fill:#0f172a}
}
.fr{opacity:0;animation-duration:11.4s;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes k0{0%,15.73%{opacity:1}16.33%,100%{opacity:0}}.f0{animation-name:k0}
@keyframes k1{0%,16.33%{opacity:0}16.93%,32.05%{opacity:1}32.65%,100%{opacity:0}}.f1{animation-name:k1}
@keyframes k2{0%,32.65%{opacity:0}33.25%,48.38%{opacity:1}48.98%,100%{opacity:0}}.f2{animation-name:k2}
@keyframes k3{0%,48.98%{opacity:0}49.58%,64.71%{opacity:1}65.31%,100%{opacity:0}}.f3{animation-name:k3}
@keyframes k4{0%,65.31%{opacity:0}65.91%,99.40%{opacity:1}100%{opacity:0}}.f4{animation-name:k4}
@media (prefers-reduced-motion: reduce){.fr{animation:none!important;opacity:0}.f4{opacity:1}}</style>
  <rect class="card" x="1" y="1" width="798" height="318" rx="14"/>
  <text class="h" x="28" y="40">Two sum in one pass (target = 10)</text>
  <text class="m" x="28" y="62">Look up the complement first, then insert the current value: no element pairs with itself.</text>
  <text class="m" x="70" y="102" text-anchor="middle">[0]</text>
  <text class="m" x="140" y="102" text-anchor="middle">[1]</text>
  <text class="m" x="210" y="102" text-anchor="middle">[2]</text>
  <text class="m" x="280" y="102" text-anchor="middle">[3]</text>
  <text class="m" x="350" y="102" text-anchor="middle">[4]</text>
  <text class="m" x="440" y="100">indexOf map (value → index)</text>
  <g class="fr f0"><rect class="pri" x="40" y="112" width="60" height="48" rx="8"/><text class="on" x="70" y="143" text-anchor="middle">3</text><rect class="box" x="110" y="112" width="60" height="48" rx="8"/><text class="lb" x="140" y="143" text-anchor="middle">8</text><rect class="box" x="180" y="112" width="60" height="48" rx="8"/><text class="lb" x="210" y="143" text-anchor="middle">4</text><rect class="box" x="250" y="112" width="60" height="48" rx="8"/><text class="lb" x="280" y="143" text-anchor="middle">11</text><rect class="box" x="320" y="112" width="60" height="48" rx="8"/><text class="lb" x="350" y="143" text-anchor="middle">6</text><line class="ln spri" stroke-width="2" x1="70" y1="204" x2="70" y2="176"/><path class="ah pri" d="M70.0,168.0 L74.0,176.0 L66.0,176.0 Z"/><text class="tb" x="70" y="222" text-anchor="middle">i</text><text class="m" x="440" y="132">(empty)</text><text class="lb" x="40" y="254">a[0] = 3, need 10 − 3 = 7.</text><text class="t" x="40" y="280">7 not in the map, so put 3 → 0 and move on.</text></g>
  <g class="fr f1"><rect class="card" x="40" y="112" width="60" height="48" rx="8"/><text class="m" x="70" y="143" text-anchor="middle">3</text><rect class="pri" x="110" y="112" width="60" height="48" rx="8"/><text class="on" x="140" y="143" text-anchor="middle">8</text><rect class="box" x="180" y="112" width="60" height="48" rx="8"/><text class="lb" x="210" y="143" text-anchor="middle">4</text><rect class="box" x="250" y="112" width="60" height="48" rx="8"/><text class="lb" x="280" y="143" text-anchor="middle">11</text><rect class="box" x="320" y="112" width="60" height="48" rx="8"/><text class="lb" x="350" y="143" text-anchor="middle">6</text><line class="ln spri" stroke-width="2" x1="140" y1="204" x2="140" y2="176"/><path class="ah pri" d="M140.0,168.0 L144.0,176.0 L136.0,176.0 Z"/><text class="tb" x="140" y="222" text-anchor="middle">i</text><rect class="box" x="440" y="112" width="94" height="32" rx="6"/><text class="t" x="487" y="133" text-anchor="middle">3 → 0</text><text class="lb" x="40" y="254">a[1] = 8, need 10 − 8 = 2.</text><text class="t" x="40" y="280">2 not in the map, so put 8 → 1 and move on.</text></g>
  <g class="fr f2"><rect class="card" x="40" y="112" width="60" height="48" rx="8"/><text class="m" x="70" y="143" text-anchor="middle">3</text><rect class="card" x="110" y="112" width="60" height="48" rx="8"/><text class="m" x="140" y="143" text-anchor="middle">8</text><rect class="pri" x="180" y="112" width="60" height="48" rx="8"/><text class="on" x="210" y="143" text-anchor="middle">4</text><rect class="box" x="250" y="112" width="60" height="48" rx="8"/><text class="lb" x="280" y="143" text-anchor="middle">11</text><rect class="box" x="320" y="112" width="60" height="48" rx="8"/><text class="lb" x="350" y="143" text-anchor="middle">6</text><line class="ln spri" stroke-width="2" x1="210" y1="204" x2="210" y2="176"/><path class="ah pri" d="M210.0,168.0 L214.0,176.0 L206.0,176.0 Z"/><text class="tb" x="210" y="222" text-anchor="middle">i</text><rect class="box" x="440" y="112" width="94" height="32" rx="6"/><text class="t" x="487" y="133" text-anchor="middle">3 → 0</text><rect class="box" x="544" y="112" width="94" height="32" rx="6"/><text class="t" x="591" y="133" text-anchor="middle">8 → 1</text><text class="lb" x="40" y="254">a[2] = 4, need 10 − 4 = 6.</text><text class="t" x="40" y="280">6 not in the map, so put 4 → 2 and move on.</text></g>
  <g class="fr f3"><rect class="card" x="40" y="112" width="60" height="48" rx="8"/><text class="m" x="70" y="143" text-anchor="middle">3</text><rect class="card" x="110" y="112" width="60" height="48" rx="8"/><text class="m" x="140" y="143" text-anchor="middle">8</text><rect class="card" x="180" y="112" width="60" height="48" rx="8"/><text class="m" x="210" y="143" text-anchor="middle">4</text><rect class="pri" x="250" y="112" width="60" height="48" rx="8"/><text class="on" x="280" y="143" text-anchor="middle">11</text><rect class="box" x="320" y="112" width="60" height="48" rx="8"/><text class="lb" x="350" y="143" text-anchor="middle">6</text><line class="ln spri" stroke-width="2" x1="280" y1="204" x2="280" y2="176"/><path class="ah pri" d="M280.0,168.0 L284.0,176.0 L276.0,176.0 Z"/><text class="tb" x="280" y="222" text-anchor="middle">i</text><rect class="box" x="440" y="112" width="94" height="32" rx="6"/><text class="t" x="487" y="133" text-anchor="middle">3 → 0</text><rect class="box" x="544" y="112" width="94" height="32" rx="6"/><text class="t" x="591" y="133" text-anchor="middle">8 → 1</text><rect class="box" x="648" y="112" width="94" height="32" rx="6"/><text class="t" x="695" y="133" text-anchor="middle">4 → 2</text><text class="lb" x="40" y="254">a[3] = 11, need 10 − 11 = -1.</text><text class="t" x="40" y="280">-1 not in the map, so put 11 → 3 and move on.</text></g>
  <g class="fr f4"><rect class="card" x="40" y="112" width="60" height="48" rx="8"/><text class="m" x="70" y="143" text-anchor="middle">3</text><rect class="card" x="110" y="112" width="60" height="48" rx="8"/><text class="m" x="140" y="143" text-anchor="middle">8</text><rect class="ok" x="180" y="112" width="60" height="48" rx="8"/><text class="on" x="210" y="143" text-anchor="middle">4</text><rect class="card" x="250" y="112" width="60" height="48" rx="8"/><text class="m" x="280" y="143" text-anchor="middle">11</text><rect class="ok" x="320" y="112" width="60" height="48" rx="8"/><text class="on" x="350" y="143" text-anchor="middle">6</text><line class="ln spri" stroke-width="2" x1="350" y1="204" x2="350" y2="176"/><path class="ah pri" d="M350.0,168.0 L354.0,176.0 L346.0,176.0 Z"/><text class="tb" x="350" y="222" text-anchor="middle">i</text><rect class="box" x="440" y="112" width="94" height="32" rx="6"/><text class="t" x="487" y="133" text-anchor="middle">3 → 0</text><rect class="box" x="544" y="112" width="94" height="32" rx="6"/><text class="t" x="591" y="133" text-anchor="middle">8 → 1</text><rect class="ok" x="648" y="112" width="94" height="32" rx="6"/><text class="on" x="695" y="133" text-anchor="middle">4 → 2</text><rect class="box" x="440" y="152" width="94" height="32" rx="6"/><text class="t" x="487" y="173" text-anchor="middle">11 → 3</text><text class="lb" x="40" y="254">a[4] = 6, need 10 − 6 = 4.</text><text class="tok" x="40" y="280" font-weight="700">4 is in the map at index 2: return [2, 4].</text></g>
  <text class="m" x="40" y="304">Each lookup and insert is O(1) expected, so the whole scan is O(n) time and O(n) space.</text>
</svg>
