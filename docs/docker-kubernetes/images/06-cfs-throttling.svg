<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">CFS throttling: a CPU limit is a quota per 100 ms</title>
  <desc id="d">A container with a CPU limit of 1 core runs a JVM with 4 busy threads on a 4-core node. Each 100 ms period it may use 100 ms of CPU time in total. The four threads burn that quota together in the first 25 ms, then every thread is paused for the remaining 75 ms of the period. A request that needed 40 ms of work therefore takes about 115 ms of wall-clock time, spread over two periods, even though average CPU use looks like only 25 percent of the node. Without a CPU limit the same request would finish in 40 ms.</desc>
