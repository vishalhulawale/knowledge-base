  <g class="a s5"><circle class="pri" cx="170" cy="270" r="18"/><text class="on" x="170" y="275" text-anchor="middle">5</text><circle class="warn" cx="187" cy="254" r="11"/><text class="on" x="187" y="258.5" text-anchor="middle" font-size="13">6</text><text class="tb" x="196" y="322" text-anchor="middle" font-size="17" font-weight="700">5</text></g>
  <g class="a s6"><circle class="pri" cx="230" cy="270" r="18"/><text class="on" x="230" y="275" text-anchor="middle">7</text><circle class="warn" cx="247" cy="254" r="11"/><text class="on" x="247" y="258.5" text-anchor="middle" font-size="13">7</text><text class="tb" x="224" y="322" text-anchor="middle" font-size="17" font-weight="700">7</text></g>
  <line class="ln smut" x1="40" y1="332" x2="240" y2="332" stroke-width="1"/>
  <text class="lb" x="400" y="100" text-anchor="middle">In-order</text>
  <text class="m" x="400" y="120" text-anchor="middle">(left, node, right)</text>
  <line class="ln smut" x1="400" y1="160" x2="340" y2="215"/>
  <line class="ln smut" x1="400" y1="160" x2="460" y2="215"/>
  <line class="ln smut" x1="340" y1="215" x2="310" y2="270"/>
  <line class="ln smut" x1="340" y1="215" x2="370" y2="270"/>
  <line class="ln smut" x1="460" y1="215" x2="430" y2="270"/>
  <line class="ln smut" x1="460" y1="215" x2="490" y2="270"/>
  <circle class="box" cx="400" cy="160" r="18"/>
  <text class="lb" x="400" y="165" text-anchor="middle">4</text>
  <circle class="box" cx="340" cy="215" r="18"/>
  <text class="lb" x="340" y="220" text-anchor="middle">2</text>
  <circle class="box" cx="460" cy="215" r="18"/>
  <text class="lb" x="460" y="220" text-anchor="middle">6</text>
  <circle class="box" cx="310" cy="270" r="18"/>
  <text class="lb" x="310" y="275" text-anchor="middle">1</text>
  <circle class="box" cx="370" cy="270" r="18"/>
  <text class="lb" x="370" y="275" text-anchor="middle">3</text>
  <circle class="box" cx="430" cy="270" r="18"/>
  <text class="lb" x="430" y="275" text-anchor="middle">5</text>
  <circle class="box" cx="490" cy="270" r="18"/>
  <text class="lb" x="490" y="275" text-anchor="middle">7</text>
  <g class="a s0"><circle class="tea" cx="310" cy="270" r="18"/><text class="on" x="310" y="275" text-anchor="middle">1</text><circle class="warn" cx="327" cy="254" r="11"/><text class="on" x="327" y="258.5" text-anchor="middle" font-size="13">1</text><text class="ttea" x="316" y="322" text-anchor="middle" font-size="17" font-weight="700">1</text></g>
  <g class="a s1"><circle class="tea" cx="340" cy="215" r="18"/><text class="on" x="340" y="220" text-anchor="middle">2</text><circle class="warn" cx="357" cy="199" r="11"/><text class="on" x="357" y="203.5" text-anchor="middle" font-size="13">2</text><text class="ttea" x="344" y="322" text-anchor="middle" font-size="17" font-weight="700">2</text></g>
  <g class="a s2"><circle class="tea" cx="370" cy="270" r="18"/><text class="on" x="370" y="275" text-anchor="middle">3</text><circle class="warn" cx="387" cy="254" r="11"/><text class="on" x="387" y="258.5" text-anchor="middle" font-size="13">3</text><text class="ttea" x="372" y="322" text-anchor="middle" font-size="17" font-weight="700">3</text></g>
  <g class="a s3"><circle class="tea" cx="400" cy="160" r="18"/><text class="on" x="400" y="165" text-anchor="middle">4</text><circle class="warn" cx="417" cy="144" r="11"/><text class="on" x="417" y="148.5" text-anchor="middle" font-size="13">4</text><text class="ttea" x="400" y="322" text-anchor="middle" font-size="17" font-weight="700">4</text></g>
  <g class="a s4"><circle class="tea" cx="430" cy="270" r="18"/><text class="on" x="430" y="275" text-anchor="middle">5</text><circle class="warn" cx="447" cy="254" r="11"/><text class="on" x="447" y="258.5" text-anchor="middle" font-size="13">5</text><text class="ttea" x="428" y="322" text-anchor="middle" font-size="17" font-weight="700">5</text></g>
  <g class="a s5"><circle class="tea" cx="460" cy="215" r="18"/><text class="on" x="460" y="220" text-anchor="middle">6</text><circle class="warn" cx="477" cy="199" r="11"/><text class="on" x="477" y="203.5" text-anchor="middle" font-size="13">6</text><text class="ttea" x="456" y="322" text-anchor="middle" font-size="17" font-weight="700">6</text></g>
  <g class="a s6"><circle class="tea" cx="490" cy="270" r="18"/><text class="on" x="490" y="275" text-anchor="middle">7</text><circle class="warn" cx="507" cy="254" r="11"/><text class="on" x="507" y="258.5" text-anchor="middle" font-size="13">7</text><text class="ttea" x="484" y="322" text-anchor="middle" font-size="17" font-weight="700">7</text></g>
  <line class="ln smut" x1="300" y1="332" x2="500" y2="332" stroke-width="1"/>
  <text class="lb" x="660" y="100" text-anchor="middle">Post-order</text>
  <text class="m" x="660" y="120" text-anchor="middle">(left, right, node)</text>
  <line class="ln smut" x1="660" y1="160" x2="600" y2="215"/>
  <line class="ln smut" x1="660" y1="160" x2="720" y2="215"/>
  <line class="ln smut" x1="600" y1="215" x2="570" y2="270"/>
