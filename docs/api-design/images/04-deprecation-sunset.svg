<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Deprecation to sunset</title>
  <desc id="d">A timeline for retiring API v1 over six months. At announcement v1 responses start carrying Deprecation, Sunset and Link headers, and its traffic share is 100 percent. Usage is measured per client and owners are contacted, so the share falls through 60, 25 and 8 percent. Short brownouts in month 5 make forgotten clients surface. At the sunset date v1 answers 410 Gone with a problem body linking to the migration guide, once usage has reached zero.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .s1{stroke:#4f46e5;stroke-width:2.5;fill:none}.ar{fill:#4f46e5;opacity:.12}.gl{stroke:#e2e8f0;stroke-width:1}@media (prefers-color-scheme: dark){.s1{stroke:#6366f1}.ar{fill:#6366f1}.gl{stroke:#334155}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Retiring v1 over six months</text>
  <text class="sub" x="28" y="62">Illustrative usage curve. Headers: Deprecation (RFC 9745), Sunset (RFC 8594).</text>
  <line class="gl" x1="90" x2="750" y1="260.0" y2="260.0"/>
  <text class="sm" x="82" y="264" text-anchor="end">0%</text>
  <line class="gl" x1="90" x2="750" y1="180.0" y2="180.0"/>
  <text class="sm" x="82" y="184" text-anchor="end">50%</text>
  <line class="gl" x1="90" x2="750" y1="100.0" y2="100.0"/>
  <text class="sm" x="82" y="104" text-anchor="end">100%</text>
  <polygon class="ar" points="90.0,100.0 200.0,124.0 310.0,164.0 420.0,220.0 530.0,247.2 640.0,256.8 750.0,260.0 750.0,260.0 90.0,260.0"/>
  <polyline class="s1" points="90.0,100.0 200.0,124.0 310.0,164.0 420.0,220.0 530.0,247.2 640.0,256.8 750.0,260.0"/>
  <text class="sm" x="100" y="92">v1 share of traffic</text>
  <line class="ln dash" x1="90.0" x2="90.0" y1="100" y2="260" style="stroke-width:1"/>
  <text class="sm" x="90" y="280" text-anchor="start" font-weight="700">announce + headers</text>
  <line class="ln dash" x1="310.0" x2="310.0" y1="100" y2="260" style="stroke-width:1"/>
  <text class="sm" x="310" y="280" text-anchor="middle" font-weight="700">contact owners</text>
  <line class="ln dash" x1="596.0" x2="596.0" y1="100" y2="260" style="stroke-width:1"/>
  <text class="sm" x="596" y="280" text-anchor="middle" font-weight="700">brownouts</text>
  <line class="ln dash" x1="750.0" x2="750.0" y1="100" y2="260" style="stroke-width:1"/>
  <text class="sm" x="750" y="280" text-anchor="end" font-weight="700">410 Gone</text>
  <text class="sm" x="90" y="298" text-anchor="start">month 0</text>
  <text class="sm" x="200" y="298" text-anchor="middle">month 1</text>
  <text class="sm" x="310" y="298" text-anchor="middle">month 2</text>
  <text class="sm" x="420" y="298" text-anchor="middle">month 3</text>
  <text class="sm" x="530" y="298" text-anchor="middle">month 4</text>
  <text class="sm" x="640" y="298" text-anchor="middle">month 5</text>
  <text class="sm" x="750" y="298" text-anchor="end">month 6</text>
  <text class="sm prit" x="28" y="334">Deprecation: @1767225600 · Sunset: Thu, 31 Dec 2026 23:59:59 GMT · Link: &lt;…/migrate/v2&gt;</text>
  <text class="sub" x="28" y="360">Remove on a measurement (zero calls per client id), not just on the calendar.</text>
</svg>
