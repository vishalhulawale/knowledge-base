<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Deadline propagation</title>
  <desc id="d">Animation: a gateway sets a 300 millisecond deadline and calls Service A. A spends 80 milliseconds and calls Service B with a grpc-timeout of 220 milliseconds. B spends 150 milliseconds and calls Service C with 70 milliseconds left, but C's query needs 120 milliseconds, so the budget runs out. At 300 milliseconds the gateway receives DEADLINE_EXCEEDED, and cancellation flows down so Services A, B and C each see CANCELLED and stop their work. The times are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes a1{0%,1.99%{opacity:0}2%,100%{opacity:1}}.a1{animation-name:a1}
    @keyframes a2{0%,15.99%{opacity:0}16%,100%{opacity:1}}.a2{animation-name:a2}
    @keyframes a3{0%,33.99%{opacity:0}34%,100%{opacity:1}}.a3{animation-name:a3}
    @keyframes a4{0%,51.99%{opacity:0}52%,100%{opacity:1}}.a4{animation-name:a4}
    @keyframes a5{0%,61.99%{opacity:0}62%,100%{opacity:1}}.a5{animation-name:a5}
    @keyframes a6{0%,13.99%{opacity:0}14%,100%{opacity:1}}.a6{animation-name:a6}
    @keyframes a7{0%,31.99%{opacity:0}32%,100%{opacity:1}}.a7{animation-name:a7}
    @keyframes a8{0%,49.99%{opacity:0}50%,100%{opacity:1}}.a8{animation-name:a8}
    @keyframes a9{0%,69.99%{opacity:0}70%,100%{opacity:1}}.a9{animation-name:a9}
    @keyframes a10{0%,79.99%{opacity:0}80%,100%{opacity:1}}.a10{animation-name:a10}
    @keyframes a11{0%,84.99%{opacity:0}85%,100%{opacity:1}}.a11{animation-name:a11}
    @keyframes a12{0%,89.99%{opacity:0}90%,100%{opacity:1}}.a12{animation-name:a12}
    @keyframes a13{0%,79.99%{opacity:0}80%,100%{opacity:1}}.a13{animation-name:a13}
    @keyframes a14{0%,15.99%{opacity:1}16%,100%{opacity:0}}.a14{animation-name:a14}
    @keyframes a15{0%,15.99%{opacity:0}16%,33.99%{opacity:1}34%,100%{opacity:0}}.a15{animation-name:a15}
    @keyframes a16{0%,33.99%{opacity:0}34%,51.99%{opacity:1}52%,100%{opacity:0}}.a16{animation-name:a16}
    @keyframes a17{0%,51.99%{opacity:0}52%,69.99%{opacity:1}70%,100%{opacity:0}}.a17{animation-name:a17}
    @keyframes a18{0%,69.99%{opacity:0}70%,79.99%{opacity:1}80%,100%{opacity:0}}.a18{animation-name:a18}
    @keyframes a19{0%,79.99%{opacity:0}80%,100%{opacity:1}}.a19{animation-name:a19}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}.a14{opacity:0}.a15{opacity:0}.a16{opacity:0}.a17{opacity:0}.a18{opacity:0}.a19{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="468" rx="14"/>
  <text class="h" x="28" y="40">A deadline is a shrinking budget</text><text class="sub" x="28" y="62">The gateway allows 300 ms for the whole call tree. Times are illustrative.</text><rect class="box" x="28" y="84" width="144" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="100" y="113" text-anchor="middle">Gateway</text><rect class="box" x="228" y="84" width="144" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="300" y="113" text-anchor="middle">Service A</text><rect class="box" x="428" y="84" width="144" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="500" y="113" text-anchor="middle">Service B</text><rect class="box" x="628" y="84" width="144" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="700" y="113" text-anchor="middle">Service C</text><text class="sub" x="28" y="158">budget received (outline) and time used (fill)</text><rect class="bm" x="28" y="170" width="144" height="26" rx="5" stroke-width="1" stroke-dasharray="4 3"/><g class="k a1"><rect class="bo" x="28" y="170" width="144" height="26" rx="5" stroke-width="1.5"/><text class="sm" x="100" y="188" text-anchor="middle" style="font-size:12px">now + 300 ms</text></g><rect class="bm" x="228" y="170" width="144" height="26" rx="5" stroke-width="1" stroke-dasharray="4 3"/><g class="k a2"><rect class="bo" x="228" y="170" width="144" height="26" rx="5" stroke-width="1.5"/><rect class="wrnf" x="228" y="170" width="38.4" height="26" rx="5"/><text class="sm" x="228" y="216" style="font-size:12px">300 ms in, 80 ms of work</text></g><rect class="bm" x="428" y="170" width="144" height="26" rx="5" stroke-width="1" stroke-dasharray="4 3"/><g class="k a3"><rect class="bo" x="428" y="170" width="105.6" height="26" rx="5" stroke-width="1.5"/><rect class="wrnf" x="428" y="170" width="72" height="26" rx="5"/><text class="sm" x="428" y="216" style="font-size:12px">220 ms in, 150 ms of work</text></g><rect class="bm" x="628" y="170" width="144" height="26" rx="5" stroke-width="1" stroke-dasharray="4 3"/><g class="k a4"><rect class="bo" x="628" y="170" width="33.6" height="26" rx="5" stroke-width="1.5"/><text class="sm" x="628" y="216" style="font-size:12px">70 ms in, query needs 120</text></g><g class="k a5"><rect class="wrnf" x="628" y="170" width="33.6" height="26" rx="5"/><rect class="bb" x="661.6" y="170" width="24" height="26" rx="5" stroke-width="1.5" stroke-dasharray="4 3"/><text class="badt" x="665.6" y="164" style="font-size:12px">over</text></g><g class="k a6"><line class="lnp" x1="174" y1="108" x2="224" y2="108" marker-end="url(#arp)"/><text class="prit" x="199" y="100" text-anchor="middle" style="font-size:12px">300m</text></g><g class="k a7"><line class="lnp" x1="374" y1="108" x2="424" y2="108" marker-end="url(#arp)"/><text class="prit" x="399" y="100" text-anchor="middle" style="font-size:12px">220m</text></g><g class="k a8"><line class="lnp" x1="574" y1="108" x2="624" y2="108" marker-end="url(#arp)"/><text class="prit" x="599" y="100" text-anchor="middle" style="font-size:12px">70m</text></g><text class="sub" x="28" y="266">grpc-timeout header on each hop = time remaining, so clock skew does not matter</text><g class="k a9"><path class="lnb" d="M700.0,294 L700.0,310 L100.0,310 L100.0,296" marker-end="url(#arb)"/><rect class="bb" x="258" y="322" width="330" height="30" rx="6" stroke-width="1.2"/><text class="badt" x="423" y="342" text-anchor="middle" style="font-size:14px">t = 300 ms: client gets DEADLINE_EXCEEDED</text></g><g class="k a10"><rect class="bw" x="228" y="372" width="144" height="44" rx="8" stroke-width="1.2"/><text class="wrnt" x="300" y="390" text-anchor="middle" style="font-size:13px">CANCELLED</text><text class="sm" x="300" y="407" text-anchor="middle" style="font-size:12px">stops its work</text></g><g class="k a11"><rect class="bw" x="428" y="372" width="144" height="44" rx="8" stroke-width="1.2"/><text class="wrnt" x="500" y="390" text-anchor="middle" style="font-size:13px">CANCELLED</text><text class="sm" x="500" y="407" text-anchor="middle" style="font-size:12px">stops its work</text></g><g class="k a12"><rect class="bw" x="628" y="372" width="144" height="44" rx="8" stroke-width="1.2"/><text class="wrnt" x="700" y="390" text-anchor="middle" style="font-size:13px">CANCELLED</text><text class="sm" x="700" y="407" text-anchor="middle" style="font-size:12px">stops its work</text></g><g class="k a13"><rect class="bm" x="28" y="372" width="144" height="44" rx="8" stroke-width="1"/><text class="sm" x="100" y="390" text-anchor="middle">caller has</text><text class="sm" x="100" y="406" text-anchor="middle">given up</text></g><g class="k a14"><text class="tx" x="28" y="448" style="font-size:14px">The gateway sets one deadline for the whole request.</text></g><g class="k a15"><text class="tx" x="28" y="448" style="font-size:14px">A spends 80 ms, then calls B with the 220 ms that remain.</text></g><g class="k a16"><text class="tx" x="28" y="448" style="font-size:14px">B spends 150 ms, so C receives only 70 ms.</text></g><g class="k a17"><text class="tx" x="28" y="448" style="font-size:14px">C's query needs 120 ms: it cannot finish in time.</text></g><g class="k a18"><text class="tx" x="28" y="448" style="font-size:14px">At 300 ms the gateway stops waiting and fails fast.</text></g><g class="k a19"><text class="tx" x="28" y="448" style="font-size:14px">Cancellation propagates down: nobody keeps working for a caller who left.</text></g>
</svg>
