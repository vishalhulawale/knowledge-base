<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Aggregation vs composition: what happens on delete</title>
  <desc id="d">Left, composition: an Order owns its three OrderLines. When the order is deleted, its lines are deleted with it; in JPA that&#x27;s cascade ALL with orphanRemoval. Right, aggregation: a Department refers to three Doctors that exist independently. When the department is deleted, the doctors remain and can join another department; there is no cascade.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:12s infinite linear}
    @keyframes p0{0%,33%{opacity:1}34%{opacity:0}100%{opacity:0}}
    .p0{animation-name:p0}
    @keyframes p1{0%{opacity:0}33%{opacity:0}34%,62%{opacity:1}63%{opacity:0}100%{opacity:0}}
    .p1{animation-name:p1}
    @keyframes p2{0%{opacity:0}62%{opacity:0}63%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p2{animation-name:p2}
    @keyframes p01{0%,62%{opacity:1}63%{opacity:0}100%{opacity:0}}
    .p01{animation-name:p01}
    @keyframes p12{0%{opacity:0}33%{opacity:0}34%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p12{animation-name:p12}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .p0,.p1,.p01{opacity:0!important}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Delete the whole: what happens to the parts?</text>
  <text class="sub" x="28" y="62">Composition owns its parts; aggregation only refers to them.</text>
  <line class="ln dash" x1="400" y1="84" x2="400" y2="320"/>
  <text class="h2" x="28" y="102">Composition</text>
  <g class="a p0">
  <rect class="bp" x="128" y="120" width="150" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="203" y="147" text-anchor="middle" font-weight="700">Order #42</text>
  </g>
  <g class="a p12">
  <rect class="bb" x="128" y="120" width="150" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="203" y="147" text-anchor="middle" font-weight="700">Order #42</text>
  </g>
  <text class="sm badt a p12" x="203" y="182" text-anchor="middle">deleted</text>
  <line class="ln a p0" x1="203" y1="164" x2="80" y2="226"/>
  <g class="a p01">
  <rect class="box" x="28" y="228" width="104" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="80" y="253" text-anchor="middle" font-weight="700">OrderLine 1</text>
  </g>
  <g class="a p2">
  <rect class="bb" x="28" y="228" width="104" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx badt" x="80" y="253" text-anchor="middle" font-weight="700">deleted</text>
  </g>
  <line class="ln a p0" x1="203" y1="164" x2="198" y2="226"/>
  <g class="a p01">
  <rect class="box" x="146" y="228" width="104" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="198" y="253" text-anchor="middle" font-weight="700">OrderLine 2</text>
  </g>
  <g class="a p2">
  <rect class="bb" x="146" y="228" width="104" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx badt" x="198" y="253" text-anchor="middle" font-weight="700">deleted</text>
  </g>
  <line class="ln a p0" x1="203" y1="164" x2="316" y2="226"/>
  <g class="a p01">
  <rect class="box" x="264" y="228" width="104" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="316" y="253" text-anchor="middle" font-weight="700">OrderLine 3</text>
  </g>
  <g class="a p2">
  <rect class="bb" x="264" y="228" width="104" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx badt" x="316" y="253" text-anchor="middle" font-weight="700">deleted</text>
  </g>
  <text class="sm badt a p2" x="28" y="300">lines die with the order (cascade, orphanRemoval)</text>
  <text class="h2" x="420" y="102">Aggregation</text>
  <g class="a p0">
  <rect class="bp" x="520" y="120" width="150" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="595" y="147" text-anchor="middle" font-weight="700">Cardiology</text>
  </g>
  <g class="a p12">
  <rect class="bb" x="520" y="120" width="150" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="595" y="147" text-anchor="middle" font-weight="700">Cardiology</text>
  </g>
  <text class="sm badt a p12" x="595" y="182" text-anchor="middle">deleted</text>
  <line class="ln a p0" x1="595" y1="164" x2="472" y2="226"/>
  <g class="a p01">
  <rect class="box" x="420" y="228" width="104" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="472" y="253" text-anchor="middle" font-weight="700">Dr Rao</text>
  </g>
  <g class="a p2">
  <rect class="bo" x="420" y="228" width="104" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="472" y="253" text-anchor="middle" font-weight="700">Dr Rao</text>
  </g>
  <line class="ln a p0" x1="595" y1="164" x2="590" y2="226"/>
  <g class="a p01">
  <rect class="box" x="538" y="228" width="104" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="590" y="253" text-anchor="middle" font-weight="700">Dr Kim</text>
  </g>
  <g class="a p2">
  <rect class="bo" x="538" y="228" width="104" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="590" y="253" text-anchor="middle" font-weight="700">Dr Kim</text>
  </g>
  <line class="ln a p0" x1="595" y1="164" x2="708" y2="226"/>
  <g class="a p01">
  <rect class="box" x="656" y="228" width="104" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="708" y="253" text-anchor="middle" font-weight="700">Dr Lee</text>
  </g>
  <g class="a p2">
  <rect class="bo" x="656" y="228" width="104" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="708" y="253" text-anchor="middle" font-weight="700">Dr Lee</text>
  </g>
  <text class="sm okt a p2" x="420" y="300">doctors remain; reassign them</text>
  <text class="lbl a p0" x="28" y="346">1  Both wholes exist</text>
  <text class="lbl a p1" x="28" y="346">2  delete(order) and delete(department)</text>
  <text class="lbl a p2" x="28" y="346">3  Owned parts go; shared parts stay</text>
  <text class="sub" x="28" y="378">If anything outside the whole may hold the part, it isn&#x27;t composition.</text>
</svg>
