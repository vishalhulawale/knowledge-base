<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 458" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">CORS preflight sequence</title>
  <desc id="d">Animation: steps appear one by one between three lifelines. The React app calls fetch with PUT. The browser sends an OPTIONS preflight with Origin and Access-Control-Request-Method. The API answers 204 with allowed origin, methods and a Max-Age of 3600. The browser caches the answer, sends the real PUT with Origin and Authorization, receives 200 with Access-Control-Allow-Origin and Vary Origin, and hands the response to the script.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes s0{0%,2.99%{opacity:0}3%,96.99%{opacity:1}97%,100%{opacity:0}}.s0{animation-name:s0}
    @keyframes s1{0%,14.99%{opacity:0}15%,96.99%{opacity:1}97%,100%{opacity:0}}.s1{animation-name:s1}
    @keyframes s2{0%,26.99%{opacity:0}27%,96.99%{opacity:1}97%,100%{opacity:0}}.s2{animation-name:s2}
    @keyframes s3{0%,38.99%{opacity:0}39%,96.99%{opacity:1}97%,100%{opacity:0}}.s3{animation-name:s3}
    @keyframes s4{0%,50.99%{opacity:0}51%,96.99%{opacity:1}97%,100%{opacity:0}}.s4{animation-name:s4}
    @keyframes s5{0%,62.99%{opacity:0}63%,96.99%{opacity:1}97%,100%{opacity:0}}.s5{animation-name:s5}
    @keyframes s6{0%,74.99%{opacity:0}75%,96.99%{opacity:1}97%,100%{opacity:0}}.s6{animation-name:s6}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="456" rx="14"/>
  <text class="h" x="28" y="40">A preflighted request, step by step</text><text class="sub" x="28" y="62">React app on app.example.com calls PUT on api.example.com with JSON and a bearer token.</text><rect class="box" x="30" y="80" width="160" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="110" y="102" text-anchor="middle" font-weight="700">React app</text><line class="grid" x1="110" y1="114" x2="110" y2="410" stroke-dasharray="4 4"/><rect class="bp" x="320" y="80" width="160" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="400" y="102" text-anchor="middle" font-weight="700">Browser</text><line class="grid" x1="400" y1="114" x2="400" y2="410" stroke-dasharray="4 4"/><rect class="box" x="610" y="80" width="160" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="690" y="102" text-anchor="middle" font-weight="700">api.example.com</text><line class="grid" x1="690" y1="114" x2="690" y2="410" stroke-dasharray="4 4"/><g class="k s0"><line class="lnp" x1="114" y1="146" x2="394" y2="146" marker-end="url(#arp)"/><text class="sm" x="255" y="139" text-anchor="middle" style="font-size:12px">fetch PUT /claims/42</text></g><g class="k s1"><line class="ln" x1="404" y1="184" x2="684" y2="184" marker-end="url(#ar)"/><text class="sm" x="545" y="177" text-anchor="middle" style="font-size:12px">OPTIONS  Origin + Request-Method PUT</text></g><g class="k s2"><line class="lnt" x1="686" y1="222" x2="406" y2="222" marker-end="url(#art)"/><text class="sm" x="545" y="215" text-anchor="middle" style="font-size:12px">204  Allow-Origin + Methods, Max-Age 3600</text></g><g class="k s3"><rect class="bw" x="305" y="244" width="190" height="28" rx="6"/><text class="sm" x="400" y="263" text-anchor="middle">cache preflight answer</text></g><g class="k s4"><line class="lnp" x1="404" y1="298" x2="684" y2="298" marker-end="url(#arp)"/><text class="sm" x="545" y="291" text-anchor="middle" style="font-size:12px">PUT /claims/42  Origin + Authorization</text></g><g class="k s5"><line class="lnt" x1="686" y1="336" x2="406" y2="336" marker-end="url(#art)"/><text class="sm" x="545" y="329" text-anchor="middle" style="font-size:12px">200  Allow-Origin + Vary: Origin</text></g><g class="k s6"><line class="lno" x1="396" y1="374" x2="116" y2="374" marker-end="url(#aro)"/><text class="sm" x="255" y="367" text-anchor="middle" style="font-size:12px">response readable by script</text></g><text class="sm" x="28" y="438">Within Max-Age the next PUT from this origin skips the OPTIONS round trip (Chromium caps it at 2 h).</text>
</svg>
