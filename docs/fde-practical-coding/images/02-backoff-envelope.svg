<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Backoff envelope and exits</title>
  <desc id="d">A bar chart of the maximum wait before retry n, min(20, 0.5 times 2 to the n) seconds: 0.5, 1, 2, 4, 8, 16 and 20, with a dot for one randomly sampled wait under each cap. The page's client uses only the first three waits because it makes four attempts. A Retry-After header from the server replaces the sampled wait. Three exit boxes: success on 2xx or 3xx; fail fast on 400, 403, 404 or 422, and after one token refresh on 401; and give up when attempts are used or the next wait would pass the 60-second deadline. Retried: transport errors, 408, 429, 500, 502, 503 and 504.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">One retry policy, three exits</text><text class="sub" x="28" y="62">The page's client: base 0.5 s, cap 20 s, 4 attempts (3 waits), 60 s total deadline.</text><text class="sm" x="28" y="92" font-weight="700">Wait before retry n: random(0, min(20, 0.5 × 2ⁿ)) seconds</text><rect class="bt" x="80" y="295.25" width="40" height="4.75" rx="4"/><circle class="tea" cx="100" cy="298.86966802131354" r="5"/><text class="sub" x="100" y="318" text-anchor="middle">n=0</text><text class="sub" x="100" y="289.25" text-anchor="middle">0.5</text><rect class="bt" x="136" y="290.5" width="40" height="9.5" rx="4"/><circle class="tea" cx="156" cy="294.8298223596885" r="5"/><text class="sub" x="156" y="318" text-anchor="middle">n=1</text><text class="sub" x="156" y="284.5" text-anchor="middle">1</text><rect class="bt" x="192" y="281" width="40" height="19" rx="4"/><circle class="tea" cx="212" cy="292.9708518355865" r="5"/><text class="sub" x="212" y="318" text-anchor="middle">n=2</text><text class="sub" x="212" y="275" text-anchor="middle">2</text><rect class="bm" x="248" y="262" width="40" height="38" rx="4" stroke-dasharray="4 3"/><circle class="mutf" cx="268" cy="277.0510385333446" r="5"/><text class="sub" x="268" y="318" text-anchor="middle">n=3</text><text class="sub" x="268" y="256" text-anchor="middle">4</text><rect class="bm" x="304" y="224" width="40" height="76" rx="4" stroke-dasharray="4 3"/><circle class="mutf" cx="324" cy="252.44525688778788" r="5"/><text class="sub" x="324" y="318" text-anchor="middle">n=4</text><text class="sub" x="324" y="218" text-anchor="middle">8</text><rect class="bm" x="360" y="148" width="40" height="152" rx="4" stroke-dasharray="4 3"/><circle class="mutf" cx="380" cy="290.03961339554843" r="5"/><text class="sub" x="380" y="318" text-anchor="middle">n=5</text><text class="sub" x="380" y="142" text-anchor="middle">16</text><rect class="bm" x="416" y="110" width="40" height="190" rx="4" stroke-dasharray="4 3"/><circle class="mutf" cx="436" cy="297.49808160457394" r="5"/><text class="sub" x="436" y="318" text-anchor="middle">n=6</text><text class="sub" x="436" y="104" text-anchor="middle">20</text><line class="ln" x1="74" y1="300" x2="472" y2="300"/><text class="teat" x="100" y="340" style="font-size:13px">used by this client</text><text class="sub" x="280" y="340">dashed: cap reached at 20 s</text><text class="sub" x="80" y="362">dot = one sampled wait; Retry-After from the server replaces it</text><rect class="bo" x="500" y="84" width="272" height="48" rx="10" stroke-width="1.5"/><text class="okt" x="514" y="106" style="font-size:14px">1. Success</text><text class="sm" x="514" y="126">2xx / 3xx: return</text><rect class="bb" x="500" y="144" width="272" height="84" rx="10" stroke-width="1.5"/><text class="badt" x="514" y="166" style="font-size:14px">2. Fail fast</text><text class="sm" x="514" y="186">400, 403, 404, 422: caller bug,</text><text class="sm" x="514" y="204">never retried. 401: refresh</text><text class="sm" x="514" y="222">the token once, then fail</text><rect class="bw" x="500" y="240" width="272" height="84" rx="10" stroke-width="1.5"/><text class="wrnt" x="514" y="262" style="font-size:14px">3. Give up</text><text class="sm" x="514" y="282">attempts used, or the next</text><text class="sm" x="514" y="300">wait would pass the 60 s</text><text class="sm" x="514" y="318">deadline: raise with context</text><text class="sm" x="500" y="350">Retried: transport errors, 408, 429,</text><text class="sm" x="500" y="368">500, 502, 503, 504.</text>
</svg>
