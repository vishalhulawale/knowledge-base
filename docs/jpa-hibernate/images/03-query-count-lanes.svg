  <rect class="a b13 am" x="518" y="104" width="18" height="44" rx="4"/>
  <rect class="a b14 am" x="540" y="104" width="18" height="44" rx="4"/>
  <rect class="a b15 am" x="562" y="104" width="18" height="44" rx="4"/>
