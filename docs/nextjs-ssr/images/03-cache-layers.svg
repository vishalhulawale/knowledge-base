<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 448" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Next.js cache stores</title>
  <desc id="d">Three columns. Build and CDN: the static shell of prerendered HTML and RSC payload, containing static and use cache parts, rebuilt in the background by ISR and replaced on deploy. Server: three pods, each with its own in-memory cache used by plain use cache, lost on restart, plus a shared remote cache handler such as Redis for use cache remote. Browser: the client cache of RSC payloads and prefetches, where use cache private results live. A footer explains cacheLife hours: stale 5 minutes in the browser, revalidate 1 hour with background refresh, expire 1 day.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="446" rx="14"/>
  <text class="h" x="28" y="40">Where a cached result lives</text><text class="sub" x="28" y="62">Next.js 16 with Cache Components. Every store is scoped to one deployment.</text><text class="h2" x="28" y="96">Build / CDN</text><text class="h2" x="290" y="96">Server (3 pods)</text><text class="h2" x="580" y="96">Browser</text><rect class="bo" x="28" y="112" width="230" height="92" rx="8" stroke-width="1.5"/><text class="sm" x="143" y="145" text-anchor="middle" font-weight="700">Static shell</text><text class="sm" x="143" y="163" text-anchor="middle">prerendered HTML + RSC</text><text class="sm" x="143" y="181" text-anchor="middle">static + 'use cache' parts</text><text class="sub" x="28" y="228">Rebuilt in the background</text><text class="sub" x="28" y="245">after revalidate (ISR);</text><text class="sub" x="28" y="262">a deploy builds a new one.</text><rect class="bm" x="290" y="112" width="84" height="92" rx="8" stroke-width="1.5"/><text class="sm" x="332" y="132" text-anchor="middle" font-weight="700">pod 1</text><rect class="bw" x="298" y="144" width="68" height="50" rx="6" stroke-width="1.2"/><text class="sm" x="332" y="164" text-anchor="middle">memory</text><text class="sm" x="332" y="180" text-anchor="middle">cache</text><rect class="bm" x="382" y="112" width="84" height="92" rx="8" stroke-width="1.5"/><text class="sm" x="424" y="132" text-anchor="middle" font-weight="700">pod 2</text><rect class="bw" x="390" y="144" width="68" height="50" rx="6" stroke-width="1.2"/><text class="sm" x="424" y="164" text-anchor="middle">memory</text><text class="sm" x="424" y="180" text-anchor="middle">cache</text><rect class="bm" x="474" y="112" width="84" height="92" rx="8" stroke-width="1.5"/><text class="sm" x="516" y="132" text-anchor="middle" font-weight="700">pod 3</text><rect class="bw" x="482" y="144" width="68" height="50" rx="6" stroke-width="1.2"/><text class="sm" x="516" y="164" text-anchor="middle">memory</text><text class="sm" x="516" y="180" text-anchor="middle">cache</text><text class="wrnt" x="290" y="320" style="font-size:13px">plain 'use cache': per pod, lost on restart</text><rect class="bt" x="290" y="244" width="260" height="56" rx="8" stroke-width="1.5"/><text class="sm" x="420" y="268" text-anchor="middle" font-weight="700">Remote cache handler</text><text class="sm" x="420" y="286" text-anchor="middle">'use cache: remote' (e.g. Redis)</text><line class="lnt dash" x1="332" y1="204" x2="332" y2="242" marker-end="url(#art)"/><line class="lnt dash" x1="424" y1="204" x2="424" y2="242" marker-end="url(#art)"/><line class="lnt dash" x1="516" y1="204" x2="516" y2="242" marker-end="url(#art)"/><rect class="bp" x="580" y="112" width="192" height="92" rx="8" stroke-width="1.5"/><text class="sm" x="676" y="145" text-anchor="middle" font-weight="700">Client cache</text><text class="sm" x="676" y="163" text-anchor="middle">RSC payloads, prefetches</text><text class="sm" x="676" y="181" text-anchor="middle">'use cache: private'</text><text class="sub" x="580" y="228">Only cache allowed to read</text><text class="sub" x="580" y="245">cookies directly; never</text><text class="sub" x="580" y="262">shared between users.</text><rect class="bm" x="28" y="342" width="744" height="86" rx="8"/><text class="lbl" x="44" y="366">cacheLife('hours') sets three clocks</text><text class="prit" x="44" y="388" style="font-size:13px">stale 5 min</text><text class="sm" x="160" y="388">browser reuses it without asking the server (minimum 30 s)</text><text class="teat" x="44" y="406" style="font-size:13px">revalidate 1 h</text><text class="sm" x="160" y="406">next request gets the cached copy and triggers a background refresh</text><text class="wrnt" x="44" y="424" style="font-size:13px">expire 1 day</text><text class="sm" x="160" y="424">after this with no traffic, the next request waits for fresh data</text>
</svg>
