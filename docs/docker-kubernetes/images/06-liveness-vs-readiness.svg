<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Liveness vs readiness when a dependency is down</title>
  <desc id="d">The database goes down for 30 seconds while three pods are serving. Left, the database check is in the liveness probe: every pod fails liveness at the same time, the kubelet restarts all three, they spend their startup time restarting and failing again, and the outage turns into a restart storm that outlasts the database outage. Right, the database check is only in readiness: the pods are removed from the Service endpoints and stay running, and when the database returns they pass readiness and take traffic again within seconds, with no restarts.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:14s infinite linear}
    @keyframes p0{0%,25%{opacity:1}26%{opacity:0}100%{opacity:0}}
    .p0{animation-name:p0}
    @keyframes p1{0%{opacity:0}25%{opacity:0}26%,62%{opacity:1}63%{opacity:0}100%{opacity:0}}
    .p1{animation-name:p1}
    @keyframes p2{0%{opacity:0}62%{opacity:0}63%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p2{animation-name:p2}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .p0,.p1{opacity:0!important}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">The database is down for 30 seconds</text>
  <text class="sub" x="28" y="62">Same three pods, the db check in a different probe.</text>
  <line class="ln dash" x1="400" y1="84" x2="400" y2="330"/>
  <g class="a p0">
  <rect class="bo" x="28" y="96" width="100" height="36" rx="10" stroke-width="1.5"/>
  <text class="tx" x="78" y="119" text-anchor="middle" font-weight="700">DB</text>
  </g>
  <g class="a p1">
  <rect class="bb" x="28" y="96" width="100" height="36" rx="10" stroke-width="1.5"/>
  <text class="tx" x="78" y="119" text-anchor="middle" font-weight="700">DB down</text>
  </g>
  <g class="a p2">
  <rect class="bo" x="28" y="96" width="100" height="36" rx="10" stroke-width="1.5"/>
  <text class="tx" x="78" y="119" text-anchor="middle" font-weight="700">DB back</text>
  </g>
  <g class="a p0">
  <rect class="bo" x="420" y="96" width="100" height="36" rx="10" stroke-width="1.5"/>
  <text class="tx" x="470" y="119" text-anchor="middle" font-weight="700">DB</text>
  </g>
  <g class="a p1">
  <rect class="bb" x="420" y="96" width="100" height="36" rx="10" stroke-width="1.5"/>
  <text class="tx" x="470" y="119" text-anchor="middle" font-weight="700">DB down</text>
  </g>
  <g class="a p2">
  <rect class="bo" x="420" y="96" width="100" height="36" rx="10" stroke-width="1.5"/>
  <text class="tx" x="470" y="119" text-anchor="middle" font-weight="700">DB back</text>
  </g>
  <text class="lbl badt" x="140" y="120">db check in liveness ✕</text>
  <text class="lbl okt" x="532" y="120">db check in readiness ✓</text>
  <g class="a p0">
  <rect class="bo" x="28" y="150" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="138" y="175" text-anchor="middle" font-weight="700">pod A  serving</text>
  </g>
  <g class="a p1">
  <rect class="bb" x="28" y="150" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="138" y="175" text-anchor="middle" font-weight="700">pod A  restarting ×2</text>
  </g>
  <g class="a p2">
  <rect class="bw" x="28" y="150" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="138" y="175" text-anchor="middle" font-weight="700">pod A  cold JVM</text>
  </g>
  <g class="a p0">
  <rect class="bo" x="420" y="150" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="530" y="175" text-anchor="middle" font-weight="700">pod A  serving</text>
  </g>
  <g class="a p1">
  <rect class="bm" x="420" y="150" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="530" y="175" text-anchor="middle" font-weight="700">pod A  not ready</text>
  </g>
  <g class="a p2">
  <rect class="bo" x="420" y="150" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="530" y="175" text-anchor="middle" font-weight="700">pod A  serving</text>
  </g>
  <g class="a p0">
  <rect class="bo" x="28" y="202" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="138" y="227" text-anchor="middle" font-weight="700">pod B  serving</text>
  </g>
  <g class="a p1">
  <rect class="bb" x="28" y="202" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="138" y="227" text-anchor="middle" font-weight="700">pod B  restarting ×3</text>
  </g>
  <g class="a p2">
  <rect class="bw" x="28" y="202" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="138" y="227" text-anchor="middle" font-weight="700">pod B  cold JVM</text>
  </g>
  <g class="a p0">
  <rect class="bo" x="420" y="202" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="530" y="227" text-anchor="middle" font-weight="700">pod B  serving</text>
  </g>
  <g class="a p1">
  <rect class="bm" x="420" y="202" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="530" y="227" text-anchor="middle" font-weight="700">pod B  not ready</text>
  </g>
  <g class="a p2">
  <rect class="bo" x="420" y="202" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="530" y="227" text-anchor="middle" font-weight="700">pod B  serving</text>
  </g>
  <g class="a p0">
  <rect class="bo" x="28" y="254" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="138" y="279" text-anchor="middle" font-weight="700">pod C  serving</text>
  </g>
  <g class="a p1">
  <rect class="bb" x="28" y="254" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="138" y="279" text-anchor="middle" font-weight="700">pod C  restarting ×4</text>
  </g>
  <g class="a p2">
  <rect class="bw" x="28" y="254" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="138" y="279" text-anchor="middle" font-weight="700">pod C  cold JVM</text>
  </g>
  <g class="a p0">
  <rect class="bo" x="420" y="254" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="530" y="279" text-anchor="middle" font-weight="700">pod C  serving</text>
  </g>
  <g class="a p1">
  <rect class="bm" x="420" y="254" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="530" y="279" text-anchor="middle" font-weight="700">pod C  not ready</text>
  </g>
  <g class="a p2">
  <rect class="bo" x="420" y="254" width="220" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="530" y="279" text-anchor="middle" font-weight="700">pod C  serving</text>
  </g>
  <text class="tx badt a p2" x="28" y="324">Outage outlasts the DB: restarts, cold JVMs,</text>
  <text class="tx badt a p2" x="28" y="342">CrashLoopBackOff delays</text>
  <text class="tx okt a p2" x="420" y="324">Back in seconds, no restarts</text>
  <text class="tx" x="28" y="380">Liveness: only &quot;is this process stuck?&quot; (internal state). Dependencies belong in readiness, if anywhere.</text>
  <text class="sub" x="28" y="404">Spring Boot: management.endpoint.health.group.readiness.include=readinessState,db; keep liveness bare.</text>
</svg>
