  <text class="m" x="520" y="186">results (copies)</text>
  <g class="fr f0"><rect class="pri" x="212" y="97" width="76" height="30" rx="15"/><text class="on" x="250" y="117" text-anchor="middle">[]</text><text class="t" x="520" y="136">[] (empty)</text><text class="tb" x="520" y="212">1. []</text><text class="t" x="520" y="320">Start: record [].</text></g>
