<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Default Resilience4j aspect order</title>
  <desc id="d">Nested boxes show the default order of Resilience4j aspects in Spring Boot, from outside in: Retry, CircuitBreaker, RateLimiter, TimeLimiter, Bulkhead, and finally the remote call. Retry is outermost, so each attempt passes through the circuit breaker and an open breaker stops retries quickly. Bulkhead is innermost and limits concurrent actual calls. The order can be changed with the AspectOrder properties.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ring{fill:#ffffff;stroke:#d97706;stroke-width:2.5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
      .ring{fill:#111827;stroke:#fbbf24}
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="458" rx="14"/>
  <text class="h" x="28" y="40">Default Resilience4j aspect order in Spring Boot</text>
  <text class="sub" x="28" y="62">Retry ( CircuitBreaker ( RateLimiter ( TimeLimiter ( Bulkhead ( call ) ) ) ) )</text>
  <rect class="bp" x="28" y="80" width="470" height="318" rx="12" stroke-width="1.5"/><text class="lbl" x="42" y="106">Retry</text>
  <line class="ln dash" x1="498" y1="101" x2="528" y2="101" stroke-width="1"/><text class="sub" x="536" y="106">outermost: every attempt</text><text class="sub" x="536" y="122">passes through the breaker</text>
  <rect class="bb" x="50" y="120" width="426" height="266" rx="12" stroke-width="1.5"/><text class="lbl" x="64" y="146">CircuitBreaker</text>
  <line class="ln dash" x1="476" y1="141" x2="528" y2="141" stroke-width="1"/><text class="sub" x="536" y="146">when open, retries stop</text><text class="sub" x="536" y="162">quickly (fail fast)</text>
  <rect class="bw" x="72" y="160" width="382" height="214" rx="12" stroke-width="1.5"/><text class="lbl" x="86" y="186">RateLimiter</text>
  <line class="ln dash" x1="454" y1="181" x2="528" y2="181" stroke-width="1"/><text class="sub" x="536" y="186">waits for a permit</text><text class="sub" x="536" y="202">per refresh period</text>
  <rect class="bt" x="94" y="200" width="338" height="162" rx="12" stroke-width="1.5"/><text class="lbl" x="108" y="226">TimeLimiter</text>
  <line class="ln dash" x1="432" y1="221" x2="528" y2="221" stroke-width="1"/><text class="sub" x="536" y="226">bounds async calls, not</text><text class="sub" x="536" y="242">blocked socket reads</text>
  <rect class="bo" x="116" y="240" width="294" height="110" rx="12" stroke-width="1.5"/><text class="lbl" x="130" y="266">Bulkhead</text>
  <line class="ln dash" x1="410" y1="261" x2="528" y2="261" stroke-width="1"/><text class="sub" x="536" y="266">innermost: caps concurrent</text><text class="sub" x="536" y="282">actual calls</text>
  <rect class="pri" x="132" y="286" width="262" height="40" rx="10" stroke-width="1.5"/><text class="on" x="263" y="311" text-anchor="middle">remote call</text>
  <line class="ln dash" x1="394" y1="306" x2="528" y2="306" stroke-width="1"/>
  <text class="sub" x="536" y="311">the HTTP call, with its own</text><text class="sub" x="536" y="327">connect and read timeouts</text>
  <text class="sub" x="28" y="426">Change the order with resilience4j.&lt;module&gt;.&lt;module&gt;AspectOrder (higher runs first),</text>
  <text class="sub" x="28" y="442">or decorate functionally for explicit control.</text>
</svg>
