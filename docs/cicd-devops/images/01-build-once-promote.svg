<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Build once, promote</title>
  <desc id="d">Animation in two panels. On the left, the main branch builds one image with digest sha256 a1f3 and the same digest is deployed to dev, then staging, then prod, so production runs exactly what staging tested. On the right, the same commit is rebuilt for each environment and produces three different digests, 4b8e for dev, d210 for staging and 9c07 for prod, so production runs an image nobody tested. Digests are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes p1{0%{opacity:0}7.99%{opacity:0}8%{opacity:1}100%{opacity:1}}.p1{animation-name:p1}
    @keyframes p2{0%{opacity:0}23.99%{opacity:0}24%{opacity:1}100%{opacity:1}}.p2{animation-name:p2}
    @keyframes p3{0%{opacity:0}29.99%{opacity:0}30%{opacity:1}100%{opacity:1}}.p3{animation-name:p3}
    @keyframes p4{0%{opacity:0}45.99%{opacity:0}46%{opacity:1}100%{opacity:1}}.p4{animation-name:p4}
    @keyframes p5{0%{opacity:0}51.99%{opacity:0}52%{opacity:1}100%{opacity:1}}.p5{animation-name:p5}
    @keyframes p6{0%{opacity:0}69.99%{opacity:0}70%{opacity:1}100%{opacity:1}}.p6{animation-name:p6}
    @keyframes p7{0%{opacity:0}7.99%{opacity:0}8%{opacity:1}100%{opacity:1}}.p7{animation-name:p7}
    @keyframes p8{0%{opacity:0}29.99%{opacity:0}30%{opacity:1}100%{opacity:1}}.p8{animation-name:p8}
    @keyframes p9{0%{opacity:0}51.99%{opacity:0}52%{opacity:1}100%{opacity:1}}.p9{animation-name:p9}
    @keyframes p10{0%{opacity:0}69.99%{opacity:0}70%{opacity:1}100%{opacity:1}}.p10{animation-name:p10}
    @media (prefers-reduced-motion: reduce){.k{animation:none}.p1,.p2,.p3,.p4,.p5,.p6,.p7,.p8,.p9,.p10{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Build once, promote by digest</text><text class="sub" x="28" y="62">Left: one image moves through every environment. Right: each environment rebuilds. Digests illustrative.</text><rect class="box" x="20" y="80" width="370" height="300" rx="10" stroke-width="1.2"/><text class="h2" x="205" y="106" text-anchor="middle">Build once, promote</text><rect class="bp" x="105" y="120" width="200" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="205" y="145" text-anchor="middle">build on main → sha256:a1f3</text><rect class="bm" x="36" y="180" width="92" height="38" rx="8" stroke-width="1.5"/><text class="lbl" x="82" y="204" text-anchor="middle">dev</text><line class="ln" x1="262" y1="162" x2="262" y2="182" marker-end="url(#ar)"/><g class="k p1"><rect class="tea" x="202" y="184" width="120" height="30" rx="6"/><text class="on13" x="262" y="204" text-anchor="middle">sha256:a1f3</text></g><g class="k p2"><line class="lnt" x1="262" y1="216" x2="262" y2="238" marker-end="url(#art)"/></g><rect class="bm" x="36" y="236" width="92" height="38" rx="8" stroke-width="1.5"/><text class="lbl" x="82" y="260" text-anchor="middle">staging</text><g class="k p3"><rect class="tea" x="202" y="240" width="120" height="30" rx="6"/><text class="on13" x="262" y="260" text-anchor="middle">sha256:a1f3</text><text class="okt" x="332" y="260" style="font-size:13px">same ✓</text></g><g class="k p4"><line class="lnt" x1="262" y1="272" x2="262" y2="294" marker-end="url(#art)"/></g><rect class="bm" x="36" y="292" width="92" height="38" rx="8" stroke-width="1.5"/><text class="lbl" x="82" y="316" text-anchor="middle">prod</text><g class="k p5"><rect class="tea" x="202" y="296" width="120" height="30" rx="6"/><text class="on13" x="262" y="316" text-anchor="middle">sha256:a1f3</text><text class="okt" x="332" y="316" style="font-size:13px">same ✓</text></g><g class="k p6"><text class="okt" x="205" y="362" text-anchor="middle" style="font-size:15px">prod runs the bits staging tested</text></g><rect class="box" x="410" y="80" width="370" height="300" rx="10" stroke-width="1.2"/><text class="h2" x="595" y="106" text-anchor="middle">Rebuild per environment</text><rect class="bm" x="495" y="120" width="200" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="595" y="145" text-anchor="middle">commit 7e2c (same source)</text><rect class="bm" x="426" y="180" width="92" height="38" rx="8" stroke-width="1.5"/><text class="lbl" x="472" y="204" text-anchor="middle">dev</text><g class="k p7"><text class="sub" x="528" y="204">build →</text><rect class="wrnf" x="582" y="184" width="120" height="30" rx="6"/><text class="on13" x="642" y="204" text-anchor="middle">sha256:4b8e</text></g><rect class="bm" x="426" y="236" width="92" height="38" rx="8" stroke-width="1.5"/><text class="lbl" x="472" y="260" text-anchor="middle">staging</text><g class="k p8"><text class="sub" x="528" y="260">build →</text><rect class="wrnf" x="582" y="240" width="120" height="30" rx="6"/><text class="on13" x="642" y="260" text-anchor="middle">sha256:d210</text></g><rect class="bm" x="426" y="292" width="92" height="38" rx="8" stroke-width="1.5"/><text class="lbl" x="472" y="316" text-anchor="middle">prod</text><g class="k p9"><text class="sub" x="528" y="316">build →</text><rect class="badf" x="582" y="296" width="120" height="30" rx="6"/><text class="on13" x="642" y="316" text-anchor="middle">sha256:9c07</text><text class="badt" x="710" y="316" style="font-size:13px">untested</text></g><g class="k p10"><text class="badt" x="595" y="362" text-anchor="middle" style="font-size:15px">prod runs bits nobody tested</text></g>
</svg>
