<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Bed state and event log</title>
  <desc id="d">Animation: a state machine for hospital bed 4B with states Available, Occupied, Cleaning and Blocked. The highlighted state moves from Available to Occupied (assign_bed), to Cleaning (discharge) and back to Available (mark_clean); block and unblock connect Available and Blocked. With each transition an event is appended to an event log on the right: 09:15 assign_bed by nurse R., 14:40 discharge by Dr. M., and 15:25 mark_clean by housekeeping. A note shows turnaround, 45 minutes, derived from the events rather than stored. Times are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .p{opacity:0;animation:14s infinite linear}
    @keyframes p0{0%,24.99%{opacity:1}25%,100%{opacity:0}}.p0{animation-name:p0}
    @keyframes p1{0%,24.99%{opacity:0}25%,49.99%{opacity:1}50%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,49.99%{opacity:0}50%,74.99%{opacity:1}75%,100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%,74.99%{opacity:0}75%,100%{opacity:1}}.p3{animation-name:p3}
    @keyframes e0{0%,24.99%{opacity:0}25%,100%{opacity:1}}.e0{animation-name:e0}
    @keyframes e1{0%,49.99%{opacity:0}50%,100%{opacity:1}}.e1{animation-name:e1}
    @keyframes e2{0%,74.99%{opacity:0}75%,100%{opacity:1}}.e2{animation-name:e2}
    @media (prefers-reduced-motion: reduce){.p{animation:none;opacity:0}.p3,.e0,.e1,.e2{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="394" rx="14"/>
  <text class="h" x="28" y="40">Bed 4B: state for fast answers, events for history</text><text class="sub" x="28" y="62">Each arrow is an action; each action appends an event. Times are illustrative.</text><rect class="box" x="40" y="100" width="150" height="44" rx="22" stroke-width="1.5"/><text class="tx" x="115" y="127" text-anchor="middle" font-weight="700">Available</text><rect class="box" x="290" y="100" width="150" height="44" rx="22" stroke-width="1.5"/><text class="tx" x="365" y="127" text-anchor="middle" font-weight="700">Occupied</text><rect class="box" x="290" y="230" width="150" height="44" rx="22" stroke-width="1.5"/><text class="tx" x="365" y="257" text-anchor="middle" font-weight="700">Cleaning</text><rect class="box" x="40" y="230" width="150" height="44" rx="22" stroke-width="1.5"/><text class="tx" x="115" y="257" text-anchor="middle" font-weight="700">Blocked</text><line class="ln" x1="192" y1="122" x2="288" y2="122" marker-end="url(#ar)"/><text class="sub" x="240" y="114" text-anchor="middle">assign_bed</text><line class="ln" x1="365" y1="146" x2="365" y2="228" marker-end="url(#ar)"/><text class="sub" x="373" y="192">discharge</text><line class="ln" x1="288" y1="246" x2="172" y2="148" marker-end="url(#ar)"/><text class="sub" x="212" y="172">mark_clean</text><line class="ln dash" x1="100" y1="146" x2="100" y2="228" marker-end="url(#ar)"/><text class="sub" x="108" y="192">block / unblock</text><g class="p p0"><rect class="okf" x="40" y="100" width="150" height="44" rx="22"/><text class="on" x="115" y="127" text-anchor="middle">Available</text><text class="lbl" x="612" y="314" text-anchor="middle">current state: Available</text></g><g class="p p1"><rect class="pri" x="290" y="100" width="150" height="44" rx="22"/><text class="on" x="365" y="127" text-anchor="middle">Occupied</text><text class="lbl" x="612" y="314" text-anchor="middle">current state: Occupied</text></g><g class="p p2"><rect class="wrnf" x="290" y="230" width="150" height="44" rx="22"/><text class="on" x="365" y="257" text-anchor="middle">Cleaning</text><text class="lbl" x="612" y="314" text-anchor="middle">current state: Cleaning</text></g><g class="p p3"><rect class="okf" x="40" y="100" width="150" height="44" rx="22"/><text class="on" x="115" y="127" text-anchor="middle">Available</text><text class="lbl" x="612" y="314" text-anchor="middle">current state: Available</text></g><rect class="bm" x="480" y="90" width="292" height="196" rx="10"/><text class="sm" x="496" y="116" font-weight="700">Event log (append-only)</text><g class="p e0"><rect class="box" x="492" y="126" width="268" height="36" rx="6"/><text class="mono" x="504" y="149">09:15</text><text class="prit" x="556" y="149" font-size="13">assign_bed</text><text class="sub" x="650" y="149">by nurse R.</text></g><g class="p e1"><rect class="box" x="492" y="170" width="268" height="36" rx="6"/><text class="mono" x="504" y="193">14:40</text><text class="prit" x="556" y="193" font-size="13">discharge</text><text class="sub" x="650" y="193">by Dr. M.</text></g><g class="p e2"><rect class="box" x="492" y="214" width="268" height="36" rx="6"/><text class="mono" x="504" y="237">15:25</text><text class="prit" x="556" y="237" font-size="13">mark_clean</text><text class="sub" x="650" y="237">by housekeeping</text></g><g class="p e2"><text class="sm" x="28" y="348" font-weight="600">Turnaround = mark_clean − discharge = 45 min: derived from events, never stored.</text></g><text class="sub" x="28" y="376">Missing "Cleaning" is the classic sign of a model built from a schema, not from users' words.</text>
</svg>
