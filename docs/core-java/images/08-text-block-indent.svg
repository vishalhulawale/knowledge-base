<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Text block indentation</title>
  <desc id="d">Two versions of the same text block, with dots marking leading spaces. Left, the closing triple quote is indented 8 columns like the content, so 8 columns of incidental whitespace are stripped and the result is: query Member {, then member { name } indented 2 spaces, then }. Right, the closing triple quote is moved left to column 4, so only 4 columns are stripped and every result line keeps 4 extra leading spaces. The opening line is not part of the content.</desc>
