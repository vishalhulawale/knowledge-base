<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">PCI scope with tokenisation</title>
  <desc id="d">Two architectures. Left, raw card handling: the card number flows from the browser form through the web tier, checkout API, Kafka topic, and orders database and logs, so every box is red and inside the cardholder data environment, needing a full assessment. Right, tokenised: the browser sends the card in the payment provider's iframe straight to the provider, the only place the card number exists; the web tier, API, Kafka and database handle only a token and the last four digits, and the API charges by token. The page hosting the iframe and its scripts is still the merchant's responsibility.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="464" rx="14"/>
  <text class="h" x="28" y="40">Tokenisation shrinks PCI scope</text><text class="sub" x="28" y="62">Red = sees a full card number, so it is in the cardholder data environment.</text><text class="h2" x="40" y="98">Raw card handling</text><rect class="bb" x="30" y="110" width="350" height="300" rx="12" stroke-width="2" stroke-dasharray="7 5" fill-opacity="0.35"/><rect class="bb" x="70" y="130" width="200" height="40" rx="8" stroke-width="1.5"/><text class="tx" x="170" y="155" text-anchor="middle">Browser form</text><rect class="bb" x="70" y="186" width="200" height="40" rx="8" stroke-width="1.5"/><text class="tx" x="170" y="211" text-anchor="middle">Web tier</text><rect class="bb" x="70" y="242" width="200" height="40" rx="8" stroke-width="1.5"/><text class="tx" x="170" y="267" text-anchor="middle">Checkout API</text><rect class="bb" x="70" y="298" width="200" height="40" rx="8" stroke-width="1.5"/><text class="tx" x="170" y="323" text-anchor="middle">Kafka topic</text><rect class="bb" x="70" y="354" width="200" height="40" rx="8" stroke-width="1.5"/><text class="tx" x="170" y="379" text-anchor="middle">Orders DB + logs</text><line class="lnb" x1="170" y1="170" x2="170" y2="184" marker-end="url(#arb)"/><line class="lnb" x1="170" y1="226" x2="170" y2="240" marker-end="url(#arb)"/><line class="lnb" x1="170" y1="282" x2="170" y2="296" marker-end="url(#arb)"/><line class="lnb" x1="170" y1="338" x2="170" y2="352" marker-end="url(#arb)"/><text class="badt" x="288" y="200">PAN</text><text class="badt" x="288" y="220">flows</text><text class="badt" x="288" y="240">through</text><text class="badt" x="288" y="260">every</text><text class="badt" x="288" y="280">box</text><text class="badt" x="205" y="438" text-anchor="middle" style="font-size:13px">Whole stack in scope: full SAQ D or ROC</text><text class="h2" x="430" y="98">Tokenised (hosted fields)</text><rect class="box" x="430" y="130" width="160" height="40" rx="8" stroke-width="1.5"/><text class="tx" x="510" y="155" text-anchor="middle">Browser</text><rect class="bo" x="610" y="122" width="160" height="56" rx="8" stroke-width="1.5"/><text class="sm" x="690" y="146" text-anchor="middle">PSP iframe →</text><text class="sm" x="690" y="164" text-anchor="middle">payment provider</text><line class="lno" x1="590" y1="150" x2="608" y2="150" marker-end="url(#aro)"/><text class="okt" x="690" y="198" text-anchor="middle" style="font-size:13px">PAN only here</text><rect class="bt" x="430" y="214" width="160" height="36" rx="8" stroke-width="1.5"/><text class="tx" x="510" y="237" text-anchor="middle">Web tier</text><rect class="bt" x="430" y="270" width="160" height="36" rx="8" stroke-width="1.5"/><text class="tx" x="510" y="293" text-anchor="middle">Checkout API</text><rect class="bt" x="430" y="326" width="160" height="36" rx="8" stroke-width="1.5"/><text class="tx" x="510" y="349" text-anchor="middle">Kafka topic</text><rect class="bt" x="430" y="382" width="160" height="36" rx="8" stroke-width="1.5"/><text class="tx" x="510" y="405" text-anchor="middle">Orders DB + logs</text><line class="lnt" x1="510" y1="170" x2="510" y2="212" marker-end="url(#art)"/><line class="lnt" x1="510" y1="250" x2="510" y2="268" marker-end="url(#art)"/><line class="lnt" x1="510" y1="306" x2="510" y2="324" marker-end="url(#art)"/><line class="lnt" x1="510" y1="362" x2="510" y2="380" marker-end="url(#art)"/><line class="lnt" x1="590" y1="288" x2="690" y2="288" marker-end="url(#art)"/><line class="lnt" x1="690" y1="288" x2="690" y2="210"/><text class="teat" x="606" y="314">charge(token)</text><text class="teat" x="606" y="332">token + last 4</text><text class="teat" x="606" y="350">only</text><rect class="wrnf" x="430" y="426" width="340" height="2" rx="1"/><text class="wrnt" x="600" y="446" text-anchor="middle" style="font-size:13px">Still yours: the page hosting the iframe and its scripts</text>
</svg>
