<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Debezium outbox relay</title>
  <desc id="d">1: the service writes the order row and an outbox row in one database transaction. 2: Postgres records the commit in its write-ahead log. 3: the Debezium Postgres connector, running as a task on a Kafka Connect worker, reads the WAL through a logical replication slot. 4: the EventRouter transform turns each outbox row into an event, keyed by aggregateid and routed by aggregate type to the topic outbox.event.order. 5: consumers read it. Debezium stores the WAL position it has reached, the LSN, in the Connect offsets topic, so a restart resumes there; delivery is at-least-once.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="328" rx="14"/>
  <text class="h" x="28" y="40">The outbox relay with Debezium</text>
  <text class="sub" x="28" y="62">No polling and no &#x27;sent&#x27; flag: the relay tails the database&#x27;s own log.</text>
  <rect class="box" x="28" y="100" width="140" height="56" rx="10" stroke-width="1.5"/>
  <text class="tx" x="98" y="125" text-anchor="middle" font-weight="700">Order service</text>
  <text class="sm" x="98" y="142" text-anchor="middle">one DB transaction</text>
  <rect class="bp" x="210" y="92" width="150" height="72" rx="10" stroke-width="1.5"/>
  <text class="tx" x="285" y="125" text-anchor="middle" font-weight="700">Postgres</text>
  <text class="sm" x="285" y="142" text-anchor="middle">orders + outbox</text>
  <rect class="bt" x="400" y="100" width="170" height="56" rx="10" stroke-width="1.5"/>
  <text class="tx" x="485" y="125" text-anchor="middle" font-weight="700">Debezium task</text>
  <text class="sm" x="485" y="142" text-anchor="middle">Connect worker</text>
  <rect class="bw" x="596" y="100" width="176" height="56" rx="10" stroke-width="1.5"/>
  <text class="tx" x="684" y="125" text-anchor="middle" font-weight="700">outbox.event.order</text>
  <text class="sm" x="684" y="142" text-anchor="middle">key = aggregateid</text>
  <line class="lnp" x1="168" y1="128" x2="206" y2="128" marker-end="url(#arp)"/>
  <line class="lnt" x1="360" y1="128" x2="396" y2="128" marker-end="url(#art)"/>
  <line class="lnw" x1="570" y1="128" x2="592" y2="128" marker-end="url(#arw)"/>
  <circle class="pri" cx="187" cy="110" r="9"/>
  <text class="on13" x="187" y="114" text-anchor="middle">1</text>
  <circle class="pri" cx="378" cy="110" r="9"/>
  <text class="on13" x="378" y="114" text-anchor="middle">3</text>
  <circle class="pri" cx="581" cy="110" r="9"/>
  <text class="on13" x="581" y="114" text-anchor="middle">4</text>
  <text class="sm" x="285" y="186" text-anchor="middle">② WAL (logical replication slot)</text>
  <text class="sm teat" x="500" y="186">EventRouter SMT</text>
  <rect class="box" x="596" y="214" width="176" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="684" y="234" text-anchor="middle" font-weight="700">consumers</text>
  <text class="sm" x="684" y="251" text-anchor="middle">⑤ dedupe on eventId</text>
  <line class="lnw" x1="684" y1="156" x2="684" y2="210" marker-end="url(#arw)"/>
  <rect class="bm" x="400" y="214" width="170" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="485" y="234" text-anchor="middle" font-weight="700">connect-offsets</text>
  <text class="sm" x="485" y="251" text-anchor="middle">last LSN read</text>
  <line class="ln dash" x1="440" y1="156" x2="440" y2="210" marker-end="url(#ar)"/>
  <text class="sub" x="28" y="300">A crash between publishing and storing the LSN re-sends events: at-least-once, so consumers stay idempotent.</text>
  <text class="sub" x="28" y="318">Watch the slot: a stopped connector makes Postgres keep WAL, and the disk fills.</text>
</svg>
