      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .p0,.p1,.p3,.p123,.p012{opacity:0!important}.p2,.p23{opacity:1!important}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="438" rx="14"/>
  <text class="h" x="28" y="40">Double-checked locking without volatile</text>
  <text class="sub" x="28" y="62">Without volatile, &#x27;instance = new Config()&#x27; can be reordered: publish first, construct later.</text>
  <text class="h2" x="28" y="102">Thread A (holds the lock)</text>
  <text class="h2" x="420" y="102">Thread B (no lock)</text>
  <g class="a a0">
  <rect class="pri" x="28" y="118" width="340" height="34" rx="6"/>
  <text class="on13" x="198" y="139.5" text-anchor="middle">1  allocate memory</text>
  </g>
  <g class="a a1">
  <rect class="wrnf" x="28" y="162" width="340" height="34" rx="6"/>
  <text class="on13" x="198" y="183.5" text-anchor="middle">2  instance = ref (published early)</text>
  </g>
  <g class="a a2">
  <rect class="pri" x="28" y="206" width="340" height="34" rx="6"/>
  <text class="on13" x="198" y="227.5" text-anchor="middle">3  constructor: url = &quot;…&quot;</text>
  </g>
  <g class="a p3">
  <rect class="pri" x="28" y="118" width="340" height="34" rx="6"/>
  <text class="on13" x="198" y="139.5" text-anchor="middle">1  allocate memory</text>
  </g>
  <g class="a p3">
  <rect class="pri" x="28" y="162" width="340" height="34" rx="6"/>
  <text class="on13" x="198" y="183.5" text-anchor="middle">2  constructor: url = &quot;…&quot;</text>
  </g>
  <g class="a p3">
  <rect class="okf" x="28" y="206" width="340" height="34" rx="6"/>
  <text class="on13" x="198" y="227.5" text-anchor="middle">3  volatile write: instance = ref</text>
  </g>
  <g class="a p3">
  <rect class="okf" x="420" y="206" width="352" height="34" rx="6"/>
  <text class="on13" x="596" y="227.5" text-anchor="middle">instance != null → fully built ✓</text>
  </g>
  <g class="a b0">
  <rect class="wrnf" x="420" y="162" width="352" height="34" rx="6"/>
  <text class="on13" x="596" y="183.5" text-anchor="middle">instance == null? no → return it</text>
  </g>
  <g class="a b1">
  <rect class="badf" x="420" y="206" width="352" height="34" rx="6"/>
  <text class="on13" x="596" y="227.5" text-anchor="middle">instance.url.length() → NullPointerException</text>
  </g>
  <rect class="box" x="200" y="270" width="420" height="70" rx="10" stroke-width="1.5"/>
  <text class="sm" x="214" y="292">heap: Config object</text>
  <text class="lbl badt a p012" x="214" y="322">url = null</text>
  <text class="lbl okt a p3" x="214" y="322">url = &quot;jdbc:…&quot;</text>
  <text class="sm" x="420" y="322">field instance:</text>
  <text class="lbl a p0" x="510" y="322">null</text>
  <text class="lbl wrnt a p123" x="510" y="322">→ object</text>
  <text class="lbl okt a p3" x="510" y="322">→ object</text>
  <text class="lbl a p0" x="28" y="380">1  A allocates the object; its fields are still defaults</text>
  <text class="lbl wrnt a p1" x="28" y="380">2  Reordered: the reference is published before the constructor runs</text>
  <text class="lbl badt a p2" x="28" y="380">3  B skips the lock, sees a half-built object and fails</text>
  <text class="lbl okt a p3" x="28" y="380">4  volatile: the write of instance happens-after the constructor&#x27;s writes</text>
  <text class="sub" x="28" y="412">Simpler and safe: the holder idiom, an enum, or a Spring singleton bean.</text>
</svg>
