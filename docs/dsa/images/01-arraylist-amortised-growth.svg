  <rect class="card" x="1" y="1" width="798" height="350" rx="14"/>
  <text class="h" x="28" y="40">ArrayList growth: why add() is amortised O(1)</text>
  <text class="m" x="28" y="62">Capacity grows by half each time (10 → 15 → 22 → 33), so copies get rarer as the list grows.</text>
  <g class="fr f0"><text class="tb" x="36" y="196">backing array (capacity 10, size 10)</text><rect class="pri" x="36" y="204" width="19" height="30" rx="4"/><rect class="pri" x="58" y="204" width="19" height="30" rx="4"/><rect class="pri" x="80" y="204" width="19" height="30" rx="4"/><rect class="pri" x="102" y="204" width="19" height="30" rx="4"/><rect class="pri" x="124" y="204" width="19" height="30" rx="4"/><rect class="pri" x="146" y="204" width="19" height="30" rx="4"/><rect class="pri" x="168" y="204" width="19" height="30" rx="4"/><rect class="pri" x="190" y="204" width="19" height="30" rx="4"/><rect class="pri" x="212" y="204" width="19" height="30" rx="4"/><rect class="pri" x="234" y="204" width="19" height="30" rx="4"/><text class="t" x="36" y="264">Adds 1–10 fill the array: O(1) each, nothing copied.</text><text class="tb" x="36" y="290">adds 10 · resizes 0 · copied 0 · copies per add 0.00</text></g>
