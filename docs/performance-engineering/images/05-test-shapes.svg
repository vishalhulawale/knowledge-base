<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Load test shapes</title>
  <desc id="d">Six small charts of load over time, each with a dashed line at expected peak. Smoke is a low flat line that checks the script works. Average load ramps to the expected peak and holds to check the SLO. Stress ramps above peak to see what breaks. Spike jumps far above peak for a short time and drops back. Soak holds average load for two to twenty-four hours to find leaks and drift. Breakpoint ramps steadily until a red marker where the SLO breaks.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="486" rx="14"/>
  <text class="h" x="28" y="40">Six load test shapes, six questions</text><text class="sub" x="28" y="62">Load over time. Dashed line: expected peak.</text><rect class="box" x="28" y="88" width="244" height="166" rx="10" stroke-width="1.2"/><text class="h2" x="40" y="112">Smoke</text><text class="sub" x="40" y="132">Does the script work?</text><line class="ln" x1="42" y1="238" x2="258" y2="238" style="stroke-width:1.2"/><line class="ln" x1="42" y1="238" x2="42" y2="150" style="stroke-width:1.2"/><line class="lnw dash" x1="42" y1="194" x2="258" y2="194" style="stroke-width:1.2"/><path class="lnt" d="M 42.0 231.0 L 258.0 231.0"/><rect class="box" x="280" y="88" width="244" height="166" rx="10" stroke-width="1.2"/><text class="h2" x="292" y="112">Average load</text><text class="sub" x="292" y="132">SLO at expected peak?</text><line class="ln" x1="294" y1="238" x2="510" y2="238" style="stroke-width:1.2"/><line class="ln" x1="294" y1="238" x2="294" y2="150" style="stroke-width:1.2"/><line class="lnw dash" x1="294" y1="194" x2="510" y2="194" style="stroke-width:1.2"/><path class="lnt" d="M 294.0 238.0 L 337.2 194.0 L 477.6 194.0 L 510.0 238.0"/><rect class="box" x="532" y="88" width="244" height="166" rx="10" stroke-width="1.2"/><text class="h2" x="544" y="112">Stress</text><text class="sub" x="544" y="132">What breaks above peak?</text><line class="ln" x1="546" y1="238" x2="762" y2="238" style="stroke-width:1.2"/><line class="ln" x1="546" y1="238" x2="546" y2="150" style="stroke-width:1.2"/><line class="lnw dash" x1="546" y1="194" x2="762" y2="194" style="stroke-width:1.2"/><path class="lnb" d="M 546.0 238.0 L 600.0 194.0 L 632.4 194.0 L 675.6 163.2 L 729.6 163.2 L 762.0 238.0"/><rect class="box" x="28" y="270" width="244" height="166" rx="10" stroke-width="1.2"/><text class="h2" x="40" y="294">Spike</text><text class="sub" x="40" y="314">Survive a sudden surge?</text><line class="ln" x1="42" y1="420" x2="258" y2="420" style="stroke-width:1.2"/><line class="ln" x1="42" y1="420" x2="42" y2="332" style="stroke-width:1.2"/><line class="lnw dash" x1="42" y1="376" x2="258" y2="376" style="stroke-width:1.2"/><path class="lnb" d="M 42.0 411.2 L 117.6 411.2 L 128.4 336.4 L 160.8 336.4 L 171.6 411.2 L 258.0 411.2"/><rect class="box" x="280" y="270" width="244" height="166" rx="10" stroke-width="1.2"/><text class="h2" x="292" y="294">Soak</text><text class="sub" x="292" y="314">Leaks and drift over hours?</text><line class="ln" x1="294" y1="420" x2="510" y2="420" style="stroke-width:1.2"/><line class="ln" x1="294" y1="420" x2="294" y2="332" style="stroke-width:1.2"/><line class="lnw dash" x1="294" y1="376" x2="510" y2="376" style="stroke-width:1.2"/><path class="lnt" d="M 294.0 420.0 L 304.8 376.0 L 503.5 376.0 L 510.0 420.0"/><text class="sub" x="502" y="368" text-anchor="end">2–24 h</text><rect class="box" x="532" y="270" width="244" height="166" rx="10" stroke-width="1.2"/><text class="h2" x="544" y="294">Breakpoint</text><text class="sub" x="544" y="314">Where is the limit?</text><line class="ln" x1="546" y1="420" x2="762" y2="420" style="stroke-width:1.2"/><line class="ln" x1="546" y1="420" x2="546" y2="332" style="stroke-width:1.2"/><line class="lnw dash" x1="546" y1="376" x2="762" y2="376" style="stroke-width:1.2"/><path class="lnt" d="M 546.0 420.0 L 718.8 340.8"/><circle class="badf" cx="718.8" cy="340.8" r="6"/><text class="badt" x="708.8" y="344.8" text-anchor="end" style="font-size:12px">SLO breaks</text><text class="sm" x="28" y="466">Most teams only run average load. Spike and soak find the failures that reach production.</text>
</svg>
