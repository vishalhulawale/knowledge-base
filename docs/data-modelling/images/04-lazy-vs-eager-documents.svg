  <rect class="card" x="1" y="1" width="798" height="454" rx="14"/>
  <text class="h" x="28" y="40">Evolving documents: lazy vs eager migration</text><text class="sub" x="28" y="62">Twelve documents stand for a collection. Amber = schemaVersion 1, teal = 2. Illustrative.</text><rect class="bm" x="20" y="80" width="372" height="330" rx="10" stroke-width="1.2"/><text class="prit" x="36" y="106" style="font-size:14px">Lazy: upgrade on read, save on next write</text><text class="sub" x="36" y="152">release day</text><rect class="wrnf" x="124" y="136" width="17" height="24" rx="3"/><rect class="wrnf" x="145" y="136" width="17" height="24" rx="3"/><rect class="wrnf" x="166" y="136" width="17" height="24" rx="3"/><rect class="wrnf" x="187" y="136" width="17" height="24" rx="3"/><rect class="wrnf" x="208" y="136" width="17" height="24" rx="3"/><rect class="wrnf" x="229" y="136" width="17" height="24" rx="3"/><rect class="wrnf" x="250" y="136" width="17" height="24" rx="3"/><rect class="wrnf" x="271" y="136" width="17" height="24" rx="3"/><rect class="wrnf" x="292" y="136" width="17" height="24" rx="3"/><rect class="wrnf" x="313" y="136" width="17" height="24" rx="3"/><rect class="wrnf" x="334" y="136" width="17" height="24" rx="3"/><rect class="wrnf" x="355" y="136" width="17" height="24" rx="3"/><text class="badt" x="376" y="176" text-anchor="end" style="font-size:12px">12 of 12 still v1</text><text class="sub" x="36" y="208">week 2</text><rect class="wrnf" x="124" y="192" width="17" height="24" rx="3"/><rect class="wrnf" x="145" y="192" width="17" height="24" rx="3"/><rect class="wrnf" x="166" y="192" width="17" height="24" rx="3"/><rect class="wrnf" x="187" y="192" width="17" height="24" rx="3"/><rect class="wrnf" x="208" y="192" width="17" height="24" rx="3"/><rect class="wrnf" x="229" y="192" width="17" height="24" rx="3"/><rect class="wrnf" x="250" y="192" width="17" height="24" rx="3"/><rect class="tea" x="271" y="192" width="17" height="24" rx="3"/><rect class="tea" x="292" y="192" width="17" height="24" rx="3"/><rect class="tea" x=