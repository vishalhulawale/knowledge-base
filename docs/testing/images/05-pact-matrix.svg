<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Pact Broker matrix</title>
  <desc id="d">A table of consumer and provider versions with verification results. Member-service candidate 9d41 fails against claims-bff b9e0, which is in production, but passes against mobile-app 3f11 in production and against claims-bff c2a7 on main. The current production pair, claims-bff b9e0 and member-service 7c2d, passes. Running can-i-deploy for member-service 9d41 to production answers no, because of the production claims-bff; deploying claims-bff c2a7 first would make it safe.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="404" rx="14"/>
  <text class="h" x="28" y="40">The Pact Broker matrix behind can-i-deploy</text><text class="sub" x="28" y="62">Each row: a consumer version, a provider version, and the verification result.</text><text class="sub" x="36" y="100">consumer</text><text class="sub" x="170" y="100">version</text><text class="sub" x="270" y="100">where</text><text class="sub" x="400" y="100">member-service</text><text class="sub" x="520" y="100">where</text><text class="sub" x="650" y="100">verified</text><rect class="bp" x="24" y="112" width="752" height="34" rx="6" stroke-width="1"/><text class="sm" x="36" y="134">claims-bff</text><text class="mono" x="170" y="134" xml:space="preserve">b9e0</text><text class="teat" x="270" y="134" style="font-size:13px">prod</text><text class="mono" x="400" y="134" xml:space="preserve">9d41</text><text class="sm" x="520" y="134" style="font-size:13px">candidate</text><rect class="badf" x="650" y="117" width="100" height="24" rx="6"/><text class="on13" x="700" y="134" text-anchor="middle">fail</text><rect class="bp" x="24" y="152" width="752" height="34" rx="6" stroke-width="1"/><text class="sm" x="36" y="174">mobile-app</text><text class="mono" x="170" y="174" xml:space="preserve">3f11</text><text class="teat" x="270" y="174" style="font-size:13px">prod</text><text class="mono" x="400" y="174" xml:space="preserve">9d41</text><text class="sm" x="520" y="174" style="font-size:13px">candidate</text><rect class="okf" x="650" y="157" width="100" height="24" rx="6"/><text class="on13" x="700" y="174" text-anchor="middle">pass</text><rect class="bm" x="24" y="192" width="752" height="34" rx="6" stroke-width="0"/><text class="sm" x="36" y="214">claims-bff</text><text class="mono" x="170" y="214" xml:space="preserve">c2a7</text><text class="sm" x="270" y="214" style="font-size:13px">main</text><text class="mono" x="400" y="214" xml:space="preserve">9d41</text><text class="sm" x="520" y="214" style="font-size:13px">candidate</text><rect class="okf" x="650" y="197" width="100" height="24" rx="6"/><text class="on13" x="700" y="214" text-anchor="middle">pass</text><rect class="bm" x="24" y="232" width="752" height="34" rx="6" stroke-width="0"/><text class="sm" x="36" y="254">claims-bff</text><text class="mono" x="170" y="254" xml:space="preserve">b9e0</text><text class="teat" x="270" y="254" style="font-size:13px">prod</text><text class="mono" x="400" y="254" xml:space="preserve">7c2d</text><text class="teat" x="520" y="254" style="font-size:13px">prod</text><rect class="okf" x="650" y="237" width="100" height="24" rx="6"/><text class="on13" x="700" y="254" text-anchor="middle">pass</text><rect class="box" x="24" y="290" width="752" height="96" rx="8"/><text class="mono" x="40" y="316" xml:space="preserve">$ can-i-deploy --pacticipant member-service --version 9d41 --to-environment production</text><text class="badt" x="40" y="346" style="font-size:14px">No: 9d41 fails the pact with claims-bff b9e0, which is in production.</text><text class="sm" x="40" y="370">The claims-bff c2a7 on main passes, so deploy claims-bff first, then member-service.</text>
</svg>
