<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 342" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Cold versus warm handoff</title>
  <desc id="d">Animation in two rows. Cold transfer: the bot says it is transferring, the queue has no context, the agent asks how they can help, and the customer repeats everything. Warm handoff: the bot tells the customer who is next and the expected wait and that context is shared, the case carries a summary, identity and intent, the agent opens with the double charge, and it is resolved without repeating. The handoff payload includes verified identity, intent, reason, summary, attempted steps, pending action and transcript.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes r0s0{0%,4.99%{opacity:0}5%,96.99%{opacity:1}97%,100%{opacity:0}}.r0s0{animation-name:r0s0}
    @keyframes r0s1{0%,22.99%{opacity:0}23%,96.99%{opacity:1}97%,100%{opacity:0}}.r0s1{animation-name:r0s1}
    @keyframes r0s2{0%,40.99%{opacity:0}41%,96.99%{opacity:1}97%,100%{opacity:0}}.r0s2{animation-name:r0s2}
    @keyframes r0s3{0%,58.99%{opacity:0}59%,96.99%{opacity:1}97%,100%{opacity:0}}.r0s3{animation-name:r0s3}
    @keyframes r1s0{0%,4.99%{opacity:0}5%,96.99%{opacity:1}97%,100%{opacity:0}}.r1s0{animation-name:r1s0}
    @keyframes r1s1{0%,22.99%{opacity:0}23%,96.99%{opacity:1}97%,100%{opacity:0}}.r1s1{animation-name:r1s1}
    @keyframes r1s2{0%,40.99%{opacity:0}41%,96.99%{opacity:1}97%,100%{opacity:0}}.r1s2{animation-name:r1s2}
    @keyframes r1s3{0%,58.99%{opacity:0}59%,96.99%{opacity:1}97%,100%{opacity:0}}.r1s3{animation-name:r1s3}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="340" rx="14"/>
  <text class="h" x="28" y="40">Cold transfer vs warm handoff</text><text class="sub" x="28" y="62">Same escalation; the difference is what travels with the customer.</text><text class="lbl" x="28" y="90">Cold transfer</text><g class="k r0s0"><rect class="box" x="28" y="100" width="176" height="52" rx="8" stroke-width="1.5"/><text class="sm" x="38" y="122">Bot: "Transferring you."</text><line class="ln" x1="206" y1="126" x2="214" y2="126" marker-end="url(#ar)"/></g><g class="k r0s1"><rect class="box" x="216" y="100" width="176" height="52" rx="8" stroke-width="1.5"/><text class="sm" x="226" y="122">Queue: no context</text><line class="ln" x1="394" y1="126" x2="402" y2="126" marker-end="url(#ar)"/></g><g class="k r0s2"><rect class="bb" x="404" y="100" width="176" height="52" rx="8" stroke-width="1.5"/><text class="sm" x="414" y="122">Agent: "How can I help?"</text><line class="ln" x1="582" y1="126" x2="590" y2="126" marker-end="url(#ar)"/></g><g class="k r0s3"><rect class="bb" x="592" y="100" width="176" height="52" rx="8" stroke-width="1.5"/><text class="sm" x="602" y="122">Customer repeats</text><text class="sm" x="602" y="140">everything</text></g><text class="lbl" x="28" y="220">Warm handoff</text><g class="k r1s0"><rect class="box" x="28" y="230" width="176" height="52" rx="8" stroke-width="1.5"/><text class="sm" x="38" y="252">Bot: who, wait, context</text><text class="sm" x="38" y="270">shared</text><line class="ln" x1="206" y1="256" x2="214" y2="256" marker-end="url(#ar)"/></g><g class="k r1s1"><rect class="box" x="216" y="230" width="176" height="52" rx="8" stroke-width="1.5"/><text class="sm" x="226" y="252">Case: summary, identity,</text><text class="sm" x="226" y="270">intent</text><line class="ln" x1="394" y1="256" x2="402" y2="256" marker-end="url(#ar)"/></g><g class="k r1s2"><rect class="bo" x="404" y="230" width="176" height="52" rx="8" stroke-width="1.5"/><text class="sm" x="414" y="252">Agent: "I see the double</text><text class="sm" x="414" y="270">charge"</text><line class="ln" x1="582" y1="256" x2="590" y2="256" marker-end="url(#ar)"/></g><g class="k r1s3"><rect class="bo" x="592" y="230" width="176" height="52" rx="8" stroke-width="1.5"/><text class="sm" x="602" y="252">Resolved without</text><text class="sm" x="602" y="270">repeating</text></g><text class="sm" x="28" y="322">Handoff payload: verified identity, intent, reason, summary, attempted steps, pending action, transcript.</text>
</svg>
