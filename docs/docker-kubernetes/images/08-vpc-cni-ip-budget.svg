<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">VPC CNI pod slots on a t3.medium</title>
  <desc id="d">A t3.medium node can attach 3 ENIs with 6 IPv4 addresses each. In every ENI the first address belongs to the ENI itself, leaving 5 for pods, so 15 pod IPs, plus 2 for host-network pods such as aws-node and kube-proxy: 17 pods. The 18th pod stays Pending with Too many pods even though the node still has spare CPU and memory. Prefix delegation assigns a /28 prefix, 16 addresses, per slot instead of a single IP.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Max pods = ENIs × (IPs per ENI − 1) + 2</text>
  <text class="sub" x="28" y="62">t3.medium: 3 ENIs × 6 IPs. Without prefix delegation.</text>
  <text class="lbl" x="28" y="126">ENI 0</text>
  <rect class="mutf" x="100" y="100" width="58" height="40" rx="6"/>
  <text class="on13" x="129" y="124.5" text-anchor="middle">ENI IP</text>
  <rect class="pri" x="164" y="100" width="58" height="40" rx="6"/>
  <text class="on13" x="193" y="124.5" text-anchor="middle">pod</text>
  <rect class="pri" x="228" y="100" width="58" height="40" rx="6"/>
  <text class="on13" x="257" y="124.5" text-anchor="middle">pod</text>
  <rect class="pri" x="292" y="100" width="58" height="40" rx="6"/>
  <text class="on13" x="321" y="124.5" text-anchor="middle">pod</text>
  <rect class="pri" x="356" y="100" width="58" height="40" rx="6"/>
  <text class="on13" x="385" y="124.5" text-anchor="middle">pod</text>
  <rect class="pri" x="420" y="100" width="58" height="40" rx="6"/>
  <text class="on13" x="449" y="124.5" text-anchor="middle">pod</text>
  <text class="lbl" x="28" y="190">ENI 1</text>
  <rect class="mutf" x="100" y="164" width="58" height="40" rx="6"/>
  <text class="on13" x="129" y="188.5" text-anchor="middle">ENI IP</text>
  <rect class="pri" x="164" y="164" width="58" height="40" rx="6"/>
  <text class="on13" x="193" y="188.5" text-anchor="middle">pod</text>
  <rect class="pri" x="228" y="164" width="58" height="40" rx="6"/>
  <text class="on13" x="257" y="188.5" text-anchor="middle">pod</text>
  <rect class="pri" x="292" y="164" width="58" height="40" rx="6"/>
  <text class="on13" x="321" y="188.5" text-anchor="middle">pod</text>
  <rect class="pri" x="356" y="164" width="58" height="40" rx="6"/>
  <text class="on13" x="385" y="188.5" text-anchor="middle">pod</text>
  <rect class="pri" x="420" y="164" width="58" height="40" rx="6"/>
  <text class="on13" x="449" y="188.5" text-anchor="middle">pod</text>
  <text class="lbl" x="28" y="254">ENI 2</text>
  <rect class="mutf" x="100" y="228" width="58" height="40" rx="6"/>
  <text class="on13" x="129" y="252.5" text-anchor="middle">ENI IP</text>
  <rect class="pri" x="164" y="228" width="58" height="40" rx="6"/>
  <text class="on13" x="193" y="252.5" text-anchor="middle">pod</text>
  <rect class="pri" x="228" y="228" width="58" height="40" rx="6"/>
  <text class="on13" x="257" y="252.5" text-anchor="middle">pod</text>
  <rect class="pri" x="292" y="228" width="58" height="40" rx="6"/>
  <text class="on13" x="321" y="252.5" text-anchor="middle">pod</text>
  <rect class="pri" x="356" y="228" width="58" height="40" rx="6"/>
  <text class="on13" x="385" y="252.5" text-anchor="middle">pod</text>
  <rect class="pri" x="420" y="228" width="58" height="40" rx="6"/>
  <text class="on13" x="449" y="252.5" text-anchor="middle">pod</text>
  <text class="tx" x="500" y="120" font-weight="700">3 × (6 − 1) = 15 pod IPs</text>
  <text class="tx" x="500" y="144">+ 2 host-network pods</text>
  <text class="sm" x="500" y="168">(aws-node, kube-proxy)</text>
  <text class="h2 prit" x="500" y="198">= 17 pods max</text>
  <rect class="bb" x="500" y="230" width="270" height="40" rx="8" stroke-width="1.5"/>
  <text class="sm badt" x="514" y="255" font-weight="700">pod 18: Pending, Too many pods</text>
  <text class="tx" x="28" y="318">The node runs out of pod slots long before CPU or memory, and big clusters run out of subnet IPs.</text>
  <text class="sub" x="28" y="342">Fixes: prefix delegation (a /28 per slot, ~110 pods/node), secondary CIDRs (100.64.0.0/10),</text>
  <text class="sub" x="28" y="360">bigger instances; on AKS, Azure CNI Overlay gives pods IPs from an overlay range instead of the VNet.</text>
</svg>
