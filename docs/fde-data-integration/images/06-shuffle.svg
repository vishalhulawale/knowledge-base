.6"/><line class="ln" x1="282" y1="128" x2="518" y2="288" marker-end="url(#ar)" opacity="0.6"/><line class="ln" x1="282" y1="208" x2="518" y2="128" marker-end="url(#ar)" opacity="0.6"/><line class="ln" x1="282" y1="208" x2="518" y2="208" marker-end="url(#ar)" opacity="0.6"/><line class="ln" x1="282" y1="208" x2="518" y2="288" marker-end="url(#ar)" opacity="0.6"/><line class="ln" x1="282" y1="288" x2="518" y2="128" marker-end="url(#ar)" opacity="0.6"/><line class="ln" x1="282" y1="288" x2="518" y2="208" marker-end="url(#ar)" opacity="0.6"/><line class="ln" x1="282" y1="288" x2="518" y2="288" marker-end="url(#ar)" opacity="0.6"/><rect class="card" x="350" y="168" width="100" height="28" rx="6"/><text class="wrnt" x="400" y="187" text-anchor="middle" style="font-size:12px">disk + network</text></g><text class="sm" x="28" y="352">Fewer shuffles: filter and project first, broadcast the small side of a join (auto under 10 MB),</text><text class="sm" x="28" y="370">and let AQE coalesce partitions or split a skewed key. One hot key = one slow task.</text>
