<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Branch drift over ten days</title>
  <desc id="d">Animation: a cursor moves across ten working days. In the top lane, a long-lived feature branch runs beside trunk while teammates commit to trunk; five conflicting edits build up unseen and are all discovered together when the branch merges on day 10. In the bottom lane, the same work merges to trunk in a small change every day, and each of the five conflicts is found and fixed the same day. Illustrative.</desc>
