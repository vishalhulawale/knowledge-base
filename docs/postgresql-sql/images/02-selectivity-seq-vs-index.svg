  <text class="h" x="28" y="40">Selectivity decides: index or sequential scan</text>
  <text class="sub" x="28" y="62">Each square is a heap page of the claim table; same index on status in both cases.</text>

  <text class="code" x="28" y="96">status = 'PENDING'</text>
  <text class="sub" x="184" y="96">1 % of rows match</text>
  <rect class="ix" x="40" y="118" width="110" height="32" rx="8"/><text class="on" x="95" y="139" text-anchor="middle">index</text>
