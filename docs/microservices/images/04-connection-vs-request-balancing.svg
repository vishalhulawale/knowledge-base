<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Connection-level versus request-level balancing</title>
  <desc id="d">Two panels, each with one order pod calling three pharmacy pods. On the left, a ClusterIP Service balanced by kube-proxy: the single long-lived HTTP/2 or gRPC connection goes to pharmacy pod 1, so all six requests land there and pods 2 and 3 stay idle. On the right, a headless Service with client-side balancing, or a mesh, balances per request, so the six requests spread round-robin across all three pods.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ring{fill:#ffffff;stroke:#d97706;stroke-width:2.5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
      .ring{fill:#111827;stroke:#fbbf24}
    }

    .tok{animation:9s infinite linear;opacity:0}
    @keyframes L0{0%{transform:translate(210px,180px);opacity:0}2%{transform:translate(210px,180px);opacity:0}2.5%{transform:translate(210px,180px);opacity:1}10%{transform:translate(98px,272px);opacity:1}11%{transform:translate(98px,272px);opacity:0}100%{transform:translate(98px,272px);opacity:0}}
@keyframes R0{0%{transform:translate(590px,180px);opacity:0}2%{transform:translate(590px,180px);opacity:0}2.5%{transform:translate(590px,180px);opacity:1}10%{transform:translate(478px,272px);opacity:1}11%{transform:translate(478px,272px);opacity:0}100%{transform:translate(478px,272px);opacity:0}}
@keyframes L1{0%{transform:translate(210px,180px);opacity:0}15%{transform:translate(210px,180px);opacity:0}15.5%{transform:translate(210px,180px);opacity:1}23%{transform:translate(98px,272px);opacity:1}24%{transform:translate(98px,272px);opacity:0}100%{transform:translate(98px,272px);opacity:0}}
@keyframes R1{0%{transform:translate(590px,180px);opacity:0}15%{transform:translate(590px,180px);opacity:0}15.5%{transform:translate(590px,180px);opacity:1}23%{transform:translate(590px,272px);opacity:1}24%{transform:translate(590px,272px);opacity:0}100%{transform:translate(590px,272px);opacity:0}}
@keyframes L2{0%{transform:translate(210px,180px);opacity:0}28%{transform:translate(210px,180px);opacity:0}28.5%{transform:translate(210px,180px);opacity:1}36%{transform:translate(98px,272px);opacity:1}37%{transform:translate(98px,272px);opacity:0}100%{transform:translate(98px,272px);opacity:0}}
@keyframes R2{0%{transform:translate(590px,180px);opacity:0}28%{transform:translate(590px,180px);opacity:0}28.5%{transform:translate(590px,180px);opacity:1}36%{transform:translate(702px,272px);opacity:1}37%{transform:translate(702px,272px);opacity:0}100%{transform:translate(702px,272px);opacity:0}}
@keyframes L3{0%{transform:translate(210px,180px);opacity:0}41%{transform:translate(210px,180px);opacity:0}41.5%{transform:translate(210px,180px);opacity:1}49%{transform:translate(98px,272px);opacity:1}50%{transform:translate(98px,272px);opacity:0}100%{transform:translate(98px,272px);opacity:0}}
@keyframes R3{0%{transform:translate(590px,180px);opacity:0}41%{transform:translate(590px,180px);opacity:0}41.5%{transform:translate(590px,180px);opacity:1}49%{transform:translate(478px,272px);opacity:1}50%{transform:translate(478px,272px);opacity:0}100%{transform:translate(478px,272px);opacity:0}}
@keyframes L4{0%{transform:translate(210px,180px);opacity:0}54%{transform:translate(210px,180px);opacity:0}54.5%{transform:translate(210px,180px);opacity:1}62%{transform:translate(98px,272px);opacity:1}63%{transform:translate(98px,272px);opacity:0}100%{transform:translate(98px,272px);opacity:0}}
@keyframes R4{0%{transform:translate(590px,180px);opacity:0}54%{transform:translate(590px,180px);opacity:0}54.5%{transform:translate(590px,180px);opacity:1}62%{transform:translate(590px,272px);opacity:1}63%{transform:translate(590px,272px);opacity:0}100%{transform:translate(590px,272px);opacity:0}}
@keyframes L5{0%{transform:translate(210px,180px);opacity:0}67%{transform:translate(210px,180px);opacity:0}67.5%{transform:translate(210px,180px);opacity:1}75%{transform:translate(98px,272px);opacity:1}76%{transform:translate(98px,272px);opacity:0}100%{transform:translate(98px,272px);opacity:0}}
@keyframes R5{0%{transform:translate(590px,180px);opacity:0}67%{transform:translate(590px,180px);opacity:0}67.5%{transform:translate(590px,180px);opacity:1}75%{transform:translate(702px,272px);opacity:1}76%{transform:translate(702px,272px);opacity:0}100%{transform:translate(702px,272px);opacity:0}}

    .L0{animation-name:L0}.L1{animation-name:L1}.L2{animation-name:L2}.L3{animation-name:L3}.L4{animation-name:L4}.L5{animation-name:L5}.R0{animation-name:R0}.R1{animation-name:R1}.R2{animation-name:R2}.R3{animation-name:R3}.R4{animation-name:R4}.R5{animation-name:R5}
    @media (prefers-reduced-motion: reduce){.tok{animation:none;opacity:0}}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="408" rx="14"/>
  <text class="h" x="28" y="40">Where the balancing decision happens</text>
  <text class="sub" x="28" y="62">Six requests from one client pod over a single HTTP/2 connection.</text>
  <rect class="box" x="28" y="76" width="364" height="292" rx="10" stroke-width="1.5"/><text class="lbl" x="44" y="100">Connection-level (kube-proxy)</text><text class="sub" x="44" y="120">ClusterIP Service, gRPC or HTTP/2</text>
  <rect class="bp" x="140" y="136" width="140" height="44" rx="10" stroke-width="1.5"/><text class="tx" x="210" y="163" text-anchor="middle">Order pod</text>
  <rect class="bt" x="50" y="272" width="96" height="48" rx="10" stroke-width="1.5"/><text class="sub" x="98" y="301" text-anchor="middle">pharmacy #1</text>
  <rect class="bt" x="162" y="272" width="96" height="48" rx="10" stroke-width="1.5"/><text class="sub" x="210" y="301" text-anchor="middle">pharmacy #2</text>
  <rect class="bt" x="274" y="272" width="96" height="48" rx="10" stroke-width="1.5"/><text class="sub" x="322" y="301" text-anchor="middle">pharmacy #3</text>
  <line class="lnp" x1="210" y1="180" x2="98" y2="268" stroke-width="6" opacity="0.5"/>
<text class="sub" x="180" y="226">one long-lived HTTP/2</text><text class="sub" x="180" y="242">connection to pod #1</text>
<text class="sub" x="210" y="340" text-anchor="middle">idle</text><text class="sub" x="322" y="340" text-anchor="middle">idle</text>
  <rect class="box" x="408" y="76" width="364" height="292" rx="10" stroke-width="1.5"/><text class="lbl" x="424" y="100">Request-level</text><text class="sub" x="424" y="120">Headless Service + client LB, or a mesh</text>
  <rect class="bp" x="520" y="136" width="140" height="44" rx="10" stroke-width="1.5"/><text class="tx" x="590" y="163" text-anchor="middle">Order pod</text>
  <rect class="bt" x="430" y="272" width="96" height="48" rx="10" stroke-width="1.5"/><text class="sub" x="478" y="301" text-anchor="middle">pharmacy #1</text>
  <rect class="bt" x="542" y="272" width="96" height="48" rx="10" stroke-width="1.5"/><text class="sub" x="590" y="301" text-anchor="middle">pharmacy #2</text>
  <rect class="bt" x="654" y="272" width="96" height="48" rx="10" stroke-width="1.5"/><text class="sub" x="702" y="301" text-anchor="middle">pharmacy #3</text>
  <line class="ln" x1="590" y1="180" x2="478" y2="268" marker-end="url(#ar)"/>
  <line class="ln" x1="590" y1="180" x2="590" y2="268" marker-end="url(#ar)"/>
  <line class="ln" x1="590" y1="180" x2="702" y2="268" marker-end="url(#ar)"/>
<text class="sub okt" x="590" y="346" text-anchor="middle">Each request picks a pod: load spreads</text>
  <circle class="tok L0 pri" r="6"/><circle class="tok R0 pri" r="6"/><circle class="tok L1 pri" r="6"/><circle class="tok R1 pri" r="6"/><circle class="tok L2 pri" r="6"/><circle class="tok R2 pri" r="6"/><circle class="tok L3 pri" r="6"/><circle class="tok R3 pri" r="6"/><circle class="tok L4 pri" r="6"/><circle class="tok R4 pri" r="6"/><circle class="tok L5 pri" r="6"/><circle class="tok R5 pri" r="6"/>
  <text class="sub" x="28" y="392">kube-proxy picks a pod when the connection opens; every request on that connection then goes to the same pod.</text>
</svg>
