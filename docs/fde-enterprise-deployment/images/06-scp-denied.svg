<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Inference profile and SCP</title>
  <desc id="d">Animation: an app pod in eu-central-1 calls a Bedrock eu. geographic inference profile, and an organisation SCP allows only eu-central-1. Request 1 is routed to eu-central-1 and succeeds. Request 2 is routed to eu-west-1 for capacity and is denied by the SCP with AccessDeniedException, so failures look random. The fix allows every destination region of the profile in the SCP, with IAM permission on the profile ARN and the eu-* foundation-model ARNs, after which the eu-west-1 route succeeds. Global profiles also need the unspecified region allowed. Destination regions are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:16s infinite linear}
    @keyframes p1{0%,3.99%{opacity:0}4%,24.99%{opacity:1}25%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,24.99%{opacity:0}25%,49.99%{opacity:1}50%,100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%,49.99%{opacity:0}50%,96.99%{opacity:1}97%,100%{opacity:0}}.p3{animation-name:p3}
    @keyframes p4{0%,74.99%{opacity:0}75%,96.99%{opacity:1}97%,100%{opacity:0}}.p4{animation-name:p4}
    @keyframes p12{0%,3.99%{opacity:0}4%,49.99%{opacity:1}50%,100%{opacity:0}}.p12{animation-name:p12}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.p2,.p12{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="422" rx="14"/>
  <text class="h" x="28" y="40">Why a correct app gets AccessDeniedException</text><text class="sub" x="28" y="62">A geographic profile may run the request in another EU region. Destination regions are illustrative.</text><rect class="box" x="28" y="150" width="150" height="70" rx="8" stroke-width="1.5"/><text class="sm" x="103" y="181" text-anchor="middle">App pod</text><text class="sm" x="103" y="199" text-anchor="middle">eu-central-1, IRSA</text><rect class="bp" x="214" y="150" width="160" height="70" rx="8" stroke-width="1.5"/><text class="sm" x="294" y="181" text-anchor="middle">eu. inference</text><text class="sm" x="294" y="199" text-anchor="middle">profile</text><line class="ln" x1="180" y1="185" x2="212" y2="185" marker-end="url(#ar)"/><rect class="bw" x="412" y="92" width="128" height="232" rx="10" stroke-width="1.5"/><text class="wrnt" x="476" y="116" text-anchor="middle" style="font-size:14px">Org SCP</text><g class="k p12"><text class="sm" x="476" y="262" text-anchor="middle">allows</text><text class="sm" x="476" y="282" text-anchor="middle">eu-central-1</text><text class="sm" x="476" y="302" text-anchor="middle">only</text></g><g class="k p3"><text class="okt" x="476" y="250" text-anchor="middle">allows every</text><text class="okt" x="476" y="269" text-anchor="middle">destination</text><text class="okt" x="476" y="288" text-anchor="middle">region of</text><text class="okt" x="476" y="307" text-anchor="middle">the profile</text></g><rect class="box" x="580" y="100" width="192" height="50" rx="8" stroke-width="1.5"/><text class="mono" x="676" y="130" text-anchor="middle" xml:space="preserve">eu-central-1</text><rect class="box" x="580" y="170" width="192" height="50" rx="8" stroke-width="1.5"/><text class="mono" x="676" y="200" text-anchor="middle" xml:space="preserve">eu-west-1</text><rect class="box" x="580" y="240" width="192" height="50" rx="8" stroke-width="1.5"/><text class="mono" x="676" y="270" text-anchor="middle" xml:space="preserve">eu-west-3</text><g class="k p1"><path class="lno" d="M 376 185 C 400 185, 400 125, 578 125" marker-end="url(#aro)"/><text class="okt" x="676" y="94" text-anchor="middle" style="font-size:13px">200 OK</text></g><g class="k p2"><path class="lnb" d="M 376 185 C 395 185, 400 195, 470 195" marker-end="url(#arb)"/><circle class="badf" cx="476" cy="195" r="7"/><text class="badt" x="476" y="224" text-anchor="middle" style="font-size:13px">denied</text></g><g class="k p4"><path class="lno" d="M 376 185 C 400 185, 400 195, 578 195" marker-end="url(#aro)"/></g><g class="k p1"><text class="okt" x="28" y="352" style="font-size:13.5px">Request 1: profile routes to eu-central-1. Allowed.</text></g><g class="k p2"><text class="badt" x="28" y="352" style="font-size:13.5px">Request 2: profile routes to eu-west-1 for capacity. SCP denies → AccessDeniedException.</text></g><g class="k p3"><text class="okt" x="28" y="352" style="font-size:13.5px">Fix: allow every destination region in the SCP; IAM allows the profile ARN + eu-* model ARNs.</text></g><text class="sm" x="28" y="382">Failures look random: they appear only when the profile picks a region the SCP blocks.</text><text class="sub" x="28" y="404">Global profiles also need the "unspecified" region allowed.</text>
</svg>
