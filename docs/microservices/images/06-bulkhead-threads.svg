<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Bulkhead: cap the threads one dependency can hold</title>
  <desc id="d">Two grids of 40 squares, each standing for 5 of a service's 200 request threads, while the pharmacy dependency takes 10 seconds per call. Without a bulkhead, pharmacy calls take every thread and a member-only request finds no free thread and is rejected or times out. With a bulkhead of 20 concurrent pharmacy calls, pharmacy holds only 4 squares; the 21st pharmacy call is rejected at once with BulkheadFullException and falls back, while member requests keep getting threads and are served.</desc>
