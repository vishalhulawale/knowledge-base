<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Why selectivity decides index versus sequential scan</title>
  <desc id="d">Two rows of heap pages for the 1-million-row claim table. For status = 'PENDING', about 1 percent of rows, the index on status leads to a few scattered heap pages, so an Index Scan reads only those: 40 ms. For status = 'PAID', 90 percent of rows, matching rows sit on almost every page, so following the index would mean random reads of nearly the whole table; the planner instead reads every page once in physical order with a Seq Scan: 156 ms. Page counts are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .t{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#4f46e5;font-weight:600}
    .pg{fill:#ffffff;stroke:#cbd5e1}
    .ix{fill:#4f46e5}
    .on{fill:#fff;font-size:14px;font-weight:700}
    .hit{fill:#4f46e5}
    .jl{fill:none;stroke:#4f46e5;stroke-width:2}
    .pd{fill:#0ea5a4;fill-opacity:.55}
    .sweep{fill:#0ea5a4}
    .res{fill:#0f172a;font-size:14px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.res{fill:#f1f5f9}.lbl,.t{fill:#e2e8f0}.sub{fill:#94a3b8}
      .code{fill:#818cf8}.pg{fill:#111827;stroke:#475569}
      .ix,.hit{fill:#818cf8}.on{fill:#0f172a}.jl{stroke:#818cf8}
      .pd{fill:#2dd4bf}.sweep{fill:#2dd4bf}
    }
    /* 10 s loop: 4 index jumps 6-30%, result 34%; sequential sweep 42-84%, result 86%; reset 95% */
    .a{opacity:0;animation:10s infinite}
    @keyframes j0{0%,5%{opacity:0}7%,95%{opacity:1}98%,100%{opacity:0}}
    @keyframes j1{0%,13%{opacity:0}15%,95%{opacity:1}98%,100%{opacity:0}}
    @keyframes j2{0%,21%{opacity:0}23%,95%{opacity:1}98%,100%{opacity:0}}
    @keyframes j3{0%,29%{opacity:0}31%,95%{opacity:1}98%,100%{opacity:0}}
    @keyframes ra{0%,33%{opacity:0}36%,95%{opacity:1}98%,100%{opacity:0}}
    @keyframes rb{0%,84%{opacity:0}87%,95%{opacity:1}98%,100%{opacity:0}}
    @keyframes sw{0%,41%{transform:scaleX(0)}84%,95%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
    .j0{animation-name:j0}.j1{animation-name:j1}.j2{animation-name:j2}.j3{animation-name:j3}
    .ra{animation-name:ra}.rb{animation-name:rb}
    .sweepg{transform-origin:178px 0;transform:scaleX(0);animation:sw 10s infinite linear}
    @media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.sweepg{animation:none;transform:scaleX(1)}}
  </style>
