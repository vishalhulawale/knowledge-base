<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 374" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Horizontal layers versus vertical slices</title>
  <desc id="d">Animation: two three-by-three grids of layers (data, logic, output) against three features fill one cell at a time at the same pace. On the left, horizontal layers fill row by row: after six cells the data and logic rows are complete but no output exists, so when time runs out nothing is demoable. On the right, vertical slices fill column by column: features 1 and 2 are each complete through all three layers and marked demoable when time runs out.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes k0{0%,5.99%{opacity:0}6%,96.99%{opacity:1}97%,100%{opacity:0}}.k0{animation-name:k0}
    @keyframes k1{0%,13.99%{opacity:0}14%,96.99%{opacity:1}97%,100%{opacity:0}}.k1{animation-name:k1}
    @keyframes k2{0%,21.99%{opacity:0}22%,96.99%{opacity:1}97%,100%{opacity:0}}.k2{animation-name:k2}
    @keyframes k3{0%,29.99%{opacity:0}30%,96.99%{opacity:1}97%,100%{opacity:0}}.k3{animation-name:k3}
    @keyframes k4{0%,37.99%{opacity:0}38%,96.99%{opacity:1}97%,100%{opacity:0}}.k4{animation-name:k4}
    @keyframes k5{0%,45.99%{opacity:0}46%,96.99%{opacity:1}97%,100%{opacity:0}}.k5{animation-name:k5}
    @keyframes tu{0%,55.99%{opacity:0}56%,96.99%{opacity:1}97%,100%{opacity:0}}.tu{animation-name:tu}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="372" rx="14"/>
  <text class="h" x="28" y="40">Same effort, different result: layers vs vertical slices</text><text class="sub" x="28" y="62">Both build one cell at a time. Time runs out after six cells.</text><text class="h2" x="28" y="96">Horizontal layers</text><text class="sub" x="138" y="122" text-anchor="middle">Feature 1</text><text class="sub" x="208" y="122" text-anchor="middle">Feature 2</text><text class="sub" x="278" y="122" text-anchor="middle">Feature 3</text><text class="sm" x="28" y="152" font-weight="600">Data</text><rect class="box" x="108" y="132" width="60" height="34" rx="6" stroke-dasharray="4 4"/><rect class="box" x="178" y="132" width="60" height="34" rx="6" stroke-dasharray="4 4"/><rect class="box" x="248" y="132" width="60" height="34" rx="6" stroke-dasharray="4 4"/><text class="sm" x="28" y="194" font-weight="600">Logic</text><rect class="box" x="108" y="174" width="60" height="34" rx="6" stroke-dasharray="4 4"/><rect class="box" x="178" y="174" width="60" height="34" rx="6" stroke-dasharray="4 4"/><rect class="box" x="248" y="174" width="60" height="34" rx="6" stroke-dasharray="4 4"/><text class="sm" x="28" y="236" font-weight="600">Output</text><rect class="box" x="108" y="216" width="60" height="34" rx="6" stroke-dasharray="4 4"/><rect class="box" x="178" y="216" width="60" height="34" rx="6" stroke-dasharray="4 4"/><rect class="box" x="248" y="216" width="60" height="34" rx="6" stroke-dasharray="4 4"/><g class="k k0"><rect class="tea" x="108" y="132" width="60" height="34" rx="6"/></g><g class="k k1"><rect class="tea" x="178" y="132" width="60" height="34" rx="6"/></g><g class="k k2"><rect class="tea" x="248" y="132" width="60" height="34" rx="6"/></g><g class="k k3"><rect class="tea" x="108" y="174" width="60" height="34" rx="6"/></g><g class="k k4"><rect class="tea" x="178" y="174" width="60" height="34" rx="6"/></g><g class="k k5"><rect class="tea" x="248" y="174" width="60" height="34" rx="6"/></g><g class="k tu"><text class="badt" x="108" y="286" font-size="14">✗ Time's up: nothing demoable</text></g><text class="h2" x="412" y="96">Vertical slices</text><text class="sub" x="522" y="122" text-anchor="middle">Feature 1</text><text class="sub" x="592" y="122" text-anchor="middle">Feature 2</text><text class="sub" x="662" y="122" text-anchor="middle">Feature 3</text><text class="sm" x="412" y="152" font-weight="600">Data</text><rect class="box" x="492" y="132" width="60" height="34" rx="6" stroke-dasharray="4 4"/><rect class="box" x="562" y="132" width="60" height="34" rx="6" stroke-dasharray="4 4"/><rect class="box" x="632" y="132" width="60" height="34" rx="6" stroke-dasharray="4 4"/><text class="sm" x="412" y="194" font-weight="600">Logic</text><rect class="box" x="492" y="174" width="60" height="34" rx="6" stroke-dasharray="4 4"/><rect class="box" x="562" y="174" width="60" height="34" rx="6" stroke-dasharray="4 4"/><rect class="box" x="632" y="174" width="60" height="34" rx="6" stroke-dasharray="4 4"/><text class="sm" x="412" y="236" font-weight="600">Output</text><rect class="box" x="492" y="216" width="60" height="34" rx="6" stroke-dasharray="4 4"/><rect class="box" x="562" y="216" width="60" height="34" rx="6" stroke-dasharray="4 4"/><rect class="box" x="632" y="216" width="60" height="34" rx="6" stroke-dasharray="4 4"/><g class="k k0"><rect class="tea" x="492" y="132" width="60" height="34" rx="6"/></g><g class="k k1"><rect class="tea" x="492" y="174" width="60" height="34" rx="6"/></g><g class="k k2"><rect class="tea" x="492" y="216" width="60" height="34" rx="6"/></g><g class="k k3"><rect class="tea" x="562" y="132" width="60" height="34" rx="6"/></g><g class="k k4"><rect class="tea" x="562" y="174" width="60" height="34" rx="6"/></g><g class="k k5"><rect class="tea" x="562" y="216" width="60" height="34" rx="6"/></g><g class="k k2"><text class="okt" x="522" y="270" text-anchor="middle" font-size="13">✓ demo</text></g><g class="k k5"><text class="okt" x="592" y="270" text-anchor="middle" font-size="13">✓ demo</text></g><g class="k tu"><text class="okt" x="492" y="296" font-size="14">Time's up: two features demoable</text></g><line class="grid" x1="400" y1="90" x2="400" y2="300"/><text class="sm" x="28" y="332">A slice cuts through every layer, so each one ends in something the interviewer can see run.</text><text class="sm" x="28" y="350">Layers only pay off when the last one is done, which may be never in 45 minutes.</text>
</svg>
