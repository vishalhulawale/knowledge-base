<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Composite: a rule tree evaluated through one interface</title>
  <desc id="d">A cart worth 100 dollars priced by a tree of discount rules. The root is a RuleGroup that takes the best, the maximum, of its children. Its children are a leaf, 10 percent off, worth 10 dollars, and another RuleGroup that sums its own children: 5 dollars off a coupon and 3 dollars loyalty, 8 dollars in total. The root returns the larger, 10 dollars. The client calls apply(cart) on the root exactly as it would on a single rule.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <defs><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">One call, a whole tree</text>
  <text class="sub" x="28" y="62">Cart total $100. Every node is a PricingRule; groups combine their children&#x27;s results.</text>
  <rect class="bp" x="300" y="92" width="200" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="400" y="114" text-anchor="middle" font-weight="700">RuleGroup: best of</text>
  <text class="sm" x="400" y="131" text-anchor="middle">apply(cart) → $10</text>
  <rect class="bo" x="100" y="196" width="200" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="200" y="218" text-anchor="middle" font-weight="700">PercentageOff 10%</text>
  <text class="sm" x="200" y="235" text-anchor="middle">→ $10</text>
  <rect class="bp" x="500" y="196" width="200" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="600" y="218" text-anchor="middle" font-weight="700">RuleGroup: sum of</text>
  <text class="sm" x="600" y="235" text-anchor="middle">→ $8</text>
  <rect class="box" x="400" y="296" width="170" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="485" y="318" text-anchor="middle" font-weight="700">CouponOff $5</text>
  <text class="sm" x="485" y="335" text-anchor="middle">→ $5</text>
  <rect class="box" x="600" y="296" width="172" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="686" y="318" text-anchor="middle" font-weight="700">LoyaltyOff $3</text>
  <text class="sm" x="686" y="335" text-anchor="middle">→ $3</text>
  <line class="lnp" x1="360" y1="142" x2="220" y2="192" marker-end="url(#arp)"/>
  <line class="lnp" x1="440" y1="142" x2="580" y2="192" marker-end="url(#arp)"/>
  <line class="lnp" x1="560" y1="246" x2="490" y2="292" marker-end="url(#arp)"/>
  <line class="lnp" x1="640" y1="246" x2="686" y2="292" marker-end="url(#arp)"/>
  <text class="sm" x="28" y="106">client:</text>
  <text class="tx prit" x="28" y="124">rule.apply(cart)</text>
  <text class="sm" x="28" y="292">Leaves compute;</text>
  <text class="sm" x="28" y="310">groups delegate and combine.</text>
  <text class="sub" x="28" y="362">The client never checks &quot;is this a group?&quot;: adding a new rule type or nesting deeper changes no caller.</text>
</svg>
