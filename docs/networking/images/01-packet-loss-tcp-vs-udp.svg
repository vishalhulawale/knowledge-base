<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Packet loss: TCP vs UDP</title>
  <desc id="d">Two lanes compare how TCP and UDP handle a lost packet. In both, a sender transmits packets 1 to 5 and packet 3 is lost on the way. TCP lane: packets 1 and 2 are delivered to the application; packets 4 and 5 arrive but wait in the receive buffer because TCP must deliver bytes in order, which is head-of-line blocking. After duplicate ACKs or a retransmission timeout the sender resends 3, and when it arrives 3, 4 and 5 are delivered together. UDP lane: packets 1, 2, 4 and 5 are delivered to the application as soon as they arrive; packet 3 is never delivered and nothing resends it, so the application must cope with the gap. Timing is simplified.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnb{stroke:#dc2626;stroke-width:3;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnb{stroke:#f87171}.ah{fill:#94a3b8}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:linear}
    @keyframes tcpp1{0%,3.99%{opacity:0;transform:translateX(0)}4%{opacity:1;transform:translateX(0)}16%{opacity:1;transform:translateX(410px)}16.5%,100%{opacity:0;transform:translateX(410px)}}
    @keyframes tcpp2{0%,9.99%{opacity:0;transform:translateX(0)}10%{opacity:1;transform:translateX(0)}22%{opacity:1;transform:translateX(410px)}22.5%,100%{opacity:0;transform:translateX(410px)}}
    @keyframes tcpp3{0%,15.99%{opacity:0;transform:translateX(0)}16%{opacity:1;transform:translateX(0)}22%{opacity:1;transform:translateX(205px)}22.5%,100%{opacity:0;transform:translateX(205px)}}
    @keyframes tcpp4{0%,21.99%{opacity:0;transform:translateX(0)}22%{opacity:1;transform:translateX(0)}34%{opacity:1;transform:translateX(410px)}34.5%,100%{opacity:0;transform:translateX(410px)}}
    @keyframes tcpp5{0%,27.99%{opacity:0;transform:translateX(0)}28%{opacity:1;transform:translateX(0)}40%{opacity:1;transform:translateX(410px)}40.5%,100%{opacity:0;transform:translateX(410px)}}
    @keyframes tcpx{0%,21.5%{opacity:0}22%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes tcpr3{0%,45.99%{opacity:0;transform:translateX(0)}46%{opacity:1;transform:translateX(0)}58%{opacity:1;transform:translateX(410px)}58.5%,100%{opacity:0;transform:translateX(410px)}}
    @keyframes tcprl{0%,41.5%{opacity:0}42%,58%{opacity:1}58.5%,100%{opacity:0}}
    @keyframes tcpd1{0%,15.5%{opacity:0}16%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes tcpd2{0%,21.5%{opacity:0}22%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes tcpb4{0%,33.5%{opacity:0}34%,58%{opacity:1}58.5%,100%{opacity:0}}
    @keyframes tcpb5{0%,39.5%{opacity:0}40%,58%{opacity:1}58.5%,100%{opacity:0}}
    @keyframes tcpd3{0%,57.5%{opacity:0}58%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes tcpd4{0%,57.5%{opacity:0}58%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes tcpd5{0%,57.5%{opacity:0}58%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes tcpc0{0%,0%{opacity:0}0.5%,33.5%{opacity:1}34%,100%{opacity:0}}
    @keyframes tcpc1{0%,33.5%{opacity:0}34%,57.5%{opacity:1}58%,100%{opacity:0}}
    @keyframes tcpc2{0%,57.5%{opacity:0}58%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes udpp1{0%,3.99%{opacity:0;transform:translateX(0)}4%{opacity:1;transform:translateX(0)}16%{opacity:1;transform:translateX(410px)}16.5%,100%{opacity:0;transform:translateX(410px)}}
    @keyframes udpp2{0%,9.99%{opacity:0;transform:translateX(0)}10%{opacity:1;transform:translateX(0)}22%{opacity:1;transform:translateX(410px)}22.5%,100%{opacity:0;transform:translateX(410px)}}
    @keyframes udpp3{0%,15.99%{opacity:0;transform:translateX(0)}16%{opacity:1;transform:translateX(0)}22%{opacity:1;transform:translateX(205px)}22.5%,100%{opacity:0;transform:translateX(205px)}}
    @keyframes udpp4{0%,21.99%{opacity:0;transform:translateX(0)}22%{opacity:1;transform:translateX(0)}34%{opacity:1;transform:translateX(410px)}34.5%,100%{opacity:0;transform:translateX(410px)}}
    @keyframes udpp5{0%,27.99%{opacity:0;transform:translateX(0)}28%{opacity:1;transform:translateX(0)}40%{opacity:1;transform:translateX(410px)}40.5%,100%{opacity:0;transform:translateX(410px)}}
    @keyframes udpx{0%,21.5%{opacity:0}22%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes udpd1{0%,15.5%{opacity:0}16%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes udpd2{0%,21.5%{opacity:0}22%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes udpd4{0%,33.5%{opacity:0}34%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes udpd5{0%,39.5%{opacity:0}40%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes udpg{0%,33.5%{opacity:0}34%,90%{opacity:1}93%,100%{opacity:0}}
    @keyframes udpc0{0%,0%{opacity:0}0.5%,33.5%{opacity:1}34%,100%{opacity:0}}
    @keyframes udpc1{0%,33.5%{opacity:0}34%,90%{opacity:1}93%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){
      .a{animation:none !important;opacity:0}
      .rm{opacity:1}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="408" rx="14"/>
  <text class="h" x="28" y="40">One lost packet: TCP waits, UDP moves on</text>
  <text class="sub" x="28" y="62">The sender transmits 1–5; packet 3 is dropped in the network.</text>
  <text class="lbl" x="28" y="100"><tspan class="prit">TCP</tspan> — reliable, ordered byte stream</text>
  <rect class="box" x="28" y="120" width="100" height="44" rx="8" stroke-width="1.5"/><text class="tx" x="78" y="147" text-anchor="middle" font-weight="700">Sender</text>
  <path class="ln dash" d="M134 142 L588 142"/>
  <text class="sub" x="600" y="116">Receive buffer</text>
  <rect class="box" x="600" y="128" width="28" height="28" rx="5"/>
  <rect class="box" x="634" y="128" width="28" height="28" rx="5"/>
  <rect class="box" x="668" y="128" width="28" height="28" rx="5"/>
  <rect class="box" x="702" y="128" width="28" height="28" rx="5"/>
  <rect class="box" x="736" y="128" width="28" height="28" rx="5"/>
  <text class="sub" x="600" y="176">Delivered to app</text>
  <rect class="box" x="600" y="182" width="28" height="28" rx="5"/>
  <rect class="box" x="634" y="182" width="28" height="28" rx="5"/>
  <rect class="box" x="668" y="182" width="28" height="28" rx="5"/>
  <rect class="box" x="702" y="182" width="28" height="28" rx="5"/>
  <rect class="box" x="736" y="182" width="28" height="28" rx="5"/>
  <g class="a" style="animation-name:tcpp1"><rect class="pri" x="150" y="129" width="28" height="26" rx="5"/><text class="on" x="164" y="147" text-anchor="middle">1</text></g>
  <g class="a" style="animation-name:tcpp2"><rect class="pri" x="150" y="129" width="28" height="26" rx="5"/><text class="on" x="164" y="147" text-anchor="middle">2</text></g>
  <g class="a" style="animation-name:tcpp3"><rect class="pri" x="150" y="129" width="28" height="26" rx="5"/><text class="on" x="164" y="147" text-anchor="middle">3</text></g>
  <g class="a" style="animation-name:tcpp4"><rect class="pri" x="150" y="129" width="28" height="26" rx="5"/><text class="on" x="164" y="147" text-anchor="middle">4</text></g>
  <g class="a" style="animation-name:tcpp5"><rect class="pri" x="150" y="129" width="28" height="26" rx="5"/><text class="on" x="164" y="147" text-anchor="middle">5</text></g>
  <g class="a rm" style="animation-name:tcpx"><path class="lnb" d="M360 133 L378 151 M378 133 L360 151"/><text class="sub badt" x="369" y="174" text-anchor="middle">3 lost</text></g>
  <g class="a" style="animation-name:tcpr3"><rect class="wrnf" x="150" y="129" width="28" height="26" rx="5"/><text class="on" x="164" y="147" text-anchor="middle">3</text></g>
  <text class="sub wrnt a" style="animation-name:tcprl" x="150" y="120">3 duplicate ACKs or RTO → resend 3</text>
  <g class="a rm" style="animation-name:tcpd1"><rect class="okf" x="600" y="182" width="28" height="28" rx="5"/><text class="on" x="614" y="201" text-anchor="middle">1</text></g>
  <g class="a rm" style="animation-name:tcpd2"><rect class="okf" x="634" y="182" width="28" height="28" rx="5"/><text class="on" x="648" y="201" text-anchor="middle">2</text></g>
  <g class="a" style="animation-name:tcpb4"><rect class="wrnf" x="702" y="128" width="28" height="28" rx="5"/><text class="on" x="716" y="147" text-anchor="middle">4</text></g>
  <g class="a" style="animation-name:tcpb5"><rect class="wrnf" x="736" y="128" width="28" height="28" rx="5"/><text class="on" x="750" y="147" text-anchor="middle">5</text></g>
  <g class="a rm" style="animation-name:tcpd3"><rect class="okf" x="668" y="182" width="28" height="28" rx="5"/><text class="on" x="682" y="201" text-anchor="middle">3</text></g>
  <g class="a rm" style="animation-name:tcpd4"><rect class="okf" x="702" y="182" width="28" height="28" rx="5"/><text class="on" x="716" y="201" text-anchor="middle">4</text></g>
  <g class="a rm" style="animation-name:tcpd5"><rect class="okf" x="736" y="182" width="28" height="28" rx="5"/><text class="on" x="750" y="201" text-anchor="middle">5</text></g>
  <text class="tx a" style="animation-name:tcpc0" x="28" y="242">Segments arrive in order and are handed to the app.</text>
  <text class="tx a" style="animation-name:tcpc1" x="28" y="242"><tspan class="wrnt">Head-of-line blocking:</tspan> 4 and 5 arrived but wait until 3 is resent.</text>
  <text class="tx a rm" style="animation-name:tcpc2" x="28" y="242"><tspan class="okt">3 arrives:</tspan> 3, 4, 5 delivered together, in order. Cost: about one extra RTT.</text>
  <text class="lbl" x="28" y="270"><tspan class="prit">UDP</tspan> — independent datagrams, no resend</text>
  <rect class="box" x="28" y="290" width="100" height="44" rx="8" stroke-width="1.5"/><text class="tx" x="78" y="317" text-anchor="middle" font-weight="700">Sender</text>
  <path class="ln dash" d="M134 312 L588 312"/>
  <text class="sub" x="600" y="286">Delivered to app</text>
  <rect class="box" x="600" y="298" width="28" height="28" rx="5"/>
  <rect class="box" x="634" y="298" width="28" height="28" rx="5"/>
  <rect class="box" x="668" y="298" width="28" height="28" rx="5"/>
  <rect class="box" x="702" y="298" width="28" height="28" rx="5"/>
  <rect class="box" x="736" y="298" width="28" height="28" rx="5"/>
  <g class="a" style="animation-name:udpp1"><rect class="pri" x="150" y="299" width="28" height="26" rx="5"/><text class="on" x="164" y="317" text-anchor="middle">1</text></g>
  <g class="a" style="animation-name:udpp2"><rect class="pri" x="150" y="299" width="28" height="26" rx="5"/><text class="on" x="164" y="317" text-anchor="middle">2</text></g>
  <g class="a" style="animation-name:udpp3"><rect class="pri" x="150" y="299" width="28" height="26" rx="5"/><text class="on" x="164" y="317" text-anchor="middle">3</text></g>
  <g class="a" style="animation-name:udpp4"><rect class="pri" x="150" y="299" width="28" height="26" rx="5"/><text class="on" x="164" y="317" text-anchor="middle">4</text></g>
  <g class="a" style="animation-name:udpp5"><rect class="pri" x="150" y="299" width="28" height="26" rx="5"/><text class="on" x="164" y="317" text-anchor="middle">5</text></g>
  <g class="a rm" style="animation-name:udpx"><path class="lnb" d="M360 303 L378 321 M378 303 L360 321"/><text class="sub badt" x="369" y="344" text-anchor="middle">3 lost</text></g>
  <g class="a rm" style="animation-name:udpd1"><rect class="okf" x="600" y="298" width="28" height="28" rx="5"/><text class="on" x="614" y="317" text-anchor="middle">1</text></g>
  <g class="a rm" style="animation-name:udpd2"><rect class="okf" x="634" y="298" width="28" height="28" rx="5"/><text class="on" x="648" y="317" text-anchor="middle">2</text></g>
  <g class="a rm" style="animation-name:udpd4"><rect class="okf" x="702" y="298" width="28" height="28" rx="5"/><text class="on" x="716" y="317" text-anchor="middle">4</text></g>
  <g class="a rm" style="animation-name:udpd5"><rect class="okf" x="736" y="298" width="28" height="28" rx="5"/><text class="on" x="750" y="317" text-anchor="middle">5</text></g>
  <rect class="bb a dash rm" style="animation-name:udpg" x="668" y="298" width="28" height="28" rx="5" stroke-width="1.5"/>
  <text class="tx a" style="animation-name:udpc0" x="28" y="368">Each datagram is delivered as soon as it arrives.</text>
  <text class="tx a rm" style="animation-name:udpc1" x="28" y="368"><tspan class="okt">4 and 5 delivered at once;</tspan> <tspan class="badt">3 is simply gone.</tspan> The app decides: skip, conceal or ask again.</text>
  <text class="sub" x="28" y="390">Simplified timing. QUIC (HTTP/3) keeps TCP-style reliability but per stream, so a loss stalls only its own stream.</text>
</svg>
