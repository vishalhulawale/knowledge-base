<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">One timeout, three different worlds</title>
  <desc id="d">The orders service calls charge on the payment service with a 2-second timeout, in three parallel lanes. Lane 1: the request is lost, the payment service never sees it and nothing is charged. Lane 2: the payment service is slow and charges at 3 seconds, after the caller has given up. Lane 3: the charge happens and the 200 response is lost. In all three lanes the orders service sees exactly the same thing: a timeout at 2 seconds. Only an idempotency key or a status query can tell them apart.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:14s infinite linear}
    @keyframes s00{0%{opacity:0}4.4%{opacity:0}5.4%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .s00{animation-name:s00}
    @keyframes o0{0%{opacity:0}80.4%{opacity:0}81.4%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .o0{animation-name:o0}
    @keyframes s10{0%{opacity:0}4.4%{opacity:0}5.4%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .s10{animation-name:s10}
    @keyframes s11{0%{opacity:0}66%{opacity:0}67%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .s11{animation-name:s11}
    @keyframes o1{0%{opacity:0}80.4%{opacity:0}81.4%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .o1{animation-name:o1}
    @keyframes s20{0%{opacity:0}4.4%{opacity:0}5.4%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .s20{animation-name:s20}
    @keyframes s21{0%{opacity:0}17.6%{opacity:0}18.6%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .s21{animation-name:s21}
    @keyframes o2{0%{opacity:0}80.4%{opacity:0}81.4%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .o2{animation-name:o2}
    @keyframes to{0%{opacity:0}43%{opacity:0}44%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .to{animation-name:to}
    @keyframes cur{0%{transform:translate(0px,0px)}88%{transform:translate(560px,0px)}100%{transform:translate(560px,0px)}}
    .cur{animation:cur 14s infinite linear}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .cur{transform:translate(0,0)}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">charge(order 42) with a 2 s timeout</text>
  <text class="sub" x="28" y="62">Three lanes, three different realities. The caller sees the same timeout in all of them.</text>
  <line class="ln dash" x1="190.0" x2="190.0" y1="92" y2="300" style="stroke-width:1;opacity:.5"/>
  <text class="sm" x="190" y="316" text-anchor="middle">0 s</text>
  <line class="ln dash" x1="330.0" x2="330.0" y1="92" y2="300" style="stroke-width:1;opacity:.5"/>
  <text class="sm" x="330" y="316" text-anchor="middle">1 s</text>
  <line class="ln dash" x1="470.0" x2="470.0" y1="92" y2="300" style="stroke-width:1;opacity:.5"/>
  <text class="sm" x="470" y="316" text-anchor="middle">2 s</text>
  <line class="ln dash" x1="610.0" x2="610.0" y1="92" y2="300" style="stroke-width:1;opacity:.5"/>
  <text class="sm" x="610" y="316" text-anchor="middle">3 s</text>
  <line class="ln dash" x1="750.0" x2="750.0" y1="92" y2="300" style="stroke-width:1;opacity:.5"/>
  <text class="sm" x="750" y="316" text-anchor="middle">4 s</text>
  <text class="lbl" x="28" y="122">1  request lost</text>
  <g class="a s00">
  <rect class="badf" x="218" y="104" width="54" height="26" rx="5"/>
  <text class="on13" x="245" y="121.5" text-anchor="middle">lost ✕</text>
  </g>
  <text class="sm a o0" x="218" y="150">payment side: not charged</text>
  <text class="lbl" x="28" y="186">2  payment slow</text>
  <g class="a s10">
  <rect class="wrnf" x="218" y="168" width="390" height="26" rx="5"/>
  <text class="on13" x="413" y="185.5" text-anchor="middle">processing…</text>
  </g>
  <g class="a s11">
  <rect class="okf" x="610" y="168" width="82" height="26" rx="5"/>
  <text class="on13" x="651" y="185.5" text-anchor="middle">charged</text>
  </g>
  <text class="sm a o1" x="218" y="214">payment side: charged after A gave up</text>
  <text class="lbl" x="28" y="250">3  response lost</text>
  <g class="a s20">
  <rect class="okf" x="218" y="232" width="82" height="26" rx="5"/>
  <text class="on13" x="259" y="249.5" text-anchor="middle">charged</text>
  </g>
  <g class="a s21">
  <rect class="badf" x="302" y="232" width="82" height="26" rx="5"/>
  <text class="on13" x="343" y="249.5" text-anchor="middle">200 lost ✕</text>
  </g>
  <text class="sm a o2" x="218" y="278">payment side: charged, A doesn&#x27;t know</text>
  <line class="a to lnb" x1="470.0" x2="470.0" y1="92" y2="300" style="stroke-width:3"/>
  <text class="sm badt a to" x="476" y="300">A: TimeoutException (all 3 lanes)</text>
  <g class="cur">
  <line x1="190" x2="190" y1="92" y2="300" class="lnw" style="stroke-width:2"/>
  </g>
  <text class="tx" x="28" y="356">Retrying blindly double-charges in lanes 2 and 3; not retrying loses the charge in lane 1.</text>
  <text class="tx okt" x="28" y="380">Safe answers: an idempotency key on the retry, or ask &quot;what is the status of payment X?&quot;.</text>
</svg>
