<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Technical debt quadrant</title>
  <desc id="d">Martin Fowler&#x27;s technical debt quadrant with two axes: deliberate versus inadvertent, and reckless versus prudent. Reckless and deliberate: we don&#x27;t have time for design. Prudent and deliberate: we must ship now and will deal with the consequences, recorded with a payback plan. Reckless and inadvertent: what&#x27;s layering? Prudent and inadvertent: now we know how we should have done it, the normal result of learning. Prudent debt is acceptable when tracked; reckless debt is a skills or culture problem.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">Not all debt is a mistake</text>
  <text class="sub" x="28" y="62">Martin Fowler&#x27;s technical debt quadrant, with how a lead responds to each.</text>
  <rect class="bb" x="140" y="110" width="310" height="120" rx="12" stroke-width="1.5"/>
  <text class="lbl" x="156" y="138">Reckless + deliberate</text>
  <text class="tx" x="156" y="166">&quot;We don&#x27;t have time for design.&quot;</text>
  <text class="sm" x="156" y="202">culture problem: push back</text>
  <rect class="bo" x="462" y="110" width="310" height="120" rx="12" stroke-width="1.5"/>
  <text class="lbl" x="478" y="138">Prudent + deliberate</text>
  <text class="tx" x="478" y="166">&quot;Ship now, deal with it later.&quot;</text>
  <text class="sm" x="478" y="202">fine if recorded with a payback date</text>
  <rect class="bw" x="140" y="242" width="310" height="120" rx="12" stroke-width="1.5"/>
  <text class="lbl" x="156" y="270">Reckless + inadvertent</text>
  <text class="tx" x="156" y="298">&quot;What&#x27;s layering?&quot;</text>
  <text class="sm" x="156" y="334">skills gap: pairing, reviews, standards</text>
  <rect class="bt" x="462" y="242" width="310" height="120" rx="12" stroke-width="1.5"/>
  <text class="lbl" x="478" y="270">Prudent + inadvertent</text>
  <text class="tx" x="478" y="298">&quot;Now we know how it should be done.&quot;</text>
  <text class="sm" x="478" y="334">normal learning: refactor as you go</text>
  <text class="sm" x="295" y="100" text-anchor="middle" font-weight="700">reckless</text>
  <text class="sm" x="617" y="100" text-anchor="middle" font-weight="700">prudent</text>
  <text class="sm" x="128" y="174" text-anchor="end" font-weight="700">deliberate</text>
  <text class="sm" x="128" y="306" text-anchor="end" font-weight="700">inadvertent</text>
  <text class="sub" x="28" y="400">Track it in a debt register with impact (hours lost, incidents) and budget 15–20% of capacity to pay it down.</text>
</svg>
