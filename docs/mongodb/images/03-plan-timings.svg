<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Measured query time by index</title>
  <desc id="d">Execution time on 200,000 claims for the query: DENIED claims in March, sorted by amount descending, limit 20. No index: collection scan of 200,000 documents plus sort, 111 ms. Index on serviceDate then status: 4,105 documents examined plus sort, 17 ms. Index on status then serviceDate: 4,105 documents plus sort, 24 ms. ESR index status, amount, serviceDate: 20 documents, no sort, 2 ms.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .bar{fill:#4f46e5}.bar2{fill:#16a34a}@media (prefers-color-scheme: dark){.bar{fill:#6366f1}.bar2{fill:#16a34a}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="368" rx="14"/>
  <text class="h" x="28" y="40">Same query, four plans</text>
  <text class="sub" x="28" y="62">DENIED + March, sort amount desc, limit 20 on 200,000 claims. Measured on the page.</text>
  <text class="tx" x="278" y="120" text-anchor="end" font-weight="600">no index (COLLSCAN)</text>
  <rect class="bar" x="290" y="104" width="400" height="24" rx="4"/>
  <text class="tx" x="698" y="121" font-weight="700">111 ms</text>
  <text class="sm" x="296" y="146">200,000 docs + SORT</text>
  <text class="tx" x="278" y="176" text-anchor="end" font-weight="600">{serviceDate, status}</text>
  <rect class="bar" x="290" y="160" width="61.2613" height="24" rx="4"/>
  <text class="tx" x="359.261" y="177" font-weight="700">17 ms</text>
  <text class="sm" x="296" y="202">4,105 docs + SORT</text>
  <text class="tx" x="278" y="232" text-anchor="end" font-weight="600">{status, serviceDate}</text>
  <rect class="bar" x="290" y="216" width="86.4865" height="24" rx="4"/>
  <text class="tx" x="384.486" y="233" font-weight="700">24 ms</text>
  <text class="sm" x="296" y="258">4,105 docs + SORT</text>
  <text class="tx" x="278" y="288" text-anchor="end" font-weight="600">{status, amount, serviceDate}</text>
  <rect class="bar2" x="290" y="272" width="7.20721" height="24" rx="4"/>
  <text class="tx" x="305.207" y="289" font-weight="700">2 ms</text>
  <text class="sm" x="296" y="314">20 docs, no SORT</text>
  <line class="ln" x1="290" y1="96" x2="290" y2="316" style="stroke-width:1"/>
  <text class="sub" x="28" y="352">The ESR index wins by reading 20 documents in order, not by reading fewer March claims.</text>
</svg>
