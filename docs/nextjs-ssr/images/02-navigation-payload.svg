<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">App Router navigation payload</title>
  <desc id="d">Animation in two phases. First, a direct visit to the claims list: the browser receives the HTML document, the RSC payload for all segments and JavaScript for the framework and client islands, and the root layout, claims layout and page are all rendered. Second, clicking a link to claim 42: only the RSC payload for the changed page segment travels, only the page area re-renders, and the header and sidebar layouts keep their state.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes p1{0%,45.99%{opacity:1}46%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,49.99%{opacity:0}50%,98.99%{opacity:1}99%,100%{opacity:0}}.p2{animation-name:p2}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.p2{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="402" rx="14"/>
  <text class="h" x="28" y="40">First load vs client navigation</text><text class="sub" x="28" y="62">What travels over the network, and which parts of the screen are re-rendered.</text><rect class="box" x="28" y="84" width="400" height="270" rx="10" stroke-width="1.5"/><rect class="bm" x="28" y="84" width="400" height="26" rx="10"/><g class="k p1"><text class="mono" x="42" y="102" xml:space="preserve">/claims</text></g><g class="k p2"><text class="mono" x="42" y="102" xml:space="preserve">/claims/42</text></g><rect class="bm" x="38" y="118" width="380" height="34" rx="6"/><rect class="bm" x="38" y="160" width="120" height="184" rx="6"/><rect class="bm" x="168" y="160" width="250" height="184" rx="6"/><g class="k p1"><rect class="bt" x="38" y="118" width="380" height="34" rx="6" stroke-width="1.5"/><rect class="bt" x="38" y="160" width="120" height="184" rx="6" stroke-width="1.5"/><rect class="bt" x="168" y="160" width="250" height="184" rx="6" stroke-width="1.5"/></g><g class="k p2"><rect class="bp" x="168" y="160" width="250" height="184" rx="6" stroke-width="1.5"/></g><text class="sm" x="52" y="140">root layout (header)</text><text class="sm" x="48" y="184">claims</text><text class="sm" x="48" y="202">layout</text><text class="sm" x="48" y="220">(sidebar,</text><text class="sm" x="48" y="238">filters)</text><g class="k p1"><text class="sm" x="184" y="194">page: claims list</text></g><g class="k p2"><text class="sm" x="184" y="194">page: claim 42</text></g><g class="k p1"><text class="teat" x="184" y="324" style="font-size:13px">everything rendered</text></g><g class="k p2"><text class="prit" x="184" y="306" style="font-size:13px">only this segment</text><text class="prit" x="184" y="324" style="font-size:13px">re-rendered</text></g><g class="k p2"><text class="okt" x="48" y="280" style="font-size:12px">kept: state</text><text class="okt" x="48" y="296" style="font-size:12px">preserved</text></g><text class="lbl" x="456" y="100">Network</text><g class="k p1"><text class="teat" x="456" y="300" style="font-size:14px">1. Direct visit or refresh</text><rect class="bt" x="456" y="116" width="316" height="34" rx="6" stroke-width="1.5"/><text class="sm" x="468" y="138">HTML document</text><rect class="bt" x="456" y="160" width="316" height="34" rx="6" stroke-width="1.5"/><text class="sm" x="468" y="182">RSC payload: all segments</text><rect class="bt" x="456" y="204" width="316" height="34" rx="6" stroke-width="1.5"/><text class="sm" x="468" y="226">JS: framework + client islands</text></g><g class="k p2"><text class="prit" x="456" y="300" style="font-size:14px">2. Click a Link to /claims/42</text><rect class="bp" x="456" y="116" width="316" height="34" rx="6" stroke-width="1.5"/><text class="sm" x="468" y="138">RSC payload: [id] segment only</text><text class="sub" x="456" y="186">No HTML, no layout payload.</text><text class="sub" x="456" y="204">JS for claim 42's client islands</text><text class="sub" x="456" y="222">only if not loaded yet.</text></g><text class="sm" x="28" y="384">Layouts persist across navigations, so a check placed only in a layout does not re-run on every request.</text>
</svg>
