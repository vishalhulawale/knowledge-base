<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Rendering strategy timelines</title>
  <desc id="d">Animation: a time cursor sweeps across three lanes. Client-side rendering shows nothing until the JavaScript downloads and runs and the API data arrives, then content and interactivity appear together at about 1,900 ms. Server-side rendering shows content at about 650 ms after the server render, then downloads JavaScript and hydrates, becoming interactive at about 1,900 ms. Static generation or ISR serves HTML from the CDN, showing content at about 150 ms and becoming interactive after hydration at about 1,400 ms. Timings are illustrative.</desc>
  <style>
