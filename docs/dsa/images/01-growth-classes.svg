<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">How growth classes compare</title>
  <desc id="d">Line chart of operations against input size n from 1 to 20, with the vertical axis capped at 100 operations. log n stays below 5, n reaches 20, n log n reaches about 86 at n = 20, n squared leaves the chart at n = 10, and 2 to the power n leaves it before n = 7. A side note says that doubling n doubles O(n) work and quadruples O(n squared) work.</desc>
