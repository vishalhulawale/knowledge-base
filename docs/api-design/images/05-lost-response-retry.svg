<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">A lost 201 and a retry: with and without an Idempotency-Key</title>
  <desc id="d">A client posts a refill request. The server creates the refill and returns 201, but the response is lost on the network, so the client times out and retries. Without a key the server can&#x27;t tell the retry from a new request and creates a second refill: the patient gets two fills. With an Idempotency-Key, the retry carries the same key k-7f3; the server finds the completed key with a matching fingerprint and replays the original 201 without creating anything, marked Idempotent-Replayed true.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:14s infinite linear}
    @keyframes p0{0%,30%{opacity:1}31%{opacity:0}100%{opacity:0}}
    .p0{animation-name:p0}
    @keyframes p1{0%{opacity:0}30%{opacity:0}31%,58%{opacity:1}59%{opacity:0}100%{opacity:0}}
    .p1{animation-name:p1}
    @keyframes p2{0%{opacity:0}58%{opacity:0}59%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p2{animation-name:p2}
    @keyframes r0{0%{opacity:0}5%{opacity:0}6%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .r0{animation-name:r0}
    @keyframes r1{0%{opacity:0}5%{opacity:0}6%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .r1{animation-name:r1}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .p0,.p1{opacity:0!important}
    }
  </style>
  <defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">POST /refills, response lost, client retries</text>
  <text class="sub" x="28" y="62">The client can&#x27;t know whether the first attempt worked. The key lets the server know.</text>
  <line class="ln dash" x1="400" y1="84" x2="400" y2="320"/>
  <text class="h2" x="28" y="102">No key</text>
  <rect class="box" x="28" y="120" width="110" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="83" y="145" text-anchor="middle" font-weight="700">Client</text>
  <rect class="box" x="260" y="120" width="120" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="320" y="145" text-anchor="middle" font-weight="700">Refill API</text>
  <text class="sm" x="260" y="190">refills table</text>
  <rect class="box" x="260" y="198" width="56" height="30" rx="5"/>
  <rect class="box" x="322" y="198" width="56" height="30" rx="5"/>
  <g class="a r0">
  <rect class="pri" x="260" y="198" width="56" height="30" rx="5"/>
  <text class="on13" x="288" y="217.5" text-anchor="middle">R1</text>
  </g>
  <line class="lnp a p0" x1="140" y1="134" x2="256" y2="134" marker-end="url(#arp)"/>
  <text class="sm a p0" x="198" y="128" text-anchor="middle">POST</text>
  <line class="lnb a p1" x1="256" y1="150" x2="198" y2="150" marker-end="url(#arb)"/>
  <text class="tx badt a p1" x="186" y="156">✕</text>
  <text class="sm badt a p1" x="198" y="176" text-anchor="middle">201 lost: timeout</text>
  <line class="lnw a p2" x1="140" y1="134" x2="256" y2="134" marker-end="url(#arw)"/>
  <text class="sm wrnt a p2" x="198" y="128" text-anchor="middle">retry</text>
  <text class="h2" x="420" y="102">Idempotency-Key: &quot;k-7f3&quot;</text>
  <rect class="box" x="420" y="120" width="110" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="475" y="145" text-anchor="middle" font-weight="700">Client</text>
  <rect class="box" x="652" y="120" width="120" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="712" y="145" text-anchor="middle" font-weight="700">Refill API</text>
  <text class="sm" x="652" y="190">refills table</text>
  <rect class="box" x="652" y="198" width="56" height="30" rx="5"/>
  <rect class="box" x="714" y="198" width="56" height="30" rx="5"/>
  <g class="a r1">
  <rect class="pri" x="652" y="198" width="56" height="30" rx="5"/>
  <text class="on13" x="680" y="217.5" text-anchor="middle">R1</text>
  </g>
  <line class="lnp a p0" x1="532" y1="134" x2="648" y2="134" marker-end="url(#arp)"/>
  <text class="sm a p0" x="590" y="128" text-anchor="middle">POST</text>
  <line class="lnb a p1" x1="648" y1="150" x2="590" y2="150" marker-end="url(#arb)"/>
  <text class="tx badt a p1" x="578" y="156">✕</text>
  <text class="sm badt a p1" x="590" y="176" text-anchor="middle">201 lost: timeout</text>
  <line class="lnw a p2" x1="532" y1="134" x2="648" y2="134" marker-end="url(#arw)"/>
  <text class="sm wrnt a p2" x="590" y="128" text-anchor="middle">retry, same key</text>
  <g class="a p2">
  <rect class="badf" x="322" y="198" width="56" height="30" rx="5"/>
  <text class="on13" x="350" y="217.5" text-anchor="middle">R2</text>
  </g>
  <text class="tx badt a p2" x="28" y="262">Second refill created: two fills</text>
  <text class="tx okt a p2" x="420" y="262">Key found, COMPLETED, same fingerprint:</text>
  <text class="tx okt a p2" x="420" y="282">replay 201 + Idempotent-Replayed: true</text>
  <text class="lbl a p0" x="28" y="352">1  POST creates refill R1</text>
  <text class="lbl badt a p1" x="28" y="352">2  The 201 never arrives; the client only sees a timeout</text>
  <text class="lbl a p2" x="28" y="352">3  Retry: only the key distinguishes &quot;again&quot; from &quot;new&quot;</text>
  <text class="sub" x="28" y="386">Same key + different body → 422; same key while the first is still running → 409 + Retry-After.</text>
</svg>
