    @keyframes g9{0%,75%{transform:scaleX(0)}85%,100%{transform:scaleX(1)}}.g9{animation-name:g9}
    @keyframes g10{0%,75%{transform:scaleX(0)}85%,100%{transform:scaleX(1)}}.g10{animation-name:g10}
    @media (prefers-reduced-motion: reduce){.g{animation:none;transform:none}}
