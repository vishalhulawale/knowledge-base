<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 402" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">One word, three models</title>
  <desc id="d">Three cards side by side, each titled Prescription. In the Intake context it has drug and strength, directions, refills authorised, prescriber and validity, with statuses received, verified and on hold. In Fulfilment it has NDC and quantity, dispensing pharmacy, ship-by date and tracking number, with statuses queued, filled and shipped. In Claims and Benefits it has drug code and days' supply, plan and eligibility, price and copay, and accumulators, with statuses submitted, adjudicated and reversed. Dashed arrows lead from each card to one shared bar: only the PrescriptionId and published events cross the boundaries. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="400" rx="14"/>
  <text class="h" x="28" y="40">One word, three models</text><text class="sub" x="28" y="62">"Prescription" in three bounded contexts of an online pharmacy (illustrative).</text><rect class="bp" x="28" y="84" width="236" height="226" rx="10" stroke-width="1.5"/><text class="prit" x="44" y="110" style="font-size:14px">Intake context</text><text class="h2" x="44" y="136">Prescription</text><text class="sm" x="44" y="162">• drug + strength</text><text class="sm" x="44" y="184">• sig (directions)</text><text class="sm" x="44" y="206">• refills authorised</text><text class="sm" x="44" y="228">• prescriber, validity</text><line class="grid" x1="44" y1="254" x2="248" y2="254"/><text class="sub" x="44" y="274">status</text><text class="sm" x="40" y="294" font-weight="700" style="font-size:12px">Received · Verified · On hold</text><line class="ln dash" x1="146" y1="310" x2="146" y2="340" marker-end="url(#ar)"/><rect class="bt" x="282" y="84" width="236" height="226" rx="10" stroke-width="1.5"/><text class="teat" x="298" y="110" style="font-size:14px">Fulfilment context</text><text class="h2" x="298" y="136">Prescription</text><text class="sm" x="298" y="162">• NDC, quantity</text><text class="sm" x="298" y="184">• dispensing pharmacy</text><text class="sm" x="298" y="206">• ship-by date</text><text class="sm" x="298" y="228">• tracking number</text><line class="grid" x1="298" y1="254" x2="502" y2="254"/><text class="sub" x="298" y="274">status</text><text class="sm" x="294" y="294" font-weight="700" style="font-size:12px">Queued · Filled · Shipped</text><line class="ln dash" x1="400" y1="310" x2="400" y2="340" marker-end="url(#ar)"/><rect class="bw" x="536" y="84" width="236" height="226" rx="10" stroke-width="1.5"/><text class="wrnt" x="552" y="110" style="font-size:14px">Claims &amp; Benefits context</text><text class="h2" x="552" y="136">Prescription</text><text class="sm" x="552" y="162">• drug code, days' supply</text><text class="sm" x="552" y="184">• plan, eligibility</text><text class="sm" x="552" y="206">• price, copay</text><text class="sm" x="552" y="228">• accumulators</text><line class="grid" x1="552" y1="254" x2="756" y2="254"/><text class="sub" x="552" y="274">status</text><text class="sm" x="548" y="294" font-weight="700" style="font-size:12px">Submitted · Adjudicated · Reversed</text><line class="ln dash" x1="654" y1="310" x2="654" y2="340" marker-end="url(#ar)"/><rect class="bm" x="150" y="344" width="500" height="38" rx="8" stroke-width="1.5"/><text class="lbl" x="400" y="368" text-anchor="middle">Only PrescriptionId and published events cross the boundaries</text>
</svg>
