<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">CrashLoopBackOff: exponential restart delays</title>
  <desc id="d">A container exits with code 1 a moment after each start because a required config value is missing. The kubelet restarts it after 10 seconds, then waits 20, 40, 80 and 160 seconds before successive restarts, doubling each time up to a cap of 5 minutes. The pod shows CrashLoopBackOff while waiting. The back-off resets after the container has run successfully for 10 minutes. The useful logs are those of the previous crashed run: kubectl logs --previous.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:16s infinite linear}
    @keyframes c0{0%{opacity:0}0%{opacity:0}1%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .c0{animation-name:c0}
    @keyframes w0{0%{opacity:0}0.301639%{opacity:0}1.30164%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .w0{animation-name:w0}
    @keyframes c1{0%{opacity:0}1.5082%{opacity:0}2.5082%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .c1{animation-name:c1}
    @keyframes w1{0%{opacity:0}1.80984%{opacity:0}2.80984%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .w1{animation-name:w1}
    @keyframes c2{0%{opacity:0}4.52459%{opacity:0}5.52459%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .c2{animation-name:c2}
    @keyframes w2{0%{opacity:0}4.82623%{opacity:0}5.82623%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .w2{animation-name:w2}
    @keyframes c3{0%{opacity:0}10.5574%{opacity:0}11.5574%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .c3{animation-name:c3}
    @keyframes w3{0%{opacity:0}10.859%{opacity:0}11.859%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .w3{animation-name:w3}
    @keyframes c4{0%{opacity:0}22.623%{opacity:0}23.623%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .c4{animation-name:c4}
    @keyframes w4{0%{opacity:0}22.9246%{opacity:0}23.9246%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .w4{animation-name:w4}
    @keyframes c5{0%{opacity:0}46.7541%{opacity:0}47.7541%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .c5{animation-name:c5}
    @keyframes w5{0%{opacity:0}47.0557%{opacity:0}48.0557%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .w5{animation-name:w5}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Exit 1 on start, again and again</text>
  <text class="sub" x="28" y="62">Restart delay doubles from 10 s up to 5 min. Status shows CrashLoopBackOff while waiting.</text>
  <rect class="a c0 badf" x="60.0" y="130" width="6" height="40" rx="2"/>
  <rect class="bw a w0" x="68" y="138" width="1.47541" height="24" rx="4"/>
  <text class="sm a w0" x="65.7377" y="186" text-anchor="middle">10s</text>
  <rect class="a c1 badf" x="71.5" y="130" width="6" height="40" rx="2"/>
  <rect class="bw a w1" x="79.4754" y="138" width="12.9508" height="24" rx="4"/>
  <text class="sm a w1" x="82.9508" y="200" text-anchor="middle">20s</text>
  <rect class="a c2 badf" x="94.4" y="130" width="6" height="40" rx="2"/>
  <rect class="bw a w2" x="102.426" y="138" width="35.9016" height="24" rx="4"/>
  <text class="sm a w2" x="117.377" y="186" text-anchor="middle">40s</text>
  <rect class="a c3 badf" x="140.3" y="130" width="6" height="40" rx="2"/>
  <rect class="bw a w3" x="148.328" y="138" width="81.8033" height="24" rx="4"/>
  <text class="sm a w3" x="154.328" y="155" font-weight="700">wait 80 s</text>
  <rect class="a c4 badf" x="232.1" y="130" width="6" height="40" rx="2"/>
  <rect class="bw a w4" x="240.131" y="138" width="173.607" height="24" rx="4"/>
  <text class="sm a w4" x="246.131" y="155" font-weight="700">wait 160 s</text>
  <rect class="a c5 badf" x="415.7" y="130" width="6" height="40" rx="2"/>
  <rect class="bw a w5" x="423.738" y="138" width="334.262" height="24" rx="4"/>
  <text class="sm a w5" x="429.738" y="155" font-weight="700">wait 5 min (cap)</text>
  <text class="sm badt" x="60" y="120">✕ = crash (exit 1)</text>
  <text class="sm" x="60" y="212">0</text>
  <text class="sm" x="760" y="212" text-anchor="end">10 min</text>
  <text class="tx" x="28" y="256">Restart count climbs slowly, so a crash loop can look &quot;stable&quot; for minutes. Read the crash, not the wait:</text>
  <text class="tx prit" x="28" y="280">kubectl logs &lt;pod&gt; --previous   and   kubectl describe pod &lt;pod&gt;  (Last State, Exit Code, Reason)</text>
  <text class="sub" x="28" y="314">Exit 1 = app error · 127 = command not found · 137 = SIGKILL / OOMKilled · 143 = graceful SIGTERM</text>
  <text class="sub" x="28" y="334">The back-off resets once the container has run cleanly for 10 minutes.</text>
</svg>
