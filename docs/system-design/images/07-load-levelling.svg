<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Queue-based load levelling</title>
  <desc id="d">Two charts over 60 seconds with example numbers. Top: messages arrive at 60 per second, with a burst of 200 per second from second 10 to 20 and a smaller burst of 150 per second from second 35 to 40, while consumers process a steady maximum of 100 per second. Bottom: the queue backlog grows to 1,000 messages during the first burst, drains, grows again a little in the second burst and is empty again by about second 57. Nothing is rejected; the cost is waiting time.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:14px;font-weight:600}
    .tx{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .ax{stroke:#94a3b8;stroke-width:1.5}
    .grid{stroke:#e2e8f0}
    .arr{fill:none;stroke:#4f46e5;stroke-width:2.5}
    .cap{stroke:#0ea5a4;stroke-width:2.5;stroke-dasharray:7 5}
    .q{fill:#d97706;fill-opacity:.35;stroke:#d97706;stroke-width:2}
    .arrt{fill:#4f46e5;font-size:13px;font-weight:700}
    .capt{fill:#0f766e;font-size:13px;font-weight:700}
    .qt{fill:#b45309;font-size:13px;font-weight:700}
    .cover{fill:#f8fafc}
    .cur{stroke:#64748b;stroke-width:1.5}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}.cover{fill:#1f2430}
      .h{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .ax{stroke:#64748b}.grid{stroke:#334155}
      .arr{stroke:#818cf8}.arrt{fill:#818cf8}.cap{stroke:#2dd4bf}.capt{fill:#5eead4}
      .q{fill:#fbbf24;stroke:#fbbf24}.qt{fill:#fbbf24}.cur{stroke:#94a3b8}
    }
    /* 10 s loop: a cover slides right to reveal both charts (0-80%), hold, reset */
    .rv{animation:10s infinite linear;animation-name:rv}
    @keyframes rv{0%{transform:translateX(0)}80%,96%{transform:translateX(650px)}100%{transform:translateX(650px)}}
    .cu{animation:10s infinite linear;animation-name:cu}
    @keyframes cu{0%{transform:translateX(0);opacity:1}80%{transform:translateX(650px);opacity:1}82%,100%{transform:translateX(650px);opacity:0}}
    @media (prefers-reduced-motion: reduce){.rv{animation:none;transform:translateX(650px)}.cu{animation:none;opacity:0}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">A queue turns bursts into waiting, not errors</text>
  <text class="sub" x="28" y="62">Example numbers: consumers can process at most 100 messages/s.</text>

  <text class="tx" x="28" y="84">msg/s</text>
  <line class="grid" x1="90" y1="150.0" x2="740" y2="150.0"/>
  <line class="ax" x1="90" y1="86" x2="90" y2="200"/><line class="ax" x1="90" y1="200" x2="740" y2="200"/>
  <text class="sub" x="82" y="104.0" text-anchor="end">200</text>
  <text class="sub" x="82" y="154.0" text-anchor="end">100</text>
  <text class="sub" x="82" y="204" text-anchor="end">0</text>
  <line class="cap" x1="90" y1="150.0" x2="740" y2="150.0"/>
  <path class="arr" d="M90.0,170.0 L198.3,170.0 L198.3,100.0 L306.7,100.0 L306.7,170.0 L469.2,170.0 L469.2,125.0 L523.3,125.0 L523.3,170.0 L740.0,170.0"/>

  <text class="tx" x="28" y="246">backlog</text>
  <line class="ax" x1="90" y1="240" x2="90" y2="350"/><line class="ax" x1="90" y1="350" x2="740" y2="350"/>
  <text class="sub" x="82" y="263.1" text-anchor="end">1,000</text>
  <text class="sub" x="82" y="354" text-anchor="end">0</text>
  <line class="grid" x1="90" y1="259.1" x2="740" y2="259.1"/>
  <path class="q" d="M90.0,350.0 L90.0,350.0 L100.8,350.0 L111.7,350.0 L122.5,350.0 L133.3,350.0 L144.2,350.0 L155.0,350.0 L165.8,350.0 L176.7,350.0 L187.5,350.0 L198.3,350.0 L209.2,340.9 L220.0,331.8 L230.8,322.7 L241.7,313.6 L252.5,304.5 L263.3,295.5 L274.2,286.4 L285.0,277.3 L295.8,268.2 L306.7,259.1 L317.5,262.7 L328.3,266.4 L339.2,270.0 L350.0,273.6 L360.8,277.3 L371.7,280.9 L382.5,284.5 L393.3,288.2 L404.2,291.8 L415.0,295.5 L425.8,299.1 L436.7,302.7 L447.5,306.4 L458.3,310.0 L469.2,313.6 L480.0,309.1 L490.8,304.5 L501.7,300.0 L512.5,295.5 L523.3,290.9 L534.2,294.5 L545.0,298.2 L555.8,301.8 L566.7,305.5 L577.5,309.1 L588.3,312.7 L599.2,316.4 L610.0,320.0 L620.8,323.6 L631.7,327.3 L642.5,330.9 L653.3,334.5 L664.2,338.2 L675.0,341.8 L685.8,345.5 L696.7,349.1 L707.5,350.0 L718.3,350.0 L729.2,350.0 L740.0,350.0 L740.0,350.0 Z"/>
  <text class="sub" x="90" y="370" text-anchor="middle">0</text><text class="sub" x="306.7" y="370" text-anchor="middle">20</text>
  <text class="sub" x="523.3" y="370" text-anchor="middle">40</text><text class="sub" x="740" y="370" text-anchor="middle">60 s</text>

  <!-- reveal cover (hides the future) -->
  <rect class="cover rv" x="92" y="80" width="660" height="269"/>
  <line class="ax" x1="90" y1="200" x2="740" y2="200"/><line class="ax" x1="90" y1="350" x2="740" y2="350"/>
  <line class="cur cu" x1="90" y1="84" x2="90" y2="350"/>

  <!-- labels (always visible) -->
  <text class="arrt" x="202.3" y="94.0">arrivals: burst of 200/s</text>
  <text class="capt" x="545.0" y="142.0">processing: steady ≤ 100/s</text>
  <text class="qt" x="566.7" y="262">backlog peaks at 1,000</text><text class="qt" x="566.7" y="280">(about 10 s of waiting)</text>

  <text class="tx" x="28" y="398">Nothing is rejected and the downstream never sees more than 100/s. The price is latency: watch queue age.</text>
  <text class="sub" x="28" y="418">If the backlog keeps growing between bursts, add consumers (up to what the downstream can take) or shed work.</text>
</svg>
