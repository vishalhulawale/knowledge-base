<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">One spec, many artefacts</title>
  <desc id="d">Design-first: a single OpenAPI document is the source. From it the build generates the Spring server interface that the controller implements, typed clients for TypeScript and Java, a Prism mock server the frontend can use from day one, and the published reference docs. A change to the spec breaks the server build until the code matches, so the contract and the implementation can&#x27;t drift.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <defs><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="358" rx="14"/>
  <text class="h" x="28" y="40">openapi.yaml as the single source of truth</text>
  <text class="sub" x="28" y="62">Generated code is a build artefact: regenerate, don&#x27;t hand-edit.</text>
  <rect class="bp" x="300" y="150" width="200" height="60" rx="10" stroke-width="1.5"/>
  <text class="tx" x="400" y="177" text-anchor="middle" font-weight="700">openapi.yaml</text>
  <text class="sm" x="400" y="194" text-anchor="middle">reviewed + linted</text>
  <rect class="bt" x="28" y="92" width="200" height="52" rx="10" stroke-width="1.5"/>
  <text class="tx" x="128" y="115" text-anchor="middle" font-weight="700">Spring interface</text>
  <text class="sm" x="128" y="132" text-anchor="middle">controller implements it</text>
  <line class="lnt" x1="300" y1="180" x2="228" y2="118" marker-end="url(#art)"/>
  <rect class="bt" x="28" y="232" width="200" height="52" rx="10" stroke-width="1.5"/>
  <text class="tx" x="128" y="255" text-anchor="middle" font-weight="700">Prism mock server</text>
  <text class="sm" x="128" y="272" text-anchor="middle">frontend starts day one</text>
  <line class="lnt" x1="300" y1="180" x2="228" y2="258" marker-end="url(#art)"/>
  <rect class="bt" x="572" y="92" width="200" height="52" rx="10" stroke-width="1.5"/>
  <text class="tx" x="672" y="115" text-anchor="middle" font-weight="700">TypeScript client</text>
  <text class="sm" x="672" y="132" text-anchor="middle">compile-time checks</text>
  <line class="lnt" x1="500" y1="180" x2="572" y2="118" marker-end="url(#art)"/>
  <rect class="bt" x="572" y="232" width="200" height="52" rx="10" stroke-width="1.5"/>
  <text class="tx" x="672" y="255" text-anchor="middle" font-weight="700">Java client + docs</text>
  <text class="sm" x="672" y="272" text-anchor="middle">Redoc / Swagger UI</text>
  <line class="lnt" x1="500" y1="180" x2="572" y2="258" marker-end="url(#art)"/>
  <text class="tx" x="28" y="320">Change the spec → the server build breaks until the code matches: contract and implementation can&#x27;t drift.</text>
  <text class="sub" x="28" y="342">Code-first (springdoc) gets the same gates by exporting the spec in CI and linting/diffing it.</text>
</svg>
