<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Event between aggregates</title>
  <desc id="d">Animation: in transaction one the Ordering database commits the placed order and an OrderPlaced row in the outbox. An amber event token travels from the outbox through a relay or CDC process and a Kafka topic called order-events to the Inventory database, where transaction two changes available stock from 12 to 11 with 1 reserved. A timeline marks the stale window between the two commits, when the order is placed but stock is not yet reserved. If transaction two fails it retries idempotently or compensates; it never rolls back transaction one. Timing illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes a1{0%,3.99%{opacity:0}4%,96.99%{opacity:1}97%,100%{opacity:0}}.a1{animation-name:a1}
    @keyframes a3{0%,65.99%{opacity:0}66%,96.99%{opacity:1}97%,100%{opacity:0}}.a3{animation-name:a3}
    @keyframes st1{0%,65.99%{opacity:1}66%,100%{opacity:0}}.st1{animation-name:st1}
    @keyframes st2{0%,65.99%{opacity:0}66%,96.99%{opacity:1}97%,100%{opacity:0}}.st2{animation-name:st2}
    @keyframes gap{0%,13.99%{opacity:0}14%,65.99%{opacity:1}66%,100%{opacity:0}}.gap{animation-name:gap}
    .tok{animation:tok 14s infinite linear}
    @keyframes tok{0%,14%{transform:translateX(0);opacity:0}15%{opacity:1;transform:translateX(0)}30%{transform:translateX(150px)}48%{transform:translateX(300px)}64%{transform:translateX(410px);opacity:1}66%,100%{transform:translateX(410px);opacity:0}}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.a1,.a3,.st2,.gap{opacity:1}.tok{animation:none;opacity:0}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="370" rx="14"/>
  <text class="h" x="28" y="40">One aggregate per transaction, joined by an event</text><text class="sub" x="28" y="62">Order commits with its event; Inventory catches up in its own transaction. Timing illustrative.</text><rect class="bp" x="28" y="92" width="180" height="120" rx="10" stroke-width="1.5"/><text class="lbl" x="118" y="116" text-anchor="middle">Ordering DB</text><rect class="box" x="44" y="128" width="148" height="30" rx="8" stroke-width="1.5"/><text class="sm" x="118" y="148" text-anchor="middle">orders: placed</text><rect class="box" x="44" y="166" width="148" height="30" rx="8" stroke-width="1.5"/><text class="sm" x="118" y="186" text-anchor="middle">outbox: OrderPlaced</text><rect class="bm" x="248" y="122" width="120" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="308" y="157" text-anchor="middle">Relay / CDC</text><rect class="bm" x="408" y="122" width="140" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="478" y="148.5" text-anchor="middle">Kafka topic</text><text class="sm" x="478" y="165.5" text-anchor="middle">order-events</text><rect class="bt" x="592" y="92" width="180" height="120" rx="10" stroke-width="1.5"/><text class="lbl" x="682" y="116" text-anchor="middle">Inventory DB</text><line class="ln" x1="208" y1="152" x2="244" y2="152" marker-end="url(#ar)"/><line class="ln" x1="368" y1="152" x2="404" y2="152" marker-end="url(#ar)"/><line class="ln" x1="548" y1="152" x2="588" y2="152" marker-end="url(#ar)"/><g class="k st1"><rect class="box" x="608" y="140" width="148" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="682" y="169" text-anchor="middle">available: 12</text></g><g class="k st2"><rect class="box" x="608" y="140" width="148" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="682" y="160.5" text-anchor="middle">available: 11</text><text class="sm" x="682" y="177.5" text-anchor="middle">reserved: 1</text></g><g class="tok"><circle class="wrnf" cx="198" cy="152" r="9"/></g><g class="k a1"><text class="prit" x="118" y="236" text-anchor="middle" style="font-size:13px">tx 1 commits order + event</text></g><g class="k a3"><text class="teat" x="682" y="236" text-anchor="middle" style="font-size:13px">tx 2 reserves stock</text></g><line class="ln" x1="60" y1="290" x2="740" y2="290" marker-end="url(#ar)"/><text class="sub" x="60" y="314" text-anchor="middle">t0</text><text class="sub" x="740" y="314" text-anchor="end">time</text><g class="k gap"><rect class="bw" x="155.2" y="276" width="353.6" height="28" rx="4" stroke-width="1.5"/><text class="wrnt" x="332" y="295" text-anchor="middle" style="font-size:13px">stale window: order placed, stock not yet reserved</text></g><text class="sm" x="28" y="352">If tx 2 fails, it retries from the event (idempotently) or compensates; it never rolls back tx 1.</text>
</svg>
