<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Release risk matrix</title>
  <desc id="d">A five by five grid with likelihood from 1 to 5 on the horizontal axis and impact from 1 to 5 on the vertical axis, shaded green for scores up to 4, amber from 5 to 12 and red from 15. Five risks are plotted and listed with their response: 1, upstream refill API late, likelihood 4 and impact 4, score 16, red, mitigated with a spike and sandbox deadline; 2, PHI exposed in logs, likelihood 2 and impact 5, score 10, amber, mitigated with log masking; 3, peak-load regression, likelihood 3 and impact 4, score 12, amber, mitigated with load tests and a canary; 4, key engineer on leave, likelihood 3 and impact 3, score 9, amber, mitigated with pairing and a runbook; 5, minor UI inconsistency, likelihood 4 and impact 1, score 4, green, accepted. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">Risk matrix: likelihood × impact</text><text class="sub" x="28" y="62">Score 1–25. Green ≤ 4, amber 5–12, red ≥ 15. Example release risks, illustrative.</text><rect class="bo" x="100" y="292" width="72" height="52" rx="0" stroke-width="1"/><rect class="bo" x="100" y="240" width="72" height="52" rx="0" stroke-width="1"/><rect class="bo" x="100" y="188" width="72" height="52" rx="0" stroke-width="1"/><rect class="bo" x="100" y="136" width="72" height="52" rx="0" stroke-width="1"/><rect class="bw" x="100" y="84" width="72" height="52" rx="0" stroke-width="1"/><rect class="bo" x="172" y="292" width="72" height="52" rx="0" stroke-width="1"/><rect class="bo" x="172" y="240" width="72" height="52" rx="0" stroke-width="1"/><rect class="bw" x="172" y="188" width="72" height="52" rx="0" stroke-width="1"/><rect class="bw" x="172" y="136" width="72" height="52" rx="0" stroke-width="1"/><rect class="bw" x="172" y="84" width="72" height="52" rx="0" stroke-width="1"/><rect class="bo" x="244" y="292" width="72" height="52" rx="0" stroke-width="1"/><rect class="bw" x="244" y="240" width="72" height="52" rx="0" stroke-width="1"/><rect class="bw" x="244" y="188" width="72" height="52" rx="0" stroke-width="1"/><rect class="bw" x="244" y="136" width="72" height="52" rx="0" stroke-width="1"/><rect class="bb" x="244" y="84" width="72" height="52" rx="0" stroke-width="1"/><rect class="bo" x="316" y="292" width="72" height="52" rx="0" stroke-width="1"/><rect class="bw" x="316" y="240" width="72" height="52" rx="0" stroke-width="1"/><rect class="bw" x="316" y="188" width="72" height="52" rx="0" stroke-width="1"/><rect class="bb" x="316" y="136" width="72" height="52" rx="0" stroke-width="1"/><rect class="bb" x="316" y="84" width="72" height="52" rx="0" stroke-width="1"/><rect class="bw" x="388" y="292" width="72" height="52" rx="0" stroke-width="1"/><rect class="bw" x="388" y="240" width="72" height="52" rx="0" stroke-width="1"/><rect class="bb" x="388" y="188" width="72" height="52" rx="0" stroke-width="1"/><rect class="bb" x="388" y="136" width="72" height="52" rx="0" stroke-width="1"/><rect class="bb" x="388" y="84" width="72" height="52" rx="0" stroke-width="1"/><text class="sub" x="136" y="364" text-anchor="middle">1</text><text class="sub" x="88" y="323" text-anchor="end">1</text><text class="sub" x="208" y="364" text-anchor="middle">2</text><text class="sub" x="88" y="271" text-anchor="end">2</text><text class="sub" x="280" y="364" text-anchor="middle">3</text><text class="sub" x="88" y="219" text-anchor="end">3</text><text class="sub" x="352" y="364" text-anchor="middle">4</text><text class="sub" x="88" y="167" text-anchor="end">4</text><text class="sub" x="424" y="364" text-anchor="middle">5</text><text class="sub" x="88" y="115" text-anchor="end">5</text><text class="lbl" x="280" y="388" text-anchor="middle">Likelihood →</text><text class="lbl" x="44" y="214" text-anchor="middle" transform="rotate(-90 44 214)">Impact →</text><circle class="pri" cx="352" cy="162" r="13"/><text class="on13" x="352" y="167" text-anchor="middle">1</text><circle class="pri" cx="486" cy="96" r="11"/><text class="on13" x="486" y="101" text-anchor="middle">1</text><text class="lbl" x="506" y="101" style="font-size:14px">Upstream refill API late</text><text class="badt" x="735" y="101" text-anchor="end" style="font-size:14px">16</text><text class="sub" x="506" y="121">mitigate: spike, sandbox by day 10</text><circle class="pri" cx="208" cy="110" r="13"/><text class="on13" x="208" y="115" text-anchor="middle">2</text><circle class="pri" cx="486" cy="148" r="11"/><text class="on13" x="486" y="153" text-anchor="middle">2</text><text class="lbl" x="506" y="153" style="font-size:14px">PHI exposed in logs</text><text class="wrnt" x="735" y="153" text-anchor="end" style="font-size:14px">10</text><text class="sub" x="506" y="173">mitigate: log masking + review</text><circle class="pri" cx="280" cy="162" r="13"/><text class="on13" x="280" y="167" text-anchor="middle">3</text><circle class="pri" cx="486" cy="200" r="11"/><text class="on13" x="486" y="205" text-anchor="middle">3</text><text class="lbl" x="506" y="205" style="font-size:14px">Peak-load regression</text><text class="wrnt" x="735" y="205" text-anchor="end" style="font-size:14px">12</text><text class="sub" x="506" y="225">mitigate: load test, canary</text><circle class="pri" cx="280" cy="214" r="13"/><text class="on13" x="280" y="219" text-anchor="middle">4</text><circle class="pri" cx="486" cy="252" r="11"/><text class="on13" x="486" y="257" text-anchor="middle">4</text><text class="lbl" x="506" y="257" style="font-size:14px">Key engineer on leave</text><text class="wrnt" x="735" y="257" text-anchor="end" style="font-size:14px">9</text><text class="sub" x="506" y="277">mitigate: pairing, runbook</text><circle class="pri" cx="352" cy="318" r="13"/><text class="on13" x="352" y="323" text-anchor="middle">5</text><circle class="pri" cx="486" cy="304" r="11"/><text class="on13" x="486" y="309" text-anchor="middle">5</text><text class="lbl" x="506" y="309" style="font-size:14px">Minor UI inconsistency</text><text class="okt" x="735" y="309" text-anchor="end" style="font-size:14px">4</text><text class="sub" x="506" y="329">accept: documented, next release</text><text class="sm" x="28" y="410">Rank by score, but give severe low-likelihood risks (2: PHI) a mitigation anyway.</text>
</svg>
