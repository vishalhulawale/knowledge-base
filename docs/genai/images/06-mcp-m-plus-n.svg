<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">MCP turns M times N integrations into M plus N</title>
  <desc id="d">Two panels. On the left, three AI applications (an IDE assistant, a support chatbot and an ops agent) each connect directly to four systems (a claims API, a formulary database, Jira and GitHub), giving twelve bespoke integrations to build and secure. On the right, each application is an MCP host with an MCP client, each system is wrapped once as an MCP server, and they all speak the same JSON-RPC based protocol, so only seven pieces are needed; servers expose tools, resources and prompts. Simplified: a host runs one MCP client per server connection, and the transports are stdio for local servers or Streamable HTTP for remote ones.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:12px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40" text-anchor="start">Why MCP exists: M × N integrations become M + N</text>
  <text class="sub" x="28" y="62" text-anchor="start">Each host speaks one protocol; each system is wrapped once as an MCP server.</text>
  <rect class="box" x="20" y="80" width="370" height="280" rx="8" stroke-width="1.5"/>
  <text class="badt" x="205" y="104" text-anchor="middle">Before: bespoke glue per pair</text>
  <rect class="bp" x="36" y="122" width="120" height="36" rx="8" stroke-width="1.5"/>
  <text class="sm" x="96" y="145" text-anchor="middle">IDE assistant</text>
  <rect class="bp" x="36" y="197" width="120" height="36" rx="8" stroke-width="1.5"/>
  <text class="sm" x="96" y="220" text-anchor="middle">Support chatbot</text>
  <rect class="bp" x="36" y="272" width="120" height="36" rx="8" stroke-width="1.5"/>
  <text class="sm" x="96" y="295" text-anchor="middle">Ops agent</text>
  <rect class="bt" x="256" y="112" width="120" height="32" rx="8" stroke-width="1.5"/>
  <text class="sm" x="316" y="133" text-anchor="middle">Claims API</text>
  <rect class="bt" x="256" y="170" width="120" height="32" rx="8" stroke-width="1.5"/>
  <text class="sm" x="316" y="191" text-anchor="middle">Formulary DB</text>
  <rect class="bt" x="256" y="228" width="120" height="32" rx="8" stroke-width="1.5"/>
  <text class="sm" x="316" y="249" text-anchor="middle">Jira</text>
  <rect class="bt" x="256" y="286" width="120" height="32" rx="8" stroke-width="1.5"/>
  <text class="sm" x="316" y="307" text-anchor="middle">GitHub</text>
  <line class="lnb" stroke-opacity="0.75" x1="156" y1="140" x2="256" y2="128"/>
  <line class="lnb" stroke-opacity="0.75" x1="156" y1="140" x2="256" y2="186"/>
  <line class="lnb" stroke-opacity="0.75" x1="156" y1="140" x2="256" y2="244"/>
  <line class="lnb" stroke-opacity="0.75" x1="156" y1="140" x2="256" y2="302"/>
  <line class="lnb" stroke-opacity="0.75" x1="156" y1="215" x2="256" y2="128"/>
  <line class="lnb" stroke-opacity="0.75" x1="156" y1="215" x2="256" y2="186"/>
  <line class="lnb" stroke-opacity="0.75" x1="156" y1="215" x2="256" y2="244"/>
  <line class="lnb" stroke-opacity="0.75" x1="156" y1="215" x2="256" y2="302"/>
  <line class="lnb" stroke-opacity="0.75" x1="156" y1="290" x2="256" y2="128"/>
  <line class="lnb" stroke-opacity="0.75" x1="156" y1="290" x2="256" y2="186"/>
  <line class="lnb" stroke-opacity="0.75" x1="156" y1="290" x2="256" y2="244"/>
  <line class="lnb" stroke-opacity="0.75" x1="156" y1="290" x2="256" y2="302"/>
  <text class="badt" x="205" y="342" text-anchor="middle" style="font-size:13px">3 × 4 = 12 integrations</text>
  <rect class="box" x="410" y="80" width="370" height="280" rx="8" stroke-width="1.5"/>
  <text class="okt" x="595" y="104" text-anchor="middle">With MCP: one client, one server each</text>
  <rect class="bp" x="426" y="122" width="110" height="36" rx="8" stroke-width="1.5"/>
  <text class="sm" x="481" y="138" text-anchor="middle">IDE assistant</text>
  <text class="sub" x="481" y="152" text-anchor="middle" style="font-size:11px">host + MCP client</text>
  <rect class="bp" x="426" y="197" width="110" height="36" rx="8" stroke-width="1.5"/>
  <text class="sm" x="481" y="213" text-anchor="middle">Support chatbot</text>
  <text class="sub" x="481" y="227" text-anchor="middle" style="font-size:11px">host + MCP client</text>
  <rect class="bp" x="426" y="272" width="110" height="36" rx="8" stroke-width="1.5"/>
  <text class="sm" x="481" y="288" text-anchor="middle">Ops agent</text>
  <text class="sub" x="481" y="302" text-anchor="middle" style="font-size:11px">host + MCP client</text>
  <rect class="bo" x="560" y="124" width="40" height="190" rx="8" stroke-width="1.5"/>
  <text class="okt" x="580" y="219" text-anchor="middle" transform="rotate(-90 580 219)">MCP (JSON-RPC)</text>
  <line class="lno" x1="536" y1="140" x2="556" y2="140" marker-end="url(#aro)"/>
  <line class="lno" x1="536" y1="215" x2="556" y2="215" marker-end="url(#aro)"/>
  <line class="lno" x1="536" y1="290" x2="556" y2="290" marker-end="url(#aro)"/>
  <rect class="bt" x="640" y="112" width="128" height="32" rx="8" stroke-width="1.5"/>
  <text class="sm" x="704" y="127" text-anchor="middle">Claims API</text>
  <text class="sub" x="704" y="140" text-anchor="middle" style="font-size:11px">MCP server</text>
  <line class="lno" x1="600" y1="128" x2="636" y2="128" marker-end="url(#aro)"/>
  <rect class="bt" x="640" y="170" width="128" height="32" rx="8" stroke-width="1.5"/>
  <text class="sm" x="704" y="185" text-anchor="middle">Formulary DB</text>
  <text class="sub" x="704" y="198" text-anchor="middle" style="font-size:11px">MCP server</text>
  <line class="lno" x1="600" y1="186" x2="636" y2="186" marker-end="url(#aro)"/>
  <rect class="bt" x="640" y="228" width="128" height="32" rx="8" stroke-width="1.5"/>
  <text class="sm" x="704" y="243" text-anchor="middle">Jira</text>
  <text class="sub" x="704" y="256" text-anchor="middle" style="font-size:11px">MCP server</text>
  <line class="lno" x1="600" y1="244" x2="636" y2="244" marker-end="url(#aro)"/>
  <rect class="bt" x="640" y="286" width="128" height="32" rx="8" stroke-width="1.5"/>
  <text class="sm" x="704" y="301" text-anchor="middle">GitHub</text>
  <text class="sub" x="704" y="314" text-anchor="middle" style="font-size:11px">MCP server</text>
  <line class="lno" x1="600" y1="302" x2="636" y2="302" marker-end="url(#aro)"/>
  <text class="okt" x="595" y="335" text-anchor="middle" style="font-size:13px">3 + 4 = 7 pieces</text>
  <text class="sm" x="595" y="352" text-anchor="middle">servers expose tools, resources, prompts</text>
  <text class="sub" x="28" y="386" text-anchor="start" style="font-size:12px">Simplified: a host runs one MCP client per server; transports are stdio (local) or Streamable HTTP (remote).</text>
</svg>
