<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Query versus Scan</title>
  <desc id="d">Animation. Left: the partition for MEMBER#42 holds seven items sorted by sort key: two addresses, four orders by date, and the profile. A Query with begins_with ORDER#, newest first and a limit of three highlights the three newest orders one after another: one request, three items read, three returned. Right: a Scan with a filter on member 42 reads all 24 items in the table, highlighted amber, then only three turn green as results while the rest are discarded: 24 items read and paid for, 3 returned. Item counts are illustrative.</desc>
