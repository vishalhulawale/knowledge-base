<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Check-then-act dedupe race vs a unique constraint</title>
  <desc id="d">Two attempts process the same event evt-9 at the same time, for example a zombie consumer and the new partition owner after a rebalance. Top: deduplication with a separate Redis check. Attempt 1 asks whether evt-9 exists: no. Attempt 2 asks: also no. Both debit 50, so the account is debited twice, and only then does attempt 1 record evt-9. Bottom: a processed_events row inserted in the same database transaction as the debit. Attempt 1 inserts evt-9. Attempt 2&#x27;s insert of the same key blocks on the unique index. Attempt 1 debits and commits. Attempt 2 then gets a duplicate-key error and skips the event, so the account is debited once.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:15s infinite linear}
    @keyframes t0{0%{opacity:0}5%{opacity:0}6%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .t0{animation-name:t0}
    @keyframes t1{0%{opacity:0}19%{opacity:0}20%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .t1{animation-name:t1}
    @keyframes t2{0%{opacity:0}33%{opacity:0}34%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .t2{animation-name:t2}
    @keyframes t3{0%{opacity:0}47%{opacity:0}48%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .t3{animation-name:t3}
    @keyframes t4{0%{opacity:0}61%{opacity:0}62%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .t4{animation-name:t4}
    @keyframes tr{0%{opacity:0}75%{opacity:0}76%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .tr{animation-name:tr}
    @keyframes b0{0%{opacity:0}5%{opacity:0}6%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .b0{animation-name:b0}
    @keyframes b1{0%{opacity:0}19%{opacity:0}20%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .b1{animation-name:b1}
    @keyframes b2{0%{opacity:0}33%{opacity:0}34%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .b2{animation-name:b2}
    @keyframes b3{0%{opacity:0}47%{opacity:0}48%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .b3{animation-name:b3}
    @keyframes br{0%{opacity:0}61%{opacity:0}62%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .br{animation-name:br}
    @keyframes blk{0%{opacity:0}19%{opacity:0}20%,48%{opacity:1}49%{opacity:0}100%{opacity:0}}
    .blk{animation-name:blk}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="438" rx="14"/>
  <text class="h" x="28" y="40">Two attempts, one event (evt-9)</text>
  <text class="sub" x="28" y="62">A zombie consumer and the new partition owner process the same record at once.</text>
  <text class="h2" x="28" y="100">Separate check, then act (Redis EXISTS, later SET)</text>
  <text class="tx" x="28" y="138">attempt 1</text>
  <text class="tx" x="28" y="180">attempt 2</text>
  <g class="a t0">
  <rect class="mutf" x="124" y="116" width="124" height="32" rx="6"/>
  <text class="on13" x="186" y="136.5" text-anchor="middle">EXISTS? no</text>
  </g>
  <g class="a t1">
  <rect class="mutf" x="254" y="158" width="124" height="32" rx="6"/>
  <text class="on13" x="316" y="178.5" text-anchor="middle">EXISTS? no</text>
  </g>
  <g class="a t2">
  <rect class="pri" x="384" y="116" width="124" height="32" rx="6"/>
  <text class="on13" x="446" y="136.5" text-anchor="middle">debit 50</text>
  </g>
  <g class="a t3">
  <rect class="badf" x="514" y="158" width="124" height="32" rx="6"/>
  <text class="on13" x="576" y="178.5" text-anchor="middle">debit 50</text>
  </g>
  <g class="a t4">
  <rect class="mutf" x="644" y="116" width="124" height="32" rx="6"/>
  <text class="on13" x="706" y="136.5" text-anchor="middle">SET evt-9</text>
  </g>
  <text class="tx badt a tr" x="124" y="222">Balance 200 → 100: debited twice</text>
  <text class="h2" x="28" y="260">Unique constraint in the same transaction</text>
  <text class="tx" x="28" y="298">attempt 1</text>
  <text class="tx" x="28" y="340">attempt 2</text>
  <g class="a b0">
  <rect class="tea" x="124" y="276" width="124" height="32" rx="6"/>
  <text class="on13" x="186" y="296.5" text-anchor="middle">INSERT evt-9 ✓</text>
  </g>
  <g class="a b1">
  <rect class="wrnf" x="254" y="318" width="124" height="32" rx="6"/>
  <text class="on13" x="316" y="338.5" text-anchor="middle">INSERT evt-9 …</text>
  </g>
  <g class="a b2">
  <rect class="pri" x="384" y="276" width="124" height="32" rx="6"/>
  <text class="on13" x="446" y="296.5" text-anchor="middle">debit, COMMIT</text>
  </g>
  <g class="a b3">
  <rect class="okf" x="514" y="318" width="124" height="32" rx="6"/>
  <text class="on13" x="576" y="338.5" text-anchor="middle">dup key → skip</text>
  </g>
  <text class="tx okt a br" x="124" y="382">Balance 200 → 150: debited once</text>
  <text class="sm wrnt a blk" x="254" y="368">blocked on the unique index until attempt 1 commits</text>
  <line class="ln dash" x1="28" y1="238" x2="772" y2="238"/>
  <text class="sub" x="28" y="420">A check and a write in different steps (or different stores) aren&#x27;t atomic. Let the database decide.</text>
</svg>
