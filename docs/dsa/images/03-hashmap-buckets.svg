  <text class="m" x="62" y="99" text-anchor="middle" font-size="13">0</text>
  <line class="ln smut" stroke-width="1.5" x1="85" y1="94" x2="93" y2="94"/><path class="ah mut" d="M99.0,94.0 L93.0,97.0 L93.0,91.0 Z"/>
  <rect class="tint" x="100" y="84" width="86" height="20" rx="5"/>
  <text class="t" x="143" y="99" text-anchor="middle" font-size="13">Aa</text>
  <line class="ln smut" stroke-width="1.5" x1="187" y1="94" x2="195" y2="94"/><path class="ah mut" d="M201.0,94.0 L195.0,97.0 L195.0,91.0 Z"/>
  <rect class="tint" x="202" y="84" width="86" height="20" rx="5"/>
  <text class="t" x="245" y="99" text-anchor="middle" font-size="13">BB</text>
  <rect class="box" x="40" y="107" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="122" text-anchor="middle" font-size="13">1</text>
  <rect class="box" x="40" y="130" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="145" text-anchor="middle" font-size="13">2</text>
  <rect class="box" x="40" y="153" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="168" text-anchor="middle" font-size="13">3</text>
  <rect class="box" x="40" y="176" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="191" text-anchor="middle" font-size="13">4</text>
  <rect class="box" x="40" y="199" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="214" text-anchor="middle" font-size="13">5</text>
  <rect class="box" x="40" y="222" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="237" text-anchor="middle" font-size="13">6</text>
  <rect class="box" x="40" y="245" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="260" text-anchor="middle" font-size="13">7</text>
  <line class="ln smut" stroke-width="1.5" x1="85" y1="255" x2="93" y2="255"/><path class="ah mut" d="M99.0,255.0 L93.0,258.0 L93.0,252.0 Z"/>
  <rect class="box" x="100" y="245" width="86" height="20" rx="5"/>
  <text class="t" x="143" y="260" text-anchor="middle" font-size="13">profile</text>
  <rect class="pri" x="40" y="268" width="44" height="20" rx="4"/>
  <text class="on" x="62" y="283" text-anchor="middle" font-size="13">8</text>
  <line class="ln spri" stroke-width="1.5" x1="85" y1="278" x2="93" y2="278"/><path class="ah pri" d="M99.0,278.0 L93.0,281.0 L93.0,275.0 Z"/>
  <rect class="box" x="100" y="268" width="86" height="20" rx="5"/>
  <text class="t" x="143" y="283" text-anchor="middle" font-size="13">pharmacy</text>
  <line class="ln spri" stroke-width="1.5" x1="187" y1="278" x2="195" y2="278"/><path class="ah pri" d="M201.0,278.0 L195.0,281.0 L195.0,275.0 Z"/>
  <rect class="box" x="202" y="268" width="86" height="20" rx="5"/>
  <text class="t" x="245" y="283" text-anchor="middle" font-size="13">claims</text>
  <line class="ln spri" stroke-width="1.5" x1="289" y1="278" x2="297" y2="278"/><path class="ah pri" d="M303.0,278.0 L297.0,281.0 L297.0,275.0 Z"/>
  <rect class="tea" x="304" y="268" width="86" height="20" rx="5"/>
  <text class="on" x="347" y="283" text-anchor="middle" font-size="13">member</text>
  <rect class="box" x="40" y="291" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="306" text-anchor="middle" font-size="13">9</text>
  <rect class="box" x="40" y="314" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="329" text-anchor="middle" font-size="13">10</text>
  <line class="ln smut" stroke-width="1.5" x1="85" y1="324" x2="93" y2="324"/><path class="ah mut" d="M99.0,324.0 L93.0,327.0 L93.0,321.0 Z"/>
  <rect class="box" x="100" y="314" width="86" height="20" rx="5"/>
