<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Top-k largest with a min-heap of size k</title>
  <desc id="d">A stream 5, 1, 8, 3, 9, 2, 7 is scanned with k = 3. The first three values fill the heap, whose root 1 is the smallest of the current top 3. 3 is bigger than the root, so 1 is evicted and 3 enters. 9 evicts 3. 2 is not bigger than the root 5, so it is rejected after one comparison. 7 evicts 5. The heap ends with 7, 8 and 9, the three largest values.</desc>
  <style>.card{fill:#f8fafc;stroke:#e2e8f0}
.h{fill:#0f172a;font-size:19px;font-weight:700}
.t{fill:#334155;font-size:14px}
.tb{fill:#334155;font-size:14px;font-weight:700}
.lb{fill:#334155;font-size:15px;font-weight:600}
.m{fill:#64748b;font-size:13px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.box{fill:#ffffff;stroke:#cbd5e1}
.pri{fill:#4f46e5}.spri{stroke:#4f46e5}.tpri{fill:#4f46e5}
.tea{fill:#0ea5a4}.stea{stroke:#0ea5a4}.ttea{fill:#0f766e}
.ok{fill:#16a34a}.sok{stroke:#16a34a}.tok{fill:#16a34a}
.bad{fill:#dc2626}.sbad{stroke:#dc2626}.tbad{fill:#dc2626}
.warn{fill:#d97706}.swarn{stroke:#d97706}.twarn{fill:#d97706}
.smut{stroke:#94a3b8}.mut{fill:#94a3b8}
.tint{fill:#4f46e5;fill-opacity:.14}.ttint{fill:#0ea5a4;fill-opacity:.16}
.gtint{fill:#16a34a;fill-opacity:.16}.rtint{fill:#dc2626;fill-opacity:.14}.atint{fill:#d97706;fill-opacity:.16}
.on{fill:#ffffff;font-size:14px;font-weight:700}
.ln{fill:none;stroke-width:2}
.ah{stroke:none}
@media (prefers-color-scheme: dark){
.card{fill:#1f2430;stroke:#334155}
.h{fill:#f1f5f9}.t,.tb,.lb{fill:#e2e8f0}.m{fill:#94a3b8}
.box{fill:#111827;stroke:#475569}
.pri,.tint{fill:#818cf8}.spri{stroke:#818cf8}.tpri{fill:#818cf8}
.tea,.ttint{fill:#2dd4bf}.stea{stroke:#2dd4bf}.ttea{fill:#5eead4}
.ok,.gtint{fill:#4ade80}.sok{stroke:#4ade80}.tok{fill:#4ade80}
.bad,.rtint{fill:#f87171}.sbad{stroke:#f87171}.tbad{fill:#f87171}
.warn,.atint{fill:#fbbf24}.swarn{stroke:#fbbf24}.twarn{fill:#fbbf24}
.smut{stroke:#64748b}.mut{fill:#64748b}
.on{fill:#0f172a}
}
.fr{opacity:0;animation-duration:12.2s;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes k0{0%,11.70%{opacity:1}12.30%,100%{opacity:0}}.f0{animation-name:k0}
@keyframes k1{0%,12.30%{opacity:0}12.90%,23.99%{opacity:1}24.59%,100%{opacity:0}}.f1{animation-name:k1}
@keyframes k2{0%,24.59%{opacity:0}25.19%,36.29%{opacity:1}36.89%,100%{opacity:0}}.f2{animation-name:k2}
@keyframes k3{0%,36.89%{opacity:0}37.49%,48.58%{opacity:1}49.18%,100%{opacity:0}}.f3{animation-name:k3}
@keyframes k4{0%,49.18%{opacity:0}49.78%,60.88%{opacity:1}61.48%,100%{opacity:0}}.f4{animation-name:k4}
@keyframes k5{0%,61.48%{opacity:0}62.08%,73.17%{opacity:1}73.77%,100%{opacity:0}}.f5{animation-name:k5}
@keyframes k6{0%,73.77%{opacity:0}74.37%,99.40%{opacity:1}100%{opacity:0}}.f6{animation-name:k6}
@media (prefers-reduced-motion: reduce){.fr{animation:none!important;opacity:0}.f6{opacity:1}}</style>
  <rect class="card" x="1" y="1" width="798" height="354" rx="14"/>
  <text class="h" x="28" y="40">Top-k largest with a min-heap of size k (k = 3)</text>
  <text class="m" x="28" y="62">The root is the smallest of the current top k, so it is the one to evict when something bigger arrives.</text>
  <text class="m" x="40" y="90">stream</text>
  <text class="m" x="620" y="158" text-anchor="middle">min-heap</text>
  <g class="fr f0"><rect class="pri" x="40" y="100" width="58" height="42" rx="8"/><text class="on" x="69" y="127" text-anchor="middle">5</text><rect class="box" x="106" y="100" width="58" height="42" rx="8"/><text class="lb" x="135" y="127" text-anchor="middle">1</text><rect class="box" x="172" y="100" width="58" height="42" rx="8"/><text class="lb" x="201" y="127" text-anchor="middle">8</text><rect class="box" x="238" y="100" width="58" height="42" rx="8"/><text class="lb" x="267" y="127" text-anchor="middle">3</text><rect class="box" x="304" y="100" width="58" height="42" rx="8"/><text class="lb" x="333" y="127" text-anchor="middle">9</text><rect class="box" x="370" y="100" width="58" height="42" rx="8"/><text class="lb" x="399" y="127" text-anchor="middle">2</text><rect class="box" x="436" y="100" width="58" height="42" rx="8"/><text class="lb" x="465" y="127" text-anchor="middle">7</text><circle class="tea" cx="620" cy="196" r="22"/><text class="on" x="620" y="201" text-anchor="middle">5</text><text class="ttea" x="620" y="308" text-anchor="middle" font-size="13" font-weight="700">root = smallest kept</text><text class="t" x="40" y="192" font-weight="700" font-size="15">Heap has fewer than 3 items:</text><text class="t" x="40" y="214">offer(5).</text></g>
  <g class="fr f1"><rect class="card" x="40" y="100" width="58" height="42" rx="8"/><text class="m" x="69" y="127" text-anchor="middle">5</text><rect class="pri" x="106" y="100" width="58" height="42" rx="8"/><text class="on" x="135" y="127" text-anchor="middle">1</text><rect class="box" x="172" y="100" width="58" height="42" rx="8"/><text class="lb" x="201" y="127" text-anchor="middle">8</text><rect class="box" x="238" y="100" width="58" height="42" rx="8"/><text class="lb" x="267" y="127" text-anchor="middle">3</text><rect class="box" x="304" y="100" width="58" height="42" rx="8"/><text class="lb" x="333" y="127" text-anchor="middle">9</text><rect class="box" x="370" y="100" width="58" height="42" rx="8"/><text class="lb" x="399" y="127" text-anchor="middle">2</text><rect class="box" x="436" y="100" width="58" height="42" rx="8"/><text class="lb" x="465" y="127" text-anchor="middle">7</text><line class="ln smut" x1="620" y1="196" x2="560" y2="260"/><circle class="tea" cx="620" cy="196" r="22"/><text class="on" x="620" y="201" text-anchor="middle">1</text><circle class="box" cx="560" cy="260" r="22"/><text class="lb" x="560" y="265" text-anchor="middle">5</text><text class="ttea" x="620" y="308" text-anchor="middle" font-size="13" font-weight="700">root = smallest kept</text><text class="t" x="40" y="192" font-weight="700" font-size="15">Heap has fewer than 3 items:</text><text class="t" x="40" y="214">offer(1).</text></g>
  <g class="fr f2"><rect class="card" x="40" y="100" width="58" height="42" rx="8"/><text class="m" x="69" y="127" text-anchor="middle">5</text><rect class="card" x="106" y="100" width="58" height="42" rx="8"/><text class="m" x="135" y="127" text-anchor="middle">1</text><rect class="pri" x="172" y="100" width="58" height="42" rx="8"/><text class="on" x="201" y="127" text-anchor="middle">8</text><rect class="box" x="238" y="100" width="58" height="42" rx="8"/><text class="lb" x="267" y="127" text-anchor="middle">3</text><rect class="box" x="304" y="100" width="58" height="42" rx="8"/><text class="lb" x="333" y="127" text-anchor="middle">9</text><rect class="box" x="370" y="100" width="58" height="42" rx="8"/><text class="lb" x="399" y="127" text-anchor="middle">2</text><rect class="box" x="436" y="100" width="58" height="42" rx="8"/><text class="lb" x="465" y="127" text-anchor="middle">7</text><line class="ln smut" x1="620" y1="196" x2="560" y2="260"/><line class="ln smut" x1="620" y1="196" x2="680" y2="260"/><circle class="tea" cx="620" cy="196" r="22"/><text class="on" x="620" y="201" text-anchor="middle">1</text><circle class="box" cx="560" cy="260" r="22"/><text class="lb" x="560" y="265" text-anchor="middle">5</text><circle class="box" cx="680" cy="260" r="22"/><text class="lb" x="680" y="265" text-anchor="middle">8</text><text class="ttea" x="620" y="308" text-anchor="middle" font-size="13" font-weight="700">root = smallest kept</text><text class="t" x="40" y="192" font-weight="700" font-size="15">Heap has fewer than 3 items:</text><text class="t" x="40" y="214">offer(8).</text></g>
  <g class="fr f3"><rect class="card" x="40" y="100" width="58" height="42" rx="8"/><text class="m" x="69" y="127" text-anchor="middle">5</text><rect class="card" x="106" y="100" width="58" height="42" rx="8"/><text class="m" x="135" y="127" text-anchor="middle">1</text><rect class="card" x="172" y="100" width="58" height="42" rx="8"/><text class="m" x="201" y="127" text-anchor="middle">8</text><rect class="pri" x="238" y="100" width="58" height="42" rx="8"/><text class="on" x="267" y="127" text-anchor="middle">3</text><rect class="box" x="304" y="100" width="58" height="42" rx="8"/><text class="lb" x="333" y="127" text-anchor="middle">9</text><rect class="box" x="370" y="100" width="58" height="42" rx="8"/><text class="lb" x="399" y="127" text-anchor="middle">2</text><rect class="box" x="436" y="100" width="58" height="42" rx="8"/><text class="lb" x="465" y="127" text-anchor="middle">7</text><line class="ln smut" x1="620" y1="196" x2="560" y2="260"/><line class="ln smut" x1="620" y1="196" x2="680" y2="260"/><circle class="tea" cx="620" cy="196" r="22"/><text class="on" x="620" y="201" text-anchor="middle">3</text><circle class="box" cx="560" cy="260" r="22"/><text class="lb" x="560" y="265" text-anchor="middle">8</text><circle class="box" cx="680" cy="260" r="22"/><text class="lb" x="680" y="265" text-anchor="middle">5</text><text class="ttea" x="620" y="308" text-anchor="middle" font-size="13" font-weight="700">root = smallest kept</text><text class="tok" x="40" y="192" font-weight="700" font-size="15">3 &gt; root 1: poll 1,</text><text class="t" x="40" y="214">then offer(3).</text></g>
  <g class="fr f4"><rect class="card" x="40" y="100" width="58" height="42" rx="8"/><text class="m" x="69" y="127" text-anchor="middle">5</text><rect class="card" x="106" y="100" width="58" height="42" rx="8"/><text class="m" x="135" y="127" text-anchor="middle">1</text><rect class="card" x="172" y="100" width="58" height="42" rx="8"/><text class="m" x="201" y="127" text-anchor="middle">8</text><rect class="card" x="238" y="100" width="58" height="42" rx="8"/><text class="m" x="267" y="127" text-anchor="middle">3</text><rect class="pri" x="304" y="100" width="58" height="42" rx="8"/><text class="on" x="333" y="127" text-anchor="middle">9</text><rect class="box" x="370" y="100" width="58" height="42" rx="8"/><text class="lb" x="399" y="127" text-anchor="middle">2</text><rect class="box" x="436" y="100" width="58" height="42" rx="8"/><text class="lb" x="465" y="127" text-anchor="middle">7</text><line class="ln smut" x1="620" y1="196" x2="560" y2="260"/><line class="ln smut" x1="620" y1="196" x2="680" y2="260"/><circle class="tea" cx="620" cy="196" r="22"/><text class="on" x="620" y="201" text-anchor="middle">5</text><circle class="box" cx="560" cy="260" r="22"/><text class="lb" x="560" y="265" text-anchor="middle">8</text><circle class="box" cx="680" cy="260" r="22"/><text class="lb" x="680" y="265" text-anchor="middle">9</text><text class="ttea" x="620" y="308" text-anchor="middle" font-size="13" font-weight="700">root = smallest kept</text><text class="tok" x="40" y="192" font-weight="700" font-size="15">9 &gt; root 3: poll 3,</text><text class="t" x="40" y="214">then offer(9).</text></g>
  <g class="fr f5"><rect class="card" x="40" y="100" width="58" height="42" rx="8"/><text class="m" x="69" y="127" text-anchor="middle">5</text><rect class="card" x="106" y="100" width="58" height="42" rx="8"/><text class="m" x="135" y="127" text-anchor="middle">1</text><rect class="card" x="172" y="100" width="58" height="42" rx="8"/><text class="m" x="201" y="127" text-anchor="middle">8</text><rect class="card" x="238" y="100" width="58" height="42" rx="8"/><text class="m" x="267" y="127" text-anchor="middle">3</text><rect class="card" x="304" y="100" width="58" height="42" rx="8"/><text class="m" x="333" y="127" text-anchor="middle">9</text><rect class="pri" x="370" y="100" width="58" height="42" rx="8"/><text class="on" x="399" y="127" text-anchor="middle">2</text><rect class="box" x="436" y="100" width="58" height="42" rx="8"/><text class="lb" x="465" y="127" text-anchor="middle">7</text><line class="ln smut" x1="620" y1="196" x2="560" y2="260"/><line class="ln smut" x1="620" y1="196" x2="680" y2="260"/><circle class="tea" cx="620" cy="196" r="22"/><text class="on" x="620" y="201" text-anchor="middle">5</text><circle class="box" cx="560" cy="260" r="22"/><text class="lb" x="560" y="265" text-anchor="middle">8</text><circle class="box" cx="680" cy="260" r="22"/><text class="lb" x="680" y="265" text-anchor="middle">9</text><text class="ttea" x="620" y="308" text-anchor="middle" font-size="13" font-weight="700">root = smallest kept</text><text class="tbad" x="40" y="192" font-weight="700" font-size="15">2 ≤ root 5: rejected</text><text class="t" x="40" y="214">after one comparison.</text></g>
  <g class="fr f6"><rect class="card" x="40" y="100" width="58" height="42" rx="8"/><text class="m" x="69" y="127" text-anchor="middle">5</text><rect class="card" x="106" y="100" width="58" height="42" rx="8"/><text class="m" x="135" y="127" text-anchor="middle">1</text><rect class="card" x="172" y="100" width="58" height="42" rx="8"/><text class="m" x="201" y="127" text-anchor="middle">8</text><rect class="card" x="238" y="100" width="58" height="42" rx="8"/><text class="m" x="267" y="127" text-anchor="middle">3</text><rect class="card" x="304" y="100" width="58" height="42" rx="8"/><text class="m" x="333" y="127" text-anchor="middle">9</text><rect class="card" x="370" y="100" width="58" height="42" rx="8"/><text class="m" x="399" y="127" text-anchor="middle">2</text><rect class="pri" x="436" y="100" width="58" height="42" rx="8"/><text class="on" x="465" y="127" text-anchor="middle">7</text><line class="ln smut" x1="620" y1="196" x2="560" y2="260"/><line class="ln smut" x1="620" y1="196" x2="680" y2="260"/><circle class="tea" cx="620" cy="196" r="22"/><text class="on" x="620" y="201" text-anchor="middle">7</text><circle class="box" cx="560" cy="260" r="22"/><text class="lb" x="560" y="265" text-anchor="middle">9</text><circle class="box" cx="680" cy="260" r="22"/><text class="lb" x="680" y="265" text-anchor="middle">8</text><text class="ttea" x="620" y="308" text-anchor="middle" font-size="13" font-weight="700">root = smallest kept</text><text class="tok" x="40" y="192" font-weight="700" font-size="15">7 &gt; root 5: poll 5,</text><text class="t" x="40" y="214">then offer(7).</text><text class="tok" x="40" y="254" font-weight="700">Done: the heap holds [7, 8, 9], the 3 largest.</text></g>
  <text class="m" x="40" y="338">O(n log k) time and O(k) memory, and it works on a stream that never fits in memory.</text>
</svg>
