    @keyframes r3{0%{opacity:0}24%{opacity:0}25%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .r3{animation-name:r3}
    @keyframes r4{0%{opacity:0}27%{opacity:0}28%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .r4{animation-name:r4}
    @keyframes r5{0%{opacity:0}30%{opacity:0}31%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .r5{animation-name:r5}
    @keyframes rq{0%{opacity:0}14%{opacity:0}15%,69%{opacity:1}70%{opacity:0}100%{opacity:0}}
    .rq{animation-name:rq}
    @keyframes rq2{0%{opacity:0}69%{opacity:0}70%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .rq2{animation-name:rq2}
    @keyframes ro0{0%{opacity:0}18%{opacity:0}19%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .ro0{animation-name:ro0}
    @keyframes ro1{0%{opacity:0}21%{opacity:0}22%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .ro1{animation-name:ro1}
    @keyframes ro2{0%{opacity:0}24%{opacity:0}25%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .ro2{animation-name:ro2}
    @keyframes ro3{0%{opacity:0}27%{opacity:0}28%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .ro3{animation-name:ro3}
    @keyframes ro4{0%{opacity:0}30%{opacity:0}31%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .ro4{animation-name:ro4}
    @keyframes ro5{0%{opacity:0}69%{opacity:0}70%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .ro5{animation-name:ro5}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
