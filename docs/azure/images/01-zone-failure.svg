<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 444" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Zone failure compared</title>
  <desc id="d">Animation with two panels. On the left, an AWS VPC has three Availability Zones, each with its own subnet and two app instances. On the right, an Azure VNet has one regional subnet spanning three zones, with two VMs placed in each zone. First all six instances are healthy in both. Then zone 1 fails and both clouds lose the two instances in that zone, the same blast radius. The final caption explains that in AWS you choose the zone by choosing the subnet, while in Azure you choose it on the VM or scale set and zone-redundant services spread themselves. A footnote says logical zone numbers are per subscription, like AZ names per account. The layout is illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes ok{0%,34.99%{opacity:1}35%,100%{opacity:0}}.ok{animation-name:ok}
    @keyframes down{0%,34.99%{opacity:0}35%,100%{opacity:1}}.down{animation-name:down}
    @keyframes m0{0%,34.99%{opacity:1}35%,100%{opacity:0}}.m0{animation-name:m0}
    @keyframes m1{0%,34.99%{opacity:0}35%,67.99%{opacity:1}68%,100%{opacity:0}}.m1{animation-name:m1}
    @keyframes m2{0%,67.99%{opacity:0}68%,100%{opacity:1}}.m2{animation-name:m2}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.down,.m2{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="442" rx="14"/>
  <text class="h" x="28" y="40">Losing a zone: where you chose the zone</text><text class="sub" x="28" y="62">Three zones in one region, two app instances per zone. Illustrative.</text><text class="lbl" x="28" y="96">AWS: each subnet lives in one AZ</text><rect class="bm" x="28" y="108" width="360" height="230" rx="10" stroke-width="1.2"/><text class="sub" x="40" y="128">VPC (region)</text><rect class="box" x="40" y="138" width="108" height="190" rx="8" stroke-width="1" stroke-dasharray="5 4"/><g class="k down"><rect class="bb" x="40" y="138" width="108" height="190" rx="8" stroke-width="2"/></g><text class="sm" x="94" y="156" text-anchor="middle">AZ a</text><rect class="bt" x="48" y="166" width="92" height="152" rx="6" stroke-width="1.2"/><text class="teat" x="94" y="184" text-anchor="middle" style="font-size:12px">subnet-a</text><rect class="box" x="154" y="138" width="108" height="190" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="sm" x="208" y="156" text-anchor="middle">AZ b</text><rect class="bt" x="162" y="166" width="92" height="152" rx="6" stroke-width="1.2"/><text class="teat" x="208" y="184" text-anchor="middle" style="font-size:12px">subnet-b</text><rect class="box" x="268" y="138" width="108" height="190" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="sm" x="322" y="156" text-anchor="middle">AZ c</text><rect class="bt" x="276" y="166" width="92" height="152" rx="6" stroke-width="1.2"/><text class="teat" x="322" y="184" text-anchor="middle" style="font-size:12px">subnet-c</text><g class="k ok"><rect class="okf" x="62" y="214" width="64" height="38" rx="6"/><text class="on13" x="94" y="238" text-anchor="middle">app</text></g><g class="k down"><rect class="badf" x="62" y="214" width="64" height="38" rx="6"/><text class="on13" x="94" y="238" text-anchor="middle">lost</text></g><g class="k ok"><rect class="okf" x="62" y="266" width="64" height="38" rx="6"/><text class="on13" x="94" y="290" text-anchor="middle">app</text></g><g class="k down"><rect class="badf" x="62" y="266" width="64" height="38" rx="6"/><text class="on13" x="94" y="290" text-anchor="middle">lost</text></g><rect class="okf" x="176" y="214" width="64" height="38" rx="6"/><text class="on13" x="208" y="238" text-anchor="middle">app</text><rect class="okf" x="176" y="266" width="64" height="38" rx="6"/><text class="on13" x="208" y="290" text-anchor="middle">app</text><rect class="okf" x="290" y="214" width="64" height="38" rx="6"/><text class="on13" x="322" y="238" text-anchor="middle">app</text><rect class="okf" x="290" y="266" width="64" height="38" rx="6"/><text class="on13" x="322" y="290" text-anchor="middle">app</text><text class="lbl" x="412" y="96">Azure: a subnet spans all zones</text><rect class="bm" x="412" y="108" width="360" height="230" rx="10" stroke-width="1.2"/><text class="sub" x="424" y="128">VNet (region)</text><rect class="box" x="424" y="138" width="108" height="190" rx="8" stroke-width="1" stroke-dasharray="5 4"/><g class="k down"><rect class="bb" x="424" y="138" width="108" height="190" rx="8" stroke-width="2"/></g><text class="sm" x="478" y="156" text-anchor="middle">Zone 1</text><rect class="box" x="538" y="138" width="108" height="190" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="sm" x="592" y="156" text-anchor="middle">Zone 2</text><rect class="box" x="652" y="138" width="108" height="190" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="sm" x="706" y="156" text-anchor="middle">Zone 3</text><rect class="bt" x="428" y="170" width="328" height="30" rx="6" stroke-width="1.2"/><text class="teat" x="592" y="190" text-anchor="middle" style="font-size:12px">one subnet: 10.0.1.0/24 (regional)</text><g class="k ok"><rect class="okf" x="446" y="214" width="64" height="38" rx="6"/><text class="on13" x="478" y="238" text-anchor="middle">app</text></g><g class="k down"><rect class="badf" x="446" y="214" width="64" height="38" rx="6"/><text class="on13" x="478" y="238" text-anchor="middle">lost</text></g><g class="k ok"><rect class="okf" x="446" y="266" width="64" height="38" rx="6"/><text class="on13" x="478" y="290" text-anchor="middle">app</text></g><g class="k down"><rect class="badf" x="446" y="266" width="64" height="38" rx="6"/><text class="on13" x="478" y="290" text-anchor="middle">lost</text></g><rect class="okf" x="560" y="214" width="64" height="38" rx="6"/><text class="on13" x="592" y="238" text-anchor="middle">app</text><rect class="okf" x="560" y="266" width="64" height="38" rx="6"/><text class="on13" x="592" y="290" text-anchor="middle">app</text><rect class="okf" x="674" y="214" width="64" height="38" rx="6"/><text class="on13" x="706" y="238" text-anchor="middle">app</text><rect class="okf" x="674" y="266" width="64" height="38" rx="6"/><text class="on13" x="706" y="290" text-anchor="middle">app</text><g class="k m0"><text class="tx" x="28" y="368" style="font-size:14px">All six instances healthy in both clouds.</text><text class="sm" x="28" y="390"></text></g><g class="k m1"><text class="badt" x="28" y="368" style="font-size:14px">Zone 1 fails: both lose a third of capacity. The blast radius is the same.</text><text class="sm" x="28" y="390">The difference is where you picked the zone, not how much survives.</text></g><g class="k m2"><text class="okt" x="28" y="368" style="font-size:14px">AWS: you pick the AZ by picking the subnet. Azure: you pick it on the VM or</text><text class="sm" x="28" y="390">scale set (zones 1, 2, 3); zone-redundant services spread themselves.</text></g><text class="sub" x="28" y="424">Zone numbers are per subscription in Azure (like AZ names per account in AWS): map them before you compare.</text>
</svg>
