  <text class="tlb" x="328.0" y="213" text-anchor="middle">1</text>
  <text class="sub" x="328.0" y="244" text-anchor="middle" font-size="13">4</text>
  <rect class="box" x="350" y="190" width="36" height="36" rx="5"/>
  <text class="body" x="368.0" y="213" text-anchor="middle">0</text>
