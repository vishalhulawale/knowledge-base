<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 428" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Moving the data in stages</title>
  <desc id="d">Three stages of moving data out of a monolith. First, the monolith keeps the members data and the new service calls the monolith's API. Second, the schema is split inside the same database into a monolith schema and a member schema, with no cross-schema joins or foreign keys. Third, the service owns its own members database and the monolith reads through the service API. Below: avoid dual writes from application code; keep one writer and copy changes with change data capture or events.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ring{fill:#ffffff;stroke:#d97706;stroke-width:2.5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
      .ring{fill:#111827;stroke:#fbbf24}
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="426" rx="14"/>
  <text class="h" x="28" y="40">Moving the data, one step at a time</text>
  <text class="sub" x="28" y="62">Code moves easily; data ownership moves in stages. Each stage is shippable on its own.</text>
  <rect class="box" x="28" y="76" width="236" height="214" rx="10" stroke-width="1.5"/><text class="lbl" x="42" y="100">1. Monolith keeps data</text><text class="sub" x="42" y="268">Quick start, but the service</text><text class="sub" x="42" y="284">still depends on the monolith.</text>
  <rect class="bp" x="44" y="116" width="90" height="40" rx="10" stroke-width="1.5"/><text class="tx" x="89" y="141" text-anchor="middle">Monolith</text>
  <rect class="bt" x="160" y="116" width="90" height="40" rx="10" stroke-width="1.5"/><text class="tx" x="205" y="141" text-anchor="middle">Service</text>
  <line class="lnt" x1="160" y1="136" x2="138" y2="136" marker-end="url(#art)"/><text class="sub" x="149" y="175" text-anchor="middle">API call</text>
  <path class="box" stroke-width="1.5" d="M54,198 a35.0,8 0 0 1 70,0 v40 a35.0,8 0 0 1 -70,0 z"/><path class="box" style="fill:none" stroke-width="1.5" d="M54,198 a35.0,8 0 0 0 70,0"/><text class="sub" x="89" y="230" text-anchor="middle">members</text>
  <line class="ln" x1="89" y1="156" x2="89" y2="186" marker-end="url(#ar)"/>

  <rect class="box" x="282" y="76" width="236" height="214" rx="10" stroke-width="1.5"/><text class="lbl" x="296" y="100">2. Split the schema first</text><text class="sub" x="296" y="268">Same database, separate schemas.</text><text class="sub" x="296" y="284">Remove cross-schema joins/FKs.</text>
  <rect class="bp" x="298" y="116" width="90" height="40" rx="10" stroke-width="1.5"/><text class="tx" x="343" y="141" text-anchor="middle">Monolith</text>
  <rect class="bt" x="414" y="116" width="90" height="40" rx="10" stroke-width="1.5"/><text class="tx" x="459" y="141" text-anchor="middle">Service</text>
  <rect class="box" x="298" y="184" width="206" height="66" rx="8" stroke-width="1.5"/><text class="sub" x="401" y="200" text-anchor="middle">one database</text>
  <rect class="bp" x="306" y="208" width="86" height="34" rx="6" stroke-width="1.5"/><text class="sub" x="349" y="230" text-anchor="middle">monolith</text>
  <rect class="bt" x="410" y="208" width="86" height="34" rx="6" stroke-width="1.5"/><text class="sub" x="453" y="230" text-anchor="middle">member</text>
  <line class="lnb" x1="394" y1="216" x2="408" y2="234"/><line class="lnb" x1="408" y1="216" x2="394" y2="234"/>
  <line class="ln" x1="343" y1="156" x2="343" y2="204" marker-end="url(#ar)"/>
  <line class="ln" x1="459" y1="156" x2="459" y2="204" marker-end="url(#ar)"/>

  <rect class="box" x="536" y="76" width="236" height="214" rx="10" stroke-width="1.5"/><text class="lbl" x="550" y="100">3. Service owns its data</text><text class="sub" x="550" y="268">Monolith reads through the</text><text class="sub" x="550" y="284">service API (or a read model).</text>
  <rect class="bp" x="552" y="116" width="90" height="40" rx="10" stroke-width="1.5"/><text class="tx" x="597" y="141" text-anchor="middle">Monolith</text>
  <rect class="bt" x="668" y="116" width="90" height="40" rx="10" stroke-width="1.5"/><text class="tx" x="713" y="141" text-anchor="middle">Service</text>
  <line class="lnp" x1="642" y1="136" x2="664" y2="136" marker-end="url(#arp)"/><text class="sub" x="653" y="175" text-anchor="middle">API call</text>
  <path class="bt" stroke-width="1.5" d="M678,198 a35.0,8 0 0 1 70,0 v40 a35.0,8 0 0 1 -70,0 z"/><path class="bt" style="fill:none" stroke-width="1.5" d="M678,198 a35.0,8 0 0 0 70,0"/><text class="sub" x="713" y="230" text-anchor="middle">members</text>
  <line class="ln" x1="713" y1="156" x2="713" y2="186" marker-end="url(#ar)"/>

  <text class="h2" x="28" y="330">While data moves, keep one writer per item</text>
  <rect class="bb" x="28" y="344" width="360" height="64" rx="10" stroke-width="1.5"/><text class="tx badt" x="44" y="368">❌ Dual write from application code</text>
  <text class="sub" x="44" y="390">Two writes, no transaction: they drift on any failure.</text>
  <rect class="bo" x="410" y="344" width="362" height="64" rx="10" stroke-width="1.5"/><text class="tx okt" x="426" y="368">✅ One writer + CDC (Debezium) or events</text>
  <text class="sub" x="426" y="390">The copy follows the writer; switch writers explicitly.</text>
</svg>
