<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">The shape of each core Redis data type</title>
  <desc id="d">Six panels. String: one key holds one value, such as a JSON blob. Hash: one key holds a small field to value map (name, plan, loginCount). List: items in insertion order, pushed on the left with LPUSH and popped on the right with RPOP. Set: unique, unordered members such as tags. Sorted set: unique members kept ordered by score, so a leaderboard can return ranks. Stream: an append-only log of entries with IDs; XADD appends at the end and a consumer group tracks which entries it has delivered.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .ph{fill:#ffffff;stroke:#e2e8f0}
    .pt{fill:#0f172a;font-size:16px;font-weight:700}
    .key{fill:#0f766e;font-size:13px;font-weight:700}
    .body{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}
    .tl{fill:#fff;font-size:13px;font-weight:700}
    .arr{stroke:#64748b;stroke-width:1.6;fill:none}
    .ah{fill:#64748b}
    .tealf{fill:#0ea5a4}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.pt{fill:#f1f5f9}.body{fill:#e2e8f0}.sub{fill:#94a3b8}.key{fill:#5eead4}
      .ph{fill:#171b24;stroke:#334155}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tealf{fill:#2dd4bf}.tl{fill:#0f172a}
      .arr{stroke:#94a3b8}.ah{fill:#94a3b8}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="478" rx="14"/>
  <text class="h" x="28" y="40">What each core type looks like inside one key</text>

  <!-- panel 1: string -->
  <rect class="ph" x="20" y="60" width="244" height="196" rx="10"/>
  <text class="pt" x="36" y="88">String</text>
  <text class="key" x="36" y="116">user:42:json</text>
  <rect class="box" x="36" y="128" width="212" height="40" rx="6"/>
  <text class="body" x="46" y="153">{"name":"Ana","plan":"pro"}</text>
  <text class="body" x="36" y="198">One value, up to 512 MB.</text>
  <text class="sub" x="36" y="220">GET / SET / INCR: O(1)</text>
  <text class="sub" x="36" y="240">Read and written whole.</text>

  <!-- panel 2: hash -->
  <rect class="ph" x="278" y="60" width="244" height="196" rx="10"/>
  <text class="pt" x="294" y="88">Hash</text>
  <text class="key" x="294" y="116">user:42</text>
  <rect class="box" x="294" y="126" width="212" height="28" rx="0"/><rect class="box" x="294" y="154" width="212" height="28"/><rect class="box" x="294" y="182" width="212" height="28"/>
  <line class="arr" x1="394" y1="126" x2="394" y2="210"/>
  <text class="body" x="302" y="145">name</text><text class="body" x="404" y="145">Ana</text>
  <text class="body" x="302" y="173">plan</text><text class="body" x="404" y="173">pro</text>
  <text class="body" x="302" y="201">loginCount</text><text class="body" x="404" y="201">17</text>
  <text class="sub" x="294" y="232">HGET / HINCRBY one field: O(1)</text>

  <!-- panel 3: list -->
  <rect class="ph" x="536" y="60" width="244" height="196" rx="10"/>
  <text class="pt" x="552" y="88">List</text>
  <text class="key" x="552" y="116">feed:42</text>
  <rect class="pri" x="582" y="134" width="40" height="34" rx="6"/><text class="tl" x="602" y="156" text-anchor="middle">e4</text>
  <rect class="box" x="628" y="134" width="40" height="34" rx="6"/><text class="body" x="648" y="156" text-anchor="middle">e3</text>
  <rect class="box" x="674" y="134" width="40" height="34" rx="6"/><text class="body" x="694" y="156" text-anchor="middle">e2</text>
  <rect class="box" x="720" y="134" width="40" height="34" rx="6"/><text class="body" x="740" y="156" text-anchor="middle">e1</text>
  <text class="sub" x="552" y="190">LPUSH</text><path class="arr" d="M566 176 L566 160 L578 160"/><path class="ah" d="M582 160 l-7 -4 v8z"/>
  <text class="sub" x="726" y="190">RPOP</text>
  <text class="body" x="552" y="216">Insertion order, ends O(1).</text>
  <text class="sub" x="552" y="238">LPUSH + LTRIM keeps recent N.</text>

  <!-- panel 4: set -->
  <rect class="ph" x="20" y="270" width="244" height="196" rx="10"/>
  <text class="pt" x="36" y="298">Set</text>
  <text class="key" x="36" y="326">tags:post:9</text>
  <rect class="box" x="40" y="340" width="70" height="30" rx="15"/><text class="body" x="75" y="360" text-anchor="middle">redis</text>
  <rect class="box" x="122" y="352" width="62" height="30" rx="15"/><text class="body" x="153" y="372" text-anchor="middle">java</text>
  <rect class="box" x="70" y="384" width="74" height="30" rx="15"/><text class="body" x="107" y="404" text-anchor="middle">cache</text>
  <rect class="box" x="168" y="394" width="70" height="30" rx="15"/><text class="body" x="203" y="414" text-anchor="middle">spring</text>
  <text class="body" x="36" y="440">Unique, no order.</text>
  <text class="sub" x="36" y="458">SADD / SISMEMBER: O(1)</text>

  <!-- panel 5: sorted set -->
  <rect class="ph" x="278" y="270" width="244" height="196" rx="10"/>
  <text class="pt" x="294" y="298">Sorted set</text>
  <text class="key" x="294" y="326">lb:weekly</text>
  <text class="sub" x="296" y="350">rank</text><text class="sub" x="340" y="350">member</text><text class="sub" x="460" y="350">score</text>
  <rect class="pri" x="294" y="358" width="212" height="26" rx="5"/>
  <text class="tl" x="306" y="376">0</text><text class="tl" x="340" y="376">player:7</text><text class="tl" x="460" y="376">1530</text>
  <rect class="box" x="294" y="388" width="212" height="26" rx="5"/>
  <text class="body" x="306" y="406">1</text><text class="body" x="340" y="406">player:3</text><text class="body" x="460" y="406">1210</text>
  <text class="sub" x="294" y="438">Kept ordered by score.</text>
  <text class="sub" x="294" y="458">ZADD / ZREVRANK: O(log N)</text>

  <!-- panel 6: stream -->
  <rect class="ph" x="536" y="270" width="244" height="196" rx="10"/>
  <text class="pt" x="552" y="298">Stream</text>
  <text class="key" x="552" y="326">orders</text>
  <rect class="box" x="552" y="340" width="48" height="34" rx="6"/><text class="body" x="576" y="362" text-anchor="middle">1-0</text>
  <rect class="box" x="604" y="340" width="48" height="34" rx="6"/><text class="body" x="628" y="362" text-anchor="middle">2-0</text>
  <rect class="box" x="656" y="340" width="48" height="34" rx="6"/><text class="body" x="680" y="362" text-anchor="middle">3-0</text>
  <rect class="pri" x="708" y="340" width="48" height="34" rx="6"/><text class="tl" x="732" y="362" text-anchor="middle">4-0</text>
  <text class="sub" x="712" y="332">XADD</text>
  <path class="arr" d="M680 396 L680 380"/><path class="ah" d="M680 376 l-4 7 h8z"/>
  <text class="body" x="552" y="412">group billing: last delivered</text>
  <text class="sub" x="552" y="438">Append-only, entries kept.</text>
  <text class="sub" x="552" y="458">XREADGROUP, then XACK.</text>
</svg>
