<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Who holds the key: native KMS, BYOK, HYOK</title>
  <desc id="d">Three models, each drawn as the customer side on the left and the cloud provider on the right. Native KMS: the key is generated and lives only in the provider&#x27;s HSMs. BYOK: the customer&#x27;s HSM holds the master copy and a wrapped copy is imported into the provider&#x27;s HSMs, where the provider&#x27;s services use it. HYOK or an external key store: the key never enters the cloud; every operation is sent to the customer&#x27;s key manager, so unplugging it stops all decryption at once, but its outage becomes a cloud data outage.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">Where the key material lives</text>
  <text class="sub" x="28" y="62">Left = your side, right = the cloud provider. Further down = more control, more operational risk.</text>
  <text class="sm" x="150" y="96" text-anchor="middle">your side</text>
  <text class="sm" x="560" y="96" text-anchor="middle">cloud provider</text>
  <line class="ln dash" x1="330" y1="90" x2="330" y2="330"/>
  <text class="lbl" x="28" y="134">Native KMS</text>
  <rect class="pri" x="400" y="116" width="230" height="30" rx="6"/>
  <text class="on13" x="515" y="135.5" text-anchor="middle">key (generated here)</text>
  <text class="sm" x="400" y="164">lowest risk; provider HSMs only</text>
  <text class="lbl" x="28" y="206">BYOK</text>
  <rect class="pri" x="150" y="188" width="172" height="30" rx="6"/>
  <text class="on13" x="236" y="207.5" text-anchor="middle">master in your HSM</text>
  <rect class="pri" x="400" y="188" width="230" height="30" rx="6"/>
  <text class="on13" x="515" y="207.5" text-anchor="middle">imported copy</text>
  <text class="sm" x="400" y="236">revoke: delete imported material</text>
  <line class="lnp" x1="324" y1="203" x2="396" y2="203" marker-end="url(#arp)"/>
  <text class="sm prit" x="360" y="230" text-anchor="middle">wrapped</text>
  <text class="lbl" x="28" y="278">HYOK / XKS</text>
  <rect class="pri" x="150" y="260" width="172" height="30" rx="6"/>
  <text class="on13" x="236" y="279.5" text-anchor="middle">only copy, your HSM</text>
  <rect class="mutf" x="400" y="260" width="230" height="30" rx="6"/>
  <text class="on13" x="515" y="279.5" text-anchor="middle">pointer; every call goes out</text>
  <text class="sm" x="400" y="308">unplug = instant revoke; your outage = their outage</text>
  <line class="ln" x1="396" y1="282" x2="324" y2="282" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text class="tx" x="28" y="352">More control means more to run: an XKS proxy or EKM must be as available as the cloud services that call it.</text>
  <text class="sub" x="28" y="380">BYOK is usually enough for compliance; HYOK fits when policy says the provider may never hold the key.</text>
</svg>
