<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Monotonic stack for daily temperatures</title>
  <desc id="d">Bars show temperatures 73, 74, 75, 71, 69, 72, 76, 73 for days 0 to 7. The scan keeps a stack of day indices whose temperatures decrease from bottom to top. When a warmer day arrives, cooler days are popped and their answer is the distance to the warmer day. Day 5 (72) pops days 4 and 3; day 6 (76) pops days 5 and 2. Final answers: 1, 1, 4, 2, 1, 1, 0, 0.</desc>
  <style>.card{fill:#f8fafc;stroke:#e2e8f0}
.h{fill:#0f172a;font-size:19px;font-weight:700}
.t{fill:#334155;font-size:14px}
.tb{fill:#334155;font-size:14px;font-weight:700}
.lb{fill:#334155;font-size:15px;font-weight:600}
.m{fill:#64748b;font-size:13px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.box{fill:#ffffff;stroke:#cbd5e1}
.pri{fill:#4f46e5}.spri{stroke:#4f46e5}.tpri{fill:#4f46e5}
.tea{fill:#0ea5a4}.stea{stroke:#0ea5a4}.ttea{fill:#0f766e}
.ok{fill:#16a34a}.sok{stroke:#16a34a}.tok{fill:#16a34a}
.bad{fill:#dc2626}.sbad{stroke:#dc2626}.tbad{fill:#dc2626}
.warn{fill:#d97706}.swarn{stroke:#d97706}.twarn{fill:#d97706}
.smut{stroke:#94a3b8}.mut{fill:#94a3b8}
.tint{fill:#4f46e5;fill-opacity:.14}.ttint{fill:#0ea5a4;fill-opacity:.16}
.gtint{fill:#16a34a;fill-opacity:.16}.rtint{fill:#dc2626;fill-opacity:.14}.atint{fill:#d97706;fill-opacity:.16}
.on{fill:#ffffff;font-size:14px;font-weight:700}
.ln{fill:none;stroke-width:2}
.ah{stroke:none}
@media (prefers-color-scheme: dark){
.card{fill:#1f2430;stroke:#334155}
.h{fill:#f1f5f9}.t,.tb,.lb{fill:#e2e8f0}.m{fill:#94a3b8}
.box{fill:#111827;stroke:#475569}
.pri,.tint{fill:#818cf8}.spri{stroke:#818cf8}.tpri{fill:#818cf8}
.tea,.ttint{fill:#2dd4bf}.stea{stroke:#2dd4bf}.ttea{fill:#5eead4}
.ok,.gtint{fill:#4ade80}.sok{stroke:#4ade80}.tok{fill:#4ade80}
.bad,.rtint{fill:#f87171}.sbad{stroke:#f87171}.tbad{fill:#f87171}
.warn,.atint{fill:#fbbf24}.swarn{stroke:#fbbf24}.twarn{fill:#fbbf24}
.smut{stroke:#64748b}.mut{fill:#64748b}
.on{fill:#0f172a}
}
.fr{opacity:0;animation-duration:11.75s;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes k0{0%,10.04%{opacity:1}10.64%,100%{opacity:0}}.f0{animation-name:k0}
@keyframes k1{0%,10.64%{opacity:0}11.24%,20.68%{opacity:1}21.28%,100%{opacity:0}}.f1{animation-name:k1}
@keyframes k2{0%,21.28%{opacity:0}21.88%,31.31%{opacity:1}31.91%,100%{opacity:0}}.f2{animation-name:k2}
@keyframes k3{0%,31.91%{opacity:0}32.51%,41.95%{opacity:1}42.55%,100%{opacity:0}}.f3{animation-name:k3}
@keyframes k4{0%,42.55%{opacity:0}43.15%,52.59%{opacity:1}53.19%,100%{opacity:0}}.f4{animation-name:k4}
@keyframes k5{0%,53.19%{opacity:0}53.79%,63.23%{opacity:1}63.83%,100%{opacity:0}}.f5{animation-name:k5}
@keyframes k6{0%,63.83%{opacity:0}64.43%,73.87%{opacity:1}74.47%,100%{opacity:0}}.f6{animation-name:k6}
@keyframes k7{0%,74.47%{opacity:0}75.07%,99.40%{opacity:1}100%{opacity:0}}.f7{animation-name:k7}
