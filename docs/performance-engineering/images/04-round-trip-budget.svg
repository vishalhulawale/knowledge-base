<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Round trips versus batching</title>
  <desc id="d">Animation: a cursor sweeps along a 70 millisecond timeline for two ways of loading an order with 50 lines. The N+1 version sends 51 queries one after another, each a 1 millisecond network round trip plus 0.2 milliseconds of execution, then spends 5 milliseconds mapping rows, finishing at 66 milliseconds. The batched version sends one query for the order and one IN query for the lines and finishes at 8 milliseconds. Numbers are illustrative.</desc>
