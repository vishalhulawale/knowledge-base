  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="448" rx="14"/>
  <text class="h" x="28" y="40">Azure compute, from most control to least ops</text><text class="sub" x="28" y="62">Pick the rightmost option that still meets your runtime, networking and scaling needs.</text><line class="lnp" x1="40" y1="84" x2="760" y2="84" marker-end="url(#arp)"/><text class="prit" x="40" y="102" style="font-size:13px">more control</text><text class="prit" x="760" y="102" text-anchor="end" style="font-size:13px">less to operate</text><rect class="bp" x="28" y="116" width="138" height="64" rx="8" stroke-width="1.5"/><text class="lbl" x="97" y="142" text-anchor="middle">Virtual Machines</text><text class="sub" x="97" y="162" text-anchor="middle" style="font-size:12px">+ Scale Sets</text><rect class="bw" x="28" y="190" width="138" height="56" rx="8" stroke-width="1.5"/><text class="wrnt" x="97" y="223" text-anchor="middle" style="font-size:13px">EC2 + Auto Scaling</text><rect class="box" x="28" y="256" width="138" height="62" rx="8" stroke-width="1.2"/><text class="sm" x="97" y="280" text-anchor="middle">OS, patching,</text><text class="sm" x="97" y="298" text-anchor="middle">runtime, scaling</text><rect class="bm" x="28" y="328" width="138" height="34" rx="8" stroke-width="1.2"/><text class="sm" x="97" y="350" text-anchor="middle">no</text><rect class="bp" x="175" y="116" width="138" height="64" rx="8" stroke-width="1.5"/><text class="lbl" x="244" y="142" text-anchor="middle">AKS</text><text class="sub" x="244" y="162" text-anchor="middle" style="font-size:12px">(Automatic option)</text><rect class="bw" x="175" y="190" width="138" height="56" rx="8" stroke-width="1.5"/><text class="wrnt" x="244" y="223" text-anchor="middle" style="font-size:13px">EKS (Auto Mode)</text><rect class="box" x="175" y="256" width="138" height="62" rx="8" stroke-width="1.2"/><text class="sm" x="244" y="280" text-anchor="middle">nodes*, add-ons,</text><text class="sm" x="244" y="298" text-anchor="middle">upgrades, YAML</text><rect class="bm" x="175" y="328" width="138" height="34" rx="8" stroke-width="1.2"/><text class="sm" x="244" y="350" text-anchor="middle">no**</text><rect class="bp" x="322" y="116" width="138" height="64" rx="8" stroke-width="1.5"/><text class="lbl" x="391" y="142" text-anchor="middle">Container Apps</text><text class="sub" x="391" y="162" text-anchor="middle" style="font-size:12px">(KEDA, Dapr)</text><rect class="bw" x="322" y="190" width="138" height="56" rx="8" stroke-width="1.5"/><text class="wrnt" x="391" y="214" text-anchor="middle" style="font-size:13px">ECS on Fargate,</text><text class="wrnt" x="391" y="232" text-anchor="middle" style="font-size:13px">App Runner</text><rect class="box" x="322" y="256" width="138" height="62" rx="8" stroke-width="1.2"/><text class="sm" x="391" y="280" text-anchor="middle">image, scale</text><text class="sm" x="391" y="298" text-anchor="middle">rules, revisions</text><rect class="bo" x="322" y="328" width="138" height="34" rx="8" stroke-width="1.2"/><text class="okt" x="391" y="350" text-anchor="middle">yes</text><rect class="bp" x="469" y="116" width="138" height="64" rx="8" stroke-width="1.5"/><text class="lbl" x="538" y="142" text-anchor="middle">App Service</text><text class="sub" x="538" y="162" text-anchor="middle" style="font-size:12px">(Web App, Java SE)</text><rect class="bw" x="469" y="190" width="138" height="56" rx="8" stroke-width="1.5"/><text class="wrnt" x="538" y="214" text-anchor="middle" style="font-size:13px">Elastic Beanstalk</text><text class="wrnt" x="538" y="232" text-anchor="middle" style="font-size:13px">/ App Runner</text><rect class="box" x="469" y="256" width="138" height="62" rx="8" stroke-width="1.2"/><text class="sm" x="538" y="280" text-anchor="middle">code or image,</text><text class="sm" x="538" y="298" text-anchor="middle">plan size, slots</text><rect class="bm" x="469" y="328" width="138" height="34" rx="8" stroke-width="1.2"/><text class="sm" x="538" y="350" text-anchor="middle">no</text><rect class="bp" x="616" y="116" width="138" height="64" rx="8" stroke-width="1.5"/><text class="lbl" x="685" y="142" text-anchor="middle">Functions</text><text class="sub" x="685" y="162" text-anchor="middle" style="font-size:12px">(Flex Consumption)</text><rect class="bw" x="616" y="190" width="138" height="56" rx="8" stroke-width="1.5"/><text class="wrnt" x="685" y="223" text-anchor="middle" style="font-size:13px">Lambda</text><rect class="box" x="616" y="256" width="138" height="62" rx="8" stroke-width="1.2"/><text class="sm" x="685" y="280" text-anchor="middle">function code,</text><text class="sm" x="685" y="298" text-anchor="middle">triggers</text><rect class="bo" x="616" y="328" width="138" height="34" rx="8" stroke-width="1.2"/><text class="okt" x="685" y="350" text-anchor="middle">yes</text><text class="sub" x="28" y="386">Rows: Azure service · closest AWS equivalent · what you still own · can it scale to zero?</text><text class="sub" x="28" y="408">* AKS Automatic manages node provisioning for you. ** The cluster stays up; user pools can scale to 0.</text><text class="sub" x="28" y="430">Azure Spring Apps is retiring (31 March 2028); Microsoft points Spring Boot teams to Container Apps.</text>
</svg>
