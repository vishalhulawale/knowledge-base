<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">The learning-round loop</title>
  <desc id="d">Animation: five steps in a cycle, highlighted in turn: Orient, Hypothesise, Probe, Build and Confirm, with a dashed surprise arrow from Probe back to Orient. A panel explains each step for a paginated shipments API: skim the docs for auth, pagination, rate limits and errors; state the hypothesis that next_cursor is null on the last page; call with limit 2 and print the raw response; write the paginate loop on confirmed facts only; and assert the page count and honour Retry-After on a 429.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .p{opacity:0;animation:15s infinite linear}
    @keyframes p0{0%,19.99%{opacity:1}20%,100%{opacity:0}}.p0{animation-name:p0}
    @keyframes p1{0%,19.99%{opacity:0}20%,39.99%{opacity:1}40%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,39.99%{opacity:0}40%,59.99%{opacity:1}60%,100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%,59.99%{opacity:0}60%,79.99%{opacity:1}80%,100%{opacity:0}}.p3{animation-name:p3}
    @keyframes p4{0%,79.99%{opacity:0}80%,100%{opacity:1}}.p4{animation-name:p4}
    @media (prefers-reduced-motion: reduce){.p{animation:none;opacity:0}.p2{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="374" rx="14"/>
  <text class="h" x="28" y="40">The learning-round loop</text><text class="sub" x="28" y="62">Build only on confirmed facts; a surprise sends you back to Orient, which is cheap.</text><line class="ln" x1="238.833" y1="112.931" x2="272.058" y2="168.811" marker-end="url(#ar)"/><line class="ln" x1="299.294" y1="203.841" x2="286.603" y2="294.257" marker-end="url(#ar)"/><line class="ln" x1="222.534" y1="317.082" x2="181.466" y2="317.082" marker-end="url(#ar)"/><line class="ln" x1="114.633" y1="296.159" x2="101.942" y2="205.743" marker-end="url(#ar)"/><line class="ln" x1="124.706" y1="169.987" x2="157.931" y2="114.107" marker-end="url(#ar)"/><rect class="box" x="142" y="82" width="116" height="36" rx="18" stroke-width="1.5"/><text class="sm" x="200" y="105" text-anchor="middle" font-weight="700">Orient</text><g class="p p0"><rect class="tea" x="142" y="82" width="116" height="36" rx="18"/><text class="on13" x="200" y="105" text-anchor="middle">Orient</text><rect class="bt" x="400" y="120" width="372" height="150" rx="10"/><text class="teat" x="416" y="148" font-size="15">1. Orient</text><text class="sm" x="416" y="178">Skim the docs: auth, pagination, rate</text><text class="sm" x="416" y="198">limits, errors; run the example unchanged</text></g><rect class="box" x="256.127" y="164.918" width="116" height="36" rx="18" stroke-width="1.5"/><text class="sm" x="314.127" y="187.918" text-anchor="middle" font-weight="700">Hypothesise</text><g class="p p1"><rect class="tea" x="256.127" y="164.918" width="116" height="36" rx="18"/><text class="on13" x="314.127" y="187.918" text-anchor="middle">Hypothesise</text><rect class="bt" x="400" y="120" width="372" height="150" rx="10"/><text class="teat" x="416" y="148" font-size="15">2. Hypothesise</text><text class="sm" x="416" y="178">"next_cursor is null on the last page." Say</text><text class="sm" x="416" y="198">it out loud.</text></g><rect class="box" x="212.534" y="299.082" width="116" height="36" rx="18" stroke-width="1.5"/><text class="sm" x="270.534" y="322.082" text-anchor="middle" font-weight="700">Probe</text><g class="p p2"><rect class="tea" x="212.534" y="299.082" width="116" height="36" rx="18"/><text class="on13" x="270.534" y="322.082" text-anchor="middle">Probe</text><rect class="bt" x="400" y="120" width="372" height="150" rx="10"/><text class="teat" x="416" y="148" font-size="15">3. Probe</text><text class="sm" x="416" y="178">Call with limit=2 and print the raw</text><text class="sm" x="416" y="198">response. Ask the interviewer if unclear.</text></g><rect class="box" x="71.4658" y="299.082" width="116" height="36" rx="18" stroke-width="1.5"/><text class="sm" x="129.466" y="322.082" text-anchor="middle" font-weight="700">Build</text><g class="p p3"><rect class="tea" x="71.4658" y="299.082" width="116" height="36" rx="18"/><text class="on13" x="129.466" y="322.082" text-anchor="middle">Build</text><rect class="bt" x="400" y="120" width="372" height="150" rx="10"/><text class="teat" x="416" y="148" font-size="15">4. Build</text><text class="sm" x="416" y="178">Write the paginate() loop on confirmed facts</text><text class="sm" x="416" y="198">only, a few lines at a time</text></g><rect class="box" x="27.8732" y="164.918" width="116" height="36" rx="18" stroke-width="1.5"/><text class="sm" x="85.8732" y="187.918" text-anchor="middle" font-weight="700">Confirm</text><g class="p p4"><rect class="tea" x="27.8732" y="164.918" width="116" height="36" rx="18"/><text class="on13" x="85.8732" y="187.918" text-anchor="middle">Confirm</text><rect class="bt" x="400" y="120" width="372" height="150" rx="10"/><text class="teat" x="416" y="148" font-size="15">5. Confirm</text><text class="sm" x="416" y="178">assert the page count; on 429, honour</text><text class="sm" x="416" y="198">Retry-After. Then the next piece.</text></g><path class="lnw dash" d="M 240.53423027509677 297.08203932499373 Q 210 210 210.0 120.0" marker-end="url(#arw)"/><text class="wrnt" x="128" y="254" font-size="13">surprise</text><text class="sub" x="400" y="300">Example task: a paginated shipments API with a 429 rate limit.</text>
</svg>
