<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Strangler fig migration</title>
  <desc id="d">Animation: clients call a routing facade in front of a legacy monolith that serves /refills, /eligibility and /pricing. In turn, each route is switched from the monolith to a new service: first the refill service, then eligibility, then pricing. Each switch is a reversible release. When nothing routes to the monolith any more, it fades and is marked retired.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    .kk{animation:15s infinite linear}
    @keyframes leg{0%,88%{opacity:1}92%,100%{opacity:0.25}}.leg{animation-name:leg}
    @keyframes ret{0%,91.99%{opacity:0}92%,100%{opacity:1}}.ret{animation-name:ret}
    @keyframes o0{0%,19.99%{opacity:1}20%,100%{opacity:0}}.o0{animation-name:o0}
    @keyframes m0{0%,19.99%{opacity:0}20%,100%{opacity:1}}.m0{animation-name:m0}
    @keyframes o1{0%,44.99%{opacity:1}45%,100%{opacity:0}}.o1{animation-name:o1}
    @keyframes m1{0%,44.99%{opacity:0}45%,100%{opacity:1}}.m1{animation-name:m1}
    @keyframes o2{0%,69.99%{opacity:1}70%,100%{opacity:0}}.o2{animation-name:o2}
    @keyframes m2{0%,69.99%{opacity:0}70%,100%{opacity:1}}.m2{animation-name:m2}
    @keyframes c0{0%,19.99%{opacity:1}20%,100%{opacity:0}}.c0{animation-name:c0}
    @keyframes c1{0%,19.99%{opacity:0}20%,44.99%{opacity:1}45%,100%{opacity:0}}.c1{animation-name:c1}
    @keyframes c2{0%,44.99%{opacity:0}45%,69.99%{opacity:1}70%,100%{opacity:0}}.c2{animation-name:c2}
    @keyframes c3{0%,69.99%{opacity:0}70%,100%{opacity:1}}.c3{animation-name:c3}
    @media (prefers-reduced-motion: reduce){.k,.kk{animation:none}.k{opacity:0}.leg{opacity:0.25}.ret{opacity:1}.m0{opacity:1}.m1{opacity:1}.m2{opacity:1}.c3{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="382" rx="14"/>
  <text class="h" x="28" y="40">Strangler fig: move one route at a time</text><text class="sub" x="28" y="62">Every switch is a normal, reversible release. Route names illustrative.</text><rect class="bm" x="30" y="170" width="110" height="56" rx="8" stroke-width="1.5"/><text class="lbl" x="85" y="203" text-anchor="middle">Clients</text><line class="ln" x1="140" y1="198" x2="186" y2="198" marker-end="url(#ar)"/><rect class="bp" x="190" y="138" width="150" height="120" rx="8" stroke-width="1.5"/><text class="lbl" x="265" y="185" text-anchor="middle">Routing</text><text class="lbl" x="265" y="203" text-anchor="middle">facade</text><text class="lbl" x="265" y="221" text-anchor="middle">(gateway)</text><g class="kk leg"><rect class="bw" x="450" y="86" width="310" height="118" rx="10" stroke-width="1.5"/><text class="wrnt" x="466" y="108" style="font-size:14px">Legacy monolith</text></g><g class="k ret"><text class="badt" x="745" y="108" text-anchor="end" style="font-size:14px">retired</text></g><g class="k o0"><line class="lnw" x1="340" y1="160" x2="446" y2="128" marker-end="url(#arw)"/></g><text class="sm" x="480" y="133" style="font-size:13px">/refills</text><g class="k m0"><line class="lnb" x1="478" y1="129" x2="530.8" y2="129" style="stroke-width:1.5"/><text class="sub" x="600" y="133">moved</text></g><rect class="box" x="450" y="266" width="98" height="54" rx="8" stroke-width="1.2" stroke-dasharray="4 4"/><g class="k m0"><rect class="bt" x="450" y="266" width="98" height="54" rx="8" stroke-width="1.5"/><text class="sm" x="499" y="289" text-anchor="middle">Refill</text><text class="sm" x="499" y="307" text-anchor="middle">service</text><path class="lnt" d="M 250 258 Q 250 293 446 293" marker-end="url(#art)"/></g><g class="k o1"><line class="lnw" x1="340" y1="174" x2="446" y2="152" marker-end="url(#arw)"/></g><text class="sm" x="480" y="157" style="font-size:13px">/eligibility</text><g class="k m1"><line class="lnb" x1="478" y1="153" x2="557.2" y2="153" style="stroke-width:1.5"/><text class="sub" x="600" y="157">moved</text></g><rect class="box" x="556" y="266" width="98" height="54" rx="8" stroke-width="1.2" stroke-dasharray="4 4"/><g class="k m1"><rect class="bt" x="556" y="266" width="98" height="54" rx="8" stroke-width="1.5"/><text class="sm" x="605" y="289" text-anchor="middle">Eligibility</text><text class="sm" x="605" y="307" text-anchor="middle">svc</text><path class="lnt" d="M 280 258 Q 280 293 552 293" marker-end="url(#art)"/></g><g class="k o2"><line class="lnw" x1="340" y1="188" x2="446" y2="176" marker-end="url(#arw)"/></g><text class="sm" x="480" y="181" style="font-size:13px">/pricing</text><g class="k m2"><line class="lnb" x1="478" y1="177" x2="530.8" y2="177" style="stroke-width:1.5"/><text class="sub" x="600" y="181">moved</text></g><rect class="box" x="662" y="266" width="98" height="54" rx="8" stroke-width="1.2" stroke-dasharray="4 4"/><g class="k m2"><rect class="bt" x="662" y="266" width="98" height="54" rx="8" stroke-width="1.5"/><text class="sm" x="711" y="289" text-anchor="middle">Pricing</text><text class="sm" x="711" y="307" text-anchor="middle">service</text><path class="lnt" d="M 310 258 Q 310 293 658 293" marker-end="url(#art)"/></g><g class="k c0"><text class="sm" x="28" y="360" font-weight="600">All traffic still goes to the monolith; the facade is in place.</text></g><g class="k c1"><text class="sm" x="28" y="360" font-weight="600">/refills switched to the new Refill service; rollback = flip the route.</text></g><g class="k c2"><text class="sm" x="28" y="360" font-weight="600">/eligibility switched; the monolith serves less every release.</text></g><g class="k c3"><text class="sm" x="28" y="360" font-weight="600">/pricing switched; nothing routes to the monolith, so it is retired.</text></g>
</svg>
