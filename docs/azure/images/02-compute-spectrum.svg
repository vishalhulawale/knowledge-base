<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Azure compute spectrum</title>
  <desc id="d">Five columns order Azure compute services from most control to least to operate, each with its closest AWS equivalent, what you still own and whether it scales to zero. Virtual Machines with Scale Sets map to EC2 with Auto Scaling, you own the OS, patching, runtime and scaling, and it does not scale to zero. AKS maps to EKS, you own nodes unless you use AKS Automatic, add-ons, upgrades and manifests, and the cluster stays up. Container Apps maps to ECS on Fargate or App Runner, you own the image, scale rules and revisions, and it scales to zero. App Service maps to Elastic Beanstalk or App Runner, you own code or image, plan size and slots, and it does not scale to zero. Functions on Flex Consumption maps to Lambda, you own function code and triggers, and it scales to zero. A note says Azure Spring Apps retires on 31 March 2028 with Container Apps as the recommended destination.</desc>
