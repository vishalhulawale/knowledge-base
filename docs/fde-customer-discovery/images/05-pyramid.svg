<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Pyramid Principle and SCQA</title>
  <desc id="d">A pyramid with the answer at the top: recommend moving the claims assistant to production for three teams in Q1. Below it three supporting points: it works (31 percent faster handling), it is safe (guardrails held) and it pays back (about five months), each with data available on request. Beside it, an SCQA strip: situation, the claims backlog is nine days; complication, hiring cannot close the gap; question, should we scale the assistant; answer, yes, three teams in Q1. Figures are illustrative.</desc>
