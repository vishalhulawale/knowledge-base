  <text class="badt" x="316" y="180" font-size="22">4 rows</text><text class="tx" x="400" y="180">returned for LIMIT 10, no error</text>
  <text class="sub" x="316" y="204">The user sees an incomplete answer; nothing in the logs says why.</text></g>
