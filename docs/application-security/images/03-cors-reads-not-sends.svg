<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">CORS reads not sends</title>
  <desc id="d">Two panels. Left: a script on evil.example sends a cross-origin request through the browser; the API processes it and side effects happen, but without an Allow-Origin header the browser stops the script reading the response. Right: curl sends the same request and reads the full response, because CORS headers are ignored outside browsers, so only server-side authentication and authorisation protect the API.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="408" rx="14"/>
  <text class="h" x="28" y="40">CORS guards reads, not sends</text><text class="sub" x="28" y="62">The same cross-origin POST from a browser script and from curl.</text><rect class="card" x="28" y="80" width="360" height="280" rx="10" stroke-width="1.5"/><text class="lbl" x="44" y="106">Script on evil.example, in a browser</text><rect class="card" x="412" y="80" width="360" height="280" rx="10" stroke-width="1.5"/><text class="lbl" x="428" y="106">curl or another server</text><rect class="bp" x="48" y="130" width="100" height="46" rx="8" stroke-width="1.5"/><text class="sm" x="98" y="158" text-anchor="middle" font-weight="700">Browser</text><rect class="box" x="268" y="130" width="100" height="46" rx="8" stroke-width="1.5"/><text class="sm" x="318" y="158" text-anchor="middle" font-weight="700">API</text><line class="lnp" x1="150" y1="146" x2="264" y2="146" marker-end="url(#arp)"/><text class="sub" x="207" y="136" text-anchor="middle">request</text><line class="ln" x1="266" y1="166" x2="152" y2="166" marker-end="url(#ar)"/><text class="sub" x="207" y="190" text-anchor="middle">response</text><rect class="bw" x="232" y="210" width="152" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="308" y="230" text-anchor="middle">processed:</text><text class="sm" x="308" y="248" text-anchor="middle">side effects happen</text><rect class="bo" x="44" y="210" width="160" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="124" y="230" text-anchor="middle">no Allow-Origin:</text><text class="sm" x="124" y="248" text-anchor="middle">script can't read</text><text class="sm" x="48" y="290">Protects the user's data from other sites.</text><text class="sm" x="48" y="308">Doesn't stop the request or CSRF.</text><rect class="bb" x="432" y="130" width="100" height="46" rx="8" stroke-width="1.5"/><text class="sm" x="482" y="158" text-anchor="middle" font-weight="700">curl</text><rect class="box" x="652" y="130" width="100" height="46" rx="8" stroke-width="1.5"/><text class="sm" x="702" y="158" text-anchor="middle" font-weight="700">API</text><line class="lnb" x1="534" y1="146" x2="648" y2="146" marker-end="url(#arb)"/><text class="sub" x="591" y="136" text-anchor="middle">request</text><line class="ln" x1="650" y1="166" x2="536" y2="166" marker-end="url(#ar)"/><text class="sub" x="591" y="190" text-anchor="middle">response</text><rect class="bb" x="432" y="210" width="320" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="592" y="230" text-anchor="middle">reads everything:</text><text class="sm" x="592" y="248" text-anchor="middle">CORS headers are ignored outside browsers</text><text class="sm" x="432" y="290">Authentication and authorisation on the</text><text class="sm" x="432" y="308">server are the only real protection.</text><text class="sm" x="28" y="388">CORS is a browser policy the server opts into. It is not an access-control mechanism for your API.</text>
</svg>
