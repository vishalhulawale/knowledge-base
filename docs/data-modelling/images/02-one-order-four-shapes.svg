  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="532" rx="14"/>
  <text class="h" x="28" y="40">One order, four shapes</text><text class="sub" x="28" y="62">Order o-981 for member 42 in each model. Values illustrative.</text><rect class="bp" x="20" y="80" width="372" height="196" rx="10" stroke-width="1.3"/><text class="prit" x="34" y="104" style="font-size:14px">Relational: each fact once</text><rect class="bt" x="408" y="80" width="372" height="196" rx="10" stroke-width="1.3"/><text class="teat" x="422" y="104" style="font-size:14px">Document: the aggregate in one record</text><rect class="bw" x="20" y="290" width="372" height="196" rx="10" stroke-width="1.3"/><text class="wrnt" x="34" y="314" style="font-size:14px">DynamoDB: one item collection per member</text><rect class="bb" x="408" y="290" width="372" height="196" rx="10" stroke-width="1.3"/><text class="badt" x="422" y="314" style="font-size:14px">Wide-column: one table per query</text><text class="sm" x="34" y="124" font-weight="700">rx_order</text><text class="mono" x="130" y="124" xml:space="preserve">id     member  status</text><text class="mono" x="130" y="142" xml:space="preserve">o-981  42      READY</text><text class="sm" x="34" y="168" font-weight="700">order_line</text><text class="mono" x="130" y="168" xml:space="preserve">order  ndc          qty</text><text class="mono" x="130" y="186" xml:space="preserve">o-981  00093-1048   60</text><text class="sm" x="34" y="212" font-weight="700">drug</text><text class="mono" x="130" y="212" xml:space="preserve">ndc          name</text><text class="mono" x="130" y="230" xml:space="preserve">00093-1048   metformin 500 mg</text><text class="mono" x="422" y="128" xml:space="preserve">{ _id: "o-981", memberId: 42,</text><text class="mono" x="422" y="147" xml:space="preserve">  status: "READY",</text><text class="mono" x="422" y="166" xml:space="preserve">  lines: [ { ndc: "00093-1048",</text><text class="mono" x="422" y="185" xml:space="preserve">      drugName: "metformin 500 mg",</text><text class="mono" x="422" y="204" xml:space="preserve">      qty: 60 } ],</text><text class="mono" x="422" y="223" xml:space="preserve">  schemaVersion: 2 }</text><text class="sub" x="422" y="262">drugName copied: an extended reference</text><text class="sm" x="34" y="338" font-weight="700">PK</text><text class="sm" x="130" y="338" font-weight="700">SK</text><text class="sm" x="318" y="338" font-weight="700">attrs</text><text class="mono" x="34" y="362" xml:space="preserve">MEMBER#42</text><text class="mono" x="130" y="362" xml:space="preserve">ORDER#2026-09-01#o-877</text><text class="mono" x="318" y="362" xml:space="preserve">…</text><text class="mono" x="34" y="386" xml:space="preserve">MEMBER#42</text><text class="mono" x="130" y="386" xml:space="preserve">ORDER#2026-10-03#o-981</text><text class="mono" x="318" y="386" xml:space="preserve">lines</text><text class="mono" x="34" y="410" xml:space="preserve">MEMBER#42</text><text class="mono" x="130" y="410" xml:space="preserve">PROFILE</text><text class="mono" x="318" y="410" xml:space="preserve">name</text><text class="sub" x="34" y="452">same PK: one Query returns profile and orders</text><text class="sm" x="422" y="338" font-weight="700">orders_by_member</text><text class="mono" x="422" y="358" xml:space="preserve">((member_id), created_at DESC)</text><text class="mono" x="422" y="378" xml:space="preserve">42 | 2026-10-03 | o-981 | READY</text><text class="sm" x="422" y="406" font-weight="700">ready_orders_by_pharmacy</text><text class="mono" x="422" y="426" xml:space="preserve">((pharmacy_id, day), created_at)</text><text class="mono" x="422" y="446" xml:space="preserve">7 | 2026-10-03 | 09:12 | o-981</text><text class="sm" x="28" y="514">Relational stores once and joins on read; the other three store the data in the shape of each read.</text>
</svg>
