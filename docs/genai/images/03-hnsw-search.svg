<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">HNSW search: coarse hops on top, fine hops at the bottom</title>
  <desc id="d">Animation of a search in an HNSW (hierarchical navigable small world) graph with three layers. The top layer holds a few nodes with long links, the middle layer more nodes, and the bottom layer every vector with short links. The query, a red star, is at the same position on every layer. The search enters at the fixed entry point on the top layer and greedily hops to whichever neighbour is closer to the query: two long hops on the top layer. When no neighbour is closer it drops to the same node one layer down and continues with shorter hops, then drops to the bottom layer, where it keeps a candidate list of size ef_search and returns the closest k nodes, shown in green. Only about a dozen nodes are visited instead of every vector. Parameter values are pgvector defaults: m 16, ef_construction 64, ef_search 40. Simplified: real graphs have up to m links per node per layer and millions of nodes.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:12px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}.lnm{stroke:#cbd5e1;stroke-width:1.2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnm{stroke:#475569}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .a{opacity:0;animation:14s infinite linear}
    @keyframes s0{0%,6%{opacity:0}8%,90%{opacity:1}94%,100%{opacity:0}}
    .s0{animation-name:s0}
    @keyframes s1{0%,15%{opacity:0}17%,90%{opacity:1}94%,100%{opacity:0}}
    .s1{animation-name:s1}
    @keyframes s2{0%,24%{opacity:0}26%,90%{opacity:1}94%,100%{opacity:0}}
    .s2{animation-name:s2}
    @keyframes s3{0%,33%{opacity:0}35%,90%{opacity:1}94%,100%{opacity:0}}
    .s3{animation-name:s3}
    @keyframes s4{0%,42%{opacity:0}44%,90%{opacity:1}94%,100%{opacity:0}}
    .s4{animation-name:s4}
    @keyframes s5{0%,51%{opacity:0}53%,90%{opacity:1}94%,100%{opacity:0}}
    .s5{animation-name:s5}
    @keyframes s6{0%,60%{opacity:0}62%,90%{opacity:1}94%,100%{opacity:0}}
