    @keyframes rv{0%,5%{transform:scaleX(0)}80%,100%{transform:scaleX(1)}}
    .cur{animation:cur 14s infinite linear}
    @keyframes cur{0%,5%{transform:translateX(0);opacity:1}80%{transform:translateX(640px);opacity:1}80.01%,100%{transform:translateX(640px);opacity:0}}
    .k{opacity:0;animation:14s infinite linear}
    @keyframes d1{0%,13.5614%{opacity:0}13.5714%,100%{opacity:1}}.d1{animation-name:d1}
