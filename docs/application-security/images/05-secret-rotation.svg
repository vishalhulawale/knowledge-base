<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 446" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Secret rotation labels</title>
  <desc id="d">Animation: the four rotation steps light up in turn. createSecret adds version v2 labelled AWSPENDING next to v1 labelled AWSCURRENT. setSecret makes the PostgreSQL user accept the v2 password. testSecret logs in with it. finishSecret moves AWSCURRENT to v2 and labels v1 AWSPREVIOUS. Pods that always ask for AWSCURRENT switch from v1 to v2.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:16s infinite linear}
    @keyframes st0{0%,7.99%{opacity:0}8%,27.99%{opacity:1}28%,100%{opacity:0}}.st0{animation-name:st0}
    @keyframes st1{0%,27.99%{opacity:0}28%,47.99%{opacity:1}48%,100%{opacity:0}}.st1{animation-name:st1}
    @keyframes st2{0%,47.99%{opacity:0}48%,67.99%{opacity:1}68%,100%{opacity:0}}.st2{animation-name:st2}
    @keyframes st3{0%,67.99%{opacity:0}68%,95.99%{opacity:1}96%,100%{opacity:0}}.st3{animation-name:st3}
    @keyframes v2{0%,7.99%{opacity:0}8%,100%{opacity:1}}.v2{animation-name:v2}
    @keyframes l1a{0%,67.99%{opacity:1}68%,100%{opacity:0}}.l1a{animation-name:l1a}
    @keyframes l1b{0%,67.99%{opacity:0}68%,100%{opacity:1}}.l1b{animation-name:l1b}
    @keyframes l2a{0%,7.99%{opacity:0}8%,67.99%{opacity:1}68%,100%{opacity:0}}.l2a{animation-name:l2a}
    @keyframes l2b{0%,67.99%{opacity:0}68%,100%{opacity:1}}.l2b{animation-name:l2b}
    @keyframes db{0%,27.99%{opacity:0}28%,100%{opacity:1}}.db{animation-name:db}
    @keyframes ts{0%,47.99%{opacity:0}48%,100%{opacity:1}}.ts{animation-name:ts}
    @keyframes pa{0%,73.99%{opacity:1}74%,100%{opacity:0}}.pa{animation-name:pa}
    @keyframes pb{0%,73.99%{opacity:0}74%,100%{opacity:1}}.pb{animation-name:pb}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.v2,.l1b,.l2b,.db,.ts,.pb,.st3{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="444" rx="14"/>
  <text class="h" x="28" y="40">Rotation moves labels, not values</text><text class="sub" x="28" y="62">AWS Secrets Manager rotation for a database secret.</text><rect class="bm" x="28" y="80" width="178" height="32" rx="6"/><text class="sm" x="117" y="101" text-anchor="middle">1. createSecret</text><g class="k st0"><rect class="tea" x="28" y="80" width="178" height="32" rx="6"/><text class="on13" x="117" y="101" text-anchor="middle">1. createSecret</text></g><rect class="bm" x="216" y="80" width="178" height="32" rx="6"/><text class="sm" x="305" y="101" text-anchor="middle">2. setSecret</text><g class="k st1"><rect class="tea" x="216" y="80" width="178" height="32" rx="6"/><text class="on13" x="305" y="101" text-anchor="middle">2. setSecret</text></g><rect class="bm" x="404" y="80" width="178" height="32" rx="6"/><text class="sm" x="493" y="101" text-anchor="middle">3. testSecret</text><g class="k st2"><rect class="tea" x="404" y="80" width="178" height="32" rx="6"/><text class="on13" x="493" y="101" text-anchor="middle">3. testSecret</text></g><rect class="bm" x="592" y="80" width="178" height="32" rx="6"/><text class="sm" x="681" y="101" text-anchor="middle">4. finishSecret</text><g class="k st3"><rect class="tea" x="592" y="80" width="178" height="32" rx="6"/><text class="on13" x="681" y="101" text-anchor="middle">4. finishSecret</text></g><rect class="box" x="90" y="140" width="180" height="64" rx="8" stroke-width="1.5"/><text class="sm" x="180" y="167" text-anchor="middle">version v1</text><text class="sm" x="180" y="187" text-anchor="middle">password …a91</text><g class="k v2"><rect class="box" x="470" y="140" width="180" height="64" rx="8" stroke-width="1.5"/><text class="sm" x="560" y="167" text-anchor="middle">version v2</text><text class="sm" x="560" y="187" text-anchor="middle">password …7c4</text></g><g class="k l1a"><rect class="okf" x="90" y="214" width="180" height="26" rx="13"/><text class="on13" x="180" y="232" text-anchor="middle" style="font-size:13px">AWSCURRENT</text></g><g class="k l1b"><rect class="mutf" x="90" y="214" width="180" height="26" rx="13"/><text class="on13" x="180" y="232" text-anchor="middle" style="font-size:13px">AWSPREVIOUS</text></g><g class="k l2a"><rect class="wrnf" x="470" y="214" width="180" height="26" rx="13"/><text class="on13" x="560" y="232" text-anchor="middle" style="font-size:13px">AWSPENDING</text></g><g class="k l2b"><rect class="okf" x="470" y="214" width="180" height="26" rx="13"/><text class="on13" x="560" y="232" text-anchor="middle" style="font-size:13px">AWSCURRENT</text></g><rect class="bm" x="300" y="270" width="200" height="50" rx="8" stroke-width="1.5"/><text class="sm" x="400" y="300" text-anchor="middle" font-weight="700">PostgreSQL user</text><g class="k db"><text class="okt" x="400" y="338" text-anchor="middle" style="font-size:13px">accepts v2 password</text></g><g class="k ts"><text class="okt" x="560" y="300" style="font-size:13px">test login ✓</text></g><text class="sm" x="28" y="380" font-weight="700">Pods ask for AWSCURRENT:</text><rect class="box" x="240" y="362" width="104" height="28" rx="6" stroke-width="1"/><g class="k pa"><text class="sm" x="292" y="381" text-anchor="middle">uses v1</text></g><g class="k pb"><text class="okt" x="292" y="381" text-anchor="middle" style="font-size:13px">uses v2</text></g><rect class="box" x="360" y="362" width="104" height="28" rx="6" stroke-width="1"/><g class="k pa"><text class="sm" x="412" y="381" text-anchor="middle">uses v1</text></g><g class="k pb"><text class="okt" x="412" y="381" text-anchor="middle" style="font-size:13px">uses v2</text></g><rect class="box" x="480" y="362" width="104" height="28" rx="6" stroke-width="1"/><g class="k pa"><text class="sm" x="532" y="381" text-anchor="middle">uses v1</text></g><g class="k pb"><text class="okt" x="532" y="381" text-anchor="middle" style="font-size:13px">uses v2</text></g><text class="sm" x="28" y="424">With alternating users, v1 keeps working until the next rotation, so there's no gap.</text>
</svg>
