<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Telescoping constructor vs builder</title>
  <desc id="d">The same prescription order created two ways. With a telescoping constructor the call site is new Order with eight positional arguments: rx-1, 2, null, null, true, false, null, 30. Nothing says which boolean is which, and swapping two arguments of the same type compiles. With a builder each value is named, optional values are simply left out, and build() validates the whole object before returning an immutable instance.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="358" rx="14"/>
  <text class="h" x="28" y="40">Which argument is which?</text>
  <text class="sub" x="28" y="62">The same order, created with a constructor and with a builder.</text>
  <text class="h2 badt" x="28" y="104">Telescoping constructor</text>
  <text class="lbl" x="28" y="140">new Order(</text>
  <rect class="bp" x="128" y="122" width="72" height="28" rx="6" stroke-width="1.5"/>
  <text class="tx" x="164" y="141" text-anchor="middle" font-weight="600">&quot;rx-1&quot;</text>
  <text class="sm wrnt" x="164" y="168" text-anchor="middle">?</text>
  <rect class="bp" x="206" y="122" width="46" height="28" rx="6" stroke-width="1.5"/>
  <text class="tx" x="229" y="141" text-anchor="middle" font-weight="600">2</text>
  <text class="sm wrnt" x="229" y="168" text-anchor="middle">?</text>
  <rect class="bw" x="258" y="122" width="54" height="28" rx="6" stroke-width="1.5"/>
  <text class="tx" x="285" y="141" text-anchor="middle" font-weight="600">null</text>
  <text class="sm wrnt" x="285" y="168" text-anchor="middle">?</text>
  <rect class="bw" x="318" y="122" width="54" height="28" rx="6" stroke-width="1.5"/>
  <text class="tx" x="345" y="141" text-anchor="middle" font-weight="600">null</text>
  <text class="sm wrnt" x="345" y="168" text-anchor="middle">?</text>
  <rect class="bw" x="378" y="122" width="54" height="28" rx="6" stroke-width="1.5"/>
  <text class="tx" x="405" y="141" text-anchor="middle" font-weight="600">true</text>
  <text class="sm wrnt" x="405" y="168" text-anchor="middle">?</text>
  <rect class="bw" x="438" y="122" width="63" height="28" rx="6" stroke-width="1.5"/>
  <text class="tx" x="469.5" y="141" text-anchor="middle" font-weight="600">false</text>
  <text class="sm wrnt" x="469.5" y="168" text-anchor="middle">?</text>
  <rect class="bw" x="507" y="122" width="54" height="28" rx="6" stroke-width="1.5"/>
  <text class="tx" x="534" y="141" text-anchor="middle" font-weight="600">null</text>
  <text class="sm wrnt" x="534" y="168" text-anchor="middle">?</text>
  <rect class="bp" x="567" y="122" width="46" height="28" rx="6" stroke-width="1.5"/>
  <text class="tx" x="590" y="141" text-anchor="middle" font-weight="600">30</text>
  <text class="sm wrnt" x="590" y="168" text-anchor="middle">?</text>
  <text class="lbl" x="619" y="140">)</text>
  <text class="sm badt" x="28" y="194">Positional booleans and nulls: swap urgent and mailed and it still compiles.</text>
  <text class="h2 okt" x="28" y="236">Builder</text>
  <rect class="mutf" x="28" y="252" width="149" height="30" rx="6"/>
  <text class="on13" x="102.5" y="271.5" text-anchor="middle">Order.builder()</text>
  <rect class="pri" x="183" y="252" width="114.6" height="30" rx="6"/>
  <text class="on13" x="240.3" y="271.5" text-anchor="middle">.id(&quot;rx-1&quot;)</text>
  <rect class="pri" x="303.6" y="252" width="80.2" height="30" rx="6"/>
  <text class="on13" x="343.7" y="271.5" text-anchor="middle">.qty(2)</text>
  <rect class="pri" x="389.8" y="252" width="131.8" height="30" rx="6"/>
  <text class="on13" x="455.7" y="271.5" text-anchor="middle">.urgent(true)</text>
  <rect class="pri" x="527.6" y="252" width="149" height="30" rx="6"/>
  <text class="on13" x="602.1" y="271.5" text-anchor="middle">.daysSupply(30)</text>
  <rect class="tea" x="682.6" y="252" width="88.8" height="30" rx="6"/>
  <text class="on13" x="727" y="271.5" text-anchor="middle">.build()</text>
  <text class="sm okt" x="28" y="306">Every value is named; optional ones are left out; build() checks invariants and returns an immutable Order.</text>
  <text class="sub" x="28" y="340">For a few fields a record with a compact constructor is simpler; reach for a builder when optional fields pile up.</text>
</svg>
