<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Validation pipeline gates</title>
  <desc id="d">Animation: three requests travel through five gates: canonicalise, syntax, semantics, store raw and encode at output. An amount of minus five stops at the syntax gate with 400 not positive. A well-formed request for claim 42, which belongs to another member, stops at the semantics gate with 404 not yours. A valid claim passes every gate, is stored raw and encoded at output.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    .tk{animation:15s infinite ease-in-out}
    @keyframes t0{0%{transform:translateX(0px)}3%{transform:translateX(0px)}23%,100%{transform:translateX(136px)}}.t0{animation-name:t0}
    @keyframes r0{0%,23.99%{opacity:0}24%,96.99%{opacity:1}97%,100%{opacity:0}}.r0{animation-name:r0}
    @keyframes t1{0%{transform:translateX(0px)}34%{transform:translateX(0px)}54%,100%{transform:translateX(276px)}}.t1{animation-name:t1}
    @keyframes r1{0%,54.99%{opacity:0}55%,96.99%{opacity:1}97%,100%{opacity:0}}.r1{animation-name:r1}
    @keyframes t2{0%{transform:translateX(0px)}65%{transform:translateX(0px)}85%,100%{transform:translateX(546px)}}.t2{animation-name:t2}
    @keyframes r2{0%,85.99%{opacity:0}86%,96.99%{opacity:1}97%,100%{opacity:0}}.r2{animation-name:r2}
    @media (prefers-reduced-motion: reduce){.k,.tk{animation:none}.k{opacity:1}.t0{transform:translateX(136px)}.t1{transform:translateX(276px)}.t2{transform:translateX(546px)}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="412" rx="14"/>
  <text class="h" x="28" y="40">Each gate rejects a different bad input</text><text class="sub" x="28" y="62">Three requests to POST /claims, one after another.</text><rect class="bp" x="116" y="80" width="108" height="30" rx="6" stroke-width="1.5"/><text class="sm" x="170" y="100" text-anchor="middle">Canonicalise</text><line class="grid" x1="170" y1="112" x2="170" y2="352" stroke-dasharray="4 4"/><rect class="bp" x="256" y="80" width="108" height="30" rx="6" stroke-width="1.5"/><text class="sm" x="310" y="100" text-anchor="middle">Syntax</text><line class="grid" x1="310" y1="112" x2="310" y2="352" stroke-dasharray="4 4"/><rect class="bp" x="396" y="80" width="108" height="30" rx="6" stroke-width="1.5"/><text class="sm" x="450" y="100" text-anchor="middle">Semantics</text><line class="grid" x1="450" y1="112" x2="450" y2="352" stroke-dasharray="4 4"/><rect class="bt" x="536" y="80" width="108" height="30" rx="6" stroke-width="1.5"/><text class="sm" x="590" y="100" text-anchor="middle">Store raw</text><line class="grid" x1="590" y1="112" x2="590" y2="352" stroke-dasharray="4 4"/><rect class="bt" x="666" y="80" width="108" height="30" rx="6" stroke-width="1.5"/><text class="sm" x="720" y="100" text-anchor="middle">Encode out</text><line class="grid" x1="720" y1="112" x2="720" y2="352" stroke-dasharray="4 4"/><text class="sm" x="28" y="155" font-weight="700">amount = "-5"</text><circle class="tk t0 badf" cx="150" cy="150" r="9"/><g class="k r0"><rect class="bb" x="300" y="164" width="160" height="24" rx="6"/><text class="badt" x="380" y="181" text-anchor="middle" style="font-size:13px">400 not positive</text></g><text class="sm" x="28" y="245" font-weight="700">claim 42 (Bob's)</text><circle class="tk t1 badf" cx="150" cy="240" r="9"/><g class="k r1"><rect class="bb" x="440" y="254" width="160" height="24" rx="6"/><text class="badt" x="520" y="271" text-anchor="middle" style="font-size:13px">404 not yours</text></g><text class="sm" x="28" y="335" font-weight="700">valid claim</text><circle class="tk t2 okf" cx="150" cy="330" r="9"/><g class="k r2"><rect class="bo" x="560" y="344" width="160" height="24" rx="6"/><text class="okt" x="640" y="361" text-anchor="middle" style="font-size:13px">stored raw, encoded</text></g><text class="sm" x="28" y="392">Validation happens once at the boundary; encoding happens at every output.</text>
</svg>
