<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Unbounded array: $push latency and document size</title>
  <desc id="d">Measured on the page&#x27;s test: a user&#x27;s activity feed kept as an embedded array, one event pushed at a time. At 100 elements the document is 7 KB and a push takes 2.0 ms; at 1,000 it is 74 KB and 2.7 ms; at 5,000, 374 KB and 7.9 ms; at 10,000, 749 KB and 11.0 ms; at 20,000, 1.5 MB and 14.3 ms. Both grow roughly linearly with the array length, and the 16 MB document limit eventually stops writes altogether.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .s1{stroke:#4f46e5;stroke-width:2;fill:none}.mk{fill:#4f46e5;stroke:#f8fafc;stroke-width:2}.grid{stroke:#e2e8f0;stroke-width:1}.axis{stroke:#94a3b8;stroke-width:1}@media (prefers-color-scheme: dark){.s1{stroke:#6366f1}.mk{fill:#6366f1;stroke:#1f2430}.grid{stroke:#334155}.axis{stroke:#64748b}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Every $push rewrites a bigger document</text>
  <text class="sub" x="28" y="62">Measured: activity feed embedded as an array, one $push at a time.</text>
  <text class="lbl" x="28" y="100">Latency of one $push (ms)</text>
  <line class="grid" x1="78" x2="368" y1="300.0" y2="300.0"/>
  <text class="sm" x="70" y="304" text-anchor="end">0</text>
  <line class="grid" x1="78" x2="368" y1="243.8" y2="243.8"/>
  <text class="sm" x="70" y="247.75" text-anchor="end">5</text>
  <line class="grid" x1="78" x2="368" y1="187.5" y2="187.5"/>
  <text class="sm" x="70" y="191.5" text-anchor="end">10</text>
  <line class="grid" x1="78" x2="368" y1="131.2" y2="131.2"/>
  <text class="sm" x="70" y="135.25" text-anchor="end">15</text>
  <line class="axis" x1="78" x2="368" y1="300" y2="300"/>
  <text class="sm" x="78" y="318" text-anchor="middle">0</text>
  <text class="sm" x="150.5" y="318" text-anchor="middle">5k</text>
  <text class="sm" x="223" y="318" text-anchor="middle">10k</text>
  <text class="sm" x="295.5" y="318" text-anchor="middle">15k</text>
  <text class="sm" x="368" y="318" text-anchor="middle">20k</text>
  <text class="sm" x="223" y="336" text-anchor="middle">array length (elements)</text>
  <polyline class="s1" points="79.5,277.5 92.5,269.6 150.5,211.1 223.0,176.2 368.0,139.1"/>
  <circle class="mk" cx="79.5" cy="277.5" r="5"/>
  <circle class="mk" cx="92.5" cy="269.6" r="5"/>
  <circle class="mk" cx="150.5" cy="211.1" r="5"/>
  <circle class="mk" cx="223.0" cy="176.2" r="5"/>
  <circle class="mk" cx="368.0" cy="139.1" r="5"/>
  <text class="sm" x="362" y="127.125" text-anchor="end" font-weight="700">14.3 ms</text>
  <text class="sm" x="104.1" y="287.4" font-weight="700">2.0 ms at 100 elements</text>
  <text class="lbl" x="420" y="100">Document size</text>
  <line class="grid" x1="470" x2="760" y1="300.0" y2="300.0"/>
  <text class="sm" x="462" y="304" text-anchor="end">0 KB</text>
  <line class="grid" x1="470" x2="760" y1="243.8" y2="243.8"/>
  <text class="sm" x="462" y="247.75" text-anchor="end">500 KB</text>
  <line class="grid" x1="470" x2="760" y1="187.5" y2="187.5"/>
  <text class="sm" x="462" y="191.5" text-anchor="end">1 MB</text>
  <line class="grid" x1="470" x2="760" y1="131.2" y2="131.2"/>
  <text class="sm" x="462" y="135.25" text-anchor="end">1.5 MB</text>
  <line class="axis" x1="470" x2="760" y1="300" y2="300"/>
  <text class="sm" x="470" y="318" text-anchor="middle">0</text>
  <text class="sm" x="542.5" y="318" text-anchor="middle">5k</text>
  <text class="sm" x="615" y="318" text-anchor="middle">10k</text>
  <text class="sm" x="687.5" y="318" text-anchor="middle">15k</text>
  <text class="sm" x="760" y="318" text-anchor="middle">20k</text>
  <text class="sm" x="615" y="336" text-anchor="middle">array length (elements)</text>
  <polyline class="s1" points="471.4,299.2 484.5,291.7 542.5,257.9 615.0,215.7 760.0,127.2"/>
  <circle class="mk" cx="471.4" cy="299.2" r="5"/>
  <circle class="mk" cx="484.5" cy="291.7" r="5"/>
  <circle class="mk" cx="542.5" cy="257.9" r="5"/>
  <circle class="mk" cx="615.0" cy="215.7" r="5"/>
  <circle class="mk" cx="760.0" cy="127.2" r="5"/>
  <text class="sm" x="754" y="115.2" text-anchor="end" font-weight="700">1.5 MB</text>
  <text class="sm" x="571.5" y="287.4" font-weight="700">7 KB at 100 elements</text>
  <text class="sub" x="28" y="364">Fix: events in their own collection, a bucket per user per day, or embed only the latest N ($push with $slice).</text>
</svg>
