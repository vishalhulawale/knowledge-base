<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Lazy versus eager migration</title>
  <desc id="d">Two panels, each showing twelve documents at release day, week 2 and week 8, amber for schemaVersion 1 and teal for version 2. Lazy migration, where readers upcast version 1 in memory and the next write saves version 2: 12, then 7, then 3 documents still on version 1, because rarely touched documents linger. Eager migration, a throttled background job rewriting batches while readers handle both versions: 12, then 6, then 0, at which point the version 1 reader code can be deleted. Illustrative.</desc>
