<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Partition leaders spread across brokers, and failover</title>
  <desc id="d">Three brokers hold three partitions of the orders topic with replication factor 3. Leadership is spread: broker 1 leads P0, broker 2 leads P1 and broker 3 leads P2, and every broker follows the other two. Then broker 2 stops sending heartbeats. The active KRaft controller fences it after broker.session.timeout.ms, removes it from every ISR, and elects broker 3, an in-sync follower, as the new leader of P1. Producers and consumers refresh metadata and carry on. With min.insync.replicas=2, writes with acks=all keep working because each partition still has two in-sync replicas.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:14s infinite linear}
    @keyframes p0{0%,33%{opacity:1}34%{opacity:0}100%{opacity:0}}
    .p0{animation-name:p0}
    @keyframes p1{0%{opacity:0}33%{opacity:0}34%,60%{opacity:1}61%{opacity:0}100%{opacity:0}}
    .p1{animation-name:p1}
    @keyframes p2{0%{opacity:0}60%{opacity:0}61%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p2{animation-name:p2}
    @keyframes p12{0%{opacity:0}33%{opacity:0}34%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p12{animation-name:p12}
    @keyframes p01{0%,60%{opacity:1}61%{opacity:0}100%{opacity:0}}
    .p01{animation-name:p01}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .p0,.p1,.p01{opacity:0!important}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">Leadership is spread, and moves when a broker dies</text>
  <text class="sub" x="28" y="62">orders topic: 3 partitions, replication.factor=3. The controller decides who leads.</text>
  <rect class="box" x="28" y="84" width="240" height="196" rx="12" stroke-width="1.5"/>
  <text class="h2" x="44" y="110">Broker 1</text>
  <rect class="pri" x="44" y="126" width="208" height="36" rx="8"/>
  <text class="on" x="148" y="148.5" text-anchor="middle">P0  leader</text>
  <rect class="bp" x="44" y="174" width="208" height="36" rx="8" stroke-width="1.5"/>
  <text class="tx" x="148" y="197" text-anchor="middle">P1  follower</text>
  <rect class="bp" x="44" y="222" width="208" height="36" rx="8" stroke-width="1.5"/>
  <text class="tx" x="148" y="245" text-anchor="middle">P2  follower</text>
  <rect class="box" x="280" y="84" width="240" height="196" rx="12" stroke-width="1.5"/>
  <text class="h2" x="296" y="110">Broker 2</text>
  <rect class="bp" x="296" y="126" width="208" height="36" rx="8" stroke-width="1.5"/>
  <text class="tx" x="400" y="149" text-anchor="middle">P0  follower</text>
  <rect class="pri" x="296" y="174" width="208" height="36" rx="8"/>
  <text class="on" x="400" y="196.5" text-anchor="middle">P1  leader</text>
  <rect class="bp" x="296" y="222" width="208" height="36" rx="8" stroke-width="1.5"/>
  <text class="tx" x="400" y="245" text-anchor="middle">P2  follower</text>
  <rect class="box" x="532" y="84" width="240" height="196" rx="12" stroke-width="1.5"/>
  <text class="h2" x="548" y="110">Broker 3</text>
  <rect class="bp" x="548" y="126" width="208" height="36" rx="8" stroke-width="1.5"/>
  <text class="tx" x="652" y="149" text-anchor="middle">P0  follower</text>
  <g class="a p01">
  <rect class="bp" x="548" y="174" width="208" height="36" rx="8" stroke-width="1.5"/>
  <text class="tx" x="652" y="197" text-anchor="middle">P1  follower</text>
  </g>
  <g class="a p2">
  <rect class="tea" x="548" y="174" width="208" height="36" rx="8"/>
  <text class="on" x="652" y="196.5" text-anchor="middle">P1  leader (new)</text>
  </g>
  <rect class="pri" x="548" y="222" width="208" height="36" rx="8"/>
  <text class="on" x="652" y="244.5" text-anchor="middle">P2  leader</text>
  <g class="a p12">
  <rect class="bb" x="280" y="84" width="240" height="196" rx="12" stroke-width="2"/>
  <text class="h2 badt" x="400" y="170" text-anchor="middle">Broker 2 DOWN</text>
  <text class="sub" x="400" y="192" text-anchor="middle">no heartbeats → fenced</text>
  </g>
  <rect class="bm" x="28" y="296" width="744" height="40" rx="10" stroke-width="1.5"/>
  <text class="lbl" x="44" y="321">Controller:</text>
  <text class="tx a p0" x="140" y="321">metadata: P0→B1, P1→B2, P2→B3</text>
  <text class="tx badt a p1" x="140" y="321">B2 missed heartbeats for broker.session.timeout.ms → fence it</text>
  <text class="tx teat a p2" x="140" y="321">elect B3 (in ISR) as P1 leader, bump leader epoch</text>
  <text class="lbl" x="28" y="364">ISR</text>
  <text class="tx a p0" x="70" y="364">P0 {1,2,3}   P1 {2,1,3}   P2 {3,1,2}</text>
  <text class="tx a p1" x="70" y="364">P0 {1,3}   P1 {1,3}, leader gone   P2 {3,1}</text>
  <text class="tx a p2" x="70" y="364">P0 {1,3}   P1 {3,1}   P2 {3,1}: 2 in sync, min.insync.replicas=2 still met</text>
  <text class="lbl a p0" x="28" y="396">1  Normal: each broker leads one partition, so load is balanced</text>
  <text class="lbl badt a p1" x="28" y="396">2  Broker 2 dies: P1 has no leader for a few seconds</text>
  <text class="lbl okt a p2" x="28" y="396">3  Failover done: clients refresh metadata and send P1 traffic to B3</text>
  <text class="sub" x="28" y="418">Only ISR members are eligible, so no committed record is lost (unclean election stays off).</text>
</svg>
