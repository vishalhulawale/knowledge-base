<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">BYOK import, step by step</title>
  <desc id="d">Importing customer key material into a cloud KMS. The key manager creates a KMS key with origin EXTERNAL and asks for import parameters; KMS returns a 3072-bit RSA wrapping public key and an import token valid for 24 hours. The customer HSM generates or exports 32 bytes of key material wrapped with RSA-OAEP SHA-256 under that public key, producing a 384-byte blob. The key manager sends the blob and token with ImportKeyMaterial, and KMS unwraps it inside its HSMs. The plaintext key exists only inside the two HSM boundaries.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:16s infinite linear}
    @keyframes s0{0%{opacity:0}1%{opacity:0}2%,15%{opacity:1}16%{opacity:0}100%{opacity:0}}
    .s0{animation-name:s0}
    @keyframes s1{0%{opacity:0}15%{opacity:0}16%,29%{opacity:1}30%{opacity:0}100%{opacity:0}}
    .s1{animation-name:s1}
    @keyframes s2{0%{opacity:0}31%{opacity:0}32%,45%{opacity:1}46%{opacity:0}100%{opacity:0}}
    .s2{animation-name:s2}
    @keyframes s3{0%{opacity:0}45%{opacity:0}46%,59%{opacity:1}60%{opacity:0}100%{opacity:0}}
    .s3{animation-name:s3}
    @keyframes s4{0%{opacity:0}61%{opacity:0}62%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .s4{animation-name:s4}
    @keyframes blob{0%{opacity:0}45%{opacity:0}46%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .blob{animation-name:blob}
    @keyframes ok{0%{opacity:0}75%{opacity:0}76%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .ok{animation-name:ok}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .s0,.s1,.s2,.s3{opacity:0!important}
    }
  </style>
  <defs><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">Getting 32 bytes into the cloud without exposing them</text>
  <text class="sub" x="28" y="62">Reproduced on the page with OpenSSL, following the AWS manual import steps.</text>
  <rect class="bp" x="28" y="110" width="180" height="56" rx="10" stroke-width="1.5"/>
  <text class="tx" x="118" y="135" text-anchor="middle" font-weight="700">Customer HSM</text>
  <text class="sm" x="118" y="152" text-anchor="middle">Luna / SafeNet</text>
  <rect class="box" x="310" y="110" width="180" height="56" rx="10" stroke-width="1.5"/>
  <text class="tx" x="400" y="135" text-anchor="middle" font-weight="700">Key manager</text>
  <text class="sm" x="400" y="152" text-anchor="middle">e.g. CipherTrust</text>
  <rect class="bt" x="592" y="110" width="180" height="56" rx="10" stroke-width="1.5"/>
  <text class="tx" x="682" y="143" text-anchor="middle" font-weight="700">Cloud KMS HSMs</text>
  <line class="lnp a s0" x1="490" y1="150" x2="588" y2="150" marker-end="url(#arp)"/>
  <text class="lbl a s0" x="28" y="250">1  CreateKey(Origin=EXTERNAL), GetParametersForImport</text>
  <line class="lnp a s1" x1="588" y1="160" x2="492" y2="160" marker-end="url(#arp)"/>
  <text class="lbl a s1" x="28" y="250">2  ← RSA-3072 wrapping public key + import token (24 h)</text>
  <line class="lnw a s2" x1="306" y1="150" x2="210" y2="150" marker-end="url(#arw)"/>
  <text class="lbl a s2" x="28" y="250">3  wrap 32-byte key: RSA-OAEP-SHA-256 → 384-byte blob</text>
  <line class="lnp a s3" x1="210" y1="160" x2="306" y2="160" marker-end="url(#arp)"/>
  <text class="lbl a s3" x="28" y="250">4  ← EncryptedKeyMaterial.bin</text>
  <line class="lnp a s4" x1="490" y1="150" x2="588" y2="150" marker-end="url(#arp)"/>
  <text class="lbl a s4" x="28" y="250">5  ImportKeyMaterial(blob, token): unwrapped inside KMS</text>
  <g class="a blob">
  <rect class="wrnf" x="310" y="186" width="180" height="30" rx="6"/>
  <text class="on13" x="400" y="205.5" text-anchor="middle">384-byte wrapped blob</text>
  </g>
  <g class="a ok">
  <rect class="okf" x="592" y="186" width="180" height="30" rx="6"/>
  <text class="on13" x="682" y="205.5" text-anchor="middle">key usable ✓</text>
  </g>
  <text class="tx" x="28" y="296">Plaintext key material exists only inside HSM boundaries; the network sees only the wrapped blob.</text>
  <text class="sub" x="28" y="322">You keep the authoritative copy and can delete the cloud copy (DeleteImportedKeyMaterial) at any time.</text>
  <text class="sub" x="28" y="342">Imported keys don&#x27;t auto-rotate: rotate by creating a new key and moving the alias.</text>
</svg>
