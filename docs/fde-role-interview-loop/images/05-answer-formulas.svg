<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Why FDE and why this company</title>
  <desc id="d">Two answer formulas shown as four chips each. Why FDE: past pull (for example owning the five-upstream integration layer), forward pull (own outcomes and shape a product), costs understood (travel, ambiguity, context switching) and one story (STAR with numbers and a result). Why this company: product surface (for example agents, MCP, evals tooling), the customers' problem (for example pilots stuck at security review), my evidence (OAuth2, PingFederate and Active Directory in healthcare) and dated research (a launch or posting from this quarter). If the answer would work for any company it is too generic.</desc>
