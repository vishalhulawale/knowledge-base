<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Publishing an immutable snapshot through a volatile field</title>
  <desc id="d">Animation. A cache bean has a volatile field called snapshot that points to an immutable map, version 1. Request 1 reads version 1. A refresh job builds a complete version 2 map off to the side while readers keep using version 1. Then a single volatile write swaps the field to version 2. A new request, Request 2, reads version 2, while Request 1 keeps its consistent version 1. When no request holds version 1 any more it becomes unreachable and is garbage collected.</desc>
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkm" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:19px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .t{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bean{fill:#ffffff;stroke:#4f46e5;stroke-width:2}
    .fld{fill:#eef2ff;stroke:#4f46e5}
    .map{fill:#e0f2f1;stroke:#0ea5a4;stroke-width:2}
    .draft{fill:none;stroke:#0ea5a4;stroke-width:2;stroke-dasharray:6 5}
    .ptr{stroke:#4f46e5;stroke-width:3;fill:none}
    .rd{stroke:#64748b;stroke-width:2;fill:none}
    .mkp{fill:#4f46e5}.mkm{fill:#64748b}
    .tt{fill:#0f766e;font-size:13px;font-weight:600}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.t{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}.bean{fill:#111827;stroke:#818cf8}.fld{fill:#262b47;stroke:#818cf8}
      .map{fill:#123b3b;stroke:#2dd4bf}.draft{stroke:#2dd4bf}
      .ptr{stroke:#818cf8}.mkp{fill:#818cf8}.rd{stroke:#94a3b8}.mkm{fill:#94a3b8}.tt{fill:#5eead4}
    }
    /* 10 s loop: build v2 15-40%, swap at 45%, request 2 at 55%, v1 released at 75% */
    .x{animation:10s infinite linear}
    .draftA{opacity:0;animation-name:dr}.v2{opacity:0;animation-name:v2}
    .pv1{animation-name:p1}.pv2{opacity:0;animation-name:p2}
    .r2{opacity:0;animation-name:r2}.r1{animation-name:r1}.v1{animation-name:g1}
    @keyframes dr{0%,14%{opacity:0}16%,39%{opacity:1}41%,100%{opacity:0}}
    @keyframes v2{0%,39%{opacity:0}41%,95%{opacity:1}98%,100%{opacity:0}}
    @keyframes p1{0%,44%{opacity:1}46%,97%{opacity:0}99%,100%{opacity:1}}
    @keyframes p2{0%,44%{opacity:0}46%,95%{opacity:1}97%,100%{opacity:0}}
    @keyframes r2{0%,54%{opacity:0}56%,95%{opacity:1}97%,100%{opacity:0}}
    @keyframes r1{0%,74%{opacity:1}76%,97%{opacity:0}99%,100%{opacity:1}}
    @keyframes g1{0%,74%{opacity:1}76%,96%{opacity:.3}99%,100%{opacity:1}}
    .c{opacity:0}
    .c1{animation-name:k1}.c2{animation-name:k2}.c3{animation-name:k3}.c4{animation-name:k4}
    @keyframes k1{0%,13%{opacity:1}15%,98%{opacity:0}100%{opacity:1}}
    @keyframes k2{0%,14%{opacity:0}16%,43%{opacity:1}45%,100%{opacity:0}}
    @keyframes k3{0%,44%{opacity:0}46%,73%{opacity:1}75%,100%{opacity:0}}
    @keyframes k4{0%,74%{opacity:0}76%,96%{opacity:1}98%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){
      .x{animation:none}.draftA,.pv1,.c{opacity:0}.v2,.pv2,.r2,.r1,.v1,.c3{opacity:1}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Immutable snapshot + one volatile write</text>
  <text class="sub" x="28" y="62">The map is never changed in place. The reference is replaced in a single write.</text>

  <!-- bean with the volatile field -->
  <rect class="bean" x="40" y="146" width="210" height="96" rx="12"/>
  <text class="lbl" x="56" y="172">DrugReferenceCache</text>
  <rect class="fld" x="56" y="186" width="178" height="38" rx="8"/>
  <text class="t" x="68" y="210">volatile snapshot</text>

  <!-- map v1 -->
  <g class="x v1">
    <rect class="map" x="380" y="92" width="190" height="84" rx="12"/>
    <text class="lbl" x="475" y="124" text-anchor="middle">Map v1</text>
    <text class="sub" x="475" y="146" text-anchor="middle">immutable</text>
    <text class="sub" x="475" y="164" text-anchor="middle">(Map.copyOf)</text>
  </g>
  <!-- map v2: draft outline, then complete -->
  <g class="x draftA">
    <rect class="draft" x="380" y="222" width="190" height="84" rx="12"/>
    <text class="tt" x="475" y="258" text-anchor="middle">building v2</text>
    <text class="sub" x="475" y="278" text-anchor="middle">off to the side</text>
  </g>
  <g class="x v2">
    <rect class="map" x="380" y="222" width="190" height="84" rx="12"/>
    <text class="lbl" x="475" y="254" text-anchor="middle">Map v2</text>
    <text class="sub" x="475" y="276" text-anchor="middle">immutable</text>
    <text class="sub" x="475" y="294" text-anchor="middle">(Map.copyOf)</text>
  </g>

  <!-- the volatile reference -->
  <path class="ptr x pv1" d="M236,205 C300,205 320,134 374,134" marker-end="url(#ap)"/>
  <path class="ptr x pv2" d="M236,205 C300,205 320,264 374,264" marker-end="url(#ap)"/>

  <!-- readers -->
  <g class="x r1">
    <rect class="box" x="630" y="112" width="140" height="44" rx="10"/>
    <text class="t" x="700" y="139" text-anchor="middle">Request 1</text>
    <path class="rd" d="M626,134 L576,134" marker-end="url(#am)"/>
  </g>
  <g class="x r2">
    <rect class="box" x="630" y="242" width="140" height="44" rx="10"/>
    <text class="t" x="700" y="269" text-anchor="middle">Request 2</text>
    <path class="rd" d="M626,264 L576,264" marker-end="url(#am)"/>
  </g>

  <!-- captions -->
  <g class="t">
    <text class="x c c1" x="28" y="346">Readers do one volatile read of snapshot, then use plain immutable data. No locks.</text>
    <text class="x c c2" x="28" y="346">refresh() builds a complete new map off to the side. Readers still use v1.</text>
    <g class="x c c3"><text x="28" y="346">snapshot = Map.copyOf(fresh): one volatile write swaps the reference.</text><text x="28" y="366">New reads see v2. Request 1 keeps a complete, consistent v1.</text></g>
    <text class="x c c4" x="28" y="346">Once no request holds v1, it is unreachable and the garbage collector frees it.</text>
  </g>
</svg>
