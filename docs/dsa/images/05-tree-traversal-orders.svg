  <circle class="box" cx="80" cy="215" r="18"/>
  <text class="lb" x="80" y="220" text-anchor="middle">2</text>
  <circle class="box" cx="200" cy="215" r="18"/>
  <text class="lb" x="200" y="220" text-anchor="middle">6</text>
  <circle class="box" cx="50" cy="270" r="18"/>
  <text class="lb" x="50" y="275" text-anchor="middle">1</text>
  <circle class="box" cx="110" cy="270" r="18"/>
  <text class="lb" x="110" y="275" text-anchor="middle">3</text>
  <circle class="box" cx="170" cy="270" r="18"/>
  <text class="lb" x="170" y="275" text-anchor="middle">5</text>
  <circle class="box" cx="230" cy="270" r="18"/>
  <text class="lb" x="230" y="275" text-anchor="middle">7</text>
  <g class="a s0"><circle class="pri" cx="140" cy="160" r="18"/><text class="on" x="140" y="165" text-anchor="middle">4</text><circle class="warn" cx="157" cy="144" r="11"/><text class="on" x="157" y="148.5" text-anchor="middle" font-size="13">1</text><text class="tb" x="56" y="322" text-anchor="middle" font-size="17" font-weight="700">4</text></g>
  <g class="a s1"><circle class="pri" cx="80" cy="215" r="18"/><text class="on" x="80" y="220" text-anchor="middle">2</text><circle class="warn" cx="97" cy="199" r="11"/><text class="on" x="97" y="203.5" text-anchor="middle" font-size="13">2</text><text class="tb" x="84" y="322" text-anchor="middle" font-size="17" font-weight="700">2</text></g>
  <g class="a s2"><circle class="pri" cx="50" cy="270" r="18"/><text class="on" x="50" y="275" text-anchor="middle">1</text><circle class="warn" cx="67" cy="254" r="11"/><text class="on" x="67" y="258.5" text-anchor="middle" font-size="13">3</text><text class="tb" x="112" y="322" text-anchor="middle" font-size="17" font-weight="700">1</text></g>
  <g class="a s3"><circle class="pri" cx="110" cy="270" r="18"/><text class="on" x="110" y="275" text-anchor="middle">3</text><circle class="warn" cx="127" cy="254" r="11"/><text class="on" x="127" y="258.5" text-anchor="middle" font-size="13">4</text><text class="tb" x="140" y="322" text-anchor="middle" font-size="17" font-weight="700">3</text></g>
