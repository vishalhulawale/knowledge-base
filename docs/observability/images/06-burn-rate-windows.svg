<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Burn-rate alert windows</title>
  <desc id="d">Animation: an error-rate chart over 120 minutes for a 99.5 percent SLO, with the fast-burn threshold at 7.2 percent errors. Errors jump to 20 percent from minute 20 to 60. The 5-minute window average crosses the threshold almost at once; the 1-hour average crosses at about minute 42, when the page fires because both are above. After recovery the 5-minute average falls below the line at about minute 64 and the page resets, while the 1-hour average alone would have kept paging until about minute 99. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
