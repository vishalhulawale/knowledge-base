<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">IdP session and application sessions</title>
  <desc id="d">Four steps and the browser's cookies. Step 1: opening App 1 redirects to the IdP, which asks for password and MFA, then sets its own session cookie on sso.company.com, and App 1 creates its own session. Step 2: opening App 2 redirects to the IdP, the browser sends the IdP cookie, there is no prompt, and App 2 creates its own session. Step 3: logging out of App 1 only removes App 1's session; the IdP session stays. Step 4: clicking Login on App 1 again goes to the IdP, which still has a session, so the user is back in without a prompt.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:19px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:700}
    .t{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .slot{fill:none;stroke:#cbd5e1;stroke-dasharray:4 3}
    .num{fill:#4f46e5}.numt{fill:#fff;font-size:13px;font-weight:700}
    .cI{fill:#d97706}.cA{fill:#4f46e5}.cB{fill:#0ea5a4}
    .on{fill:#fff;font-size:13px;font-weight:700}
    .bad{fill:#dc2626;font-size:13px;font-weight:700}
    .warn{fill:#b45309;font-size:13px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.t{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}.slot{stroke:#475569}
      .num{fill:#818cf8}.numt,.on{fill:#0f172a}
      .cI{fill:#fbbf24}.cA{fill:#818cf8}.cB{fill:#2dd4bf}
      .bad{fill:#f87171}.warn{fill:#fbbf24}
    }
    /* 12 s loop */
    .a{opacity:0;animation:12s infinite linear}
    @keyframes st1{0%,3%{opacity:0}5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes st2{0%,28%{opacity:0}30%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes st3{0%,50%{opacity:0}52%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes st4{0%,68%{opacity:0}70%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes ckI{0%,11%{opacity:0}13%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes ckA{0%,11%{opacity:0}13%,56%{opacity:1}58%,75%{opacity:0}77%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes ckB{0%,35%{opacity:0}37%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes nt1{0%,57%{opacity:0}59%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes nt2{0%,77%{opacity:0}79%,92%{opacity:1}96%,100%{opacity:0}}
    .k1{animation-name:st1}.k2{animation-name:st2}.k3{animation-name:st3}.k4{animation-name:st4}
    .kI{animation-name:ckI}.kA{animation-name:ckA}.kB{animation-name:ckB}.n1{animation-name:nt1}.n2{animation-name:nt2}
    @media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="38">SSO is two layers of session</text>

  <!-- steps -->
  <g class="a k1">
    <circle class="num" cx="40" cy="86" r="12"/><text class="numt" x="40" y="91" text-anchor="middle">1</text>
    <text class="t" x="62" y="84">Open App 1: the IdP asks for</text>
    <text class="t" x="62" y="102">password and MFA</text>
  </g>
  <g class="a k2">
    <circle class="num" cx="40" cy="146" r="12"/><text class="numt" x="40" y="151" text-anchor="middle">2</text>
    <text class="t" x="62" y="144">Open App 2: IdP cookie is sent,</text>
    <text class="t" x="62" y="162">no prompt</text>
  </g>
  <g class="a k3">
    <circle class="num" cx="40" cy="206" r="12"/><text class="numt" x="40" y="211" text-anchor="middle">3</text>
    <text class="t" x="62" y="204">Log out of App 1 only</text>
    <text class="t" x="62" y="222">(local logout)</text>
  </g>
  <g class="a k4">
    <circle class="num" cx="40" cy="266" r="12"/><text class="numt" x="40" y="271" text-anchor="middle">4</text>
    <text class="t" x="62" y="264">Click Login on App 1: back in</text>
    <text class="t" x="62" y="282">at once, no prompt</text>
  </g>

  <!-- cookie jar -->
  <rect class="box" x="420" y="60" width="356" height="250" rx="10"/>
  <text class="lbl" x="436" y="86">Browser cookies</text>
  <text class="sub" x="436" y="122">IdP session</text>
  <rect class="slot" x="540" y="104" width="222" height="30" rx="7"/>
  <text class="sub" x="436" y="182">App 1 session</text>
  <rect class="slot" x="540" y="164" width="222" height="30" rx="7"/>
  <text class="sub" x="436" y="242">App 2 session</text>
  <rect class="slot" x="540" y="224" width="222" height="30" rx="7"/>
  <g class="a kI"><rect class="cI" x="540" y="104" width="222" height="30" rx="7"/><text class="on" x="651" y="124" text-anchor="middle">sso.company.com</text></g>
  <g class="a kA"><rect class="cA" x="540" y="164" width="222" height="30" rx="7"/><text class="on" x="651" y="184" text-anchor="middle">app1 JSESSIONID</text></g>
  <g class="a kB"><rect class="cB" x="540" y="224" width="222" height="30" rx="7"/><text class="on" x="651" y="244" text-anchor="middle">app2 JSESSIONID</text></g>
  <g class="a n1"><text class="warn" x="540" y="154">still there after step 3</text></g>
  <g class="a n2"><text class="bad" x="436" y="290">App 1 session recreated silently</text></g>

  <text class="sub" x="28" y="340">Ending the application session does not end the IdP session. To log out fully, also send</text>
  <text class="sub" x="28" y="358">the browser to the IdP (OIDC RP-initiated logout or SAML Single Logout).</text>
</svg>
