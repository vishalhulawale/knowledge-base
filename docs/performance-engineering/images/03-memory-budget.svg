<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Container memory budget</title>
  <desc id="d">Two stacked bars against a 2,048 MiB container limit. With MaxRAMPercentage 70 the heap is 1,434 MiB; adding metaspace 160, code cache 64, thread stacks for 200 threads up to 200, GC structures 80, direct buffers 64 and native malloc overhead 80 MiB gives 2,082 MiB, 34 MiB over the limit, so the kernel kills the pod with exit code 137 and no Java error. With MaxRAMPercentage 60 the heap is 1,229 MiB, the total is 1,877 MiB and 171 MiB of headroom remains. Values are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Budget the process, not just the heap</text><text class="sub" x="28" y="62">2 GiB container limit, 200 request threads. Illustrative MiB values; measure yours with NMT.</text><text class="lbl" x="28" y="92">MaxRAMPercentage=70: heap 1,434 + non-heap 648 = 2,082 MiB</text><rect class="pri" x="28" y="100" width="472.22" height="34" rx="2" fill-opacity="1.0"/><text class="on13" x="264.61" y="122" text-anchor="middle">heap 1,434</text><rect class="tea" x="501.22" y="100" width="51.8" height="34" rx="2" fill-opacity="1.0"/><rect class="tea" x="554.02" y="100" width="20.12" height="34" rx="2" fill-opacity="0.55"/><rect class="wrnf" x="575.14" y="100" width="65" height="34" rx="2" fill-opacity="1.0"/><rect class="wrnf" x="641.14" y="100" width="25.4" height="34" rx="2" fill-opacity="0.55"/><rect class="mutf" x="667.54" y="100" width="20.12" height="34" rx="2" fill-opacity="1.0"/><rect class="mutf" x="688.66" y="100" width="25.4" height="34" rx="2" fill-opacity="0.55"/><text class="badt" x="28" y="156" style="font-size:14px">34 MiB over the limit → kernel OOM kill, exit 137, no Java error</text><text class="lbl" x="28" y="188">MaxRAMPercentage=60: heap 1,229 + non-heap 648 = 1,877 MiB</text><rect class="pri" x="28" y="196" width="404.57" height="34" rx="2" fill-opacity="1.0"/><text class="on13" x="230.785" y="218" text-anchor="middle">heap 1,229</text><rect class="tea" x="433.57" y="196" width="51.8" height="34" rx="2" fill-opacity="1.0"/><rect class="tea" x="486.37" y="196" width="20.12" height="34" rx="2" fill-opacity="0.55"/><rect class="wrnf" x="507.49" y="196" width="65" height="34" rx="2" fill-opacity="1.0"/><rect class="wrnf" x="573.49" y="196" width="25.4" height="34" rx="2" fill-opacity="0.55"/><rect class="mutf" x="599.89" y="196" width="20.12" height="34" rx="2" fill-opacity="1.0"/><rect class="mutf" x="621.01" y="196" width="25.4" height="34" rx="2" fill-opacity="0.55"/><text class="okt" x="28" y="252" style="font-size:14px">171 MiB headroom (8%) → fits</text><line class="lnb" x1="703.84" y1="78" x2="703.84" y2="252" style="stroke-width:3"/><text class="badt" x="709.84" y="84" style="font-size:13px">limit 2,048</text><rect class="bm" x="28" y="272" width="744" height="104" rx="10"/><rect class="tea" x="44" y="285" width="16" height="16" rx="3" fill-opacity="1.0"/><text class="sm" x="68" y="298">metaspace 160</text><rect class="tea" x="288" y="285" width="16" height="16" rx="3" fill-opacity="0.55"/><text class="sm" x="312" y="298">code cache 64</text><rect class="wrnf" x="532" y="285" width="16" height="16" rx="3" fill-opacity="1.0"/><text class="sm" x="556" y="298">thread stacks 200</text><rect class="wrnf" x="44" y="315" width="16" height="16" rx="3" fill-opacity="0.55"/><text class="sm" x="68" y="328">GC structures 80</text><rect class="mutf" x="288" y="315" width="16" height="16" rx="3" fill-opacity="1.0"/><text class="sm" x="312" y="328">direct buffers 64</text><rect class="mutf" x="532" y="315" width="16" height="16" rx="3" fill-opacity="0.55"/><text class="sm" x="556" y="328">native, malloc 80</text><text class="sub" x="44" y="364">Thread stacks: up to 1 MiB each (200 threads). Code cache and metaspace grow with classes and JIT.</text>
</svg>
