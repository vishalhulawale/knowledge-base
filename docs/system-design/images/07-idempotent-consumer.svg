<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">At-least-once delivery with an idempotent consumer</title>
  <desc id="d">A queue delivers event 42 to the inventory consumer. The consumer reserves stock and records event 42 in the processed_event table in the same database transaction, then crashes before it acknowledges. The broker redelivers event 42. This time the consumer finds event 42 already recorded, skips the business change and acknowledges, so stock is reserved once, not twice.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:14px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
    .ln{stroke:#cbd5e1;stroke-width:2}
    .msg{fill:#4f46e5}
    .msgt{fill:#fff;font-size:12px;font-weight:700}
    .txd{fill:#0ea5a4}
    .ack{fill:#16a34a}
    .x{stroke:#dc2626;stroke-width:5;stroke-linecap:round}
    .val{fill:#0f172a;font-size:16px;font-weight:700}
    .row{fill:#0f766e;font-size:14px;font-weight:700}
    .step{fill:#0f172a;font-size:15px;font-weight:700}
    .bad{fill:#dc2626;font-size:14px;font-weight:700}
    .good{fill:#16a34a;font-size:14px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.val,.step{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}.ln{stroke:#475569}
      .msg{fill:#818cf8}.msgt{fill:#0f172a}.txd{fill:#2dd4bf}.ack{fill:#4ade80}
      .x{stroke:#f87171}.row{fill:#5eead4}.bad{fill:#f87171}.good{fill:#4ade80}
    }
    /* 12 s loop: deliver 0-12%, transaction 15-25%, crash 32%, redeliver 48-58%, check 62-70%, ack 72-80%, hold to 95% */
    .a{animation:12s infinite ease-in-out}
    .f{animation:12s infinite linear}
    @keyframes m1{0%,2%{transform:translate(0,0);opacity:1}12%{transform:translate(122px,0);opacity:1}14%,100%{transform:translate(122px,0);opacity:0}}
    @keyframes m2{0%,46%{transform:translate(0,0);opacity:0}48%{transform:translate(0,0);opacity:1}58%{transform:translate(122px,0);opacity:1}60%,100%{transform:translate(122px,0);opacity:0}}
    @keyframes tx{0%,14%{transform:translate(0,0);opacity:0}15%{transform:translate(0,0);opacity:1}25%{transform:translate(90px,0);opacity:1}27%,100%{transform:translate(90px,0);opacity:0}}
    @keyframes ck{0%,61%{transform:translate(0,0);opacity:0}62%{transform:translate(0,0);opacity:1}69%{transform:translate(90px,0);opacity:1}70%,100%{transform:translate(90px,0);opacity:0}}
    @keyframes ak{0%,71%{transform:translate(0,0);opacity:0}72%{transform:translate(0,0);opacity:1}80%{transform:translate(-122px,0);opacity:1}82%,100%{transform:translate(-122px,0);opacity:0}}
    @keyframes old{0%,24%{opacity:1}25%,97%{opacity:0}98%,100%{opacity:1}}
    @keyframes new{0%,24%{opacity:0}25%,95%{opacity:1}98%,100%{opacity:0}}
    @keyframes crash{0%,30%{opacity:0}32%,46%{opacity:1}48%,100%{opacity:0}}
    @keyframes s1{0%,13%{opacity:1}14%,97%{opacity:0}98%,100%{opacity:1}}
    @keyframes s2{0%,13%{opacity:0}14%,29%{opacity:1}30%,100%{opacity:0}}
    @keyframes s3{0%,29%{opacity:0}30%,46%{opacity:1}47%,100%{opacity:0}}
    @keyframes s4{0%,46%{opacity:0}47%,60%{opacity:1}61%,100%{opacity:0}}
    @keyframes s5{0%,60%{opacity:0}61%,95%{opacity:1}97%,100%{opacity:0}}
    @keyframes fin{0%,80%{opacity:0}82%,95%{opacity:1}97%,100%{opacity:0}}
    .m1{animation-name:m1}.m2{animation-name:m2}.tx{animation-name:tx}.ck{animation-name:ck}.ak{animation-name:ak}
    .old{animation-name:old}.new{animation-name:new}.crash{animation-name:crash}
    .s1{animation-name:s1}.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}.s5{animation-name:s5}.fin{animation-name:fin}
    @media (prefers-reduced-motion: reduce){
      .a,.f{animation:none}
      .m1,.m2,.tx,.ck,.ak,.old,.crash,.s1,.s2,.s3,.s4{opacity:0}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">At-least-once delivery + idempotent consumer</text>
  <text class="sub" x="28" y="62">The crash happens after the commit but before the ack, so the broker sends event 42 again.</text>

  <line class="ln" x1="178" y1="185" x2="300" y2="185"/>
  <line class="ln" x1="470" y1="185" x2="560" y2="185"/>

  <rect class="box" x="28" y="150" width="150" height="70" rx="10"/>
  <text class="lbl" x="103" y="181" text-anchor="middle">Queue / topic</text>
  <text class="sub" x="103" y="200" text-anchor="middle">event 42</text>

  <rect class="box" x="300" y="150" width="170" height="70" rx="10"/>
  <text class="lbl" x="385" y="181" text-anchor="middle">Inventory</text>
  <text class="lbl" x="385" y="199" text-anchor="middle">consumer</text>
  <g class="f crash"><line class="x" x1="365" y1="160" x2="405" y2="210"/><line class="x" x1="405" y1="160" x2="365" y2="210"/></g>

  <rect class="box" x="560" y="96" width="212" height="178" rx="12"/>
  <text class="lbl" x="576" y="122">Database</text>
  <text class="sub" x="576" y="150">stock reserved for order</text>
  <text class="val f old" x="576" y="174">0</text>
  <text class="val f new" x="576" y="174">1</text>
  <text class="sub" x="576" y="208">processed_event</text>
  <text class="sub f old" x="576" y="232">(empty)</text>
  <text class="row f new" x="576" y="232">inventory · 42</text>
  <text class="good f fin" x="576" y="260">still 1 reservation</text>

  <!-- moving things -->
  <g class="a m1"><circle class="msg" cx="178" cy="185" r="13"/><text class="msgt" x="178" y="189" text-anchor="middle">42</text></g>
  <g class="a m2"><circle class="msg" cx="178" cy="185" r="13"/><text class="msgt" x="178" y="189" text-anchor="middle">42</text></g>
  <circle class="txd a tx" cx="470" cy="185" r="8"/>
  <circle class="txd a ck" cx="470" cy="185" r="8"/>
  <circle class="ack a ak" cx="300" cy="185" r="8"/>

  <!-- step captions -->
  <text class="step f s1" x="28" y="318">1. Broker delivers event 42</text>
  <text class="step f s2" x="28" y="318">2. One transaction: reserve stock + insert (inventory, 42)</text>
  <text class="bad f s3" x="28" y="318">3. Consumer crashes before the ack / offset commit</text>
  <text class="step f s4" x="28" y="318">4. Broker redelivers event 42 (at-least-once)</text>
  <text class="step f s5" x="28" y="318">5. (inventory, 42) already exists → skip the change, then ack</text>
  <text class="sub" x="28" y="372">Without the dedup row, step 4 would reserve the stock a second time.</text>
</svg>
