  <path class="line" d="M485 150 V196" stroke-dasharray="4 4"/>
  <text class="sub" x="496" y="178">WAL stream (replay_lag)</text>
  <g class="a mk"><text class="teat" x="402" y="94" font-size="14" font-weight="700">your write, acknowledged</text></g>
  <g class="a rd">
    <rect class="badbg" x="458" y="200" width="54" height="48" rx="8" stroke-width="3"/>
    <text class="badt" x="150" y="290" font-size="14" font-weight="700">SELECT on the standby right after the commit: row not found</text>
  </g>
  <g class="a ok">
    <rect class="okbg" x="458" y="200" width="54" height="48" rx="8" stroke-width="3"/>
    <text class="okt" x="150" y="290" font-size="14" font-weight="700">Replayed: the same SELECT now finds it</text>
  </g>
  <text class="t" x="150" y="318">Route read-your-writes to the primary, or wait until the replica passes the write's LSN.</text>
  <text class="sub" x="28" y="356">Measured on a local streaming replica: 198 of 200 immediate reads missed;</text>
  <text class="sub" x="28" y="376">a bulk insert of 400,000 wide rows put it 30 MB / 360 ms behind. Lag here is drawn as two records.</text>
