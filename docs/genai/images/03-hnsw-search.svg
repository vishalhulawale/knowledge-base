  <g class="a s0"><circle class="pri" cx="80" cy="125" r="9"/><text class="prit" x="80" y="111" text-anchor="middle" font-size="12">entry point</text></g>
  <g class="a s1"><line class="lnp" x1="80" y1="125" x2="300" y2="122" marker-end="url(#arp)"/><circle class="pri" cx="300" cy="122" r="7"/></g>
  <g class="a s2"><line class="lnp" x1="300" y1="122" x2="520" y2="128" marker-end="url(#arp)"/><circle class="pri" cx="520" cy="128" r="7"/></g>
