<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Unpartitioned vs partitioned third-party cookies</title>
  <desc id="d">Two rows show the same tracker iframe from tracker.example embedded first on site-a.example and then on site-b.example. In the top row, without partitioning, the cookie jar is keyed only by tracker.example: the iframe on site A writes id=42, and the iframe on site B reads id=42 back from the same jar, so the tracker links both visits to one person. In the bottom row the cookie is set with the Partitioned attribute (CHIPS), so the jar is keyed by the top-level site plus tracker.example: site A's jar holds id=42, while on site B the iframe finds an empty jar and gets a new id=77, so the visits cannot be linked. Steps appear one after another. Simplified: IDs are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:12px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .okt{fill:#16a34a;font-weight:700}.badt{fill:#dc2626;font-weight:700}.prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}.lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .okt{fill:#4ade80}.badt{fill:#f87171}.prit{fill:#818cf8}.teat{fill:#5eead4}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .a{opacity:0;animation:14s infinite linear}
    @keyframes s0{0%,4%{opacity:0}6%,90%{opacity:1}94%,100%{opacity:0}}
    .s0{animation-name:s0}
    @keyframes s1{0%,16%{opacity:0}18%,90%{opacity:1}94%,100%{opacity:0}}
    .s1{animation-name:s1}
    @keyframes s2{0%,28%{opacity:0}30%,90%{opacity:1}94%,100%{opacity:0}}
    .s2{animation-name:s2}
    @keyframes s3{0%,40%{opacity:0}42%,90%{opacity:1}94%,100%{opacity:0}}
    .s3{animation-name:s3}
    @keyframes s4{0%,52%{opacity:0}54%,90%{opacity:1}94%,100%{opacity:0}}
    .s4{animation-name:s4}
    @media (prefers-reduced-motion: reduce){ .a{animation:none;opacity:1} }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="478" rx="14"/>
  <text class="h" x="28" y="40" text-anchor="start">Same iframe, two top-level sites</text>
  <text class="sub" x="28" y="62" text-anchor="start">The cookie jar's key decides whether site A and site B see the same ID.</text>
  <rect class="box" x="16" y="80" width="768" height="182" rx="12" stroke-width="1"/>
  <text class="h2" x="32" y="104" text-anchor="start">Without partitioning: key = tracker.example</text>
  <rect class="box" x="30" y="120" width="190" height="104" rx="10" stroke-width="1.2"/><text class="h2" x="125" y="142" text-anchor="middle">site-a.example</text><rect class="bp" x="45" y="160" width="160" height="48" rx="8" stroke-width="1.2"/><text class="sm" x="125" y="180" text-anchor="middle">iframe</text><text class="prit" x="125" y="197" text-anchor="middle" font-size="13">tracker.example</text>
  <rect class="box" x="580" y="120" width="190" height="104" rx="10" stroke-width="1.2"/><text class="h2" x="675" y="142" text-anchor="middle">site-b.example</text><rect class="bp" x="595" y="160" width="160" height="48" rx="8" stroke-width="1.2"/><text class="sm" x="675" y="180" text-anchor="middle">iframe</text><text class="prit" x="675" y="197" text-anchor="middle" font-size="13">tracker.example</text>
  <rect class="bw" x="320" y="120" width="160" height="104" rx="14" stroke-width="1.5"/><text class="sm" x="400.0" y="140" text-anchor="middle">cookie jar</text><text class="wrnt" x="400.0" y="158" text-anchor="middle" font-size="12">key: tracker.example</text>
  <g class="a s0"><text class="sm" x="270" y="174" text-anchor="middle">write</text><line class="lnp" x1="205" y1="184" x2="316" y2="184" marker-end="url(#arp)"/></g>
  <g class="a s1"><text class="badt" x="400" y="200" text-anchor="middle" font-size="16">id=42</text></g>
  <g class="a s2"><text class="sm" x="530" y="174" text-anchor="middle">read</text><line class="lnb" x1="484" y1="184" x2="593" y2="184" marker-end="url(#arb)"/></g>
  <g class="a s3"><text class="badt" x="400" y="250" text-anchor="middle" font-size="14">Same id=42 on both sites: the tracker links the visits</text></g>
  <rect class="box" x="16" y="276" width="768" height="190" rx="12" stroke-width="1"/>
  <text class="h2" x="32" y="300" text-anchor="start">Partitioned (CHIPS): key = top-level site + tracker.example</text>
  <rect class="box" x="30" y="316" width="190" height="104" rx="10" stroke-width="1.2"/><text class="h2" x="125" y="338" text-anchor="middle">site-a.example</text><rect class="bp" x="45" y="356" width="160" height="48" rx="8" stroke-width="1.2"/><text class="sm" x="125" y="376" text-anchor="middle">iframe</text><text class="prit" x="125" y="393" text-anchor="middle" font-size="13">tracker.example</text>
  <rect class="box" x="580" y="316" width="190" height="104" rx="10" stroke-width="1.2"/><text class="h2" x="675" y="338" text-anchor="middle">site-b.example</text><rect class="bp" x="595" y="356" width="160" height="48" rx="8" stroke-width="1.2"/><text class="sm" x="675" y="376" text-anchor="middle">iframe</text><text class="prit" x="675" y="393" text-anchor="middle" font-size="13">tracker.example</text>
  <rect class="bw" x="262" y="316" width="134" height="104" rx="14" stroke-width="1.5"/><text class="sm" x="329.0" y="336" text-anchor="middle">cookie jar</text><text class="wrnt" x="329.0" y="354" text-anchor="middle" font-size="12">site-a.example</text><text class="wrnt" x="329.0" y="369" text-anchor="middle" font-size="12">+ tracker.example</text>
  <rect class="bw" x="404" y="316" width="134" height="104" rx="14" stroke-width="1.5"/><text class="sm" x="471.0" y="336" text-anchor="middle">cookie jar</text><text class="wrnt" x="471.0" y="354" text-anchor="middle" font-size="12">site-b.example</text><text class="wrnt" x="471.0" y="369" text-anchor="middle" font-size="12">+ tracker.example</text>
  <g class="a s0"><text class="sm" x="234" y="370" text-anchor="middle">write</text><line class="lnp" x1="205" y1="380" x2="258" y2="380" marker-end="url(#arp)"/></g>
  <g class="a s1"><text class="okt" x="329" y="402" text-anchor="middle" font-size="16">id=42</text></g>
  <g class="a s2"><text class="sm" x="567" y="370" text-anchor="middle">read</text><line class="lno" x1="593" y1="380" x2="542" y2="380" marker-end="url(#aro)"/></g>
  <g class="a s2"><text class="sub" x="471" y="402" text-anchor="middle">(empty)</text></g>
  <g class="a s3"><rect class="bw" x="420" y="388" width="102" height="22" rx="4" stroke-width="0"/><text class="okt" x="471" y="404" text-anchor="middle" font-size="16">id=77</text></g>
  <g class="a s4"><text class="okt" x="400" y="452" text-anchor="middle" font-size="14">Different IDs per top-level site: visits cannot be linked</text></g>
</svg>
