    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="430" rx="14"/>
  <text class="h" x="28" y="40">Anatomy of a one-to-two-page scope brief</text><text class="sub" x="28" y="62">Signed by the sponsor before building. Not the SOW: the thing you point at when scope drifts.</text><rect class="box" x="28" y="80" width="300" height="330" rx="8" stroke-width="1.5"/><text class="sm" x="44" y="104" font-weight="700">Scope brief · v1.2 · signed</text><text class="sm" x="44" y="132">1  Problem</text><text class="sm" x="44" y="157">2  Users &amp; stakeholders</text><rect class="pri" x="36" y="165" width="284" height="24" rx="5" opacity="0.18"/><text class="sm" x="44" y="182" font-weight="700">3  Outcome &amp; success criteria</text><text class="sm" x="44" y="207">4  Guardrails</text><text class="sm" x="44" y="232">5  In scope (ranked)</text><rect class="wrnf" x="36" y="240" width="284" height="24" rx="5" opacity="0.18"/><text class="sm" x="44" y="257" font-weight="700">6  Out of scope (this phase)</text><rect class="tea" x="36" y="265" width="284" height="24" rx="5" opacity="0.18"/><text class="sm" x="44" y="282" font-weight="700">7  Assumptions</text><text class="sm" x="44" y="307">8  Constraints</text><text class="sm" x="44" y="332">9  Risks &amp; dependencies</text><text class="sm" x="44" y="357">10 Plan &amp; decision date</text><text class="sm" x="44" y="382">11 Change process</text><rect class="bp" x="392" y="96" width="380" height="84" rx="8" stroke-width="1.5"/><text class="prit" x="406" y="118" style="font-size:14px">Success criterion</text><text class="sm" x="406" y="138">Incomplete-request chasing ~50 → ≤25</text><text class="sm" x="406" y="156">staff-hours/day, pilot team, by week 8,</text><text class="sm" x="406" y="174">from case-system timestamps</text><line class="lnp" x1="322" y1="177" x2="388" y2="116" marker-end="url(#arp)"/><rect class="bw" x="392" y="206" width="380" height="66" rx="8" stroke-width="1.5"/><text class="wrnt" x="406" y="228" style="font-size:14px">Out of scope (most valuable)</text><text class="sm" x="406" y="248">Letter generation, mobile, other regions:</text><text class="sm" x="406" y="266">not this phase → parking lot</text><line class="lnw" x1="322" y1="252" x2="388" y2="226" marker-end="url(#arw)"/><rect class="bt" x="392" y="296" width="380" height="66" rx="8" stroke-width="1.5"/><text class="teat" x="406" y="318" style="font-size:14px">Assumption with owner + date</text><text class="sm" x="406" y="338">500 de-identified cases by week 1</text><text class="sm" x="406" y="356">(owner: data lead). If false: re-plan.</text><line class="lnt" x1="322" y1="277" x2="388" y2="316" marker-end="url(#art)"/>
</svg>
