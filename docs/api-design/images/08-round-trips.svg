<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Where the round trips happen</title>
  <desc id="d">A member dashboard needs data from three services, on a mobile network with a 150 ms round trip. Top: REST without a BFF, where the phone calls the member, prescriptions and claims endpoints; the second and third depend on the first for the member id and filters, so in the worst case they run in sequence, about 450 ms over the mobile network, and the phone downloads fields it doesn&#x27;t use. Bottom: one GraphQL or BFF call, 150 ms over the mobile network, while the server fans out to the three services in parallel over the data-centre network in a few milliseconds and returns only the requested fields. Illustrative timings.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:15s infinite linear}
    .gl{stroke:#e2e8f0;stroke-width:1}@media (prefers-color-scheme: dark){.gl{stroke:#334155}}
    @keyframes a0{0%{opacity:0}0%{opacity:0}1%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a0{animation-name:a0}
    @keyframes a1{0%{opacity:0}25.5%{opacity:0}26.5%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a1{animation-name:a1}
    @keyframes a2{0%{opacity:0}51%{opacity:0}52%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a2{animation-name:a2}
    @keyframes ra{0%{opacity:0}87%{opacity:0}88%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .ra{animation-name:ra}
    @keyframes b0{0%{opacity:0}0%{opacity:0}1%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .b0{animation-name:b0}
    @keyframes b1{0%{opacity:0}29%{opacity:0}30%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .b1{animation-name:b1}
    @keyframes b2{0%{opacity:0}29%{opacity:0}30%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .b2{animation-name:b2}
    @keyframes b3{0%{opacity:0}29%{opacity:0}30%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .b3{animation-name:b3}
    @keyframes rb{0%{opacity:0}31%{opacity:0}32%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .rb{animation-name:rb}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Member dashboard on a 150 ms mobile link</text>
  <text class="sub" x="28" y="62">Illustrative timings. Mobile round trips are expensive; data-centre ones are cheap.</text>
  <line x1="190.0" x2="190.0" y1="96" y2="300" class="gl"/>
  <text class="sm" x="190" y="318" text-anchor="middle">0 ms</text>
  <line x1="302.0" x2="302.0" y1="96" y2="300" class="gl"/>
  <text class="sm" x="302" y="318" text-anchor="middle">100 ms</text>
  <line x1="414.0" x2="414.0" y1="96" y2="300" class="gl"/>
  <text class="sm" x="414" y="318" text-anchor="middle">200 ms</text>
  <line x1="526.0" x2="526.0" y1="96" y2="300" class="gl"/>
  <text class="sm" x="526" y="318" text-anchor="middle">300 ms</text>
  <line x1="638.0" x2="638.0" y1="96" y2="300" class="gl"/>
  <text class="sm" x="638" y="318" text-anchor="middle">400 ms</text>
  <line x1="750.0" x2="750.0" y1="96" y2="300" class="gl"/>
  <text class="sm" x="750" y="318" text-anchor="middle">500 ms</text>
  <text class="h2" x="28" y="110">REST, no BFF</text>
  <g class="a a0">
  <rect class="badf" x="190" y="124" width="165" height="24" rx="5"/>
  <text class="on13" x="272.5" y="140.5" text-anchor="middle">GET /members/42</text>
  </g>
  <g class="a a1">
  <rect class="badf" x="358" y="154" width="165" height="24" rx="5"/>
  <text class="on13" x="440.5" y="170.5" text-anchor="middle">GET /…/prescriptions</text>
  </g>
  <g class="a a2">
  <rect class="badf" x="526" y="184" width="165" height="24" rx="5"/>
  <text class="on13" x="608.5" y="200.5" text-anchor="middle">GET /…/claims</text>
  </g>
  <text class="lbl badt a ra" x="28" y="150">≈ 450 ms</text>
  <text class="sm a ra" x="28" y="170">+ unused fields</text>
  <text class="h2" x="28" y="230">GraphQL / BFF</text>
  <g class="a b0">
  <rect class="pri" x="190" y="244" width="165" height="24" rx="5"/>
  <text class="on13" x="272.5" y="260.5" text-anchor="middle">1 query over mobile</text>
  </g>
  <g class="a b1">
  <rect class="tea" x="268.4" y="274" width="22" height="16" rx="3"/>
  </g>
  <g class="a b2">
  <rect class="tea" x="294.4" y="274" width="22" height="16" rx="3"/>
  </g>
  <g class="a b3">
  <rect class="tea" x="320.4" y="274" width="22" height="16" rx="3"/>
  </g>
  <text class="sm teat" x="369.2" y="286">parallel fan-out in the data centre (~5 ms)</text>
  <text class="lbl okt a rb" x="28" y="256">≈ 150 ms</text>
  <text class="sm a rb" x="28" y="276">exact fields</text>
  <text class="tx" x="28" y="352">The joining moves from the phone (slow, metered network) to the server (fast network, any protocol).</text>
  <text class="sub" x="28" y="376">Behind the BFF, services can talk gRPC; at the edge, public partners still get REST + OpenAPI.</text>
</svg>
