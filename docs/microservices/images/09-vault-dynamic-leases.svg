<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 448" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Vault dynamic database credentials</title>
  <desc id="d">Vault's database secrets engine creates a separate short-lived Postgres user for each of three rx-service pods, each with a lease. Pods 1 and 2 keep renewing their leases, so their lease bars refill. Pod 3 is deleted, its lease is no longer renewed and runs out, and Vault revokes its database user. A leaked credential stops working when its lease ends and can be traced to one pod.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ring{fill:#ffffff;stroke:#d97706;stroke-width:2.5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
      .ring{fill:#111827;stroke:#fbbf24}
    }

    .a{opacity:0;animation:14s infinite linear}
    @keyframes v1{0%,36%{opacity:0}38%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes v2{0%,70%{opacity:0}72%,92%{opacity:1}96%,100%{opacity:0}}

    @keyframes renew{0%{transform:scaleX(1)}22%{transform:scaleX(.45)}23%{transform:scaleX(1)}45%{transform:scaleX(.45)}46%{transform:scaleX(1)}68%{transform:scaleX(.45)}69%{transform:scaleX(1)}92%{transform:scaleX(.5)}100%{transform:scaleX(1)}}@keyframes drain{0%{transform:scaleX(1)}22%{transform:scaleX(.45)}23%,36%{transform:scaleX(1)}70%,96%{transform:scaleX(0)}100%{transform:scaleX(1)}}
    .l0,.l1,.l2{transform-box:fill-box;transform-origin:0 50%}
    .l0,.l1{animation:renew 14s infinite linear}.l2{animation:drain 14s infinite linear}
    @media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.l0,.l1{animation:none}.l2{animation:none;transform:scaleX(0)}}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="446" rx="14"/>
  <text class="h" x="28" y="40">Vault dynamic database credentials</text>
  <text class="sub" x="28" y="62">Each pod gets its own short-lived DB user with a lease. Renewed while the pod lives; revoked when it lapses.</text>
  <rect class="bp" x="28" y="92" width="230" height="104" rx="10" stroke-width="1.5"/><text class="lbl" x="44" y="118">Vault</text><text class="sub" x="44" y="140">database secrets engine</text>
  <text class="sub" x="44" y="160">role rx-readwrite</text><text class="sub" x="44" y="180">Kubernetes auth per pod</text>
  <rect class="box" x="580" y="92" width="192" height="120" rx="10" stroke-width="1.5"/><text class="sub" x="596" y="110">Postgres users</text><text class="tx" x="596" y="132">v-rx-…-a1f3</text><text class="tx" x="596" y="162">v-rx-…-7c2e</text><text class="tx" x="596" y="192">v-rx-…-d904</text>
  <line class="lnp" x1="258" y1="144" x2="576" y2="144" marker-end="url(#arp)"/>
  <text class="sub" x="417" y="136" text-anchor="middle">creates / revokes users</text>
  <rect class="bt" x="40" y="270" width="220" height="92" rx="10" stroke-width="1.5"/><text class="lbl" x="54" y="294">rx-service pod 1</text><text class="sub" x="54" y="316">DB user v-rx-…-a1f3</text>
  <rect class="box" x="54" y="330" width="192" height="14" rx="7" stroke-width="1.5"/><rect class="tea l0" x="54" y="330" width="192" height="14" rx="7"/>
  <line class="lnt dash" x1="150" y1="270" x2="130" y2="196" stroke-width="1.5"/>
  <rect class="bt" x="290" y="270" width="220" height="92" rx="10" stroke-width="1.5"/><text class="lbl" x="304" y="294">rx-service pod 2</text><text class="sub" x="304" y="316">DB user v-rx-…-7c2e</text>
  <rect class="box" x="304" y="330" width="192" height="14" rx="7" stroke-width="1.5"/><rect class="tea l1" x="304" y="330" width="192" height="14" rx="7"/>
  <line class="lnt dash" x1="400" y1="270" x2="150" y2="196" stroke-width="1.5"/>
  <rect class="bt" x="540" y="270" width="220" height="92" rx="10" stroke-width="1.5"/><text class="lbl" x="554" y="294">rx-service pod 3</text><text class="sub" x="554" y="316">DB user v-rx-…-d904</text>
  <rect class="box" x="554" y="330" width="192" height="14" rx="7" stroke-width="1.5"/><rect class="wrnf l2" x="554" y="330" width="192" height="14" rx="7"/>
  <line class="lnt dash" x1="650" y1="270" x2="170" y2="196" stroke-width="1.5"/>
  <g class="a" style="animation-name:v1"><rect class="mutf" x="540" y="270" width="220" height="92" rx="10" opacity="0.55"/><text class="sub" x="650" y="382" text-anchor="middle">pod deleted: no more renewals</text></g>
  <g class="a" style="animation-name:v2"><line class="lnb" x1="596" y1="187" x2="760" y2="187"/><text class="sub badt" x="684" y="222" text-anchor="middle">lease expired: user revoked</text></g>
  <rect class="tea" x="28" y="400" width="14" height="10" rx="3"/><text class="sub" x="48" y="410">lease time left (renewed by Spring Cloud Vault)</text>
  <rect class="wrnf" x="400" y="400" width="14" height="10" rx="3"/><text class="sub" x="420" y="410">not renewed</text>
  <text class="sub" x="28" y="432">Usernames shortened. A leaked credential stops working when its lease ends and points to one pod.</text>
</svg>
