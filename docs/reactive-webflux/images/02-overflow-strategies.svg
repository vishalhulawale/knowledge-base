<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Overflow strategies compared</title>
  <desc id="d">Items 1 to 8 arrive one per tick at a consumer that needs about 2.6 ticks per item. With buffer, items 1, 2, 3 and 4 are delivered later and later while 5 to 8 are still queued. With drop, the consumer receives 1, 4 and 7, and 2, 3, 5, 6 and 8 are discarded. With latest, it receives 1, 3, 6 and 8, always the newest item held while it was busy. With error, item 1 is delivered and the stream fails with OverflowException when item 2 arrives with no demand. The timings are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="468" rx="14"/>
  <text class="h" x="28" y="40">Same input, four overflow strategies</text><text class="sub" x="28" y="62">Items 1 to 8 arrive one per tick. The consumer is busy for about 2.6 ticks per item. Illustrative.</text><text class="lbl" x="28" y="104">arrives</text><circle class="tea" cx="230" cy="99" r="15"/><text class="on13" x="230" y="104" text-anchor="middle">1</text><circle class="tea" cx="284" cy="99" r="15"/><text class="on13" x="284" y="104" text-anchor="middle">2</text><circle class="tea" cx="338" cy="99" r="15"/><text class="on13" x="338" y="104" text-anchor="middle">3</text><circle class="tea" cx="392" cy="99" r="15"/><text class="on13" x="392" y="104" text-anchor="middle">4</text><circle class="tea" cx="446" cy="99" r="15"/><text class="on13" x="446" y="104" text-anchor="middle">5</text><circle class="tea" cx="500" cy="99" r="15"/><text class="on13" x="500" y="104" text-anchor="middle">6</text><circle class="tea" cx="554" cy="99" r="15"/><text class="on13" x="554" y="104" text-anchor="middle">7</text><circle class="tea" cx="608" cy="99" r="15"/><text class="on13" x="608" y="104" text-anchor="middle">8</text><line class="grid" x1="28" y1="124" x2="772" y2="124"/><text class="sub" x="28" y="168">onBackpressure</text><text class="lbl" x="28" y="186">buffer</text><text class="sub" x="28" y="204" style="font-size:11px">every item, later and later</text><rect class="pri" x="216" y="162" width="28" height="30" rx="6"/><text class="on13" x="230" y="182" text-anchor="middle">1</text><rect class="pri" x="356.4" y="162" width="28" height="30" rx="6"/><text class="on13" x="370.4" y="182" text-anchor="middle">2</text><rect class="pri" x="496.8" y="162" width="28" height="30" rx="6"/><text class="on13" x="510.8" y="182" text-anchor="middle">3</text><rect class="pri" x="637.2" y="162" width="28" height="30" rx="6"/><text class="on13" x="651.2" y="182" text-anchor="middle">4</text><rect class="bw" x="668" y="162" width="104" height="30" rx="6" stroke-width="1.2"/><text class="wrnt" x="720" y="182" text-anchor="middle" style="font-size:13px">5–8 queued</text><line class="grid" x1="28" y1="214" x2="772" y2="214"/><text class="sub" x="28" y="234">onBackpressure</text><text class="lbl" x="28" y="252">drop</text><text class="sub" x="28" y="270" style="font-size:11px">items arriving while busy are lost</text><rect class="pri" x="216" y="228" width="28" height="30" rx="6"/><text class="on13" x="230" y="248" text-anchor="middle">1</text><rect class="pri" x="378" y="228" width="28" height="30" rx="6"/><text class="on13" x="392" y="248" text-anchor="middle">4</text><rect class="pri" x="540" y="228" width="28" height="30" rx="6"/><text class="on13" x="554" y="248" text-anchor="middle">7</text><rect class="bm" x="272" y="230" width="24" height="26" rx="6" stroke-width="1"/><text class="sub" x="284" y="248" text-anchor="middle">2</text><line class="lnb" x1="274" y1="254" x2="294" y2="232" style="stroke-width:2"/><rect class="bm" x="326" y="230" width="24" height="26" rx="6" stroke-width="1"/><text class="sub" x="338" y="248" text-anchor="middle">3</text><line class="lnb" x1="328" y1="254" x2="348" y2="232" style="stroke-width:2"/><rect class="bm" x="434" y="230" width="24" height="26" rx="6" stroke-width="1"/><text class="sub" x="446" y="248" text-anchor="middle">5</text><line class="lnb" x1="436" y1="254" x2="456" y2="232" style="stroke-width:2"/><rect class="bm" x="488" y="230" width="24" height="26" rx="6" stroke-width="1"/><text class="sub" x="500" y="248" text-anchor="middle">6</text><line class="lnb" x1="490" y1="254" x2="510" y2="232" style="stroke-width:2"/><rect class="bm" x="596" y="230" width="24" height="26" rx="6" stroke-width="1"/><text class="sub" x="608" y="248" text-anchor="middle">8</text><line class="lnb" x1="598" y1="254" x2="618" y2="232" style="stroke-width:2"/><line class="grid" x1="28" y1="280" x2="772" y2="280"/><text class="sub" x="28" y="300">onBackpressure</text><text class="lbl" x="28" y="318">latest</text><text class="sub" x="28" y="336" style="font-size:11px">on ready, take the newest held</text><rect class="pri" x="216" y="294" width="28" height="30" rx="6"/><text class="on13" x="230" y="314" text-anchor="middle">1</text><rect class="pri" x="351" y="294" width="28" height="30" rx="6"/><text class="on13" x="365" y="314" text-anchor="middle">3</text><rect class="pri" x="491.4" y="294" width="28" height="30" rx="6"/><text class="on13" x="505.4" y="314" text-anchor="middle">6</text><rect class="pri" x="631.8" y="294" width="28" height="30" rx="6"/><text class="on13" x="645.8" y="314" text-anchor="middle">8</text><rect class="bm" x="272" y="296" width="24" height="26" rx="6" stroke-width="1"/><text class="sub" x="284" y="314" text-anchor="middle">2</text><line class="lnb" x1="274" y1="320" x2="294" y2="298" style="stroke-width:2"/><rect class="bm" x="380" y="296" width="24" height="26" rx="6" stroke-width="1"/><text class="sub" x="392" y="314" text-anchor="middle">4</text><line class="lnb" x1="382" y1="320" x2="402" y2="298" style="stroke-width:2"/><rect class="bm" x="434" y="296" width="24" height="26" rx="6" stroke-width="1"/><text class="sub" x="446" y="314" text-anchor="middle">5</text><line class="lnb" x1="436" y1="320" x2="456" y2="298" style="stroke-width:2"/><rect class="bm" x="542" y="296" width="24" height="26" rx="6" stroke-width="1"/><text class="sub" x="554" y="314" text-anchor="middle">7</text><line class="lnb" x1="544" y1="320" x2="564" y2="298" style="stroke-width:2"/><line class="grid" x1="28" y1="346" x2="772" y2="346"/><text class="sub" x="28" y="366">onBackpressure</text><text class="lbl" x="28" y="384">error</text><text class="sub" x="28" y="402" style="font-size:11px">fails as soon as demand is 0</text><rect class="pri" x="216" y="360" width="28" height="30" rx="6"/><text class="on13" x="230" y="380" text-anchor="middle">1</text><rect class="bb" x="268" y="360" width="210" height="30" rx="6" stroke-width="1.2"/><text class="badt" x="280" y="380" style="font-size:13px">✕ OverflowException</text><line class="grid" x1="28" y1="412" x2="772" y2="412"/><text class="sm" x="28" y="448">Blue = delivered to the consumer at that moment. Crossed = discarded.</text>
</svg>
