<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Anatomy of an RFC 9457 problem response</title>
  <desc id="d">An annotated 422 response with content type application/problem+json. The type URI is the stable machine-readable identifier clients switch on. Title is the same for every occurrence of the type, detail explains this occurrence, status repeats the HTTP status, and instance identifies this occurrence. Extensions add a code, a traceId to find the logs, and an errors array with a JSON pointer per invalid field so a UI can show each message next to its field.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">422 + application/problem+json</text>
  <text class="sub" x="28" y="62">Clients switch on type or code, never on detail text.</text>
  <rect class="box" x="28" y="90" width="744" height="300" rx="10" stroke-width="1.2"/>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px" x="44" y="116">{</text>
  <text class="tx prit" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px" x="44" y="142">  &quot;type&quot;: &quot;https://api.example-health.com/problems/v…</text>
  <text class="sm" x="756" y="142" text-anchor="end">stable id: clients switch on it</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px" x="44" y="168">  &quot;title&quot;: &quot;Request validation failed&quot;,</text>
  <text class="sm" x="756" y="168" text-anchor="end">same for every occurrence</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px" x="44" y="194">  &quot;status&quot;: 422,</text>
  <text class="sm" x="756" y="194" text-anchor="end">copy of the HTTP status</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px" x="44" y="220">  &quot;detail&quot;: &quot;2 fields are invalid.&quot;,</text>
  <text class="sm" x="756" y="220" text-anchor="end">this occurrence; safe text only</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px" x="44" y="246">  &quot;instance&quot;: &quot;/refills&quot;,</text>
  <text class="sm" x="756" y="246" text-anchor="end">which request</text>
  <text class="tx teat" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px" x="44" y="272">  &quot;code&quot;: &quot;VALIDATION_FAILED&quot;,</text>
  <text class="sm" x="756" y="272" text-anchor="end">extension: short code</text>
  <text class="tx teat" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px" x="44" y="298">  &quot;traceId&quot;: &quot;4bf92f35…&quot;,</text>
  <text class="sm" x="756" y="298" text-anchor="end">extension: find the logs</text>
  <text class="tx teat" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px" x="44" y="324">  &quot;errors&quot;: [ { &quot;pointer&quot;: &quot;#/quantity&quot;,</text>
  <text class="sm" x="756" y="324" text-anchor="end">extension: per-field errors</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px" x="44" y="350">               &quot;detail&quot;: &quot;must be between 1 and 90&quot; …</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px" x="44" y="376">}</text>
  <text class="sub" x="28" y="416">Never in detail: stack traces, SQL, hostnames, tokens or PHI.</text>
</svg>
