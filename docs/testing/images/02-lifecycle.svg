<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">JUnit 5 lifecycle</title>
  <desc id="d">Animation: the run of a JUnit 5 test class with two tests. BeforeAll runs once and is static. Then a new instance of the test class is created, BeforeEach runs, test one adds an item to a field, and AfterEach runs. A second new instance is created for test two, so its field starts empty again before BeforeEach, test two and AfterEach. AfterAll runs once at the end.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes p0{0%,1.99%{opacity:0}2%,11.59%{opacity:1}11.6%,100%{opacity:0}}.p0{animation-name:p0}
    @keyframes p1{0%,11.59%{opacity:0}11.6%,21.19%{opacity:1}21.2%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,21.19%{opacity:0}21.2%,30.79%{opacity:1}30.8%,100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%,30.79%{opacity:0}30.8%,40.39%{opacity:1}40.4%,100%{opacity:0}}.p3{animation-name:p3}
    @keyframes p4{0%,40.39%{opacity:0}40.4%,49.99%{opacity:1}50%,100%{opacity:0}}.p4{animation-name:p4}
    @keyframes p5{0%,49.99%{opacity:0}50%,59.59%{opacity:1}59.6%,100%{opacity:0}}.p5{animation-name:p5}
    @keyframes p6{0%,59.59%{opacity:0}59.6%,69.19%{opacity:1}69.2%,100%{opacity:0}}.p6{animation-name:p6}
    @keyframes p7{0%,69.19%{opacity:0}69.2%,78.79%{opacity:1}78.8%,100%{opacity:0}}.p7{animation-name:p7}
    @keyframes p8{0%,78.79%{opacity:0}78.8%,88.39%{opacity:1}88.4%,100%{opacity:0}}.p8{animation-name:p8}
    @keyframes p9{0%,88.39%{opacity:0}88.4%,100%{opacity:1}}.p9{animation-name:p9}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.p6{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="410" rx="14"/>
  <text class="h" x="28" y="40">JUnit 5 lifecycle: one instance per test</text><text class="sub" x="28" y="62">Default Lifecycle.PER_METHOD. The highlight steps through the run.</text><rect class="box" x="300" y="86" width="200" height="40" rx="8" stroke-width="1.4"/><text class="sm" x="400" y="111" text-anchor="middle">@BeforeAll (static, once)</text><rect class="box" x="40" y="160" width="170" height="40" rx="8" stroke-width="1.4"/><text class="sm" x="125" y="185" text-anchor="middle">new RefillTest() #1</text><rect class="box" x="240" y="160" width="130" height="40" rx="8" stroke-width="1.4"/><text class="sm" x="305" y="185" text-anchor="middle">@BeforeEach</text><rect class="box" x="400" y="160" width="120" height="40" rx="8" stroke-width="1.4"/><text class="sm" x="460" y="185" text-anchor="middle">test1()</text><rect class="box" x="550" y="160" width="130" height="40" rx="8" stroke-width="1.4"/><text class="sm" x="615" y="185" text-anchor="middle">@AfterEach</text><rect class="box" x="40" y="240" width="170" height="40" rx="8" stroke-width="1.4"/><text class="sm" x="125" y="265" text-anchor="middle">new RefillTest() #2</text><rect class="box" x="240" y="240" width="130" height="40" rx="8" stroke-width="1.4"/><text class="sm" x="305" y="265" text-anchor="middle">@BeforeEach</text><rect class="box" x="400" y="240" width="120" height="40" rx="8" stroke-width="1.4"/><text class="sm" x="460" y="265" text-anchor="middle">test2()</text><rect class="box" x="550" y="240" width="130" height="40" rx="8" stroke-width="1.4"/><text class="sm" x="615" y="265" text-anchor="middle">@AfterEach</text><rect class="box" x="300" y="320" width="200" height="40" rx="8" stroke-width="1.4"/><text class="sm" x="400" y="345" text-anchor="middle">@AfterAll (static, once)</text><line class="ln" x1="212" y1="180" x2="236" y2="180" marker-end="url(#ar)"/><line class="ln" x1="372" y1="180" x2="396" y2="180" marker-end="url(#ar)"/><line class="ln" x1="522" y1="180" x2="546" y2="180" marker-end="url(#ar)"/><line class="ln" x1="212" y1="260" x2="236" y2="260" marker-end="url(#ar)"/><line class="ln" x1="372" y1="260" x2="396" y2="260" marker-end="url(#ar)"/><line class="ln" x1="522" y1="260" x2="546" y2="260" marker-end="url(#ar)"/><line class="ln" x1="400" y1="128" x2="400" y2="156" marker-end="url(#ar)"/><line class="ln" x1="400" y1="282" x2="400" y2="316" marker-end="url(#ar)"/><line class="ln dash" x1="125" y1="202" x2="125" y2="236" marker-end="url(#ar)"/><g class="k p0"><rect class="tea" x="300" y="86" width="200" height="40" rx="8"/><text class="on13" x="400" y="111" text-anchor="middle">@BeforeAll (static, once)</text></g><g class="k p1"><rect class="tea" x="40" y="160" width="170" height="40" rx="8"/><text class="on13" x="125" y="185" text-anchor="middle">new RefillTest() #1</text><text class="sub" x="696" y="178">field</text><text class="teat" x="696" y="196" style="font-size:13px">items = []</text></g><g class="k p2"><rect class="tea" x="240" y="160" width="130" height="40" rx="8"/><text class="on13" x="305" y="185" text-anchor="middle">@BeforeEach</text><text class="sub" x="696" y="178">field</text><text class="teat" x="696" y="196" style="font-size:13px">items = []</text></g><g class="k p3"><rect class="tea" x="400" y="160" width="120" height="40" rx="8"/><text class="on13" x="460" y="185" text-anchor="middle">test1()</text><text class="sub" x="696" y="178">field</text><text class="teat" x="696" y="196" style="font-size:13px">items = [rx-1]</text></g><g class="k p4"><rect class="tea" x="550" y="160" width="130" height="40" rx="8"/><text class="on13" x="615" y="185" text-anchor="middle">@AfterEach</text><text class="sub" x="696" y="178">field</text><text class="teat" x="696" y="196" style="font-size:13px">items = [rx-1]</text></g><g class="k p5"><rect class="tea" x="40" y="240" width="170" height="40" rx="8"/><text class="on13" x="125" y="265" text-anchor="middle">new RefillTest() #2</text><text class="sub" x="696" y="258">field</text><text class="teat" x="696" y="276" style="font-size:13px">items = []</text></g><g class="k p6"><rect class="tea" x="240" y="240" width="130" height="40" rx="8"/><text class="on13" x="305" y="265" text-anchor="middle">@BeforeEach</text><text class="sub" x="696" y="258">field</text><text class="teat" x="696" y="276" style="font-size:13px">items = []</text></g><g class="k p7"><rect class="tea" x="400" y="240" width="120" height="40" rx="8"/><text class="on13" x="460" y="265" text-anchor="middle">test2()</text><text class="sub" x="696" y="258">field</text><text class="teat" x="696" y="276" style="font-size:13px">items = [rx-2]</text></g><g class="k p8"><rect class="tea" x="550" y="240" width="130" height="40" rx="8"/><text class="on13" x="615" y="265" text-anchor="middle">@AfterEach</text><text class="sub" x="696" y="258">field</text><text class="teat" x="696" y="276" style="font-size:13px">items = [rx-2]</text></g><g class="k p9"><rect class="tea" x="300" y="320" width="200" height="40" rx="8"/><text class="on13" x="400" y="345" text-anchor="middle">@AfterAll (static, once)</text></g><text class="sm" x="28" y="392">Test two starts with an empty list: nothing set by test one survives, so order can't matter.</text>
</svg>
