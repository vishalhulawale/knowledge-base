  <rect class="cell" x="439.0" y="130" width="32" height="34" rx="5"/><text class="num" x="455.0" y="152" text-anchor="middle">2</text>
  <rect class="move" x="439.0" y="172" width="32" height="34" rx="5"/><text class="num" x="455.0" y="194" text-anchor="middle">0</text>
  <rect class="cell" x="472.5" y="88" width="32" height="34" rx="5"/><text class="num" x="488.5" y="110" text-anchor="middle">11</text>
  <rect class="cell" x="472.5" y="130" width="32" height="34" rx="5"/><text class="num" x="488.5" y="152" text-anchor="middle">3</text>
  <rect class="move" x="472.5" y="172" width="32" height="34" rx="5"/><text class="num" x="488.5" y="194" text-anchor="middle">1</text>
  <rect class="cell" x="506.0" y="88" width="32" height="34" rx="5"/><text class="num" x="522.0" y="110" text-anchor="middle">12</text>
  <rect class="cell" x="506.0" y="130" width="32" height="34" rx="5"/><text class="num" x="522.0" y="152" text-anchor="middle">0</text>
  <rect class="move" x="506.0" y="172" width="32" height="34" rx="5"/><text class="num" x="522.0" y="194" text-anchor="middle">2</text>
  <rect class="cell" x="539.5" y="88" width="32" height="34" rx="5"/><text class="num" x="555.5" y="110" text-anchor="middle">13</text>
  <rect class="cell" x="539.5" y="130" width="32" height="34" rx="5"/><text class="num" x="555.5" y="152" text-anchor="middle">1</text>
  <rect class="move" x="539.5" y="172" width="32" height="34" rx="5"/><text class="num" x="555.5" y="194" text-anchor="middle">3</text>
  <rect class="cell" x="573.0" y="88" width="32" height="34" rx="5"/><text class="num" x="589.0" y="110" text-anchor="middle">14</text>
  <rect class="cell" x="573.0" y="130" width="32" height="34" rx="5"/><text class="num" x="589.0" y="152" text-anchor="middle">2</text>
  <rect class="move" x="573.0" y="172" width="32" height="34" rx="5"/><text class="num" x="589.0" y="194" text-anchor="middle">4</text>
  <rect class="cell" x="606.5" y="88" width="32" height="34" rx="5"/><text class="num" x="622.5" y="110" text-anchor="middle">15</text>
  <rect class="cell" x="606.5" y="130" width="32" height="34" rx="5"/><text class="num" x="622.5" y="152" text-anchor="middle">3</text>
  <rect class="move" x="606.5" y="172" width="32" height="34" rx="5"/><text class="num" x="622.5" y="194" text-anchor="middle">0</text>
  <rect class="cell" x="640.0" y="88" width="32" height="34" rx="5"/><text class="num" x="656.0" y="110" text-anchor="middle">16</text>
  <rect class="cell" x="640.0" y="130" width="32" height="34" rx="5"/><text class="num" x="656.0" y="152" text-anchor="middle">0</text>
  <rect class="move" x="640.0" y="172" width="32" height="34" rx="5"/><text class="num" x="656.0" y="194" text-anchor="middle">1</text>
  <rect class="cell" x="673.5" y="88" width="32" height="34" rx="5"/><text class="num" x="689.5" y="110" text-anchor="middle">17</text>
  <rect class="cell" x="673.5" y="130" width="32" height="34" rx="5"/><text class="num" x="689.5" y="152" text-anchor="middle">1</text>
  <rect class="move" x="673.5" y="172" width="32" height="34" rx="5"/><text class="num" x="689.5" y="194" text-anchor="middle">2</text>
  <rect class="cell" x="707.0" y="88" width="32" height="34" rx="5"/><text class="num" x="723.0" y="110" text-anchor="middle">18</text>
  <rect class="cell" x="707.0" y="130" width="32" height="34" rx="5"/><text class="num" x="723.0" y="152" text-anchor="middle">2</text>
  <rect class="move" x="707.0" y="172" width="32" height="34" rx="5"/><text class="num" x="723.0" y="194" text-anchor="middle">3</text>
  <rect class="cell" x="740.5" y="88" width="32" height="34" rx="5"/><text class="num" x="756.5" y="110" text-anchor="middle">19</text>
  <rect class="cell" x="740.5" y="130" width="32" height="34" rx="5"/><text class="num" x="756.5" y="152" text-anchor="middle">3</text>
  <rect class="move" x="740.5" y="172" width="32" height="34" rx="5"/><text class="num" x="756.5" y="194" text-anchor="middle">4</text>
  <rect class="stay" x="28" y="232" width="18" height="18" rx="4"/><text class="good" x="56" y="246">4 keys stay (0–3)</text>
  <rect class="move" x="260" y="232" width="18" height="18" rx="4"/><text class="bad" x="288" y="246">16 of 20 keys move (80%)</text>
  <text class="lbl" x="28" y="284">Consistent hashing moves only about 1/5 of the keys, all of them onto the new shard.</text>
  <text class="sub" x="28" y="310">Moving keys means migrating data, and for a cache it means a miss storm.</text>
</svg>
