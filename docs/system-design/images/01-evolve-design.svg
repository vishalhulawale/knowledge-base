<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Start simple, then evolve the design</title>
  <desc id="d">An example design grows in three steps. First, clients call one service backed by one relational database. At 10 times the load, a load balancer, more stateless service instances, a cache and read replicas are added. At 100 times, a queue with workers takes slow work off the request path and the database is split into shards by key.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:14px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
    .b2{fill:#ffffff;stroke:#4f46e5;stroke-width:2}
    .b3{fill:#ffffff;stroke:#0ea5a4;stroke-width:2}
    .ln{stroke:#94a3b8;stroke-width:2;fill:none}
    .stage{fill:#4f46e5;font-size:15px;font-weight:700}
    .stage3{fill:#0f766e;font-size:15px;font-weight:700}
    .pill{fill:#eef2ff}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .b2{fill:#111827;stroke:#818cf8}.b3{fill:#111827;stroke:#2dd4bf}
      .ln{stroke:#64748b}.stage{fill:#818cf8}.stage3{fill:#5eead4}
      .pill{fill:#272b45}
    }
    /* 10 s loop: step 1 (0-30%), step 2 (32-62%), step 3 (64-96%) */
    .s1,.s2,.s3,.t2,.p1{animation:10s infinite linear}
    @keyframes k1{0%,30%{opacity:1}32%,96%{opacity:0}98%,100%{opacity:1}}
    @keyframes k2{0%,30%{opacity:0}32%,96%{opacity:1}98%,100%{opacity:0}}
    @keyframes k3{0%,62%{opacity:0}64%,96%{opacity:1}98%,100%{opacity:0}}
    @keyframes kt2{0%,30%{opacity:0}32%,62%{opacity:1}64%,100%{opacity:0}}
    @keyframes kp{0%,62%{opacity:1}64%,96%{opacity:0}98%,100%{opacity:1}}
    .s1{animation-name:k1}.s2{animation-name:k2}.s3{animation-name:k3}.t2{animation-name:kt2}.p1{animation-name:kp}
    @media (prefers-reduced-motion: reduce){
      .s1,.s2,.s3,.t2,.p1{animation:none}
      .s1,.t2,.p1{opacity:0}.s2,.s3{opacity:1}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">Start simple, then evolve</text>

  <!-- step labels -->
  <rect class="pill" x="28" y="54" width="744" height="30" rx="8"/>
  <text class="stage s1" x="40" y="74">Step 1 · modest scale: one service and one relational database</text>
  <text class="stage t2" x="40" y="74">Step 2 · 10×: scale the stateless tier out, offload reads</text>
  <text class="stage3 s3" x="40" y="74">Step 3 · 100×: move slow work to a queue, shard the data by key</text>

  <!-- links (drawn first so boxes sit on top) -->
  <line class="ln" x1="128" y1="215" x2="318" y2="215"/>
  <line class="ln" x1="448" y1="215" x2="500" y2="215"/>
  <g class="s2">
    <line class="ln" x1="278" y1="215" x2="318" y2="150"/>
    <line class="ln" x1="278" y1="215" x2="318" y2="280"/>
    <line class="ln" x1="448" y1="200" x2="500" y2="140"/>
    <line class="ln" x1="630" y1="215" x2="660" y2="196"/>
    <line class="ln" x1="630" y1="215" x2="660" y2="246"/>
  </g>
  <g class="s3">
    <line class="ln" x1="448" y1="230" x2="500" y2="320"/>
    <line class="ln" x1="630" y1="320" x2="660" y2="320"/>
  </g>

  <!-- step 1 components -->
  <rect class="box" x="28" y="190" width="100" height="50" rx="10"/>
  <text class="lbl" x="78" y="220" text-anchor="middle">Clients</text>
  <rect class="box" x="318" y="190" width="130" height="50" rx="10"/>
  <text class="lbl" x="383" y="220" text-anchor="middle">Service</text>
  <g class="p1">
    <rect class="box" x="500" y="190" width="130" height="50" rx="10"/>
    <text class="lbl" x="565" y="220" text-anchor="middle">Relational DB</text>
  </g>

  <!-- step 2 components -->
  <g class="s2">
    <rect class="b2" x="168" y="190" width="110" height="50" rx="10"/>
    <text class="lbl" x="223" y="212" text-anchor="middle">Load</text>
    <text class="lbl" x="223" y="229" text-anchor="middle">balancer</text>
    <rect class="b2" x="318" y="126" width="130" height="48" rx="10"/>
    <text class="lbl" x="383" y="155" text-anchor="middle">Service</text>
    <rect class="b2" x="318" y="256" width="130" height="48" rx="10"/>
    <text class="lbl" x="383" y="285" text-anchor="middle">Service</text>
    <text class="sub" x="383" y="118" text-anchor="middle">stateless</text>
    <rect class="b2" x="500" y="118" width="130" height="44" rx="10"/>
    <text class="lbl" x="565" y="145" text-anchor="middle">Cache</text>
    <rect class="b2" x="660" y="178" width="112" height="36" rx="8"/>
    <text class="tx" x="716" y="201" text-anchor="middle">Read replica</text>
    <rect class="b2" x="660" y="228" width="112" height="36" rx="8"/>
    <text class="tx" x="716" y="251" text-anchor="middle">Read replica</text>
  </g>

  <!-- step 3 components -->
  <g class="s3">
    <rect class="b3" x="500" y="190" width="62" height="50" rx="10"/>
    <text class="tx" x="531" y="211" text-anchor="middle">Shard</text>
    <text class="tx" x="531" y="228" text-anchor="middle">1</text>
    <rect class="b3" x="568" y="190" width="62" height="50" rx="10"/>
    <text class="tx" x="599" y="211" text-anchor="middle">Shard</text>
    <text class="tx" x="599" y="228" text-anchor="middle">2</text>
    <rect class="b3" x="500" y="298" width="130" height="44" rx="10"/>
    <text class="lbl" x="565" y="325" text-anchor="middle">Queue</text>
    <rect class="b3" x="660" y="298" width="112" height="44" rx="10"/>
    <text class="lbl" x="716" y="325" text-anchor="middle">Workers</text>
  </g>

  <!-- explanation per step -->
  <text class="tx s1" x="28" y="380">It fits on one screen and meets the stated requirements. Say what breaks first at 10×.</text>
  <text class="tx t2" x="28" y="380">Any instance can serve any request, so the tier scales out. Cache and replicas absorb reads.</text>
  <text class="tx s3" x="28" y="380">Slow work leaves the request path. Shard only when writes or storage outgrow one primary.</text>
  <text class="sub" x="28" y="410">An example path, not a recipe. Each step should be forced by a requirement or an estimate, and you say which.</text>
</svg>
