<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Crosswalk and golden record</title>
  <desc id="d">The same member appears in claims as M1 with name R SHARMA, date of birth 1988-04-02 and no phone, and in the CRM as C9 with name Rahul Sharma, no date of birth and a phone number. A crosswalk maps both to enterprise key E-1001 using a date-of-birth and name rule with confidence 0.97. The golden record takes the name from the CRM as most complete, the date of birth from claims as verified, and the phone from the CRM because NULL never wins. Medium-confidence pairs go to human review. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="356" rx="14"/>
  <text class="h" x="28" y="40">Crosswalk + survivorship = one golden record</text><text class="sub" x="28" y="62">The same member in two systems; each attribute has its own rule for which source wins. Illustrative.</text><rect class="bm" x="28" y="92" width="220" height="90" rx="8" stroke-width="1.5"/><text class="mono" x="138" y="113.5" text-anchor="middle" xml:space="preserve" font-weight="700">Claims: M1</text><text class="mono" x="138" y="132.5" text-anchor="middle" xml:space="preserve">name: R SHARMA</text><text class="mono" x="138" y="151.5" text-anchor="middle" xml:space="preserve">dob: 1988-04-02</text><text class="mono" x="138" y="170.5" text-anchor="middle" xml:space="preserve">phone: NULL</text><rect class="bm" x="28" y="196" width="220" height="90" rx="8" stroke-width="1.5"/><text class="mono" x="138" y="217.5" text-anchor="middle" xml:space="preserve" font-weight="700">CRM: C9</text><text class="mono" x="138" y="236.5" text-anchor="middle" xml:space="preserve">name: Rahul Sharma</text><text class="mono" x="138" y="255.5" text-anchor="middle" xml:space="preserve">dob: NULL</text><text class="mono" x="138" y="274.5" text-anchor="middle" xml:space="preserve">phone: +91 98…21</text><rect class="bw" x="290" y="120" width="200" height="130" rx="10" stroke-width="1.5"/><text class="wrnt" x="304" y="144" style="font-size:14px">crosswalk</text><text class="mono" x="304" y="168" xml:space="preserve">claims, M1 → E-1001</text><text class="mono" x="304" y="187" xml:space="preserve">crm, C9 → E-1001</text><text class="mono" x="304" y="206" xml:space="preserve">rule: dob + name</text><text class="mono" x="304" y="225" xml:space="preserve">confidence: 0.97</text><line class="ln" x1="250" y1="137" x2="288" y2="160" marker-end="url(#ar)"/><line class="ln" x1="250" y1="241" x2="288" y2="210" marker-end="url(#ar)"/><line class="ln" x1="492" y1="185" x2="528" y2="185" marker-end="url(#ar)"/><rect class="bo" x="532" y="92" width="240" height="194" rx="10" stroke-width="1.5"/><text class="okt" x="546" y="116" style="font-size:15px">Member E-1001</text><text class="mono" x="546" y="146" xml:space="preserve">name: Rahul Sharma</text><text class="sub" x="546" y="164">CRM: most complete</text><text class="mono" x="546" y="190" xml:space="preserve">dob: 1988-04-02</text><text class="sub" x="546" y="208">claims: verified</text><text class="mono" x="546" y="234" xml:space="preserve">phone: +91 98…21</text><text class="sub" x="546" y="252">NULL never wins</text><text class="sm" x="28" y="318">Medium-confidence pairs go to a human review queue: in healthcare a wrong merge (two patients become one)</text><text class="sm" x="28" y="336">is worse than a missed match. Support un-merge.</text>
</svg>
