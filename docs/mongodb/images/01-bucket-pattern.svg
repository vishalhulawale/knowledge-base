<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Bucket pattern vs one document per reading</title>
  <desc id="d">Sensor S1 sends a reading every 10 minutes for two hours, twelve readings. Left, one document per reading: twelve documents and twelve index entries appear. Right, the bucket pattern: one document per sensor per hour holds the readings in an array, so the first six readings fill the 10:00 bucket and the next six the 11:00 bucket: two documents and two index entries. On the page&#x27;s measured data set of 200,000 readings the index shrank from 7.5 MB to 0.1 MB, and a native time-series collection did the same automatically with 2.7 MB of data.</desc>
