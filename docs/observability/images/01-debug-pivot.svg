<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Debugging pivot path</title>
  <desc id="d">Animation of an on-call debugging loop in five steps, highlighted one at a time: an SLO fast-burn alert on checkout at 14.4 times the planned rate; a dashboard showing errors from 14:02 only on version 2.3 pods; an exemplar on the p99 latency panel that links to trace 4bf9; the trace showing the pricing service waiting 2.1 seconds on a Redis timeout; and logs filtered by that trace ID showing the Redis pool exhausted at 50 of 50 connections. The same trace ID carries the investigation from metric to trace to log.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes s0{0%,19.99%{opacity:1}20%,100%{opacity:0}}.s0{animation-name:s0}
    @keyframes s1{0%,19.99%{opacity:0}20%,39.99%{opacity:1}40%,100%{opacity:0}}.s1{animation-name:s1}
    @keyframes s2{0%,39.99%{opacity:0}40%,59.99%{opacity:1}60%,100%{opacity:0}}.s2{animation-name:s2}
    @keyframes s3{0%,59.99%{opacity:0}60%,79.99%{opacity:1}80%,100%{opacity:0}}.s3{animation-name:s3}
    @keyframes s4{0%,79.99%{opacity:0}80%,100%{opacity:1}}.s4{animation-name:s4}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.s4{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="346" rx="14"/>
  <text class="h" x="28" y="40">From page to root cause in five hops</text><text class="sub" x="28" y="62">Metrics detect, traces localise, logs explain. Each hop reuses the same trace ID.</text><rect class="box" x="28" y="90" width="136" height="92" rx="10" stroke-width="1.5"/><text class="sm" x="96" y="121" text-anchor="middle" font-weight="700">Alert</text><text class="sm" x="96" y="141" text-anchor="middle">SLO fast burn</text><text class="sm" x="96" y="161" text-anchor="middle">checkout 14.4×</text><line class="ln" x1="165" y1="136" x2="178" y2="136" marker-end="url(#ar)"/><g class="k s0"><rect class="badf" x="28" y="90" width="136" height="92" rx="10"/><text class="on13" x="96" y="118" text-anchor="middle">Alert</text><text class="on13" x="96" y="138" text-anchor="middle">SLO fast burn</text><text class="on13" x="96" y="158" text-anchor="middle">checkout 14.4×</text><rect class="bm" x="28" y="206" width="744" height="74" rx="10"/><text class="lbl" x="48" y="232">Step 1: Alert</text><text class="sm" x="48" y="254">Page: checkout error ratio is burning the</text><text class="sm" x="48" y="272">error budget 14.4× faster than planned.</text></g><rect class="box" x="180" y="90" width="136" height="92" rx="10" stroke-width="1.5"/><text class="sm" x="248" y="121" text-anchor="middle" font-weight="700">Dashboard</text><text class="sm" x="248" y="141" text-anchor="middle">errors from 14:02</text><text class="sm" x="248" y="161" text-anchor="middle">only v2.3 pods</text><line class="ln" x1="317" y1="136" x2="330" y2="136" marker-end="url(#ar)"/><g class="k s1"><rect class="wrnf" x="180" y="90" width="136" height="92" rx="10"/><text class="on13" x="248" y="118" text-anchor="middle">Dashboard</text><text class="on13" x="248" y="138" text-anchor="middle">errors from 14:02</text><text class="on13" x="248" y="158" text-anchor="middle">only v2.3 pods</text><rect class="bm" x="28" y="206" width="744" height="74" rx="10"/><text class="lbl" x="48" y="232">Step 2: Dashboard</text><text class="sm" x="48" y="254">RED panel split by version: errors started</text><text class="sm" x="48" y="272">at 14:02 and only on pods running v2.3.</text></g><rect class="box" x="332" y="90" width="136" height="92" rx="10" stroke-width="1.5"/><text class="sm" x="400" y="121" text-anchor="middle" font-weight="700">Exemplar</text><text class="sm" x="400" y="141" text-anchor="middle">p99 dot →</text><text class="sm" x="400" y="161" text-anchor="middle">trace 4bf9…</text><line class="ln" x1="469" y1="136" x2="482" y2="136" marker-end="url(#ar)"/><g class="k s2"><rect class="pri" x="332" y="90" width="136" height="92" rx="10"/><text class="on13" x="400" y="118" text-anchor="middle">Exemplar</text><text class="on13" x="400" y="138" text-anchor="middle">p99 dot →</text><text class="on13" x="400" y="158" text-anchor="middle">trace 4bf9…</text><rect class="bm" x="28" y="206" width="744" height="74" rx="10"/><text class="lbl" x="48" y="232">Step 3: Exemplar</text><text class="sm" x="48" y="254">Click the exemplar on the p99 latency panel:</text><text class="sm" x="48" y="272">it carries trace ID 4bf9… of a slow request.</text></g><rect class="box" x="484" y="90" width="136" height="92" rx="10" stroke-width="1.5"/><text class="sm" x="552" y="121" text-anchor="middle" font-weight="700">Trace</text><text class="sm" x="552" y="141" text-anchor="middle">pricing span 2.1 s</text><text class="sm" x="552" y="161" text-anchor="middle">Redis timeout</text><line class="ln" x1="621" y1="136" x2="634" y2="136" marker-end="url(#ar)"/><g class="k s3"><rect class="tea" x="484" y="90" width="136" height="92" rx="10"/><text class="on13" x="552" y="118" text-anchor="middle">Trace</text><text class="on13" x="552" y="138" text-anchor="middle">pricing span 2.1 s</text><text class="on13" x="552" y="158" text-anchor="middle">Redis timeout</text><rect class="bm" x="28" y="206" width="744" height="74" rx="10"/><text class="lbl" x="48" y="232">Step 4: Trace</text><text class="sm" x="48" y="254">Waterfall: pricing-service waited 2.1 s on</text><text class="sm" x="48" y="272">a Redis call that timed out.</text></g><rect class="box" x="636" y="90" width="136" height="92" rx="10" stroke-width="1.5"/><text class="sm" x="704" y="121" text-anchor="middle" font-weight="700">Logs</text><text class="sm" x="704" y="141" text-anchor="middle">traceId=4bf9…</text><text class="sm" x="704" y="161" text-anchor="middle">pool 50/50 used</text><g class="k s4"><rect class="okf" x="636" y="90" width="136" height="92" rx="10"/><text class="on13" x="704" y="118" text-anchor="middle">Logs</text><text class="on13" x="704" y="138" text-anchor="middle">traceId=4bf9…</text><text class="on13" x="704" y="158" text-anchor="middle">pool 50/50 used</text><rect class="bm" x="28" y="206" width="744" height="74" rx="10"/><text class="lbl" x="48" y="232">Step 5: Logs</text><text class="sm" x="48" y="254">Logs filtered by traceId 4bf9…: Redis pool</text><text class="sm" x="48" y="272">exhausted, 50 of 50 connections in use.</text></g><rect class="bp" x="28" y="298" width="744" height="30" rx="15" stroke-width="1.2"/><text class="prit" x="400" y="318" text-anchor="middle" style="font-size:13px">trace ID 4bf9… carried: metric exemplar → trace → log field</text>
</svg>
