<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 382" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">pandas merge row explosion</title>
  <desc id="d">Three tables. Visits has three rows: v1 at clinic C1, v2 at C2 and v3 at C9. The clinics reference table lists C2 twice, as Thane and Thane W. A left merge returns four rows: v2 is duplicated, and v3 has no clinic name. Adding validate many_to_one raises a MergeError because the right keys are not unique, and indicator true flags v3 as left_only because C9 is missing. Check row counts against the grain after every join.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="380" rx="14"/>
  <text class="h" x="28" y="40">A join that silently multiplies rows</text><text class="sub" x="28" y="62">visits.merge(clinics, on="clinic_id", how="left"): the reference file has a duplicate key.</text><text class="sm" x="28" y="96" font-weight="700">visits (3 rows)</text><text class="sub" x="38" y="122">visit</text><text class="sub" x="130" y="122">clinic_id</text><rect class="box" x="28" y="132" width="184" height="24" rx="4" stroke-width="1"/><text class="mono" x="38" y="149" xml:space="preserve">v1</text><text class="mono" x="130" y="149" xml:space="preserve">C1</text><rect class="box" x="28" y="158" width="184" height="24" rx="4" stroke-width="1"/><text class="mono" x="38" y="175" xml:space="preserve">v2</text><text class="mono" x="130" y="175" xml:space="preserve">C2</text><rect class="box" x="28" y="184" width="184" height="24" rx="4" stroke-width="1"/><text class="mono" x="38" y="201" xml:space="preserve">v3</text><text class="mono" x="130" y="201" xml:space="preserve">C9</text><text class="sm" x="250" y="96" font-weight="700">clinics (C2 appears twice)</text><text class="sub" x="260" y="122">clinic_id</text><text class="sub" x="352" y="122">name</text><rect class="box" x="250" y="132" width="184" height="24" rx="4" stroke-width="1"/><text class="mono" x="260" y="149" xml:space="preserve">C1</text><text class="mono" x="352" y="149" xml:space="preserve">Pune</text><rect class="bb" x="250" y="158" width="184" height="24" rx="4" stroke-width="1"/><text class="mono" x="260" y="175" xml:space="preserve">C2</text><text class="mono" x="352" y="175" xml:space="preserve">Thane</text><rect class="bb" x="250" y="184" width="184" height="24" rx="4" stroke-width="1"/><text class="mono" x="260" y="201" xml:space="preserve">C2</text><text class="mono" x="352" y="201" xml:space="preserve">Thane W</text><text class="sm" x="510" y="96" font-weight="700">result (4 rows!)</text><text class="sub" x="520" y="122">visit</text><text class="sub" x="612" y="122">name</text><rect class="box" x="510" y="132" width="184" height="24" rx="4" stroke-width="1"/><text class="mono" x="520" y="149" xml:space="preserve">v1</text><text class="mono" x="612" y="149" xml:space="preserve">Pune</text><rect class="bb" x="510" y="158" width="184" height="24" rx="4" stroke-width="1"/><text class="mono" x="520" y="175" xml:space="preserve">v2</text><text class="mono" x="612" y="175" xml:space="preserve">Thane</text><rect class="bb" x="510" y="184" width="184" height="24" rx="4" stroke-width="1"/><text class="mono" x="520" y="201" xml:space="preserve">v2</text><text class="mono" x="612" y="201" xml:space="preserve">Thane W</text><rect class="box" x="510" y="210" width="184" height="24" rx="4" stroke-width="1"/><text class="mono" x="520" y="227" xml:space="preserve">v3</text><text class="mono" x="612" y="227" xml:space="preserve">NaN</text><line class="ln" x1="222" y1="160" x2="244" y2="160" marker-end="url(#ar)"/><line class="ln" x1="442" y1="160" x2="504" y2="160" marker-end="url(#ar)"/><rect class="bm" x="28" y="250" width="744" height="86" rx="8"/><text class="mono" x="42" y="274" xml:space="preserve">out = visits.merge(clinics, on="clinic_id", how="left",</text><text class="mono" x="42" y="294" xml:space="preserve">                   validate="many_to_one", indicator=True)</text><text class="mono" x="42" y="318" xml:space="preserve"># MergeError: right keys not unique · _merge == "left_only" flags v3 (C9 missing)</text><text class="sm" x="28" y="362">Check row counts against the grain after every join: 3 visits in, 3 rows out.</text>
</svg>
