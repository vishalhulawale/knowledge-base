<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 452" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Single table, three reads</title>
  <desc id="d">Animation. A single DynamoDB table holds nine items for datasets d1 and d2: dataset META items, access requests, user grant items and versions, sorted by sort key under each dataset's partition key. First, a Query on DS#d1 highlights its six items: details, the pending request, grants and versions in one request. Next, the inverted index GSI2, which holds only grant items keyed by user, highlights USER#u7's grants to d1 and d2, the same items read from the user's side. Finally the sparse GSI1 shows only the one pending request for organisation o1, because the approved request no longer carries the index keys. The data is illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes h1{0%,2.99%{opacity:0}3%,32.99%{opacity:1}33%,100%{opacity:0}}.h1{animation-name:h1}
    @keyframes h2{0%,34.99%{opacity:0}35%,65.99%{opacity:1}66%,100%{opacity:0}}.h2{animation-name:h2}
    @keyframes h3{0%,67.99%{opacity:0}68%,97.99%{opacity:1}98%,100%{opacity:0}}.h3{animation-name:h3}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.h2{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="450" rx="14"/>
  <text class="h" x="28" y="40">One table, three ways to read the same items</text><text class="sub" x="28" y="62">Illustrative data-catalogue design. Base table sorted by SK inside each partition.</text><text class="lbl" x="28" y="96">Base table</text><rect class="box" x="28" y="112" width="372" height="26" rx="5" stroke-width="1"/><text class="mono" x="38" y="130" xml:space="preserve">DS#d1</text><text class="mono" x="120" y="130" xml:space="preserve">META</text><text class="sub" x="390" y="130" text-anchor="end" style="font-size:12px">dataset</text><rect class="box" x="28" y="142" width="372" height="26" rx="5" stroke-width="1"/><text class="mono" x="38" y="160" xml:space="preserve">DS#d1</text><text class="mono" x="120" y="160" xml:space="preserve">REQ#u9</text><text class="sub" x="390" y="160" text-anchor="end" style="font-size:12px">request: pending</text><rect class="box" x="28" y="172" width="372" height="26" rx="5" stroke-width="1"/><text class="mono" x="38" y="190" xml:space="preserve">DS#d1</text><text class="mono" x="120" y="190" xml:space="preserve">USER#u7</text><text class="sub" x="390" y="190" text-anchor="end" style="font-size:12px">grant</text><rect class="box" x="28" y="202" width="372" height="26" rx="5" stroke-width="1"/><text class="mono" x="38" y="220" xml:space="preserve">DS#d1</text><text class="mono" x="120" y="220" xml:space="preserve">USER#u9</text><text class="sub" x="390" y="220" text-anchor="end" style="font-size:12px">grant</text><rect class="box" x="28" y="232" width="372" height="26" rx="5" stroke-width="1"/><text class="mono" x="38" y="250" xml:space="preserve">DS#d1</text><text class="mono" x="120" y="250" xml:space="preserve">VER#0002</text><text class="sub" x="390" y="250" text-anchor="end" style="font-size:12px">version</text><rect class="box" x="28" y="262" width="372" height="26" rx="5" stroke-width="1"/><text class="mono" x="38" y="280" xml:space="preserve">DS#d1</text><text class="mono" x="120" y="280" xml:space="preserve">VER#0003</text><text class="sub" x="390" y="280" text-anchor="end" style="font-size:12px">version</text><rect class="box" x="28" y="292" width="372" height="26" rx="5" stroke-width="1"/><text class="mono" x="38" y="310" xml:space="preserve">DS#d2</text><text class="mono" x="120" y="310" xml:space="preserve">META</text><text class="sub" x="390" y="310" text-anchor="end" style="font-size:12px">dataset</text><rect class="box" x="28" y="322" width="372" height="26" rx="5" stroke-width="1"/><text class="mono" x="38" y="340" xml:space="preserve">DS#d2</text><text class="mono" x="120" y="340" xml:space="preserve">REQ#u7</text><text class="sub" x="390" y="340" text-anchor="end" style="font-size:12px">request: approved</text><rect class="box" x="28" y="352" width="372" height="26" rx="5" stroke-width="1"/><text class="mono" x="38" y="370" xml:space="preserve">DS#d2</text><text class="mono" x="120" y="370" xml:space="preserve">USER#u7</text><text class="sub" x="390" y="370" text-anchor="end" style="font-size:12px">grant</text><g class="k h1"><rect class="tea" x="28" y="112" width="372" height="26" rx="5"/><text class="on13" x="38" y="130">DS#d1</text><text class="on13" x="120" y="130">META</text><text class="on13" x="390" y="130" text-anchor="end" style="font-size:12px">dataset</text><rect class="tea" x="28" y="142" width="372" height="26" rx="5"/><text class="on13" x="38" y="160">DS#d1</text><text class="on13" x="120" y="160">REQ#u9</text><text class="on13" x="390" y="160" text-anchor="end" style="font-size:12px">request: pending</text><rect class="tea" x="28" y="172" width="372" height="26" rx="5"/><text class="on13" x="38" y="190">DS#d1</text><text class="on13" x="120" y="190">USER#u7</text><text class="on13" x="390" y="190" text-anchor="end" style="font-size:12px">grant</text><rect class="tea" x="28" y="202" width="372" height="26" rx="5"/><text class="on13" x="38" y="220">DS#d1</text><text class="on13" x="120" y="220">USER#u9</text><text class="on13" x="390" y="220" text-anchor="end" style="font-size:12px">grant</text><rect class="tea" x="28" y="232" width="372" height="26" rx="5"/><text class="on13" x="38" y="250">DS#d1</text><text class="on13" x="120" y="250">VER#0002</text><text class="on13" x="390" y="250" text-anchor="end" style="font-size:12px">version</text><rect class="tea" x="28" y="262" width="372" height="26" rx="5"/><text class="on13" x="38" y="280">DS#d1</text><text class="on13" x="120" y="280">VER#0003</text><text class="on13" x="390" y="280" text-anchor="end" style="font-size:12px">version</text></g><g class="k h2"><rect class="pri" x="28" y="172" width="372" height="26" rx="5"/><text class="on13" x="38" y="190">DS#d1</text><text class="on13" x="120" y="190">USER#u7</text><text class="on13" x="390" y="190" text-anchor="end" style="font-size:12px">grant</text><rect class="pri" x="28" y="202" width="372" height="26" rx="5"/><text class="on13" x="38" y="220">DS#d1</text><text class="on13" x="120" y="220">USER#u9</text><text class="on13" x="390" y="220" text-anchor="end" style="font-size:12px">grant</text><rect class="pri" x="28" y="352" width="372" height="26" rx="5"/><text class="on13" x="38" y="370">DS#d2</text><text class="on13" x="120" y="370">USER#u7</text><text class="on13" x="390" y="370" text-anchor="end" style="font-size:12px">grant</text></g><g class="k h3"><rect class="wrnf" x="28" y="142" width="372" height="26" rx="5"/><text class="on13" x="38" y="160">DS#d1</text><text class="on13" x="120" y="160">REQ#u9</text><text class="on13" x="390" y="160" text-anchor="end" style="font-size:12px">request: pending</text></g><text class="lbl" x="432" y="96">GSI2: inverted (grant items only)</text><rect class="box" x="432" y="112" width="340" height="26" rx="5" stroke-width="1"/><text class="mono" x="442" y="130" xml:space="preserve">USER#u7</text><text class="mono" x="552" y="130" xml:space="preserve">DS#d1</text><rect class="box" x="432" y="142" width="340" height="26" rx="5" stroke-width="1"/><text class="mono" x="442" y="160" xml:space="preserve">USER#u7</text><text class="mono" x="552" y="160" xml:space="preserve">DS#d2</text><rect class="box" x="432" y="172" width="340" height="26" rx="5" stroke-width="1"/><text class="mono" x="442" y="190" xml:space="preserve">USER#u9</text><text class="mono" x="552" y="190" xml:space="preserve">DS#d1</text><g class="k h2"><rect class="pri" x="432" y="112" width="340" height="26" rx="5"/><text class="on13" x="442" y="130">USER#u7</text><text class="on13" x="552" y="130">DS#d1</text><rect class="pri" x="432" y="142" width="340" height="26" rx="5"/><text class="on13" x="442" y="160">USER#u7</text><text class="on13" x="552" y="160">DS#d2</text></g><text class="lbl" x="432" y="236">GSI1 (sparse): pending requests only</text><rect class="box" x="432" y="250" width="340" height="26" rx="5" stroke-width="1"/><text class="mono" x="442" y="268" xml:space="preserve">PENDING#ORG#o1</text><text class="mono" x="628" y="268" xml:space="preserve">2026-10-01T16:40</text><g class="k h3"><rect class="wrnf" x="432" y="250" width="340" height="26" rx="5"/><text class="on13" x="442" y="268">PENDING#ORG#o1</text><text class="on13" x="628" y="268">2026-10-01T16:40</text></g><text class="sub" x="432" y="302" style="font-size:12px">REQ#u7 was approved: its GSI1 keys were</text><text class="sub" x="432" y="318" style="font-size:12px">removed, so it left the index.</text><g class="k h1"><text class="teat" x="28" y="410" style="font-size:15px" font-family="ui-monospace,Menlo,Consolas,monospace">Query PK = DS#d1</text><text class="sm" x="28" y="432">details, pending request, grants and versions: one request</text></g><g class="k h2"><text class="prit" x="28" y="410" style="font-size:15px" font-family="ui-monospace,Menlo,Consolas,monospace">Query GSI2 PK = USER#u7</text><text class="sm" x="28" y="432">the same grant items, read from the user’s side: d1, d2</text></g><g class="k h3"><text class="wrnt" x="28" y="410" style="font-size:15px" font-family="ui-monospace,Menlo,Consolas,monospace">Query GSI1 PK = PENDING#ORG#o1</text><text class="sm" x="28" y="432">only the work still to do; no filter needed</text></g>
</svg>
