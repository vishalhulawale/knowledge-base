<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Staged autonomy rollout</title>
  <desc id="d">Animation: four rising steps light up in turn: offline evals on a golden set, shadow mode on live traffic that nobody sees, assist mode where humans decide every case, and selective automation earned per slice. Gates between them are an eval threshold, agreement with human decisions, and high acceptance with guardrails held. Finally a red arrow shows drift or an incident moving a slice back down to assist.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes s0{0%,3.99%{opacity:0}4%,21.99%{opacity:1}22%,100%{opacity:0}}.s0{animation-name:s0}
    @keyframes s1{0%,21.99%{opacity:0}22%,39.99%{opacity:1}40%,100%{opacity:0}}.s1{animation-name:s1}
    @keyframes s2{0%,39.99%{opacity:0}40%,57.99%{opacity:1}58%,100%{opacity:0}}.s2{animation-name:s2}
    @keyframes s3{0%,57.99%{opacity:0}58%,75.99%{opacity:1}76%,100%{opacity:0}}.s3{animation-name:s3}
    @keyframes back{0%,75.99%{opacity:0}76%,96.99%{opacity:1}97%,100%{opacity:0}}.back{animation-name:back}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.s3,.back{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="358" rx="14"/>
  <text class="h" x="28" y="40">Autonomy is earned, and can be withdrawn</text><text class="sub" x="28" y="62">Each step needs its gate; drift or an incident moves a slice back down.</text><rect class="bm" x="40" y="240" width="170" height="70" rx="8"/><text class="sm" x="52" y="264" font-weight="700">Offline evals</text><text class="sub" x="52" y="284">golden set</text><g class="k s0"><rect class="tea" x="40" y="240" width="170" height="70" rx="8" fill-opacity="0.3"/></g><line class="lno" x1="160" y1="232" x2="266" y2="194" marker-end="url(#aro)"/><text class="okt" x="190" y="206" text-anchor="end" style="font-size:11.5px">eval threshold</text><rect class="bm" x="226" y="190" width="170" height="120" rx="8"/><text class="sm" x="238" y="214" font-weight="700">Shadow</text><text class="sub" x="238" y="234">live, nobody sees it</text><g class="k s1"><rect class="tea" x="226" y="190" width="170" height="120" rx="8" fill-opacity="0.3"/></g><line class="lno" x1="346" y1="182" x2="452" y2="144" marker-end="url(#aro)"/><text class="okt" x="376" y="156" text-anchor="end" style="font-size:11.5px">agrees with humans</text><rect class="bm" x="412" y="140" width="170" height="170" rx="8"/><text class="sm" x="424" y="164" font-weight="700">Assist</text><text class="sub" x="424" y="184">humans decide all</text><g class="k s2"><rect class="tea" x="412" y="140" width="170" height="170" rx="8" fill-opacity="0.3"/></g><line class="lno" x1="532" y1="132" x2="638" y2="94" marker-end="url(#aro)"/><text class="okt" x="562" y="106" text-anchor="end" style="font-size:11.5px">acceptance + guardrails</text><rect class="bm" x="598" y="90" width="170" height="220" rx="8"/><text class="sm" x="610" y="114" font-weight="700">Selective auto</text><text class="sub" x="610" y="134">earned per slice</text><g class="k s3"><rect class="tea" x="598" y="90" width="170" height="220" rx="8" fill-opacity="0.3"/></g><g class="k back"><path class="lnb dash" d="M 646 214 C 630 214, 610 230, 586 236" marker-end="url(#arb)"/><text class="badt" x="700" y="256" text-anchor="middle" style="font-size:12.5px">drift or incident:</text><text class="badt" x="700" y="272" text-anchor="middle" style="font-size:12.5px">back to assist</text></g><text class="sm" x="28" y="340">Measure per action type and slice; keep a kill switch; never let a model upgrade silently change an automated path.</text>
</svg>
