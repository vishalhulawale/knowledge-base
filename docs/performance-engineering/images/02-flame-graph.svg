<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Annotated CPU flame graph</title>
  <desc id="d">A CPU flame graph for one pricing endpoint. Thread, Tomcat, DispatcherServlet and ClaimController frames form a full-width base. Above the controller, ObjectMapper serialisation takes 18 percent and PricingService 82 percent. PricingService splits into Logback encoding 9 percent, RuleEngine.evaluate 60 percent and ClaimRepository 13 percent. Above the rule engine, BigDecimal.divide is a wide plateau with nothing on top, 41 percent of samples, and Rule.matches takes 15 percent. Notes explain that a wide top edge is self time, that the first frame of your own code below it is what to change, and that the wide base is on every stack. Percentages are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="356" rx="14"/>
  <text class="h" x="28" y="40">Reading a CPU flame graph</text><text class="sub" x="28" y="62">One pricing endpoint, 60 s of samples. Percentages are share of samples; illustrative.</text><rect class="bm" x="40" y="280" width="565" height="24" rx="2" stroke-width="1"/><text class="sm" x="45" y="297" style="font-size:12px">Thread.run</text><rect class="bm" x="40" y="254" width="565" height="24" rx="2" stroke-width="1"/><text class="sm" x="45" y="271" style="font-size:12px">Tomcat SocketProcessor.run</text><rect class="bm" x="40" y="228" width="565" height="24" rx="2" stroke-width="1"/><text class="sm" x="45" y="245" style="font-size:12px">DispatcherServlet.doService</text><rect class="bp" x="40" y="202" width="565" height="24" rx="2" stroke-width="1"/><text class="sm" x="45" y="219" style="font-size:12px">ClaimController.price</text><rect class="bt" x="40" y="176" width="100.88" height="24" rx="2" stroke-width="1"/><text class="sm" x="45" y="193" style="font-size:12px">ObjectMapper…</text><rect class="bp" x="141.88" y="176" width="463.12" height="24" rx="2" stroke-width="1"/><text class="sm" x="146.88" y="193" style="font-size:12px">PricingService.price</text><rect class="bt" x="40" y="150" width="83.9" height="24" rx="2" stroke-width="1"/><text class="sm" x="45" y="167" style="font-size:12px">JsonGener…</text><rect class="bt" x="141.88" y="150" width="49.94" height="24" rx="2" stroke-width="1"/><text class="sm" x="146.88" y="167" style="font-size:12px">Logba…</text><rect class="bp" x="192.82" y="150" width="338.6" height="24" rx="2" stroke-width="1"/><text class="sm" x="197.82" y="167" style="font-size:12px">RuleEngine.evaluate</text><rect class="bt" x="532.42" y="150" width="72.58" height="24" rx="2" stroke-width="1"/><text class="sm" x="537.42" y="167" style="font-size:12px">ClaimRep…</text><rect class="wrnf" x="192.82" y="124" width="231.06" height="24" rx="2" stroke-width="1"/><text class="on13" x="197.82" y="141" style="font-size:12px">BigDecimal.divide</text><rect class="bp" x="424.88" y="124" width="83.9" height="24" rx="2" stroke-width="1"/><text class="sm" x="429.88" y="141" style="font-size:12px">Rule.matc…</text><rect class="bt" x="532.42" y="124" width="55.6" height="24" rx="2" stroke-width="1"/><text class="sm" x="537.42" y="141" style="font-size:12px">Hiber…</text><text class="sm" x="620" y="80" style="font-size:12px">Plateau: wide top edge</text><text class="sm" x="620" y="97" style="font-size:12px">= self time. 41% of</text><text class="sm" x="620" y="114" style="font-size:12px">CPU in BigDecimal.divide</text><line class="ln" x1="616" y1="76" x2="366.02" y2="148" marker-end="url(#ar)" style="stroke-width:1.3"/><text class="sm" x="620" y="194" style="font-size:12px">Your first frame below</text><text class="sm" x="620" y="211" style="font-size:12px">the plateau: the call</text><text class="sm" x="620" y="228" style="font-size:12px">to change</text><line class="ln" x1="616" y1="190" x2="512.42" y2="164" marker-end="url(#ar)" style="stroke-width:1.3"/><text class="sm" x="620" y="264" style="font-size:12px">Wide base: on every</text><text class="sm" x="620" y="281" style="font-size:12px">stack, not the problem</text><line class="ln" x1="616" y1="260" x2="600" y2="268" marker-end="url(#ar)" style="stroke-width:1.3"/><line class="ln" x1="26" y1="304" x2="26" y2="124" marker-end="url(#ar)"/><text class="sub" x="20" y="215" text-anchor="middle" transform="rotate(-90 20 215.0)">stack depth</text><line class="ln" x1="40" y1="320" x2="606" y2="320" marker-end="url(#ar)"/><text class="sub" x="40" y="338">width = share of samples (x order is alphabetical, not time). Colour is frame type, not duration.</text>
</svg>
