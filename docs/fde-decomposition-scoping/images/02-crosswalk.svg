<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 344" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Identity crosswalk across systems</title>
  <desc id="d">Three source systems hold the same patient under different identifiers: the EHR as MRN 0048213, the bed board as pt_id P-7731 and billing as account 99-1204-A. Arrows lead into a crosswalk table that maps each system and local id to one patient_key, 1001. The crosswalk feeds a single Patient object with a source of truth per field, for example EHR for the name and the bed board for location. Never join on names. The IDs are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="342" rx="14"/>
  <text class="h" x="28" y="40">Same patient, three names: join through a crosswalk</text><text class="sub" x="28" y="62">IDs are illustrative. Never join on names: "R. Sharma" may or may not be "Rahul Sharma".</text><rect class="bm" x="28" y="96" width="170" height="50" rx="8" stroke-width="1.5"/><text class="sm" x="113" y="117" text-anchor="middle" font-weight="700">EHR</text><text class="sm" x="113" y="135" text-anchor="middle">MRN 0048213</text><line class="ln" x1="200" y1="121" x2="254" y2="170" marker-end="url(#ar)"/><rect class="bm" x="28" y="162" width="170" height="50" rx="8" stroke-width="1.5"/><text class="sm" x="113" y="183" text-anchor="middle" font-weight="700">Bed board</text><text class="sm" x="113" y="201" text-anchor="middle">pt_id P-7731</text><line class="ln" x1="200" y1="187" x2="254" y2="187" marker-end="url(#ar)"/><rect class="bm" x="28" y="228" width="170" height="50" rx="8" stroke-width="1.5"/><text class="sm" x="113" y="249" text-anchor="middle" font-weight="700">Billing</text><text class="sm" x="113" y="267" text-anchor="middle">acct 99-1204-A</text><line class="ln" x1="200" y1="253" x2="254" y2="170" marker-end="url(#ar)"/><rect class="box" x="258" y="100" width="270" height="140" rx="8"/><text class="sm" x="272" y="124" font-weight="700">crosswalk</text><text class="sub" x="272" y="150">patient_key</text><text class="sub" x="358" y="150">system</text><text class="sub" x="444" y="150">local_id</text><text class="mono" x="272" y="174">1001</text><text class="mono" x="358" y="174">EHR</text><text class="mono" x="444" y="174">0048213</text><text class="mono" x="272" y="198">1001</text><text class="mono" x="358" y="198">bed_board</text><text class="mono" x="444" y="198">P-7731</text><text class="mono" x="272" y="222">1001</text><text class="mono" x="358" y="222">billing</text><text class="mono" x="444" y="222">99-1204-A</text><line class="ln" x1="530" y1="170" x2="584" y2="170" marker-end="url(#ar)"/><rect class="bt" x="588" y="112" width="184" height="116" rx="10" stroke-width="1.5"/><text class="sm" x="602" y="138">Patient</text><text class="sm" x="602" y="156">patient_key 1001</text><text class="sm" x="602" y="174">source of truth per</text><text class="sm" x="602" y="192">field: EHR for name,</text><text class="sm" x="602" y="210">bed board for location</text><text class="sm" x="28" y="300">The crosswalk (or a master patient index) is usually the hardest part of a real</text><text class="sm" x="28" y="318">deployment; in the round, name it and say which system owns each field.</text>
</svg>
