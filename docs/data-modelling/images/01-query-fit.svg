<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 394" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Planned versus unplanned query</title>
  <desc id="d">Animation in two steps comparing a relational store and a document store holding the same orders. Query one, a member's recent orders with their lines, is a three-table join through two indexes in the relational store, fast enough, and a single indexed read of one document in the document store, the fastest. Query two, a new question about every order containing a recalled drug since June, needs only one new index on the order line table in the relational store, while the document store must scan every order or first build a multikey index on the embedded lines. Timings are qualitative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes q1{0%,47.99%{opacity:1}48%,100%{opacity:0}}.q1{animation-name:q1}
    @keyframes q2{0%,49.99%{opacity:0}50%,97.99%{opacity:1}98%,100%{opacity:0}}.q2{animation-name:q2}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.q2{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="392" rx="14"/>
  <text class="h" x="28" y="40">The query you planned, and the one you didn't</text><text class="sub" x="28" y="62">Same order data in two stores. Timings are qualitative, not measured.</text><rect class="bm" x="20" y="120" width="372" height="200" rx="10" stroke-width="1.2"/><rect class="bm" x="408" y="120" width="372" height="200" rx="10" stroke-width="1.2"/><text class="lbl" x="36" y="144">Relational (normalised)</text><text class="lbl" x="424" y="144">Document (orders embed their lines)</text><rect class="box" x="36" y="160" width="104" height="78" rx="6" stroke-width="1.2"/><text class="sm" x="88" y="180" text-anchor="middle" font-weight="700">member</text><text class="sub" x="44" y="202">id</text><text class="sub" x="44" y="218">name</text><rect class="box" x="154" y="160" width="104" height="78" rx="6" stroke-width="1.2"/><text class="sm" x="206" y="180" text-anchor="middle" font-weight="700">rx_order</text><text class="sub" x="162" y="202">id, member_id</text><text class="sub" x="162" y="218">status, date</text><rect class="box" x="272" y="160" width="104" height="78" rx="6" stroke-width="1.2"/><text class="sm" x="324" y="180" text-anchor="middle" font-weight="700">order_line</text><text class="sub" x="280" y="202">order_id, ndc</text><text class="sub" x="280" y="218">qty</text><line class="ln" x1="140" y1="199" x2="154" y2="199"/><line class="ln" x1="258" y1="199" x2="272" y2="199"/><rect class="box" x="424" y="160" width="108" height="78" rx="6" stroke-width="1.2"/><text class="mono" x="432" y="180" xml:space="preserve">order</text><text class="mono" x="432" y="195" xml:space="preserve">memberId</text><text class="mono" x="432" y="210" xml:space="preserve">lines: [</text><text class="mono" x="432" y="225" xml:space="preserve"> {ndc, qty} ]</text><rect class="box" x="544" y="160" width="108" height="78" rx="6" stroke-width="1.2"/><text class="mono" x="552" y="180" xml:space="preserve">order</text><text class="mono" x="552" y="195" xml:space="preserve">memberId</text><text class="mono" x="552" y="210" xml:space="preserve">lines: [</text><text class="mono" x="552" y="225" xml:space="preserve"> {ndc, qty} ]</text><rect class="box" x="664" y="160" width="108" height="78" rx="6" stroke-width="1.2"/><text class="mono" x="672" y="180" xml:space="preserve">order</text><text class="mono" x="672" y="195" xml:space="preserve">memberId</text><text class="mono" x="672" y="210" xml:space="preserve">lines: [</text><text class="mono" x="672" y="225" xml:space="preserve"> {ndc, qty} ]</text><g class="k q1"><rect class="bp" x="20" y="76" width="760" height="34" rx="8" stroke-width="1.5"/><text class="prit" x="36" y="98" style="font-size:15px">Query 1 (planned):  member 42's recent orders with their lines</text><rect class="lnp" x="152" y="156" width="112" height="86" rx="8"/><rect class="lnp" x="270" y="156" width="112" height="86" rx="8"/><rect class="lnp" x="32" y="156" width="112" height="86" rx="8"/><text class="tx" x="206" y="262" text-anchor="middle">3-table join via 2 indexes</text><text class="okt" x="206" y="284" text-anchor="middle" style="font-size:14px">fast enough</text><rect class="lnt" x="420" y="156" width="116" height="86" rx="8"/><text class="tx" x="594" y="262" text-anchor="middle">1 indexed read returns the whole order</text><text class="okt" x="594" y="284" text-anchor="middle" style="font-size:14px">fastest</text></g><g class="k q2"><rect class="bw" x="20" y="76" width="760" height="34" rx="8" stroke-width="1.5"/><text class="wrnt" x="36" y="98" style="font-size:15px">Query 2 (new):  every order containing recalled drug X since June</text><rect class="lnp" x="270" y="156" width="112" height="86" rx="8"/><rect class="lnp" x="152" y="156" width="112" height="86" rx="8"/><text class="tx" x="206" y="262" text-anchor="middle">add index on order_line(ndc), join</text><text class="okt" x="206" y="284" text-anchor="middle" style="font-size:14px">one migration, done</text><rect class="lnb" x="420" y="156" width="116" height="86" rx="8"/><rect class="lnb" x="540" y="156" width="116" height="86" rx="8"/><rect class="lnb" x="660" y="156" width="116" height="86" rx="8"/><text class="tx" x="594" y="262" text-anchor="middle">no index on lines.ndc: scan every order</text><text class="badt" x="594" y="284" text-anchor="middle" style="font-size:14px">or build a multikey index first</text></g><text class="sm" x="28" y="352">Relational pays at read time and is rarely stuck. A query-first model pays at design time:</text><text class="sm" x="28" y="372">fastest for planned reads, costly for the question nobody listed.</text>
</svg>
