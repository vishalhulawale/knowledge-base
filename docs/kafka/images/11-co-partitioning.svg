<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Co-partitioning: why a stream-table join silently misses</title>
  <desc id="d">Claims are keyed by claimId and providers by providerId, both on 2 partitions. Claim c-1 belongs to provider prov-7. Hashed by its claimId, c-1 lands in claims partition 0, while prov-7 lives in providers partition 1. A Streams task joins partition 0 of both topics, and the join is on the record key, so c-1 is compared with providers in partition 0 by claimId and never meets prov-7: the output is empty and no error is thrown. After selectKey to providerId, Streams writes the claims through a repartition topic; c-1 is now keyed prov-7, lands in partition 1 next to prov-7, and task 1 joins them.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:12s infinite linear}
    @keyframes p0{0%,46%{opacity:1}47%{opacity:0}100%{opacity:0}}
    .p0{animation-name:p0}
    @keyframes p1{0%{opacity:0}47%{opacity:0}48%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p1{animation-name:p1}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .p0{opacity:0!important}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">claims ⋈ providers: same partition or no match</text>
  <text class="sub" x="28" y="62">Each Streams task joins partition N of one topic with partition N of the other.</text>
  <rect class="bm" x="28" y="86" width="364" height="196" rx="12" stroke-width="1"/>
  <text class="lbl" x="42" y="108">task 0  (partition 0 of each side)</text>
  <text class="sm a p0" x="42" y="136">claims</text>
  <text class="sm a p1" x="42" y="136">claims-by-provider (repartition)</text>
  <rect class="box" x="42" y="144" width="336" height="46" rx="8"/>
  <text class="sm" x="42" y="216">providers P0</text>
  <rect class="box" x="42" y="224" width="336" height="46" rx="8"/>
  <rect class="bm" x="408" y="86" width="364" height="196" rx="12" stroke-width="1"/>
  <text class="lbl" x="422" y="108">task 1  (partition 1 of each side)</text>
  <text class="sm a p0" x="422" y="136">claims</text>
  <text class="sm a p1" x="422" y="136">claims-by-provider (repartition)</text>
  <rect class="box" x="422" y="144" width="336" height="46" rx="8"/>
  <text class="sm" x="422" y="216">providers P1</text>
  <rect class="box" x="422" y="224" width="336" height="46" rx="8"/>
  <rect class="tea" x="42" y="230" width="150" height="34" rx="6"/>
  <text class="on13" x="117" y="251.5" text-anchor="middle">prov-3: Acme Rx</text>
  <rect class="tea" x="422" y="230" width="150" height="34" rx="6"/>
  <text class="on13" x="497" y="251.5" text-anchor="middle">prov-7: City Pharm</text>
  <g class="a p0">
  <rect class="pri" x="42" y="150" width="150" height="34" rx="6"/>
  <text class="on13" x="117" y="171.5" text-anchor="middle">c-1 (key c-1)</text>
  </g>
  <g class="a p0">
  <rect class="pri" x="422" y="150" width="150" height="34" rx="6"/>
  <text class="on13" x="497" y="171.5" text-anchor="middle">c-2 (key c-2)</text>
  </g>
  <text class="sm badt a p0" x="208" y="172">looks for key c-1 ✕</text>
  <text class="sm badt a p0" x="588" y="172">looks for key c-2 ✕</text>
  <g class="a p1">
  <rect class="okf" x="422" y="150" width="150" height="34" rx="6"/>
  <text class="on13" x="497" y="171.5" text-anchor="middle">c-1 (key prov-7)</text>
  </g>
  <g class="a p1">
  <rect class="okf" x="42" y="150" width="150" height="34" rx="6"/>
  <text class="on13" x="117" y="171.5" text-anchor="middle">c-2 (key prov-3)</text>
  </g>
  <text class="sm okt a p1" x="588" y="172">matches prov-7 ✓</text>
  <text class="sm okt a p1" x="208" y="172">matches prov-3 ✓</text>
  <text class="tx badt a p0" x="28" y="316">Keyed by claimId: no claim key equals a provider key, so the join emits nothing.</text>
  <text class="sub a p0" x="28" y="336">No exception, no log line. Just an empty output topic.</text>
  <text class="tx okt a p1" x="28" y="316">selectKey(providerId) → repartition topic: c-1 moves next to prov-7.</text>
  <text class="sub a p1" x="28" y="336">Streams adds the repartition topic for you; it costs an extra write and read.</text>
  <text class="lbl" x="28" y="380">Co-partitioning = same key, same partition count, same partitioner on both sides.</text>
  <text class="sub" x="28" y="404">A GlobalKTable avoids it entirely: every instance holds all providers.</text>
</svg>
