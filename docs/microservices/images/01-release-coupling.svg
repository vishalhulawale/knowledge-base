@keyframes m20{0%,59%{opacity:0}61%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes m21{0%,77.4%{opacity:0}79.4%,92%{opacity:1}96%,100%{opacity:0}}

    @keyframes cur{0%{transform:translateX(0)}80%,92%{transform:translateX(610px)}96%,100%{transform:translateX(610px);opacity:0}}
    .cur{animation:cur 10s infinite linear}
    @media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.cur{animation:none;transform:translateX(610px)}}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
