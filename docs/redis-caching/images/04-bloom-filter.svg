  <line class="arr bads dash " x1="250" y1="282" x2="439.1" y2="253.3"/><path class="badf " d="M448.0 252 L439.8 257.8 L438.4 248.9z"/>
  <line class="arr bads dash " x1="250" y1="282" x2="679.0" y2="252.6"/><path class="badf " d="M688.0 252 L679.3 257.1 L678.7 248.1z"/>
  <rect class="box" x="178" y="282" width="144" height="34" rx="8"/><text class="badt" x="250" y="304" text-anchor="middle" font-size="14">GET id 99999999</text>
  <line class="arr warns dash " x1="560" y1="282" x2="257.0" y2="252.9"/><path class="warnf " d="M248.0 252 L257.4 248.4 L256.5 257.3z"/>
  <line class="arr warns dash " x1="560" y1="282" x2="336.9" y2="253.2"/><path class="warnf " d="M328.0 252 L337.5 248.7 L336.3 257.6z"/>
  <line class="arr warns dash " x1="560" y1="282" x2="600.4" y2="256.8"/><path class="warnf " d="M608.0 252 L602.8 260.6 L598.0 253.0z"/>
  <rect class="box" x="488" y="282" width="144" height="34" rx="8"/><text class="warnt" x="560" y="304" text-anchor="middle" font-size="14">GET id 5150</text>
  <rect class="soft-bad" x="267" y="187" width="42" height="42" rx="7" fill-opacity="0" stroke-width="2.5"/>
  <text class="badt" x="250" y="342" text-anchor="middle" font-size="14">bit 3 is 0: definitely absent</text>
  <text class="sm" x="250" y="362" text-anchor="middle">return 404, skip cache and DB</text>
  <text class="warnt" x="560" y="342" text-anchor="middle" font-size="14">all 1, set by other ids: maybe</text>
  <text class="sm" x="560" y="362" text-anchor="middle">a false positive: check cache, then DB</text>
  <text class="sub" x="28" y="396">Simplified to 16 bits and 3 hashes. The test used 2²⁰ bits and 7 hashes: 0.67% false positives for 100,000 ids.</text>
</svg>
