<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Take-home presentation plan</title>
  <desc id="d">A ten-minute timeline: user and problem in minute one, a live demo of the after from minutes one to four, how it works from four to six, how we know it works with evals from six to eight, limits, then next steps. An example opening starts with a claims handler's question and goes straight to the demo, instead of opening with frameworks and code.</desc>
