<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">What one render error does with and without boundaries</title>
  <desc id="d">Two copies of the prescriptions page, each with an app shell, a prescriptions list and a pharmacy map. PharmacyMap throws an error during render. On the left, with no error boundary, React unmounts the whole tree and the member sees a blank page. On the right, with route and widget boundaries, only the map's boundary shows its fallback, Map unavailable, while the shell and the prescriptions list keep working.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .page{fill:#ffffff;stroke:#cbd5e1}
    .blank{fill:#ffffff}
    .chrome{fill:#e2e8f0}
    .shell{fill:#4f46e5}
    .wt{fill:#fff;font-size:13px;font-weight:700}
    .reg{fill:none;stroke:#cbd5e1}
    .grid{stroke:#cbd5e1;stroke-width:1}
    .pin{fill:#64748b}
    .err{fill:none;stroke:#dc2626;stroke-width:3}
    .errt{fill:#dc2626;font-size:13px;font-weight:700}
    .fb{fill:#ffffff;stroke:#d97706;stroke-width:2;stroke-dasharray:5 4}
    .fbt{fill:#b45309;font-size:13px;font-weight:700}
    .ok{fill:#16a34a;font-size:14px;font-weight:700}
    .bad{fill:#dc2626;font-size:14px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .page,.fb{fill:#111827}.page{stroke:#475569}.blank{fill:#111827}
      .chrome{fill:#334155}
      .shell{fill:#818cf8}.wt{fill:#0f172a}
      .reg{stroke:#475569}.grid{stroke:#334155}.pin{fill:#94a3b8}
      .err{stroke:#f87171}.errt,.bad{fill:#f87171}
      .fb{stroke:#fbbf24}.fbt{fill:#fbbf24}.ok{fill:#4ade80}
    }
    /* 10 s loop: map throws at 25%, outcome at 42% */
    .a{opacity:0;animation:10s infinite linear}
    @keyframes th{0%,24%{opacity:0}26%,41%{opacity:1}43%,100%{opacity:0}}
    @keyframes oc{0%,41%{opacity:0}43%,93%{opacity:1}97%,100%{opacity:0}}
    @keyframes rs{0%,49%{opacity:0}53%,93%{opacity:1}97%,100%{opacity:0}}
    .th{animation-name:th}.oc{animation-name:oc}.rs{animation-name:rs}
    @media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.th{opacity:0}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">One render error: blank page or one broken widget?</text>
  <text class="sub" x="28" y="62">PharmacyMap throws while rendering.</text>

  <text class="lbl" x="28" y="98">No error boundary</text>
  <text class="lbl" x="420" y="98">Route + widget boundaries</text>

  <!-- left mock -->
  <rect class="page" x="28" y="110" width="352" height="214" rx="9"/>
  <path class="chrome" d="M28 119 a9 9 0 0 1 9 -9 H371 a9 9 0 0 1 9 9 V130 H28 Z"/>
  <g>
    <rect class="shell" x="38" y="138" width="332" height="28" rx="5"/><text class="wt" x="50" y="157">App shell: nav</text>
    <rect class="reg" x="38" y="174" width="176" height="140" rx="6"/>
    <text class="tx" x="48" y="196">Atorvastatin</text><text class="tx" x="48" y="222">Lisinopril</text><text class="tx" x="48" y="248">Metformin</text><text class="tx" x="48" y="274">Amlodipine</text>
    <text class="sub" x="48" y="300">RxList</text>
    <rect class="reg" x="222" y="174" width="148" height="140" rx="6"/>
    <path class="grid" d="M222 208 H370 M222 242 H370 M222 276 H370 M259 174 V314 M296 174 V314 M333 174 V314"/>
    <circle class="pin" cx="262" cy="226" r="6"/><circle class="pin" cx="322" cy="264" r="6"/>
  </g>
  <g class="a th"><rect class="err" x="222" y="174" width="148" height="140" rx="6"/><text class="errt" x="296" y="300" text-anchor="middle">throws</text></g>
  <g class="a oc">
    <rect class="blank" x="29" y="131" width="350" height="192"/>
    <text class="sub" x="204" y="222" text-anchor="middle">(blank page)</text>
    <text class="sub" x="204" y="242" text-anchor="middle">React unmounted the whole tree</text>
  </g>

  <!-- right mock -->
  <rect class="page" x="420" y="110" width="352" height="214" rx="9"/>
  <path class="chrome" d="M420 119 a9 9 0 0 1 9 -9 H763 a9 9 0 0 1 9 9 V130 H420 Z"/>
  <rect class="shell" x="430" y="138" width="332" height="28" rx="5"/><text class="wt" x="442" y="157">App shell: nav</text>
  <rect class="reg" x="430" y="174" width="176" height="140" rx="6"/>
  <text class="tx" x="440" y="196">Atorvastatin</text><text class="tx" x="440" y="222">Lisinopril</text><text class="tx" x="440" y="248">Metformin</text><text class="tx" x="440" y="274">Amlodipine</text>
  <text class="sub" x="440" y="300">RxList</text>
  <rect class="reg" x="614" y="174" width="148" height="140" rx="6"/>
  <path class="grid" d="M614 208 H762 M614 242 H762 M614 276 H762 M651 174 V314 M688 174 V314 M725 174 V314"/>
  <circle class="pin" cx="654" cy="226" r="6"/><circle class="pin" cx="714" cy="264" r="6"/>
  <g class="a th"><rect class="err" x="614" y="174" width="148" height="140" rx="6"/><text class="errt" x="688" y="300" text-anchor="middle">throws</text></g>
  <g class="a oc">
    <rect class="fb" x="614" y="174" width="148" height="140" rx="6"/>
    <text class="fbt" x="688" y="238" text-anchor="middle">Map unavailable.</text>
    <text class="sub" x="688" y="258" text-anchor="middle">widget fallback</text>
  </g>

  <g class="a rs">
    <text class="bad" x="28" y="352">The member can't reach anything.</text>
    <text class="ok" x="420" y="352">Shell and list keep working.</text>
  </g>
  <text class="sub" x="28" y="384">Boundaries catch render errors only. Event handler and async errors need local handling or showBoundary.</text>
</svg>
