<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Stages versus DAG</title>
  <desc id="d">Two Gantt charts of the same five jobs. With plain stages, lint and unit tests run together but the integration stage cannot start until unit tests finish at 4 minutes, the image build waits for integration to finish at 9 minutes, and deploy to dev waits for the image, so the pipeline finishes at 13 minutes and lint sits idle for 2 minutes. With needs, the image build starts at 4 minutes in parallel with integration tests, deploy to dev runs at 7 minutes, and the pipeline finishes at 9 minutes when integration tests end. Durations are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="458" rx="14"/>
  <text class="h" x="28" y="40">Stages vs needs: the same five jobs</text><text class="sub" x="28" y="62">Durations illustrative (lint 2, unit 4, integration 5, image 3, deploy 1 minutes).</text><text class="lbl" x="28" y="92">stages: each stage waits for the slowest job before it</text><line class="grid" x1="160" y1="102" x2="160" y2="242"/><text class="sub" x="160" y="258" text-anchor="middle" style="font-size:12px">0 min</text><line class="grid" x1="240" y1="102" x2="240" y2="242"/><text class="sub" x="240" y="258" text-anchor="middle" style="font-size:12px">2 min</text><line class="grid" x1="320" y1="102" x2="320" y2="242"/><text class="sub" x="320" y="258" text-anchor="middle" style="font-size:12px">4 min</text><line class="grid" x1="400" y1="102" x2="400" y2="242"/><text class="sub" x="400" y="258" text-anchor="middle" style="font-size:12px">6 min</text><line class="grid" x1="480" y1="102" x2="480" y2="242"/><text class="sub" x="480" y="258" text-anchor="middle" style="font-size:12px">8 min</text><line class="grid" x1="560" y1="102" x2="560" y2="242"/><text class="sub" x="560" y="258" text-anchor="middle" style="font-size:12px">10 min</text><line class="grid" x1="640" y1="102" x2="640" y2="242"/><text class="sub" x="640" y="258" text-anchor="middle" style="font-size:12px">12 min</text><line class="grid" x1="720" y1="102" x2="720" y2="242"/><text class="sub" x="720" y="258" text-anchor="middle" style="font-size:12px">14 min</text><text class="sm" x="150" y="123" text-anchor="end">lint</text><rect class="pri" x="160" y="108" width="80" height="20" rx="4"/><rect class="bm" x="240" y="108" width="80" height="20" rx="4" stroke-dasharray="4 3"/><text class="sub" x="280" y="123" text-anchor="middle" style="font-size:12px">idle</text><text class="sm" x="150" y="149" text-anchor="end">unit tests</text><rect class="pri" x="160" y="134" width="160" height="20" rx="4"/><text class="sm" x="150" y="175" text-anchor="end">integration</text><rect class="pri" x="320" y="160" width="200" height="20" rx="4"/><text class="sm" x="150" y="201" text-anchor="end">build image</text><rect class="pri" x="520" y="186" width="120" height="20" rx="4"/><text class="sm" x="150" y="227" text-anchor="end">deploy dev</text><rect class="pri" x="640" y="212" width="40" height="20" rx="4"/><text class="badt" x="688" y="227" style="font-size:14px">done at 13 min</text><text class="lbl" x="28" y="288">needs: each job starts when its inputs are ready</text><line class="grid" x1="160" y1="298" x2="160" y2="438"/><text class="sub" x="160" y="454" text-anchor="middle" style="font-size:12px">0 min</text><line class="grid" x1="240" y1="298" x2="240" y2="438"/><text class="sub" x="240" y="454" text-anchor="middle" style="font-size:12px">2 min</text><line class="grid" x1="320" y1="298" x2="320" y2="438"/><text class="sub" x="320" y="454" text-anchor="middle" style="font-size:12px">4 min</text><line class="grid" x1="400" y1="298" x2="400" y2="438"/><text class="sub" x="400" y="454" text-anchor="middle" style="font-size:12px">6 min</text><line class="grid" x1="480" y1="298" x2="480" y2="438"/><text class="sub" x="480" y="454" text-anchor="middle" style="font-size:12px">8 min</text><line class="grid" x1="560" y1="298" x2="560" y2="438"/><text class="sub" x="560" y="454" text-anchor="middle" style="font-size:12px">10 min</text><line class="grid" x1="640" y1="298" x2="640" y2="438"/><text class="sub" x="640" y="454" text-anchor="middle" style="font-size:12px">12 min</text><line class="grid" x1="720" y1="298" x2="720" y2="438"/><text class="sub" x="720" y="454" text-anchor="middle" style="font-size:12px">14 min</text><text class="sm" x="150" y="319" text-anchor="end">lint</text><rect class="tea" x="160" y="304" width="80" height="20" rx="4"/><text class="sm" x="150" y="345" text-anchor="end">unit tests</text><rect class="tea" x="160" y="330" width="160" height="20" rx="4"/><text class="sm" x="150" y="371" text-anchor="end">integration</text><rect class="tea" x="320" y="356" width="200" height="20" rx="4"/><text class="sm" x="150" y="397" text-anchor="end">build image</text><rect class="tea" x="320" y="382" width="120" height="20" rx="4"/><text class="sm" x="150" y="423" text-anchor="end">deploy dev</text><rect class="tea" x="440" y="408" width="40" height="20" rx="4"/><text class="okt" x="528" y="423" style="font-size:14px">done at 9 min</text>
</svg>
