<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Derived store lag</title>
  <desc id="d">Animation on a timeline. Member 42 changes their address from 9 Oak Rd to 12 Elm St. The PostgreSQL source of truth shows the new value at commit, time zero. An event dot travels through the outbox relay and Kafka to the search projector, and the OpenSearch document changes to the new address about two seconds later. Meanwhile the profile page, which reads the owning service, and the save confirmation, taken from the write response, show the new address at once, while search by address returns the old one until OpenSearch catches up. Times are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes p1{0%,5.99%{opacity:0}6%,96.99%{opacity:1}97%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,17.99%{opacity:0}18%,57.99%{opacity:1}58%,100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%,57.99%{opacity:0}58%,96.99%{opacity:1}97%,100%{opacity:0}}.p3{animation-name:p3}
    @keyframes p0{0%,57.99%{opacity:1}58%,100%{opacity:0}}.p0{animation-name:p0}
    .dot{animation:mv 14s infinite linear}
    @keyframes mv{0%,6%{transform:translate(0,0);opacity:0}7%{opacity:1}20%{transform:translate(150px,0)}34%{transform:translate(300px,0)}48%{transform:translate(450px,0)}56%{transform:translate(590px,0);opacity:1}57%,100%{transform:translate(590px,0);opacity:0}}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.p0,.p1,.p2{opacity:1}.dot{animation:none;transform:translate(450px,0)}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="438" rx="14"/>
  <text class="h" x="28" y="40">A write, and the derived store catching up</text><text class="sub" x="28" y="62">Member 42 changes their address. Times illustrative.</text><text class="lbl" x="28" y="115">PostgreSQL</text><text class="sub" x="28" y="133">source</text><line class="grid" x1="160" y1="110" x2="772" y2="110"/><text class="lbl" x="28" y="175">outbox → Kafka</text><line class="grid" x1="160" y1="170" x2="772" y2="170"/><text class="lbl" x="28" y="235">OpenSearch</text><text class="sub" x="28" y="253">derived</text><line class="grid" x1="160" y1="230" x2="772" y2="230"/><text class="sub" x="170" y="286" text-anchor="middle">commit</text><text class="sub" x="320" y="286" text-anchor="middle">relay</text><text class="sub" x="470" y="286" text-anchor="middle">Kafka</text><text class="sub" x="620" y="286" text-anchor="middle">projector</text><text class="sub" x="760" y="286" text-anchor="middle">indexed</text><text class="sub" x="170" y="304" text-anchor="middle">t = 0</text><text class="sub" x="760" y="304" text-anchor="middle">≈ 2 s</text><line class="grid" x1="170" y1="280" x2="170" y2="100"/><g class="k p0"><rect class="box" x="196" y="96" width="200" height="28" rx="6" stroke-width="1.2"/><text class="sm" x="206" y="115">old: 9 Oak Rd</text></g><g class="k p1"><rect class="tea" x="196" y="96" width="200" height="28" rx="6"/><text class="on13" x="206" y="115">new: 12 Elm St</text></g><circle class="wrnf dot" cx="170" cy="170" r="9"/><g class="k p0"><rect class="box" x="560" y="216" width="200" height="28" rx="6" stroke-width="1.2"/><text class="sm" x="570" y="235">old: 9 Oak Rd</text></g><g class="k p3"><rect class="tea" x="560" y="216" width="200" height="28" rx="6"/><text class="on13" x="570" y="235">new: 12 Elm St</text></g><text class="lbl" x="28" y="344">What the user sees</text><text class="sm" x="28" y="370">Profile page (reads owner)</text><text class="sm" x="28" y="394">Search by address</text><text class="sm" x="28" y="418">Save confirmation</text><g class="k p1"><text class="okt" x="260" y="370" style="font-size:14px">12 Elm St  ✓ reads the source</text><text class="okt" x="260" y="418" style="font-size:14px">12 Elm St  ✓ from the write response</text></g><g class="k p2"><text class="wrnt" x="260" y="394" style="font-size:14px">9 Oak Rd  (stale for about 2 s)</text></g><g class="k p3"><text class="okt" x="260" y="394" style="font-size:14px">12 Elm St  ✓ caught up</text></g>
</svg>
