<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Buffer versus demand</title>
  <desc id="d">Animation: on the left, a producer emitting one item per tick feeds a consumer that handles one item every three ticks with no backpressure, so the buffer fills cell after cell past the heap budget and ends in OutOfMemoryError. On the right, the consumer requests four items, the producer emits items 1 to 4 and then pauses because demand is zero, the consumer requests four more and items 5 to 8 follow, so no more than four items are ever held in memory. The rates are illustrative.</desc>
