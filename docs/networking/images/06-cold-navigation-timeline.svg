<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 444" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Round trips to first byte</title>
  <desc id="d">Animation: a playhead sweeps a 0 to 700 millisecond axis while four timelines fill in, assuming a 100 ms round trip and 50 ms of server work. Typing http:// and being redirected costs DNS, TCP, a 301 response, a second TCP handshake, a TLS handshake and the real request, so the first byte arrives at 650 ms. A cold HTTPS load over TCP and TLS 1.3 needs DNS, TCP, TLS and the request: 450 ms. HTTP/3 merges transport and TLS into one QUIC handshake: 350 ms. A revisit with cached DNS and a reused connection needs only the request: 150 ms. Illustrative numbers.</desc>
