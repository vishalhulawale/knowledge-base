  <rect class="box" x="116" y="144" width="56" height="56" rx="0"/>
  <rect class="card" x="172" y="144" width="56" height="56" rx="0"/>
  <rect class="box" x="228" y="144" width="56" height="56" rx="0"/>
  <text class="m" x="46" y="233" text-anchor="end">2</text>
  <rect class="box" x="60" y="200" width="56" height="56" rx="0"/>
  <rect class="card" x="116" y="200" width="56" height="56" rx="0"/>
  <rect class="box" x="172" y="200" width="56" height="56" rx="0"/>
  <rect class="card" x="228" y="200" width="56" height="56" rx="0"/>
  <text class="m" x="46" y="289" text-anchor="end">3</text>
  <rect class="card" x="60" y="256" width="56" height="56" rx="0"/>
  <rect class="box" x="116" y="256" width="56" height="56" rx="0"/>
  <rect class="card" x="172" y="256" width="56" height="56" rx="0"/>
  <rect class="box" x="228" y="256" width="56" height="56" rx="0"/>
  <text class="m" x="88" y="80" text-anchor="middle">0</text>
  <text class="m" x="144" y="80" text-anchor="middle">1</text>
  <text class="m" x="200" y="80" text-anchor="middle">2</text>
  <text class="m" x="256" y="80" text-anchor="middle">3</text>
  <g class="fr f0"><rect class="bad" x="62" y="146" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="118" y="146" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="62" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="174" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="62" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><circle class="pri" cx="88" cy="116" r="19"/><text class="on" x="88" y="121" text-anchor="middle">Q</text><text class="t" x="340" y="120" font-weight="700">Row 0: column 0 is safe.</text><text class="t" x="340" y="142">Place a queen and go to the next row.</text><text class="m" x="340" y="206">Step 1 of 11</text></g>
  <g class="fr f1"><rect class="bad" x="62" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="118" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="174" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="62" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="174" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><circle class="pri" cx="88" cy="116" r="19"/><text class="on" x="88" y="121" text-anchor="middle">Q</text><circle class="pri" cx="200" cy="172" r="19"/><text class="on" x="200" y="177" text-anchor="middle">Q</text><text class="t" x="340" y="120" font-weight="700">Row 1: column 2 is safe.</text><text class="t" x="340" y="142">Place a queen and go to the next row.</text><text class="m" x="340" y="206">Step 2 of 11</text></g>
  <g class="fr f2"><rect class="bad" x="62" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="118" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="174" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="62" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="174" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="ln sbad" x="57" y="197" width="230" height="62" rx="4" fill="none" stroke-width="3"/><circle class="pri" cx="88" cy="116" r="19"/><text class="on" x="88" y="121" text-anchor="middle">Q</text><circle class="pri" cx="200" cy="172" r="19"/><text class="on" x="200" y="177" text-anchor="middle">Q</text><text class="tbad" x="340" y="120" font-weight="700">Row 2: every cell is attacked.</text><text class="t" x="340" y="142">Dead end: backtrack to row 1</text><text class="t" x="340" y="164">and try its next column.</text><text class="m" x="340" y="206">Step 3 of 11</text></g>
  <g class="fr f3"><rect class="bad" x="62" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="174" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="62" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="118" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><circle class="pri" cx="88" cy="116" r="19"/><text class="on" x="88" y="121" text-anchor="middle">Q</text><circle class="pri" cx="256" cy="172" r="19"/><text class="on" x="256" y="177" text-anchor="middle">Q</text><text class="t" x="340" y="120" font-weight="700">Row 1: column 3 is safe.</text><text class="t" x="340" y="142">Place a queen and go to the next row.</text><text class="m" x="340" y="206">Step 4 of 11</text></g>
  <g class="fr f4"><rect class="bad" x="62" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="118" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="174" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><circle class="pri" cx="88" cy="116" r="19"/><text class="on" x="88" y="121" text-anchor="middle">Q</text><circle class="pri" cx="256" cy="172" r="19"/><text class="on" x="256" y="177" text-anchor="middle">Q</text><circle class="pri" cx="144" cy="228" r="19"/><text class="on" x="144" y="233" text-anchor="middle">Q</text><text class="t" x="340" y="120" font-weight="700">Row 2: column 1 is safe.</text><text class="t" x="340" y="142">Place a queen and go to the next row.</text><text class="m" x="340" y="206">Step 5 of 11</text></g>
  <g class="fr f5"><rect class="bad" x="62" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="118" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="174" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="ln sbad" x="57" y="253" width="230" height="62" rx="4" fill="none" stroke-width="3"/><circle class="pri" cx="88" cy="116" r="19"/><text class="on" x="88" y="121" text-anchor="middle">Q</text><circle class="pri" cx="256" cy="172" r="19"/><text class="on" x="256" y="177" text-anchor="middle">Q</text><circle class="pri" cx="144" cy="228" r="19"/><text class="on" x="144" y="233" text-anchor="middle">Q</text><text class="tbad" x="340" y="120" font-weight="700">Row 3: every cell is attacked.</text><text class="t" x="340" y="142">Dead end: backtrack to row 2</text><text class="t" x="340" y="164">and try its next column.</text><text class="m" x="340" y="206">Step 6 of 11</text></g>
  <g class="fr f6"><rect class="bad" x="62" y="146" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="118" y="146" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="62" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="174" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="62" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><circle class="pri" cx="88" cy="116" r="19"/><text class="on" x="88" y="121" text-anchor="middle">Q</text><text class="tbad" x="340" y="120" font-weight="700">Back in row 2: no other safe column.</text><text class="t" x="340" y="142">Row 1 has no column after 3 either,</text><text class="t" x="340" y="164">so the row 0 queen moves on.</text><text class="m" x="340" y="206">Step 7 of 11</text></g>
  <g class="fr f7"><rect class="bad" x="62" y="146" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="118" y="146" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="174" y="146" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="118" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="118" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><circle class="pri" cx="144" cy="116" r="19"/><text class="on" x="144" y="121" text-anchor="middle">Q</text><text class="t" x="340" y="120" font-weight="700">Row 0: column 1 is safe.</text><text class="t" x="340" y="142">Place a queen and go to the next row.</text><text class="m" x="340" y="206">Step 8 of 11</text></g>
  <g class="fr f8"><rect class="bad" x="118" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="174" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="202" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="118" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><circle class="pri" cx="144" cy="116" r="19"/><text class="on" x="144" y="121" text-anchor="middle">Q</text><circle class="pri" cx="256" cy="172" r="19"/><text class="on" x="256" y="177" text-anchor="middle">Q</text><text class="t" x="340" y="120" font-weight="700">Row 1: column 3 is safe.</text><text class="t" x="340" y="142">Place a queen and go to the next row.</text><text class="m" x="340" y="206">Step 9 of 11</text></g>
  <g class="fr f9"><rect class="bad" x="62" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="118" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><rect class="bad" x="230" y="258" width="52" height="52" rx="3" fill-opacity=".28"/><circle class="pri" cx="144" cy="116" r="19"/><text class="on" x="144" y="121" text-anchor="middle">Q</text><circle class="pri" cx="256" cy="172" r="19"/><text class="on" x="256" y="177" text-anchor="middle">Q</text><circle class="pri" cx="88" cy="228" r="19"/><text class="on" x="88" y="233" text-anchor="middle">Q</text><text class="t" x="340" y="120" font-weight="700">Row 2: column 0 is safe.</text><text class="t" x="340" y="142">Place a queen and go to the next row.</text><text class="m" x="340" y="206">Step 10 of 11</text></g>
  <g class="fr f10"><circle class="ok" cx="144" cy="116" r="19"/><text class="on" x="144" y="121" text-anchor="middle">Q</text><circle class="ok" cx="256" cy="172" r="19"/><text class="on" x="256" y="177" text-anchor="middle">Q</text><circle class="ok" cx="88" cy="228" r="19"/><text class="on" x="88" y="233" text-anchor="middle">Q</text><circle class="ok" cx="200" cy="284" r="19"/><text class="on" x="200" y="289" text-anchor="middle">Q</text><text class="tok" x="340" y="120" font-weight="700">Row 3: column 2 is safe.</text><text class="t" x="340" y="142">First solution: columns 1, 3, 0, 2.</text><text class="t" x="340" y="164">(2 solutions exist for n = 4.)</text><text class="m" x="340" y="206">Step 11 of 11</text></g>
  <text class="t" x="340" y="260">For n = 8 the same pruning visits</text>
  <text class="t" x="340" y="280">2,057 nodes instead of 19,173,961.</text>
  <text class="m" x="28" y="362">Each dead end abandons a partial board as soon as it can't be completed, instead of building full boards.</text>
