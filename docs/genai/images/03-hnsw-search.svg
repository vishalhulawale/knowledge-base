    @keyframes s8{0%,78%{opacity:0}80%,90%{opacity:1}94%,100%{opacity:0}}
    .s8{animation-name:s8}
    @media (prefers-reduced-motion: reduce){ .a{animation:none;opacity:1} }
  </style>
  <defs>
