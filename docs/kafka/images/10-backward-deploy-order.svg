<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">BACKWARD compatibility: consumers must upgrade first</title>
  <desc id="d">Schema v2 deletes the field notes, which had no default; BACKWARD compatibility allows this. Top lane, consumers first: the consumer moves to v2 while producers still write v1; the v2 reader simply ignores the extra notes field. Then producers move to v2 and everything is on v2. Bottom lane, producers first: the producer starts writing v2 records without notes while the consumer still expects v1. The v1 reader schema needs notes and has no default for it, so decoding fails and the consumer is stuck on the record.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:13s infinite linear}
    @keyframes p0{0%,30%{opacity:1}31%{opacity:0}100%{opacity:0}}
    .p0{animation-name:p0}
    @keyframes p1{0%{opacity:0}30%{opacity:0}31%,63%{opacity:1}64%{opacity:0}100%{opacity:0}}
    .p1{animation-name:p1}
    @keyframes p2{0%{opacity:0}63%{opacity:0}64%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p2{animation-name:p2}
    @keyframes p12{0%{opacity:0}30%{opacity:0}31%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p12{animation-name:p12}
    @keyframes p01{0%,63%{opacity:1}64%{opacity:0}100%{opacity:0}}
    .p01{animation-name:p01}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .p0,.p1,.p01{opacity:0!important}
    }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">v2 deletes the field notes (no default)</text>
  <text class="sub" x="28" y="62">BACKWARD allows the change. Which side deploys first decides whether it works.</text>
  <text class="h2 okt" x="28" y="104">Consumers first ✓</text>
  <rect class="box" x="28" y="120" width="150" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="103" y="148" text-anchor="middle" font-weight="700">Producer</text>
  <rect class="box" x="320" y="120" width="150" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="395" y="148" text-anchor="middle" font-weight="700">topic</text>
  <rect class="box" x="612" y="120" width="160" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="692" y="148" text-anchor="middle" font-weight="700">Consumer</text>
  <line class="ln" x1="178" y1="143" x2="316" y2="143" marker-end="url(#ar)"/>
  <line class="ln" x1="470" y1="143" x2="608" y2="143" marker-end="url(#ar)"/>
  <g class="a p01">
  <rect class="pri" x="140" y="108" width="44" height="24" rx="6"/>
  <text class="on13" x="162" y="124.5" text-anchor="middle">v1</text>
  </g>
  <g class="a p2">
  <rect class="tea" x="140" y="108" width="44" height="24" rx="6"/>
  <text class="on13" x="162" y="124.5" text-anchor="middle">v2</text>
  </g>
  <g class="a p0">
  <rect class="pri" x="734" y="108" width="44" height="24" rx="6"/>
  <text class="on13" x="756" y="124.5" text-anchor="middle">v1</text>
  </g>
  <g class="a p12">
  <rect class="tea" x="734" y="108" width="44" height="24" rx="6"/>
  <text class="on13" x="756" y="124.5" text-anchor="middle">v2</text>
  </g>
  <text class="sm  a p0" x="612" y="188">v1 reads v1</text>
  <text class="sm okt a p1" x="612" y="188">v2 reader skips notes ✓</text>
  <text class="sm okt a p2" x="612" y="188">all on v2 ✓</text>
  <text class="h2 badt" x="28" y="240">Producers first ✕</text>
  <rect class="box" x="28" y="256" width="150" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="103" y="284" text-anchor="middle" font-weight="700">Producer</text>
  <rect class="box" x="320" y="256" width="150" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="395" y="284" text-anchor="middle" font-weight="700">topic</text>
  <rect class="box" x="612" y="256" width="160" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="692" y="284" text-anchor="middle" font-weight="700">Consumer</text>
  <line class="ln" x1="178" y1="279" x2="316" y2="279" marker-end="url(#ar)"/>
  <line class="ln" x1="470" y1="279" x2="608" y2="279" marker-end="url(#ar)"/>
  <g class="a p0">
  <rect class="pri" x="140" y="244" width="44" height="24" rx="6"/>
  <text class="on13" x="162" y="260.5" text-anchor="middle">v1</text>
  </g>
  <g class="a p12">
  <rect class="tea" x="140" y="244" width="44" height="24" rx="6"/>
  <text class="on13" x="162" y="260.5" text-anchor="middle">v2</text>
  </g>
  <g class="a p01">
  <rect class="pri" x="734" y="244" width="44" height="24" rx="6"/>
  <text class="on13" x="756" y="260.5" text-anchor="middle">v1</text>
  </g>
  <g class="a p2">
  <rect class="pri" x="734" y="244" width="44" height="24" rx="6"/>
  <text class="on13" x="756" y="260.5" text-anchor="middle">v1</text>
  </g>
  <text class="sm  a p0" x="612" y="324">v1 reads v1</text>
  <text class="sm badt a p1" x="612" y="324">notes missing, no default</text>
  <text class="sm badt a p2" x="612" y="324">✕ deserialization error</text>
  <text class="lbl a p0" x="28" y="368">1  Everyone on v1</text>
  <text class="lbl a p1" x="28" y="368">2  One side upgrades</text>
  <text class="lbl a p2" x="28" y="368">3  Top: done. Bottom: the consumer is stuck on the first v2 record</text>
  <text class="sub" x="28" y="398">FORWARD is the mirror image (producers first). FULL allows either order.</text>
</svg>
