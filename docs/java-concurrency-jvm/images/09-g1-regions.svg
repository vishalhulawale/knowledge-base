  <g class="s v1"><rect class="re" x="214" y="96" width="52" height="40" rx="5"/><text class="wt" x="240" y="121" text-anchor="middle">E</text></g>
  <rect class="fr" x="272" y="96" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="272" y="96" width="52" height="40" rx="5"/><text class="wt" x="298" y="121" text-anchor="middle">O</text></g>
  <rect class="fr" x="330" y="96" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="330" y="96" width="52" height="40" rx="5"/><text class="wt" x="356" y="121" text-anchor="middle">O</text></g>
  <rect class="fr" x="388" y="96" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="388" y="96" width="52" height="40" rx="5"/><text class="wt" x="414" y="121" text-anchor="middle">O</text></g>
  <rect class="fr" x="446" y="96" width="52" height="40" rx="5"/>
  <g class="s"><rect class="rh" x="446" y="96" width="52" height="40" rx="5"/><text class="wt" x="472" y="121" text-anchor="middle">H</text></g>
  <rect class="fr" x="504" y="96" width="52" height="40" rx="5"/>
  <g class="s"><rect class="rh" x="504" y="96" width="52" height="40" rx="5"/><text class="wt" x="530" y="121" text-anchor="middle">H</text></g>
  <rect class="fr" x="562" y="96" width="52" height="40" rx="5"/>
  <g class="s v3"><rect class="rs" x="562" y="96" width="52" height="40" rx="5"/><text class="wt" x="588" y="121" text-anchor="middle">S</text></g>
  <rect class="fr" x="620" y="96" width="52" height="40" rx="5"/>
  <g class="s v3"><rect class="rs" x="620" y="96" width="52" height="40" rx="5"/><text class="wt" x="646" y="121" text-anchor="middle">S</text></g>
  <rect class="fr" x="678" y="96" width="52" height="40" rx="5"/>
  <rect class="fr" x="40" y="142" width="52" height="40" rx="5"/>
  <g class="s v1"><rect class="re" x="40" y="142" width="52" height="40" rx="5"/><text class="wt" x="66" y="167" text-anchor="middle">E</text></g>
  <rect class="fr" x="98" y="142" width="52" height="40" rx="5"/>
  <g class="s v1"><rect class="re" x="98" y="142" width="52" height="40" rx="5"/><text class="wt" x="124" y="167" text-anchor="middle">E</text></g>
  <rect class="fr" x="156" y="142" width="52" height="40" rx="5"/>
  <g class="s v1"><rect class="re" x="156" y="142" width="52" height="40" rx="5"/><text class="wt" x="182" y="167" text-anchor="middle">E</text></g>
  <rect class="fr" x="214" y="142" width="52" height="40" rx="5"/>
  <g class="s v1"><rect class="rs" x="214" y="142" width="52" height="40" rx="5"/><text class="wt" x="240" y="167" text-anchor="middle">S</text></g>
  <rect class="fr" x="272" y="142" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="272" y="142" width="52" height="40" rx="5"/><text class="wt" x="298" y="167" text-anchor="middle">O</text></g>
  <rect class="fr" x="330" y="142" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="330" y="142" width="52" height="40" rx="5"/><text class="wt" x="356" y="167" text-anchor="middle">O</text></g>
  <rect class="fr" x="388" y="142" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="388" y="142" width="52" height="40" rx="5"/><text class="wt" x="414" y="167" text-anchor="middle">O</text></g>
  <rect class="fr" x="446" y="142" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="446" y="142" width="52" height="40" rx="5"/><text class="wt" x="472" y="167" text-anchor="middle">O</text></g>
  <rect class="fr" x="504" y="142" width="52" height="40" rx="5"/>
  <g class="s v3"><rect class="ro" x="504" y="142" width="52" height="40" rx="5"/><text class="wt" x="530" y="167" text-anchor="middle">O</text></g>
  <rect class="fr" x="562" y="142" width="52" height="40" rx="5"/>
  <rect class="fr" x="620" y="142" width="52" height="40" rx="5"/>
  <rect class="fr" x="678" y="142" width="52" height="40" rx="5"/>
  <rect class="fr" x="40" y="188" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="40" y="188" width="52" height="40" rx="5"/><text class="wt" x="66" y="213" text-anchor="middle">O</text></g>
  <rect class="fr" x="98" y="188" width="52" height="40" rx="5"/>
  <g class="s v2"><rect class="rg" x="98" y="188" width="52" height="40" rx="5"/><text class="gt" x="124" y="213" text-anchor="middle">O*</text></g>
  <rect class="fr" x="156" y="188" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="156" y="188" width="52" height="40" rx="5"/><text class="wt" x="182" y="213" text-anchor="middle">O</text></g>
  <rect class="fr" x="214" y="188" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="214" y="188" width="52" height="40" rx="5"/><text class="wt" x="240" y="213" text-anchor="middle">O</text></g>
  <rect class="fr" x="272" y="188" width="52" height="40" rx="5"/>
  <g class="s v5"><rect class="ro" x="272" y="188" width="52" height="40" rx="5"/><text class="wt" x="298" y="213" text-anchor="middle">O</text></g>
  <rect class="fr" x="330" y="188" width="52" height="40" rx="5"/>
  <rect class="fr" x="388" y="188" width="52" height="40" rx="5"/>
  <rect class="fr" x="446" y="188" width="52" height="40" rx="5"/>
  <rect class="fr" x="504" y="188" width="52" height="40" rx="5"/>
  <rect class="fr" x="562" y="188" width="52" height="40" rx="5"/>
  <g class="s v1"><rect class="re" x="562" y="188" width="52" height="40" rx="5"/><text class="wt" x="588" y="213" text-anchor="middle">E</text></g>
  <rect class="fr" x="620" y="188" width="52" height="40" rx="5"/>
  <g class="s v1"><rect class="re" x="620" y="188" width="52" height="40" rx="5"/><text class="wt" x="646" y="213" text-anchor="middle">E</text></g>
  <rect class="fr" x="678" y="188" width="52" height="40" rx="5"/>
  <rect class="fr" x="40" y="234" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="40" y="234" width="52" height="40" rx="5"/><text class="wt" x="66" y="259" text-anchor="middle">O</text></g>
  <rect class="fr" x="98" y="234" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="98" y="234" width="52" height="40" rx="5"/><text class="wt" x="124" y="259" text-anchor="middle">O</text></g>
  <rect class="fr" x="156" y="234" width="52" height="40" rx="5"/>
  <g class="s v2"><rect class="rg" x="156" y="234" width="52" height="40" rx="5"/><text class="gt" x="182" y="259" text-anchor="middle">O*</text></g>
  <rect class="fr" x="214" y="234" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="214" y="234" width="52" height="40" rx="5"/><text class="wt" x="240" y="259" text-anchor="middle">O</text></g>
  <rect class="fr" x="272" y="234" width="52" height="40" rx="5"/>
  <g class="s"><rect class="ro" x="272" y="234" width="52" height="40" rx="5"/><text class="wt" x="298" y="259" text-anchor="middle">O</text></g>
  <rect class="fr" x="330" y="234" width="52" height="40" rx="5"/>
  <rect class="fr" x="388" y="234" width="52" height="40" rx="5"/>
  <rect class="fr" x="446" y="234" width="52" height="40" rx="5"/>
  <rect class="fr" x="504" y="234" width="52" height="40" rx="5"/>
  <rect class="fr" x="562" y="234" width="52" height="40" rx="5"/>
  <rect class="fr" x="620" y="234" width="52" height="40" rx="5"/>
  <rect class="fr" x="678" y="234" width="52" height="40" rx="5"/>

  <g class="t">
    <g class="f c1"><text x="28" y="312">Generations are just sets of regions. The humongous object (half a region or more)</text><text x="28" y="332">takes two contiguous regions.</text></g>
    <g class="f c2"><text x="28" y="312"><tspan class="tr">Pause Young</tspan>: live objects from every E and S region are copied into a few free</text><text x="28" y="332">regions (new S, and O for promoted objects). The old E and S regions are now free.</text></g>
    <g class="f c3"><text x="28" y="312"><tspan class="tr">Pause Young (Mixed)</tspan>: after concurrent marking, the old regions with the</text><text x="28" y="332">most garbage are evacuated too. Their few live objects are compacted into one region.</text></g>
  </g>
  <text class="sub" x="28" y="372">G1 picks as many regions as fit in MaxGCPauseMillis (200 ms by default). Copying compacts, so no fragmentation.</text>
  <text class="sub" x="28" y="392">Real heaps have about 2,048 regions of 1 to 32 MB. Live data in each region is not drawn.</text>
</svg>
