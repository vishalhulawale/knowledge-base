<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Check-then-insert race vs unique idempotency key</title>
<desc id="d">Animation comparing two concurrent retries of the same request. Left, check then insert: both requests SELECT and find nothing, both insert a refill and both submit to the pharmacy, giving two refills. Right, insert the idempotency key first: request A's INSERT of key K1 succeeds, request B's INSERT conflicts on the unique primary key and gets 409. A creates the refill and marks K1 completed; B's later retry replays the stored 201. One refill.</desc>
<style>
.card{fill:#f8fafc;stroke:#e2e8f0}.cv{fill:#f8fafc}
.h{fill:#0f172a;font-size:20px;font-weight:700}
.lbl{fill:#334155;font-size:15px;font-weight:600}
.txt{fill:#334155;font-size:14px}.sm{fill:#334155;font-size:13px}
.sub{fill:#64748b;font-size:13px}.b{font-weight:700}
.slot{fill:#ffffff;stroke:#cbd5e1}
.fp{fill:#4f46e5}.ft{fill:#0ea5a4}.fg{fill:#16a34a}.fr{fill:#dc2626}.fa{fill:#d97706}.fmu{fill:#64748b}
.zp{fill:#4f46e5;fill-opacity:.1}.zg{fill:#16a34a;fill-opacity:.12}.zr{fill:#dc2626;fill-opacity:.1}.za{fill:#d97706;fill-opacity:.14}
.on{fill:#ffffff}
.sp{stroke:#4f46e5}.st{stroke:#0ea5a4}.sg{stroke:#16a34a}.sr{stroke:#dc2626}.sa{stroke:#d97706}.smu{stroke:#64748b}.sax{stroke:#cbd5e1}
.tp{fill:#4f46e5}.tt{fill:#0f766e}.tg{fill:#15803d}.tr{fill:#dc2626}.ta{fill:#b45309}.tm{fill:#64748b}
.nf{fill:none}
@media (prefers-color-scheme: dark){
.card{fill:#1f2430;stroke:#334155}.cv{fill:#1f2430}
.h{fill:#f1f5f9}.lbl,.txt,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}
.slot{fill:#111827;stroke:#475569}
.fp{fill:#818cf8}.ft{fill:#2dd4bf}.fg{fill:#4ade80}.fr{fill:#f87171}.fa{fill:#fbbf24}.fmu{fill:#94a3b8}
.zp{fill:#818cf8;fill-opacity:.16}.zg{fill:#4ade80;fill-opacity:.14}.zr{fill:#f87171;fill-opacity:.14}.za{fill:#fbbf24;fill-opacity:.14}
.on{fill:#0f172a}
.sp{stroke:#818cf8}.st{stroke:#2dd4bf}.sg{stroke:#4ade80}.sr{stroke:#f87171}.sa{stroke:#fbbf24}.smu{stroke:#94a3b8}.sax{stroke:#475569}
.tp{fill:#818cf8}.tt{fill:#5eead4}.tg{fill:#4ade80}.tr{fill:#f87171}.ta{fill:#fbbf24}.tm{fill:#94a3b8}
}

.a,.d,.w{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:linear}
.a{opacity:0}.w{opacity:0}
@keyframes kp4{0%,2%{opacity:0}4%,92%{opacity:1}96%,100%{opacity:0}}.p4{animation-name:kp4}
@keyframes kp7{0%,5%{opacity:0}7%,92%{opacity:1}96%,100%{opacity:0}}.p7{animation-name:kp7}
@keyframes kp26{0%,24%{opacity:0}26%,92%{opacity:1}96%,100%{opacity:0}}.p26{animation-name:kp26}
@keyframes kp30{0%,28%{opacity:0}30%,92%{opacity:1}96%,100%{opacity:0}}.p30{animation-name:kp30}
@keyframes kp40{0%,38%{opacity:0}40%,92%{opacity:1}96%,100%{opacity:0}}.p40{animation-name:kp40}
@keyframes kp44{0%,42%{opacity:0}44%,92%{opacity:1}96%,100%{opacity:0}}.p44{animation-name:kp44}
@keyframes kp52{0%,50%{opacity:0}52%,92%{opacity:1}96%,100%{opacity:0}}.p52{animation-name:kp52}
@keyframes kp60{0%,58%{opacity:0}60%,92%{opacity:1}96%,100%{opacity:0}}.p60{animation-name:kp60}
@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.d{animation:none;opacity:0}.w{animation:none;opacity:0}}
</style>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fmu" d="M0,0L10,5L0,10z"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fp" d="M0,0L10,5L0,10z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fg" d="M0,0L10,5L0,10z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fr" d="M0,0L10,5L0,10z"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fa" d="M0,0L10,5L0,10z"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ft" d="M0,0L10,5L0,10z"/></marker>
</defs>
<rect class="card" x="1" y="1" width="798" height="438" rx="14"/>

<text class="h" x="28" y="40">Duplicate retries: check-then-insert vs a unique key</text>
<text class="sub" x="28" y="62">Two retries of the same POST /refills arrive at the same moment.</text>
<text class="lbl tr" x="28" y="98">Check, then insert</text>
<text class="lbl tg" x="412" y="98">Insert the key first (unique PK)</text>
<line x1="400" y1="84" x2="400" y2="400" class="sax"/>
<text class="sm tm b" x="118" y="124" text-anchor="middle">Request A</text><text class="sm tm b" x="298" y="124" text-anchor="middle">Request B</text>
<text class="sm tm b" x="502" y="124" text-anchor="middle">Request A</text><text class="sm tm b" x="682" y="124" text-anchor="middle">Request B</text>
<!-- left -->
<g class="a p4"><rect class="slot" x="36" y="136" width="164" height="36" rx="8" stroke-width="1"/><text class="sm" x="118.0" y="159" text-anchor="middle">SELECT: none found</text></g>
<g class="a p7"><rect class="slot" x="216" y="136" width="164" height="36" rx="8" stroke-width="1"/><text class="sm" x="298.0" y="159" text-anchor="middle">SELECT: none found</text></g>
<g class="a p26"><rect class="slot" x="36" y="186" width="164" height="36" rx="8" stroke-width="1"/><text class="sm" x="118.0" y="209" text-anchor="middle">INSERT refill</text></g>
<g class="a p30"><rect class="slot sr" x="216" y="186" width="164" height="36" rx="8" stroke-width="2"/><text class="sm tr b" x="298.0" y="209" text-anchor="middle">INSERT refill</text></g>
<g class="a p40"><rect class="slot" x="36" y="236" width="164" height="36" rx="8" stroke-width="1"/><text class="sm" x="118.0" y="259" text-anchor="middle">submit to pharmacy</text></g>
<g class="a p44"><rect class="slot sr" x="216" y="236" width="164" height="36" rx="8" stroke-width="2"/><text class="sm tr b" x="298.0" y="259" text-anchor="middle">submit to pharmacy</text></g>
<!-- right -->
<g class="a p4"><rect class="slot" x="420" y="136" width="164" height="36" rx="8" stroke-width="1"/><text class="sm" x="502.0" y="159" text-anchor="middle">INSERT K1: ok</text></g>
<g class="a p7"><rect class="slot sg" x="600" y="136" width="164" height="36" rx="8" stroke-width="2"/><text class="sm tg b" x="682.0" y="159" text-anchor="middle">INSERT K1: conflict</text></g>
<g class="a p26"><rect class="slot" x="420" y="186" width="164" height="36" rx="8" stroke-width="1"/><text class="sm" x="502.0" y="209" text-anchor="middle">create refill</text></g>
<g class="a p30"><rect class="slot sa" x="600" y="186" width="164" height="36" rx="8" stroke-width="2"/><text class="sm ta b" x="682.0" y="209" text-anchor="middle">409, retry later</text></g>
<g class="a p40"><rect class="slot" x="420" y="236" width="164" height="36" rx="8" stroke-width="1"/><text class="sm" x="502.0" y="259" text-anchor="middle">K1 → COMPLETED</text></g>
<g class="a p52"><rect class="slot sg" x="600" y="236" width="164" height="36" rx="8" stroke-width="2"/><text class="sm tg b" x="682.0" y="259" text-anchor="middle">retry: replay 201</text></g>
<!-- tables -->
<rect class="slot" x="36" y="290" width="344" height="80" rx="10"/><text class="sm tm b" x="50" y="310">refill table</text>
<g class="a p26"><text class="sm" x="50" y="334">refill r-81 · rx 42</text></g>
<g class="a p30"><text class="sm tr b" x="50" y="356">refill r-82 · rx 42  (duplicate)</text></g>
<rect class="slot" x="420" y="290" width="344" height="80" rx="10"/><text class="sm tm b" x="434" y="310">refill table</text>
<g class="a p26"><text class="sm" x="434" y="334">refill r-81 · rx 42</text></g>
<g class="a p60"><text class="sm tr b" x="36" y="394">2 refills and 2 pharmacy submissions</text><text class="sm tg b" x="420" y="394">1 refill; the retry gets the stored 201</text></g>
<text class="sub" x="28" y="424">Right side: both requests carry Idempotency-Key K1, and the primary key rejects the second INSERT.</text>

</svg>
