  <rect class="tea" x="432" y="230" width="70" height="24" rx="5"/>
  <text class="on13" x="467" y="246.5" text-anchor="middle">t+10</text>
  </g>
  <text class="tx badt a fin" x="28" y="380">Shard 2 takes every write: a hot shard</text>
  <text class="tx okt a fin" x="420" y="380">Writes spread across both shards</text>
  <text class="sub" x="28" y="412">Hashing fixes write distribution but turns range queries on createdAt into scatter-gather.</text>
  <text class="sub" x="28" y="430">A compound key like {memberId, createdAt} spreads writes and keeps per-member ranges targeted.</text>
</svg>
