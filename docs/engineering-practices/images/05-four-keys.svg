<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">DORA metrics on a timeline</title>
  <desc id="d">Ten days of one service. A row of commits sits above a row of six production deployments. A dashed arrow from one commit to the next deployment marks the change lead time. A bracket between two consecutive deployments marks time between deploys, which gives deployment frequency. The fourth deployment failed and was followed shortly by an unplanned hotfix deployment; the gap between them is the failed deployment recovery time. Change fail rate and deployment rework rate are both 1 of 6, about 17 percent. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="414" rx="14"/>
  <text class="h" x="28" y="40">Where each DORA metric comes from</text><text class="sub" x="28" y="62">Ten days of one service. Timestamps from Git and the deployment pipeline. Illustrative.</text><text class="sub" x="28" y="118">commits</text><text class="sub" x="28" y="224">prod</text><text class="sub" x="28" y="240">deploys</text><line class="grid" x1="80" y1="114" x2="740" y2="114"/><line class="ln" x1="80" y1="228" x2="740" y2="228"/><circle class="pri" cx="99.8" cy="114" r="6"/><circle class="pri" cx="132.8" cy="114" r="6"/><circle class="pri" cx="185.6" cy="114" r="6"/><circle class="pri" cx="225.2" cy="114" r="6"/><circle class="pri" cx="284.6" cy="114" r="6"/><circle class="pri" cx="324.2" cy="114" r="6"/><circle class="pri" cx="377.0" cy="114" r="6"/><circle class="pri" cx="436.4" cy="114" r="6"/><circle class="pri" cx="515.6" cy="114" r="6"/><circle class="pri" cx="568.4" cy="114" r="6"/><circle class="pri" cx="614.6" cy="114" r="6"/><rect class="tea" x="138" y="218" width="16" height="20" rx="3"/><rect class="tea" x="237" y="218" width="16" height="20" rx="3"/><rect class="tea" x="349.2" y="218" width="16" height="20" rx="3"/><rect class="badf" x="454.8" y="218" width="16" height="20" rx="3"/><rect class="wrnf" x="474.6" y="218" width="16" height="20" rx="3"/><rect class="tea" x="639.6" y="218" width="16" height="20" rx="3"/><line class="lnp dash" x1="284.6" y1="120" x2="357.2" y2="214" marker-end="url(#arp)" style="stroke-width:1.5"/><path class="lnp" d="M 284.6 96 L 284.6 90 L 357.2 90 L 357.2 96"/><text class="prit" x="320.9" y="82" text-anchor="middle" style="font-size:13px">change lead time</text><path class="lnt" d="M 146.0 246 L 146.0 254 L 245.0 254 L 245.0 246"/><text class="teat" x="195.5" y="272" text-anchor="middle" style="font-size:13px">time between deploys</text><text class="teat" x="195.5" y="288" text-anchor="middle" style="font-size:13px">= deployment frequency</text><path class="lnb" d="M 462.8 246 L 462.8 254 L 482.59999999999997 254 L 482.59999999999997 246"/><line class="lnb" x1="472.7" y1="256" x2="472.7" y2="266"/><text class="badt" x="472.7" y="282" text-anchor="middle" style="font-size:13px">failed deployment</text><text class="badt" x="472.7" y="298" text-anchor="middle" style="font-size:13px">recovery time</text><text class="badt" x="462.8" y="206" text-anchor="middle" style="font-size:12px">failed</text><text class="wrnt" x="504.6" y="206" style="font-size:12px">hotfix (unplanned)</text><text class="sub" x="80" y="318" text-anchor="middle">day 0</text><text class="sub" x="212" y="318" text-anchor="middle">day 2</text><text class="sub" x="344" y="318" text-anchor="middle">day 4</text><text class="sub" x="476" y="318" text-anchor="middle">day 6</text><text class="sub" x="608" y="318" text-anchor="middle">day 8</text><text class="sub" x="740" y="318" text-anchor="middle">day 10</text><rect class="bm" x="28" y="334" width="744" height="66" rx="8"/><text class="sm" x="44" y="358">Change fail rate = deploys needing immediate intervention ÷ all deploys = 1 ÷ 6 ≈ 17%</text><text class="sm" x="44" y="384">Deployment rework rate = unplanned deploys caused by an incident ÷ all deploys = 1 ÷ 6 ≈ 17%</text>
</svg>
