<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Keyboard focus in a custom div overlay versus a native modal dialog</title>
  <desc id="d">Two side-by-side screens each show a page with Home and Claims links and a Delete claim button, covered by a "Delete claim C-1042?" confirmation with Cancel and Delete buttons. The focus ring moves one key press at a time. On the left, a custom div overlay: focus starts on Cancel, Tab moves to Delete, the next Tab escapes to the Home link hidden behind the dimmed backdrop, then to Claims, and pressing Escape does nothing because no handler was written. On the right, a native dialog opened with showModal(): focus starts on Cancel, Tab moves to Delete, the next Tab never reaches the page because the browser makes everything outside the dialog inert, so focus comes back to Cancel (after passing through the browser's own controls), then Delete; pressing Escape closes the dialog and focus returns to the Delete claim button that opened it. Simplified: one frame per key press, and the trip through browser UI is not drawn.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:12px}
    .code{fill:#334155;font-size:12.5px;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bar{fill:#e2e8f0}
    .okt{fill:#16a34a;font-weight:700}.badt{fill:#dc2626;font-weight:700}.prit{fill:#4f46e5;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bo{fill:#f0fdf4;stroke:#16a34a}.bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    .btn{fill:#4f46e5}.btn2{fill:#ffffff;stroke:#94a3b8}.btnt{fill:#ffffff;font-size:13px;font-weight:700}.btn2t{fill:#334155;font-size:13px;font-weight:600}
    .lnk{fill:#4f46e5;font-size:13px;font-weight:600;text-decoration:underline}
    .bd{fill:#0f172a;fill-opacity:.42}
    .ringok{fill:none;stroke:#4f46e5;stroke-width:3}.ringbad{fill:none;stroke:#dc2626;stroke-width:3;stroke-dasharray:6 3}
    .ln{stroke:#64748b;stroke-width:2;fill:none}.ah{fill:#64748b}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.tx,.sm,.code{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}.bar{fill:#334155}
      .okt{fill:#4ade80}.badt{fill:#f87171}.prit{fill:#818cf8}.wrnt{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bo{fill:#052e16;stroke:#4ade80}.bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
      .btn{fill:#818cf8}.btn2{fill:#111827;stroke:#64748b}.btnt{fill:#0f172a}.btn2t{fill:#e2e8f0}
      .lnk{fill:#a5b4fc}
      .bd{fill:#000000;fill-opacity:.55}
      .ringok{stroke:#a5b4fc}.ringbad{stroke:#f87171}
      .ln{stroke:#94a3b8}.ah{fill:#94a3b8}
    }
    .a{opacity:0;animation:14s infinite step-end}
    @keyframes s0{0%,16.66%{opacity:1}16.67%,100%{opacity:0}}
    .s0{animation-name:s0}
    @keyframes s1{0%,16.66%{opacity:0}16.67%,33.32%{opacity:1}33.33%,100%{opacity:0}}
    .s1{animation-name:s1}
    @keyframes s2{0%,33.32%{opacity:0}33.33%,49.99%{opacity:1}50.00%,100%{opacity:0}}
    .s2{animation-name:s2}
    @keyframes s3{0%,49.99%{opacity:0}50.00%,66.66%{opacity:1}66.67%,100%{opacity:0}}
    .s3{animation-name:s3}
    @keyframes s4{0%,66.66%{opacity:0}66.67%,83.32%{opacity:1}83.33%,100%{opacity:0}}
    .s4{animation-name:s4}
    @keyframes s5{0%,83.32%{opacity:0}83.33%,99.99%{opacity:1}100.00%,100%{opacity:0}}
    .s5{animation-name:s5}
    .m{animation:14s infinite step-end;animation-name:mo}
    @keyframes mo{0%,66.65%{opacity:1}66.67%,100%{opacity:0}}
    .mi{opacity:0;animation:14s infinite step-end;animation-name:mi}
    @keyframes mi{0%,66.65%{opacity:0}66.67%,100%{opacity:1}}
    @media (prefers-reduced-motion: reduce){ .a,.m,.mi{animation:none} .a,.mi{opacity:0} .m{opacity:1} .rm{opacity:1} }
  </style>
  <rect class="card" x="1" y="1" width="798" height="518" rx="14"/>
  <text class="h" x="28" y="40">Where does Tab go when a modal is open?</text>
  <text class="sub" x="28" y="62">One frame per key press. Indigo ring = focus where it should be, dashed red = focus lost behind the overlay.</text>
  <rect class="box" x="20" y="80" width="372" height="340" rx="10" stroke-width="1.2"/>
  <text class="h2" x="206" y="104" text-anchor="middle">Custom &lt;div class="modal"&gt;</text>
  <text class="lnk" x="50" y="140">Home</text><text class="lnk" x="110" y="140">Claims</text><text class="lnk" x="180" y="140">Profile</text>
  <rect class="btn2" x="46" y="160" width="120" height="32" rx="7"/><text class="btn2t" x="106" y="181" text-anchor="middle">Delete claim</text>
  <rect class="bar" x="46" y="210" width="300" height="12" rx="6"/>
  <rect class="bar" x="46" y="240" width="260" height="12" rx="6"/>
  <rect class="bar" x="46" y="270" width="320" height="12" rx="6"/>
  <rect class="bar" x="46" y="300" width="200" height="12" rx="6"/>
  <rect class="bar" x="46" y="330" width="280" height="12" rx="6"/>
  <rect class="bar" x="46" y="360" width="240" height="12" rx="6"/>
  <g>
    <rect class="bd" x="28" y="116" width="356" height="296" rx="6"/>
    <rect class="box" x="76" y="214" width="260" height="140" rx="10" stroke-width="1.4"/>
    <text class="h2" x="96" y="244">Delete claim C-1042?</text>
    <text class="sm" x="96" y="266">This cannot be undone.</text>
    <rect class="btn2" x="96" y="296" width="100" height="34" rx="7"/><text class="btn2t" x="146" y="318" text-anchor="middle">Cancel</text>
    <rect class="btn" x="216" y="296" width="100" height="34" rx="7"/><text class="btnt" x="266" y="318" text-anchor="middle">Delete</text>
  </g>
  <rect class="a s0 ringok" x="92" y="292" width="108" height="42" rx="8"/>
  <rect class="a s1 ringok" x="212" y="292" width="108" height="42" rx="8"/>
  <rect class="a s2 rm ringbad" x="44" y="124" width="46" height="24" rx="8"/>
  <rect class="a s3 ringbad" x="104" y="124" width="56" height="24" rx="8"/>
  <rect class="a s4 ringbad" x="104" y="124" width="56" height="24" rx="8"/>
  <g class="a s0"><rect class="bp" x="20" y="430" width="372" height="40" rx="8" stroke-width="1.2"/><text class="sub" x="34" y="455">1/6</text><text class="tx" x="70" y="455" font-size="13.5">Overlay opens, script focuses Cancel</text></g>
  <g class="a s1"><rect class="bp" x="20" y="430" width="372" height="40" rx="8" stroke-width="1.2"/><text class="sub" x="34" y="455">2/6</text><text class="tx" x="70" y="455" font-size="13.5">Tab → Delete</text></g>
  <g class="a s2 rm"><rect class="bb" x="20" y="430" width="372" height="40" rx="8" stroke-width="1.2"/><text class="sub" x="34" y="455">3/6</text><text class="badt" x="70" y="455" font-size="13.5">Tab → Home link BEHIND the backdrop</text></g>
  <g class="a s3"><rect class="bb" x="20" y="430" width="372" height="40" rx="8" stroke-width="1.2"/><text class="sub" x="34" y="455">4/6</text><text class="badt" x="70" y="455" font-size="13.5">Tab → Claims: user is lost, nothing visible</text></g>
  <g class="a s4"><rect class="bb" x="20" y="430" width="372" height="40" rx="8" stroke-width="1.2"/><text class="sub" x="34" y="455">5/6</text><text class="badt" x="70" y="455" font-size="13.5">Esc → nothing happens (no handler)</text></g>
  <g class="a s5"><rect class="bb" x="20" y="430" width="372" height="40" rx="8" stroke-width="1.2"/><text class="sub" x="34" y="455">6/6</text><text class="badt" x="70" y="455" font-size="13.5">Screen reader can still browse the page</text></g>
  <rect class="box" x="408" y="80" width="372" height="340" rx="10" stroke-width="1.2"/>
  <text class="h2" x="594" y="104" text-anchor="middle">&lt;dialog&gt; + showModal()</text>
  <text class="lnk" x="438" y="140">Home</text><text class="lnk" x="498" y="140">Claims</text><text class="lnk" x="568" y="140">Profile</text>
  <rect class="btn2" x="434" y="160" width="120" height="32" rx="7"/><text class="btn2t" x="494" y="181" text-anchor="middle">Delete claim</text>
  <rect class="bar" x="434" y="210" width="300" height="12" rx="6"/>
  <rect class="bar" x="434" y="240" width="260" height="12" rx="6"/>
  <rect class="bar" x="434" y="270" width="320" height="12" rx="6"/>
  <rect class="bar" x="434" y="300" width="200" height="12" rx="6"/>
  <rect class="bar" x="434" y="330" width="280" height="12" rx="6"/>
  <rect class="bar" x="434" y="360" width="240" height="12" rx="6"/>
  <g class="m">
    <rect class="bd" x="416" y="116" width="356" height="296" rx="6"/>
    <rect class="box" x="464" y="214" width="260" height="140" rx="10" stroke-width="1.4"/>
    <text class="h2" x="484" y="244">Delete claim C-1042?</text>
    <text class="sm" x="484" y="266">This cannot be undone.</text>
    <rect class="btn2" x="484" y="296" width="100" height="34" rx="7"/><text class="btn2t" x="534" y="318" text-anchor="middle">Cancel</text>
    <rect class="btn" x="604" y="296" width="100" height="34" rx="7"/><text class="btnt" x="654" y="318" text-anchor="middle">Delete</text>
    <text class="wrnt" x="760" y="140" text-anchor="end" font-size="12">inert</text>
  </g>
  <rect class="a s0 ringok" x="480" y="292" width="108" height="42" rx="8"/>
  <rect class="a s1 ringok" x="600" y="292" width="108" height="42" rx="8"/>
  <rect class="a s2 rm ringok" x="480" y="292" width="108" height="42" rx="8"/>
  <rect class="a s3 ringok" x="600" y="292" width="108" height="42" rx="8"/>
  <rect class="a s4 ringok" x="430" y="156" width="128" height="40" rx="8"/>
  <rect class="a s5 ringok" x="430" y="156" width="128" height="40" rx="8"/>
  <g class="a s0"><rect class="bp" x="408" y="430" width="372" height="40" rx="8" stroke-width="1.2"/><text class="sub" x="422" y="455">1/6</text><text class="tx" x="458" y="455" font-size="13.5">showModal(): focus on Cancel (autofocus)</text></g>
  <g class="a s1"><rect class="bp" x="408" y="430" width="372" height="40" rx="8" stroke-width="1.2"/><text class="sub" x="422" y="455">2/6</text><text class="tx" x="458" y="455" font-size="13.5">Tab → Delete</text></g>
  <g class="a s2 rm"><rect class="bo" x="408" y="430" width="372" height="40" rx="8" stroke-width="1.2"/><text class="sub" x="422" y="455">3/6</text><text class="okt" x="458" y="455" font-size="13.5">Tab → back to Cancel: page is inert</text></g>
  <g class="a s3"><rect class="bo" x="408" y="430" width="372" height="40" rx="8" stroke-width="1.2"/><text class="sub" x="422" y="455">4/6</text><text class="okt" x="458" y="455" font-size="13.5">Tab → Delete, still inside the dialog</text></g>
  <g class="a s4"><rect class="bo" x="408" y="430" width="372" height="40" rx="8" stroke-width="1.2"/><text class="sub" x="422" y="455">5/6</text><text class="okt" x="458" y="455" font-size="13.5">Esc → dialog closes (close request)</text></g>
  <g class="a s5"><rect class="bo" x="408" y="430" width="372" height="40" rx="8" stroke-width="1.2"/><text class="sub" x="422" y="455">6/6</text><text class="okt" x="458" y="455" font-size="13.5">Focus returns to “Delete claim” trigger</text></g>
  <text class="sub" x="28" y="500">The native dialog gets inert background, Esc handling and focus return from the browser. A div overlay needs all three in script.</text>
</svg>
