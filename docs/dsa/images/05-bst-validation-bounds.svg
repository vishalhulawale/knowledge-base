<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Validating a BST: parent-child check versus bounds</title>
  <desc id="d">Two copies of a tree with root 5, left child 3, and 7 as the right child of 3. On the left, the parent-child check compares each node only with its parent: 3 is less than 5 and 7 is greater than 3, so the tree is wrongly accepted. On the right, bounds are passed down: 5 may be anything, 3 must be below 5, and 7 must be between 3 and 5, so 7 fails and the tree is correctly rejected, because 7 sits in the left subtree of 5.</desc>
  <style>.card{fill:#f8fafc;stroke:#e2e8f0}
.h{fill:#0f172a;font-size:19px;font-weight:700}
.t{fill:#334155;font-size:14px}
.tb{fill:#334155;font-size:14px;font-weight:700}
.lb{fill:#334155;font-size:15px;font-weight:600}
.m{fill:#64748b;font-size:13px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.box{fill:#ffffff;stroke:#cbd5e1}
.pri{fill:#4f46e5}.spri{stroke:#4f46e5}.tpri{fill:#4f46e5}
.tea{fill:#0ea5a4}.stea{stroke:#0ea5a4}.ttea{fill:#0f766e}
.ok{fill:#16a34a}.sok{stroke:#16a34a}.tok{fill:#16a34a}
.bad{fill:#dc2626}.sbad{stroke:#dc2626}.tbad{fill:#dc2626}
.warn{fill:#d97706}.swarn{stroke:#d97706}.twarn{fill:#d97706}
.smut{stroke:#94a3b8}.mut{fill:#94a3b8}
.tint{fill:#4f46e5;fill-opacity:.14}.ttint{fill:#0ea5a4;fill-opacity:.16}
.gtint{fill:#16a34a;fill-opacity:.16}.rtint{fill:#dc2626;fill-opacity:.14}.atint{fill:#d97706;fill-opacity:.16}
.on{fill:#ffffff;font-size:14px;font-weight:700}
.ln{fill:none;stroke-width:2}
.ah{stroke:none}
@media (prefers-color-scheme: dark){
.card{fill:#1f2430;stroke:#334155}
.h{fill:#f1f5f9}.t,.tb,.lb{fill:#e2e8f0}.m{fill:#94a3b8}
.box{fill:#111827;stroke:#475569}
.pri,.tint{fill:#818cf8}.spri{stroke:#818cf8}.tpri{fill:#818cf8}
.tea,.ttint{fill:#2dd4bf}.stea{stroke:#2dd4bf}.ttea{fill:#5eead4}
.ok,.gtint{fill:#4ade80}.sok{stroke:#4ade80}.tok{fill:#4ade80}
.bad,.rtint{fill:#f87171}.sbad{stroke:#f87171}.tbad{fill:#f87171}
.warn,.atint{fill:#fbbf24}.swarn{stroke:#fbbf24}.twarn{fill:#fbbf24}
.smut{stroke:#64748b}.mut{fill:#64748b}
.on{fill:#0f172a}
}</style>
  <rect class="card" x="1" y="1" width="798" height="402" rx="14"/>
  <text class="h" x="28" y="40">Validating a BST: the parent-child trap</text>
  <text class="m" x="28" y="62">Same tree on both sides: 7 is in 5's left subtree, so it is not a valid BST.</text>
  <rect class="rtint" x="28" y="84" width="360" height="266" rx="12"/>
  <text class="tbad" x="44" y="110" font-weight="700" font-size="15">✗ Parent-child only</text>
  <line class="ln smut" x1="220" y1="152" x2="140" y2="216"/><line class="ln smut" x1="140" y1="216" x2="200" y2="280"/><circle class="box" cx="220" cy="152" r="22"/><text class="lb" x="220" y="158" text-anchor="middle">5</text><text class="m" x="252" y="157" font-size="14">root</text><circle class="box" cx="140" cy="216" r="22"/><text class="lb" x="140" y="222" text-anchor="middle">3</text><text class="tok" x="172" y="221" font-size="14">3 &lt; 5 ✓</text><circle class="box" cx="200" cy="280" r="22"/><text class="lb" x="200" y="286" text-anchor="middle">7</text><text class="tok" x="232" y="285" font-size="14">7 &gt; 3 ✓</text>
  <text class="tbad" x="44" y="334" font-weight="700" font-size="14">Every edge looks fine: accepted (wrong)</text>
  <rect class="gtint" x="412" y="84" width="360" height="266" rx="12"/>
  <text class="tok" x="428" y="110" font-weight="700" font-size="15">✓ Pass (lo, hi) bounds down</text>
  <line class="ln smut" x1="604" y1="152" x2="524" y2="216"/><line class="ln smut" x1="524" y1="216" x2="584" y2="280"/><circle class="box" cx="604" cy="152" r="22"/><text class="lb" x="604" y="158" text-anchor="middle">5</text><text class="tok" x="636" y="157" font-size="14">(−∞, +∞) ✓</text><circle class="box" cx="524" cy="216" r="22"/><text class="lb" x="524" y="222" text-anchor="middle">3</text><text class="tok" x="556" y="221" font-size="14">(−∞, 5) ✓</text><circle class="bad" cx="584" cy="280" r="22"/><text class="on" x="584" y="286" text-anchor="middle">7</text><text class="tbad" x="616" y="285" font-size="14">needs (3, 5) ✗</text>
  <text class="tok" x="428" y="334" font-weight="700" font-size="14">7 ≥ 5 breaks its bound: rejected</text>
  <text class="m" x="28" y="374">Going left tightens hi to the parent's value; going right tightens lo.</text>
  <text class="m" x="28" y="391">Use long bounds so nodes holding Integer.MIN_VALUE or MAX_VALUE work.</text>
</svg>
