<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 386" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">SQL join fan-out</title>
  <desc id="d">Animation in two phases. Member M1 has two fills, 10 and 30 dollars, and three prescriptions. Joining both child tables first produces six rows, two times three, so the sum of paid becomes 120 dollars instead of 40 and the prescription count becomes 6 instead of 3. Aggregating each child to member grain first and then joining gives one row: 40 dollars and 3 prescriptions. The SQL uses two CTEs that group by member before the join.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes p0{0%,49.99%{opacity:1}50%,100%{opacity:0}}.p0{animation-name:p0}
    @keyframes p1{0%,49.99%{opacity:0}50%,100%{opacity:1}}.p1{animation-name:p1}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.p1{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="384" rx="14"/>
  <text class="h" x="28" y="40">Join fan-out: two child tables multiply rows</text><text class="sub" x="28" y="62">Member M1 has 2 fills and 3 prescriptions. Grain wanted: one row per member.</text><rect class="bt" x="28" y="92" width="160" height="70" rx="8" stroke-width="1.5"/><text class="mono" x="108" y="112" text-anchor="middle" xml:space="preserve" font-weight="700">fills</text><text class="mono" x="108" y="132" text-anchor="middle" xml:space="preserve">F1 $10</text><text class="mono" x="108" y="152" text-anchor="middle" xml:space="preserve">F2 $30</text><rect class="bp" x="28" y="176" width="160" height="70" rx="8" stroke-width="1.5"/><text class="mono" x="108" y="206" text-anchor="middle" xml:space="preserve" font-weight="700">prescriptions</text><text class="mono" x="108" y="226" text-anchor="middle" xml:space="preserve">R1 · R2 · R3</text><g class="k p0"><text class="badt" x="230" y="100" style="font-size:14px">Join both, then aggregate</text><rect class="bb" x="230" y="112" width="220" height="24" rx="4" stroke-width="1"/><text class="mono" x="242" y="129" xml:space="preserve">M1  F1 $10  R1</text><rect class="bb" x="230" y="138" width="220" height="24" rx="4" stroke-width="1"/><text class="mono" x="242" y="155" xml:space="preserve">M1  F1 $10  R2</text><rect class="bb" x="230" y="164" width="220" height="24" rx="4" stroke-width="1"/><text class="mono" x="242" y="181" xml:space="preserve">M1  F1 $10  R3</text><rect class="bb" x="230" y="190" width="220" height="24" rx="4" stroke-width="1"/><text class="mono" x="242" y="207" xml:space="preserve">M1  F2 $30  R1</text><rect class="bb" x="230" y="216" width="220" height="24" rx="4" stroke-width="1"/><text class="mono" x="242" y="233" xml:space="preserve">M1  F2 $30  R2</text><rect class="bb" x="230" y="242" width="220" height="24" rx="4" stroke-width="1"/><text class="mono" x="242" y="259" xml:space="preserve">M1  F2 $30  R3</text><text class="badt" x="470" y="150" style="font-size:16px">SUM(paid) = $120</text><text class="badt" x="470" y="174" style="font-size:16px">COUNT(rx) = 6</text><text class="sm" x="470" y="204">6 rows = 2 × 3</text></g><g class="k p1"><text class="okt" x="230" y="100" style="font-size:14px">Aggregate each child to member grain, then join</text><rect class="bo" x="230" y="112" width="240" height="26" rx="4"/><text class="mono" x="242" y="130" xml:space="preserve">fills:  M1  paid $40</text><rect class="bo" x="230" y="144" width="240" height="26" rx="4"/><text class="mono" x="242" y="162" xml:space="preserve">rx:     M1  count 3</text><line class="ln" x1="350" y1="174" x2="350" y2="196" marker-end="url(#ar)"/><rect class="bo" x="230" y="200" width="240" height="26" rx="4"/><text class="mono" x="242" y="218" xml:space="preserve">M1  $40  3</text><text class="okt" x="500" y="150" style="font-size:16px">SUM(paid) = $40</text><text class="okt" x="500" y="174" style="font-size:16px">COUNT(rx) = 3</text><text class="sm" x="500" y="204">1 row per member</text></g><rect class="bm" x="28" y="290" width="744" height="50" rx="8"/><text class="mono" x="42" y="312" xml:space="preserve">WITH f AS (SELECT member_id, SUM(paid) paid FROM fills GROUP BY 1),</text><text class="mono" x="42" y="330" xml:space="preserve">     r AS (SELECT member_id, COUNT(*) rx FROM prescriptions GROUP BY 1) ...</text><text class="sm" x="28" y="366">Any query that walks two one-to-many paths from the same parent: aggregate each path first.</text>
</svg>
