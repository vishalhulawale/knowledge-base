<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Method security lives in the proxy</title>
  <desc id="d">Another bean holds a reference to the Spring proxy that wraps ClaimService. A call to approve from outside crosses the proxy, so the @PreAuthorize check runs. A call to approveAll also crosses the proxy, but approveAll has no rule, and inside the target object it calls this.approve directly. That internal call never crosses the proxy, so the @PreAuthorize rule on approve is skipped without any error or log line.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:19px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .t{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .proxy{fill:none;stroke:#0ea5a4;stroke-width:2;stroke-dasharray:7 5}
    .gate{fill:#0ea5a4;opacity:.14}
    .gatet{fill:#0f766e;font-size:13px;font-weight:700}
    .target{fill:none;stroke:#4f46e5;stroke-width:2}
    .tgt{fill:#4f46e5;font-size:14px;font-weight:700}
    .code{fill:#334155;font-size:13px;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
    .ann{fill:#4f46e5;font-size:13px;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
    .ln{stroke:#94a3b8;stroke-width:1.5}
    .dot{fill:#4f46e5}.dotB{fill:#d97706}
    .okb{fill:#16a34a}.on{fill:#fff;font-size:13px;font-weight:700}
    .bad{fill:#dc2626;font-size:13px;font-weight:700}
    .badl{stroke:#dc2626;stroke-width:2;stroke-dasharray:4 3}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.t,.code{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .proxy{stroke:#2dd4bf}.gate{fill:#2dd4bf;opacity:.12}.gatet{fill:#5eead4}
      .target{stroke:#818cf8}.tgt,.ann{fill:#818cf8}.ln{stroke:#64748b}
      .dot{fill:#818cf8}.dotB{fill:#fbbf24}
      .okb{fill:#4ade80}.on{fill:#0f172a}.bad{fill:#f87171}.badl{stroke:#f87171}
    }
    /* 12 s loop: external call first, then the self-invocation path */
    .mA{animation:mA 12s infinite ease-in-out;opacity:0}
    .mB{animation:mB 12s infinite ease-in-out;opacity:0}
    @keyframes mA{0%,2%{transform:translate(0,0);opacity:0}4%{transform:translate(0,0);opacity:1}14%,18%{transform:translate(98px,0);opacity:1}30%,40%{transform:translate(210px,0);opacity:1}43%,100%{transform:translate(210px,0);opacity:0}}
    @keyframes mB{0%,44%{transform:translate(0,0);opacity:0}46%{transform:translate(0,0);opacity:1}58%,62%{transform:translate(390px,0);opacity:1}74%,92%{transform:translate(390px,-54px);opacity:1}96%,100%{transform:translate(390px,-54px);opacity:0}}
    .a{opacity:0;animation:12s infinite linear}
    @keyframes s1{0%,15%{opacity:0}17%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes s2{0%,74%{opacity:0}76%,92%{opacity:1}96%,100%{opacity:0}}
    .k1{animation-name:s1}.k2{animation-name:s2}
    @media (prefers-reduced-motion: reduce){
      .mA{animation:none;opacity:1;transform:translate(210px,0)}
      .mB{animation:none;opacity:1;transform:translate(390px,-54px)}
      .a{animation:none;opacity:1}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="38">Only calls that cross the proxy are checked</text>

  <!-- caller -->
  <rect class="box" x="28" y="120" width="140" height="200" rx="10"/>
  <text class="lbl" x="98" y="146" text-anchor="middle">Other bean</text>
  <text class="sub" x="98" y="165" text-anchor="middle">(controller,</text>
  <text class="sub" x="98" y="182" text-anchor="middle">resolver, listener)</text>
  <line class="ln" x1="168" y1="156" x2="400" y2="156"/>
  <line class="ln" x1="168" y1="248" x2="400" y2="248"/>
  <text class="t" x="350" y="148" text-anchor="end">approve(id)</text>
  <text class="t" x="350" y="240" text-anchor="end">approveAll(ids)</text>

  <!-- proxy with interceptor band -->
  <rect class="proxy" x="216" y="66" width="560" height="296" rx="12"/>
  <rect class="gate" x="218" y="68" width="124" height="292" rx="10"/>
  <text class="gatet" x="280" y="292" text-anchor="middle">Spring proxy</text>
  <text class="t" x="280" y="311" text-anchor="middle">interceptor</text>
  <text class="t" x="280" y="328" text-anchor="middle">evaluates</text>
  <text class="t" x="280" y="345" text-anchor="middle">@PreAuthorize</text>

  <!-- target object -->
  <rect class="target" x="370" y="84" width="390" height="262" rx="10"/>
  <text class="tgt" x="386" y="108">ClaimService target object ("this")</text>
  <rect class="box" x="400" y="226" width="340" height="44" rx="8"/>
  <text class="code" x="414" y="253">approveAll(ids)</text>
  <text class="sub" x="726" y="253" text-anchor="end">no rule</text>
  <rect class="box" x="400" y="128" width="340" height="56" rx="8"/>
  <text class="code" x="414" y="151">approve(claimId)</text>
  <text class="ann" x="414" y="172">@PreAuthorize("hasRole('SUPERVISOR')")</text>

  <!-- A: checked at the proxy -->
  <g class="a k1">
    <rect class="okb" x="232" y="168" width="96" height="26" rx="7"/>
    <text class="on" x="280" y="186" text-anchor="middle">checked</text>
  </g>
  <!-- B: internal call bypasses the proxy -->
  <g class="a k2">
    <line class="badl" x1="570" y1="226" x2="570" y2="186"/>
    <text class="bad" x="586" y="204">this.approve(id):</text>
    <text class="bad" x="586" y="221">no proxy, no check</text>
  </g>

  <!-- moving dots -->
  <g class="mA"><circle class="dot" cx="182" cy="156" r="9"/></g>
  <g class="mB"><circle class="dotB" cx="180" cy="248" r="9"/></g>

  <text class="sub" x="28" y="386">approveAll has no rule, and its internal this.approve() call skips the rule on approve.</text>
  <text class="sub" x="28" y="404">Same rule as @Transactional and @Cacheable: the advice lives in the proxy, not in the object.</text>
</svg>
