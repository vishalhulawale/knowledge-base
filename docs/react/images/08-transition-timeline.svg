<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Main thread with and without a transition</title>
  <desc id="d">The user types a, then b, into a search box that filters 10,000 rows. Without a transition, typing a starts one long blocking render of the input and the filtered list; the b keystroke has to wait until it finishes, so the input looks frozen, and then another long render starts. With startTransition, the input update is urgent and renders at once, while the list render runs as a low-priority transition in small units of work. When b arrives, React runs the urgent input update between units, throws away the unfinished list render for a, restarts it for ab, and commits when that finishes.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .sub{fill:#64748b;font-size:13px}
    .axis{stroke:#cbd5e1;stroke-width:2}
    .key{stroke:#64748b;stroke-width:2;stroke-dasharray:4 4}
    .blk{fill:#d97706}
    .bt{fill:#0f172a;font-size:13px;font-weight:700}
    .urg{fill:#4f46e5}
    .tr{fill:#0ea5a4}
    .com{fill:#16a34a}
    .gone rect{fill:#94a3b8}
    .wait{stroke:#dc2626;stroke-width:2;stroke-dasharray:3 4;fill:none}
    .waith{fill:#dc2626}
    .warn{fill:#dc2626;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-size:13px;font-weight:700}
    .teat{fill:#0f766e;font-size:13px;font-weight:700}
    .ok{fill:#16a34a;font-size:13px;font-weight:700}
    .play{stroke:#334155;stroke-width:1.5}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl{fill:#e2e8f0}.sub{fill:#94a3b8}
      .axis{stroke:#475569}.key{stroke:#94a3b8}
      .blk{fill:#fbbf24}.urg{fill:#818cf8}.tr{fill:#2dd4bf}.com{fill:#4ade80}
      .gone rect{fill:#475569}
      .wait{stroke:#f87171}.waith,.warn{fill:#f87171}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.ok{fill:#4ade80}
      .play{stroke:#e2e8f0}
    }
    /* 10 s loop: time runs x=180..760 over 0-80% */
    .g{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:10s infinite linear}
    .a{opacity:0;animation:10s infinite linear}
    @keyframes g1{0%,0.3%{transform:scaleX(0)}44.1%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g1{animation-name:g1}
    @keyframes o2{0%,44.1%{opacity:0}45.6%,93%{opacity:1}97%,100%{opacity:0}}.o2{animation-name:o2}
    @keyframes o3{0%,16.6%{opacity:0}18.1%,93%{opacity:1}97%,100%{opacity:0}}.o3{animation-name:o3}
    @keyframes g4{0%,44.8%{transform:scaleX(0)}79.7%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g4{animation-name:g4}
    @keyframes o5{0%,60.7%{opacity:0}62.2%,93%{opacity:1}97%,100%{opacity:0}}.o5{animation-name:o5}
    @keyframes g6{0%,0.3%{transform:scaleX(0)}3.0%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g6{animation-name:g6}
    @keyframes o7{0%,0.3%{opacity:0}1.8%,93%{opacity:1}97%,100%{opacity:0}}.o7{animation-name:o7}
    @keyframes g8{0%,3.6%{transform:scaleX(0)}7.4%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g8{animation-name:g8}
    @keyframes g9{0%,8.0%{transform:scaleX(0)}11.9%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g9{animation-name:g9}
    @keyframes g10{0%,12.4%{transform:scaleX(0)}16.3%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g10{animation-name:g10}
    @keyframes o11{0%,3.6%{opacity:0}5.1%,30.5%{opacity:1}34.5%,100%{opacity:0}}.o11{animation-name:o11}
    @keyframes o12{0%,16.6%{opacity:0}18.1%,93%{opacity:1}97%,100%{opacity:0}}.o12{animation-name:o12}
    @keyframes g13{0%,16.8%{transform:scaleX(0)}19.6%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g13{animation-name:g13}
    @keyframes o14{0%,16.8%{opacity:0}18.3%,93%{opacity:1}97%,100%{opacity:0}}.o14{animation-name:o14}
    @keyframes g15{0%,20.1%{transform:scaleX(0)}24.0%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g15{animation-name:g15}
    @keyframes g16{0%,24.6%{transform:scaleX(0)}28.4%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g16{animation-name:g16}
    @keyframes g17{0%,29.0%{transform:scaleX(0)}32.8%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g17{animation-name:g17}
    @keyframes g18{0%,33.4%{transform:scaleX(0)}37.2%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g18{animation-name:g18}
    @keyframes g19{0%,37.8%{transform:scaleX(0)}41.7%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g19{animation-name:g19}
    @keyframes g20{0%,42.2%{transform:scaleX(0)}46.1%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g20{animation-name:g20}
    @keyframes g21{0%,46.6%{transform:scaleX(0)}50.5%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g21{animation-name:g21}
    @keyframes o22{0%,20.1%{opacity:0}21.6%,93%{opacity:1}97%,100%{opacity:0}}.o22{animation-name:o22}
    @keyframes g23{0%,51.0%{transform:scaleX(0)}55.2%,93%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}.g23{animation-name:g23}
    @keyframes o24{0%,55.2%{opacity:0}56.7%,93%{opacity:1}97%,100%{opacity:0}}.o24{animation-name:o24}
    .ph{animation:ph 10s infinite linear}
    @keyframes ph{0%{transform:translateX(0);opacity:1}80%{transform:translateX(580px);opacity:1}81%,100%{transform:translateX(580px);opacity:0}}
    @media (prefers-reduced-motion: reduce){
      .g{animation:none;transform:none}
      .a{animation:none;opacity:1}
      .a.ohide{opacity:0}
      .ph{animation:none;opacity:0}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">What a transition changes on the main thread</text>
  <text class="sub" x="28" y="62">The user types "a" then "b" into a search box that filters 10,000 rows.</text>

  <path class="key" d="M180 92 V306 M300 92 V306"/>
  <text class="sub" x="180" y="86" text-anchor="middle">type "a"</text>
  <text class="sub" x="300" y="86" text-anchor="middle">type "b"</text>

  <text class="lbl" x="28" y="146">Without</text>
  <text class="sub" x="28" y="164">one urgent render</text>
  <path class="axis" d="M180 149 H760"/>
  <text class="lbl" x="28" y="258">startTransition</text>
  <text class="sub" x="28" y="276">list is low priority</text>
  <path class="axis" d="M180 261 H760"/>

  <rect class="blk g g1" x="182" y="132" width="318" height="34" rx="4"/>
  <g class="a o2"><text class="bt" x="194" y="154">render q="a": input + 10k rows</text></g>
  <g class="a o3"><path class="wait" d="M300 182 H500"/><path class="waith" d="M498 177 L507 182 L498 187 Z"/><text class="warn" x="306" y="200">"b" waits: input frozen</text></g>
  <rect class="blk g g4" x="505" y="132" width="253" height="34" rx="4"/>
  <g class="a o5"><text class="bt" x="517" y="154">render q="ab" ...</text></g>
  <rect class="urg g g6" x="182" y="244" width="20" height="34" rx="4"/>
  <g class="a o7"><text class="prit" x="192" y="236" text-anchor="middle">input "a"</text></g>
  <rect class="tr g g8" x="206" y="244" width="28" height="34" rx="4"/>
  <rect class="tr g g9" x="238" y="244" width="28" height="34" rx="4"/>
  <rect class="tr g g10" x="270" y="244" width="28" height="34" rx="4"/>
  <g class="a o11 ohide"><text class="teat" x="206" y="296">list q="a"</text></g>
  <g class="a o12"><g class="gone"><rect x="206" y="244" width="92" height="34" rx="4"/></g><text class="sub" x="206" y="296">thrown away</text></g>
  <rect class="urg g g13" x="302" y="244" width="20" height="34" rx="4"/>
  <g class="a o14"><text class="prit" x="312" y="236" text-anchor="middle">input "ab"</text></g>
  <rect class="tr g g15" x="326" y="244" width="28" height="34" rx="4"/>
  <rect class="tr g g16" x="358" y="244" width="28" height="34" rx="4"/>
  <rect class="tr g g17" x="390" y="244" width="28" height="34" rx="4"/>
  <rect class="tr g g18" x="422" y="244" width="28" height="34" rx="4"/>
  <rect class="tr g g19" x="454" y="244" width="28" height="34" rx="4"/>
  <rect class="tr g g20" x="486" y="244" width="28" height="34" rx="4"/>
  <rect class="tr g g21" x="518" y="244" width="28" height="34" rx="4"/>
  <g class="a o22"><text class="teat" x="326" y="296">list q="ab", in small units of work</text></g>
  <rect class="com g g23" x="550" y="244" width="30" height="34" rx="4"/>
  <g class="a o24"><text class="ok" x="565" y="236" text-anchor="middle">commit</text></g>

  <g class="ph"><path class="play" d="M180 96 V306"/></g>

  <rect class="blk" x="28" y="322" width="22" height="14" rx="3"/><text class="sub" x="56" y="334">blocking render</text>
  <rect class="urg" x="196" y="322" width="22" height="14" rx="3"/><text class="sub" x="224" y="334">urgent update (input)</text>
  <rect class="tr" x="396" y="322" width="22" height="14" rx="3"/><text class="sub" x="424" y="334">transition render, interruptible</text>
  <text class="sub" x="28" y="366">React yields between small units of work, so the urgent keystroke runs first and the stale</text>
  <text class="sub" x="28" y="384">list render is discarded and restarted. Widths are illustrative.</text>
</svg>
