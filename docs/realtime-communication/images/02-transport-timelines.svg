  <text class="h" x="28" y="40">Same events, three transports</text><text class="sub" x="28" y="62">Server events at 4 s, 11 s, 12 s and 23 s; heartbeat every 20 s. Illustrative.</text><line class="grid" x1="170" y1="80" x2="170" y2="372"/><text class="sub" x="170" y="390" text-anchor="middle">0 s</text><line class="grid" x1="270" y1="80" x2="270" y2="372"/><text class="sub" x="270" y="390" text-anchor="middle">5 s</text><line class="grid" x1="370" y1="80" x2="370" y2="372"/><text class="sub" x="370" y="390" text-anchor="middle">10 s</text><line class="grid" x1="470" y1="80" x2="470" y2="372"/><text class="sub" x="470" y="390" text-anchor="middle">15 s</text><line class="grid" x1="570" y1="80" x2="570" y2="372"/><text class="sub" x="570" y="390" text-anchor="middle">20 s</text><line class="grid" x1="670" y1="80" x2="670" y2="372"/><text class="sub" x="670" y="390" text-anchor="middle">25 s</text><line class="grid" x1="770" y1="80" x2="770" y2="372"/><text class="sub" x="770" y="390" text-anchor="middle">30 s</text><text class="lbl" x="28" y="122">Long polling</text><text class="sub" x="118" y="106" style="font-size:11px">client</text><text class="sub" x="118" y="156" style="font-size:11px">server</text><line class="ln" x1="170" y1="102" x2="770" y2="102" style="stroke-width:1"/><line class="ln" x1="170" y1="152" x2="770" y2="152" style="stroke-width:1"/><text class="lbl" x="28" y="222">SSE</text><text class="sub" x="118" y="206" style="font-size:11px">client</text><text class="sub" x="118" y="256" style="font-size:11px">server</text><line class="ln" x1="170" y1="202" x2="770" y2="202" style="stroke-width:1"/><line class="ln" x1="170" y1="252" x2="770" y2="252" style="stroke-width:1"/><text class="lbl" x="28" y="322">WebSocket</text><text class="sub" x="118" y="306" style="font-size:11px">client</text><text class="sub" x="118" y="356" style="font-size:11px">server</text><line class="ln" x1="170" y1="302" x2="770" y2="302" style="stroke-width:1"/><line class="ln" x1="