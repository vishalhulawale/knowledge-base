<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Write skew and materialising the conflict</title>
  <desc id="d">Invariant: at least one doctor stays on call. Alice and Bob are both on call and both ask to go off at the same time, each in a snapshot transaction. Top: each transaction counts 2 on call, then sets only its own document to off. They wrote different documents, so there is no write conflict, both commit, and nobody is on call. Bottom: each transaction also increments a shared shift-1 document. Alice commits first; Bob&#x27;s write to shift-1 conflicts, he gets WriteConflict with TransientTransactionError, retries from a fresh snapshot, sees only 1 on call and refuses. One doctor stays on call.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:16s infinite linear}
    @keyframes a0{0%{opacity:0}3%{opacity:0}4%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a0{animation-name:a0}
    @keyframes a1{0%{opacity:0}13%{opacity:0}14%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a1{animation-name:a1}
    @keyframes a2{0%{opacity:0}23%{opacity:0}24%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a2{animation-name:a2}
    @keyframes a3{0%{opacity:0}33%{opacity:0}34%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a3{animation-name:a3}
    @keyframes a4{0%{opacity:0}43%{opacity:0}44%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a4{animation-name:a4}
    @keyframes a5{0%{opacity:0}53%{opacity:0}54%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a5{animation-name:a5}
    @keyframes ar{0%{opacity:0}63%{opacity:0}64%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .ar{animation-name:ar}
    @keyframes b0{0%{opacity:0}3%{opacity:0}4%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .b0{animation-name:b0}
    @keyframes b1{0%{opacity:0}13%{opacity:0}14%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .b1{animation-name:b1}
    @keyframes b2{0%{opacity:0}23%{opacity:0}24%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .b2{animation-name:b2}
    @keyframes b3{0%{opacity:0}33%{opacity:0}34%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .b3{animation-name:b3}
    @keyframes b4{0%{opacity:0}43%{opacity:0}44%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .b4{animation-name:b4}
    @keyframes br{0%{opacity:0}53%{opacity:0}54%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .br{animation-name:br}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="468" rx="14"/>
  <text class="h" x="28" y="40">Alice and Bob both go off call at once</text>
  <text class="sub" x="28" y="62">Invariant: on-call count ≥ 1. Snapshot isolation alone doesn&#x27;t protect it. Measured on the page.</text>
  <text class="h2" x="28" y="100">Snapshot transactions only</text>
  <text class="tx" x="28" y="134" font-weight="700">Alice</text>
  <text class="tx" x="28" y="174" font-weight="700">Bob</text>
  <g class="a a0">
  <rect class="mutf" x="90" y="116" width="150" height="28" rx="6"/>
  <text class="on13" x="165" y="134.5" text-anchor="middle">count on-call = 2</text>
  </g>
  <g class="a a1">
  <rect class="mutf" x="90" y="156" width="150" height="28" rx="6"/>
  <text class="on13" x="165" y="174.5" text-anchor="middle">count on-call = 2</text>
  </g>
  <g class="a a2">
  <rect class="pri" x="250" y="116" width="160" height="28" rx="6"/>
  <text class="on13" x="330" y="134.5" text-anchor="middle">alice.onCall = false</text>
  </g>
  <g class="a a3">
  <rect class="pri" x="250" y="156" width="160" height="28" rx="6"/>
  <text class="on13" x="330" y="174.5" text-anchor="middle">bob.onCall = false</text>
  </g>
  <g class="a a4">
  <rect class="okf" x="420" y="116" width="110" height="28" rx="6"/>
  <text class="on13" x="475" y="134.5" text-anchor="middle">commit ✓</text>
  </g>
  <g class="a a5">
  <rect class="okf" x="420" y="156" width="210" height="28" rx="6"/>
  <text class="on13" x="525" y="174.5" text-anchor="middle">commit ✓ (different doc)</text>
  </g>
  <text class="tx badt a ar" x="90" y="212">Both commit: 0 doctors on call ✕</text>
  <line class="ln dash" x1="28" y1="236" x2="772" y2="236"/>
  <text class="h2" x="28" y="260">Also write a shared shift-1 document</text>
  <text class="tx" x="28" y="294" font-weight="700">Alice</text>
  <text class="tx" x="28" y="334" font-weight="700">Bob</text>
  <g class="a b0">
  <rect class="mutf" x="90" y="276" width="180" height="28" rx="6"/>
  <text class="on13" x="180" y="294.5" text-anchor="middle">count = 2; shift-1 += 1</text>
  </g>
  <g class="a b1">
  <rect class="mutf" x="90" y="316" width="150" height="28" rx="6"/>
  <text class="on13" x="165" y="334.5" text-anchor="middle">count = 2</text>
  </g>
  <g class="a b2">
  <rect class="okf" x="280" y="276" width="160" height="28" rx="6"/>
  <text class="on13" x="360" y="294.5" text-anchor="middle">alice off; commit ✓</text>
  </g>
  <g class="a b3">
  <rect class="badf" x="250" y="316" width="236" height="28" rx="6"/>
  <text class="on13" x="368" y="334.5" text-anchor="middle">shift-1 += 1 → WriteConflict</text>
  </g>
  <g class="a b4">
  <rect class="wrnf" x="496" y="316" width="210" height="28" rx="6"/>
  <text class="on13" x="601" y="334.5" text-anchor="middle">retry: count = 1 → refuse</text>
  </g>
  <text class="tx okt a br" x="90" y="372">Bob&#x27;s retry sees the new state: 1 doctor stays on call ✓</text>
  <text class="sub" x="28" y="420">Snapshot isolation detects write-write conflicts only. If the decision rests on documents you merely read,</text>
  <text class="sub" x="28" y="438">make every transaction write one shared document, or keep the invariant inside a single document.</text>
</svg>
