620" y="231" text-anchor="middle">8</text></g><g class="k rm0"><text class="tx" x="428" y="284" style="font-size:14px">Demand 4: producer emits 1 to 4.</text></g><g class="k rm1"><text class="wrnt" x="428" y="284" style="font-size:14px">Demand 0: producer pauses.</text></g><g class="k rm2"><text class="okt" x="428" y="284" style="font-size:14px">Consumer done: request(4).</text></g><g class="k rm3"><text class="tx" x="428" y="284" style="font-size:14px">Demand 4: producer emits 5 to 8.</text></g><g class="k rm4"><text class="wrnt" x="428" y="284" style="font-size:14px">Demand 0: producer pauses.</text></g><g class="k rm5"><text class="okt" x="428" y="284" style="font-size:14px">Consumer done: request(4).</text></g><text class="sm" x="428" y="404">Never more than 4 items in memory.</text><line class="lno" x1="488" y1="164" x2="488" y2="200" marker-end="url(#aro)"/><line class="lnb" x1="104" y1="164" x2="104" y2="200" marker-end="url(#arb)"/><path class="lnp dash" d="M696,342 L696,300 L662,300 L662,176 L552,176" marker-end="url(#arp)"/><text class="prit" x="670" y="236" style="font-size:12px">request(4)</text>
