<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Build, release, run</title>
  <desc id="d">A commit is built once by CI into one orders image identified by its digest. That same image is combined with dev, staging and prod configuration to form three releases, and the prod release runs as three identical stateless replicas. A red box below shows the anti-pattern: a Maven profile build per environment producing three different images, so staging and prod differ and secrets get baked in.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">Build once, release with config, run disposable processes</text><text class="sub" x="28" y="62">Factor V: the image never changes between environments; only the config does. Digest illustrative.</text><rect class="box" x="30" y="150" width="110" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="85" y="176" text-anchor="middle">commit</text><text class="sm" x="85" y="194" text-anchor="middle">abc123</text><line class="ln" x1="140" y1="180" x2="172" y2="180" marker-end="url(#ar)"/><rect class="bp" x="174" y="140" width="150" height="80" rx="8" stroke-width="1.5"/><text class="prit" x="249" y="167" text-anchor="middle" font-weight="700">BUILD (CI)</text><text class="prit" x="249" y="185" text-anchor="middle">orders image</text><text class="prit" x="249" y="203" text-anchor="middle">sha256:9f3c…</text><path class="lnp" d="M 324 180 C 350 180 350 118 372 118" marker-end="url(#arp)"/><rect class="bt" x="374" y="96" width="200" height="44" rx="8" stroke-width="1.4"/><text class="teat" x="386" y="114" style="font-size:13px">RELEASE dev</text><text class="sm" x="386" y="132" style="font-size:12px">sha256:9f3c… + dev config</text><path class="lnp" d="M 324 180 C 350 180 350 188 372 188" marker-end="url(#arp)"/><rect class="bt" x="374" y="166" width="200" height="44" rx="8" stroke-width="1.4"/><text class="teat" x="386" y="184" style="font-size:13px">RELEASE staging</text><text class="sm" x="386" y="202" style="font-size:12px">sha256:9f3c… + staging config</text><path class="lnp" d="M 324 180 C 350 180 350 258 372 258" marker-end="url(#arp)"/><rect class="bt" x="374" y="236" width="200" height="44" rx="8" stroke-width="1.4"/><text class="teat" x="386" y="254" style="font-size:13px">RELEASE prod</text><text class="sm" x="386" y="272" style="font-size:12px">sha256:9f3c… + prod config</text><text class="sub" x="474" y="88" text-anchor="middle" style="font-size:12px">config from env, ConfigMap, Secret</text><line class="lnt" x1="574" y1="258" x2="606" y2="258" marker-end="url(#art)"/><rect class="bm" x="608" y="96" width="166" height="204" rx="10" stroke-width="1.2"/><text class="lbl" x="691" y="118" text-anchor="middle">RUN prod</text><rect class="box" x="624" y="132" width="134" height="38" rx="8" stroke-width="1.2"/><text class="sm" x="691" y="156" text-anchor="middle" style="font-size:12px">replica 1: stateless</text><rect class="box" x="624" y="182" width="134" height="38" rx="8" stroke-width="1.2"/><text class="sm" x="691" y="206" text-anchor="middle" style="font-size:12px">replica 2: stateless</text><rect class="box" x="624" y="232" width="134" height="38" rx="8" stroke-width="1.2"/><text class="sm" x="691" y="256" text-anchor="middle" style="font-size:12px">replica 3: stateless</text><rect class="bb" x="30" y="322" width="744" height="78" rx="10" stroke-width="1.4"/><text class="badt" x="46" y="346" style="font-size:15px">✗ Anti-pattern: a build per environment</text><text class="mono" x="46" y="372" xml:space="preserve" style="font-size:12px">mvn package -Pdev → image #1  |  -Pstaging → image #2  |  -Pprod → image #3</text><text class="sm" x="46" y="392" style="font-size:13px">What ran in staging is not what runs in prod, and secrets end up inside the images.</text>
</svg>
