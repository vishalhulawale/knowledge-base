    @keyframes o0{0%{opacity:0}3%{opacity:0}4%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .o0{animation-name:o0}
    @keyframes o1{0%{opacity:0}17%{opacity:0}18%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .o1{animation-name:o1}
    @keyframes pp0{0%{opacity:0}31%{opacity:0}32%,47%{opacity:1}48%{opacity:0}100%{opacity:0}}
    .pp0{animation-name:pp0}
    @keyframes pb0{0%{opacity:0}47%{opacity:0}48%,63%{opacity:1}64%{opacity:0}100%{opacity:0}}
    .pb0{animation-name:pb0}
    @keyframes pr0{0%{opacity:0}63%{opacity:0}64%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .pr0{animation-name:pr0}
    @keyframes pp1{0%{opacity:0}31%{opacity:0}32%,48%{opacity:1}49%{opacity:0}100%{opacity:0}}
    .pp1{animation-name:pp1}
    @keyframes pb1{0%{opacity:0}48%{opacity:0}49%,66%{opacity:1}67%{opacity:0}100%{opacity:0}}
    .pb1{animation-name:pb1}
    @keyframes pr1{0%{opacity:0}66%{opacity:0}67%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .pr1{animation-name:pr1}
    @keyframes pp2{0%{opacity:0}31%{opacity:0}32%,49%{opacity:1}50%{opacity:0}100%{opacity:0}}
    .pp2{animation-name:pp2}
    @keyframes pb2{0%{opacity:0}49%{opacity:0}50%,69%{opacity:1}70%{opacity:0}100%{opacity:0}}
    .pb2{animation-name:pb2}
    @keyframes pr2{0%{opacity:0}69%{opacity:0}70%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .pr2{animation-name:pr2}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      
