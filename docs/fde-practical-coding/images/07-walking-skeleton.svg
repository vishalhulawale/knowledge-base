  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="350" rx="14"/>
  <text class="h" x="28" y="40">Walking skeleton first, then deepen what the demo story needs</text><text class="sub" x="28" y="62">A one-day prototype for one user, one workflow, one decision. Hours are illustrative.</text><line class="grid" x1="190" y1="86" x2="190" y2="262"/><text class="sub" x="190" y="282" text-anchor="middle">0h</text><line class="grid" x1="256" y1="86" x2="256" y2="262"/><text class="sub" x="256" y="282" text-anchor="middle">1h</text><line class="grid" x1="322" y1="86" x2="322" y2="262"/><text class="sub" x="322" y="282" text-anchor="middle">2h</text><line class="grid" x1="388" y1="86" x2="388" y2="262"/><text class="sub" x="388" y="282" text-anchor="middle">3h</text><line class="grid" x1="454" y1="86" x2="454" y2="262"/><text class="sub" x="454" y="282" text-anchor="middle">4h</text><line class="grid" x1="520" y1="86" x2="520" y2="262"/><text class="sub" x="520" y="282" text-anchor="middle">5h</text><line class="grid" x1="586" y1="86" x2="586" y2="262"/><text class="sub" x="586" y="282" text-anchor="middle">6h</text><line class="grid" x1="652" y1="86" x2="652" y2="262"/><text class="sub" x="652" y="282" text-anchor="middle">7h</text><line class="grid" x1="718" y1="86" x2="718" y2="262"/><text class="sub" x="718" y="282" text-anchor="middle">8h</text><text class="lbl" x="28" y="122">UI (React)</text><text class="lbl" x="28" y="174">API (Hono)</text><text class="lbl" x="28" y="226">Data (seed → API)</text><rect class="tea g g0" x="192" y="112.0" width="62" height="8" rx="4"/><rect class="tea g g1" x="192" y="164.0" width="62" height="8" rx="4"/><rect class="tea g g2" x="192" y="216.0" width="62" height="8" rx="4"/><rect class="pri g g3" x="258" y="101.0" width="194" height="30" rx="4"/><rect class="pri g g4" x="258" y="153.0" width="128" height="30" rx="4"/><rect class="pri g g5" x="390" y="205.0" width="128" height="30" rx="4"/><rect class="pri g g6" x="456" y="101.0" width="194" height="30" rx="4"/><rect class="pri g g7" x="522" y="153.0" width="128" height="30" rx="4"/><rect class="wrnf g g8" x="654" y="101.0" width="62" height="30" rx="4"/><rect class="wrnf g g9" x="654" y="153.0" width="62" height="30" rx="4"/><rect class="wrnf g g10" x="654" y="205.0" width="62" height="30" rx="4"/><text class="teat" x="194" y="98" style="font-size:12px">end to end, ugly, working</text><text class="wrnt" x="656" y="98" style="font-size:12px">demo-able</text><text class="sm" x="28" y="312">Hour 1: a thin line through every layer proves the path works. Then thicken only what the story</text><text class="sm" x="28" y="330">needs. The last hour goes on states, seed data, a recording and a "what's real vs stubbed" slide.</text>
</svg>
