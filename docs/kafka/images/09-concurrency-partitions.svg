<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Listener concurrency vs partition count</title>
  <desc id="d">Topic rx-status has 6 partitions. Left: 3 pods with concurrency 2 give 6 consumer threads, and each thread owns one partition, P0 to P5. Right: one pod with concurrency 20 starts 20 consumer threads, but only 6 get a partition and the other 14 sit idle. Total consumers are pods times concurrency, and useful parallelism stops at the partition count.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .txt{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .pod{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}
    .idle{fill:#ffffff;stroke:#cbd5e1;stroke-dasharray:3 3}
    .on{fill:#ffffff;font-size:13px;font-weight:700}
    .okt{fill:#15803d;font-size:14px;font-weight:700}
    .badt{fill:#dc2626;font-size:14px;font-weight:700}
    .code{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sep{stroke:#e2e8f0;stroke-width:2}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.code{fill:#f1f5f9}.lbl,.txt{fill:#e2e8f0}.sub{fill:#94a3b8}
      .pod{fill:#111827;stroke:#475569}.idle{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.on{fill:#0f172a}
      .okt{fill:#4ade80}.badt{fill:#f87171}.sep{stroke:#334155}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="358" rx="14"/>
  <text class="h" x="28" y="40">Consumer threads = pods × concurrency</text>
  <text class="sub" x="28" y="62">Topic rx-status has 6 partitions. Each partition is owned by one thread in the group.</text>
  <line class="sep" x1="400" y1="80" x2="400" y2="300"/>

  <!-- left: 3 pods x 2 -->
  <text class="okt" x="28" y="100">3 pods × concurrency 2 = 6 threads</text>
  <rect class="pod" x="28" y="116" width="110" height="130" rx="10"/><text class="lbl" x="83" y="138" text-anchor="middle">pod 1</text>
  <rect class="pod" x="148" y="116" width="110" height="130" rx="10"/><text class="lbl" x="203" y="138" text-anchor="middle">pod 2</text>
  <rect class="pod" x="268" y="116" width="110" height="130" rx="10"/><text class="lbl" x="323" y="138" text-anchor="middle">pod 3</text>
  <rect class="pri" x="48" y="152" width="70" height="32" rx="6"/><text class="on" x="83" y="173" text-anchor="middle">P0</text>
  <rect class="pri" x="48" y="194" width="70" height="32" rx="6"/><text class="on" x="83" y="215" text-anchor="middle">P1</text>
  <rect class="pri" x="168" y="152" width="70" height="32" rx="6"/><text class="on" x="203" y="173" text-anchor="middle">P2</text>
  <rect class="pri" x="168" y="194" width="70" height="32" rx="6"/><text class="on" x="203" y="215" text-anchor="middle">P3</text>
  <rect class="pri" x="288" y="152" width="70" height="32" rx="6"/><text class="on" x="323" y="173" text-anchor="middle">P4</text>
  <rect class="pri" x="288" y="194" width="70" height="32" rx="6"/><text class="on" x="323" y="215" text-anchor="middle">P5</text>
  <text class="txt" x="28" y="274">Every thread has one partition.</text>
  <text class="code" x="28" y="296">concurrency = "2"</text>

  <!-- right: 1 pod x 20 -->
  <text class="badt" x="424" y="100">1 pod × concurrency 20 = 20 threads</text>
  <rect class="pod" x="424" y="116" width="348" height="130" rx="10"/><text class="lbl" x="440" y="138">pod 1</text>
  <!-- 5 columns x 4 rows, step 66 x 26 -->
  <g>
    <rect class="pri" x="440" y="146" width="58" height="18" rx="5"/><text class="on" x="469" y="159" text-anchor="middle">P0</text>
    <rect class="pri" x="506" y="146" width="58" height="18" rx="5"/><text class="on" x="535" y="159" text-anchor="middle">P1</text>
    <rect class="pri" x="572" y="146" width="58" height="18" rx="5"/><text class="on" x="601" y="159" text-anchor="middle">P2</text>
    <rect class="pri" x="638" y="146" width="58" height="18" rx="5"/><text class="on" x="667" y="159" text-anchor="middle">P3</text>
    <rect class="pri" x="704" y="146" width="58" height="18" rx="5"/><text class="on" x="733" y="159" text-anchor="middle">P4</text>
    <rect class="pri" x="440" y="170" width="58" height="18" rx="5"/><text class="on" x="469" y="183" text-anchor="middle">P5</text>
    <rect class="idle" x="506" y="170" width="58" height="18" rx="5"/><rect class="idle" x="572" y="170" width="58" height="18" rx="5"/><rect class="idle" x="638" y="170" width="58" height="18" rx="5"/><rect class="idle" x="704" y="170" width="58" height="18" rx="5"/>
    <rect class="idle" x="440" y="194" width="58" height="18" rx="5"/><rect class="idle" x="506" y="194" width="58" height="18" rx="5"/><rect class="idle" x="572" y="194" width="58" height="18" rx="5"/><rect class="idle" x="638" y="194" width="58" height="18" rx="5"/><rect class="idle" x="704" y="194" width="58" height="18" rx="5"/>
    <rect class="idle" x="440" y="218" width="58" height="18" rx="5"/><rect class="idle" x="506" y="218" width="58" height="18" rx="5"/><rect class="idle" x="572" y="218" width="58" height="18" rx="5"/><rect class="idle" x="638" y="218" width="58" height="18" rx="5"/><rect class="idle" x="704" y="218" width="58" height="18" rx="5"/>
  </g>
  <text class="txt" x="424" y="274">6 busy, 14 idle: no extra throughput.</text>
  <text class="code" x="424" y="296">concurrency = "20"</text>

  <text class="sub" x="28" y="340">Dashed boxes are idle consumer threads. More partitions, not more threads, raise the ceiling.</text>
</svg>
