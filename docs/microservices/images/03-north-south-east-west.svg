<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Load balancer, gateway and mesh</title>
  <desc id="d">Web, mobile and partner clients send traffic through a load balancer, which distributes connections, and then through an API gateway, which handles authentication, quotas, routing and transformation. This vertical path is north-south traffic. Below, the Member, Pharmacy and Claims services each have a sidecar proxy; service-to-service traffic between the sidecars is east-west traffic, handled by the service mesh with mTLS, retries, traffic shifting and telemetry.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ring{fill:#ffffff;stroke:#d97706;stroke-width:2.5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
      .ring{fill:#111827;stroke:#fbbf24}
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="414" rx="14"/>
  <text class="h" x="28" y="40">Load balancer, gateway, mesh: who handles which traffic</text>
  <line class="lnp" x1="60" y1="80" x2="60" y2="330" stroke-width="3" marker-end="url(#arp)"/>
  <text class="prit" x="0" y="0" font-size="14" transform="translate(48 270) rotate(-90)">north-south</text>
  <rect class="box" x="110" y="72" width="120" height="40" rx="10" stroke-width="1.5"/><text class="tx" x="170" y="97" text-anchor="middle">Web</text>
  <rect class="box" x="250" y="72" width="120" height="40" rx="10" stroke-width="1.5"/><text class="tx" x="310" y="97" text-anchor="middle">Mobile</text>
  <rect class="box" x="390" y="72" width="120" height="40" rx="10" stroke-width="1.5"/><text class="tx" x="450" y="97" text-anchor="middle">Partner</text>
  <line class="ln" x1="310" y1="112" x2="310" y2="134" marker-end="url(#ar)"/>
  <rect class="box" x="110" y="138" width="400" height="44" rx="10" stroke-width="1.5"/><text class="lbl" x="310" y="166" text-anchor="middle">Load balancer (ALB / NLB)</text>
  <line class="ln" x1="310" y1="182" x2="310" y2="204" marker-end="url(#ar)"/>
  <rect class="bp" x="110" y="208" width="400" height="44" rx="10" stroke-width="1.5"/><text class="lbl" x="310" y="236" text-anchor="middle">API gateway</text>
  <line class="ln" x1="170" y1="252" x2="170" y2="282" marker-end="url(#ar)"/>
  <line class="ln" x1="310" y1="252" x2="310" y2="282" marker-end="url(#ar)"/>
  <line class="ln" x1="450" y1="252" x2="450" y2="282" marker-end="url(#ar)"/>
  <rect class="bt" x="110" y="286" width="120" height="64" rx="10" stroke-width="1.5"/><text class="tx" x="154" y="323" text-anchor="middle">Member</text><rect class="tea" x="198" y="300" width="24" height="36" rx="5" stroke-width="1.5"/>
  <line class="lnt" x1="224" y1="318" x2="252" y2="318" stroke-width="2.5" marker-start="url(#art)" marker-end="url(#art)"/>
  <rect class="bt" x="250" y="286" width="120" height="64" rx="10" stroke-width="1.5"/><text class="tx" x="294" y="323" text-anchor="middle">Pharmacy</text><rect class="tea" x="338" y="300" width="24" height="36" rx="5" stroke-width="1.5"/>
  <line class="lnt" x1="364" y1="318" x2="392" y2="318" stroke-width="2.5" marker-start="url(#art)" marker-end="url(#art)"/>
  <rect class="bt" x="390" y="286" width="120" height="64" rx="10" stroke-width="1.5"/><text class="tx" x="434" y="323" text-anchor="middle">Claims</text><rect class="tea" x="478" y="300" width="24" height="36" rx="5" stroke-width="1.5"/>
  <line class="lnt" x1="110" y1="374" x2="510" y2="374" stroke-width="3" marker-start="url(#art)" marker-end="url(#art)"/>
  <text class="tx teat" x="310" y="396" text-anchor="middle">east-west: service to service</text>
  <text class="lbl" x="550" y="160">Distributes connections</text>
  <text class="sub" x="550" y="178">Knows little about the APIs.</text>
  <text class="lbl" x="550" y="226">Edge API management</text>
  <text class="sub" x="550" y="244">Auth, quotas, routing,</text>
  <text class="sub" x="550" y="260">transformation, per-route metrics.</text>
  <text class="lbl" x="550" y="310">Mesh sidecar proxies</text>
  <text class="sub" x="550" y="328">mTLS, retries, traffic shifting</text>
  <text class="sub" x="550" y="344">and telemetry between services.</text>
  <rect class="tea" x="696" y="382" width="14" height="20" rx="3" stroke-width="1.5"/><text class="sub" x="718" y="397">= sidecar</text>
</svg>
