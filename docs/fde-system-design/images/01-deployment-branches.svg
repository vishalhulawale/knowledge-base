  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="334" rx="14"/>
  <text class="h" x="28" y="40">The deployment constraint picks the architecture</text><text class="sub" x="28" y="62">"Where may customer data and prompts go, and who approves that?" Ask it in the first ten minutes.</text><line class="lnw" x1="40" y1="96" x2="760" y2="96" marker-end="url(#arw)"/><text class="sub" x="40" y="88">fastest, least control</text><text class="sub" x="760" y="88" text-anchor="end">most control, most to operate</text><rect class="bt" x="28" y="110" width="176" height="150" rx="10" stroke-width="1.5"/><text class="sm" x="40" y="136" font-weight="700">Hosted model API</text><text class="sm" x="40" y="162">Data leaves the boundary</text><text class="sm" x="40" y="183">under DPA + retention</text><text class="sm" x="40" y="204">Newest models first</text><text class="sm" x="40" y="225">Live in days</text><rect class="bp" x="216" y="110" width="176" height="150" rx="10" stroke-width="1.5"/><text class="sm" x="228" y="136" font-weight="700">Cloud AI platform</text><text class="sm" x="228" y="162">Bedrock, Azure OpenAI,</text><text class="sm" x="228" y="183">Vertex AI in their account</text><text class="sm" x="228" y="204">Private endpoints, IAM</text><text class="sm" x="228" y="225">Live in weeks</text><rect class="bw" x="404" y="110" width="176" height="150" rx="10" stroke-width="1.5"/><text class="sm" x="416" y="136" font-weight="700">Self-hosted in VPC</text><text class="sm" x="416" y="162">Open-weight, vLLM etc.</text><text class="sm" x="416" y="183">Data never leaves</text><text class="sm" x="416" y="204">You own GPUs, upgrades</text><text class="sm" x="416" y="225">Weeks to months</text><rect class="bb" x="592" y="110" width="176" height="150" rx="10" stroke-width="1.5"/><text class="sm" x="604" y="136" font-weight="700">Air-gapped</text><text class="sm" x="604" y="162">No external network</text><text class="sm" x="604" y="183">Offline installs, manual</text><text class="sm" x="604" y="204">updates; slowest models</text><text class="sm" x="604" y="225">Months</text><text class="sm" x="28" y="292">Each branch changes four things at once: model choice, network design, identity integration, release process.</text><text class="sub" x="28" y="316">A model gateway keeps the choice reversible: switching branches swaps one adapter plus an eval run.</text>
</svg>
