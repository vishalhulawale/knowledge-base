  <text class="sm" x="120" y="308" text-anchor="middle">0</text>
  <line x1="200.0" x2="200.0" y1="100" y2="290" class="gl"/>
  <text class="sm" x="200" y="308" text-anchor="middle">25</text>
  <line x1="280.0" x2="280.0" y1="100" y2="290" class="gl"/>
  <text class="sm" x="280" y="308" text-anchor="middle">50</text>
  <line x1="360.0" x2="360.0" y1="100" y2="290" class="gl"/>
  <text class="sm" x="360" y="308" text-anchor="middle">75</text>
