<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Mentor, coach, sponsor over time</title>
  <desc id="d">How a tech lead&#x27;s support for one engineer shifts over about a year, as shares of the time spent with them. Early on it is mostly mentoring: explaining how things work. As the engineer gains knowledge, coaching takes over: asking questions so they build their own judgement. Later, sponsoring dominates: creating opportunities such as leading a design review or owning a service. Illustrative shares.</desc>
  <style>
