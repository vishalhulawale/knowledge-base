<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Volume binding: Immediate vs WaitForFirstConsumer</title>
  <desc id="d">A pod needs a 20 GiB EBS volume, which is zonal. Top, binding mode Immediate: the volume is created as soon as the claim exists, in zone a. The scheduler then places the pod by CPU and memory and picks a node in zone b, where the volume can&#x27;t be attached, so the pod is stuck Pending with a volume node affinity conflict. Bottom, WaitForFirstConsumer: the claim waits, the scheduler places the pod in zone b first, and only then the CSI driver creates the volume in zone b, so the pod starts.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:14s infinite linear}
    @keyframes a0{0%,30%{opacity:1}31%{opacity:0}100%{opacity:0}}
    .a0{animation-name:a0}
    @keyframes a1{0%{opacity:0}30%{opacity:0}31%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .a1{animation-name:a1}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .a0{opacity:0!important}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">A zonal disk and a pod that needs it</text>
  <text class="sub" x="28" y="62">EBS and Azure Disk volumes live in one zone; a pod can only attach a disk in its own zone.</text>
  <text class="h2" x="28" y="102">Immediate</text>
  <rect class="bm" x="200" y="86" width="270" height="120" rx="12" stroke-width="1"/>
  <text class="sm" x="212" y="106" font-weight="700">zone eu-west-1a</text>
  <rect class="bm" x="490" y="86" width="270" height="120" rx="12" stroke-width="1"/>
  <text class="sm" x="502" y="106" font-weight="700">zone eu-west-1b</text>
  <rect class="bt" x="214" y="122" width="120" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="274" y="147" text-anchor="middle" font-weight="700">EBS 20Gi</text>
  <text class="sm" x="214" y="182">disk created first</text>
  <g class="a a1">
  <rect class="bb" x="504" y="122" width="150" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="579" y="147" text-anchor="middle" font-weight="700">pod reports</text>
  </g>
  <text class="sm badt a a1" x="504" y="182">Pending: volume node</text>
  <text class="sm badt a a1" x="504" y="198">affinity conflict</text>
  <text class="h2" x="28" y="266">WaitFor</text>
  <text class="h2" x="28" y="286">FirstConsumer</text>
  <rect class="bm" x="200" y="250" width="270" height="120" rx="12" stroke-width="1"/>
  <text class="sm" x="212" y="270" font-weight="700">zone eu-west-1a</text>
  <rect class="bm" x="490" y="250" width="270" height="120" rx="12" stroke-width="1"/>
  <text class="sm" x="502" y="270" font-weight="700">zone eu-west-1b</text>
  <rect class="bp" x="504" y="286" width="150" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="579" y="311" text-anchor="middle" font-weight="700">pod reports</text>
  <text class="sm" x="504" y="346">scheduled first</text>
  <g class="a a1">
  <rect class="bt" x="664" y="286" width="86" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="707" y="311" text-anchor="middle" font-weight="700">EBS</text>
  </g>
  <text class="sm okt a a1" x="664" y="346">then disk ✓</text>
  <text class="sub" x="28" y="412">Use WaitForFirstConsumer for any zonal storage (EBS, Azure Disk): the pod&#x27;s zone decides the disk&#x27;s.</text>
</svg>
