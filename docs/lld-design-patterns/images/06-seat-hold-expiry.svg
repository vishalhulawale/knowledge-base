<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Seat hold with expiry</title>
  <desc id="d">Seat C7 for one show. Alice holds it at minute 0 with a 5-minute expiry and the seat moves from AVAILABLE to HELD. Bob tries to hold it at minute 2 and is refused because it&#x27;s held. Alice never pays; at minute 5 the hold expires and the seat goes back to AVAILABLE, either by a sweeper or lazily on the next check. Bob tries again at minute 6, holds it, pays, and the seat becomes BOOKED. The check-and-set on the seat is atomic, so two holds can never both win.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:16s infinite linear}
    @keyframes q0{0%,8%{opacity:1}9%{opacity:0}100%{opacity:0}}
    .q0{animation-name:q0}
    @keyframes q1{0%{opacity:0}8%{opacity:0}9%,44%{opacity:1}45%{opacity:0}100%{opacity:0}}
    .q1{animation-name:q1}
    @keyframes q2{0%{opacity:0}44%{opacity:0}45%,56%{opacity:1}57%{opacity:0}100%{opacity:0}}
    .q2{animation-name:q2}
    @keyframes q3{0%{opacity:0}56%{opacity:0}57%,76%{opacity:1}77%{opacity:0}100%{opacity:0}}
    .q3{animation-name:q3}
    @keyframes q4{0%{opacity:0}76%{opacity:0}77%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .q4{animation-name:q4}
    @keyframes tm1{0%,9%{transform:scaleX(0)}44%{transform:scaleX(1)}45%,100%{transform:scaleX(0)}}.tm1{transform-box:fill-box;transform-origin:0 50%;animation:tm1 16s infinite linear}
    @keyframes g0{0%{opacity:0}8%{opacity:0}9%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .g0{animation-name:g0}
    @keyframes g1{0%{opacity:0}24%{opacity:0}25%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .g1{animation-name:g1}
    @keyframes g2{0%{opacity:0}44%{opacity:0}45%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .g2{animation-name:g2}
    @keyframes g3{0%{opacity:0}56%{opacity:0}57%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .g3{animation-name:g3}
    @keyframes g4{0%{opacity:0}76%{opacity:0}77%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .g4{animation-name:g4}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .q0,.q1,.q2,.q4{opacity:0!important}
    }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Seat C7: hold, expire, re-hold, book</text>
  <text class="sub" x="28" y="62">A hold is a lease with an expiry, not a booking.</text>
  <rect class="box" x="28" y="110" width="160" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="108" y="138" text-anchor="middle" font-weight="700">AVAILABLE</text>
  <rect class="box" x="228" y="110" width="160" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="308" y="138" text-anchor="middle" font-weight="700">HELD</text>
  <rect class="box" x="428" y="110" width="160" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="508" y="138" text-anchor="middle" font-weight="700">BOOKED</text>
  <line class="ln" x1="188" y1="133" x2="224" y2="133" marker-end="url(#ar)"/>
  <line class="ln" x1="388" y1="133" x2="424" y2="133" marker-end="url(#ar)"/>
  <path class="lnw" d="M 308 158 C 300 210, 120 210, 108 162" marker-end="url(#arw)"/>
  <text class="sm wrnt" x="208" y="216" text-anchor="middle">hold expired</text>
  <g class="a q0">
  <rect class="okf" x="28" y="110" width="160" height="46" rx="10"/>
  <text class="on" x="108" y="137.5" text-anchor="middle">AVAILABLE</text>
  </g>
  <g class="a q1">
  <rect class="wrnf" x="228" y="110" width="160" height="46" rx="10"/>
  <text class="on" x="308" y="137.5" text-anchor="middle">HELD</text>
  </g>
  <g class="a q2">
  <rect class="okf" x="28" y="110" width="160" height="46" rx="10"/>
  <text class="on" x="108" y="137.5" text-anchor="middle">AVAILABLE</text>
  </g>
  <g class="a q3">
  <rect class="wrnf" x="228" y="110" width="160" height="46" rx="10"/>
  <text class="on" x="308" y="137.5" text-anchor="middle">HELD</text>
  </g>
  <g class="a q4">
  <rect class="pri" x="428" y="110" width="160" height="46" rx="10"/>
  <text class="on" x="508" y="137.5" text-anchor="middle">BOOKED</text>
  </g>
  <text class="sm" x="600" y="112">Alice&#x27;s hold</text>
  <rect class="bm" x="600" y="120" width="172" height="12" rx="6"/>
  <rect class="wrnf tm1" x="600" y="120" width="172" height="12" rx="6"/>
  <text class="sm" x="600" y="150">expires after 5 min</text>
  <text class="tx  a g0" x="28" y="262">0:00  Alice holdSeat(C7) → OK, expires 0:05</text>
  <text class="tx badt a g1" x="28" y="284">2:00  Bob holdSeat(C7) → SeatUnavailable</text>
  <text class="tx wrnt a g2" x="28" y="306">5:00  hold expires → C7 AVAILABLE</text>
  <text class="tx okt a g3" x="28" y="328">6:00  Bob holdSeat(C7) → OK</text>
  <text class="tx prit a g4" x="28" y="350">7:30  Bob confirm(hold) → BOOKED</text>
  <text class="sub" x="28" y="384">Atomic hold: UPDATE seat SET state=&#x27;HELD&#x27; WHERE id=&#x27;C7&#x27; AND (state=&#x27;AVAILABLE&#x27; OR expired)</text>
</svg>
