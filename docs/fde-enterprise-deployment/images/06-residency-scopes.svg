<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 504" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Processing scope by platform</title>
  <desc id="d">Three nested scopes: one region such as eu-central-1, inside a geography or Azure Data Zone such as the EU or US, inside global, meaning any supported commercial region. Moving outward buys capacity (Bedrock global profiles are cheaper, Azure Global deployments have the highest quota); moving inward keeps processing where the privacy team agreed. Azure keeps data at rest in the resource's geography for all types. A table maps the scopes: Bedrock in-region model IDs, eu., us. or apac. geographic profiles and global profiles; Azure Regional or Standard, Data Zone and Global deployments; Vertex AI regional endpoints, its per-model residency table and the global endpoint. A common failure is choosing global for capacity and having the privacy team reject it later.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="502" rx="14"/>
  <text class="h" x="28" y="40">Where may a request be processed?</text><text class="sub" x="28" y="62">Each platform names the same three scopes differently. Wider scope buys capacity, not residency.</text><rect class="bm" x="28" y="82" width="420" height="230" rx="14" stroke-width="1.5"/><text class="lbl" x="44" y="106">Global</text><text class="sub" x="102" y="106">any supported commercial region</text><rect class="bt" x="48" y="120" width="380" height="176" rx="12" stroke-width="1.5"/><text class="lbl" x="64" y="144">Geography / Data Zone</text><text class="sub" x="240" y="144">e.g. EU or US</text><rect class="bp" x="68" y="158" width="340" height="120" rx="10" stroke-width="1.5"/><text class="lbl" x="84" y="182">One region</text><text class="sub" x="170" y="182">e.g. eu-central-1</text><text class="sm" x="84" y="214">Strongest residency; capacity</text><text class="sm" x="84" y="233">limited to that region's quota</text><line class="lnw" x1="476" y1="296" x2="476" y2="96" marker-end="url(#arw)"/><text class="sm" x="492" y="108">Outward: more capacity</text><text class="sm" x="492" y="128">Bedrock global: lower price</text><text class="sm" x="492" y="148">Azure Global: highest quota</text><text class="sm" x="492" y="196">Inward: processing stays</text><text class="sm" x="492" y="216">where the privacy team agreed</text><text class="sub" x="492" y="262">Azure: data at rest stays in the</text><text class="sub" x="492" y="280">resource's geography in all types</text><rect class="bm" x="28" y="330" width="744" height="34" rx="6"/><text class="sm" x="40" y="352" font-weight="700">Scope</text><text class="sm" x="200" y="352" font-weight="700">Amazon Bedrock</text><text class="sm" x="400" y="352" font-weight="700">Azure OpenAI</text><text class="sm" x="600" y="352" font-weight="700">Vertex AI</text><line class="grid" x1="28" y1="396" x2="772" y2="396"/><text class="sm" x="40" y="385" font-weight="700">One region</text><text class="sm" x="200" y="385">in-region model ID</text><text class="sm" x="400" y="385">Regional / Standard</text><text class="sm" x="600" y="385">regional endpoint</text><line class="grid" x1="28" y1="428" x2="772" y2="428"/><text class="sm" x="40" y="417" font-weight="700">Geography</text><text class="sm" x="200" y="417">eu. / us. / apac. profile</text><text class="sm" x="400" y="417">Data Zone (EU, US)</text><text class="sm" x="600" y="417">per-model residency table</text><line class="grid" x1="28" y1="460" x2="772" y2="460"/><text class="sm" x="40" y="449" font-weight="700">Global</text><text class="sm" x="200" y="449">global profile</text><text class="sm" x="400" y="449">Global deployment</text><text class="sm" x="600" y="449">global endpoint</text><text class="badt" x="28" y="484" style="font-size:13.5px">Field failure: "global" picked quietly for capacity, later rejected by the privacy team.</text>
</svg>
