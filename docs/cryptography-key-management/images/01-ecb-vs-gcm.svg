<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">ECB leaks repeated blocks; GCM doesn&#x27;t</title>
  <desc id="d">A record split into eight 16-byte blocks, where blocks 1, 4 and 7 hold the same SSN text and blocks 2 and 6 the same padding. Encrypted with AES in ECB mode, identical plaintext blocks give identical ciphertext blocks, shown as the same colour and hex prefix, so an attacker sees which fields repeat without decrypting anything. Encrypted with AES-GCM, a counter mode, every block gets a different keystream, so every ciphertext block looks unrelated.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Same plaintext, two modes</text>
  <text class="sub" x="28" y="62">8 blocks of 16 bytes. Identical colours = identical bytes. Hex prefixes illustrative.</text>
  <text class="lbl" x="28" y="126">plaintext</text>
  <rect class="pri" x="140" y="104" width="73" height="34" rx="5"/>
  <text class="on13" x="176.5" y="125.5" text-anchor="middle">NAME</text>
  <rect class="tea" x="219" y="104" width="73" height="34" rx="5"/>
  <text class="on13" x="255.5" y="125.5" text-anchor="middle">SSN</text>
  <rect class="wrnf" x="298" y="104" width="73" height="34" rx="5"/>
  <text class="on13" x="334.5" y="125.5" text-anchor="middle">pad</text>
  <rect class="badf" x="377" y="104" width="73" height="34" rx="5"/>
  <text class="on13" x="413.5" y="125.5" text-anchor="middle">DOB</text>
  <rect class="tea" x="456" y="104" width="73" height="34" rx="5"/>
  <text class="on13" x="492.5" y="125.5" text-anchor="middle">SSN</text>
  <rect class="okf" x="535" y="104" width="73" height="34" rx="5"/>
  <text class="on13" x="571.5" y="125.5" text-anchor="middle">PLAN</text>
  <rect class="wrnf" x="614" y="104" width="73" height="34" rx="5"/>
  <text class="on13" x="650.5" y="125.5" text-anchor="middle">pad</text>
  <rect class="tea" x="693" y="104" width="73" height="34" rx="5"/>
  <text class="on13" x="729.5" y="125.5" text-anchor="middle">SSN</text>
  <text class="lbl" x="28" y="206">AES-ECB</text>
  <rect class="pri" x="140" y="184" width="73" height="34" rx="5"/>
  <text class="on13" x="176.5" y="205.5" text-anchor="middle">02ce76</text>
  <rect class="tea" x="219" y="184" width="73" height="34" rx="5"/>
  <text class="on13" x="255.5" y="205.5" text-anchor="middle">95030e</text>
  <rect class="wrnf" x="298" y="184" width="73" height="34" rx="5"/>
  <text class="on13" x="334.5" y="205.5" text-anchor="middle">3784a4</text>
  <rect class="badf" x="377" y="184" width="73" height="34" rx="5"/>
  <text class="on13" x="413.5" y="205.5" text-anchor="middle">df0f25</text>
  <rect class="tea" x="456" y="184" width="73" height="34" rx="5"/>
  <text class="on13" x="492.5" y="205.5" text-anchor="middle">95030e</text>
  <rect class="okf" x="535" y="184" width="73" height="34" rx="5"/>
  <text class="on13" x="571.5" y="205.5" text-anchor="middle">59e5d6</text>
  <rect class="wrnf" x="614" y="184" width="73" height="34" rx="5"/>
  <text class="on13" x="650.5" y="205.5" text-anchor="middle">3784a4</text>
  <rect class="tea" x="693" y="184" width="73" height="34" rx="5"/>
  <text class="on13" x="729.5" y="205.5" text-anchor="middle">95030e</text>
  <text class="lbl" x="28" y="286">AES-GCM</text>
  <rect class="mutf" x="140" y="264" width="73" height="34" rx="5"/>
  <text class="on13" x="176.5" y="285.5" text-anchor="middle">ae0fe6</text>
  <rect class="mutf" x="219" y="264" width="73" height="34" rx="5"/>
  <text class="on13" x="255.5" y="285.5" text-anchor="middle">e31b85</text>
  <rect class="mutf" x="298" y="264" width="73" height="34" rx="5"/>
  <text class="on13" x="334.5" y="285.5" text-anchor="middle">6cc2b7</text>
  <rect class="mutf" x="377" y="264" width="73" height="34" rx="5"/>
  <text class="on13" x="413.5" y="285.5" text-anchor="middle">90ef73</text>
  <rect class="mutf" x="456" y="264" width="73" height="34" rx="5"/>
  <text class="on13" x="492.5" y="285.5" text-anchor="middle">931a5b</text>
  <rect class="mutf" x="535" y="264" width="73" height="34" rx="5"/>
  <text class="on13" x="571.5" y="285.5" text-anchor="middle">a59b5b</text>
  <rect class="mutf" x="614" y="264" width="73" height="34" rx="5"/>
  <text class="on13" x="650.5" y="285.5" text-anchor="middle">4c8b72</text>
  <rect class="mutf" x="693" y="264" width="73" height="34" rx="5"/>
  <text class="on13" x="729.5" y="285.5" text-anchor="middle">ed47d9</text>
  <text class="sm badt" x="140" y="236">SSN blocks 1, 4, 7 encrypt to the same bytes: patterns survive</text>
  <text class="sm okt" x="140" y="316">counter mode: every block different, nothing to correlate</text>
  <text class="tx" x="28" y="360">ECB is never acceptable. Use an AEAD (AES-GCM, ChaCha20-Poly1305), which also detects tampering.</text>
  <text class="sub" x="28" y="382">Measured on the page: two copies of SSN=123-45-6789! under ECB gave the same block ff39fd26b9245453…</text>
</svg>
