    @keyframes s6{0%,49.99%{opacity:0}50%,98.99%{opacity:1}99%,100%{opacity:0}}.s6{animation-name:s6}
    @keyframes s7{0%,21.6567%{opacity:0}21.6667%,98.99%{opacity:1}99%,100%{opacity:0}}.s7{animation-name:s7}
    @keyframes s8{0%,63.3233%{opacity:0}63.3333%,98.99%{opacity:1}99%,100%{opacity:0}}.s8{animation-name:s8}
    @keyframes s9{0%,0.29%{opacity:0}0.3%,98.99%{opacity:1}99%,100%{opacity:0}}.s9{animation-name:s9}
    @keyframes s10{0%,3.99%{opacity:0}4%,98.99%{opacity:1}99%,100%{opacity:0}}.s10{animation-name:s10}
    @keyframes s11{0%,33.3233%{opacity:0}33.3333%,98.99%{opacity:1}99%,100%{opacity:0}}.s11{animation-name:s11}
    @keyframes s12{0%,4.99%{opacity:0}5%,98.99%{opacity:1}99%,100%{opacity:0}}.s12{animation-name:s12}
    @keyframes s13{0%,46.6567%{opacity:0}46.6667%,98.99%{opacity:1}99%,100%{opacity:0}}.s13{animation-name:s13}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}.cur{animation:none;opacity:0}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="410" rx="14"/>
  <text class="h" x="28" y="40">Same page, three strategies: when is it visible, when does it work?</text><text class="sub" x="28" y="62">Illustrative timings for a mid-range phone; milliseconds from navigation start.</text><line class="grid" x1="170" y1="84" x2="170" y2="340"/><text class="sub" x="170" y="360" text-anchor="middle">0 ms</text><line class="grid" x1="317.5" y1="84" x2="317.5" y2="340"/><text class="sub" x="317.5" y="360" text-anchor="middle">600 ms</text><line class="grid" x1="465" y1="84" x2="465" y2="340"/><text class="sub" x="465" y="360" text-anchor="middle">1200 ms</text><line class="grid" x1="612.5" y1="84" x2="612.5" y2="340"/><text class="sub" x="612.5" y="360" text-anchor="middle">1800 ms</text><line class="grid" x1="760" y1="84" x2="760" y2="340"/><text class="sub" x="760" y="360" text-anchor="middle">2400 ms</text><text class="lbl" x="28" y="119">CSR</text><rect class="bm" x="170" y="100" width="590" height="28" rx="6"/><g class="k s0"><rect class="mutf" x="171" y="101" width="34.875" height="26" rx="5"/></g><g class="k s1"><rect class="pri" x="207.875" y="101" width="256.125" height="26" rx="5"/><text class="on13" x="335.938" y="119" text-anchor="middle">download + run JS</text></g><g class="k s2"><rect class="wrnf" x="466" y="101" width="170.083" height="26" rx="5"/><text class="on13" x="551.042" y="119" text-anchor="middle">API data</text></g><g class="k s3"><rect class="okf" x="635.083" y="94" width="4" height="50" rx="1"/><text class="okt" x="631.083" y="148" text-anchor="end" style="font-size:13px">content + interactive</text></g><text class="lbl" x="28" y="201">SSR</text><rect class="bm" x="170" y="182" width="590" height="28" rx="6"/><g class="k s4"><rect class="mutf" x="171" y="183" width="157.792" height="26" rx="5"/><text class="on13" x="249.896" y="201" text-anchor="middle">server render (TTFB)</text></g><g class="k s5"><rect class="pri" x="330.792" y="183" width="206.958" height="26" rx="5"/><text class="on13" x="434.271" y="201" text-anchor="middle">download + run JS</text></g><g class="k s6"><rect class="tea" x="539.75" y="183" width="96.3333" height="26" rx="5"/><text class="on13" x="587.917" y="201" text-anchor="middle">hydrate</text></g><g class="k s7"><rect class="okf" x="327.792" y="176" width="4" height="50" rx="1"/><text class="okt" x="335.792" y="230" text-anchor="start" style="font-size:13px">content</text></g><g class="k s8"><rect class="tea" x="635.083" y="176" width="4" height="50" rx="1"/><text class="teat" x="631.083" y="230" text-anchor="end" style="font-size:13px">interactive</text></g><text class="lbl" x="28" y="283">SSG / ISR</text><rect class="bm" x="170" y="264" width="590" height="28" rx="6"/><g class="k s9"><rect class="mutf" x="171" y="265" width="27.5" height="26" rx="5"/></g><g class="k s10"><rect class="pri" x="200.5" y="265" width="214.333" height="26" rx="5"/><text class="on13" x="307.667" y="283" text-anchor="middle">download + run JS</text></g><g class="k s11"><rect class="tea" x="416.833" y="265" width="96.3333" height="26" rx="5"/><text class="on13" x="465" y="283" text-anchor="middle">hydrate</text></g><g class="k s12"><rect class="okf" x="204.875" y="258" width="4" height="50" rx="1"/><text class="okt" x="212.875" y="312" text-anchor="start" style="font-size:13px">content (CDN)</text></g><g class="k s13"><rect class="tea" x="512.167" y="258" width="4" height="50" rx="1"/><text class="teat" x="520.167" y="312" text-anchor="start" style="font-size:13px">interactive</text></g><g class="cur"><line class="lnw" x1="170" y1="84" x2="170" y2="340" style="stroke-width:2"/></g><text class="sm" x="28" y="392">Server rendering moves 'content' left; only less JavaScript or cheaper hydration moves 'interactive'.</text>
</svg>
