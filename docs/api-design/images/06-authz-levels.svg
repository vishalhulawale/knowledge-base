<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Authorisation at three levels</title>
  <desc id="d">Three nested questions every request must pass. Function level, API5: may a member call PATCH on claims at all, checked with scopes or roles and denied by default. Object level, API1: may this member touch this particular claim, checked against ownership or tenant on every access. Property level, API3: which fields may they see and which may they set; a member can see their claim&#x27;s status but not set it, and can&#x27;t see another member&#x27;s SSN. Each level catches a different OWASP API Top 10 risk.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="368" rx="14"/>
  <text class="h" x="28" y="40">Function → object → property</text>
  <text class="sub" x="28" y="62">Each ring is a separate check. Passing an outer ring says nothing about the inner ones.</text>
  <rect class="bp" x="28" y="90" width="744" height="230" rx="18" stroke-width="1.5"/>
  <text class="lbl prit" x="48" y="116">Function level (API5): may a MEMBER call PATCH /claims/{id}?</text>
  <text class="sm" x="48" y="136">@PreAuthorize(&quot;hasAuthority(&#x27;SCOPE_claims:write&#x27;)&quot;), deny by default</text>
  <rect class="bt" x="60" y="152" width="680" height="152" rx="16" stroke-width="1.5"/>
  <text class="lbl teat" x="80" y="178">Object level (API1, BOLA): may M42 touch claim c-1002?</text>
  <text class="sm" x="80" y="198">ownership / tenant check on every access: WHERE member_id = :caller</text>
  <rect class="bw" x="92" y="214" width="616" height="76" rx="14" stroke-width="1.5"/>
  <text class="lbl wrnt" x="112" y="240">Property level (API3): which fields may M42 read or write?</text>
  <text class="sm" x="112" y="262">separate response DTOs per audience; request DTOs contain only writable fields</text>
  <text class="sm" x="112" y="280">(member can read status, never set it; never sees another member&#x27;s SSN)</text>
  <text class="sub" x="28" y="350">Most API breaches pass the outer ring: the caller is authenticated and allowed to call the endpoint.</text>
</svg>
