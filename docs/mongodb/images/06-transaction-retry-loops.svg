<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Transaction retry loops</title>
  <desc id="d">Two retry loops that the withTransaction callback API runs for you. Start the transaction and run the callback. If an operation fails with the TransientTransactionError label, for example a write conflict or a primary step-down, retry the whole transaction from the start. Then commit. If the commit fails with UnknownTransactionCommitResult, the outcome is unknown, so retry only the commit, which is idempotent. Both loops stop after 120 seconds.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Two labels, two loops</text>
  <text class="sub" x="28" y="62">What session.withTransaction(fn) does for you. Both loops give up after 120 s.</text>
  <rect class="box" x="28" y="150" width="150" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="103" y="180" text-anchor="middle" font-weight="700">startTransaction</text>
  <rect class="bp" x="220" y="150" width="170" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="305" y="172" text-anchor="middle" font-weight="700">run callback</text>
  <text class="sm" x="305" y="189" text-anchor="middle">reads + writes</text>
  <rect class="bt" x="430" y="150" width="176" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="518" y="180" text-anchor="middle" font-weight="700">commitTransaction</text>
  <rect class="bo" x="640" y="150" width="132" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="706" y="180" text-anchor="middle" font-weight="700">committed ✓</text>
  <line class="ln" x1="178" y1="175" x2="216" y2="175" marker-end="url(#ar)"/>
  <line class="ln" x1="390" y1="175" x2="426" y2="175" marker-end="url(#ar)"/>
  <line class="lno" x1="606" y1="175" x2="636" y2="175" marker-end="url(#aro)"/>
  <path class="lnb" d="M 305 150 C 305 96, 103 96, 103 146" marker-end="url(#arb)"/>
  <text class="sm badt" x="28" y="92">TransientTransactionError → retry the WHOLE transaction</text>
  <path class="lnw" d="M 560 200 C 600 262, 470 262, 500 204" marker-end="url(#arw)"/>
  <text class="sm wrnt" x="515" y="282" text-anchor="middle">UnknownTransactionCommitResult</text>
  <text class="sm wrnt" x="515" y="298" text-anchor="middle">→ retry the commit only</text>
  <text class="tx" x="28" y="334">The callback may run several times: no emails or Kafka sends inside it, or they repeat on each retry.</text>
  <text class="sub" x="28" y="358">Measured: 20 threads × 20 transfers on the same two documents → 935 automatic retries, totals still exact.</text>
</svg>
