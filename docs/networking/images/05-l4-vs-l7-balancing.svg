<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">L4 vs L7 load balancing of one HTTP/2 connection</title>
  <desc id="d">Two side-by-side panels. In both, one client opens a single HTTP/2 connection and sends four requests as streams on it, to a pool of three backends A, B and C. Left panel, an L4 load balancer: it picks a backend once per TCP connection, so the whole connection and all four requests go to backend A, while B and C stay idle. Right panel, an L7 proxy: it terminates the client connection, parses each request and balances per request over its own pooled connections, so the requests go to A, B, C and then A again. Simplified: real load balancers see many clients, and the imbalance shows up with long-lived HTTP/2 or gRPC connections.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}.mutt{fill:#94a3b8;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}.lnm{stroke:#cbd5e1;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .thick{stroke-width:5}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}.mutt{fill:#64748b}
      .ln{stroke:#94a3b8}.lnm{stroke:#475569}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }
    .dot{opacity:0;animation:10s infinite linear}
    @keyframes m00{0%,3.99%{opacity:0;transform:translate(0px,0px)}4.00%{opacity:1;transform:translate(0px,0px)}9.85%{opacity:1;transform:translate(96.0px,0.0px)}12.41%{opacity:1;transform:translate(138.0px,0.0px)}15.49%{opacity:1;transform:translate(166.0px,-42.0px)}18.00%{opacity:1;transform:translate(202.0px,-62.0px)}18.60%,100%{opacity:0;transform:translate(202.0px,-62.0px)}}
    @keyframes m01{0%,23.99%{opacity:0;transform:translate(0px,0px)}24.00%{opacity:1;transform:translate(0px,0px)}29.85%{opacity:1;transform:translate(96.0px,0.0px)}32.41%{opacity:1;transform:translate(138.0px,0.0px)}35.49%{opacity:1;transform:translate(166.0px,-42.0px)}38.00%{opacity:1;transform:translate(202.0px,-62.0px)}38.60%,100%{opacity:0;transform:translate(202.0px,-62.0px)}}
    @keyframes m02{0%,43.99%{opacity:0;transform:translate(0px,0px)}44.00%{opacity:1;transform:translate(0px,0px)}49.85%{opacity:1;transform:translate(96.0px,0.0px)}52.41%{opacity:1;transform:translate(138.0px,0.0px)}55.49%{opacity:1;transform:translate(166.0px,-42.0px)}58.00%{opacity:1;transform:translate(202.0px,-62.0px)}58.60%,100%{opacity:0;transform:translate(202.0px,-62.0px)}}
    @keyframes m03{0%,63.99%{opacity:0;transform:translate(0px,0px)}64.00%{opacity:1;transform:translate(0px,0px)}69.85%{opacity:1;transform:translate(96.0px,0.0px)}72.41%{opacity:1;transform:translate(138.0px,0.0px)}75.49%{opacity:1;transform:translate(166.0px,-42.0px)}78.00%{opacity:1;transform:translate(202.0px,-62.0px)}78.60%,100%{opacity:0;transform:translate(202.0px,-62.0px)}}
    @keyframes m10{0%,3.99%{opacity:0;transform:translate(0px,0px)}4.00%{opacity:1;transform:translate(0px,0px)}9.92%{opacity:1;transform:translate(96.0px,0.0px)}12.51%{opacity:1;transform:translate(138.0px,0.0px)}18.00%{opacity:1;transform:translate(202.0px,-62.0px)}18.60%,100%{opacity:0;transform:translate(202.0px,-62.0px)}}
    @keyframes m11{0%,23.99%{opacity:0;transform:translate(0px,0px)}24.00%{opacity:1;transform:translate(0px,0px)}30.65%{opacity:1;transform:translate(96.0px,0.0px)}33.56%{opacity:1;transform:translate(138.0px,0.0px)}38.00%{opacity:1;transform:translate(202.0px,0.0px)}38.60%,100%{opacity:0;transform:translate(202.0px,0.0px)}}
    @keyframes m12{0%,43.99%{opacity:0;transform:translate(0px,0px)}44.00%{opacity:1;transform:translate(0px,0px)}49.92%{opacity:1;transform:translate(96.0px,0.0px)}52.51%{opacity:1;transform:translate(138.0px,0.0px)}58.00%{opacity:1;transform:translate(202.0px,62.0px)}58.60%,100%{opacity:0;transform:translate(202.0px,62.0px)}}
    @keyframes m13{0%,63.99%{opacity:0;transform:translate(0px,0px)}64.00%{opacity:1;transform:translate(0px,0px)}69.92%{opacity:1;transform:translate(96.0px,0.0px)}72.51%{opacity:1;transform:translate(138.0px,0.0px)}78.00%{opacity:1;transform:translate(202.0px,-62.0px)}78.60%,100%{opacity:0;transform:translate(202.0px,-62.0px)}}
    @media (prefers-reduced-motion: reduce){.dot{animation:none;opacity:0}}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">One HTTP/2 connection, four requests: who balances what</text>
  <text class="sub" x="28" y="62">Simplified: one client, one long-lived connection carrying 4 requests (streams) to backends A, B, C.</text>
  <text class="h2" x="28" y="98">L4 load balancer (connection-level)</text>
  <rect class="box" x="28" y="180" width="78" height="44" rx="8" stroke-width="1.5"/><text class="tx" x="67.0" y="207.0" text-anchor="middle" font-weight="700">Client</text>
  <rect class="bt" x="160" y="174" width="84" height="56" rx="8" stroke-width="1.5"/><text class="teat" x="202.0" y="199.0" text-anchor="middle" font-weight="700">L4 LB</text><text class="sub" x="202.0" y="216.0" text-anchor="middle">NAT / flow</text>
  <rect class="box" x="302" y="118" width="76" height="44" rx="8" stroke-width="1.5"/><text class="tx" x="340.0" y="145.0" text-anchor="middle" font-weight="700">A</text>
  <rect class="box" x="302" y="180" width="76" height="44" rx="8" stroke-width="1.5"/><text class="tx" x="340.0" y="207.0" text-anchor="middle" font-weight="700">B</text>
  <rect class="box" x="302" y="242" width="76" height="44" rx="8" stroke-width="1.5"/><text class="tx" x="340.0" y="269.0" text-anchor="middle" font-weight="700">C</text>
  <line class="lnt thick" x1="106" y1="202" x2="160" y2="202"/>
  <path class="lnt thick" d="M244,202 C270,202 272,140 302,140"/>
  <line class="lnm dash" x1="244" y1="206" x2="302" y2="202"/>
  <path class="lnm dash" d="M244,210 C270,210 272,264 302,264"/>
  <text class="sub" x="28" y="262">same TCP connection,</text>
  <text class="sub" x="28" y="278">end to end (bytes, not requests)</text>
  <text class="tx badt" x="28" y="318">A: 4 requests · B: idle · C: idle</text>
  <text class="h2" x="428" y="98">L7 proxy (request-level)</text>
  <rect class="box" x="428" y="180" width="78" height="44" rx="8" stroke-width="1.5"/><text class="tx" x="467.0" y="207.0" text-anchor="middle" font-weight="700">Client</text>
  <rect class="bp" x="560" y="174" width="84" height="56" rx="8" stroke-width="1.5"/><text class="prit" x="602.0" y="199.0" text-anchor="middle" font-weight="700">L7 proxy</text><text class="sub" x="602.0" y="216.0" text-anchor="middle">terminates</text>
  <rect class="box" x="702" y="118" width="76" height="44" rx="8" stroke-width="1.5"/><text class="tx" x="740.0" y="145.0" text-anchor="middle" font-weight="700">A</text>
  <rect class="box" x="702" y="180" width="76" height="44" rx="8" stroke-width="1.5"/><text class="tx" x="740.0" y="207.0" text-anchor="middle" font-weight="700">B</text>
  <rect class="box" x="702" y="242" width="76" height="44" rx="8" stroke-width="1.5"/><text class="tx" x="740.0" y="269.0" text-anchor="middle" font-weight="700">C</text>
  <line class="lnp thick" x1="506" y1="202" x2="560" y2="202"/>
  <line class="lnp" x1="644" y1="202" x2="702" y2="140"/>
  <line class="lnp" x1="644" y1="202" x2="702" y2="202"/>
  <line class="lnp" x1="644" y1="202" x2="702" y2="264"/>
  <text class="sub" x="428" y="262">client connection ends here;</text>
  <text class="sub" x="428" y="278">pooled connections to each backend</text>
  <text class="tx okt" x="428" y="318">A: 2 · B: 1 · C: 1 requests</text>
  <line class="lnm" x1="400" y1="84" x2="400" y2="336"/>
  <text class="lbl" x="28" y="364">L4 picks a backend per connection: every stream on it lands on A.</text>
  <text class="lbl" x="28" y="388">L7 reads each request and spreads them, and can retry, route by path and add headers.</text>
  <circle class="tea dot" style="animation-name:m00" cx="106" cy="202" r="7"/>
  <circle class="tea dot" style="animation-name:m01" cx="106" cy="202" r="7"/>
  <circle class="tea dot" style="animation-name:m02" cx="106" cy="202" r="7"/>
  <circle class="tea dot" style="animation-name:m03" cx="106" cy="202" r="7"/>
  <circle class="pri dot" style="animation-name:m10" cx="506" cy="202" r="7"/>
  <circle class="pri dot" style="animation-name:m11" cx="506" cy="202" r="7"/>
  <circle class="pri dot" style="animation-name:m12" cx="506" cy="202" r="7"/>
  <circle class="pri dot" style="animation-name:m13" cx="506" cy="202" r="7"/>
</svg>
