    .l5{animation-name:l5}
    @keyframes lo0{0%{opacity:0}59%{opacity:0}60%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .lo0{animation-name:lo0}
    @keyframes lo1{0%{opacity:0}64%{opacity:0}65%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .lo1{animation-name:lo1}
    @keyframes lo2{0%{opacity:0}67%{opacity:0}68%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .lo2{animation-name:lo2}
    @keyframes lo3{0%{opacity:0}70%{opacity:0}71%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .lo3{animation-name:lo3}
    @keyframes lo4{0%{opacity:0}73%{opacity:0}74%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .lo4{animation-name:lo4}
    @keyframes lo5{0%{opacity:0}76%{opacity:0}77%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .lo5{animation-name:lo5}
    @keyframes rf{0%{opacity:0}5%{opacity:0}6%,14%{opacity:1}15%{opacity:0}100%{opacity:0}}
    .rf{animation-name:rf}
    @keyframes rm{0%{opacity:0}14%{opacity:0}15%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .rm{animation-name:rm}
    @keyframes r1{0%{opacity:0}18%{opacity:0}19%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
