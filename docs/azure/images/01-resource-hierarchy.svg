<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 568" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Azure and AWS hierarchies</title>
  <desc id="d">Two columns compare the Azure and AWS resource hierarchies row by row. A Microsoft Entra tenant matches an AWS Organization with IAM Identity Center. The root management group matches the organization root, where Azure Policy and RBAC or SCPs and RCPs are set and inherited. Management groups match organizational units. Subscriptions match accounts as the billing, quota and access boundary. Resource groups have no direct AWS equivalent, where tags and CloudFormation stacks are used instead. Resources sit at the bottom of both. A note says that in Azure the Entra tenant is shared above every subscription, while in AWS IAM lives inside each account and cross-account access means assuming a role.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="566" rx="14"/>
  <text class="h" x="28" y="40">Where things live: Azure vs AWS hierarchy</text><text class="sub" x="28" y="62">Same idea (policy and billing flow down a tree), different boxes. Read across each row.</text><text class="prit" x="208" y="98" text-anchor="middle" style="font-size:17px">Azure</text><text class="wrnt" x="592" y="98" text-anchor="middle" style="font-size:17px">AWS</text><rect class="bp" x="28" y="112" width="360" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="208" y="133" text-anchor="middle">Microsoft Entra tenant</text><text class="sub" x="208" y="151" text-anchor="middle">identity boundary: users, groups, apps</text><line class="ln" x1="208" y1="160" x2="208" y2="172" marker-end="url(#ar)"/><rect class="bw" x="412" y="112" width="360" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="592" y="133" text-anchor="middle">AWS Organization + IAM Identity Center</text><text class="sub" x="592" y="151" text-anchor="middle">management account, workforce SSO</text><line class="ln" x1="592" y1="160" x2="592" y2="172" marker-end="url(#ar)"/><text class="h2" x="400" y="142" text-anchor="middle">≈</text><rect class="bp" x="28" y="174" width="360" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="208" y="195" text-anchor="middle">Root management group</text><text class="sub" x="208" y="213" text-anchor="middle">Azure Policy + RBAC set here inherit</text><line class="ln" x1="208" y1="222" x2="208" y2="234" marker-end="url(#ar)"/><rect class="bw" x="412" y="174" width="360" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="592" y="195" text-anchor="middle">Organization root</text><text class="sub" x="592" y="213" text-anchor="middle">SCPs / RCPs set here inherit</text><line class="ln" x1="592" y1="222" x2="592" y2="234" marker-end="url(#ar)"/><text class="h2" x="400" y="204" text-anchor="middle">≈</text><rect class="bp" x="28" y="236" width="360" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="208" y="257" text-anchor="middle">Management groups</text><text class="sub" x="208" y="275" text-anchor="middle">e.g. Platform, Prod, NonProd</text><line class="ln" x1="208" y1="284" x2="208" y2="296" marker-end="url(#ar)"/><rect class="bw" x="412" y="236" width="360" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="592" y="257" text-anchor="middle">Organizational units (OUs)</text><text class="sub" x="592" y="275" text-anchor="middle">e.g. Security, Workloads/Prod</text><line class="ln" x1="592" y1="284" x2="592" y2="296" marker-end="url(#ar)"/><text class="h2" x="400" y="266" text-anchor="middle">≈</text><rect class="bp" x="28" y="298" width="360" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="208" y="319" text-anchor="middle">Subscriptions</text><text class="sub" x="208" y="337" text-anchor="middle">billing, quota and RBAC boundary</text><line class="ln" x1="208" y1="346" x2="208" y2="358" marker-end="url(#ar)"/><rect class="bw" x="412" y="298" width="360" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="592" y="319" text-anchor="middle">Accounts</text><text class="sub" x="592" y="337" text-anchor="middle">billing, quota and IAM boundary</text><line class="ln" x1="592" y1="346" x2="592" y2="358" marker-end="url(#ar)"/><text class="h2" x="400" y="328" text-anchor="middle">≈</text><rect class="bp" x="28" y="360" width="360" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="208" y="381" text-anchor="middle">Resource groups</text><text class="sub" x="208" y="399" text-anchor="middle">lifecycle container, one region for metadata</text><line class="ln" x1="208" y1="408" x2="208" y2="420" marker-end="url(#ar)"/><rect class="bm" x="412" y="360" width="360" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="592" y="381" text-anchor="middle">No direct equivalent</text><text class="sub" x="592" y="399" text-anchor="middle">tags, CloudFormation stacks, tag-based groups</text><line class="ln" x1="592" y1="408" x2="592" y2="420" marker-end="url(#ar)"/><text class="h2" x="400" y="390" text-anchor="middle">≈</text><rect class="bp" x="28" y="422" width="360" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="208" y="443" text-anchor="middle">Resources</text><text class="sub" x="208" y="461" text-anchor="middle">VNet, AKS, Key Vault, storage account</text><rect class="bw" x="412" y="422" width="360" height="48" rx="8" stroke-width="1.5"/><text class="lbl" x="592" y="443" text-anchor="middle">Resources</text><text class="sub" x="592" y="461" text-anchor="middle">VPC, EKS, KMS key, S3 bucket</text><text class="h2" x="400" y="452" text-anchor="middle">≈</text><rect class="bt" x="28" y="488" width="744" height="60" rx="10" stroke-width="1.2"/><text class="sm" x="44" y="512">Key difference: in Azure, identity (the Entra tenant) sits above every subscription and is shared;</text><text class="sm" x="44" y="532">in AWS, IAM lives inside each account, and cross-account access means assuming a role.</text>
</svg>
