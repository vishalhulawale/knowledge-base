<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Sidecar request path</title>
  <desc id="d">Animation in six steps. The orders app calls payments in plain HTTP and iptables redirects the call to its Envoy sidecar. Envoy chooses payments pod 1 and opens mutual TLS with the orders SPIFFE identity. The payments sidecar checks the authorisation policy and allows it. Pod 1 returns 503. The client Envoy retries on pod 2, which returns 200. The orders app only ever sees the 200, and both proxies emit metrics and spans.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes p1{0%{opacity:1}15.99%{opacity:1}16%{opacity:0}100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%{opacity:0}15.99%{opacity:0}16%{opacity:1}31.99%{opacity:1}32%{opacity:0}100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%{opacity:0}31.99%{opacity:0}32%{opacity:1}47.99%{opacity:1}48%{opacity:0}100%{opacity:0}}.p3{animation-name:p3}
    @keyframes p4{0%{opacity:0}47.99%{opacity:0}48%{opacity:1}62.99%{opacity:1}63%{opacity:0}100%{opacity:0}}.p4{animation-name:p4}
    @keyframes p5{0%{opacity:0}62.99%{opacity:0}63%{opacity:1}79.99%{opacity:1}80%{opacity:0}79.99%{opacity:0}80%{opacity:1}100%{opacity:1}}.p5{animation-name:p5}
    @keyframes p6{0%{opacity:0}79.99%{opacity:0}80%{opacity:1}100%{opacity:1}}.p6{animation-name:p6}
    @keyframes p7{0%{opacity:1}15.99%{opacity:1}16%{opacity:0}100%{opacity:0}}.p7{animation-name:p7}
    @keyframes p8{0%{opacity:0}15.99%{opacity:0}16%{opacity:1}31.99%{opacity:1}32%{opacity:0}100%{opacity:0}}.p8{animation-name:p8}
    @keyframes p9{0%{opacity:0}31.99%{opacity:0}32%{opacity:1}47.99%{opacity:1}48%{opacity:0}100%{opacity:0}}.p9{animation-name:p9}
    @keyframes p10{0%{opacity:0}47.99%{opacity:0}48%{opacity:1}62.99%{opacity:1}63%{opacity:0}100%{opacity:0}}.p10{animation-name:p10}
    @keyframes p11{0%{opacity:0}62.99%{opacity:0}63%{opacity:1}79.99%{opacity:1}80%{opacity:0}100%{opacity:0}}.p11{animation-name:p11}
    @keyframes p12{0%{opacity:0}79.99%{opacity:0}80%{opacity:1}100%{opacity:1}}.p12{animation-name:p12}
    @keyframes p13{0%{opacity:1}15.99%{opacity:1}16%{opacity:0}100%{opacity:0}}.p13{animation-name:p13}
    @keyframes p14{0%{opacity:0}15.99%{opacity:0}16%{opacity:1}31.99%{opacity:1}32%{opacity:0}100%{opacity:0}}.p14{animation-name:p14}
    @keyframes p15{0%{opacity:0}31.99%{opacity:0}32%{opacity:1}47.99%{opacity:1}48%{opacity:0}100%{opacity:0}}.p15{animation-name:p15}
    @keyframes p16{0%{opacity:0}47.99%{opacity:0}48%{opacity:1}62.99%{opacity:1}63%{opacity:0}100%{opacity:0}}.p16{animation-name:p16}
    @keyframes p17{0%{opacity:0}62.99%{opacity:0}63%{opacity:1}79.99%{opacity:1}80%{opacity:0}100%{opacity:0}}.p17{animation-name:p17}
    @keyframes p18{0%{opacity:0}79.99%{opacity:0}80%{opacity:1}100%{opacity:1}}.p18{animation-name:p18}
    @media (prefers-reduced-motion: reduce){.k{animation:none}.p5,.p6,.p12,.p18{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">A request through sidecar proxies</text><text class="sub" x="28" y="62">orders calls payments; the app never sees mTLS, the policy check or the retry.</text><rect class="bm" x="30" y="96" width="250" height="150" rx="10" stroke-width="1.2"/><text class="sub" x="42" y="116" style="font-size:12px">pod: orders (sa/orders)</text><rect class="bp" x="44" y="130" width="90" height="90" rx="8" stroke-width="1.5"/><text class="prit" x="89" y="171" text-anchor="middle">orders</text><text class="prit" x="89" y="189" text-anchor="middle">app</text><rect class="bw" x="176" y="130" width="90" height="90" rx="8" stroke-width="1.5"/><text class="wrnt" x="221" y="171" text-anchor="middle">Envoy</text><text class="wrnt" x="221" y="189" text-anchor="middle">sidecar</text><rect class="bm" x="510" y="88" width="260" height="88" rx="10" stroke-width="1.2"/><text class="sub" x="522" y="106" style="font-size:12px">pod: payments-1</text><rect class="bw" x="522" y="114" width="90" height="52" rx="8" stroke-width="1.5"/><text class="wrnt" x="567" y="145" text-anchor="middle">Envoy</text><rect class="bp" x="668" y="114" width="90" height="52" rx="8" stroke-width="1.5"/><text class="prit" x="713" y="145" text-anchor="middle">payments</text><line class="ln" x1="612" y1="140" x2="666" y2="140" marker-end="url(#ar)"/><rect class="bm" x="510" y="186" width="260" height="88" rx="10" stroke-width="1.2"/><text class="sub" x="522" y="204" style="font-size:12px">pod: payments-2</text><rect class="bw" x="522" y="212" width="90" height="52" rx="8" stroke-width="1.5"/><text class="wrnt" x="567" y="243" text-anchor="middle">Envoy</text><rect class="bp" x="668" y="212" width="90" height="52" rx="8" stroke-width="1.5"/><text class="prit" x="713" y="243" text-anchor="middle">payments</text><line class="ln" x1="612" y1="238" x2="666" y2="238" marker-end="url(#ar)"/><line class="ln" x1="134" y1="160" x2="174" y2="160" marker-end="url(#ar)"/><line class="ln dash" x1="266" y1="160" x2="520" y2="140" marker-end="url(#ar)"/><line class="ln dash" x1="266" y1="190" x2="520" y2="238" marker-end="url(#ar)"/><g class="k p1"><line class="lnp" x1="134" y1="160" x2="174" y2="160" marker-end="url(#arp)" style="stroke-width:4"/></g><g class="k p2"><line class="lnt" x1="266" y1="160" x2="520" y2="140" marker-end="url(#art)" style="stroke-width:4"/><rect class="bt" x="330" y="118" width="130" height="24" rx="12"/><text class="teat" x="395" y="135" text-anchor="middle" style="font-size:12px">mTLS (SPIFFE)</text></g><g class="k p3"><rect class="bo" x="518" y="110" width="98" height="60" rx="8" style="fill:none;stroke-width:4"/><rect class="bo" x="414" y="96" width="84" height="22" rx="11"/><text class="okt" x="456" y="112" text-anchor="middle" style="font-size:12px">policy ✓</text></g><g class="k p4"><line class="lnb" x1="520" y1="150" x2="270" y2="170" marker-end="url(#arb)" style="stroke-width:4"/><rect class="bb" x="360" y="158" width="60" height="24" rx="12"/><text class="badt" x="390" y="175" text-anchor="middle" style="font-size:13px">503</text></g><g class="k p5"><line class="lno" x1="266" y1="190" x2="520" y2="238" marker-end="url(#aro)" style="stroke-width:4"/><rect class="bo" x="350" y="222" width="90" height="24" rx="12"/><text class="okt" x="395" y="239" text-anchor="middle" style="font-size:12px">retry → 200</text></g><g class="k p6"><line class="lno" x1="174" y1="192" x2="136" y2="192" marker-end="url(#aro)" style="stroke-width:4"/><text class="okt" x="155" y="214" text-anchor="middle" style="font-size:13px">200</text></g><rect class="box" x="30" y="292" width="740" height="58" rx="8" stroke-width="1.2"/><g class="k p7"><text class="tx" x="46" y="326">1. orders calls http://payments:8080 in plain HTTP; iptables redirects it to the sidecar</text></g><g class="k p8"><text class="tx" x="46" y="326">2. Envoy picks payments-1 and opens mTLS with identity spiffe://cluster.local/ns/rx/sa/orders</text></g><g class="k p9"><text class="tx" x="46" y="326">3. payments-1's sidecar checks AuthorizationPolicy: sa/orders may POST /payments → allowed</text></g><g class="k p10"><text class="tx" x="46" y="326">4. payments-1 is overloaded and returns 503 to the client sidecar</text></g><g class="k p11"><text class="tx" x="46" y="326">5. Client Envoy retries (retryOn 503, perTryTimeout 600 ms) on payments-2, which returns 200</text></g><g class="k p12"><text class="tx" x="46" y="326">6. The app sees only the 200. Both proxies emit request metrics and spans.</text></g><g class="k p13"><circle class="tea" cx="330" cy="376" r="7"/></g><circle class="mutf" cx="330" cy="376" r="4"/><g class="k p14"><circle class="tea" cx="358" cy="376" r="7"/></g><circle class="mutf" cx="358" cy="376" r="4"/><g class="k p15"><circle class="tea" cx="386" cy="376" r="7"/></g><circle class="mutf" cx="386" cy="376" r="4"/><g class="k p16"><circle class="tea" cx="414" cy="376" r="7"/></g><circle class="mutf" cx="414" cy="376" r="4"/><g class="k p17"><circle class="tea" cx="442" cy="376" r="7"/></g><circle class="mutf" cx="442" cy="376" r="4"/><g class="k p18"><circle class="tea" cx="470" cy="376" r="7"/></g><circle class="mutf" cx="470" cy="376" r="4"/>
</svg>
