<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Two pointers on a sorted array</title>
  <desc id="d">Sorted array 1, 3, 4, 6, 8, 11 with target sum 10. lo starts at index 0 and hi at index 5. 1 + 11 = 12 is too big, so hi moves left. 1 + 8 = 9 is too small, so lo moves right. 3 + 8 = 11 is too big, so hi moves left. 3 + 6 = 9 is too small, so lo moves right. 4 + 6 = 10 matches: the pair is at indices 2 and 3. Each step discards one element for good.</desc>
  <style>.card{fill:#f8fafc;stroke:#e2e8f0}
.h{fill:#0f172a;font-size:19px;font-weight:700}
.t{fill:#334155;font-size:14px}
.tb{fill:#334155;font-size:14px;font-weight:700}
.lb{fill:#334155;font-size:15px;font-weight:600}
.m{fill:#64748b;font-size:13px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.box{fill:#ffffff;stroke:#cbd5e1}
.pri{fill:#4f46e5}.spri{stroke:#4f46e5}.tpri{fill:#4f46e5}
.tea{fill:#0ea5a4}.stea{stroke:#0ea5a4}.ttea{fill:#0f766e}
.ok{fill:#16a34a}.sok{stroke:#16a34a}.tok{fill:#16a34a}
.bad{fill:#dc2626}.sbad{stroke:#dc2626}.tbad{fill:#dc2626}
.warn{fill:#d97706}.swarn{stroke:#d97706}.twarn{fill:#d97706}
.smut{stroke:#94a3b8}.mut{fill:#94a3b8}
.tint{fill:#4f46e5;fill-opacity:.14}.ttint{fill:#0ea5a4;fill-opacity:.16}
.gtint{fill:#16a34a;fill-opacity:.16}.rtint{fill:#dc2626;fill-opacity:.14}.atint{fill:#d97706;fill-opacity:.16}
.on{fill:#ffffff;font-size:14px;font-weight:700}
.ln{fill:none;stroke-width:2}
.ah{stroke:none}
@media (prefers-color-scheme: dark){
.card{fill:#1f2430;stroke:#334155}
.h{fill:#f1f5f9}.t,.tb,.lb{fill:#e2e8f0}.m{fill:#94a3b8}
.box{fill:#111827;stroke:#475569}
.pri,.tint{fill:#818cf8}.spri{stroke:#818cf8}.tpri{fill:#818cf8}
.tea,.ttint{fill:#2dd4bf}.stea{stroke:#2dd4bf}.ttea{fill:#5eead4}
.ok,.gtint{fill:#4ade80}.sok{stroke:#4ade80}.tok{fill:#4ade80}
.bad,.rtint{fill:#f87171}.sbad{stroke:#f87171}.tbad{fill:#f87171}
.warn,.atint{fill:#fbbf24}.swarn{stroke:#fbbf24}.twarn{fill:#fbbf24}
.smut{stroke:#64748b}.mut{fill:#64748b}
.on{fill:#0f172a}
}
.fr{opacity:0;animation-duration:11s;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes k0{0%,16.07%{opacity:1}16.67%,100%{opacity:0}}.f0{animation-name:k0}
@keyframes k1{0%,16.67%{opacity:0}17.27%,32.73%{opacity:1}33.33%,100%{opacity:0}}.f1{animation-name:k1}
@keyframes k2{0%,33.33%{opacity:0}33.93%,49.40%{opacity:1}50.00%,100%{opacity:0}}.f2{animation-name:k2}
@keyframes k3{0%,50.00%{opacity:0}50.60%,66.07%{opacity:1}66.67%,100%{opacity:0}}.f3{animation-name:k3}
@keyframes k4{0%,66.67%{opacity:0}67.27%,99.40%{opacity:1}100%{opacity:0}}.f4{animation-name:k4}
@media (prefers-reduced-motion: reduce){.fr{animation:none!important;opacity:0}.f4{opacity:1}}</style>
  <rect class="card" x="1" y="1" width="798" height="288" rx="14"/>
  <text class="h" x="28" y="40">Two pointers on a sorted array (target = 10)</text>
  <text class="m" x="28" y="62">Each step discards one element that can't be part of any pair with what's left.</text>
  <rect class="box" x="40" y="120" width="60" height="48" rx="8"/>
  <text class="lb" x="70" y="151" text-anchor="middle">1</text>
  <text class="m" x="70" y="110" text-anchor="middle">[0]</text>
  <rect class="box" x="110" y="120" width="60" height="48" rx="8"/>
  <text class="lb" x="140" y="151" text-anchor="middle">3</text>
  <text class="m" x="140" y="110" text-anchor="middle">[1]</text>
  <rect class="box" x="180" y="120" width="60" height="48" rx="8"/>
  <text class="lb" x="210" y="151" text-anchor="middle">4</text>
  <text class="m" x="210" y="110" text-anchor="middle">[2]</text>
  <rect class="box" x="250" y="120" width="60" height="48" rx="8"/>
  <text class="lb" x="280" y="151" text-anchor="middle">6</text>
  <text class="m" x="280" y="110" text-anchor="middle">[3]</text>
  <rect class="box" x="320" y="120" width="60" height="48" rx="8"/>
  <text class="lb" x="350" y="151" text-anchor="middle">8</text>
  <text class="m" x="350" y="110" text-anchor="middle">[4]</text>
  <rect class="box" x="390" y="120" width="60" height="48" rx="8"/>
  <text class="lb" x="420" y="151" text-anchor="middle">11</text>
  <text class="m" x="420" y="110" text-anchor="middle">[5]</text>
  <line class="ln smut" x1="452" y1="90" x2="452" y2="236" stroke-width="1"/>
  <g class="fr f0"><rect class="tea" x="40" y="120" width="60" height="48" rx="8"/><text class="on" x="70" y="151" text-anchor="middle">1</text><rect class="pri" x="390" y="120" width="60" height="48" rx="8"/><text class="on" x="420" y="151" text-anchor="middle">11</text><line class="ln stea" stroke-width="2" x1="70" y1="216" x2="70" y2="184"/><path class="ah tea" d="M70.0,176.0 L74.0,184.0 L66.0,184.0 Z"/><text class="tb" x="70" y="236" text-anchor="middle">lo</text><line class="ln spri" stroke-width="2" x1="420" y1="216" x2="420" y2="184"/><path class="ah pri" d="M420.0,176.0 L424.0,184.0 L416.0,184.0 Z"/><text class="tb" x="420" y="236" text-anchor="middle">hi</text><text class="m" x="470" y="110">Step 1</text><text class="lb" x="470" y="140">a[lo] + a[hi] = 1 + 11 = 12  &gt; 10</text><text class="tbad" x="470" y="176" font-weight="700">Too big: hi--</text><text class="t" x="470" y="200">11 can't pair with anything left:</text><text class="t" x="470" y="224">even the smallest value (1) is too big.</text></g>
  <g class="fr f1"><rect class="card" x="391" y="121" width="58" height="46" rx="7"/><text class="m" x="420" y="151" text-anchor="middle">11</text><line class="ln smut" x1="402" y1="158" x2="438" y2="130"/><rect class="tea" x="40" y="120" width="60" height="48" rx="8"/><text class="on" x="70" y="151" text-anchor="middle">1</text><rect class="pri" x="320" y="120" width="60" height="48" rx="8"/><text class="on" x="350" y="151" text-anchor="middle">8</text><line class="ln stea" stroke-width="2" x1="70" y1="216" x2="70" y2="184"/><path class="ah tea" d="M70.0,176.0 L74.0,184.0 L66.0,184.0 Z"/><text class="tb" x="70" y="236" text-anchor="middle">lo</text><line class="ln spri" stroke-width="2" x1="350" y1="216" x2="350" y2="184"/><path class="ah pri" d="M350.0,176.0 L354.0,184.0 L346.0,184.0 Z"/><text class="tb" x="350" y="236" text-anchor="middle">hi</text><text class="m" x="470" y="110">Step 2</text><text class="lb" x="470" y="140">a[lo] + a[hi] = 1 + 8 = 9  &lt; 10</text><text class="twarn" x="470" y="176" font-weight="700">Too small: lo++</text><text class="t" x="470" y="200">1 can't pair with anything left:</text><text class="t" x="470" y="224">even the largest value (8) is too small.</text></g>
  <g class="fr f2"><rect class="card" x="41" y="121" width="58" height="46" rx="7"/><text class="m" x="70" y="151" text-anchor="middle">1</text><line class="ln smut" x1="52" y1="158" x2="88" y2="130"/><rect class="card" x="391" y="121" width="58" height="46" rx="7"/><text class="m" x="420" y="151" text-anchor="middle">11</text><line class="ln smut" x1="402" y1="158" x2="438" y2="130"/><rect class="tea" x="110" y="120" width="60" height="48" rx="8"/><text class="on" x="140" y="151" text-anchor="middle">3</text><rect class="pri" x="320" y="120" width="60" height="48" rx="8"/><text class="on" x="350" y="151" text-anchor="middle">8</text><line class="ln stea" stroke-width="2" x1="140" y1="216" x2="140" y2="184"/><path class="ah tea" d="M140.0,176.0 L144.0,184.0 L136.0,184.0 Z"/><text class="tb" x="140" y="236" text-anchor="middle">lo</text><line class="ln spri" stroke-width="2" x1="350" y1="216" x2="350" y2="184"/><path class="ah pri" d="M350.0,176.0 L354.0,184.0 L346.0,184.0 Z"/><text class="tb" x="350" y="236" text-anchor="middle">hi</text><text class="m" x="470" y="110">Step 3</text><text class="lb" x="470" y="140">a[lo] + a[hi] = 3 + 8 = 11  &gt; 10</text><text class="tbad" x="470" y="176" font-weight="700">Too big: hi--</text><text class="t" x="470" y="200">8 can't pair with anything left:</text><text class="t" x="470" y="224">even the smallest value (3) is too big.</text></g>
  <g class="fr f3"><rect class="card" x="41" y="121" width="58" height="46" rx="7"/><text class="m" x="70" y="151" text-anchor="middle">1</text><line class="ln smut" x1="52" y1="158" x2="88" y2="130"/><rect class="card" x="321" y="121" width="58" height="46" rx="7"/><text class="m" x="350" y="151" text-anchor="middle">8</text><line class="ln smut" x1="332" y1="158" x2="368" y2="130"/><rect class="card" x="391" y="121" width="58" height="46" rx="7"/><text class="m" x="420" y="151" text-anchor="middle">11</text><line class="ln smut" x1="402" y1="158" x2="438" y2="130"/><rect class="tea" x="110" y="120" width="60" height="48" rx="8"/><text class="on" x="140" y="151" text-anchor="middle">3</text><rect class="pri" x="250" y="120" width="60" height="48" rx="8"/><text class="on" x="280" y="151" text-anchor="middle">6</text><line class="ln stea" stroke-width="2" x1="140" y1="216" x2="140" y2="184"/><path class="ah tea" d="M140.0,176.0 L144.0,184.0 L136.0,184.0 Z"/><text class="tb" x="140" y="236" text-anchor="middle">lo</text><line class="ln spri" stroke-width="2" x1="280" y1="216" x2="280" y2="184"/><path class="ah pri" d="M280.0,176.0 L284.0,184.0 L276.0,184.0 Z"/><text class="tb" x="280" y="236" text-anchor="middle">hi</text><text class="m" x="470" y="110">Step 4</text><text class="lb" x="470" y="140">a[lo] + a[hi] = 3 + 6 = 9  &lt; 10</text><text class="twarn" x="470" y="176" font-weight="700">Too small: lo++</text><text class="t" x="470" y="200">3 can't pair with anything left:</text><text class="t" x="470" y="224">even the largest value (6) is too small.</text></g>
  <g class="fr f4"><rect class="card" x="41" y="121" width="58" height="46" rx="7"/><text class="m" x="70" y="151" text-anchor="middle">1</text><line class="ln smut" x1="52" y1="158" x2="88" y2="130"/><rect class="card" x="111" y="121" width="58" height="46" rx="7"/><text class="m" x="140" y="151" text-anchor="middle">3</text><line class="ln smut" x1="122" y1="158" x2="158" y2="130"/><rect class="card" x="321" y="121" width="58" height="46" rx="7"/><text class="m" x="350" y="151" text-anchor="middle">8</text><line class="ln smut" x1="332" y1="158" x2="368" y2="130"/><rect class="card" x="391" y="121" width="58" height="46" rx="7"/><text class="m" x="420" y="151" text-anchor="middle">11</text><line class="ln smut" x1="402" y1="158" x2="438" y2="130"/><rect class="ok" x="180" y="120" width="60" height="48" rx="8"/><text class="on" x="210" y="151" text-anchor="middle">4</text><rect class="ok" x="250" y="120" width="60" height="48" rx="8"/><text class="on" x="280" y="151" text-anchor="middle">6</text><line class="ln stea" stroke-width="2" x1="210" y1="216" x2="210" y2="184"/><path class="ah tea" d="M210.0,176.0 L214.0,184.0 L206.0,184.0 Z"/><text class="tb" x="210" y="236" text-anchor="middle">lo</text><line class="ln spri" stroke-width="2" x1="280" y1="216" x2="280" y2="184"/><path class="ah pri" d="M280.0,176.0 L284.0,184.0 L276.0,184.0 Z"/><text class="tb" x="280" y="236" text-anchor="middle">hi</text><text class="m" x="470" y="110">Step 5</text><text class="lb" x="470" y="140">a[lo] + a[hi] = 4 + 6 = 10  = 10</text><text class="tok" x="470" y="176" font-weight="700">Found: indices 2 and 3.</text><text class="t" x="470" y="200">5 comparisons instead of</text><text class="t" x="470" y="224">15 pairs for the brute force.</text></g>
  <text class="m" x="28" y="268">Greyed cells are discarded. lo only moves right and hi only moves left, so the scan is O(n).</text>
</svg>
