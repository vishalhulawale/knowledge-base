<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Token bucket: burst, reject, refill</title>
  <desc id="d">A token bucket with capacity 5 and a refill rate of 1 token per second starts full. At 1 second a burst of 6 requests arrives within half a second. The first 5 each take a token and are allowed; the sixth finds less than one token and gets HTTP 429. The bucket then refills one token per second, at 2, 3, 4, 5 and 6 seconds, and is full again.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:14px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .bucket{fill:#ffffff;stroke:#94a3b8;stroke-width:2.5}
    .slot{fill:none;stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 3}
    .tok{fill:#0ea5a4}
    .ar{stroke:#0ea5a4;stroke-width:2.5}
    .arh{fill:#0ea5a4}
    .rt{fill:#0f766e;font-size:14px;font-weight:700}
    .ok{fill:#16a34a;font-size:14px;font-weight:700}
    .no{fill:#dc2626;font-size:14px;font-weight:700}
    .step{fill:#0f172a;font-size:15px;font-weight:700}
    .ax{stroke:#94a3b8;stroke-width:1.5}
    .cur{fill:#4f46e5}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.step{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .bucket{fill:#111827;stroke:#64748b}.slot{stroke:#475569}
      .tok,.arh{fill:#2dd4bf}.ar{stroke:#2dd4bf}.rt{fill:#5eead4}
      .ok{fill:#4ade80}.no{fill:#f87171}.ax{stroke:#64748b}.cur{fill:#818cf8}
    }
    /* 10 s loop = 10 s of simulated time. Burst at 1.0-1.5 s, refills at 2, 3, 4, 5, 6 s */
    .a{animation:10s infinite linear}
    @keyframes k0{0%,13%{opacity:1}14%,19%{opacity:0}20%,100%{opacity:1}}
    @keyframes k1{0%,12%{opacity:1}13%,29%{opacity:0}30%,100%{opacity:1}}
    @keyframes k2{0%,11%{opacity:1}12%,39%{opacity:0}40%,100%{opacity:1}}
    @keyframes k3{0%,10%{opacity:1}11%,49%{opacity:0}50%,100%{opacity:1}}
    @keyframes k4{0%,9%{opacity:1}10%,59%{opacity:0}60%,100%{opacity:1}}
    @keyframes r1{0%,9%{opacity:0}10%,92%{opacity:1}94%,100%{opacity:0}}
    @keyframes r2{0%,10%{opacity:0}11%,92%{opacity:1}94%,100%{opacity:0}}
    @keyframes r3{0%,11%{opacity:0}12%,92%{opacity:1}94%,100%{opacity:0}}
    @keyframes r4{0%,12%{opacity:0}13%,92%{opacity:1}94%,100%{opacity:0}}
    @keyframes r5{0%,13%{opacity:0}14%,92%{opacity:1}94%,100%{opacity:0}}
    @keyframes r6{0%,14%{opacity:0}15%,92%{opacity:1}94%,100%{opacity:0}}
    @keyframes p1{0%,9%{opacity:1}10%,100%{opacity:0}}
    @keyframes p2{0%,9%{opacity:0}10%,19%{opacity:1}20%,100%{opacity:0}}
    @keyframes p3{0%,19%{opacity:0}20%,92%{opacity:1}94%,100%{opacity:0}}
    @keyframes cur{0%{transform:translateX(0)}100%{transform:translateX(600px)}}
    .k0{animation-name:k0}.k1{animation-name:k1}.k2{animation-name:k2}.k3{animation-name:k3}.k4{animation-name:k4}
    .r1{animation-name:r1}.r2{animation-name:r2}.r3{animation-name:r3}.r4{animation-name:r4}.r5{animation-name:r5}.r6{animation-name:r6}
    .p1{animation-name:p1}.p2{animation-name:p2}.p3{animation-name:p3}.cu{animation-name:cur}
    @media (prefers-reduced-motion: reduce){
      .a{animation:none}
      .p1,.p3,.cu{opacity:0}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">Token bucket (capacity b = 5, refill r = 1 token/s)</text>
  <text class="sub" x="28" y="62">Each request takes one token. No token, no entry: 429 + Retry-After.</text>

  <!-- requests -->
  <text class="lbl" x="28" y="100">Burst at 1 s</text>
  <text class="tx" x="28" y="128">req 1</text><text class="ok a r1" x="86" y="128">✓ allowed</text>
  <text class="tx" x="28" y="154">req 2</text><text class="ok a r2" x="86" y="154">✓ allowed</text>
  <text class="tx" x="28" y="180">req 3</text><text class="ok a r3" x="86" y="180">✓ allowed</text>
  <text class="tx" x="28" y="206">req 4</text><text class="ok a r4" x="86" y="206">✓ allowed</text>
  <text class="tx" x="28" y="232">req 5</text><text class="ok a r5" x="86" y="232">✓ allowed</text>
  <text class="tx" x="28" y="258">req 6</text><text class="no a r6" x="86" y="258">✗ 429</text>

  <!-- refill tap -->
  <line class="ar" x1="490" y1="92" x2="490" y2="140"/>
  <path class="arh" d="M482,136 L490,148 L498,136 z"/>
  <text class="rt" x="502" y="112">+1 token per second</text>

  <!-- bucket -->
  <rect class="bucket" x="330" y="154" width="320" height="84" rx="16"/>
  <circle class="slot" cx="370" cy="196" r="22"/><circle class="slot" cx="430" cy="196" r="22"/><circle class="slot" cx="490" cy="196" r="22"/>
  <circle class="slot" cx="550" cy="196" r="22"/><circle class="slot" cx="610" cy="196" r="22"/>
  <circle class="tok a k0" cx="370" cy="196" r="20"/><circle class="tok a k1" cx="430" cy="196" r="20"/><circle class="tok a k2" cx="490" cy="196" r="20"/>
  <circle class="tok a k3" cx="550" cy="196" r="20"/><circle class="tok a k4" cx="610" cy="196" r="20"/>
  <text class="sub" x="490" y="258" text-anchor="middle">bucket holds at most b = 5 tokens</text>

  <!-- phase caption -->
  <text class="step a p1" x="28" y="300">Full bucket: up to 5 requests can go through at once.</text>
  <text class="step a p2" x="28" y="300">Burst of 6 in 0.5 s: 5 take a token, the 6th finds none and gets 429.</text>
  <text class="step a p3" x="28" y="300">Refills at r = 1/s: one token back each second, full again after 5 s.</text>

  <!-- timeline 0-10 s: x = 150 + 60 per second -->
  <line class="ax" x1="150" y1="340" x2="750" y2="340"/>
  <text class="sub" x="28" y="345">simulated time</text>
  <text class="sub" x="150" y="362" text-anchor="middle">0</text><text class="sub" x="210" y="362" text-anchor="middle">1</text>
  <text class="sub" x="270" y="362" text-anchor="middle">2</text><text class="sub" x="330" y="362" text-anchor="middle">3</text>
  <text class="sub" x="390" y="362" text-anchor="middle">4</text><text class="sub" x="450" y="362" text-anchor="middle">5</text>
  <text class="sub" x="510" y="362" text-anchor="middle">6</text><text class="sub" x="570" y="362" text-anchor="middle">7</text>
  <text class="sub" x="630" y="362" text-anchor="middle">8</text><text class="sub" x="690" y="362" text-anchor="middle">9</text>
  <text class="sub" x="750" y="362" text-anchor="middle">10 s</text>
  <circle class="cur a cu" cx="150" cy="340" r="6"/>

  <text class="sub" x="28" y="400">Small numbers for clarity. The Spring Cloud Gateway example on this page uses b = 100, r = 50/s.</text>
</svg>
