  <g class="fr f5"><rect class="tint" x="212" y="97" width="76" height="30" rx="15"/><text class="t" x="250" y="117" text-anchor="middle">[]</text><rect class="tint" x="62" y="177" width="76" height="30" rx="15"/><text class="t" x="100" y="197" text-anchor="middle">[1]</text><rect class="tint" x="12" y="257" width="76" height="30" rx="15"/><text class="t" x="50" y="277" text-anchor="middle">[1,2]</text><rect class="tint" x="12" y="337" width="76" height="30" rx="15"/><text class="t" x="50" y="357" text-anchor="middle">[1,2,3]</text><rect class="tint" x="122" y="257" width="76" height="30" rx="15"/><text class="t" x="160" y="277" text-anchor="middle">[1,3]</text><line class="ln spri" x1="250" y1="126" x2="280" y2="178" stroke-width="3"/><rect class="pri" x="242" y="177" width="76" height="30" rx="15"/><text class="on" x="280" y="197" text-anchor="middle">[2]</text><rect class="pri" x="520" y="114" width="34" height="34" rx="6"/><text class="on" x="537" y="136" text-anchor="middle">2</text><text class="t" x="520" y="212">1. []</text><text class="t" x="640" y="212">2. [1]</text><text class="t" x="520" y="234">3. [1,2]</text><text class="t" x="640" y="234">4. [1,2,3]</text><text class="t" x="520" y="256">5. [1,3]</text><text class="tb" x="640" y="256">6. [2]</text><text class="t" x="520" y="320">Unchoose 2 steps, then</text><text class="t" x="520" y="340">choose 2: record [2].</text></g>
