<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Confused deputy and external ID</title>
  <desc id="d">Two panels. Without an external ID: malicious customer B enters customer A's role ARN in the vendor's onboarding form, the vendor pipeline calls AssumeRole on A's role, A's trust policy trusts the vendor's deploy role, and credentials are issued so the vendor acts in A's account on B's behalf. With a unique external ID per customer: the pipeline sends B's external ID, A's trust policy requires A's ID, and STS denies the call. The vendor generates the ID, stores it with the customer record and never lets the customer choose it; the role also trusts only the deploy role, has a permissions boundary and one-hour sessions.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="438" rx="14"/>
  <text class="h" x="28" y="40">The confused deputy, and how the external ID stops it</text><text class="sub" x="28" y="62">Customer B is malicious and knows Customer A's role ARN. The vendor pipeline is the deputy.</text><text class="lbl" x="28" y="98">Without an external ID</text><rect class="bb" x="28" y="108" width="360" height="264" rx="10" stroke-width="1.2"/><rect class="box" x="44" y="120" width="328" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="58" y="140">Customer B enters A's role ARN</text><text class="sm" x="58" y="158">in the vendor's onboarding form</text><line class="ln" x1="208" y1="169" x2="208" y2="181" marker-end="url(#ar)"/><rect class="box" x="44" y="182" width="328" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="58" y="202">Vendor pipeline calls</text><text class="sm" x="58" y="220">AssumeRole(A's role ARN)</text><line class="ln" x1="208" y1="231" x2="208" y2="243" marker-end="url(#ar)"/><rect class="box" x="44" y="244" width="328" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="58" y="264">A's trust policy: trusts the</text><text class="sm" x="58" y="282">vendor deploy role  ✓</text><line class="ln" x1="208" y1="293" x2="208" y2="305" marker-end="url(#ar)"/><rect class="bb" x="44" y="306" width="328" height="48" rx="8" stroke-width="1.5"/><text class="badt" x="58" y="326">Credentials issued: the vendor</text><text class="badt" x="58" y="344">acts in A's account for B</text><text class="lbl" x="412" y="98">With a unique external ID per customer</text><rect class="bo" x="412" y="108" width="360" height="264" rx="10" stroke-width="1.2"/><rect class="box" x="428" y="120" width="328" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="442" y="140">Customer B enters A's role ARN</text><text class="sm" x="442" y="158">in the vendor's onboarding form</text><line class="ln" x1="592" y1="169" x2="592" y2="181" marker-end="url(#ar)"/><rect class="box" x="428" y="182" width="328" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="442" y="202">AssumeRole(A's role ARN,</text><text class="sm" x="442" y="220">ExternalId = B's ID)</text><line class="ln" x1="592" y1="231" x2="592" y2="243" marker-end="url(#ar)"/><rect class="box" x="428" y="244" width="328" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="442" y="264">A's trust policy requires</text><text class="sm" x="442" y="282">ExternalId = A's ID  ✗</text><line class="ln" x1="592" y1="293" x2="592" y2="305" marker-end="url(#ar)"/><rect class="bo" x="428" y="306" width="328" height="48" rx="8" stroke-width="1.5"/><text class="okt" x="442" y="326">STS denies the call:</text><text class="okt" x="442" y="344">B can't reach A's account</text><text class="sm" x="28" y="398">The vendor generates the ID, stores it with the customer record and never lets the customer choose it.</text><text class="sm" x="28" y="416">The role also trusts only the deploy role, has a permissions boundary and 1-hour sessions.</text>
</svg>
