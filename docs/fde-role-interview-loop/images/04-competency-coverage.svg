  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="444" rx="14"/>
  <text class="h" x="28" y="40">Resume coverage of FDE competencies</text><text class="sub" x="28" y="62">Every competency has a source except production LLM work: that is the gap to close.</text><text class="sm" x="430" y="96" text-anchor="middle" font-weight="700">Metasys</text><text class="sub" x="430" y="114" text-anchor="middle">2017–18</text><text class="sm" x="530" y="96" text-anchor="middle" font-weight="700">CCKM</text><text class="sub" x="530" y="114" text-anchor="middle">2018–21</text><text class="sm" x="630" y="96" text-anchor="middle" font-weight="700">ConvergeHealth</text><text class="sub" x="630" y="114" text-anchor="middle">2021–23</text><text class="sm" x="730" y="96" text-anchor="middle" font-weight="700">Meteor</text><text class="sub" x="730" y="114" text-anchor="middle">2023–now</text><rect class="bm" x="20" y="126" width="760" height="32" rx="6" stroke-width="0"/><text class="tx" x="36" y="147">Integrating systems of record</text><circle class="tea" cx="730" cy="142" r="9"/><text class="tx" x="36" y="181">Enterprise identity + security</text><circle class="tea" cx="430" cy="176" r="9"/><circle class="tea" cx="530" cy="176" r="9"/><circle class="tea" cx="630" cy="176" r="9"/><circle class="tea" cx="730" cy="176" r="9"/><rect class="bm" x="20" y="194" width="760" height="32" rx="6" stroke-width="0"/><text class="tx" x="36" y="215">Deploying in cloud environments</text><circle class="tea" cx="530" cy="210" r="9"/><circle class="tea" cx="630" cy="210" r="9"/><text class="tx" x="36" y="249">Customer + stakeholder management</text><circle class="tea" cx="730" cy="244" r="9"/><rect class="bm" x="20" y="262" width="760" height="32" rx="6" stroke-width="0"/><text class="tx" x="36" y="283">Full-stack building fast</text><circle class="tea" cx="730" cy="278" r="9"/><text class="tx" x="36" y="317">Production ownership</text><circle class="tea" cx="730" cy="312" r="9"/><rect class="bm" x="20" y="330" width="760" height="32" rx="6" stroke-width="0"/><text class="tx" x="36" y="351">ML / AI service integration</text><circle class="bw" cx="630" cy="346" r="8" stroke-width="2.5"/><rect class="bb" x="20" y="364" width="760" height="32" rx="6" stroke-width="1.2"/><text class="badt" x="36" y="385">Production LLM work</text><text class="badt" x="580" y="385" text-anchor="middle">no source yet</text><circle class="tea" cx="36" cy="420" r="7"/><text class="sm" x="50" y="425">direct evidence</text><circle class="bw" cx="190" cy="420" r="6" stroke-width="2.5"/><text class="sm" x="204" y="425">adjacent (AWS Personalize, a managed ML service, not an LLM)</text>
</svg>
