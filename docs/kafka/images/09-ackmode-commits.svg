<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">AckMode: when offsets are committed, and what a crash replays</title>
  <desc id="d">One poll returns records r1 to r5 and the listener processes them in turn, but the pod crashes while processing r4. With AckMode BATCH, the default, nothing from this poll was committed yet, so after a restart r1 to r3 are processed again along with r4. With RECORD, each record was committed as soon as it finished, so only r4 is redone. With COUNT and ackCount 2, the commit after r2 survived, so r3 and r4 are redone. Smaller replay windows cost more commit requests.</desc>
