  <rect class="card" x="1" y="1" width="798" height="364" rx="14"/>
  <text class="h" x="28" y="40">Fast-burn page: long window AND short window</text><text class="sub" x="28" y="62">99.5% SLO, threshold 14.4 × 0.5% = 7.2% errors. Errors at 20% from minute 20 to 60. Illustrative.</text><line class="grid" x1="80" y1="300" x2="728" y2="300"/><text class="sub" x="72" y="304" text-anchor="end">0%</text><line class="grid" x1="80" y1="255" x2="728" y2="255"/><text class="sub" x="72" y="259" text-anchor="end">5%</text><line class="grid" x1="80" y1="210" x2="728" y2="210"/><text class="sub" x="72" y="214" text-anchor="end">10%</text><line class="grid" x1="80" y1="165" x2="728" y2="165"/><text class="sub" x="72" y="169" text-anchor="end">15%</text><line class="grid" x1="80" y1="120" x2="728" y2="120"/><text class="sub" x="72" y="124" text-anchor="end">20%</text><text class="sub" x="80" y="320" text-anchor="middle">0 min</text><text class="sub" x="188" y="320" text-anchor="middle">20 min</text><text class="sub" x="296" y="320" text-anchor="middle">40 min</text><text class="sub" x="404" y="320" text-anchor="middle">60 min</text><text class="sub" x="512" y="320" text-anchor="middle">80 min</text><text class="sub" x="620" y="320" text-anchor="middle">100 min</text><text class="sub" x="728" y="320" text-anchor="middle">120 min</text><line class="lnb dash" x1="80" y1="235.2" x2="728" y2="235.2"/><text class="badt" x="726" y="229.2" text-anchor="end" style="font-size:12px">7.2% threshold</text><path class="lnw" d="M 80.0 298.2 L 82.7 298.2 L 85.4 298.2 L 88.1 298.2 L 90.8 298.2 L 93.5 298.2 L 96.2 298.2 L 98.9 298.2 L 101.6 298.2 L 104.3 298.2 L 107.0 298.2 L 109.7 298.2 L 112.4 298.2 L 115.1 298.2 L 117.8 298.2 L 120.5 298.2 L 123.2 298.2 L 125.9 298.2 L 128.6 298.2 L 131.3 298.2 L 134.0 298.2 L 136.7 298.2 L 139.4 298.2 L 142.1 298.2 L 144.8 298.2 L 147.5 298.2 L 150.2 298.2 L 152.9 298.2 L 155.6 298.2 L 158.3 298.2 L 161.0 298.2 L 163.7 298.2 L 166.4 298.2 L 169.1 298.2 L 171.8 298.2 L 174.5 298.2 L 177.2 298.2 L 179.9 298.2 L 182.6 298.2 L 185.