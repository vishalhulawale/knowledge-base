<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Story coverage matrix</title>
  <desc id="d">A grid of seven resume sources against five FDE story types: ambiguity, no-docs systems, scope pushback, client conflict and quick versus proper fix. The GraphQL integration layer over five upstreams covers all five. Other sources (React app, Kafka production support, stakeholder communication, CCKM HSMs, ConvergeHealth on AWS, Metasys migration) cover two or three each. Totals per type show conflict is the thinnest column with two stories. Each still needs real details confirmed.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="410" rx="14"/>
  <text class="h" x="28" y="40">Story coverage: five FDE types from real resume lines</text><text class="sub" x="28" y="62">Aim for every column covered twice. Conflict is the thin column: fill it honestly.</text><text class="sm" x="430" y="98" text-anchor="middle" font-weight="700">Ambiguity</text><text class="sm" x="500" y="98" text-anchor="middle" font-weight="700">No-docs</text><text class="sm" x="570" y="98" text-anchor="middle" font-weight="700">Pushback</text><text class="sm" x="640" y="98" text-anchor="middle" font-weight="700">Conflict</text><text class="sm" x="724" y="98" text-anchor="middle" font-weight="700">Quick vs proper</text><rect class="bm" x="20" y="114" width="760" height="30" rx="6" stroke-width="0"/><text class="sm" x="32" y="134">Meteor: GraphQL over 5 upstreams</text><circle class="tea" cx="430" cy="129" r="8"/><circle class="tea" cx="500" cy="129" r="8"/><circle class="tea" cx="570" cy="129" r="8"/><circle class="tea" cx="640" cy="129" r="8"/><circle class="tea" cx="724" cy="129" r="8"/><text class="sm" x="32" y="166">Meteor: React app + micro-frontends</text><circle class="tea" cx="430" cy="161" r="8"/><circle class="tea" cx="570" cy="161" r="8"/><circle class="tea" cx="724" cy="161" r="8"/><rect class="bm" x="20" y="178" width="760" height="30" rx="6" stroke-width="0"/><text class="sm" x="32" y="198">Meteor: Kafka retry/DLQ, prod support</text><circle class="tea" cx="724" cy="193" r="8"/><text class="sm" x="32" y="230">Meteor: stakeholder comms, releases</text><circle class="tea" cx="570" cy="225" r="8"/><circle class="tea" cx="640" cy="225" r="8"/><rect class="bm" x="20" y="242" width="760" height="30" rx="6" stroke-width="0"/><text class="sm" x="32" y="262">CCKM: HSMs, AWS/Azure/GCP keys</text><circle class="tea" cx="500" cy="257" r="8"/><circle class="tea" cx="724" cy="257" r="8"/><text class="sm" x="32" y="294">ConvergeHealth: AWS, Terraform, Personalize</text><circle class="tea" cx="430" cy="289" r="8"/><circle class="tea" cx="500" cy="289" r="8"/><rect class="bm" x="20" y="306" width="760" height="30" rx="6" stroke-width="0"/><text class="sm" x="32" y="326">Metasys: monolith migration, JWT/SSO</text><circle class="tea" cx="500" cy="321" r="8"/><circle class="tea" cx="724" cy="321" r="8"/><text class="teat" x="430" y="360" text-anchor="middle" style="font-size:15px">3</text><text class="teat" x="500" y="360" text-anchor="middle" style="font-size:15px">4</text><text class="teat" x="570" y="360" text-anchor="middle" style="font-size:15px">3</text><text class="badt" x="640" y="360" text-anchor="middle" style="font-size:15px">2</text><text class="teat" x="724" y="360" text-anchor="middle" style="font-size:15px">5</text><text class="sm" x="32" y="360" font-weight="700">stories available per type</text><text class="sub" x="28" y="392">Every dot still needs your real details: the decision, the number, the person who disagreed. [confirm]</text>
</svg>
