  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Support shifts as the engineer grows</text>
  <text class="sub" x="28" y="62">Share of a lead&#x27;s time with one engineer. Illustrative.</text>
  <polygon class="m" points="90.0,156.0 230.0,206.0 370.0,246.0 510.0,276.0 650.0,286.0 650.0,296.0 510.0,296.0 370.0,296.0 230.0,296.0 90.0,296.0" style="stroke-width:2" stroke="var(--sep)"/>
  <polygon class="c" points="90.0,106.0 230.0,116.0 370.0,146.0 510.0,196.0 650.0,236.0 650.0,286.0 510.0,276.0 370.0,246.0 230.0,206.0 90.0,156.0" style="stroke-width:2" stroke="var(--sep)"/>
  <polygon class="s" points="90.0,96.0 230.0,96.0 370.0,96.0 510.0,96.0 650.0,96.0 650.0,236.0 510.0,196.0 370.0,146.0 230.0,116.0 90.0,106.0" style="stroke-width:2" stroke="var(--sep)"/>
  <text class="sm" x="82" y="300" text-anchor="end">0%</text>
  <text class="sm" x="82" y="200" text-anchor="end">50%</text>
  <text class="sm" x="82" y="100" text-anchor="end">100%</text>
  <text class="sm" x="90" y="314" text-anchor="start">month 0</text>
  <text class="sm" x="230" y="314" text-anchor="middle">month 3</text>
  <text class="sm" x="370" y="314" text-anchor="middle">month 6</text>
  <text class="sm" x="510" y="314" text-anchor="middle">month 9</text>
  <text class="sm" x="650" y="314" text-anchor="end">month 12</text>
  <text class="sm" x="660" y="295" font-weight="700">mentor</text>
  <text class="sm" x="660" y="265" font-weight="700">coach</text>
  <text class="sm" x="660" y="170" font-weight="700">sponsor</text>
  <text class="on13" x="104" y="240">&quot;here&#x27;s how I&#x27;d do it&quot;</text>
  <text class="on13" x="192.667" y="176">&quot;what are your options?&quot;</text>
  <text class="on13" x="398" y="120">&quot;you present to the architects&quot;</text>
  <text class="tx" x="28" y="346">Engineers often stall in the teal band: well coached, but nobody gives them the stage to prove it.</text>
  <text class="sub" x="28" y="370">Match the mode to the person, not to the calendar: a senior new to a domain needs mentoring again.</text>
</svg>
