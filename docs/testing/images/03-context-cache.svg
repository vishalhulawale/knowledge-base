<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Spring test context cache</title>
  <desc id="d">Animation: six test classes run in order. OrderApiIT starts context A in 6 seconds. RefillApiIT has the same configuration and reuses it. MemberApiIT adds a MockitoBean, so a second context A prime starts. PricingIT reuses A. CleanupIT reuses A but is marked DirtiesContext, so A is closed and evicted. ReportIT must start A again. The cache panel shows the contexts held and the total context start time growing from 6 to 18 seconds. Times are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes r0{0%,1.99%{opacity:0}2%,100%{opacity:1}}.r0{animation-name:r0}
    @keyframes r1{0%,16.99%{opacity:0}17%,100%{opacity:1}}.r1{animation-name:r1}
    @keyframes r2{0%,31.99%{opacity:0}32%,100%{opacity:1}}.r2{animation-name:r2}
    @keyframes r3{0%,46.99%{opacity:0}47%,100%{opacity:1}}.r3{animation-name:r3}
    @keyframes r4{0%,61.99%{opacity:0}62%,100%{opacity:1}}.r4{animation-name:r4}
    @keyframes r5{0%,76.99%{opacity:0}77%,100%{opacity:1}}.r5{animation-name:r5}
    @keyframes s0{0%,1.99%{opacity:0}2%,16.99%{opacity:1}17%,100%{opacity:0}}.s0{animation-name:s0}
    @keyframes s1{0%,16.99%{opacity:0}17%,31.99%{opacity:1}32%,100%{opacity:0}}.s1{animation-name:s1}
    @keyframes s2{0%,31.99%{opacity:0}32%,46.99%{opacity:1}47%,100%{opacity:0}}.s2{animation-name:s2}
    @keyframes s3{0%,46.99%{opacity:0}47%,61.99%{opacity:1}62%,100%{opacity:0}}.s3{animation-name:s3}
    @keyframes s4{0%,61.99%{opacity:0}62%,76.99%{opacity:1}77%,100%{opacity:0}}.s4{animation-name:s4}
    @keyframes s5{0%,76.99%{opacity:0}77%,100%{opacity:1}}.s5{animation-name:s5}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}.st{opacity:0}.s5{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="410" rx="14"/>
  <text class="h" x="28" y="40">The context cache across six test classes</text><text class="sub" x="28" y="62">Context start 6 s each (illustrative). Tests themselves are fast.</text><text class="sub" x="40" y="96">test class</text><text class="sub" x="190" y="96">configuration</text><text class="sub" x="378" y="96">context</text><g class="k r0"><rect class="bb" x="28" y="110" width="540" height="36" rx="8" stroke-width="1.2"/><text class="mono" x="40" y="133" xml:space="preserve">OrderApiIT</text><text class="sm" x="190" y="133">A</text><text class="badt" x="378" y="133" style="font-size:13px">start A · 6 s</text></g><rect class="box" x="28" y="110" width="540" height="36" rx="8" stroke-dasharray="4 4" fill-opacity="0"/><g class="k r1"><rect class="bo" x="28" y="154" width="540" height="36" rx="8" stroke-width="1.2"/><text class="mono" x="40" y="177" xml:space="preserve">RefillApiIT</text><text class="sm" x="190" y="177">A</text><text class="okt" x="378" y="177" style="font-size:13px">reuse A</text></g><rect class="box" x="28" y="154" width="540" height="36" rx="8" stroke-dasharray="4 4" fill-opacity="0"/><g class="k r2"><rect class="bb" x="28" y="198" width="540" height="36" rx="8" stroke-width="1.2"/><text class="mono" x="40" y="221" xml:space="preserve">MemberApiIT</text><text class="sm" x="190" y="221">A + @MockitoBean</text><text class="badt" x="378" y="221" style="font-size:13px">start A' · 6 s</text></g><rect class="box" x="28" y="198" width="540" height="36" rx="8" stroke-dasharray="4 4" fill-opacity="0"/><g class="k r3"><rect class="bo" x="28" y="242" width="540" height="36" rx="8" stroke-width="1.2"/><text class="mono" x="40" y="265" xml:space="preserve">PricingIT</text><text class="sm" x="190" y="265">A</text><text class="okt" x="378" y="265" style="font-size:13px">reuse A</text></g><rect class="box" x="28" y="242" width="540" height="36" rx="8" stroke-dasharray="4 4" fill-opacity="0"/><g class="k r4"><rect class="bw" x="28" y="286" width="540" height="36" rx="8" stroke-width="1.2"/><text class="mono" x="40" y="309" xml:space="preserve">CleanupIT</text><text class="sm" x="190" y="309">A + @DirtiesContext</text><text class="wrnt" x="378" y="309" style="font-size:13px">reuse A, then close A</text></g><rect class="box" x="28" y="286" width="540" height="36" rx="8" stroke-dasharray="4 4" fill-opacity="0"/><g class="k r5"><rect class="bb" x="28" y="330" width="540" height="36" rx="8" stroke-width="1.2"/><text class="mono" x="40" y="353" xml:space="preserve">ReportIT</text><text class="sm" x="190" y="353">A</text><text class="badt" x="378" y="353" style="font-size:13px">start A again · 6 s</text></g><rect class="box" x="28" y="330" width="540" height="36" rx="8" stroke-dasharray="4 4" fill-opacity="0"/><rect class="bm" x="590" y="84" width="186" height="270" rx="10"/><text class="lbl" x="683" y="108" text-anchor="middle">Context cache</text><g class="k st s0"><rect class="tea" x="612" y="124" width="142" height="34" rx="6"/><text class="on13" x="683" y="146" text-anchor="middle">context A</text><text class="sub" x="683" y="280" text-anchor="middle">context start time</text><text class="teat" x="683" y="316" text-anchor="middle" style="font-size:26px">6 s</text></g><g class="k st s1"><rect class="tea" x="612" y="124" width="142" height="34" rx="6"/><text class="on13" x="683" y="146" text-anchor="middle">context A</text><text class="sub" x="683" y="280" text-anchor="middle">context start time</text><text class="teat" x="683" y="316" text-anchor="middle" style="font-size:26px">6 s</text></g><g class="k st s2"><rect class="tea" x="612" y="124" width="142" height="34" rx="6"/><text class="on13" x="683" y="146" text-anchor="middle">context A</text><rect class="tea" x="612" y="168" width="142" height="34" rx="6"/><text class="on13" x="683" y="190" text-anchor="middle">context A'</text><text class="sub" x="683" y="280" text-anchor="middle">context start time</text><text class="badt" x="683" y="316" text-anchor="middle" style="font-size:26px">12 s</text></g><g class="k st s3"><rect class="tea" x="612" y="124" width="142" height="34" rx="6"/><text class="on13" x="683" y="146" text-anchor="middle">context A</text><rect class="tea" x="612" y="168" width="142" height="34" rx="6"/><text class="on13" x="683" y="190" text-anchor="middle">context A'</text><text class="sub" x="683" y="280" text-anchor="middle">context start time</text><text class="badt" x="683" y="316" text-anchor="middle" style="font-size:26px">12 s</text></g><g class="k st s4"><rect class="tea" x="612" y="124" width="142" height="34" rx="6"/><text class="on13" x="683" y="146" text-anchor="middle">context A'</text><text class="sub" x="683" y="280" text-anchor="middle">context start time</text><text class="badt" x="683" y="316" text-anchor="middle" style="font-size:26px">12 s</text></g><g class="k st s5"><rect class="tea" x="612" y="124" width="142" height="34" rx="6"/><text class="on13" x="683" y="146" text-anchor="middle">context A'</text><rect class="tea" x="612" y="168" width="142" height="34" rx="6"/><text class="on13" x="683" y="190" text-anchor="middle">context A</text><text class="sub" x="683" y="280" text-anchor="middle">context start time</text><text class="badt" x="683" y="316" text-anchor="middle" style="font-size:26px">18 s</text></g><text class="sm" x="28" y="392">Same configuration = same key = reuse. A different mock set or @DirtiesContext costs a full start.</text>
</svg>
