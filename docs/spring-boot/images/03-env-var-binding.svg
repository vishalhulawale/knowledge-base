<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">From property name to environment variable</title>
  <desc id="d">The property claims.upstream.api-key, with its three segments colour-coded. The canonical environment variable is CLAIMS_UPSTREAM_APIKEY: dots become underscores, the dash is removed and everything is upper-case. The legacy form CLAIMS_UPSTREAM_API_KEY also binds, only because the property name really contains a dash. A trap: CLAIMS_UPSTREAM_TIME_OUT for a field called timeout is read as claims.upstream.time.out, matches nothing and is silently ignored. A list element claims.hosts[0] becomes CLAIMS_HOSTS_0.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .v{font-size:16px;font-weight:700}
    .s1{fill:#4f46e5}.s2{fill:#0f766e}.s3{fill:#b45309}.sp{fill:#64748b}.bt{fill:#dc2626}
    .rowbg{fill:#ffffff;stroke:#e2e8f0}
    .rowhd{fill:#eef2ff;stroke:#c7d2fe}
    .good{fill:#16a34a}.bad{fill:#dc2626}
    .mark{stroke:#ffffff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sp{fill:#94a3b8}
      .s1{fill:#818cf8}.s2{fill:#5eead4}.s3{fill:#fbbf24}.bt{fill:#f87171}
      .rowbg{fill:#111827;stroke:#334155}
      .rowhd{fill:#1e1b4b;stroke:#3730a3}
      .good{fill:#4ade80}.bad{fill:#f87171}.mark{stroke:#0f172a}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="410" rx="14"/>
  <text class="h" x="28" y="40">From property name to environment variable</text>
  <text class="sub" x="28" y="62">Relaxed binding for a field apiKey under the prefix claims.upstream.</text>
  <rect class="rowhd" x="20" y="96" width="760" height="50" rx="8"/>
  <text class="lbl" x="34" y="118">Property in YAML</text><text class="sub" x="34" y="136">kebab-case, recommended</text>
  <text class="v code" x="256" y="127"><tspan class="s1">claims</tspan><tspan class="sp">.</tspan><tspan class="s2">upstream</tspan><tspan class="sp">.</tspan><tspan class="s3">api-key</tspan></text>
  <text class="tx" x="500" y="127">The name the binder starts from.</text>
  <rect class="rowbg" x="20" y="154" width="760" height="50" rx="8"/>
  <text class="lbl" x="34" y="176">Canonical env var</text><text class="sub" x="34" y="194">documented form</text>
  <circle class="good" cx="236" cy="179" r="9"/><path class="mark" d="M231.5 179l3.5 3.5 5.5-7"/>
  <text class="v code" x="256" y="185"><tspan class="s1">CLAIMS</tspan><tspan class="sp">_</tspan><tspan class="s2">UPSTREAM</tspan><tspan class="sp">_</tspan><tspan class="s3">APIKEY</tspan></text>
  <text class="tx" x="500" y="176">Dots become _, the dash is</text>
  <text class="tx" x="500" y="194">removed, everything upper-case.</text>
  <rect class="rowbg" x="20" y="212" width="760" height="50" rx="8"/>
  <text class="lbl" x="34" y="234">Legacy form</text><text class="sub" x="34" y="252">also binds</text>
  <circle class="good" cx="236" cy="237" r="9"/><path class="mark" d="M231.5 237l3.5 3.5 5.5-7"/>
  <text class="v code" x="256" y="243"><tspan class="s1">CLAIMS</tspan><tspan class="sp">_</tspan><tspan class="s2">UPSTREAM</tspan><tspan class="sp">_</tspan><tspan class="s3">API_KEY</tspan></text>
  <text class="tx" x="500" y="234">Works only because the property</text>
  <text class="tx" x="500" y="252">name really contains a dash.</text>
  <rect class="rowbg" x="20" y="270" width="760" height="50" rx="8"/>
  <text class="lbl" x="34" y="292">Trap</text><text class="sub" x="34" y="310">field is timeout</text>
  <circle class="bad" cx="236" cy="295" r="9"/><path class="mark" d="M232.5 291.5l7 7M239.5 291.5l-7 7"/>
  <text class="v code" x="256" y="301"><tspan class="s1">CLAIMS</tspan><tspan class="sp">_</tspan><tspan class="s2">UPSTREAM</tspan><tspan class="sp">_</tspan><tspan class="bt">TIME_OUT</tspan></text>
  <text class="tx" x="500" y="292">Read as claims.upstream.time.out:</text>
  <text class="tx" x="500" y="310">matches nothing, silently ignored.</text>
  <rect class="rowbg" x="20" y="328" width="760" height="50" rx="8"/>
  <text class="lbl" x="34" y="350">List element</text><text class="sub" x="34" y="368">claims.hosts[0]</text>
  <circle class="good" cx="236" cy="353" r="9"/><path class="mark" d="M231.5 353l3.5 3.5 5.5-7"/>
  <text class="v code" x="256" y="359"><tspan class="s1">CLAIMS</tspan><tspan class="sp">_</tspan><tspan class="s2">HOSTS</tspan><tspan class="sp">_</tspan><tspan class="s3">0</tspan></text>
  <text class="tx" x="500" y="350">The index becomes its own</text>
  <text class="tx" x="500" y="368">_-separated segment.</text>
</svg>
