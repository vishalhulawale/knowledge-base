<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 386" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Lead time breakdown</title>
  <desc id="d">Animation: a token moves along a bar from commit to production while each stage fills in. Waiting for review takes 24 hours, review and fixes 6 hours, CI 2 hours, waiting for the weekly release window 62 hours and deployment 2 hours. Waiting stages fill red and working stages teal. A summary then shows 10 hours of work and 86 hours of waiting, about 90 percent of the four-day lead time. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .gr{transform-box:fill-box;transform-origin:left center;animation:15s infinite linear}
    .k{opacity:0;animation:15s infinite linear}
    .tok{animation:15s infinite linear}
    @keyframes tok{0%,4%{transform:translateX(0)}80%,100%{transform:translateX(720px)}}.tok{animation-name:tok}
    @keyframes g0{0%,4%{transform:scaleX(0)}23%,100%{transform:scaleX(1)}}.g0{animation-name:g0}
    @keyframes g1{0%,23%{transform:scaleX(0)}27.75%,100%{transform:scaleX(1)}}.g1{animation-name:g1}
    @keyframes g2{0%,27.75%{transform:scaleX(0)}29.3333%,100%{transform:scaleX(1)}}.g2{animation-name:g2}
    @keyframes g3{0%,29.3333%{transform:scaleX(0)}78.4167%,100%{transform:scaleX(1)}}.g3{animation-name:g3}
    @keyframes g4{0%,78.4167%{transform:scaleX(0)}80%,100%{transform:scaleX(1)}}.g4{animation-name:g4}
    @keyframes sum{0%,79.99%{opacity:0}80%,100%{opacity:1}}.sum{animation-name:sum}
    @media (prefers-reduced-motion: reduce){.gr,.k,.tok{animation:none}.gr{transform:none}.k{opacity:1}.tok{transform:translateX(720px)}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="384" rx="14"/>
  <text class="h" x="28" y="40">Where four days of lead time go</text><text class="sub" x="28" y="62">One change, from commit to production. Hours, illustrative.</text><text class="prit" x="40" y="100" style="font-size:13px">commit</text><text class="teat" x="760" y="100" text-anchor="end" style="font-size:13px">production</text><rect class="bm" x="40" y="120" width="180" height="40" rx="0" stroke-width="1"/><rect class="badf gr g0" x="40" y="120" width="180" height="40"/><text class="badt" x="130" y="182" text-anchor="middle" style="font-size:13px">Wait for review: 24 h</text><rect class="bm" x="220" y="120" width="45" height="40" rx="0" stroke-width="1"/><rect class="tea gr g1" x="220" y="120" width="45" height="40"/><line class="grid" x1="242.5" y1="162" x2="242.5" y2="200" style="stroke-width:1.5"/><text class="teat" x="248.5" y="214" text-anchor="end" style="font-size:13px">Review + fixes: 6 h</text><rect class="bm" x="265" y="120" width="15" height="40" rx="0" stroke-width="1"/><rect class="tea gr g2" x="265" y="120" width="15" height="40"/><line class="grid" x1="272.5" y1="162" x2="272.5" y2="200" style="stroke-width:1.5"/><text class="teat" x="266.5" y="214" text-anchor="start" style="font-size:13px">CI: 2 h</text><rect class="bm" x="280" y="120" width="465" height="40" rx="0" stroke-width="1"/><rect class="badf gr g3" x="280" y="120" width="465" height="40"/><text class="badt" x="512.5" y="182" text-anchor="middle" style="font-size:13px">Wait for weekly release window: 62 h</text><rect class="bm" x="745" y="120" width="15" height="40" rx="0" stroke-width="1"/><rect class="tea gr g4" x="745" y="120" width="15" height="40"/><line class="grid" x1="752.5" y1="162" x2="752.5" y2="200" style="stroke-width:1.5"/><text class="teat" x="758.5" y="214" text-anchor="end" style="font-size:13px">Deploy: 2 h</text><g class="tok"><circle class="pri" cx="40" cy="140" r="9"/></g><g class="k sum"><rect class="bw" x="150" y="262" width="500" height="70" rx="10" stroke-width="1.5"/><text class="lbl" x="400" y="290" text-anchor="middle">Working: 10 h · Waiting: 86 h</text><text class="wrnt" x="400" y="314" text-anchor="middle" style="font-size:14px">about 90% of the lead time is queues, not work</text></g><text class="sm" x="28" y="366">Shorten the waits (review SLA, daily deploys, lighter approvals) before optimising the work.</text>
</svg>
