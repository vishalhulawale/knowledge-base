<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">ESR: walking the index in sort order and stopping early</title>
  <desc id="d">Query: DENIED claims in March, sorted by amount descending, limit 3; an illustrative small version of the page&#x27;s limit-20 query. Left, index {status, serviceDate}: the DENIED March entries are contiguous but in date order, so all eight are scanned and fetched, then sorted in memory to pick the top 3. Right, the ESR index {status, amount -1, serviceDate}: DENIED entries are in amount order, so the scan walks from the largest amount, checks the date inside the index, skips February and January entries, and stops after the third March match: 5 keys examined, 3 documents fetched, no sort. On the measured data this was 143 keys and 20 documents instead of 4,105 and a sort.</desc>
