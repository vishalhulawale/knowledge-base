  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Async replica: the commit is acknowledged first</text>
  <text class="sub" x="28" y="62">Each square is a committed transaction's WAL. The standby replays the same stream, later.</text>
  <text class="lbl" x="28" y="122">Primary</text><text class="sub" x="28" y="140">commit → OK</text>
  <text class="lbl" x="28" y="222">Standby</text><text class="sub" x="28" y="240">read-only, replays</text>
