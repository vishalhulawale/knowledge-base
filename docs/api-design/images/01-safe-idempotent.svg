<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Safe and idempotent HTTP methods</title>
  <desc id="d">HTTP methods grouped by two properties. Safe methods, GET, HEAD and OPTIONS, request no state change, so crawlers and caches call them freely. All safe methods are also idempotent. PUT and DELETE are idempotent but not safe: repeating them has the same effect as doing them once, so clients and proxies may retry them. POST is neither, and PATCH is not idempotent in general, so retrying them needs an idempotency key.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="358" rx="14"/>
  <text class="h" x="28" y="40">Which requests can be retried automatically?</text>
  <text class="sub" x="28" y="62">RFC 9110. Idempotent = same effect on server state no matter how often it&#x27;s sent.</text>
  <rect class="bt" x="28" y="92" width="470" height="200" rx="16" stroke-width="1.5"/>
  <text class="lbl teat" x="44" y="116">Idempotent: safe to retry</text>
  <rect class="bo" x="48" y="130" width="200" height="140" rx="12" stroke-width="1.5"/>
  <text class="sm okt" x="64" y="154" font-weight="700">Safe: no state change</text>
  <rect class="okf" x="64" y="166" width="120" height="26" rx="5"/>
  <text class="on13" x="124" y="183.5" text-anchor="middle">GET</text>
  <rect class="okf" x="64" y="198" width="120" height="26" rx="5"/>
  <text class="on13" x="124" y="215.5" text-anchor="middle">HEAD</text>
  <rect class="okf" x="64" y="230" width="120" height="26" rx="5"/>
  <text class="on13" x="124" y="247.5" text-anchor="middle">OPTIONS</text>
  <rect class="tea" x="300" y="150" width="140" height="30" rx="6"/>
  <text class="on13" x="370" y="169.5" text-anchor="middle">PUT</text>
  <rect class="tea" x="300" y="190" width="140" height="30" rx="6"/>
  <text class="on13" x="370" y="209.5" text-anchor="middle">DELETE</text>
  <text class="sm" x="300" y="248">repeat = same end state</text>
  <rect class="bw" x="530" y="92" width="242" height="200" rx="16" stroke-width="1.5"/>
  <text class="lbl wrnt" x="546" y="116">Not idempotent</text>
  <rect class="wrnf" x="560" y="150" width="160" height="30" rx="6"/>
  <text class="on13" x="640" y="169.5" text-anchor="middle">POST</text>
  <rect class="wrnf" x="560" y="190" width="160" height="30" rx="6"/>
  <text class="on13" x="640" y="209.5" text-anchor="middle">PATCH*</text>
  <text class="sm" x="546" y="248">retry needs an</text>
  <text class="sm wrnt" x="546" y="264" font-weight="700">Idempotency-Key</text>
  <text class="tx badt" x="28" y="320">A state-changing GET (/members/42/delete) will eventually be hit by a crawler or prefetcher.</text>
  <text class="sub" x="28" y="344">* PATCH can be made idempotent (e.g. JSON Patch with a test op, or If-Match), but isn&#x27;t by definition.</text>
</svg>
