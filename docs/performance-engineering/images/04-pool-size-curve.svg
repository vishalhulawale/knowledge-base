<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Connection pool size curve</title>
  <desc id="d">Two curves against pool size from 2 to 64 connections on an illustrative 8-core database server. Throughput rises from 3,000 to about 10,400 transactions per second at 16 connections, then falls slightly to 9,100 at 64. Database p99 latency stays at 4 to 7 milliseconds up to 16 connections, then climbs to 32 milliseconds at 64. The 8 to 16 range is marked as the sweet spot. A side panel applies Little's law: 400 requests per second times 2 statements times 3 milliseconds is about 2.4 busy connections, but a 200 millisecond remote call inside the transaction makes it about 81.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="382" rx="14"/>
  <text class="h" x="28" y="40">Pool size: more connections, not more throughput</text><text class="sub" x="28" y="62">One 8-core database server. Illustrative curve.</text><rect class="bo" x="268" y="90" width="114" height="200" rx="4" stroke-dasharray="4 4" stroke-width="1"/><text class="okt" x="325" y="108" text-anchor="middle" style="font-size:13px">sweet spot</text><line class="grid" x1="90" y1="290" x2="560" y2="290"/><text class="sub" x="82" y="294" text-anchor="end">0k</text><line class="grid" x1="90" y1="226.667" x2="560" y2="226.667"/><text class="sub" x="82" y="230.667" text-anchor="end">4k</text><line class="grid" x1="90" y1="163.333" x2="560" y2="163.333"/><text class="sub" x="82" y="167.333" text-anchor="end">8k</text><line class="grid" x1="90" y1="100" x2="560" y2="100"/><text class="sub" x="82" y="104" text-anchor="end">12k</text><text class="sub" x="568" y="294">0 ms</text><text class="sub" x="568" y="230.667">12 ms</text><text class="sub" x="568" y="167.333">24 ms</text><text class="sub" x="568" y="104">36 ms</text><text class="sub" x="90" y="310" text-anchor="middle">2</text><text class="sub" x="184" y="310" text-anchor="middle">4</text><text class="sub" x="278" y="310" text-anchor="middle">8</text><text class="sub" x="372" y="310" text-anchor="middle">16</text><text class="sub" x="466" y="310" text-anchor="middle">32</text><text class="sub" x="560" y="310" text-anchor="middle">64</text><text class="sub" x="325" y="330" text-anchor="middle">connections in the pool</text><text class="teat" x="28" y="82" style="font-size:12px">transactions/s</text><text class="badt" x="568" y="82" style="font-size:12px">DB p99</text><path class="lnt" d="M 90.0 242.5 L 184.0 201.3 L 278.0 144.3 L 372.0 125.3 L 466.0 131.7 L 560.0 145.9"/><path class="lnb" d="M 90.0 268.9 L 184.0 268.9 L 278.0 263.6 L 372.0 253.1 L 466.0 210.8 L 560.0 121.1"/><circle class="tea" cx="90.0" cy="242.5" r="4"/><circle class="tea" cx="184.0" cy="201.3" r="4"/><circle class="tea" cx="278.0" cy="144.3" r="4"/><circle class="tea" cx="372.0" cy="125.3" r="4"/><circle class="tea" cx="466.0" cy="131.7" r="4"/><circle class="tea" cx="560.0" cy="145.9" r="4"/><circle class="badf" cx="90.0" cy="268.9" r="4"/><circle class="badf" cx="184.0" cy="268.9" r="4"/><circle class="badf" cx="278.0" cy="263.6" r="4"/><circle class="badf" cx="372.0" cy="253.1" r="4"/><circle class="badf" cx="466.0" cy="210.8" r="4"/><circle class="badf" cx="560.0" cy="121.1" r="4"/><rect class="bm" x="624" y="96" width="156" height="200" rx="8"/><text class="sm" x="638" y="120">Little's law:</text><text class="sm" x="638" y="137">in-flight =</text><text class="sm" x="638" y="154">rate × hold time</text><text class="okt sm" x="638" y="184">400/s × 2 × 3 ms</text><text class="okt sm" x="638" y="201">≈ 2.4 busy</text><text class="badt sm" x="638" y="238">+200 ms remote call</text><text class="badt sm" x="638" y="255">inside the tx</text><text class="badt sm" x="638" y="272">≈ 81 busy</text><text class="sm" x="28" y="362">Past the knee, extra connections queue inside the database. Shorten hold time before growing the pool.</text>
</svg>
