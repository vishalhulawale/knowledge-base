<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 398" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Out-of-order webhook events</title>
  <desc id="d">Animation: payment pay_1 moved from processing, version 1, to succeeded, version 2, but the provider delivers evt_2 (succeeded, v2) before evt_1 (processing, v1). After evt_2, both stores show succeeded version 2. When the late evt_1 arrives, last-write-wins overwrites it to processing version 1, so a paid order looks stuck; the version-guarded upsert ignores it because 1 is not greater than 2 and keeps succeeded. The SQL guard is shown: on conflict update only where the incoming version is greater. Without a version field, allow only forward state transitions or re-fetch the object.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes a0{0%,7.99%{opacity:0}8%,96.99%{opacity:1}97%,100%{opacity:0}}.a0{animation-name:a0}
    @keyframes a1{0%,37.99%{opacity:0}38%,96.99%{opacity:1}97%,100%{opacity:0}}.a1{animation-name:a1}
    @keyframes p1{0%,7.99%{opacity:0}8%,37.99%{opacity:1}38%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,37.99%{opacity:0}38%,96.99%{opacity:1}97%,100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%,61.99%{opacity:0}62%,96.99%{opacity:1}97%,100%{opacity:0}}.p3{animation-name:p3}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}.p1{opacity:0}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="396" rx="14"/>
  <text class="h" x="28" y="40">Events can arrive in a different order than they were sent</text><text class="sub" x="28" y="62">Payment pay_1 went processing (v1) → succeeded (v2). The provider delivers v2 first.</text><text class="sm" x="28" y="96" font-weight="700">Arrival order</text><g class="k a0"><rect class="bp" x="28" y="110" width="220" height="40" rx="8" stroke-width="1.5"/><text class="mono" x="40" y="135" xml:space="preserve">1. evt_2  succeeded  v2</text></g><g class="k a1"><rect class="bp" x="28" y="160" width="220" height="40" rx="8" stroke-width="1.5"/><text class="mono" x="40" y="185" xml:space="preserve">2. evt_1  processing  v1</text></g><text class="sm" x="300" y="96" font-weight="700">Last write wins</text><rect class="bm" x="300" y="110" width="224" height="120" rx="10"/><text class="sub" x="314" y="134">payments row: pay_1</text><text class="sm" x="548" y="96" font-weight="700">Apply only if newer version</text><rect class="bm" x="548" y="110" width="224" height="120" rx="10"/><text class="sub" x="562" y="134">payments row: pay_1</text><g class="k p1"><text class="okt" x="314" y="170" style="font-size:15px">status = succeeded</text><text class="mono" x="314" y="196" xml:space="preserve">version = 2</text></g><g class="k p1"><text class="okt" x="562" y="170" style="font-size:15px">status = succeeded</text><text class="mono" x="562" y="196" xml:space="preserve">version = 2</text></g><g class="k p2"><text class="badt" x="314" y="170" style="font-size:15px">status = processing</text><text class="mono" x="314" y="196" xml:space="preserve">version = 1  (overwritten)</text><text class="okt" x="562" y="170" style="font-size:15px">status = succeeded</text><text class="mono" x="562" y="196" xml:space="preserve">version = 2  (1 ≤ 2: no-op)</text></g><g class="k p3"><text class="badt" x="300" y="256">Paid, but the order looks</text><text class="badt" x="300" y="274">stuck in processing.</text><text class="okt" x="548" y="256">Newest state kept, whatever</text><text class="okt" x="548" y="274">the arrival order.</text></g><rect class="box" x="28" y="300" width="744" height="52" rx="8"/><text class="mono" x="42" y="322" xml:space="preserve">ON CONFLICT(id) DO UPDATE SET status = excluded.status, version = excluded.version</text><text class="mono" x="42" y="342" xml:space="preserve">WHERE excluded.version &gt; payments.version</text><text class="sm" x="28" y="378">No version field? Allow only forward state transitions, or re-fetch the object from the API.</text>
</svg>
