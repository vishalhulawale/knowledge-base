<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 468" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">On-call ownership handoff</title>
  <desc id="d">Two lanes, vendor and customer, across four phases. In build and launch the FDE builds and is primary while the customer is informed. In hypercare, four weeks in the example, the vendor is primary on-call with daily triage while the customer's platform on-call shadows. In the shared phase, four weeks, the customer takes L1 and L2 alerts, runbooks and infrastructure, with the vendor at L3 via support with a one-hour Sev1 response around the clock. In steady state the customer owns it and the vendor is escalation per the support contract. The final handoff requires evidence: a release, rollback and prompt change done unaided, two real alerts handled, a game day passed, the eval harness run with 20 new golden cases, credentials on customer service identities, vendor access removed and a business review.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="466" rx="14"/>
  <text class="h" x="28" y="40">Who holds the pager, phase by phase</text><text class="sub" x="28" y="62">Durations from the page's example plan (hypercare is often 2–6 weeks). Green = first responder.</text><text class="sm" x="174" y="96" text-anchor="middle" font-weight="700">Build &amp; launch</text><text class="sm" x="325" y="96" text-anchor="middle" font-weight="700">Hypercare · 4 wks</text><text class="sm" x="521" y="96" text-anchor="middle" font-weight="700">Shared · 4 wks</text><text class="sm" x="697" y="96" text-anchor="middle" font-weight="700">Steady state</text><text class="lbl" x="28" y="146">Vendor</text><rect class="bo" x="124" y="110" width="100" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="174" y="136" text-anchor="middle">FDE builds,</text><text class="sm" x="174" y="154" text-anchor="middle">primary</text><rect class="bo" x="230" y="110" width="190" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="325" y="136" text-anchor="middle">primary on-call,</text><text class="sm" x="325" y="154" text-anchor="middle">daily triage</text><rect class="bm" x="426" y="110" width="190" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="521" y="136" text-anchor="middle">L3 via support,</text><text class="sm" x="521" y="154" text-anchor="middle">Sev1 1 h, 24x7</text><rect class="bm" x="622" y="110" width="150" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="697" y="136" text-anchor="middle">escalation per</text><text class="sm" x="697" y="154" text-anchor="middle">support contract</text><text class="lbl" x="28" y="216">Customer</text><rect class="bm" x="124" y="180" width="100" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="174" y="215" text-anchor="middle">informed</text><rect class="bm" x="230" y="180" width="190" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="325" y="206" text-anchor="middle">platform on-call</text><text class="sm" x="325" y="224" text-anchor="middle">shadows</text><rect class="bo" x="426" y="180" width="190" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="521" y="206" text-anchor="middle">L1/L2: alerts,</text><text class="sm" x="521" y="224" text-anchor="middle">runbooks, infra</text><rect class="bo" x="622" y="180" width="150" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="697" y="215" text-anchor="middle">owns it</text><line class="lnp dash" x1="227" y1="104" x2="227" y2="252"/><text class="prit" x="227" y="268" text-anchor="middle" style="font-size:12.5px">go-live</text><line class="lnp dash" x1="423" y1="104" x2="423" y2="252"/><text class="prit" x="423" y="268" text-anchor="middle" style="font-size:12.5px">first handover</text><line class="lnp dash" x1="619" y1="104" x2="619" y2="252"/><text class="prit" x="619" y="268" text-anchor="middle" style="font-size:12.5px">handoff</text><path class="lnp" d="M 619 274 L 619 290" marker-end="url(#arp)"/><rect class="bp" x="28" y="294" width="744" height="126" rx="10" stroke-width="1.5"/><text class="h2" x="44" y="318">Handoff exit criteria: evidence, not attendance</text><rect class="okf" x="44" y="333" width="16" height="16" rx="4"/><text class="on13" x="48" y="346" style="font-size:12px">✓</text><text class="sm" x="68" y="346">release, rollback and prompt change done unaided</text><rect class="okf" x="410" y="333" width="16" height="16" rx="4"/><text class="on13" x="414" y="346" style="font-size:12px">✓</text><text class="sm" x="434" y="346">2 real alerts handled; vendor observed only</text><rect class="okf" x="44" y="363" width="16" height="16" rx="4"/><text class="on13" x="48" y="376" style="font-size:12px">✓</text><text class="sm" x="68" y="376">game day: throttling, expired IdP cert, bad prompt</text><rect class="okf" x="410" y="363" width="16" height="16" rx="4"/><text class="on13" x="414" y="376" style="font-size:12px">✓</text><text class="sm" x="434" y="376">eval harness run; 20 new golden cases added</text><rect class="okf" x="44" y="393" width="16" height="16" rx="4"/><text class="on13" x="48" y="406" style="font-size:12px">✓</text><text class="sm" x="68" y="406">credentials on customer service identities</text><rect class="okf" x="410" y="393" width="16" height="16" rx="4"/><text class="on13" x="414" y="406" style="font-size:12px">✓</text><text class="sm" x="434" y="406">vendor and FDE access removed; business review</text><text class="sm" x="28" y="448">Any criterion missing? Extend the shared phase deliberately. Skipping a phase is how hero deployments are born.</text>
</svg>
