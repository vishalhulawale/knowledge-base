  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Three doubts about a services background</text><text class="sub" x="28" y="62">Each doubt needs a specific kind of story, not a general claim.</text><text class="sm" x="28" y="96" font-weight="700">Hiring manager's doubt</text><text class="sm" x="278" y="96" font-weight="700">Evidence that removes it</text><text class="sm" x="528" y="96" font-weight="700">Resume source</text><rect class="bb" x="28" y="110" width="232" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="144" y="136" text-anchor="middle">Did you own outcomes,</text><text class="sm" x="144" y="154" text-anchor="middle">or deliver tickets?</text><rect class="bt" x="278" y="110" width="232" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="394" y="136" text-anchor="middle">End-to-end story that</text><text class="sm" x="394" y="154" text-anchor="middle">continues after go-live</text><rect class="bp" x="528" y="110" width="244" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="650" y="136" text-anchor="middle">GraphQL Consumer Service:</text><text class="sm" x="650" y="154" text-anchor="middle">5 upstreams, 750K+ users</text><line class="ln" x1="262" y1="140" x2="274" y2="140" marker-end="url(#ar)"/><line class="ln" x1="512" y1="140" x2="524" y2="140" marker-end="url(#ar)"/><rect class="bb" x="28" y="186" width="232" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="144" y="212" text-anchor="middle">Can you code at</text><text class="sm" x="144" y="230" text-anchor="middle">product-company quality?</text><rect class="bt" x="278" y="186" width="232" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="394" y="212" text-anchor="middle">Design decisions and</text><text class="sm" x="394" y="230" text-anchor="middle">standards you set</text><rect class="bp" x="528" y="186" width="244" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="650" y="212" text-anchor="middle">Testing + CI/CD standards;</text><text class="sm" x="650" y="230" text-anchor="middle">CCKM and Metasys products</text><line class="ln" x1="262" y1="216" x2="274" y2="216" marker-end="url(#ar)"/><line class="ln" x1="512" y1="216" x2="524" y2="216" marker-end="url(#ar)"/><rect class="bb" x="28" y="262" width="232" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="144" y="288" text-anchor="middle">Will you push back on</text><text class="sm" x="144" y="306" text-anchor="middle">a client, or just bill?</text><rect class="bt" x="278" y="262" width="232" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="394" y="288" text-anchor="middle">A real pushback story</text><text class="sm" x="394" y="306" text-anchor="middle">where trust was kept</text><rect class="bw" x="528" y="262" width="244" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="650" y="288" text-anchor="middle">[confirm] a scope or</text><text class="sm" x="650" y="306" text-anchor="middle">approach disagreement</text><line class="ln" x1="262" y1="292" x2="274" y2="292" marker-end="url(#ar)"/><line class="ln" x1="512" y1="292" x2="524" y2="292" marker-end="url(#ar)"/><text class="sub" x="28" y="360">Amber = a story still to confirm. Prepare one story per row before any FDE loop.</text>
</svg>
