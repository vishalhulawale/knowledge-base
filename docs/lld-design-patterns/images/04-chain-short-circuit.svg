<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Chain of responsibility: a filter can stop the request</title>
  <desc id="d">Two requests pass through the same filter chain: correlation ID, bearer token authentication, authorisation, rate limiting, then the controller. Request A carries an expired JWT: it passes the correlation filter, and the bearer token filter answers 401 and stops the chain, so authorisation, rate limiting and the controller never see it. Request B has a valid token with the right scope: it passes every filter and reaches the controller, which returns 200.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:14s infinite linear}
    @keyframes ta{0%{transform:translate(0px,0);opacity:0}2%{transform:translate(0px,0);opacity:1}10%{transform:translate(110px,0);opacity:1}14%{transform:translate(110px,0);opacity:1}22%{transform:translate(250px,0);opacity:1}40%{transform:translate(250px,0);opacity:1}43%{transform:translate(250px,0);opacity:0}100%{transform:translate(250px,0);opacity:0}}.ta{animation:ta 14s infinite linear}
    @keyframes tb{0%{transform:translate(0px,0);opacity:0}46%{transform:translate(0px,0);opacity:0}48%{transform:translate(0px,0);opacity:1}55%{transform:translate(110px,0);opacity:1}62%{transform:translate(250px,0);opacity:1}69%{transform:translate(390px,0);opacity:1}76%{transform:translate(530px,0);opacity:1}83%{transform:translate(666px,0);opacity:1}97%{transform:translate(666px,0);opacity:1}99%{transform:translate(666px,0);opacity:0}100%{transform:translate(666px,0);opacity:0}}.tb{animation:tb 14s infinite linear}
    @keyframes a401{0%{opacity:0}21%{opacity:0}22%,42%{opacity:1}43%{opacity:0}100%{opacity:0}}
    .a401{animation-name:a401}
    @keyframes b200{0%{opacity:0}82%{opacity:0}83%,98%{opacity:1}99%{opacity:0}100%{opacity:0}}
    .b200{animation-name:b200}
    @keyframes ax{0%{opacity:0}21%{opacity:0}22%,42%{opacity:1}43%{opacity:0}100%{opacity:0}}
    .ax{animation-name:ax}
    @keyframes la{0%,44%{opacity:1}45%{opacity:0}100%{opacity:0}}
    .la{animation-name:la}
    @keyframes lb{0%{opacity:0}45%{opacity:0}46%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .lb{animation-name:lb}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .ta{transform:translate(250px,0);opacity:1}.tb{opacity:0}.b200,.lb{opacity:0!important}
    }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Two requests, one chain</text>
  <text class="sub" x="28" y="62">Each handler either passes the request on or answers it and stops.</text>
  <rect class="box" x="110" y="150" width="120" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="170" y="178" text-anchor="middle" font-weight="700">CorrelationId</text>
  <rect class="box" x="250" y="150" width="120" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="310" y="178" text-anchor="middle" font-weight="700">BearerToken</text>
  <rect class="box" x="390" y="150" width="120" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="450" y="178" text-anchor="middle" font-weight="700">Authorization</text>
  <rect class="box" x="530" y="150" width="120" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="590" y="178" text-anchor="middle" font-weight="700">RateLimit</text>
  <rect class="bt" x="670" y="150" width="120" height="46" rx="10" stroke-width="1.5"/>
  <text class="tx" x="730" y="178" text-anchor="middle" font-weight="700">Controller</text>
  <line class="ln" x1="230" y1="173" x2="248" y2="173" marker-end="url(#ar)"/>
  <line class="ln" x1="370" y1="173" x2="388" y2="173" marker-end="url(#ar)"/>
  <line class="ln" x1="510" y1="173" x2="528" y2="173" marker-end="url(#ar)"/>
  <line class="ln" x1="650" y1="173" x2="668" y2="173" marker-end="url(#ar)"/>
  <text class="sm" x="28" y="178">request</text>
  <g class="ta">
  <rect class="badf" x="40" y="110" width="64" height="28" rx="14"/>
  <text class="on13" x="72" y="128.5" text-anchor="middle">A</text>
  </g>
  <g class="tb">
  <rect class="okf" x="40" y="110" width="64" height="28" rx="14"/>
  <text class="on13" x="72" y="128.5" text-anchor="middle">B</text>
  </g>
  <text class="tx badt a a401" x="310" y="250" text-anchor="middle">expired JWT → 401, chain stops</text>
  <text class="sm a ax" x="450" y="216" text-anchor="middle">never called</text>
  <text class="sm a ax" x="590" y="216" text-anchor="middle">never called</text>
  <text class="sm a ax" x="730" y="216" text-anchor="middle">never called</text>
  <text class="tx okt a b200" x="730" y="226" text-anchor="middle">200 OK</text>
  <text class="lbl a la" x="28" y="292">Request A: Authorization: Bearer &lt;expired token&gt;</text>
  <text class="lbl a lb" x="28" y="292">Request B: valid token with scope rx:read</text>
  <text class="sub" x="28" y="326">Order is part of the design: authenticate before you authorise, and rate-limit before expensive work.</text>
  <text class="sub" x="28" y="346">Spring Security&#x27;s SecurityFilterChain, servlet filters and Express middleware are all this pattern.</text>
</svg>
