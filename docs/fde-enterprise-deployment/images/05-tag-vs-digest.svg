<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Tag versus digest pinning</title>
  <desc id="d">Animation in two rows over illustrative days. Deploy by tag: on day 1 the staging cluster pulls tag 2.7.1 and runs digest sha256:4f1c; on day 5 the base image is patched and 2.7.1 is rebuilt and re-pushed as sha256:9b2e; on day 6 the prod cluster pulls 2.7.1 and runs 9b2e, so both clusters report 2.7.1 but run different code and the signature on 4f1c does not cover prod. Deploy by digest: both clusters pull sha256:4f1c and run identical bytes, and the rebuild's new digest arrives only as a reviewed values change in the customer's GitOps repo.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes r0s0{0%,4.99%{opacity:0}5%,96.99%{opacity:1}97%,100%{opacity:0}}.r0s0{animation-name:r0s0}
    @keyframes r0s1{0%,26.99%{opacity:0}27%,96.99%{opacity:1}97%,100%{opacity:0}}.r0s1{animation-name:r0s1}
    @keyframes r0s2{0%,48.99%{opacity:0}49%,96.99%{opacity:1}97%,100%{opacity:0}}.r0s2{animation-name:r0s2}
    @keyframes v0{0%,71.99%{opacity:0}72%,96.99%{opacity:1}97%,100%{opacity:0}}.v0{animation-name:v0}
    @keyframes r1s0{0%,4.99%{opacity:0}5%,96.99%{opacity:1}97%,100%{opacity:0}}.r1s0{animation-name:r1s0}
    @keyframes r1s1{0%,26.99%{opacity:0}27%,96.99%{opacity:1}97%,100%{opacity:0}}.r1s1{animation-name:r1s1}
    @keyframes r1s2{0%,48.99%{opacity:0}49%,96.99%{opacity:1}97%,100%{opacity:0}}.r1s2{animation-name:r1s2}
    @keyframes v1{0%,71.99%{opacity:0}72%,96.99%{opacity:1}97%,100%{opacity:0}}.v1{animation-name:v1}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="402" rx="14"/>
  <text class="h" x="28" y="40">Same version label, different code</text><text class="sub" x="28" y="62">A tag can be rebuilt and re-pushed; a digest cannot. Days and the 9b2e digest are illustrative.</text><text class="lbl" x="28" y="88">Deploy by tag  (image: vendor/assistant-api:2.7.1)</text><g class="k r0s0"><rect class="box" x="28" y="96" width="232" height="78" rx="8" stroke-width="1.5"/><text class="sm" x="40" y="118" font-weight="700">Day 1 · staging cluster</text><text class="sm" x="40" y="140">pulls :2.7.1</text><text class="mono" x="40" y="162" xml:space="preserve">runs sha256:4f1c…</text><line class="ln" x1="262" y1="135" x2="278" y2="135" marker-end="url(#ar)"/></g><g class="k r0s1"><rect class="bw" x="280" y="96" width="232" height="78" rx="8" stroke-width="1.5"/><text class="sm" x="292" y="118" font-weight="700">Day 5 · base image patched</text><text class="sm" x="292" y="140">2.7.1 rebuilt, re-pushed</text><text class="mono" x="292" y="162" xml:space="preserve">2.7.1 → sha256:9b2e…</text><line class="ln" x1="514" y1="135" x2="530" y2="135" marker-end="url(#ar)"/></g><g class="k r0s2"><rect class="bb" x="532" y="96" width="232" height="78" rx="8" stroke-width="1.5"/><text class="sm" x="544" y="118" font-weight="700">Day 6 · prod cluster</text><text class="sm" x="544" y="140">pulls :2.7.1</text><text class="mono" x="544" y="162" xml:space="preserve">runs sha256:9b2e…</text></g><g class="k v0"><text class="badt" x="28" y="198" style="font-size:13.5px">Both clusters report 2.7.1 but run different bytes; the signature on 4f1c… doesn't cover prod.</text></g><text class="lbl" x="28" y="236">Deploy by digest  (image: vendor/assistant-api@sha256:4f1c…)</text><g class="k r1s0"><rect class="box" x="28" y="244" width="232" height="78" rx="8" stroke-width="1.5"/><text class="sm" x="40" y="266" font-weight="700">Day 1 · staging cluster</text><text class="sm" x="40" y="288">pulls @sha256:4f1c…</text><text class="mono" x="40" y="310" xml:space="preserve">runs sha256:4f1c…</text><line class="ln" x1="262" y1="283" x2="278" y2="283" marker-end="url(#ar)"/></g><g class="k r1s1"><rect class="bw" x="280" y="244" width="232" height="78" rx="8" stroke-width="1.5"/><text class="sm" x="292" y="266" font-weight="700">Day 5 · base image patched</text><text class="sm" x="292" y="288">rebuild gets a new digest</text><text class="mono" x="292" y="310" xml:space="preserve">9b2e… = new values PR</text><line class="ln" x1="514" y1="283" x2="530" y2="283" marker-end="url(#ar)"/></g><g class="k r1s2"><rect class="bo" x="532" y="244" width="232" height="78" rx="8" stroke-width="1.5"/><text class="sm" x="544" y="266" font-weight="700">Day 6 · prod cluster</text><text class="sm" x="544" y="288">pulls @sha256:4f1c…</text><text class="mono" x="544" y="310" xml:space="preserve">runs sha256:4f1c…</text></g><g class="k v1"><text class="okt" x="28" y="346" style="font-size:13.5px">Same bytes everywhere; moving to 9b2e… is a reviewed change in the customer's GitOps repo.</text></g><text class="sm" x="28" y="384">Keep tags for humans; put the digest in the chart values, and sign and attest the digest.</text>
</svg>
