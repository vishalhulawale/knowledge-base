<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Round trips before the first response byte</title>
  <desc id="d">Four horizontal timelines measured in round trips (RTT) for a new connection. HTTP/1.1 or HTTP/2 over TCP with TLS 1.2 needs one round trip for the TCP handshake, two for TLS 1.2 and one for the request, so the response starts after 4 RTT. With TLS 1.3 the TLS step takes one round trip, so 3 RTT. HTTP/3 over QUIC combines the transport and TLS 1.3 handshake into one round trip, so 2 RTT. HTTP/3 resuming a previous session with 0-RTT sends the request in the first flight, so 1 RTT. At a 50 millisecond round trip that is 200, 150, 100 and 50 milliseconds. Simplified: ignores DNS, TCP Fast Open, packet loss and server processing time.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .tcpf{fill:#64748b}.tlsf{fill:#d97706}.quicf{fill:#0ea5a4}.httpf{fill:#4f46e5}
    .grid{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:4 4}
    .prit{fill:#4f46e5;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .on13{fill:#0f172a}
      .tcpf{fill:#94a3b8}.tlsf{fill:#fbbf24}.quicf{fill:#2dd4bf}.httpf{fill:#818cf8}
      .grid{stroke:#475569}
      .prit{fill:#818cf8}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Round trips before the first response byte</text>
  <text class="sub" x="28" y="62">A brand-new connection (except the last row). 1 RTT = one trip to the server and back.</text>

  <!-- grid: x0 = 270, 1 RTT = 120 px -->
  <line class="grid" x1="270" y1="84" x2="270" y2="300"/>
  <line class="grid" x1="390" y1="84" x2="390" y2="300"/>
  <line class="grid" x1="510" y1="84" x2="510" y2="300"/>
  <line class="grid" x1="630" y1="84" x2="630" y2="300"/>
  <line class="grid" x1="750" y1="84" x2="750" y2="300"/>
  <text class="sub" x="270" y="318" text-anchor="middle">0</text>
  <text class="sub" x="390" y="318" text-anchor="middle">1 RTT</text>
  <text class="sub" x="510" y="318" text-anchor="middle">2 RTT</text>
  <text class="sub" x="630" y="318" text-anchor="middle">3 RTT</text>
  <text class="sub" x="750" y="318" text-anchor="middle">4 RTT</text>

  <!-- Row 1: TCP + TLS 1.2 -->
  <text class="lbl" x="28" y="106">HTTP/1.1 or /2</text>
  <text class="sub" x="28" y="124">TCP + TLS 1.2</text>
  <rect class="tcpf" x="271" y="94" width="118" height="30" rx="5"/><text class="on13" x="330" y="114" text-anchor="middle">TCP</text>
  <rect class="tlsf" x="391" y="94" width="238" height="30" rx="5"/><text class="on13" x="510" y="114" text-anchor="middle">TLS 1.2 (2 round trips)</text>
  <rect class="httpf" x="631" y="94" width="118" height="30" rx="5"/><text class="on13" x="690" y="114" text-anchor="middle">GET → 200</text>

  <!-- Row 2: TCP + TLS 1.3 -->
  <text class="lbl" x="28" y="158">HTTP/1.1 or /2</text>
  <text class="sub" x="28" y="176">TCP + TLS 1.3</text>
  <rect class="tcpf" x="271" y="146" width="118" height="30" rx="5"/><text class="on13" x="330" y="166" text-anchor="middle">TCP</text>
  <rect class="tlsf" x="391" y="146" width="118" height="30" rx="5"/><text class="on13" x="450" y="166" text-anchor="middle">TLS 1.3</text>
  <rect class="httpf" x="511" y="146" width="118" height="30" rx="5"/><text class="on13" x="570" y="166" text-anchor="middle">GET → 200</text>

  <!-- Row 3: QUIC 1-RTT -->
  <text class="lbl" x="28" y="210">HTTP/3</text>
  <text class="sub" x="28" y="228">QUIC (TLS 1.3 built in)</text>
  <rect class="quicf" x="271" y="198" width="118" height="30" rx="5"/><text class="on13" x="330" y="218" text-anchor="middle">QUIC + TLS</text>
  <rect class="httpf" x="391" y="198" width="118" height="30" rx="5"/><text class="on13" x="450" y="218" text-anchor="middle">GET → 200</text>

  <!-- Row 4: QUIC 0-RTT -->
  <text class="lbl" x="28" y="262">HTTP/3 resumed</text>
  <text class="sub" x="28" y="280">QUIC 0-RTT</text>
  <rect class="quicf" x="271" y="250" width="118" height="15" rx="4"/>
  <rect class="httpf" x="271" y="265" width="118" height="15" rx="4"/>
  <text class="tx" x="402" y="270">handshake and GET in the same first flight</text>

  <text class="tx" x="28" y="346">At a 50 ms RTT (a phone on a cellular network can be well above that):</text>
  <text class="prit" x="28" y="366" font-size="14">200 ms · 150 ms · 100 ms · 50 ms</text>
  <text class="sub" x="290" y="366">Simplified: ignores DNS, TCP Fast Open, loss and server time.</text>
</svg>
