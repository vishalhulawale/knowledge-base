  </defs>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Who has to coordinate a release?</text>
  <text class="h2" x="28" y="84">Distributed monolith: one release train, fixed order</text>
  <text class="h2" x="28" y="250">Independently deployable services</text>
  <text class="tx" x="40" y="117">Orders</text>
  <line class="ln" x1="150" y1="112" x2="760" y2="112" stroke-width="1.5" opacity="0.5"/>
  <text class="tx" x="40" y="151">Pharmacy</text>
  <line class="ln" x1="150" y1="146" x2="760" y2="146" stroke-width="1.5" opacity="0.5"/>
  <text class="tx" x="40" y="185">Billing</text>
  <line class="ln" x1="150" y1="180" x2="760" y2="180" stroke-width="1.5" opacity="0.5"/>
  <text class="tx" x="40" y="283">Orders</text>
  <line class="ln" x1="150" y1="278" x2="760" y2="278" stroke-width="1.5" opacity="0.5"/>
  <text class="tx" x="40" y="317">Pharmacy</text>
  <line class="ln" x1="150" y1="312" x2="760" y2="312" stroke-width="1.5" opacity="0.5"/>
  <text class="tx" x="40" y="351">Billing</text>
  <line class="ln" x1="150" y1="346" x2="760" y2="346" stroke-width="1.5" opacity="0.5"/>
  <rect class="bw" x="366" y="96" width="74" height="100" rx="8" opacity="0.6"/>
  <rect class="bw" x="646" y="96" width="74" height="100" rx="8" opacity="0.6"/>
  <text class="sub" x="403" y="214" text-anchor="middle">release day</text>
  <text class="sub" x="683" y="214" text-anchor="middle">release day</text>
