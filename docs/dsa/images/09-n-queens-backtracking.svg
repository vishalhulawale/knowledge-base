<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">N-Queens backtracking with pruning, n = 4</title>
  <desc id="d">A 4 by 4 board. Queens are placed one per row, trying columns left to right and skipping attacked cells. Row 0 column 0, row 1 column 2, then row 2 has no safe cell, so the search backtracks. Row 1 column 3 and row 2 column 1 leave row 3 with no safe cell; rows 2 and 1 have no other safe column, so the row 0 queen moves to column 1. Then row 1 column 3, row 2 column 0 and row 3 column 2 give the first solution, columns 1, 3, 0, 2.</desc>
  <style>.card{fill:#f8fafc;stroke:#e2e8f0}
.h{fill:#0f172a;font-size:19px;font-weight:700}
.t{fill:#334155;font-size:14px}
.tb{fill:#334155;font-size:14px;font-weight:700}
.lb{fill:#334155;font-size:15px;font-weight:600}
.m{fill:#64748b;font-size:13px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.box{fill:#ffffff;stroke:#cbd5e1}
.pri{fill:#4f46e5}.spri{stroke:#4f46e5}.tpri{fill:#4f46e5}
.tea{fill:#0ea5a4}.stea{stroke:#0ea5a4}.ttea{fill:#0f766e}
.ok{fill:#16a34a}.sok{stroke:#16a34a}.tok{fill:#16a34a}
.bad{fill:#dc2626}.sbad{stroke:#dc2626}.tbad{fill:#dc2626}
.warn{fill:#d97706}.swarn{stroke:#d97706}.twarn{fill:#d97706}
.smut{stroke:#94a3b8}.mut{fill:#94a3b8}
.tint{fill:#4f46e5;fill-opacity:.14}.ttint{fill:#0ea5a4;fill-opacity:.16}
.gtint{fill:#16a34a;fill-opacity:.16}.rtint{fill:#dc2626;fill-opacity:.14}.atint{fill:#d97706;fill-opacity:.16}
.on{fill:#ffffff;font-size:14px;font-weight:700}
.ln{fill:none;stroke-width:2}
.ah{stroke:none}
@media (prefers-color-scheme: dark){
.card{fill:#1f2430;stroke:#334155}
.h{fill:#f1f5f9}.t,.tb,.lb{fill:#e2e8f0}.m{fill:#94a3b8}
.box{fill:#111827;stroke:#475569}
.pri,.tint{fill:#818cf8}.spri{stroke:#818cf8}.tpri{fill:#818cf8}
.tea,.ttint{fill:#2dd4bf}.stea{stroke:#2dd4bf}.ttea{fill:#5eead4}
.ok,.gtint{fill:#4ade80}.sok{stroke:#4ade80}.tok{fill:#4ade80}
.bad,.rtint{fill:#f87171}.sbad{stroke:#f87171}.tbad{fill:#f87171}
.warn,.atint{fill:#fbbf24}.swarn{stroke:#fbbf24}.twarn{fill:#fbbf24}
.smut{stroke:#64748b}.mut{fill:#64748b}
.on{fill:#0f172a}
}
.fr{opacity:0;animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes k0{0%,6.90%{opacity:1}7.50%,100%{opacity:0}}.f0{animation-name:k0}
@keyframes k1{0%,7.50%{opacity:0}8.10%,14.40%{opacity:1}15.00%,100%{opacity:0}}.f1{animation-name:k1}
@keyframes k2{0%,15.00%{opacity:0}15.60%,21.90%{opacity:1}22.50%,100%{opacity:0}}.f2{animation-name:k2}
@keyframes k3{0%,22.50%{opacity:0}23.10%,29.40%{opacity:1}30.00%,100%{opacity:0}}.f3{animation-name:k3}
@keyframes k4{0%,30.00%{opacity:0}30.60%,36.90%{opacity:1}37.50%,100%{opacity:0}}.f4{animation-name:k4}
@keyframes k5{0%,37.50%{opacity:0}38.10%,44.40%{opacity:1}45.00%,100%{opacity:0}}.f5{animation-name:k5}
@keyframes k6{0%,45.00%{opacity:0}45.60%,51.90%{opacity:1}52.50%,100%{opacity:0}}.f6{animation-name:k6}
@keyframes k7{0%,52.50%{opacity:0}53.10%,59.40%{opacity:1}60.00%,100%{opacity:0}}.f7{animation-name:k7}
@keyframes k8{0%,60.00%{opacity:0}60.60%,66.90%{opacity:1}67.50%,100%{opacity:0}}.f8{animation-name:k8}
@keyframes k9{0%,67.50%{opacity:0}68.10%,74.40%{opacity:1}75.00%,100%{opacity:0}}.f9{animation-name:k9}
@keyframes k10{0%,75.00%{opacity:0}75.60%,99.40%{opacity:1}100%{opacity:0}}.f10{animation-name:k10}
@media (prefers-reduced-motion: reduce){.fr{animation:none!important;opacity:0}.f10{opacity:1}}</style>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">N-Queens (n = 4): place, prune, backtrack</text>
  <text class="m" x="28" y="62">One queen per row, columns tried left to right; red cells are attacked and never explored.</text>
