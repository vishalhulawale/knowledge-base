<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 492" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Server and client components</title>
  <desc id="d">A component tree for a claims page. The root layout, Nav, the claims page, ClaimsTable and HelpText are server components; UserMenu, FilterBar and StatusChart are client components. HelpText is a server component passed into FilterBar as children. A bar below shows the JavaScript shipped: the React and router runtime plus the three client islands; server components add nothing. Sizes are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="490" rx="14"/>
  <text class="h" x="28" y="40">Server by default, client islands at the leaves</text><text class="sub" x="28" y="62">Claims page component tree. Teal runs on the server only; indigo ships JavaScript and hydrates.</text><path class="ln" d="M 290 136 C 290 152, 95 150, 95 166" marker-end="url(#ar)"/><path class="ln" d="M 290 136 C 290 152, 485 150, 485 166" marker-end="url(#ar)"/><path class="ln" d="M 95 206 C 95 222, 95 220, 95 236" marker-end="url(#ar)"/><path class="ln" d="M 485 206 C 485 222, 290 220, 290 236" marker-end="url(#ar)"/><path class="ln" d="M 485 206 C 485 222, 485 220, 485 236" marker-end="url(#ar)"/><path class="ln" d="M 485 206 C 485 222, 680 220, 680 236" marker-end="url(#ar)"/><path class="ln dash" d="M 485 276 C 485 292, 485 290, 485 306" marker-end="url(#ar)"/><rect class="bt" x="215" y="96" width="150" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="290" y="121" text-anchor="middle">layout.tsx</text><rect class="bt" x="20" y="166" width="150" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="95" y="191" text-anchor="middle">Nav</text><rect class="bt" x="410" y="166" width="150" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="485" y="191" text-anchor="middle">claims/page.tsx</text><rect class="bp" x="20" y="236" width="150" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="95" y="261" text-anchor="middle">UserMenu</text><rect class="bt" x="215" y="236" width="150" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="290" y="261" text-anchor="middle">ClaimsTable</text><rect class="bp" x="410" y="236" width="150" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="485" y="261" text-anchor="middle">FilterBar</text><rect class="bp" x="605" y="236" width="150" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="680" y="261" text-anchor="middle">StatusChart</text><rect class="bt" x="410" y="306" width="150" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="485" y="331" text-anchor="middle">HelpText (children)</text><text class="sub" x="560" y="296">server content passed</text><text class="sub" x="560" y="312">into a client component</text><text class="lbl" x="28" y="382">JavaScript shipped for this page (illustrative, KB gzipped)</text><rect class="mutf" x="29" y="392" width="415.978" height="30" rx="5"/><text class="on13" x="236.989" y="412" text-anchor="middle">React + router runtime 100</text><rect class="pri" x="446.978" y="392" width="23.0787" height="30" rx="5"/><line class="ln" x1="458.517" y1="422" x2="458.517" y2="432"/><text class="sm" x="462.517" y="446" text-anchor="end">UserMenu 6</text><rect class="pri" x="472.056" y="392" width="48.1573" height="30" rx="5"/><line class="ln" x1="496.135" y1="422" x2="496.135" y2="432"/><text class="sm" x="492.135" y="446" text-anchor="start">FilterBar 12</text><rect class="pri" x="522.213" y="392" width="248.787" height="30" rx="5"/><text class="on13" x="646.607" y="412" text-anchor="middle">StatusChart 60</text><text class="sm" x="28" y="472">Server components add 0 KB. Put 'use client' on claims/page.tsx and its whole subtree joins the bundle.</text>
</svg>
