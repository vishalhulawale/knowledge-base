  <line class="lnt" x1="320" y1="228" x2="396" y2="276" marker-end="url(#art)"/>
  <rect class="badf" x="520" y="268" width="16" height="16" rx="3"/>
  <rect class="badf" x="542" y="268" width="16" height="16" rx="3"/>
  <rect class="badf" x="564" y="268" width="16" height="16" rx="3"/>
  <line class="lnw" x1="490" y1="276" x2="516" y2="276"/>
