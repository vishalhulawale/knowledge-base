<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Fail open versus closed</title>
  <desc id="d">Animation: two lanes, each with a request, an authorisation check backed by a policy service, and claims data. The policy service times out in both. In the fail-open lane the check's catch block returns true and the request continues to the claims data. In the fail-closed lane the request returns as a 503 and an alert fires.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    .dot{animation:14s infinite ease-in-out}
    @keyframes to{0%,21.99%{opacity:0}22%,100%{opacity:1}}.to{animation-name:to}
    @keyframes d1{0%{transform:translate(0px,0px)}20%,32%{transform:translate(138px,0px)}55%,100%{transform:translate(458px,0px)}}.d1{animation-name:d1}
    @keyframes d2{0%{transform:translate(0px,0px)}20%,32%{transform:translate(138px,0px)}55%,100%{transform:translate(0px,0px)}}.d2{animation-name:d2}
    @keyframes r{0%,55.99%{opacity:0}56%,100%{opacity:1}}.r{animation-name:r}
    @media (prefers-reduced-motion: reduce){.k,.dot{animation:none}.k{opacity:1}.d1{transform:translate(458px,0px)}.d2{transform:none}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Same outage, two outcomes</text><text class="sub" x="28" y="62">The policy service times out. What does the authorisation check return?</text><text class="lbl" x="28" y="96">Fails open: catch → return true</text><rect class="box" x="28" y="108" width="120" height="44" rx="8" stroke-width="1.5"/><text class="sm" x="88" y="135" text-anchor="middle">Request</text><rect class="bp" x="300" y="108" width="150" height="44" rx="8" stroke-width="1.5"/><text class="sm" x="375" y="135" text-anchor="middle" font-weight="700">Authz check</text><rect class="bm" x="620" y="108" width="150" height="44" rx="8" stroke-width="1.5"/><text class="sm" x="695" y="135" text-anchor="middle">Claims data</text><line class="ln" x1="150" y1="130" x2="296" y2="130" marker-end="url(#ar)"/><line class="ln" x1="452" y1="130" x2="616" y2="130" marker-end="url(#ar)"/><rect class="box" x="320" y="164" width="110" height="30" rx="8" stroke-width="1.5"/><text class="sub" x="375" y="184" text-anchor="middle">policy svc</text><line class="ln" x1="375" y1="164" x2="375" y2="154"/><text class="lbl" x="28" y="236">Fails closed: catch → 503</text><rect class="box" x="28" y="248" width="120" height="44" rx="8" stroke-width="1.5"/><text class="sm" x="88" y="275" text-anchor="middle">Request</text><rect class="bp" x="300" y="248" width="150" height="44" rx="8" stroke-width="1.5"/><text class="sm" x="375" y="275" text-anchor="middle" font-weight="700">Authz check</text><rect class="bm" x="620" y="248" width="150" height="44" rx="8" stroke-width="1.5"/><text class="sm" x="695" y="275" text-anchor="middle">Claims data</text><line class="ln" x1="150" y1="270" x2="296" y2="270" marker-end="url(#ar)"/><line class="ln" x1="452" y1="270" x2="616" y2="270" marker-end="url(#ar)"/><rect class="box" x="320" y="304" width="110" height="30" rx="8" stroke-width="1.5"/><text class="sub" x="375" y="324" text-anchor="middle">policy svc</text><line class="ln" x1="375" y1="304" x2="375" y2="294"/><g class="k to"><rect class="bw" x="320" y="164" width="110" height="30" rx="8" stroke-width="1.5"/><text class="sub" x="375" y="184" text-anchor="middle">policy svc</text><text class="wrnt" x="440" y="184" style="font-size:13px">✕ timeout</text></g><g class="k to"><rect class="bw" x="320" y="304" width="110" height="30" rx="8" stroke-width="1.5"/><text class="sub" x="375" y="324" text-anchor="middle">policy svc</text><text class="wrnt" x="440" y="324" style="font-size:13px">✕ timeout</text></g><circle class="dot d1 badf" cx="150" cy="130" r="9"/><circle class="dot d2 okf" cx="150" cy="270" r="9"/><g class="k r"><rect class="bb" x="560" y="80" width="210" height="26" rx="6"/><text class="badt" x="665" y="98" text-anchor="middle" style="font-size:13px">Request reaches data</text><rect class="bo" x="28" y="220" width="190" height="26" rx="6"/><text class="okt" x="123" y="238" text-anchor="middle" style="font-size:13px">503 + alert fires</text></g><text class="sm" x="28" y="356">Fail-open turns an availability problem into an access-control breach (A10, CWE-636).</text>
</svg>
