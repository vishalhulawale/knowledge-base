<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Splitwise: simplifying debts with net balances</title>
  <desc id="d">Left: four friends owe each other through six separate debts: B owes A 40, C owes A 20, C owes B 30, D owes B 10, D owes C 20 and A owes D 10. Middle: the net balance per person: A is owed 50, B is even, C owes 30 and D owes 20. Right: greedily matching the largest debtor with the largest creditor settles everything in two payments: C pays A 30 and D pays A 20.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">Six debts become two payments</text>
  <text class="sub" x="28" y="62">Only each person&#x27;s net balance matters. Greedy: biggest debtor pays biggest creditor.</text>
  <circle class="box" cx="70" cy="120" r="22" stroke-width="1.5"/>
  <text class="lbl" x="70" y="125" text-anchor="middle">A</text>
  <circle class="box" cx="270" cy="120" r="22" stroke-width="1.5"/>
  <text class="lbl" x="270" y="125" text-anchor="middle">B</text>
  <circle class="box" cx="70" cy="300" r="22" stroke-width="1.5"/>
  <text class="lbl" x="70" y="305" text-anchor="middle">C</text>
  <circle class="box" cx="270" cy="300" r="22" stroke-width="1.5"/>
  <text class="lbl" x="270" y="305" text-anchor="middle">D</text>
  <line class="ln" x1="244" y1="112" x2="98" y2="112" marker-end="url(#ar)"/>
  <text class="tx" x="170" y="104.8" text-anchor="middle" font-weight="700">40</text>
  <line class="ln" x1="62" y1="274" x2="62" y2="148" marker-end="url(#ar)"/>
  <text class="tx" x="50.8" y="214" text-anchor="middle" font-weight="700">20</text>
  <line class="ln" x1="94.6774" y1="288.553" x2="254.539" y2="144.677" marker-end="url(#ar)"/>
  <text class="tx" x="142.844" y="264.271" text-anchor="middle" font-weight="700">30</text>
  <line class="ln" x1="262" y1="274" x2="262" y2="148" marker-end="url(#ar)"/>
  <text class="tx" x="250.8" y="214" text-anchor="middle" font-weight="700">10</text>
  <line class="ln" x1="244" y1="292" x2="98" y2="292" marker-end="url(#ar)"/>
  <text class="tx" x="170" y="284.8" text-anchor="middle" font-weight="700">20</text>
  <line class="ln" x1="83.9739" y1="143.339" x2="243.836" y2="287.215" marker-end="url(#ar)"/>
  <text class="tx" x="117.156" y="192.271" text-anchor="middle" font-weight="700">10</text>
  <text class="lbl badt" x="170" y="360" text-anchor="middle">6 payments</text>
  <text class="lbl" x="400" y="110" text-anchor="middle">net balance</text>
  <text class="lbl" x="334" y="145">A</text>
  <rect class="okf" x="400" y="131" width="70" height="18" rx="3"/>
  <text class="sm" x="478" y="145">+50</text>
  <text class="lbl" x="334" y="189">B</text>
  <text class="sm" x="408" y="189">0</text>
  <text class="lbl" x="334" y="233">C</text>
  <rect class="badf" x="358" y="219" width="42" height="18" rx="3"/>
  <text class="sm" x="410" y="233">-30</text>
  <text class="lbl" x="334" y="277">D</text>
  <rect class="badf" x="372" y="263" width="28" height="18" rx="3"/>
  <text class="sm" x="410" y="277">-20</text>
  <line class="ln" x1="400" y1="122" x2="400" y2="290" style="stroke-width:1"/>
  <circle class="bo" cx="640" cy="120" r="22" stroke-width="1.5"/>
  <text class="lbl" x="640" y="125" text-anchor="middle">A</text>
  <circle class="bb" cx="560" cy="300" r="22" stroke-width="1.5"/>
  <text class="lbl" x="560" y="305" text-anchor="middle">C</text>
  <circle class="bb" cx="720" cy="300" r="22" stroke-width="1.5"/>
  <text class="lbl" x="720" y="305" text-anchor="middle">D</text>
  <line class="lnp" x1="577.87" y1="279.49" x2="635.939" y2="148.836" marker-end="url(#arp)"/>
  <text class="tx" x="617.545" y="221.798" text-anchor="middle" font-weight="700">30</text>
  <line class="lnp" x1="702.13" y1="279.49" x2="644.061" y2="148.836" marker-end="url(#arp)"/>
  <text class="tx" x="662.455" y="221.798" text-anchor="middle" font-weight="700">20</text>
  <text class="lbl okt" x="640" y="360" text-anchor="middle">2 payments</text>
  <text class="sub" x="28" y="396">Greedy gives at most N−1 payments. The true minimum is NP-hard, so this heuristic is the expected answer.</text>
</svg>
