<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 364" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Modulith module extraction</title>
  <desc id="d">Animation in two states. Before: one deployable called pharmacy-app contains intake, fulfilment and claims modules; intake publishes PrescriptionVerified to claims as an in-process event recorded in the event publication registry, and ApplicationModules verify in CI keeps module internals private. After: the claims module has been extracted into its own claims service with its own database, and the same PrescriptionVerified event now travels through a Kafka topic via the Externalized annotation; the intake and fulfilment modules are unchanged.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes ma{0%,49.99%{opacity:1}50%,100%{opacity:0}}.ma{animation-name:ma}
    @keyframes mb{0%,49.99%{opacity:0}50%,100%{opacity:1}}.mb{animation-name:mb}
    .flow{stroke-dasharray:8 8;animation:flow 1.4s infinite linear}
    @keyframes flow{to{stroke-dashoffset:-16}}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.mb{opacity:1}.flow{animation:none}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="362" rx="14"/>
  <text class="h" x="28" y="40">Modular monolith first, extract when a force appears</text><text class="sub" x="28" y="62">Same event contract before and after; only the transport changes.</text><rect class="bp" x="48" y="150" width="140" height="70" rx="8" stroke-width="1.5"/><text class="sm" x="118" y="181" text-anchor="middle">intake</text><text class="sm" x="118" y="199" text-anchor="middle">module</text><rect class="bt" x="208" y="150" width="140" height="70" rx="8" stroke-width="1.5"/><text class="sm" x="278" y="181" text-anchor="middle">fulfilment</text><text class="sm" x="278" y="199" text-anchor="middle">module</text><g class="k ma"><rect class="ln" x="28" y="92" width="500" height="210" rx="12"/><text class="sub" x="278" y="284" text-anchor="middle">pharmacy-app: one deployable, one database (schema per module)</text><rect class="bw" x="368" y="150" width="140" height="70" rx="8" stroke-width="1.5"/><text class="sm" x="438" y="181" text-anchor="middle">claims</text><text class="sm" x="438" y="199" text-anchor="middle">module</text><path class="lnw flow" d="M 118 150 Q 278 106 438 150" marker-end="url(#arw)"/><text class="sm" x="278" y="116" text-anchor="middle">PrescriptionVerified (in process)</text><text class="sm" x="552" y="120">Events delivered in process,</text><text class="sm" x="552" y="139">recorded in the event</text><text class="sm" x="552" y="158">publication registry.</text><text class="sm" x="552" y="177"></text><text class="sm" x="552" y="196">ApplicationModules.verify()</text><text class="sm" x="552" y="215">in CI keeps internals</text><text class="sm" x="552" y="234">private.</text><text class="lbl" x="400" y="340" text-anchor="middle">Before: modules talk only through events and small APIs.</text></g><g class="k mb"><rect class="ln" x="28" y="92" width="340" height="210" rx="12"/><text class="sub" x="198" y="284" text-anchor="middle">pharmacy-app</text><rect class="ln" x="592" y="92" width="180" height="210" rx="12"/><text class="sub" x="682" y="284" text-anchor="middle">claims-service (own DB)</text><rect class="bw" x="612" y="150" width="140" height="70" rx="8" stroke-width="1.5"/><text class="sm" x="682" y="181" text-anchor="middle">claims</text><text class="sm" x="682" y="199" text-anchor="middle">service</text><rect class="bm" x="398" y="162" width="160" height="46" rx="8" stroke-width="1.5"/><text class="sm" x="478" y="190" text-anchor="middle">Kafka topic</text><path class="lnw flow" d="M 118 150 Q 260 96 404 162" marker-end="url(#arw)"/><line class="lnw flow" x1="558" y1="185" x2="608" y2="185" marker-end="url(#arw)"/><text class="sm" x="480" y="236" text-anchor="middle">PrescriptionVerified</text><text class="sub" x="480" y="254" text-anchor="middle">(@Externalized)</text><text class="lbl" x="400" y="340" text-anchor="middle">After: claims extracted for PHI scope; intake and fulfilment unchanged.</text></g>
</svg>
