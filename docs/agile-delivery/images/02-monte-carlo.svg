<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Monte Carlo forecast</title>
  <desc id="d">Animation: a histogram of 10,000 simulated outcomes for finishing 40 remaining items builds up bar by bar. Runs finish in 8 weeks 1.5 percent of the time, 9 weeks 16.1 percent, 10 weeks 38.3 percent, 11 weeks 30.8 percent, 12 weeks 11.1 percent, 13 weeks 2.1 percent and 14 weeks 0.2 percent. Dashed lines then mark the 50th percentile at 10 weeks, the 85th at 11 weeks and the 95th at 12 weeks, and a note recommends committing to 11 weeks.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    .cur{animation:14s infinite linear}
    .gb{transform-box:fill-box;transform-origin:center bottom;animation:14s infinite linear}
    @keyframes g0{0%,4%{transform:scaleY(0)}10%,100%{transform:scaleY(1)}}.g0{animation-name:g0}
    @keyframes v0{0%,9.99%{opacity:0}10%,100%{opacity:1}}.v0{animation-name:v0}
    @keyframes g1{0%,10%{transform:scaleY(0)}16%,100%{transform:scaleY(1)}}.g1{animation-name:g1}
    @keyframes v1{0%,15.99%{opacity:0}16%,100%{opacity:1}}.v1{animation-name:v1}
    @keyframes g2{0%,16%{transform:scaleY(0)}22%,100%{transform:scaleY(1)}}.g2{animation-name:g2}
    @keyframes v2{0%,21.99%{opacity:0}22%,100%{opacity:1}}.v2{animation-name:v2}
    @keyframes g3{0%,22%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}.g3{animation-name:g3}
    @keyframes v3{0%,27.99%{opacity:0}28%,100%{opacity:1}}.v3{animation-name:v3}
    @keyframes g4{0%,28%{transform:scaleY(0)}34%,100%{transform:scaleY(1)}}.g4{animation-name:g4}
    @keyframes v4{0%,33.99%{opacity:0}34%,100%{opacity:1}}.v4{animation-name:v4}
    @keyframes g5{0%,34%{transform:scaleY(0)}40%,100%{transform:scaleY(1)}}.g5{animation-name:g5}
    @keyframes v5{0%,39.99%{opacity:0}40%,100%{opacity:1}}.v5{animation-name:v5}
    @keyframes g6{0%,40%{transform:scaleY(0)}46%,100%{transform:scaleY(1)}}.g6{animation-name:g6}
    @keyframes v6{0%,45.99%{opacity:0}46%,100%{opacity:1}}.v6{animation-name:v6}
    @keyframes p0{0%,51.99%{opacity:0}52%,100%{opacity:1}}.p0{animation-name:p0}
    @keyframes p1{0%,59.99%{opacity:0}60%,100%{opacity:1}}.p1{animation-name:p1}
    @keyframes p2{0%,67.99%{opacity:0}68%,100%{opacity:1}}.p2{animation-name:p2}
    @media (prefers-reduced-motion: reduce){.k,.gb{animation:none}.k{opacity:1}.gb{transform:scaleY(1)}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="402" rx="14"/>
  <text class="h" x="28" y="40">Monte Carlo forecast: 40 items left</text><text class="sub" x="28" y="62">10,000 simulated runs sampling weekly throughput 3, 5, 4, 6, 2, 5, 4, 3. Share of runs per finish week.</text><line class="grid" x1="80" y1="320" x2="640" y2="320"/><text class="sub" x="70" y="324" text-anchor="end">0%</text><line class="grid" x1="80" y1="266" x2="640" y2="266"/><text class="sub" x="70" y="270" text-anchor="end">10%</text><line class="grid" x1="80" y1="212" x2="640" y2="212"/><text class="sub" x="70" y="216" text-anchor="end">20%</text><line class="grid" x1="80" y1="158" x2="640" y2="158"/><text class="sub" x="70" y="162" text-anchor="end">30%</text><line class="grid" x1="80" y1="104" x2="640" y2="104"/><text class="sub" x="70" y="108" text-anchor="end">40%</text><rect class="tea gb g0" x="124" y="311.9" width="52" height="8.1" rx="3"/><g class="k v0"><text class="sm" x="150" y="303.9" text-anchor="middle">1.5%</text></g><text class="sub" x="150" y="342" text-anchor="middle">8 wk</text><rect class="tea gb g1" x="200" y="233.06" width="52" height="86.94" rx="3"/><g class="k v1"><text class="sm" x="226" y="225.06" text-anchor="middle">16.1%</text></g><text class="sub" x="226" y="342" text-anchor="middle">9 wk</text><rect class="tea gb g2" x="276" y="113.18" width="52" height="206.82" rx="3"/><g class="k v2"><text class="sm" x="302" y="105.18" text-anchor="middle">38.3%</text></g><text class="sub" x="302" y="342" text-anchor="middle">10 wk</text><rect class="tea gb g3" x="352" y="153.68" width="52" height="166.32" rx="3"/><g class="k v3"><text class="sm" x="378" y="145.68" text-anchor="middle">30.8%</text></g><text class="sub" x="378" y="342" text-anchor="middle">11 wk</text><rect class="tea gb g4" x="428" y="260.06" width="52" height="59.94" rx="3"/><g class="k v4"><text class="sm" x="454" y="252.06" text-anchor="middle">11.1%</text></g><text class="sub" x="454" y="342" text-anchor="middle">12 wk</text><rect class="tea gb g5" x="504" y="308.66" width="52" height="11.34" rx="3"/><g class="k v5"><text class="sm" x="530" y="300.66" text-anchor="middle">2.1%</text></g><text class="sub" x="530" y="342" text-anchor="middle">13 wk</text><rect class="tea gb g6" x="580" y="318.5" width="52" height="1.5" rx="3"/><g class="k v6"><text class="sm" x="606" y="310.92" text-anchor="middle">0.2%</text></g><text class="sub" x="606" y="342" text-anchor="middle">14 wk</text><line class="ln" x1="80" y1="320" x2="640" y2="320"/><g class="k p0"><line class="lnw dash" x1="332" y1="102" x2="332" y2="320"/><text class="wrnt" x="338" y="100" style="font-size:13px">P50 = 10 weeks</text></g><g class="k p1"><line class="lno dash" x1="408" y1="124" x2="408" y2="320"/><text class="okt" x="414" y="122" style="font-size:13px">P85 = 11 weeks</text></g><g class="k p2"><line class="lnp dash" x1="484" y1="146" x2="484" y2="320"/><text class="prit" x="490" y="144" style="font-size:13px">P95 = 12 weeks</text></g><rect class="bo" x="654" y="160" width="126" height="92" rx="8" stroke-width="1.5"/><text class="sm" x="717" y="184" text-anchor="middle">Commit to</text><text class="sm" x="717" y="202" text-anchor="middle">11 weeks</text><text class="sm" x="717" y="220" text-anchor="middle">(85% of runs</text><text class="sm" x="717" y="238" text-anchor="middle">finish by then)</text><text class="sm" x="28" y="384">"10 weeks" is a coin flip. Quote a percentile and re-run the simulation every week.</text>
</svg>
