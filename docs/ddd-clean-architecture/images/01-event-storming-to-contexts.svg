<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Event storming to contexts</title>
  <desc id="d">Animation in four steps. First, six amber domain events appear on a timeline: prescription received, prescription verified, dispense queued, order shipped, claim submitted and claim adjudicated. Second, a blue command appears above each one. Third, red hot spots appear: who owns refills, and are partial fills billed. Fourth, dashed boundaries group the events into three candidate bounded contexts: Intake, Fulfilment and Claims, split at the pivotal events where work passes to other people. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes p1{0%,96.99%{opacity:1}97%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,23.99%{opacity:0}24%,96.99%{opacity:1}97%,100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%,47.99%{opacity:0}48%,96.99%{opacity:1}97%,100%{opacity:0}}.p3{animation-name:p3}
    @keyframes p4{0%,69.99%{opacity:0}70%,96.99%{opacity:1}97%,100%{opacity:0}}.p4{animation-name:p4}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="370" rx="14"/>
  <text class="h" x="28" y="40">From sticky notes to bounded contexts</text><text class="sub" x="28" y="62">Big-picture event storming for an online pharmacy (illustrative).</text><line class="ln" x1="28" y1="236" x2="772" y2="236" marker-end="url(#ar)"/><text class="sub" x="772" y="254" text-anchor="end">time</text><g class="k p1"><rect class="bw" x="36" y="168" width="104" height="52" rx="4" stroke-width="1.5"/><text class="sm" x="88" y="190" text-anchor="middle">Prescription</text><text class="sm" x="88" y="206" text-anchor="middle">Received</text><rect class="bw" x="162" y="168" width="104" height="52" rx="4" stroke-width="1.5"/><text class="sm" x="214" y="190" text-anchor="middle">Prescription</text><text class="sm" x="214" y="206" text-anchor="middle">Verified</text><rect class="bw" x="288" y="168" width="104" height="52" rx="4" stroke-width="1.5"/><text class="sm" x="340" y="190" text-anchor="middle">Dispense</text><text class="sm" x="340" y="206" text-anchor="middle">Queued</text><rect class="bw" x="414" y="168" width="104" height="52" rx="4" stroke-width="1.5"/><text class="sm" x="466" y="190" text-anchor="middle">Order</text><text class="sm" x="466" y="206" text-anchor="middle">Shipped</text><rect class="bw" x="540" y="168" width="104" height="52" rx="4" stroke-width="1.5"/><text class="sm" x="592" y="190" text-anchor="middle">Claim</text><text class="sm" x="592" y="206" text-anchor="middle">Submitted</text><rect class="bw" x="666" y="168" width="104" height="52" rx="4" stroke-width="1.5"/><text class="sm" x="718" y="190" text-anchor="middle">Claim</text><text class="sm" x="718" y="206" text-anchor="middle">Adjudicated</text></g><g class="k p2"><rect class="bp" x="36" y="112" width="104" height="34" rx="4" stroke-width="1.5"/><text class="sm" x="88" y="134" text-anchor="middle">Submit Rx</text><line class="lnp" x1="88" y1="146" x2="88" y2="166" marker-end="url(#arp)"/><rect class="bp" x="162" y="112" width="104" height="34" rx="4" stroke-width="1.5"/><text class="sm" x="214" y="134" text-anchor="middle">Verify Rx</text><line class="lnp" x1="214" y1="146" x2="214" y2="166" marker-end="url(#arp)"/><rect class="bp" x="288" y="112" width="104" height="34" rx="4" stroke-width="1.5"/><text class="sm" x="340" y="134" text-anchor="middle">Queue fill</text><line class="lnp" x1="340" y1="146" x2="340" y2="166" marker-end="url(#arp)"/><rect class="bp" x="414" y="112" width="104" height="34" rx="4" stroke-width="1.5"/><text class="sm" x="466" y="134" text-anchor="middle">Ship order</text><line class="lnp" x1="466" y1="146" x2="466" y2="166" marker-end="url(#arp)"/><rect class="bp" x="540" y="112" width="104" height="34" rx="4" stroke-width="1.5"/><text class="sm" x="592" y="134" text-anchor="middle">Submit claim</text><line class="lnp" x1="592" y1="146" x2="592" y2="166" marker-end="url(#arp)"/><rect class="bp" x="666" y="112" width="104" height="34" rx="4" stroke-width="1.5"/><text class="sm" x="718" y="134" text-anchor="middle">Adjudicate</text><line class="lnp" x1="718" y1="146" x2="718" y2="166" marker-end="url(#arp)"/><text class="sub" x="28" y="100">commands (blue) trigger events (amber)</text></g><g class="k p3"><rect class="bb" x="156" y="250" width="116" height="30" rx="4" stroke-width="1.5"/><text class="sub" x="214" y="270" text-anchor="middle" style="font-size:12px">Who owns refills?</text><rect class="bb" x="534" y="250" width="116" height="30" rx="4" stroke-width="1.5"/><text class="sub" x="592" y="270" text-anchor="middle" style="font-size:12px">Partial fills billed?</text><text class="sub" x="772" y="100" text-anchor="end">hot spots (red): open questions</text></g><g class="k p4"><rect class="lnp dash" x="28" y="156" width="246" height="136" rx="10"/><text class="prit" x="151" y="316" text-anchor="middle" style="font-size:15px">Intake</text><rect class="lnt dash" x="280" y="156" width="246" height="136" rx="10"/><text class="teat" x="403" y="316" text-anchor="middle" style="font-size:15px">Fulfilment</text><rect class="lnw dash" x="532" y="156" width="246" height="136" rx="10"/><text class="wrnt" x="655" y="316" text-anchor="middle" style="font-size:15px">Claims</text><text class="sm" x="28" y="350">Boundaries fall at pivotal events, where the work and the language pass to other people.</text></g>
</svg>
