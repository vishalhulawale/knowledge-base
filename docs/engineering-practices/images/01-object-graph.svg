<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Git object graph</title>
  <desc id="d">HEAD points to the main branch ref, which points to commit 9f3c2a. That commit points to its parent commit 4b1e07 and to a root tree. Each root tree points to a src tree and to the README blob. The README blob is the same object for both commits because it did not change; the src trees point to two different blobs for version 1 and version 2 of Refill.java. Hashes are shortened and illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="404" rx="14"/>
  <text class="h" x="28" y="40">Git stores snapshots as a graph of objects</text><text class="sub" x="28" y="62">Hashes shortened. Unchanged content is shared between commits, not copied.</text><rect class="bm" x="40" y="96" width="120" height="34" rx="8" stroke-width="1.5"/><text class="lbl" x="100" y="118" text-anchor="middle">HEAD</text><rect class="bp" x="40" y="156" width="120" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="100" y="178" text-anchor="middle">refs/heads/main</text><line class="ln" x1="100" y1="130" x2="100" y2="152" marker-end="url(#ar)"/><line class="ln" x1="160" y1="173" x2="196" y2="160" marker-end="url(#ar)"/><rect class="bp" x="200" y="128" width="150" height="58" rx="8" stroke-width="1.5"/><text class="sm" x="275" y="153" text-anchor="middle" font-weight="700">commit 9f3c2a</text><text class="sm" x="275" y="171" text-anchor="middle">"Add refill rule"</text><rect class="bp" x="200" y="278" width="150" height="58" rx="8" stroke-width="1.5"/><text class="sm" x="275" y="303" text-anchor="middle" font-weight="700">commit 4b1e07</text><text class="sm" x="275" y="321" text-anchor="middle">"Initial"</text><line class="ln" x1="275" y1="186" x2="275" y2="274" marker-end="url(#ar)"/><text class="sub" x="283" y="236">parent</text><rect class="bt" x="400" y="108" width="130" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="465" y="130" text-anchor="middle">tree (root)</text><rect class="bt" x="400" y="166" width="130" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="465" y="188" text-anchor="middle">tree src/</text><rect class="bt" x="400" y="266" width="130" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="465" y="288" text-anchor="middle">tree (root)</text><rect class="bt" x="400" y="324" width="130" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="465" y="346" text-anchor="middle">tree src/</text><line class="ln" x1="350" y1="145" x2="396" y2="128" marker-end="url(#ar)"/><line class="ln" x1="350" y1="300" x2="396" y2="286" marker-end="url(#ar)"/><line class="ln" x1="465" y1="142" x2="465" y2="162" marker-end="url(#ar)"/><line class="ln" x1="465" y1="300" x2="465" y2="320" marker-end="url(#ar)"/><rect class="box" x="590" y="160" width="170" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="675" y="182" text-anchor="middle">blob Refill.java v2</text><rect class="tea" x="590" y="222" width="170" height="40" rx="8" stroke-width="1.5"/><text class="on13" x="675" y="247" text-anchor="middle">blob README.md</text><rect class="box" x="590" y="324" width="170" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="675" y="346" text-anchor="middle">blob Refill.java v1</text><line class="ln" x1="530" y1="183" x2="586" y2="177" marker-end="url(#ar)"/><line class="lnt" x1="530" y1="125" x2="586" y2="230" marker-end="url(#art)"/><line class="lnt" x1="530" y1="283" x2="586" y2="254" marker-end="url(#art)"/><line class="ln" x1="530" y1="341" x2="586" y2="341" marker-end="url(#ar)"/><text class="teat" x="675" y="282" text-anchor="middle" style="font-size:13px">shared by both commits</text><text class="sm" x="28" y="386">A branch is a tiny file holding a commit hash. A new commit writes new blobs and trees only for what changed.</text>
</svg>
