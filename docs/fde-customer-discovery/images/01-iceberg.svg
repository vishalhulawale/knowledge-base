  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="400" rx="14"/>
  <text class="h" x="28" y="40">The request is the tip; the problem is underneath</text><text class="sub" x="28" y="62">"We need a chatbot" is a guess at a fix. Discovery finds what sits below the waterline.</text><polygon class="bp" points="230,150 300,92 380,104 440,150" stroke-width="1.5"/><text class="prit" x="335" y="136" text-anchor="middle" style="font-size:14px">"We need a chatbot"</text><line class="lnt dash" x1="28" y1="150" x2="772" y2="150"/><text class="sub" x="772" y="144" text-anchor="end">waterline</text><polygon class="bt" points="230,150 440,150 530,230 490,330 300,350 150,310 110,210" stroke-width="1.5"/><text class="sm" x="330" y="184" text-anchor="middle">Workflow: who does what, in which system</text><text class="sm" x="330" y="214" text-anchor="middle">Pain: volumes, delays, rework, cost</text><text class="sm" x="330" y="244" text-anchor="middle">Workarounds: the side spreadsheet</text><text class="sm" x="330" y="274" text-anchor="middle">Who signs off, and the date that matters</text><rect class="bw" x="560" y="170" width="212" height="166" rx="10" stroke-width="1.5"/><text class="wrnt" x="574" y="194" style="font-size:14px">Hidden constraints</text><text class="sm" x="574" y="222">· PHI / PCI, data residency</text><text class="sm" x="574" y="244">· integration limits</text><text class="sm" x="574" y="266">· security + legal review</text><text class="sm" x="574" y="288">· budget timing</text><text class="sm" x="574" y="310">· jobs that change</text><line class="lnw" x1="522" y1="250" x2="556" y2="250" marker-end="url(#arw)"/><text class="sm" x="28" y="380" font-weight="600">Ask about the past: "Walk me through the last time this happened." Not "Would you use…?"</text>
</svg>
