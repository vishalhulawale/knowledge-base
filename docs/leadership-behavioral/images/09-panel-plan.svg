<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Panel plan: competencies by interviewer</title>
  <desc id="d">Two panel plans for a senior backend loop with four interviewers and six competencies. Left, unplanned: three interviewers each ask a coding question and probe communication, so coding is assessed three times while debugging, system design and ownership are never assessed. Right, planned: each interviewer owns one or two competencies, every competency is covered exactly once, and collaboration is covered by the behavioural slot.</desc>
