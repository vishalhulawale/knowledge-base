<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">x || 25 versus x ?? 25</title>
  <desc id="d">A grid comparing x || 25 and x ?? 25 for seven values of x. For 0, empty string, false and NaN, which are falsy but not nullish, || replaces the value with 25 while ?? keeps it. For null and undefined, both operators give 25. For 10, both keep 10.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:14px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .rl{fill:#334155;font-size:15px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .cell{fill:#ffffff;stroke:#cbd5e1}
    .rep{fill:#d97706}.rept{fill:#fff;font-size:15px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .keep{fill:#ffffff;stroke:#16a34a;stroke-width:2}.keept{fill:#15803d;font-size:15px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .b1{fill:none;stroke:#dc2626;stroke-width:1.5}.b1t{fill:#dc2626;font-size:13px;font-weight:700}
    .b2{fill:none;stroke:#4f46e5;stroke-width:1.5}.b2t{fill:#4f46e5;font-size:13px;font-weight:700}
    .lg{fill:#334155;font-size:13px}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.mono{fill:#f1f5f9}.rl,.lg{fill:#e2e8f0}.sub{fill:#94a3b8}
      .cell{fill:#111827;stroke:#475569}
      .rep{fill:#fbbf24}.rept{fill:#0f172a}
      .keep{fill:#111827;stroke:#4ade80}.keept{fill:#4ade80}
      .b1{stroke:#f87171}.b1t{fill:#f87171}.b2{stroke:#818cf8}.b2t{fill:#818cf8}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="328" rx="14"/>
  <text class="h" x="28" y="40">x || 25 vs x ?? 25</text>
  <text class="sub" x="28" y="62">|| falls back on any falsy value; ?? falls back only on null and undefined.</text>
  <path class="b1" d="M140 104 V96 H496 V104"/><text class="b1t" x="318.0" y="88" text-anchor="middle">falsy, but often valid data</text>
  <path class="b2" d="M500 104 V96 H676 V104"/><text class="b2t" x="588.0" y="88" text-anchor="middle">nullish</text>
  <text class="rl" x="28" y="137">x</text>
  <text class="rl" x="28" y="191">x || 25</text>
  <text class="rl" x="28" y="245">x ?? 25</text>
  <rect class="cell" x="140" y="112" width="86" height="40" rx="6"/><text class="mono" x="183.0" y="137" text-anchor="middle">0</text><rect class="rep" x="140" y="166" width="86" height="40" rx="6"/><text class="rept" x="183.0" y="191" text-anchor="middle">25</text><rect class="keep" x="140" y="220" width="86" height="40" rx="6"/><text class="keept" x="183.0" y="245" text-anchor="middle">0</text><rect class="cell" x="230" y="112" width="86" height="40" rx="6"/><text class="mono" x="273.0" y="137" text-anchor="middle">""</text><rect class="rep" x="230" y="166" width="86" height="40" rx="6"/><text class="rept" x="273.0" y="191" text-anchor="middle">25</text><rect class="keep" x="230" y="220" width="86" height="40" rx="6"/><text class="keept" x="273.0" y="245" text-anchor="middle">""</text><rect class="cell" x="320" y="112" width="86" height="40" rx="6"/><text class="mono" x="363.0" y="137" text-anchor="middle">false</text><rect class="rep" x="320" y="166" width="86" height="40" rx="6"/><text class="rept" x="363.0" y="191" text-anchor="middle">25</text><rect class="keep" x="320" y="220" width="86" height="40" rx="6"/><text class="keept" x="363.0" y="245" text-anchor="middle">false</text><rect class="cell" x="410" y="112" width="86" height="40" rx="6"/><text class="mono" x="453.0" y="137" text-anchor="middle">NaN</text><rect class="rep" x="410" y="166" width="86" height="40" rx="6"/><text class="rept" x="453.0" y="191" text-anchor="middle">25</text><rect class="keep" x="410" y="220" width="86" height="40" rx="6"/><text class="keept" x="453.0" y="245" text-anchor="middle">NaN</text><rect class="cell" x="500" y="112" width="86" height="40" rx="6"/><text class="mono" x="543.0" y="137" text-anchor="middle">null</text><rect class="rep" x="500" y="166" width="86" height="40" rx="6"/><text class="rept" x="543.0" y="191" text-anchor="middle">25</text><rect class="rep" x="500" y="220" width="86" height="40" rx="6"/><text class="rept" x="543.0" y="245" text-anchor="middle">25</text><rect class="cell" x="590" y="112" width="86" height="40" rx="6"/><text class="mono" x="633.0" y="137" text-anchor="middle">undefined</text><rect class="rep" x="590" y="166" width="86" height="40" rx="6"/><text class="rept" x="633.0" y="191" text-anchor="middle">25</text><rect class="rep" x="590" y="220" width="86" height="40" rx="6"/><text class="rept" x="633.0" y="245" text-anchor="middle">25</text><rect class="cell" x="680" y="112" width="86" height="40" rx="6"/><text class="mono" x="723.0" y="137" text-anchor="middle">10</text><rect class="keep" x="680" y="166" width="86" height="40" rx="6"/><text class="keept" x="723.0" y="191" text-anchor="middle">10</text><rect class="keep" x="680" y="220" width="86" height="40" rx="6"/><text class="keept" x="723.0" y="245" text-anchor="middle">10</text>
  <rect class="rep" x="28" y="284" width="18" height="18" rx="4"/><text class="lg" x="54" y="298">replaced by the default</text>
  <rect class="keep" x="232" y="284" width="18" height="18" rx="4"/><text class="lg" x="258" y="298">original value kept</text>
  <text class="sub" x="420" y="298">Same rule for ||= and ??=.</text>
</svg>
