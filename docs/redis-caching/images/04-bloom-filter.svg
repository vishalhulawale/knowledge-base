  <text class="body" x="408.0" y="213" text-anchor="middle">0</text>
  <text class="sub" x="408.0" y="244" text-anchor="middle" font-size="13">6</text>
  <rect class="pri" x="430" y="190" width="36" height="36" rx="5"/>
  <text class="tlb" x="448.0" y="213" text-anchor="middle">1</text>
  <text class="sub" x="448.0" y="244" text-anchor="middle" font-size="13">7</text>
  <rect class="box" x="470" y="190" width="36" height="36" rx="5"/>
  <text class="body" x="488.0" y="213" text-anchor="middle">0</text>
  <text class="sub" x="488.0" y="244" text-anchor="middle" font-size="13">8</text>
  <rect class="box" x="510" y="190" width="36" height="36" rx="5"/>
  <text class="body" x="528.0" y="213" text-anchor="middle">0</text>
  <text class="sub" x="528.0" y="244" text-anchor="middle" font-size="13">9</text>
  <rect class="box" x="550" y="190" width="36" height="36" rx="5"/>
  <text class="body" x="568.0" y="213" text-anchor="middle">0</text>
  <text class="sub" x="568.0" y="244" text-anchor="middle" font-size="13">10</text>
  <rect class="pri" x="590" y="190" width="36" height="36" rx="5"/>
  <text class="tlb" x="608.0" y="213" text-anchor="middle">1</text>
  <text class="sub" x="608.0" y="244" text-anchor="middle" font-size="13">11</text>
  <rect class="box" x="630" y="190" width="36" height="36" rx="5"/>
  <text class="body" x="648.0" y="213" text-anchor="middle">0</text>
  <text class="sub" x="648.0" y="244" text-anchor="middle" font-size="13">12</text>
  <rect class="pri" x="670" y="190" width="36" height="36" rx="5"/>
  <text class="tlb" x="688.0" y="213" text-anchor="middle">1</text>
  <text class="sub" x="688.0" y="244" text-anchor="middle" font-size="13">13</text>
