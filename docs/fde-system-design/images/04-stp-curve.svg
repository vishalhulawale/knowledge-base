<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 352" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">STP versus error curve</title>
  <desc id="d">A curve of straight-through processing rate against the error rate among auto-approved documents for different confidence thresholds. Loose thresholds give 88 percent STP with 2.4 percent errors; strict ones give 38 percent STP with 0.05 percent errors. The chosen point, threshold 0.93, gives 63 percent STP with 0.2 percent errors, well below the 2.1 percent error rate of manual keying today. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="350" rx="14"/>
  <text class="h" x="28" y="40">Choosing the operating point: STP vs hidden errors</text><text class="sub" x="28" y="62">Each dot is a threshold setting on the golden set. Illustrative numbers; the sponsor picks the point.</text><line class="grid" x1="80" y1="300" x2="700" y2="300"/><text class="sub" x="72" y="304" text-anchor="end">0%</text><line class="grid" x1="80" y1="260" x2="700" y2="260"/><text class="sub" x="72" y="264" text-anchor="end">0.5%</text><line class="grid" x1="80" y1="220" x2="700" y2="220"/><text class="sub" x="72" y="224" text-anchor="end">1%</text><line class="grid" x1="80" y1="180" x2="700" y2="180"/><text class="sub" x="72" y="184" text-anchor="end">1.5%</text><line class="grid" x1="80" y1="140" x2="700" y2="140"/><text class="sub" x="72" y="144" text-anchor="end">2%</text><line class="grid" x1="80" y1="100" x2="700" y2="100"/><text class="sub" x="72" y="104" text-anchor="end">2.5%</text><text class="sub" x="90" y="318" text-anchor="middle">30%</text><text class="sub" x="190" y="318" text-anchor="middle">40%</text><text class="sub" x="290" y="318" text-anchor="middle">50%</text><text class="sub" x="390" y="318" text-anchor="middle">60%</text><text class="sub" x="490" y="318" text-anchor="middle">70%</text><text class="sub" x="590" y="318" text-anchor="middle">80%</text><text class="sub" x="690" y="318" text-anchor="middle">90%</text><text class="sub" x="700" y="336" text-anchor="end">straight-through processing (STP)</text><text class="sub" x="28" y="86">error rate among auto-approved docs</text><path class="lnt" d="M 170 296.0 L 340 290.4 L 420 284.0 L 450 272.0 L 530 236.0 L 590 196.0 L 670 108.0"/><circle class="tea" cx="670" cy="108.0" r="5"/><text class="sub" x="670" y="96" text-anchor="middle">t=0.5</text><circle class="tea" cx="590" cy="196.0" r="5"/><text class="sub" x="590" y="184" text-anchor="middle">t=0.7</text><circle class="tea" cx="530" cy="236.0" r="5"/><text class="sub" x="530" y="224" text-anchor="middle">t=0.8</text><circle class="tea" cx="450" cy="272.0" r="5"/><text class="sub" x="450" y="260" text-anchor="middle">t=0.9</text><circle class="pri" cx="420" cy="284.0" r="8"/><text class="sub" x="420" y="302" text-anchor="middle">t=0.93</text><circle class="tea" cx="340" cy="290.4" r="5"/><text class="sub" x="340" y="278.4" text-anchor="middle">t=0.96</text><circle class="tea" cx="170" cy="296.0" r="5"/><text class="sub" x="170" y="284" text-anchor="middle">t=0.99</text><line class="lnb dash" x1="80" y1="132" x2="700" y2="132"/><text class="badt" x="96" y="126" style="font-size:12px">manual keying today ≈ 2.1%</text><text class="prit" x="150" y="240" style="font-size:13px">chosen: 63% STP, 0.2% errors</text>
</svg>
