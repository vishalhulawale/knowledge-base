<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Incident communication timelines</title>
  <desc id="d">Animation: two timelines over 180 minutes. On the tell-early path, the customer gets a call and first update at minute 5, updates every half hour, mitigation at minute 65 and a postmortem date. On the wait-for-root-cause path, the customer's own team notices at minute 80, escalates angrily at 120 and gets a first explanation at 150. The fix landed at the same time on both. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes r0e0{0%,6.21222%{opacity:0}6.22222%,96.99%{opacity:1}97%,100%{opacity:0}}.r0e0{animation-name:r0e0}
    @keyframes r0e1{0%,19.5456%{opacity:0}19.5556%,96.99%{opacity:1}97%,100%{opacity:0}}.r0e1{animation-name:r0e1}
    @keyframes r0e2{0%,32.8789%{opacity:0}32.8889%,96.99%{opacity:1}97%,100%{opacity:0}}.r0e2{animation-name:r0e2}
    @keyframes r0e3{0%,46.2122%{opacity:0}46.2222%,96.99%{opacity:1}97%,100%{opacity:0}}.r0e3{animation-name:r0e3}
    @keyframes r0e4{0%,81.7678%{opacity:0}81.7778%,96.99%{opacity:1}97%,100%{opacity:0}}.r0e4{animation-name:r0e4}
    @keyframes r1e0{0%,39.5456%{opacity:0}39.5556%,96.99%{opacity:1}97%,100%{opacity:0}}.r1e0{animation-name:r1e0}
    @keyframes r1e1{0%,57.3233%{opacity:0}57.3333%,96.99%{opacity:1}97%,100%{opacity:0}}.r1e1{animation-name:r1e1}
    @keyframes r1e2{0%,70.6567%{opacity:0}70.6667%,96.99%{opacity:1}97%,100%{opacity:0}}.r1e2{animation-name:r1e2}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="348" rx="14"/>
  <text class="h" x="28" y="40">Same incident, two communication paths</text><text class="sub" x="28" y="62">Minutes from detection. Illustrative.</text><line class="grid" x1="60" y1="84" x2="60" y2="262"/><text class="sub" x="60" y="280" text-anchor="middle">0</text><line class="grid" x1="168" y1="84" x2="168" y2="262"/><text class="sub" x="168" y="280" text-anchor="middle">30</text><line class="grid" x1="276" y1="84" x2="276" y2="262"/><text class="sub" x="276" y="280" text-anchor="middle">60</text><line class="grid" x1="384" y1="84" x2="384" y2="262"/><text class="sub" x="384" y="280" text-anchor="middle">90</text><line class="grid" x1="492" y1="84" x2="492" y2="262"/><text class="sub" x="492" y="280" text-anchor="middle">120</text><line class="grid" x1="600" y1="84" x2="600" y2="262"/><text class="sub" x="600" y="280" text-anchor="middle">150</text><line class="grid" x1="708" y1="84" x2="708" y2="262"/><text class="sub" x="708" y="280" text-anchor="middle">180</text><text class="sub" x="708" y="296" text-anchor="end">minutes</text><text class="sm" x="28" y="80" font-weight="700">Tell early, on cadence</text><line class="ln" x1="60" y1="120" x2="708" y2="120"/><g class="k r0e0"><circle class="okf" cx="78.0" cy="120" r="8"/><text class="sub" x="78" y="104" text-anchor="middle">call + first update</text></g><g class="k r0e1"><circle class="okf" cx="186.0" cy="120" r="8"/><text class="sub" x="186" y="146" text-anchor="middle">update</text></g><g class="k r0e2"><circle class="okf" cx="294.0" cy="120" r="8"/><text class="sub" x="294" y="104" text-anchor="middle">mitigated</text></g><g class="k r0e3"><circle class="okf" cx="402.0" cy="120" r="8"/><text class="sub" x="402" y="146" text-anchor="middle">update</text></g><g class="k r0e4"><circle class="okf" cx="690.0" cy="120" r="8"/><text class="sub" x="690" y="104" text-anchor="end">postmortem date set</text></g><text class="sm" x="28" y="170" font-weight="700">Wait for root cause</text><line class="ln" x1="60" y1="210" x2="708" y2="210"/><g class="k r1e0"><circle class="badf" cx="348.0" cy="210" r="8"/><text class="sub" x="348" y="194" text-anchor="middle">customer's team notices</text></g><g class="k r1e1"><circle class="badf" cx="492.0" cy="210" r="8"/><text class="sub" x="492" y="236" text-anchor="middle">angry escalation</text></g><g class="k r1e2"><circle class="wrnf" cx="600.0" cy="210" r="8"/><text class="sub" x="600" y="194" text-anchor="middle">first explanation</text></g><text class="sm" x="28" y="330">The fix landed at the same time on both paths. Only one customer trusts you afterwards.</text>
</svg>
