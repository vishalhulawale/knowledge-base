    @keyframes r30{0%{opacity:0}0%{opacity:0}1%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .r30{animation-name:r30}
    @keyframes t30{0%{opacity:0}11.25%{opacity:0}12.25%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .t30{animation-name:t30}
    @keyframes r3100{0%{opacity:0}45%{opacity:0}46%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .r3100{animation-name:r3100}
    @keyframes t3100{0%{opacity:0}56.25%{opacity:0}57.25%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .t3100{animation-name:t3100}
    @keyframes cur{0%{transform:translate(0px,0px)}90%{transform:translate(640px,0px)}100%{transform:translate(640px,0px)}}
