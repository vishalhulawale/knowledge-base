<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Ports and adapters swap</title>
  <desc id="d">Animation: a hexagon holds the application core, PlaceOrderService and the Order aggregate, with no framework imports. On its left edge is the driving port PlaceOrderUseCase, on its right the driven port OrderRepository. In version A a REST controller calls the driving port and a JPA adapter implements the driven port against PostgreSQL. In version B the REST controller is replaced by a Kafka listener and the JPA adapter by a Mongo adapter. A request token travels left to right in both versions. The core files do not change; only the adapters and wiring differ.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes pa{0%,49.99%{opacity:1}50%,100%{opacity:0}}.pa{animation-name:pa}
    @keyframes pb{0%,49.99%{opacity:0}50%,100%{opacity:1}}.pb{animation-name:pb}
    .ta{animation:ta 14s infinite linear}.tb{animation:tb 14s infinite linear}
    @keyframes ta{0%{transform:translateX(0);opacity:1}40%{transform:translateX(574px);opacity:1}41%,100%{opacity:0;transform:translateX(574px)}}
    @keyframes tb{0%,49.99%{opacity:0;transform:translateX(0)}50%{opacity:1;transform:translateX(0)}90%{transform:translateX(574px);opacity:1}91%,100%{opacity:0;transform:translateX(574px)}}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.pa{opacity:1}.ta,.tb{animation:none;opacity:0}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="394" rx="14"/>
  <text class="h" x="28" y="40">Swap the adapters, keep the core</text><text class="sub" x="28" y="62">Same use case and domain, two different sets of adapters.</text><polygon class="bm" points="270,200 330,96 470,96 530,200 470,304 330,304" stroke-width="2"/><text class="h2" x="400" y="132" text-anchor="middle">Application core</text><text class="sm" x="400" y="152" text-anchor="middle">PlaceOrderService</text><text class="sm" x="400" y="248" text-anchor="middle">Order aggregate, Money</text><text class="sub" x="400" y="268" text-anchor="middle">no framework imports</text><rect class="bp" x="204" y="182" width="132" height="36" rx="8" stroke-width="1.5"/><text class="sm" x="270" y="205" text-anchor="middle">PlaceOrderUseCase</text><rect class="bt" x="464" y="182" width="132" height="36" rx="8" stroke-width="1.5"/><text class="sm" x="530" y="205" text-anchor="middle">OrderRepository</text><text class="prit" x="270" y="236" text-anchor="middle" style="font-size:12px">driving port</text><text class="teat" x="530" y="236" text-anchor="middle" style="font-size:12px">driven port</text><line class="lnp" x1="196" y1="200" x2="202" y2="200" marker-end="url(#arp)"/><line class="lnt" x1="604" y1="200" x2="598" y2="200" marker-end="url(#art)"/><g class="k pa"><rect class="box" x="28" y="170" width="168" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="112" y="196" text-anchor="middle">REST controller</text><text class="sm" x="112" y="214" text-anchor="middle">POST /orders/{id}</text><rect class="box" x="604" y="170" width="168" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="688" y="196" text-anchor="middle">JPA adapter</text><text class="sm" x="688" y="214" text-anchor="middle">→ PostgreSQL</text><text class="lbl" x="400" y="340" text-anchor="middle">Version A: HTTP in, relational database out</text></g><g class="k pb"><rect class="box" x="28" y="170" width="168" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="112" y="196" text-anchor="middle">Kafka listener</text><text class="sm" x="112" y="214" text-anchor="middle">cart-checked-out</text><rect class="box" x="604" y="170" width="168" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="688" y="196" text-anchor="middle">Mongo adapter</text><text class="sm" x="688" y="214" text-anchor="middle">→ MongoDB</text><text class="lbl" x="400" y="340" text-anchor="middle">Version B: events in, document store out</text></g><g class="ta"><circle class="wrnf" cx="112" cy="200" r="8"/></g><g class="tb"><circle class="wrnf" cx="112" cy="200" r="8"/></g><text class="sm" x="28" y="376">Core files changed between A and B: 0. Only adapters and wiring differ.</text>
</svg>
