<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Log versus queue</title>
  <desc id="d">Animation: on the left, a queue holds messages m1, m2 and m3; a worker acks each in turn and each is deleted, so when a new reader B arrives there is nothing left. On the right, a log keeps m1 to m3 at offsets 0 to 2 with seven days of retention; group A's offset advances to the end, then group B joins late and replays from offset 0.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:16s infinite linear}
    @keyframes q0{0%,14.2757%{opacity:1}14.2857%,100%{opacity:0}}.q0{animation-name:q0}
    @keyframes q1{0%,28.5614%{opacity:1}28.5714%,100%{opacity:0}}.q1{animation-name:q1}
    @keyframes q2{0%,42.8471%{opacity:1}42.8571%,100%{opacity:0}}.q2{animation-name:q2}
    @keyframes qa0{0%,14.2757%{opacity:0}14.2857%,28.5614%{opacity:1}28.5714%,100%{opacity:0}}.qa0{animation-name:qa0}
    @keyframes qa1{0%,28.5614%{opacity:0}28.5714%,42.8471%{opacity:1}42.8571%,100%{opacity:0}}.qa1{animation-name:qa1}
    @keyframes qa2{0%,42.8471%{opacity:0}42.8571%,57.1329%{opacity:1}57.1429%,100%{opacity:0}}.qa2{animation-name:qa2}
    @keyframes qe{0%,57.1329%{opacity:0}57.1429%,100%{opacity:1}}.qe{animation-name:qe}
    @keyframes a0{0%,14.2757%{opacity:1}14.2857%,100%{opacity:0}}.a0{animation-name:a0}
    @keyframes a1{0%,14.2757%{opacity:0}14.2857%,28.5614%{opacity:1}28.5714%,100%{opacity:0}}.a1{animation-name:a1}
    @keyframes a2{0%,28.5614%{opacity:0}28.5714%,42.8471%{opacity:1}42.8571%,100%{opacity:0}}.a2{animation-name:a2}
    @keyframes a3{0%,42.8471%{opacity:0}42.8571%,100%{opacity:1}}.a3{animation-name:a3}
    @keyframes b0{0%,57.1329%{opacity:0}57.1429%,71.4186%{opacity:1}71.4286%,100%{opacity:0}}.b0{animation-name:b0}
    @keyframes b1{0%,71.4186%{opacity:0}71.4286%,85.7043%{opacity:1}85.7143%,100%{opacity:0}}.b1{animation-name:b1}
    @keyframes b2{0%,85.7043%{opacity:0}85.7143%,100%{opacity:1}}.b2{animation-name:b2}
    @keyframes bj{0%,57.1329%{opacity:0}57.1429%,100%{opacity:1}}.bj{animation-name:bj}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.qe,.qa2,.a3,.b1,.bj{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="390" rx="14"/>
  <text class="h" x="28" y="40">Queue deletes on ack. Log keeps the data.</text><text class="sub" x="28" y="62">Same three messages, two models. A late reader only has something to read in the log.</text><rect class="bm" x="20" y="80" width="370" height="260" rx="10"/><rect class="bm" x="410" y="80" width="370" height="260" rx="10"/><text class="h2" x="36" y="106">Queue (RabbitMQ, SQS)</text><text class="h2" x="426" y="106">Log (Kafka)</text><rect class="box" x="50" y="130" width="70" height="40" rx="6" stroke-dasharray="4 4"/><g class="k q0"><rect class="pri" x="50" y="130" width="70" height="40" rx="6"/><text class="on" x="85" y="155" text-anchor="middle">m1</text></g><rect class="box" x="130" y="130" width="70" height="40" rx="6" stroke-dasharray="4 4"/><g class="k q1"><rect class="pri" x="130" y="130" width="70" height="40" rx="6"/><text class="on" x="165" y="155" text-anchor="middle">m2</text></g><rect class="box" x="210" y="130" width="70" height="40" rx="6" stroke-dasharray="4 4"/><g class="k q2"><rect class="pri" x="210" y="130" width="70" height="40" rx="6"/><text class="on" x="245" y="155" text-anchor="middle">m3</text></g><rect class="box" x="110" y="214" width="170" height="44" rx="8" stroke-width="1.5"/><text class="sm" x="195" y="241" text-anchor="middle">Worker (group A)</text><line class="ln" x1="195" y1="172" x2="195" y2="212" marker-end="url(#ar)"/><g class="k qa0"><text class="okt" x="205" y="196" style="font-size:12px">ack m1 → deleted</text></g><g class="k qa1"><text class="okt" x="205" y="196" style="font-size:12px">ack m2 → deleted</text></g><g class="k qa2"><text class="okt" x="205" y="196" style="font-size:12px">ack m3 → deleted</text></g><g class="k qe"><rect class="bb" x="110" y="278" width="170" height="44" rx="8" stroke-width="1.5"/><text class="sm" x="195" y="296.5" text-anchor="middle">New reader B:</text><text class="sm" x="195" y="313.5" text-anchor="middle">nothing left</text></g><rect class="tea" x="440" y="130" width="70" height="40" rx="6"/><text class="on" x="475" y="155" text-anchor="middle">m1</text><text class="sub" x="475" y="186" text-anchor="middle">offset 0</text><rect class="tea" x="520" y="130" width="70" height="40" rx="6"/><text class="on" x="555" y="155" text-anchor="middle">m2</text><text class="sub" x="555" y="186" text-anchor="middle">offset 1</text><rect class="tea" x="600" y="130" width="70" height="40" rx="6"/><text class="on" x="635" y="155" text-anchor="middle">m3</text><text class="sub" x="635" y="186" text-anchor="middle">offset 2</text><text class="teat" x="680" y="155" style="font-size:13px">retained</text><text class="teat" x="680" y="171" style="font-size:13px">7 days</text><text class="sm" x="426" y="232" font-weight="700">Group A</text><text class="sm" x="426" y="292" font-weight="700">Group B</text><g class="k a0"><path class="lnp" d="M 475 216 L 475 196" marker-end="url(#arp)"/><text class="prit" x="475" y="232" text-anchor="middle" style="font-size:12px">offset 0</text></g><g class="k a1"><path class="lnp" d="M 555 216 L 555 196" marker-end="url(#arp)"/><text class="prit" x="555" y="232" text-anchor="middle" style="font-size:12px">offset 1</text></g><g class="k a2"><path class="lnp" d="M 635 216 L 635 196" marker-end="url(#arp)"/><text class="prit" x="635" y="232" text-anchor="middle" style="font-size:12px">offset 2</text></g><g class="k a3"><path class="lnp" d="M 715 216 L 715 196" marker-end="url(#arp)"/><text class="prit" x="715" y="232" text-anchor="middle" style="font-size:12px">offset 3 (end)</text></g><g class="k b0"><path class="lnw" d="M 475 276 L 475 196" marker-end="url(#arw)"/><text class="wrnt" x="475" y="292" text-anchor="middle" style="font-size:12px">replay 0</text></g><g class="k b1"><path class="lnw" d="M 555 276 L 555 196" marker-end="url(#arw)"/><text class="wrnt" x="555" y="292" text-anchor="middle" style="font-size:12px">replay 1</text></g><g class="k b2"><path class="lnw" d="M 635 276 L 635 196" marker-end="url(#arw)"/><text class="wrnt" x="635" y="292" text-anchor="middle" style="font-size:12px">replay 2</text></g><g class="k bj"><text class="wrnt" x="426" y="322" style="font-size:13px">B joins late and reads from offset 0</text></g><text class="sm" x="28" y="372">Queues need one copy per consumer (SNS → SQS, fanout exchange). A log serves every group from one copy.</text>
</svg>
