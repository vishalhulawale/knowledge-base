<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Who attaches the credential decides the CSRF risk</title>
  <desc id="d">A page on evil.example makes the victim's browser send a forged POST /transfer. In the top lane the credential is a session cookie: the browser attaches JSESSIONID automatically, so the request reaches bank.example looking legitimate, and only a CSRF token check, answered with 403, can stop it. In the bottom lane the credential is a bearer token kept in the JavaScript memory of app.example: evil.example cannot read it, so the forged request arrives without an Authorization header and the API answers 401.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:19px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .t{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .evil{fill:#ffffff;stroke:#dc2626;stroke-width:2}
    .evt{fill:#dc2626;font-size:15px;font-weight:700}
    .code{fill:#334155;font-size:13px;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
    .env{fill:#4f46e5}.on{fill:#fff;font-size:13px;font-weight:700}
    .ck{fill:#d97706}
    .tok{fill:#0ea5a4}
    .lane{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 4}
    .bad{fill:#dc2626;font-size:13px;font-weight:700}
    .ok{fill:#16a34a;font-size:13px;font-weight:700}
    .badb{fill:#dc2626}.okb{fill:#16a34a}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.t,.code{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}.evil{fill:#111827;stroke:#f87171}.evt{fill:#f87171}
      .env{fill:#818cf8}.on{fill:#0f172a}.ck{fill:#fbbf24}.tok{fill:#2dd4bf}
      .lane{stroke:#475569}.bad{fill:#f87171}.ok{fill:#4ade80}.badb{fill:#f87171}.okb{fill:#4ade80}
    }
    /* 10 s loop: forged request in the cookie lane, then in the header lane */
    .m1{animation:m1 10s infinite linear;opacity:0}
    .m2{animation:m2 10s infinite linear;opacity:0}
    @keyframes m1{0%,3%{transform:translateX(0);opacity:0}5%{transform:translateX(0);opacity:1}38%,92%{transform:translateX(290px);opacity:1}96%,100%{transform:translateX(290px);opacity:0}}
    @keyframes m2{0%,46%{transform:translateX(0);opacity:0}48%{transform:translateX(0);opacity:1}80%,92%{transform:translateX(290px);opacity:1}96%,100%{transform:translateX(290px);opacity:0}}
    .ckA{animation:ckA 10s infinite linear;opacity:0}
    @keyframes ckA{0%,19%{opacity:0}22%,100%{opacity:1}}
    .a{opacity:0;animation:10s infinite linear}
    @keyframes s1{0%,38%{opacity:0}40%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes s2{0%,80%{opacity:0}82%,92%{opacity:1}96%,100%{opacity:0}}
    .k1{animation-name:s1}.k2{animation-name:s2}
    @media (prefers-reduced-motion: reduce){
      .m1,.m2{animation:none;opacity:1;transform:translateX(290px)}
      .ckA{animation:none;opacity:1}
      .a{animation:none;opacity:1}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="408" rx="14"/>
  <text class="h" x="28" y="38">Same forged request, different credential transport</text>

  <!-- attacker page -->
  <rect class="evil" x="24" y="66" width="164" height="282" rx="10"/>
  <text class="evt" x="106" y="92" text-anchor="middle">evil.example</text>
  <text class="sub" x="106" y="112" text-anchor="middle">hidden form,</text>
  <text class="sub" x="106" y="129" text-anchor="middle">auto-submitted</text>
  <text class="sub" x="106" y="300" text-anchor="middle">cannot read your</text>
  <text class="sub" x="106" y="317" text-anchor="middle">cookies or tokens</text>

  <!-- lane separators -->
  <line class="lane" x1="200" y1="214" x2="776" y2="214"/>

  <!-- lane 1: cookie -->
  <text class="lbl" x="214" y="78">Credential = session cookie</text>
  <rect class="box" x="290" y="92" width="200" height="40" rx="8"/>
  <text class="sub" x="300" y="108">browser cookie jar</text>
  <text class="code" x="300" y="125">JSESSIONID=abc</text>
  <rect class="box" x="582" y="92" width="190" height="40" rx="8"/>
  <text class="lbl" x="677" y="117" text-anchor="middle">bank.example</text>
  <g class="a k1">
    <rect class="badb" x="582" y="140" width="190" height="26" rx="7"/>
    <text class="on" x="677" y="158" text-anchor="middle">arrives authenticated</text>
    <text class="bad" x="582" y="184">only a CSRF token check</text>
    <text class="bad" x="582" y="200">stops it (403)</text>
  </g>

  <!-- lane 2: bearer header -->
  <text class="lbl" x="214" y="236">Credential = Bearer header set by your JS</text>
  <rect class="box" x="290" y="246" width="200" height="40" rx="8"/>
  <text class="sub" x="300" y="262">app.example JS memory</text>
  <rect class="tok" x="300" y="268" width="96" height="14" rx="4"/>
  <text class="sub" x="404" y="280">token</text>
  <rect class="box" x="582" y="246" width="190" height="40" rx="8"/>
  <text class="lbl" x="677" y="271" text-anchor="middle">api.example</text>
  <g class="a k2">
    <rect class="okb" x="582" y="294" width="190" height="26" rx="7"/>
    <text class="on" x="677" y="312" text-anchor="middle">no credential: 401</text>
    <text class="ok" x="582" y="340">nothing for CSRF to abuse</text>
  </g>

  <!-- moving forged requests: start at x=196 -->
  <g class="m1">
    <rect class="env" x="196" y="150" width="62" height="28" rx="7"/>
    <text class="on" x="227" y="169" text-anchor="middle">POST</text>
    <g class="ckA">
      <rect class="ck" x="262" y="152" width="22" height="24" rx="5"/>
      <circle cx="270" cy="160" r="2.2" fill="#fff"/><circle cx="276" cy="168" r="2.2" fill="#fff"/>
    </g>
  </g>
  <g class="m2">
    <rect class="env" x="196" y="304" width="62" height="28" rx="7"/>
    <text class="on" x="227" y="323" text-anchor="middle">POST</text>
  </g>

  <text class="sub" x="28" y="374">The browser adds cookies to every request for their site, whoever triggered it.</text>
  <text class="sub" x="28" y="392">A header only exists if your own code adds it. (Amber chip = cookie attached by the browser.)</text>
</svg>
