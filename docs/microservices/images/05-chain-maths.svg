3" height="13" rx="2" opacity="0.55"/><rect class="tea" x="130" y="377" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="147" y="377" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="164" y="377" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="181" y="377" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="28" y="394" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="45" y="394" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="62" y="394" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="79" y="394" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="96" y="394" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="113" y="394" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="130" y="394" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="147" y="394" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="164" y="394" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="181" y="394" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="28" y="411" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="45" y="411" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="62" y="411" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="79" y="411" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="96" y="411" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="113" y="411" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="130" y="411" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="147" y="411" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="164" y="411" width="13" height="13" rx="2" opacity="0.55"/><rect class="tea" x="181" y="411" width="13" height="13" rx="2" opacity="0.55"/>
  <text class="tx" x="232" y="280">Share of requests that wait for at least one slow call:</text>
  <rect class="box" x="232" y="294" width="380" height="30" rx="6" stroke-width="1.5"/>
  <rect class="badf" x="232" y="294" width="241" height="30" rx="6"/>
  <text class="on" x="240" y="315">1 − 0.99¹⁰⁰ ≈ 63%</text>
  <text class="tx" x="232" y="352">Most users see the slow tail, even though 99% of individual calls are fast.</text>
  <text class="sub" x="232" y="374">Parallel calls cost the slowest one; serial calls add up.</text>
  <text class="sub" x="28" y="448">Availability numbers assume independent failures and a 30-day month.</text>
</svg>
