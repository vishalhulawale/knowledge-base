<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">State machine: legal moves only</title>
  <desc id="d">A prescription moves through states RECEIVED, VERIFIED and FILLED. Then a caller asks to cancel it. There is no edge from FILLED to CANCELLED, so the transition is rejected and the state stays FILLED; in the database the conditional update matches zero rows. Finally it moves along the legal edge from FILLED to SHIPPED.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:16s infinite linear}
    @keyframes stRECEIVED{0%{opacity:0}1%{opacity:0}2%,20%{opacity:1}21%{opacity:0}100%{opacity:0}}
    .stRECEIVED{animation-name:stRECEIVED}
    @keyframes stVERIFIED{0%{opacity:0}20%{opacity:0}21%,40%{opacity:1}41%{opacity:0}100%{opacity:0}}
    .stVERIFIED{animation-name:stVERIFIED}
    @keyframes stFILLED{0%{opacity:0}40%{opacity:0}41%,80%{opacity:1}81%{opacity:0}100%{opacity:0}}
    .stFILLED{animation-name:stFILLED}
    @keyframes stSHIPPED{0%{opacity:0}80%{opacity:0}81%,98%{opacity:1}99%{opacity:0}100%{opacity:0}}
    .stSHIPPED{animation-name:stSHIPPED}
    @keyframes bad{0%{opacity:0}54%{opacity:0}55%,78%{opacity:1}79%{opacity:0}100%{opacity:0}}
    .bad{animation-name:bad}
    @keyframes lg0{0%{opacity:0}20%{opacity:0}21%,98%{opacity:1}99%{opacity:0}100%{opacity:0}}
    .lg0{animation-name:lg0}
    @keyframes lg1{0%{opacity:0}40%{opacity:0}41%,98%{opacity:1}99%{opacity:0}100%{opacity:0}}
    .lg1{animation-name:lg1}
    @keyframes lg2{0%{opacity:0}54%{opacity:0}55%,98%{opacity:1}99%{opacity:0}100%{opacity:0}}
    .lg2{animation-name:lg2}
    @keyframes lg3{0%{opacity:0}80%{opacity:0}81%,98%{opacity:1}99%{opacity:0}100%{opacity:0}}
    .lg3{animation-name:lg3}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .stRECEIVED,.stVERIFIED,.stSHIPPED{opacity:0!important}
    }
  </style>
  <defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">A prescription&#x27;s lifecycle, one step at a time</text>
  <text class="sub" x="28" y="62">Any transition not drawn is illegal. The state machine, not the caller, decides.</text>
  <rect class="box" x="28" y="110" width="144" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="100" y="137" text-anchor="middle" font-weight="700">RECEIVED</text>
  <rect class="box" x="228" y="110" width="144" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="300" y="137" text-anchor="middle" font-weight="700">VERIFIED</text>
  <rect class="box" x="428" y="110" width="144" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="500" y="137" text-anchor="middle" font-weight="700">FILLED</text>
  <rect class="box" x="628" y="110" width="144" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="700" y="137" text-anchor="middle" font-weight="700">SHIPPED</text>
  <rect class="box" x="28" y="230" width="144" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="100" y="257" text-anchor="middle" font-weight="700">REJECTED</text>
  <rect class="box" x="228" y="230" width="144" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="300" y="257" text-anchor="middle" font-weight="700">ON_HOLD</text>
  <rect class="box" x="428" y="230" width="144" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="500" y="257" text-anchor="middle" font-weight="700">CANCELLED</text>
  <rect class="box" x="628" y="230" width="144" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="700" y="257" text-anchor="middle" font-weight="700">PICKED_UP</text>
  <line class="ln" x1="172" y1="132" x2="224" y2="132" marker-end="url(#ar)"/>
  <line class="ln" x1="372" y1="132" x2="424" y2="132" marker-end="url(#ar)"/>
  <line class="ln" x1="572" y1="132" x2="624" y2="132" marker-end="url(#ar)"/>
  <line class="ln" x1="100" y1="154" x2="100" y2="226" marker-end="url(#ar)"/>
  <line class="ln" x1="300" y1="154" x2="300" y2="226" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <line class="ln" x1="372" y1="252" x2="424" y2="252" marker-end="url(#ar)"/>
  <line class="ln" x1="500" y1="154" x2="700" y2="226" marker-end="url(#ar)"/>
  <g class="a stRECEIVED">
  <rect class="pri" x="28" y="110" width="144" height="44" rx="10"/>
  <text class="on" x="100" y="136.5" text-anchor="middle">RECEIVED</text>
  </g>
  <g class="a stVERIFIED">
  <rect class="pri" x="228" y="110" width="144" height="44" rx="10"/>
  <text class="on" x="300" y="136.5" text-anchor="middle">VERIFIED</text>
  </g>
  <g class="a stFILLED">
  <rect class="pri" x="428" y="110" width="144" height="44" rx="10"/>
  <text class="on" x="500" y="136.5" text-anchor="middle">FILLED</text>
  </g>
  <g class="a stSHIPPED">
  <rect class="pri" x="628" y="110" width="144" height="44" rx="10"/>
  <text class="on" x="700" y="136.5" text-anchor="middle">SHIPPED</text>
  </g>
  <g class="a bad">
  <path class="lnb dash" d="M 500 154 Q 520 200 500 226" marker-end="url(#arb)"/>
  <text class="lbl badt" x="520" y="196">✕</text>
  </g>
  <text class="tx okt a lg0" x="28" y="316">verify()</text>
  <text class="tx okt a lg1" x="28" y="336">fill()</text>
  <text class="tx badt a lg2" x="28" y="356">cancel()  → rejected: no edge</text>
  <text class="tx okt a lg3" x="28" y="376">ship()</text>
  <text class="sm" x="420" y="316">In SQL, the guard is the WHERE clause:</text>
  <text class="sm prit" x="420" y="336">UPDATE rx SET state=&#x27;CANCELLED&#x27;</text>
  <text class="sm prit" x="420" y="352">WHERE id=? AND state IN (&#x27;ON_HOLD&#x27;)</text>
  <text class="sm badt" x="420" y="368">→ 0 rows updated: reject</text>
  <text class="sub" x="28" y="404">Encode the table once (enum transitions or State classes) instead of scattering status ifs.</text>
</svg>
