<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Expand and contract: amount → amountMinor</title>
  <desc id="d">Changing a money field from dollars to cents without a new API version. Expand: the response gains amountMinor 1999 next to the old amount 19.99, and old clients keep reading amount. Migrate: clients move to amountMinor one by one while usage of amount is measured. Contract: once no client reads amount, it is removed. At no point does an existing client break.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:16s infinite linear}
    @keyframes p0{0%,24%{opacity:1}25%{opacity:0}100%{opacity:0}}
    .p0{animation-name:p0}
    @keyframes p1{0%{opacity:0}24%{opacity:0}25%,49%{opacity:1}50%{opacity:0}100%{opacity:0}}
    .p1{animation-name:p1}
    @keyframes p2{0%{opacity:0}49%{opacity:0}50%,74%{opacity:1}75%{opacity:0}100%{opacity:0}}
    .p2{animation-name:p2}
    @keyframes p3{0%{opacity:0}74%{opacity:0}75%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p3{animation-name:p3}
    @keyframes dep{0%{opacity:0}49%{opacity:0}50%,74%{opacity:1}75%{opacity:0}100%{opacity:0}}
    .dep{animation-name:dep}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .p0,.p1,.p3{opacity:0!important}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">Changing units without a v2</text>
  <text class="sub" x="28" y="62">Additive first; remove only when the old field has zero readers.</text>
  <rect class="box" x="28" y="96" width="340" height="150" rx="10" stroke-width="1.5"/>
  <text class="sm" x="44" y="120">GET /claims/7 → response</text>
  <text class="lbl a p0" x="44" y="150">&quot;amount&quot;: 19.99</text>
  <text class="lbl a p1" x="44" y="150">&quot;amount&quot;: 19.99</text>
  <text class="lbl wrnt a p2" x="44" y="150">&quot;amount&quot;: 19.99</text>
  <text class="lbl teat a p1" x="44" y="180">&quot;amountMinor&quot;: 1999</text>
  <text class="lbl teat a p2" x="44" y="180">&quot;amountMinor&quot;: 1999</text>
  <text class="lbl teat a p3" x="44" y="150">&quot;amountMinor&quot;: 1999</text>
  <text class="sm wrnt a dep" x="44" y="220">amount marked deprecated</text>
  <text class="lbl" x="420" y="104">Clients reading amount</text>
  <text class="tx" x="420" y="136">web</text>
  <g class="a p0">
  <rect class="pri" x="540" y="118" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="135.5" text-anchor="middle">amount</text>
  </g>
  <g class="a p1">
  <rect class="pri" x="540" y="118" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="135.5" text-anchor="middle">amount</text>
  </g>
  <g class="a p2">
  <rect class="tea" x="540" y="118" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="135.5" text-anchor="middle">amountMinor ✓</text>
  </g>
  <g class="a p3">
  <rect class="tea" x="540" y="118" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="135.5" text-anchor="middle">amountMinor ✓</text>
  </g>
  <text class="tx" x="420" y="170">mobile</text>
  <g class="a p0">
  <rect class="pri" x="540" y="152" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="169.5" text-anchor="middle">amount</text>
  </g>
  <g class="a p1">
  <rect class="pri" x="540" y="152" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="169.5" text-anchor="middle">amount</text>
  </g>
  <g class="a p2">
  <rect class="tea" x="540" y="152" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="169.5" text-anchor="middle">amountMinor ✓</text>
  </g>
  <g class="a p3">
  <rect class="tea" x="540" y="152" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="169.5" text-anchor="middle">amountMinor ✓</text>
  </g>
  <text class="tx" x="420" y="204">partner A</text>
  <g class="a p0">
  <rect class="pri" x="540" y="186" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="203.5" text-anchor="middle">amount</text>
  </g>
  <g class="a p1">
  <rect class="pri" x="540" y="186" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="203.5" text-anchor="middle">amount</text>
  </g>
  <g class="a p2">
  <rect class="tea" x="540" y="186" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="203.5" text-anchor="middle">amountMinor ✓</text>
  </g>
  <g class="a p3">
  <rect class="tea" x="540" y="186" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="203.5" text-anchor="middle">amountMinor ✓</text>
  </g>
  <text class="tx" x="420" y="238">partner B</text>
  <g class="a p0">
  <rect class="pri" x="540" y="220" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="237.5" text-anchor="middle">amount</text>
  </g>
  <g class="a p1">
  <rect class="pri" x="540" y="220" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="237.5" text-anchor="middle">amount</text>
  </g>
  <g class="a p2">
  <rect class="pri" x="540" y="220" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="237.5" text-anchor="middle">amount</text>
  </g>
  <g class="a p3">
  <rect class="tea" x="540" y="220" width="230" height="26" rx="5"/>
  <text class="on13" x="655" y="237.5" text-anchor="middle">amountMinor ✓</text>
  </g>
  <text class="lbl a p0" x="28" y="296">1  Before: only amount (dollars)</text>
  <text class="lbl a p1" x="28" y="296">2  Expand: add amountMinor alongside; nothing breaks</text>
  <text class="lbl wrnt a p2" x="28" y="296">3  Migrate: clients switch; measure who still reads amount</text>
  <text class="lbl okt a p3" x="28" y="296">4  Contract: zero readers left, remove amount</text>
  <text class="tx badt" x="28" y="336">Changing amount from dollars to cents in place fails silently: no errors, wrong totals.</text>
  <text class="sub" x="28" y="364">Same pattern as a zero-downtime column rename; contract tests show who still reads the field.</text>
</svg>
