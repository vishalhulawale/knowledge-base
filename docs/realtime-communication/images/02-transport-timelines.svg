<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 444" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Polling, SSE and WebSocket</title>
  <desc id="d">Animation: a playhead sweeps across 30 seconds while the same server events at 4, 11, 12 and 23 seconds reach the client three ways. With long polling the client sends a request, the server holds it until an event, responds, and the client immediately sends another, five requests in total. With Server-Sent Events one GET opens a response that never ends, events arrive down it and a comment line at 20 seconds keeps it alive. With WebSocket one handshake answered with 101 opens a connection that carries server events down, client messages up at 8 and 17 seconds, and a ping at 20 seconds. The timings are illustrative.</desc>
