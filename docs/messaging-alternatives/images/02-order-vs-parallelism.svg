<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Ordering versus parallelism</title>
  <desc id="d">Three panels. Kafka: three partitions holding keys A, B and C, each read by one consumer, with a fourth consumer idle, so order is per partition and parallelism is capped by the partition count. RabbitMQ: two competing workers on one queue can finish A2 before A1; the fix is consistent-hash shard queues, each with a single active consumer. SQS FIFO: message groups A, B and C run in parallel, and when B1 fails only group B is blocked. In all three, order and scale come from partitioning by key.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="430" rx="14"/>
  <text class="h" x="28" y="40">Order and parallelism: partition by key in all three</text><text class="sub" x="28" y="62">Letters are keys (customer IDs); numbers are the order within a key.</text><rect class="bm" x="20" y="78" width="240" height="306" rx="10"/><text class="h2" x="34" y="104">Kafka</text><rect class="bm" x="280" y="78" width="240" height="306" rx="10"/><text class="h2" x="294" y="104">RabbitMQ</text><rect class="bm" x="540" y="78" width="240" height="306" rx="10"/><text class="h2" x="554" y="104">SQS FIFO</text><text class="sm" x="34" y="141" font-weight="700">P0</text><rect class="pri" x="62" y="124" width="34" height="24" rx="5"/><text class="on13" x="79" y="141" text-anchor="middle">A1</text><rect class="pri" x="100" y="124" width="34" height="24" rx="5"/><text class="on13" x="117" y="141" text-anchor="middle">A2</text><line class="ln" x1="142" y1="136" x2="176" y2="136" marker-end="url(#ar)"/><rect class="bt" x="178" y="124" width="68" height="24" rx="5" stroke-width="1.5"/><text class="sm" x="212" y="141" text-anchor="middle">C1</text><text class="sm" x="34" y="187" font-weight="700">P1</text><rect class="pri" x="62" y="170" width="34" height="24" rx="5"/><text class="on13" x="79" y="187" text-anchor="middle">B1</text><rect class="pri" x="100" y="170" width="34" height="24" rx="5"/><text class="on13" x="117" y="187" text-anchor="middle">B2</text><line class="ln" x1="142" y1="182" x2="176" y2="182" marker-end="url(#ar)"/><rect class="bt" x="178" y="170" width="68" height="24" rx="5" stroke-width="1.5"/><text class="sm" x="212" y="187" text-anchor="middle">C2</text><text class="sm" x="34" y="233" font-weight="700">P2</text><rect class="pri" x="62" y="216" width="34" height="24" rx="5"/><text class="on13" x="79" y="233" text-anchor="middle">C1</text><rect class="pri" x="100" y="216" width="34" height="24" rx="5"/><text class="on13" x="117" y="233" text-anchor="middle">C2</text><line class="ln" x1="142" y1="228" x2="176" y2="228" marker-end="url(#ar)"/><rect class="bt" x="178" y="216" width="68" height="24" rx="5" stroke-width="1.5"/><text class="sm" x="212" y="233" text-anchor="middle">C3</text><rect class="box" x="178" y="262" width="68" height="24" rx="5" stroke-width="1.5"/><text class="sub" x="212" y="279" text-anchor="middle">C4 idle</text><text class="sm" x="34" y="318">Order: per partition</text><text class="sm" x="34" y="337">Parallelism ≤ partitions</text><text class="sm" x="34" y="356">(share groups lift it, no order)</text><text class="sm" x="294" y="132" font-weight="700">Competing consumers:</text><rect class="pri" x="294" y="142" width="34" height="24" rx="5"/><text class="on13" x="311" y="159" text-anchor="middle">A1</text><rect class="pri" x="332" y="142" width="34" height="24" rx="5"/><text class="on13" x="349" y="159" text-anchor="middle">A2</text><line class="ln" x1="370" y1="154" x2="400" y2="154" marker-end="url(#ar)"/><rect class="bt" x="402" y="142" width="50" height="24" rx="5" stroke-width="1.5"/><text class="sm" x="427" y="159" text-anchor="middle">W1</text><rect class="bt" x="456" y="142" width="50" height="24" rx="5" stroke-width="1.5"/><text class="sm" x="481" y="159" text-anchor="middle">W2</text><text class="badt" x="294" y="186" style="font-size:13px">A2 can finish before A1</text><text class="sm" x="294" y="216" font-weight="700">Fix: consistent-hash shards</text><rect class="pri" x="294" y="226" width="34" height="24" rx="5"/><text class="on13" x="311" y="243" text-anchor="middle">A1</text><rect class="pri" x="332" y="226" width="34" height="24" rx="5"/><text class="on13" x="349" y="243" text-anchor="middle">A2</text><line class="ln" x1="370" y1="238" x2="400" y2="238" marker-end="url(#ar)"/><rect class="bt" x="402" y="226" width="104" height="24" rx="5" stroke-width="1.5"/><text class="sm" x="454" y="243" text-anchor="middle">shard 0: SAC</text><rect class="pri" x="294" y="254" width="34" height="24" rx="5"/><text class="on13" x="311" y="271" text-anchor="middle">B1</text><rect class="pri" x="332" y="254" width="34" height="24" rx="5"/><text class="on13" x="349" y="271" text-anchor="middle">B2</text><line class="ln" x1="370" y1="266" x2="400" y2="266" marker-end="url(#ar)"/><rect class="bt" x="402" y="254" width="104" height="24" rx="5" stroke-width="1.5"/><text class="sm" x="454" y="271" text-anchor="middle">shard 1: SAC</text><rect class="pri" x="294" y="282" width="34" height="24" rx="5"/><text class="on13" x="311" y="299" text-anchor="middle">C1</text><rect class="pri" x="332" y="282" width="34" height="24" rx="5"/><text class="on13" x="349" y="299" text-anchor="middle">C2</text><line class="ln" x1="370" y1="294" x2="400" y2="294" marker-end="url(#ar)"/><rect class="bt" x="402" y="282" width="104" height="24" rx="5" stroke-width="1.5"/><text class="sm" x="454" y="299" text-anchor="middle">shard 2: SAC</text><text class="sm" x="294" y="337">Order: per shard queue</text><text class="sm" x="294" y="356">Parallelism ≤ shards</text><text class="sm" x="554" y="141" font-weight="700">grp A</text><rect class="pri" x="602" y="124" width="34" height="24" rx="5"/><text class="on13" x="619" y="141" text-anchor="middle">A1</text><rect class="pri" x="640" y="124" width="34" height="24" rx="5"/><text class="on13" x="657" y="141" text-anchor="middle">A2</text><text class="teat" x="682" y="141" style="font-size:12px">in parallel</text><text class="sm" x="554" y="187" font-weight="700">grp B</text><rect class="badf" x="602" y="170" width="34" height="24" rx="5"/><text class="on13" x="619" y="187" text-anchor="middle">B1</text><rect class="mutf" x="640" y="170" width="34" height="24" rx="5"/><text class="on13" x="657" y="187" text-anchor="middle">B2</text><text class="badt" x="682" y="187" style="font-size:12px">blocked</text><text class="sm" x="554" y="233" font-weight="700">grp C</text><rect class="pri" x="602" y="216" width="34" height="24" rx="5"/><text class="on13" x="619" y="233" text-anchor="middle">C1</text><rect class="pri" x="640" y="216" width="34" height="24" rx="5"/><text class="on13" x="657" y="233" text-anchor="middle">C2</text><text class="teat" x="682" y="233" style="font-size:12px">in parallel</text><text class="sm" x="554" y="278">B1 fails: only group B waits</text><text class="sm" x="554" y="297">(retries, then DLQ)</text><text class="sm" x="554" y="337">Order: per message group</text><text class="sm" x="554" y="356">Parallelism ≤ active groups</text><text class="sm" x="28" y="412">Same idea, three names. Hot keys stay serial in every system: pick a key with many values.</text>
</svg>
