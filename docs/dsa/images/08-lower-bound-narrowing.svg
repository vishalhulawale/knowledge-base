  <g class="fr f3"><rect class="card" x="40" y="112" width="60" height="46" rx="8"/><text class="m" x="70" y="142" text-anchor="middle">2</text><rect class="card" x="108" y="112" width="60" height="46" rx="8"/><text class="m" x="138" y="142" text-anchor="middle">5</text><rect class="ok" x="176" y="112" width="60" height="46" rx="8"/><text class="on" x="206" y="142" text-anchor="middle">7</text><rect class="card" x="244" y="112" width="60" height="46" rx="8"/><text class="m" x="274" y="142" text-anchor="middle">7</text><rect class="card" x="312" y="112" width="60" height="46" rx="8"/><text class="m" x="342" y="142" text-anchor="middle">7</text><rect class="card" x="380" y="112" width="60" height="46" rx="8"/><text class="m" x="410" y="142" text-anchor="middle">9</text><rect class="card" x="448" y="112" width="60" height="46" rx="8"/><text class="m" x="478" y="142" text-anchor="middle">12</text><rect class="card" x="516" y="112" width="60" height="46" rx="8"/><text class="m" x="546" y="142" text-anchor="middle">15</text><rect class="card" x="584" y="112" width="60" height="46" rx="8"/><text class="m" x="614" y="142" text-anchor="middle">18</text><rect class="card" x="652" y="112" width="60" height="46" rx="8"/><text class="m" x="682" y="142" text-anchor="middle">21</text><line class="ln sok" stroke-width="2" x1="172" y1="242" x2="172" y2="216"/><path class="ah ok" d="M172.0,208.0 L176.0,216.0 L168.0,216.0 Z"/><text class="tb" x="172" y="260" text-anchor="middle">lo = hi = 2</text><text class="tok" x="40" y="290" font-weight="700">lo == hi: index 2 is the first 7.</text><text class="t" x="40" y="312">3 probes here; at most ⌈log₂ 11⌉ = 4 for 10 elements.</text></g>
