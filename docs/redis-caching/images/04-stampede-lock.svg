<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Cache stampede with and without a lock</title>
  <desc id="d">Animation in two panels. In both, 8 requests (standing for 200) find the hot key expired. Left, naive cache-aside: every request goes to the database, which runs 200 queries; median latency was 1,173 ms. Right, with a lock: one request gets the lock and loads from the database while the others wait and re-read the cache; once the key is filled they all get a hit. The database runs 1 query and median latency was 2 ms.</desc>
