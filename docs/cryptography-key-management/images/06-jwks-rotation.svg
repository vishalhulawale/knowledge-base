<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Signing key rotation through JWKS</title>
  <desc id="d">A timeline for rotating a JWT signing key from k1 to k2. First k2 is published in the JWKS next to k1 but not used. After at least one JWKS cache TTL every resource server knows k2, and the identity provider starts signing with k2. Tokens signed with k1 are still valid until they expire, so k1 stays published for at least the maximum token lifetime plus the cache TTL. Only then is k1 removed. Removing k1 earlier, or signing with k2 before caches know it, makes valid tokens fail verification across every service.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:16s infinite linear}
    @keyframes cur{0%{transform:translate(0px,0px)}90%{transform:translate(610px,0px)}100%{transform:translate(610px,0px)}}
    .cur{animation:cur 16s infinite linear}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .cur{transform:translate(0,0)}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="408" rx="14"/>
  <text class="h" x="28" y="40">Rotating JWT signing key k1 → k2</text>
  <text class="sub" x="28" y="62">Readers learn the new key before writers use it; the old key outlives every token it signed.</text>
  <text class="sm" x="28" y="116">JWKS contains</text>
  <text class="sm" x="28" y="176">IdP signs with</text>
  <text class="sm" x="28" y="216">valid tokens</text>
  <rect class="pri" x="150" y="90" width="425" height="24" rx="5"/>
  <text class="on13" x="362.5" y="106.5" text-anchor="middle">k1</text>
  <rect class="pri" x="150" y="160" width="120" height="26" rx="5"/>
  <text class="on13" x="210" y="177.5" text-anchor="middle">k1</text>
  <rect class="tea" x="272" y="160" width="488" height="26" rx="5"/>
  <text class="on13" x="516" y="177.5" text-anchor="middle">k2</text>
  <rect class="pri" x="150" y="200" width="425" height="26" rx="5"/>
  <text class="on13" x="362.5" y="217.5" text-anchor="middle">k1 tokens (until they expire)</text>
  <rect class="tea" x="272" y="230" width="488" height="26" rx="5"/>
  <text class="on13" x="516" y="247.5" text-anchor="middle">k2 tokens</text>
  <rect class="tea" x="150" y="118" width="610" height="24" rx="5"/>
  <text class="on13" x="455" y="134.5" text-anchor="middle">k2 published in JWKS (from t0)</text>
  <line class="ln dash" x1="150.0" x2="150.0" y1="84" y2="262" style="stroke-width:1"/>
  <text class="sm" x="154" y="280">t0 publish k2</text>
  <line class="ln dash" x1="272.0" x2="272.0" y1="84" y2="262" style="stroke-width:1"/>
  <text class="sm" x="276" y="280">≥ cache TTL: start signing</text>
  <line class="ln dash" x1="577.0" x2="577.0" y1="84" y2="262" style="stroke-width:1"/>
  <text class="sm" x="581" y="280">≥ max token life + TTL: drop k1</text>
  <g class="cur">
  <line x1="150" x2="150" y1="84" y2="262" class="lnw" style="stroke-width:2"/>
  </g>
  <text class="tx badt" x="28" y="322">Wrong order 1: sign with k2 before caches know it → new tokens rejected (unknown kid).</text>
  <text class="tx badt" x="28" y="346">Wrong order 2: drop k1 while k1 tokens are alive → logged-in users get 401s.</text>
  <text class="sub" x="28" y="384">Measured on the page: with both keys published, k1 and k2 tokens both verified; after dropping k1 only k2 did.</text>
</svg>
