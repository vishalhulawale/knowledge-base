<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Private DNS two answers</title>
  <desc id="d">Animation in two rows for a pod resolving bedrock-runtime.eu-central-1.amazonaws.com. When the private zone is not linked or forwarded, the resolver returns a public IP, there is no internet gateway, the firewall drops the traffic and the connection times out so pods crash-loop. With private DNS on the endpoint and the zone linked, the name resolves to a private IP on the endpoint's network interface, the endpoint security group and policy allow the app, and Bedrock responds without NAT or an internet gateway. IP addresses are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes r0s0{0%,4.99%{opacity:0}5%,96.99%{opacity:1}97%,100%{opacity:0}}.r0s0{animation-name:r0s0}
    @keyframes r0s1{0%,22.99%{opacity:0}23%,96.99%{opacity:1}97%,100%{opacity:0}}.r0s1{animation-name:r0s1}
    @keyframes r0s2{0%,40.99%{opacity:0}41%,96.99%{opacity:1}97%,100%{opacity:0}}.r0s2{animation-name:r0s2}
    @keyframes r0s3{0%,58.99%{opacity:0}59%,96.99%{opacity:1}97%,100%{opacity:0}}.r0s3{animation-name:r0s3}
    @keyframes r1s0{0%,4.99%{opacity:0}5%,96.99%{opacity:1}97%,100%{opacity:0}}.r1s0{animation-name:r1s0}
    @keyframes r1s1{0%,22.99%{opacity:0}23%,96.99%{opacity:1}97%,100%{opacity:0}}.r1s1{animation-name:r1s1}
    @keyframes r1s2{0%,40.99%{opacity:0}41%,96.99%{opacity:1}97%,100%{opacity:0}}.r1s2{animation-name:r1s2}
    @keyframes r1s3{0%,58.99%{opacity:0}59%,96.99%{opacity:1}97%,100%{opacity:0}}.r1s3{animation-name:r1s3}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="422" rx="14"/>
  <text class="h" x="28" y="40">Same hostname, two DNS answers</text><text class="sub" x="28" y="62">Whether the private zone is linked decides the whole path. IP addresses are illustrative.</text><text class="sm" x="28" y="92" font-weight="700">Pod resolves</text><text class="mono" x="126" y="92" xml:space="preserve">bedrock-runtime.eu-central-1.amazonaws.com</text><text class="sub" x="28" y="116" font-weight="700">1  DNS lookup</text><text class="sub" x="216" y="116" font-weight="700">2  Answer</text><text class="sub" x="404" y="116" font-weight="700">3  Path</text><text class="sub" x="592" y="116" font-weight="700">4  Result</text><text class="lbl" x="28" y="154">Private zone not linked or forwarded</text><g class="k r0s0"><rect class="box" x="28" y="166" width="172" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="40" y="191" font-weight="700">Resolver only knows</text><text class="sub" x="40" y="211">the public zone</text><line class="ln" x1="202" y1="196" x2="214" y2="196" marker-end="url(#ar)"/></g><g class="k r0s1"><rect class="bw" x="216" y="166" width="172" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="228" y="191" font-weight="700">52.x.x.x</text><text class="sub" x="228" y="211">public IP</text><line class="ln" x1="390" y1="196" x2="402" y2="196" marker-end="url(#ar)"/></g><g class="k r0s2"><rect class="box" x="404" y="166" width="172" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="416" y="191" font-weight="700">No internet gateway;</text><text class="sub" x="416" y="211">firewall drops it</text><line class="ln" x1="578" y1="196" x2="590" y2="196" marker-end="url(#ar)"/></g><g class="k r0s3"><rect class="bb" x="592" y="166" width="172" height="60" rx="8" stroke-width="1.5"/><text class="badt" x="604" y="191">connect timed out</text><text class="badt" x="604" y="211" style="font-weight:400">pods crash-loop</text></g><text class="lbl" x="28" y="278">Private DNS on the endpoint, zone linked</text><g class="k r1s0"><rect class="box" x="28" y="290" width="172" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="40" y="315" font-weight="700">Private zone answers</text><text class="sub" x="40" y="335">inside the VPC</text><line class="ln" x1="202" y1="320" x2="214" y2="320" marker-end="url(#ar)"/></g><g class="k r1s1"><rect class="bt" x="216" y="290" width="172" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="228" y="315" font-weight="700">10.0.12.34</text><text class="sub" x="228" y="335">endpoint ENI</text><line class="ln" x1="390" y1="320" x2="402" y2="320" marker-end="url(#ar)"/></g><g class="k r1s2"><rect class="box" x="404" y="290" width="172" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="416" y="315" font-weight="700">Endpoint SG: app only;</text><text class="sub" x="416" y="335">policy: app role, models</text><line class="ln" x1="578" y1="320" x2="590" y2="320" marker-end="url(#ar)"/></g><g class="k r1s3"><rect class="bo" x="592" y="290" width="172" height="60" rx="8" stroke-width="1.5"/><text class="okt" x="604" y="315">Bedrock responds</text><text class="okt" x="604" y="335" style="font-weight:400">no NAT, no IGW</text></g><text class="sm" x="28" y="384">First debug step: nslookup from inside the pod. A public answer means the private zone isn't linked</text><text class="sm" x="28" y="403">to the VNet/VPC or forwarded from on-prem DNS, so the client never reaches the private endpoint.</text>
</svg>
