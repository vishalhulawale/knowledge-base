  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="370" rx="14"/>
  <text class="h" x="28" y="40">Answer first: the Pyramid Principle</text><text class="sub" x="28" y="62">An executive can stop after the top line and still know the recommendation. Figures illustrative.</text><polygon class="bp" points="250,84 330,154 170,154" stroke-width="1.5"/><text class="prit" x="250" y="140" text-anchor="middle" style="font-size:14px">Answer</text><rect class="pri" x="28" y="164" width="444" height="40" rx="8" stroke-width="1.5"/><text class="on13" x="250" y="189" text-anchor="middle">Recommend: scale the claims assistant to 3 teams in Q1</text><rect class="bt" x="28" y="216" width="144" height="52" rx="8" stroke-width="1.5"/><text class="sm" x="100" y="238" text-anchor="middle" font-weight="700">It works</text><text class="sm" x="100" y="256" text-anchor="middle">31% faster handling</text><rect class="bm" x="28" y="280" width="144" height="40" rx="8" stroke-width="1.5"/><text class="sub" x="100" y="305" text-anchor="middle">data on request</text><rect class="bt" x="178" y="216" width="144" height="52" rx="8" stroke-width="1.5"/><text class="sm" x="250" y="238" text-anchor="middle" font-weight="700">It's safe</text><text class="sm" x="250" y="256" text-anchor="middle">guardrails held</text><rect class="bm" x="178" y="280" width="144" height="40" rx="8" stroke-width="1.5"/><text class="sub" x="250" y="305" text-anchor="middle">data on request</text><rect class="bt" x="328" y="216" width="144" height="52" rx="8" stroke-width="1.5"/><text class="sm" x="400" y="238" text-anchor="middle" font-weight="700">It pays back</text><text class="sm" x="400" y="256" text-anchor="middle">payback ≈ 5 months</text><rect class="bm" x="328" y="280" width="144" height="40" rx="8" stroke-width="1.5"/><text class="sub" x="400" y="305" text-anchor="middle">data on request</text><text class="sm" x="506" y="98" font-weight="700">SCQA framing</text><rect class="bw" x="506" y="110" width="266" height="46" rx="8" stroke-width="1.5"/><text class="wrnt" x="522" y="139" style="font-size:18px">S</text><text class="sm" x="548" y="130" font-weight="700">Situation</text><text class="sub" x="548" y="148">Claims backlog is 9 days</text><rect class="bw" x="506" y="164" width="266" height="46" rx="8" stroke-width="1.5"/><text class="wrnt" x="522" y="193" style="font-size:18px">C</text><text class="sm" x="548" y="184" font-weight="700">Complication</text><text class="sub" x="548" y="202">Hiring can't close the gap</text><rect class="bw" x="506" y="218" width="266" height="46" rx="8" stroke-width="1.5"/><text class="wrnt" x="522" y="247" style="font-size:18px">Q</text><text class="sm" x="548" y="238" font-weight="700">Question</text><text class="sub" x="548" y="256">Scale the assistant?</text><rect class="bp" x="506" y="272" width="266" height="46" rx="8" stroke-width="1.5"/><text class="prit" x="522" y="301" style="font-size:18px">A</text><text class="sm" x="548" y="292" font-weight="700">Answer</text><text class="sub" x="548" y="310">Yes: 3 teams in Q1</text><text class="sm" x="28" y="352">BLUF: bottom line up front. Detail only when someone asks for it.</text>
</svg>
