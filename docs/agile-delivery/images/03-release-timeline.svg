<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 448" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Release timeline and rollout</title>
  <desc id="d">Animation: a cursor moves across a fourteen-day release. The release candidate is built on days 0 to 2, validation and UAT run until day 7, and the go/no-go decision happens on day 7. Rollout runs from day 8: 5 percent of users, then 25 percent on day 9 and 100 percent on day 10, followed by hypercare until day 14. Below, the error rate stays between 0.2 and 0.45 percent, under a dashed SLO threshold of 1 percent, so no rollback is needed. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    .cur{animation:14s infinite linear}
    @keyframes cur{0%,4%{transform:translateX(0)}82%,100%{transform:translateX(644px)}}.cur{animation-name:cur}
    @keyframes e0{0%,48.79%{opacity:0}48.8%,100%{opacity:1}}.e0{animation-name:e0}
    @keyframes e1{0%,54.39%{opacity:0}54.4%,100%{opacity:1}}.e1{animation-name:e1}
    @keyframes e2{0%,59.99%{opacity:0}60%,100%{opacity:1}}.e2{animation-name:e2}
    @keyframes r0{0%,9.59%{opacity:0}9.6%,100%{opacity:1}}.r0{animation-name:r0}
    @keyframes r1{0%,15.19%{opacity:0}15.2%,100%{opacity:1}}.r1{animation-name:r1}
    @keyframes r2{0%,20.79%{opacity:0}20.8%,100%{opacity:1}}.r2{animation-name:r2}
    @keyframes r3{0%,26.39%{opacity:0}26.4%,100%{opacity:1}}.r3{animation-name:r3}
    @keyframes r4{0%,31.99%{opacity:0}32%,100%{opacity:1}}.r4{animation-name:r4}
    @keyframes r5{0%,37.59%{opacity:0}37.6%,100%{opacity:1}}.r5{animation-name:r5}
    @keyframes r6{0%,43.19%{opacity:0}43.2%,100%{opacity:1}}.r6{animation-name:r6}
    @keyframes r7{0%,48.79%{opacity:0}48.8%,100%{opacity:1}}.r7{animation-name:r7}
    @keyframes r8{0%,54.39%{opacity:0}54.4%,100%{opacity:1}}.r8{animation-name:r8}
    @keyframes r9{0%,59.99%{opacity:0}60%,100%{opacity:1}}.r9{animation-name:r9}
    @keyframes r10{0%,65.59%{opacity:0}65.6%,100%{opacity:1}}.r10{animation-name:r10}
    @keyframes r11{0%,71.19%{opacity:0}71.2%,100%{opacity:1}}.r11{animation-name:r11}
    @keyframes r12{0%,76.79%{opacity:0}76.8%,100%{opacity:1}}.r12{animation-name:r12}
    @keyframes r13{0%,82.39%{opacity:0}82.4%,100%{opacity:1}}.r13{animation-name:r13}
    @keyframes end{0%,83.99%{opacity:0}84%,100%{opacity:1}}.end{animation-name:end}
    @media (prefers-reduced-motion: reduce){.k,.cur{animation:none}.k{opacity:1}.cur{transform:translateX(644px)}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="446" rx="14"/>
  <text class="h" x="28" y="40">A two-week release, gated by evidence</text><text class="sub" x="28" y="62">Exposure widens only while the error rate stays under the SLO threshold. Illustrative.</text><rect class="bp" x="111" y="84" width="90" height="30" rx="5" stroke-width="1.2"/><text class="prit" x="156" y="104" text-anchor="middle" style="font-size:13px">RC built</text><rect class="bp" x="203" y="84" width="228" height="30" rx="5" stroke-width="1.2"/><text class="prit" x="317" y="104" text-anchor="middle" style="font-size:13px">Validate + UAT</text><rect class="bw" x="433" y="84" width="44" height="30" rx="5" stroke-width="1.2"/><rect class="bt" x="479" y="84" width="136" height="30" rx="5" stroke-width="1.2"/><text class="teat" x="547" y="104" text-anchor="middle" style="font-size:13px">Rollout</text><rect class="bo" x="617" y="84" width="136" height="30" rx="5" stroke-width="1.2"/><text class="okt" x="685" y="104" text-anchor="middle" style="font-size:13px">Hypercare</text><text class="wrnt" x="455" y="132" text-anchor="middle" style="font-size:12px">go/no-go</text><text class="lbl" x="28" y="168">Users exposed</text><line class="grid" x1="110" y1="260" x2="754" y2="260"/><text class="sub" x="102" y="264" text-anchor="end">0%</text><line class="grid" x1="110" y1="220" x2="754" y2="220"/><text class="sub" x="102" y="224" text-anchor="end">50%</text><line class="grid" x1="110" y1="180" x2="754" y2="180"/><text class="sub" x="102" y="184" text-anchor="end">100%</text><g class="k e0"><path class="lnt" d="M 478 260 L 478 256 L 524 256" style="stroke-width:3"/><text class="teat" x="484" y="250" style="font-size:12px">5%</text></g><g class="k e1"><path class="lnt" d="M 524 256 L 524 240 L 570 240" style="stroke-width:3"/><text class="teat" x="530" y="234" style="font-size:12px">25%</text></g><g class="k e2"><path class="lnt" d="M 570 240 L 570 180 L 754 180" style="stroke-width:3"/><text class="teat" x="576" y="174" style="font-size:12px">100%</text></g><text class="lbl" x="28" y="292">Error rate</text><line class="lnb dash" x1="110" y1="320" x2="754" y2="320"/><text class="badt" x="754" y="314" text-anchor="end" style="font-size:12px">SLO threshold 1%</text><line class="grid" x1="110" y1="370" x2="754" y2="370"/><g class="k r0"><line class="lnp" x1="110" y1="357.5" x2="156" y2="355"/></g><g class="k r1"><line class="lnp" x1="156" y1="355" x2="202" y2="360"/></g><g class="k r2"><line class="lnp" x1="202" y1="360" x2="248" y2="357.5"/></g><g class="k r3"><line class="lnp" x1="248" y1="357.5" x2="294" y2="355"/></g><g class="k r4"><line class="lnp" x1="294" y1="355" x2="340" y2="357.5"/></g><g class="k r5"><line class="lnp" x1="340" y1="357.5" x2="386" y2="360"/></g><g class="k r6"><line class="lnp" x1="386" y1="360" x2="432" y2="357.5"/></g><g class="k r7"><line class="lnp" x1="432" y1="357.5" x2="478" y2="352.5"/></g><g class="k r8"><line class="lnp" x1="478" y1="352.5" x2="524" y2="347.5"/></g><g class="k r9"><line class="lnp" x1="524" y1="347.5" x2="570" y2="350"/></g><g class="k r10"><line class="lnp" x1="570" y1="350" x2="616" y2="355"/></g><g class="k r11"><line class="lnp" x1="616" y1="355" x2="662" y2="357.5"/></g><g class="k r12"><line class="lnp" x1="662" y1="357.5" x2="708" y2="355"/></g><g class="k r13"><line class="lnp" x1="708" y1="355" x2="754" y2="357.5"/></g><text class="sub" x="110" y="394" text-anchor="middle">day 0</text><text class="sub" x="202" y="394" text-anchor="middle">day 2</text><text class="sub" x="294" y="394" text-anchor="middle">day 4</text><text class="sub" x="386" y="394" text-anchor="middle">day 6</text><text class="sub" x="478" y="394" text-anchor="middle">day 8</text><text class="sub" x="570" y="394" text-anchor="middle">day 10</text><text class="sub" x="662" y="394" text-anchor="middle">day 12</text><text class="sub" x="754" y="394" text-anchor="middle">day 14</text><g class="cur"><line class="lnw" x1="110" y1="78" x2="110" y2="378" style="stroke-width:1.5"/></g><g class="k end"><text class="okt" x="400" y="428" text-anchor="middle" style="font-size:14px">Error rate peaked at 0.45% during rollout: under the threshold, so no rollback.</text></g>
</svg>
