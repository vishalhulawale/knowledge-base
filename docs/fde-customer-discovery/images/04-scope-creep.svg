<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Scope creep versus a change process</title>
  <desc id="d">Animation: two bars show an eight-week time-box filled to 85 percent with planned scope (Must, Should and two Coulds). Four small asks arrive one at a time: an extra field, another team, call summaries and a mobile view. In the top row, every small yes is appended and the last two run past the end of the time-box, so the outcome is missed. In the bottom row, with a change process, the first two asks fit the buffer and the last two each replace a Could, which moves to phase 2, so the bar stays inside the time-box. Sizes are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes k0{0%,9.99%{opacity:0}10%,96.99%{opacity:1}97%,100%{opacity:0}}.k0{animation-name:k0}
    @keyframes k1{0%,23.99%{opacity:0}24%,96.99%{opacity:1}97%,100%{opacity:0}}.k1{animation-name:k1}
    @keyframes k2{0%,37.99%{opacity:0}38%,96.99%{opacity:1}97%,100%{opacity:0}}.k2{animation-name:k2}
    @keyframes k3{0%,51.99%{opacity:0}52%,96.99%{opacity:1}97%,100%{opacity:0}}.k3{animation-name:k3}
    @keyframes ov{0%,57.99%{opacity:0}58%,96.99%{opacity:1}97%,100%{opacity:0}}.ov{animation-name:ov}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="354" rx="14"/>
  <text class="h" x="28" y="40">Scope creep is reasonable asks, one at a time</text><text class="sub" x="28" y="62">Same four asks, two ways of handling them. Sizes are illustrative.</text><text class="lbl" x="28" y="96">Every small yes</text><rect class="pri" x="41" y="110" width="339" height="40" rx="5"/><text class="on13" x="46" y="135">Must</text><rect class="tea" x="382" y="110" width="91" height="40" rx="5"/><text class="on13" x="387" y="135">Should</text><rect class="wrnf" x="475" y="110" width="44.5" height="40" rx="5"/><text class="on13" x="480" y="135">Could</text><rect class="wrnf" x="521.5" y="110" width="44.5" height="40" rx="5"/><text class="on13" x="526.5" y="135">Could</text><g class="k k0"><rect class="mutf" x="568" y="110" width="29" height="40" rx="5"/></g><g class="k k1"><rect class="mutf" x="599" y="110" width="41.4" height="40" rx="5"/></g><g class="k k2"><rect class="badf" x="642.4" y="110" width="35.2" height="40" rx="5"/></g><g class="k k3"><rect class="badf" x="679.6" y="110" width="35.2" height="40" rx="5"/></g><text class="lbl" x="28" y="226">Change process: size, trade off, sponsor decides</text><rect class="pri" x="41" y="240" width="339" height="40" rx="5"/><text class="on13" x="46" y="265">Must</text><rect class="tea" x="382" y="240" width="91" height="40" rx="5"/><text class="on13" x="387" y="265">Should</text><rect class="wrnf" x="475" y="240" width="44.5" height="40" rx="5"/><text class="on13" x="480" y="265">Could</text><rect class="wrnf" x="521.5" y="240" width="44.5" height="40" rx="5"/><text class="on13" x="526.5" y="265">Could</text><g class="k k0"><rect class="okf" x="568" y="240" width="29" height="40" rx="5"/></g><g class="k k1"><rect class="okf" x="599" y="240" width="41.4" height="40" rx="5"/></g><g class="k k2"><rect class="okf" x="521.5" y="240" width="44.5" height="40" rx="5"/></g><g class="k k3"><rect class="okf" x="475" y="240" width="44.5" height="40" rx="5"/></g><g class="k k2"><text class="sub" x="672" y="258">Could → phase 2</text></g><g class="k k3"><text class="sub" x="672" y="276">Could → phase 2</text></g><line class="lnb dash" x1="660" y1="84" x2="660" y2="290"/><text class="badt" x="660" y="78" text-anchor="middle" style="font-size:12px">time-box ends</text><g class="k ov"><text class="badt" x="668" y="98" style="font-size:13px">outcome missed</text></g><text class="sub" x="28" y="312">Asks: +export field, +another team, +call summaries, +mobile. Grey fits, red overflows, green agreed.</text><text class="sm" x="28" y="334">The buffer absorbs the first asks; after that every yes needs a swap, decided by the sponsor and written down.</text>
</svg>
