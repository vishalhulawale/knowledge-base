<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Deployment slot swap</title>
  <desc id="d">Animation of an App Service slot swap in four steps. First, version 42 is deployed to the staging slot while users keep hitting version 41 in production. Second, the swap applies production's sticky slot settings, such as the production database URL, to the staging instances, which restart and warm up. Third, routing flips so production serves the warm version 42 with no cold start, and version 41 sits in staging. Fourth, a second swap rolls back in seconds because version 41 is still running. A side panel explains that slot settings stay with their slot while code and normal settings travel with the swap. The AWS analogue is an Elastic Beanstalk CNAME swap or ECS blue/green behind an ALB.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:16s infinite linear}
    @keyframes f0{0%,24.99%{opacity:1}25%,100%{opacity:0}}.f0{animation-name:f0}
    @keyframes f1{0%,24.99%{opacity:0}25%,49.99%{opacity:1}50%,100%{opacity:0}}.f1{animation-name:f1}
    @keyframes f2{0%,49.99%{opacity:0}50%,74.99%{opacity:1}75%,100%{opacity:0}}.f2{animation-name:f2}
    @keyframes f3{0%,74.99%{opacity:0}75%,100%{opacity:1}}.f3{animation-name:f3}
    @keyframes pre{0%,49.99%{opacity:1}50%,100%{opacity:0}}.pre{animation-name:pre}
    @keyframes post{0%,49.99%{opacity:0}50%,100%{opacity:1}}.post{animation-name:post}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.post,.f2{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="464" rx="14"/>
  <text class="h" x="28" y="40">App Service deployment slot swap</text><text class="sub" x="28" y="62">Same App Service plan, two slots. The swap warms the new build before users see it.</text><rect class="bm" x="28" y="150" width="110" height="60" rx="8" stroke-width="1.5"/><text class="sm" x="83" y="176" text-anchor="middle">Users</text><text class="sm" x="83" y="194" text-anchor="middle">orders.example</text><line class="lnp" x1="138" y1="180" x2="238" y2="180" marker-end="url(#arp)"/><text class="lbl" x="250" y="104">production slot</text><text class="lbl" x="250" y="254">staging slot</text><rect class="box" x="248" y="112" width="300" height="120" rx="10" stroke-width="1.5"/><rect class="box" x="248" y="262" width="300" height="120" rx="10" stroke-width="1.5"/><g class="k pre"><rect class="pri" x="264" y="132" width="110" height="52" rx="8"/><text class="on13" x="319" y="156" text-anchor="middle">v41</text><text class="on13" x="319" y="174" text-anchor="middle">3 instances</text><text class="sm" x="390" y="162">serving traffic</text></g><g class="k post"><rect class="tea" x="264" y="132" width="110" height="52" rx="8"/><text class="on13" x="319" y="156" text-anchor="middle">v42</text><text class="on13" x="319" y="174" text-anchor="middle">3 instances</text><text class="sm" x="390" y="162">serving traffic</text></g><g class="k f0"><rect class="mutf" x="264" y="282" width="110" height="52" rx="8"/><text class="on13" x="319" y="306" text-anchor="middle">v42</text><text class="on13" x="319" y="324" text-anchor="middle">3 instances</text><text class="sm" x="390" y="312">deployed, cold</text></g><g class="k f1"><rect class="wrnf" x="264" y="282" width="110" height="52" rx="8"/><text class="on13" x="319" y="306" text-anchor="middle">v42</text><text class="on13" x="319" y="324" text-anchor="middle">3 instances</text><text class="sm" x="390" y="312">restart + warm-up</text></g><g class="k f2"><rect class="pri" x="264" y="282" width="110" height="52" rx="8"/><text class="on13" x="319" y="306" text-anchor="middle">v41</text><text class="on13" x="319" y="324" text-anchor="middle">3 instances</text><text class="sm" x="390" y="312">previous build</text></g><g class="k f3"><rect class="pri" x="264" y="282" width="110" height="52" rx="8"/><text class="on13" x="319" y="306" text-anchor="middle">v41</text><text class="on13" x="319" y="324" text-anchor="middle">3 instances</text><text class="sm" x="390" y="312">ready to swap back</text></g><rect class="bt" x="580" y="112" width="192" height="270" rx="10" stroke-width="1.2"/><text class="teat" x="676" y="136" text-anchor="middle">Slot settings</text><text class="sub" x="676" y="154" text-anchor="middle">(sticky, never move)</text><text class="mono" x="596" y="186" xml:space="preserve" style="font-size:12px">prod: DB_URL=prod-db</text><text class="mono" x="596" y="316" xml:space="preserve" style="font-size:12px">stg: DB_URL=stg-db</text><text class="sm" x="596" y="222">Normal app settings</text><text class="sm" x="596" y="240">and code travel with</text><text class="sm" x="596" y="258">the swap; these stay</text><text class="sm" x="596" y="276">with their slot.</text><g class="k f0"><text class="tx" x="28" y="418" style="font-size:14px">1. Deploy v42 to staging. Users still hit v41 in production.</text></g><g class="k f1"><text class="wrnt" x="28" y="418" style="font-size:14px">2. Swap starts: production's sticky settings are applied to staging, it restarts and is warmed up.</text></g><g class="k f2"><text class="okt" x="28" y="418" style="font-size:14px">3. Routing flips. Production now serves warm v42; no cold start, no dropped requests.</text></g><g class="k f3"><text class="prit" x="28" y="418" style="font-size:14px">4. Bad release? Swap again: v41 is still running in staging, so rollback takes seconds.</text></g><text class="sub" x="28" y="446">AWS analogue: Elastic Beanstalk CNAME swap, or blue/green on ECS with an ALB.</text>
</svg>
