<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Every copy counts for residency</title>
  <desc id="d">Inside a dashed boundary for the approved region, such as the EU, are three columns. Stored: databases, vector index, object storage, logs and traces, backups and eval datasets. Processed: a Bedrock geographic eu. inference profile, an Azure Data Zone EU or Regional deployment, or a Vertex AI regional endpoint. Accessed: support from inside the region, customer-approved recorded sessions, and named sub-processors. Red arrows show copies that leave the boundary: traces with full prompts sent to a US-hosted observability service, production samples copied to a laptop for evals, a global inference profile that may run in any commercial region, and support access from outside the EU, which is a GDPR transfer.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="410" rx="14"/>
  <text class="h" x="28" y="40">Residency covers every copy of the data</text><text class="sub" x="28" y="62">Stored, processed, accessed. Pinning inference to the EU is not enough if a copy goes elsewhere.</text><rect class="bt" x="28" y="82" width="488" height="262" rx="12" stroke-width="1.5" stroke-dasharray="7 5" fill-opacity="0.5"/><text class="teat" x="44" y="106" style="font-size:14px">Approved region (e.g. EU)</text><text class="lbl" x="44" y="134">Stored</text><rect class="box" x="44" y="146" width="144" height="25" rx="6"/><text class="sm" x="54" y="163">Databases</text><rect class="box" x="44" y="177" width="144" height="25" rx="6"/><text class="sm" x="54" y="194">Vector index</text><rect class="box" x="44" y="208" width="144" height="25" rx="6"/><text class="sm" x="54" y="225">Object storage</text><rect class="box" x="44" y="239" width="144" height="25" rx="6"/><text class="sm" x="54" y="256">Logs and traces</text><rect class="box" x="44" y="270" width="144" height="25" rx="6"/><text class="sm" x="54" y="287">Backups</text><rect class="box" x="44" y="301" width="144" height="25" rx="6"/><text class="sm" x="54" y="318">Eval datasets</text><text class="lbl" x="200" y="134">Processed</text><rect class="box" x="200" y="146" width="144" height="54" rx="6"/><text class="sm" x="210" y="167">Bedrock geographic</text><text class="sm" x="210" y="185">profile (eu.)</text><rect class="box" x="200" y="208" width="144" height="54" rx="6"/><text class="sm" x="210" y="229">Azure Data Zone</text><text class="sm" x="210" y="247">(EU) or Regional</text><rect class="box" x="200" y="270" width="144" height="54" rx="6"/><text class="sm" x="210" y="291">Vertex AI regional</text><text class="sm" x="210" y="309">endpoint</text><text class="lbl" x="356" y="134">Accessed</text><rect class="box" x="356" y="146" width="144" height="54" rx="6"/><text class="sm" x="366" y="167">Support from inside</text><text class="sm" x="366" y="185">the region</text><rect class="box" x="356" y="208" width="144" height="54" rx="6"/><text class="sm" x="366" y="229">Customer-approved,</text><text class="sm" x="366" y="247">recorded sessions</text><rect class="box" x="356" y="270" width="144" height="54" rx="6"/><text class="sm" x="366" y="291">Sub-processors</text><text class="sm" x="366" y="309">named, located</text><text class="badt" x="548" y="106" style="font-size:14px">Copies that leave</text><rect class="bb" x="548" y="120" width="224" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="560" y="140" font-weight="700">Traces with full prompts</text><text class="sub" x="560" y="158" style="font-size:12px">to a US-hosted observability SaaS</text><line class="lnb" x1="516" y1="144" x2="544" y2="144" marker-end="url(#arb)"/><rect class="bb" x="548" y="176" width="224" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="560" y="196" font-weight="700">Production samples</text><text class="sub" x="560" y="214" style="font-size:12px">copied to a laptop for evals</text><line class="lnb" x1="516" y1="200" x2="544" y2="200" marker-end="url(#arb)"/><rect class="bb" x="548" y="232" width="224" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="560" y="252" font-weight="700">Global inference profile</text><text class="sub" x="560" y="270" style="font-size:12px">may run in any commercial region</text><line class="lnb" x1="516" y1="256" x2="544" y2="256" marker-end="url(#arb)"/><rect class="bb" x="548" y="288" width="224" height="48" rx="8" stroke-width="1.5"/><text class="sm" x="560" y="308" font-weight="700">Support access from outside</text><text class="sub" x="560" y="326" style="font-size:12px">the EU is a GDPR transfer</text><line class="lnb" x1="516" y1="312" x2="544" y2="312" marker-end="url(#arb)"/><text class="sm" x="28" y="372">Fix: list every copy in the data-flow diagram (logs, backups, evals, support), and use global routing</text><text class="sm" x="28" y="391">only with the customer's written privacy approval.</text>
</svg>
