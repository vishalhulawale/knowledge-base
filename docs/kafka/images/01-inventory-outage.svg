<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Inventory goes down: REST chain vs Kafka log</title>
  <desc id="d">Two ways for an Order service to tell Payment and Inventory about a new order, shown over three phases. Left, synchronous REST: while every service is up, the order succeeds with 201. When Inventory goes down, the call to it fails, so the whole order fails with 503. When Inventory comes back, new orders work again, but the orders placed during the outage were rejected. Right, events on a Kafka topic: Order appends OrderPlaced events to the log and always succeeds. Payment keeps reading. While Inventory is down its offset stays at the first event and its lag grows to 2; the events wait in the log. When Inventory comes back it reads the waiting events and catches up to lag 0. Nothing was lost.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:15s infinite linear}
    @keyframes p0{0%,30%{opacity:1}31%{opacity:0}100%{opacity:0}}
    .p0{animation-name:p0}
    @keyframes p1{0%{opacity:0}30%{opacity:0}31%,65%{opacity:1}66%{opacity:0}100%{opacity:0}}
    .p1{animation-name:p1}
    @keyframes p2{0%{opacity:0}65%{opacity:0}66%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p2{animation-name:p2}
    @keyframes p02{0%,30%{opacity:1}31%{opacity:0}65%{opacity:0}66%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p02{animation-name:p02}
    @keyframes r0{0%{opacity:0}2%{opacity:0}3%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .r0{animation-name:r0}
    @keyframes r1{0%{opacity:0}36%{opacity:0}37%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .r1{animation-name:r1}
    @keyframes r2{0%{opacity:0}48%{opacity:0}49%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .r2{animation-name:r2}
    @keyframes r3{0%{opacity:0}70%{opacity:0}71%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .r3{animation-name:r3}
    @keyframes pa1{0%{opacity:0}4%{opacity:0}5%,38%{opacity:1}39%{opacity:0}100%{opacity:0}}
    .pa1{animation-name:pa1}
    @keyframes pa2{0%{opacity:0}37%{opacity:0}38%,50%{opacity:1}51%{opacity:0}100%{opacity:0}}
    .pa2{animation-name:pa2}
    @keyframes pa3{0%{opacity:0}49%{opacity:0}50%,72%{opacity:1}73%{opacity:0}100%{opacity:0}}
    .pa3{animation-name:pa3}
    @keyframes pa4{0%{opacity:0}71%{opacity:0}72%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .pa4{animation-name:pa4}
    @keyframes iv1{0%{opacity:0}4%{opacity:0}5%,68%{opacity:1}69%{opacity:0}100%{opacity:0}}
    .iv1{animation-name:iv1}
    @keyframes iv3{0%{opacity:0}67%{opacity:0}68%,74%{opacity:1}75%{opacity:0}100%{opacity:0}}
    .iv3{animation-name:iv3}
    @keyframes iv4{0%{opacity:0}73%{opacity:0}74%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .iv4{animation-name:iv4}
    @keyframes l0{0%{opacity:0}4%{opacity:0}5%,30%{opacity:1}31%{opacity:0}100%{opacity:0}}
    .l0{animation-name:l0}
    @keyframes l1{0%{opacity:0}31%{opacity:0}32%,49%{opacity:1}50%{opacity:0}100%{opacity:0}}
    .l1{animation-name:l1}
    @keyframes l2{0%{opacity:0}50%{opacity:0}51%,66%{opacity:1}67%{opacity:0}100%{opacity:0}}
    .l2{animation-name:l2}
    @keyframes l3{0%{opacity:0}68%{opacity:0}69%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .l3{animation-name:l3}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .p0,.p2,.p02,.pa1,.pa2,.pa4,.iv3,.iv4,.l0,.l1,.l3,.r3{opacity:0!important}
    }
  </style>
  <defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="408" rx="14"/>
  <text class="h" x="28" y="40">Inventory goes down for a while</text>
  <text class="sub" x="28" y="62">The same three moments, with a synchronous call chain and with an event log.</text>
  <line class="ln dash" x1="400" y1="84" x2="400" y2="352"/>
  <text class="h2" x="28" y="100">Synchronous REST</text>
  <text class="h2" x="420" y="100">Events on a Kafka topic</text>
  <rect class="box" x="140" y="120" width="120" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="200" y="145" text-anchor="middle" font-weight="700">Order</text>
  <rect class="box" x="48" y="232" width="120" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="108" y="257" text-anchor="middle" font-weight="700">Payment</text>
  <rect class="box" x="226" y="232" width="132" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx a p02" x="292" y="257" text-anchor="middle" font-weight="700">Inventory</text>
  <line class="ln" x1="180" y1="160" x2="112" y2="228" marker-end="url(#ar)"/>
  <line class="ln a p0" x1="220" y1="160" x2="288" y2="228" marker-end="url(#ar)"/>
  <line class="ln a p2" x1="220" y1="160" x2="288" y2="228" marker-end="url(#ar)"/>
  <line class="lnb a p1" x1="220" y1="160" x2="288" y2="228" marker-end="url(#arb)"/>
  <text class="tx badt a p1" style="font-size:18px" x="276" y="196">✕</text>
  <g class="a p1">
  <rect class="badf" x="226" y="232" width="132" height="40" rx="10"/>
  <text class="on13" x="292" y="256.5" text-anchor="middle">Inventory down</text>
  </g>
  <text class="tx okt a p0" x="28" y="316">POST /orders → 201 Created</text>
  <text class="tx badt a p1" x="28" y="316">POST /orders → 503: the whole order fails</text>
  <text class="sub a p1" x="28" y="336">Order is only as available as its slowest callee.</text>
  <text class="tx okt a p2" x="28" y="316">POST /orders → 201 again</text>
  <text class="sub wrnt a p2" x="28" y="336">Orders placed during the outage were rejected.</text>
  <rect class="box" x="420" y="120" width="92" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="466" y="145" text-anchor="middle" font-weight="700">Order</text>
  <text class="sm" x="536" y="176">topic: orders, offsets 0–3</text>
  <rect class="box" x="536" y="120" width="52" height="40" rx="8"/>
  <rect class="box" x="594" y="120" width="52" height="40" rx="8"/>
  <rect class="box" x="652" y="120" width="52" height="40" rx="8"/>
  <rect class="box" x="710" y="120" width="52" height="40" rx="8"/>
  <g class="a r0">
  <rect class="pri" x="536" y="120" width="52" height="40" rx="8"/>
  <text class="on" x="562" y="144.5" text-anchor="middle">#1</text>
  </g>
  <g class="a r1">
  <rect class="pri" x="594" y="120" width="52" height="40" rx="8"/>
  <text class="on" x="620" y="144.5" text-anchor="middle">#2</text>
  </g>
  <g class="a r2">
  <rect class="pri" x="652" y="120" width="52" height="40" rx="8"/>
  <text class="on" x="678" y="144.5" text-anchor="middle">#3</text>
  </g>
  <g class="a r3">
  <rect class="pri" x="710" y="120" width="52" height="40" rx="8"/>
  <text class="on" x="736" y="144.5" text-anchor="middle">#4</text>
  </g>
  <line class="ln" x1="512" y1="140" x2="532" y2="140" marker-end="url(#ar)"/>
  <text class="lbl" x="420" y="222">Payment</text>
  <text class="lbl" x="420" y="288">Inventory</text>
  <rect class="box" x="536" y="208" width="52" height="18" rx="4"/>
  <rect class="box" x="536" y="274" width="52" height="18" rx="4"/>
  <rect class="box" x="594" y="208" width="52" height="18" rx="4"/>
  <rect class="box" x="594" y="274" width="52" height="18" rx="4"/>
  <rect class="box" x="652" y="208" width="52" height="18" rx="4"/>
  <rect class="box" x="652" y="274" width="52" height="18" rx="4"/>
  <rect class="box" x="710" y="208" width="52" height="18" rx="4"/>
  <rect class="box" x="710" y="274" width="52" height="18" rx="4"/>
  <rect class="tea a pa1" x="536" y="208" width="52" height="18" rx="4"/>
  <rect class="tea a pa2" x="536" y="208" width="110" height="18" rx="4"/>
  <rect class="tea a pa3" x="536" y="208" width="168" height="18" rx="4"/>
  <rect class="tea a pa4" x="536" y="208" width="226" height="18" rx="4"/>
  <rect class="tea a iv1" x="536" y="274" width="52" height="18" rx="4"/>
  <rect class="tea a iv3" x="536" y="274" width="168" height="18" rx="4"/>
  <rect class="tea a iv4" x="536" y="274" width="226" height="18" rx="4"/>
  <text class="sm" x="536" y="246">read up to the newest event, lag 0</text>
  <text class="sm a l0" x="536" y="312">lag 0</text>
  <text class="sm badt a l1" x="536" y="312">DOWN: offset stuck</text>
  <text class="sm badt a l2" x="536" y="312">DOWN: lag 2, events wait in the log</text>
  <text class="sm okt a l3" x="536" y="312">back: reads the backlog, lag 0</text>
  <text class="tx okt" x="420" y="336">Order → 201 every time</text>
  <text class="lbl a p0" x="28" y="386">1  All services up</text>
  <text class="lbl badt a p1" x="28" y="386">2  Inventory is down</text>
  <text class="lbl okt a p2" x="28" y="386">3  Inventory is back</text>
</svg>
