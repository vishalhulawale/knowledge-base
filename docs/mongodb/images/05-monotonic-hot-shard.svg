    .i19{animation-name:i19}
    @keyframes fin{0%{opacity:0}83%{opacity:0}84%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .fin{animation-name:fin}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="448" rx="14"/>
  <text class="h" x="28" y="40">10 inserts with increasing createdAt</text>
  <text class="sub" x="28" y="62">Two shards. Measured on the page with 50,000 inserts: 50,001 / 1 vs 24,979 / 25,021.</text>
  <line class="ln dash" x1="400" y1="84" x2="400" y2="360"/>
  <text class="h2" x="28" y="102">{createdAt: 1}  ranged</text>
  <rect class="bm" x="28" y="118" width="170" height="232" rx="10" stroke-width="1"/>
  <text class="lbl" x="40" y="140">Shard 1</text>
  <text class="sm" x="40" y="158">min … Mar 31</text>
  <rect class="bm" x="208" y="118" width="170" height="232" rx="10" stroke-width="1"/>
  <text class="lbl" x="220" y="140">Shard 2</text>
  <text class="sm" x="220" y="158">Apr 1 … max</text>
  <g class="a i00">
  <rect class="pri" x="220" y="170" width="70" height="24" rx="5"/>
  <text class="on13" x="255" y="186.5" text-anchor="middle">t+1</text>
  </g>
  <g class="a i01">
  <rect class="pri" x="296" y="170" width="70" height="24" rx="5"/>
  <text class="on13" x="331" y="186.5" text-anchor="middle">t+2</text>
  </g>
  <g class="a i02">
  <rect class="pri" x="220" y="200" width="70" height="24" rx="5"/>
  <text class="on13" x="255" y="216.5" text-anchor="middle">t+3</text>
  </g>
  <g class="a i03">
  <rect class="pri" x="296" y="200" width="70" height="24" rx="5"/>
  <text class="on13" x="331" y="216.5" text-anchor="middle">t+4</text>
  </g>
  <g class="a i04">
  <rect class="pri" x="220" y="230" width="70" height="24" rx="5"/>
  <text class="on13" x="255" y="246.5" text-anchor="middle">t+5</text>
  </g>
  <g class="a i05">
  <rect class="pri" x="296" y="230" width="70" height="24" rx="5"/>
  <text class="on13" x="331" y="246.5" text-anchor="middle">t+6</text>
  </g>
  <g class="a i06">
  <rect class="pri" x="220" y="260" width="70" height="24" rx="5"/>
  <text class="on13" x="255" y="276.5" text-anchor="middle">t+7</text>
  </g>
  <g class="a i07">
  <rect class="pri" x="296" y="260" width="70" height="24" rx="5"/>
  <text class="on13" x="331" y="276.5" text-anchor="middle">t+8</text>
  </g>
  <g class="a i08">
  <rect class="pri" x="220" y="290" width="70" height="24" rx="5"/>
  <text class="on13" x="255" y="306.5" text-anchor="middle">t+9</text>
  </g>
  <g class="a i09">
  <rect class="pri" x="296" y="290" width="70" height="24" rx="5"/>
  <text class="on13" x="331" y="306.5" text-anchor="middle">t+10</text>
  </g>
  <text class="h2" x="420" y="102">{createdAt: &quot;hashed&quot;}</text>
  <rect class="bm" x="420" y="118" width="170" height="232" rx="10" stroke-width="1"/>
  <text class="lbl" x="432" y="140">Shard 1</text>
  <text class="sm" x="432" y="158">hash range A</text>
  <rect class="bm" x="600" y="118" width="170" height="232" rx="10" stroke-width="1"/>
  <text class="lbl" x="612" y="140">Shard 2</text>
  <text class="sm" x="612" y="158">hash range B</text>
  <g class="a i10">
  <rect class="tea" x="612" y="170" width="70" height="24" rx="5"/>
  <text class="on13" x="647" y="186.5" text-anchor="middle">t+1</text>
  </g>
  <g class="a i11">
  <rect class="tea" x="432" y="170" width="70" height="24" rx="5"/>
  <text class="on13" x="467" y="186.5" text-anchor="middle">t+2</text>
  </g>
  <g class="a i12">
  <rect class="tea" x="508" y="170" width="70" height="24" rx="5"/>
  <text class="on13" x="543" y="186.5" text-anchor="middle">t+3</text>
  </g>
  <g class="a i13">
  <rect class="tea" x="688" y="170" width="70" height="24" rx="5"/>
  <text class="on13" x="723" y="186.5" text-anchor="middle">t+4</text>
  </g>
  <g class="a i14">
  <rect class="tea" x="432" y="200" width="70" height="24" rx="5"/>
  <text class="on13" x="467" y="216.5" text-anchor="middle">t+5</text>
  </g>
  <g class="a i15">
  <rect class="tea" x="612" y="200" width="70" height="24" rx="5"/>
  <text class="on13" x="647" y="216.5" text-anchor="middle">t+6</text>
  </g>
  <g class="a i16">
  <rect class="tea" x="688" y="200" width="70" height="24" rx="5"/>
  <text class="on13" x="723" y="216.5" text-anchor="middle">t+7</text>
  </g>
  <g class="a i17">
  <rect class="tea" x="508" y="200" width="70" height="24" rx="5"/>
  <text class="on13" x="543" y="216.5" text-anchor="middle">t+8</text>
  </g>
  <g class="a i18">
  <rect class="tea" x="612" y="230" width="70" height="24" rx="5"/>
  <text class="on13" x="647" y="246.5" text-anchor="middle">t+9</text>
