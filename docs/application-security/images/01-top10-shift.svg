<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Top 10 2021 to 2025</title>
  <desc id="d">A slope chart linking each OWASP Top 10 2021 category on the left to its 2025 position on the right. Broken Access Control stays first. Security Misconfiguration climbs from fifth to second. Vulnerable and Outdated Components expands into the new Software Supply Chain Failures at third. Cryptographic Failures, Injection and Insecure Design each slide two places, to fourth, fifth and sixth. SSRF merges into Broken Access Control. Authentication, Integrity and Logging keep their places, Logging renamed to Alerting. Mishandling of Exceptional Conditions arrives new at tenth.</desc>
