  <line class="lnm" x1="179" y1="367" x2="215" y2="401"/>
  <line class="lnm" x1="215" y1="401" x2="258" y2="346"/>
  <line class="lnm" x1="258" y1="346" x2="303" y2="370"/>
  <line class="lnm" x1="303" y1="370" x2="335" y2="349"/>
