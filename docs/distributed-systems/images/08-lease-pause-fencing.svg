<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Lease expiry during a GC pause, stopped by fencing</title>
<desc id="d">Animated timeline from 0 to 20 seconds with lanes for client A, the lock service, client B and storage. Client A acquires the lock with token 33 and a 10 second lease, then enters a 15 second stop-the-world GC pause. The lease expires at 10 s. At 11 s client B acquires the lock with token 34 and at 12 s writes to storage, which accepts it and records 34 as the highest token. At about 16 s client A wakes up and writes with token 33, and storage rejects it because 33 is less than 34.</desc>
<style>
.card{fill:#f8fafc;stroke:#e2e8f0}.cv{fill:#f8fafc}
.h{fill:#0f172a;font-size:20px;font-weight:700}
.lbl{fill:#334155;font-size:15px;font-weight:600}
.txt{fill:#334155;font-size:14px}.sm{fill:#334155;font-size:13px}
.sub{fill:#64748b;font-size:13px}.b{font-weight:700}
.slot{fill:#ffffff;stroke:#cbd5e1}
.fp{fill:#4f46e5}.ft{fill:#0ea5a4}.fg{fill:#16a34a}.fr{fill:#dc2626}.fa{fill:#d97706}.fmu{fill:#64748b}
.zp{fill:#4f46e5;fill-opacity:.1}.zg{fill:#16a34a;fill-opacity:.12}.zr{fill:#dc2626;fill-opacity:.1}.za{fill:#d97706;fill-opacity:.14}
.on{fill:#ffffff}
.sp{stroke:#4f46e5}.st{stroke:#0ea5a4}.sg{stroke:#16a34a}.sr{stroke:#dc2626}.sa{stroke:#d97706}.smu{stroke:#64748b}.sax{stroke:#cbd5e1}
.tp{fill:#4f46e5}.tt{fill:#0f766e}.tg{fill:#15803d}.tr{fill:#dc2626}.ta{fill:#b45309}.tm{fill:#64748b}
.nf{fill:none}
@media (prefers-color-scheme: dark){
.card{fill:#1f2430;stroke:#334155}.cv{fill:#1f2430}
.h{fill:#f1f5f9}.lbl,.txt,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}
.slot{fill:#111827;stroke:#475569}
.fp{fill:#818cf8}.ft{fill:#2dd4bf}.fg{fill:#4ade80}.fr{fill:#f87171}.fa{fill:#fbbf24}.fmu{fill:#94a3b8}
.zp{fill:#818cf8;fill-opacity:.16}.zg{fill:#4ade80;fill-opacity:.14}.zr{fill:#f87171;fill-opacity:.14}.za{fill:#fbbf24;fill-opacity:.14}
.on{fill:#0f172a}
.sp{stroke:#818cf8}.st{stroke:#2dd4bf}.sg{stroke:#4ade80}.sr{stroke:#f87171}.sa{stroke:#fbbf24}.smu{stroke:#94a3b8}.sax{stroke:#475569}
.tp{fill:#818cf8}.tt{fill:#5eead4}.tg{fill:#4ade80}.tr{fill:#f87171}.ta{fill:#fbbf24}.tm{fill:#94a3b8}
}

.cur{transform-box:fill-box;transform-origin:100% 50%;animation:cur 10s linear infinite}
@keyframes cur{0%,2%{transform:scaleX(1)}80%,95%{transform:scaleX(0)}96%,100%{transform:scaleX(1)}}
.ph{opacity:0;animation:ph 10s linear infinite}
@keyframes ph{0%,1%{transform:translateX(0);opacity:0}2%{transform:translateX(0);opacity:1}80%{transform:translateX(614px);opacity:1}81%,100%{transform:translateX(614px);opacity:0}}


@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.d{animation:none;opacity:0}.w{animation:none;opacity:0}.cur{animation:none;opacity:0}.ph{animation:none;opacity:0}}
</style>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fmu" d="M0,0L10,5L0,10z"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fp" d="M0,0L10,5L0,10z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fg" d="M0,0L10,5L0,10z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fr" d="M0,0L10,5L0,10z"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fa" d="M0,0L10,5L0,10z"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ft" d="M0,0L10,5L0,10z"/></marker>
</defs>
<rect class="card" x="1" y="1" width="798" height="414" rx="14"/>

<text class="h" x="28" y="40">Lease expiry during a GC pause, stopped by a fencing token</text>
<text class="sub" x="28" y="62">Lease 10 s. Client A pauses for 15 s and wakes up still believing it holds the lock.</text>
<text class="lbl" x="28" y="129">Client A</text>
<text class="lbl" x="28" y="195">Lock service</text>
<text class="lbl" x="28" y="261">Client B</text>
<text class="lbl" x="28" y="323">Storage</text>
<g>
<line x1="160" y1="124" x2="744" y2="124" class="sax" stroke-width="1.5"/>
<line x1="160" y1="190" x2="744" y2="190" class="sax" stroke-width="1.5"/>
<line x1="160" y1="256" x2="744" y2="256" class="sax" stroke-width="1.5"/>
<line x1="160" y1="318" x2="744" y2="318" class="sax" stroke-width="1.5"/>
<!-- A -->
<rect class="fp" x="160" y="117" width="29" height="14" rx="4"/>
<rect class="zr" x="189" y="110" width="435" height="28" rx="6"/>
<rect class="nf sr" x="189" y="110" width="435" height="28" rx="6" stroke-dasharray="5 4"/>
<text class="sm tr b" x="406.5" y="129" text-anchor="middle">stop-the-world GC pause (15 s)</text>
<text class="sm tp b" x="160" y="102">acquires, token 33</text>
<!-- lock leases -->
<rect class="fp" x="160" y="177" width="290" height="26" rx="6"/><text class="sm on b" x="305.0" y="195" text-anchor="middle">A's lease (token 33)</text>
<rect class="ft" x="479" y="177" width="261" height="26" rx="6"/><text class="sm on b" x="489" y="195">B's lease (34)</text>
<line x1="450" y1="96" x2="450" y2="340" class="sa" stroke-width="2" stroke-dasharray="6 4"/>
<text class="sm ta b" x="444" y="88" text-anchor="end">lease expires at 10 s</text>
<!-- B -->
<circle class="ft" cx="479" cy="256" r="6"/><text class="sm tt b" x="489" y="244">acquires, token 34</text>
<line x1="508" y1="260" x2="508" y2="310" class="st" stroke-width="2.5" marker-end="url(#at)"/>
<text class="sm tg b" x="508" y="338" text-anchor="middle">accepts 34</text>
<!-- A wakes -->
<line x1="638.5" y1="140" x2="638.5" y2="310" class="sr" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text class="sm tr b" x="642.5" y="102" text-anchor="end">wakes, writes with 33</text>
<text class="sm tr b" x="638.5" y="338" text-anchor="middle">rejects 33 &lt; 34</text>
</g>
<g class="cur"><rect class="cv" x="158" y="72" width="614" height="272"/></g>
<g class="ph"><line x1="158" y1="76" x2="158" y2="344" class="sp" stroke-width="2"/></g>
<line x1="160" y1="352" x2="744" y2="352" class="sax" stroke-width="1.5"/>
<line x1="160" y1="352" x2="160" y2="360" class="smu"/><text class="sub" x="160" y="376" text-anchor="middle">0 s</text><line x1="305" y1="352" x2="305" y2="360" class="smu"/><text class="sub" x="305" y="376" text-anchor="middle">5 s</text><line x1="450" y1="352" x2="450" y2="360" class="smu"/><text class="sub" x="450" y="376" text-anchor="middle">10 s</text><line x1="595" y1="352" x2="595" y2="360" class="smu"/><text class="sub" x="595" y="376" text-anchor="middle">15 s</text><line x1="740" y1="352" x2="740" y2="360" class="smu"/><text class="sub" x="740" y="376" text-anchor="middle">20 s</text>
<text class="sub" x="28" y="400">The lock service did nothing wrong. Only the storage-side token check stops A's stale write.</text>

</svg>
