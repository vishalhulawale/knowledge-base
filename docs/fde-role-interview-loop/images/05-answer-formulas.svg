  <text class="h" x="28" y="40">Two answers you will give in every loop</text><text class="sub" x="28" y="62">Each part is one or two sentences; together they take about 60–90 seconds.</text><text class="h2" x="28" y="100">Why FDE?</text><rect class="bp" x="28" y="112" width="170" height="36" rx="18" stroke-width="1.5"/><text class="sm" x="113" y="135" text-anchor="middle" font-weight="700">Past pull</text><line class="ln" x1="200" y1="130" x2="216" y2="130" marker-end="url(#ar)"/><text class="sub" x="32" y="170">Owning the 5-upstream</text><text class="sub" x="32" y="187">integration layer</text><rect class="bp" x="218" y="112" width="170" height="36" rx="18" stroke-width="1.5"/><text class="sm" x="303" y="135" text-anchor="middle" font-weight="700">Forward pull</text><line class="ln" x1="390" y1="130" x2="406" y2="130" marker-end="url(#ar)"/><text class="sub" x="222" y="170">Own outcomes and</text><text class="sub" x="222" y="187">shape a product</text><rect class="bp" x="408" y="112" width="170" height="36" rx="18" stroke-width="1.5"/><text class="sm" x="493" y="135" text-anchor="middle" font-weight="700">Costs understood</text><line class="ln" x1="580" y1="130" x2="596" y2="130" marker-end="url(#ar)"/><text class="sub" x="412" y="170">Travel, ambiguity,</text><text class="sub" x="412" y="187">context switching</text><rect class="bp" x="598" y="112" width="170" height="36" rx="18" stroke-width="1.5"/><text class="sm" x="683" y="135" text-anchor="middle" font-weight="700">One story</text><text class="sub" x="602" y="170">STAR, with numbers</text><text class="sub" x="602" y="187">and a result</text><text class="h2" x="28" y="230">Why this company?</text><rect class="bt" x="28" y="242" width="170" height="36" rx="18" stroke-width="1.5"/><text class="sm" x="113" y="265" text-anchor="middle" font-weight="700">Product surface</text><line class="ln" x1="200" y1="260" x2="216" y2="260" marker-end="url(#ar)"/><text class="sub" x="32" y="300">e.g. agents, MCP,</text><text class="sub" x="32" y="317">evals tooling</text><rect class="bt" x="218" y="242" width="170" height="36" rx="18" stroke-width="1.5"/><text class="sm" x="303" y="265" text-anchor="middle" font-weight="700">Customers' problem</text><line class="ln" x1="390" y1="260" x2="406" y2="260" marker-end="url(#ar)"/><text class="sub" x="222" y="300">e.g. pilots stuck at</text><text class="sub" x="222" y="317">security review</text><rect class="bt" x="408" y="242" width="170" height="36" rx="18" stroke-width="1.5"/><text class="sm" x="493" y="265" text-anchor="middle" font-weight="700">My evidence</text><line class="ln" x1="580" y1="260" x2="596" y2="260" marker-end="url(#ar)"/><text class="sub" x="412" y="300">OAuth2, PingFederate,</text><text class="sub" x="412" y="317">AD in healthcare</text><rect class="bt" x="598" y="242" width="170" height="36" rx="18" stroke-width="1.5"/><text class="sm" x="683" y="265" text-anchor="middle" font-weight="700">Dated research</text><text class="sub" x="602" y="300">A launch or posting</text><text class="sub" x="602" y="317">from this quarter</text><text class="sm" x="28" y="372">Test: if the answer would work for any company, it is too generic. Never "it's the hottest job".</text>
