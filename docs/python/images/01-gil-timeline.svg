<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">GIL timeline comparison</title>
  <desc id="d">Animation: a time cursor sweeps across three timelines in illustrative units. Two CPU-bound threads under one GIL take turns, so their running bars never overlap and the work finishes at 8 units. Two processes run in parallel and finish at 4 units. Two I/O-bound threads each run briefly, then wait on I/O with the GIL released; their waits overlap and both finish by 4.5 units.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .curt{fill:#f8fafc;opacity:.86}
    @media (prefers-color-scheme: dark){.curt{fill:#1f2430}}
    @keyframes cur{0%{transform:translateX(0)}85%,100%{transform:translateX(496px)}}
    .cur{animation:cur 14s infinite linear}
    @media (prefers-reduced-motion: reduce){.cur{animation:none;opacity:0}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="402" rx="14"/>
  <text class="h" x="28" y="40">The GIL: only waiting overlaps</text><text class="sub" x="28" y="62">Time in illustrative units. Solid = running Python bytecode, outline = waiting on I/O.</text><line class="grid" x1="190" y1="84" x2="190" y2="372"/><text class="sub" x="190" y="392" text-anchor="middle">0</text><line class="grid" x1="252" y1="84" x2="252" y2="372"/><text class="sub" x="252" y="392" text-anchor="middle">1</text><line class="grid" x1="314" y1="84" x2="314" y2="372"/><text class="sub" x="314" y="392" text-anchor="middle">2</text><line class="grid" x1="376" y1="84" x2="376" y2="372"/><text class="sub" x="376" y="392" text-anchor="middle">3</text><line class="grid" x1="438" y1="84" x2="438" y2="372"/><text class="sub" x="438" y="392" text-anchor="middle">4</text><line class="grid" x1="500" y1="84" x2="500" y2="372"/><text class="sub" x="500" y="392" text-anchor="middle">5</text><line class="grid" x1="562" y1="84" x2="562" y2="372"/><text class="sub" x="562" y="392" text-anchor="middle">6</text><line class="grid" x1="624" y1="84" x2="624" y2="372"/><text class="sub" x="624" y="392" text-anchor="middle">7</text><line class="grid" x1="686" y1="84" x2="686" y2="372"/><text class="sub" x="686" y="392" text-anchor="middle">8</text><text class="lbl" x="28" y="100">CPU-bound, 2 threads, one GIL</text><text class="sm" x="180" y="127" text-anchor="end">thread 1</text><rect class="pri" x="190" y="112" width="62" height="22" rx="4"/><rect class="pri" x="314" y="112" width="62" height="22" rx="4"/><rect class="pri" x="438" y="112" width="62" height="22" rx="4"/><rect class="pri" x="562" y="112" width="62" height="22" rx="4"/><text class="sm" x="180" y="157" text-anchor="end">thread 2</text><rect class="pri" x="252" y="142" width="62" height="22" rx="4"/><rect class="pri" x="376" y="142" width="62" height="22" rx="4"/><rect class="pri" x="500" y="142" width="62" height="22" rx="4"/><rect class="pri" x="624" y="142" width="62" height="22" rx="4"/><text class="lbl" x="28" y="196">CPU-bound, 2 processes</text><text class="sm" x="180" y="223" text-anchor="end">process 1</text><rect class="tea" x="190" y="208" width="248" height="22" rx="4"/><text class="sm" x="180" y="253" text-anchor="end">process 2</text><rect class="tea" x="190" y="238" width="248" height="22" rx="4"/><text class="lbl" x="28" y="292">I/O-bound, 2 threads</text><text class="sm" x="180" y="319" text-anchor="end">thread 1</text><rect class="pri" x="190" y="304" width="31" height="22" rx="4"/><rect class="pri" x="407" y="304" width="31" height="22" rx="4"/><rect class="bm" x="221" y="304" width="186" height="22" rx="4" stroke-width="1.5" stroke-dasharray="5 4"/><text class="sub" x="314" y="320" text-anchor="middle" style="font-size:12px">waiting on I/O (GIL released)</text><text class="sm" x="180" y="349" text-anchor="end">thread 2</text><rect class="pri" x="221" y="334" width="31" height="22" rx="4"/><rect class="pri" x="438" y="334" width="31" height="22" rx="4"/><rect class="bm" x="252" y="334" width="186" height="22" rx="4" stroke-width="1.5" stroke-dasharray="5 4"/><text class="sub" x="345" y="350" text-anchor="middle" style="font-size:12px">waiting on I/O (GIL released)</text><g class="cur"><rect class="curt" x="191" y="78" width="500" height="300"/><line class="lnw" x1="190" y1="80" x2="190" y2="376"/></g><text class="badt" x="772" y="100" text-anchor="end" style="font-size:13px">done at 8 units</text><text class="okt" x="772" y="196" text-anchor="end" style="font-size:13px">done at 4 units</text><text class="okt" x="772" y="292" text-anchor="end" style="font-size:13px">done at 4.5 units</text>
</svg>
