<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">git bisect binary search</title>
  <desc id="d">Animation: sixteen commits, c0 good and c15 bad. Step 1 tests c7, good, so the first bad commit is later. Step 2 tests c11, bad. Step 3 tests c9, good. Step 4 tests c10, good. So c11 is the first bad commit, found in four tests because log base 2 of 16 is 4. git bisect run with a test command automates every step. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes s0{0%,5.99%{opacity:0}6%,25.99%{opacity:1}26%,100%{opacity:0}}.s0{animation-name:s0}
    @keyframes s1{0%,25.99%{opacity:0}26%,45.99%{opacity:1}46%,100%{opacity:0}}.s1{animation-name:s1}
    @keyframes s2{0%,45.99%{opacity:0}46%,65.99%{opacity:1}66%,100%{opacity:0}}.s2{animation-name:s2}
    @keyframes s3{0%,65.99%{opacity:0}66%,85.99%{opacity:1}86%,100%{opacity:0}}.s3{animation-name:s3}
    @keyframes fin{0%,85.99%{opacity:0}86%,98.99%{opacity:1}99%,100%{opacity:0}}.fin{animation-name:fin}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.fin{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="328" rx="14"/>
  <text class="h" x="28" y="40">git bisect: find the first bad commit in four steps</text><text class="sub" x="28" y="62">16 commits between good and bad. Each test halves the range: log₂ 16 = 4. Illustrative.</text><rect class="box" x="40" y="120" width="36" height="36" rx="6"/><text class="sub" x="58" y="143" text-anchor="middle">c0</text><rect class="box" x="84" y="120" width="36" height="36" rx="6"/><text class="sub" x="102" y="143" text-anchor="middle">c1</text><rect class="box" x="128" y="120" width="36" height="36" rx="6"/><text class="sub" x="146" y="143" text-anchor="middle">c2</text><rect class="box" x="172" y="120" width="36" height="36" rx="6"/><text class="sub" x="190" y="143" text-anchor="middle">c3</text><rect class="box" x="216" y="120" width="36" height="36" rx="6"/><text class="sub" x="234" y="143" text-anchor="middle">c4</text><rect class="box" x="260" y="120" width="36" height="36" rx="6"/><text class="sub" x="278" y="143" text-anchor="middle">c5</text><rect class="box" x="304" y="120" width="36" height="36" rx="6"/><text class="sub" x="322" y="143" text-anchor="middle">c6</text><rect class="box" x="348" y="120" width="36" height="36" rx="6"/><text class="sub" x="366" y="143" text-anchor="middle">c7</text><rect class="box" x="392" y="120" width="36" height="36" rx="6"/><text class="sub" x="410" y="143" text-anchor="middle">c8</text><rect class="box" x="436" y="120" width="36" height="36" rx="6"/><text class="sub" x="454" y="143" text-anchor="middle">c9</text><rect class="box" x="480" y="120" width="36" height="36" rx="6"/><text class="sub" x="498" y="143" text-anchor="middle">c10</text><rect class="box" x="524" y="120" width="36" height="36" rx="6"/><text class="sub" x="542" y="143" text-anchor="middle">c11</text><rect class="box" x="568" y="120" width="36" height="36" rx="6"/><text class="sub" x="586" y="143" text-anchor="middle">c12</text><rect class="box" x="612" y="120" width="36" height="36" rx="6"/><text class="sub" x="630" y="143" text-anchor="middle">c13</text><rect class="box" x="656" y="120" width="36" height="36" rx="6"/><text class="sub" x="674" y="143" text-anchor="middle">c14</text><rect class="box" x="700" y="120" width="36" height="36" rx="6"/><text class="sub" x="718" y="143" text-anchor="middle">c15</text><text class="okt" x="58" y="110" text-anchor="middle" style="font-size:12px">good</text><text class="badt" x="718" y="110" text-anchor="middle" style="font-size:12px">bad</text><g class="k s0"><rect class="bw" x="36" y="114" width="704" height="48" rx="8" fill-opacity="0.35"/><rect class="okf" x="348" y="120" width="36" height="36" rx="6"/><text class="on13" x="366" y="143" text-anchor="middle">c7</text><text class="lbl" x="28" y="206">Step 1: range c0–c15, test c7 → good</text><text class="sm" x="28" y="230">the first bad commit is after c7</text></g><g class="k s1"><rect class="bw" x="388" y="114" width="352" height="48" rx="8" fill-opacity="0.35"/><rect class="badf" x="524" y="120" width="36" height="36" rx="6"/><text class="on13" x="542" y="143" text-anchor="middle">c11</text><text class="lbl" x="28" y="206">Step 2: range c8–c15, test c11 → bad</text><text class="sm" x="28" y="230">the first bad commit is at or before c11</text></g><g class="k s2"><rect class="bw" x="388" y="114" width="176" height="48" rx="8" fill-opacity="0.35"/><rect class="okf" x="436" y="120" width="36" height="36" rx="6"/><text class="on13" x="454" y="143" text-anchor="middle">c9</text><text class="lbl" x="28" y="206">Step 3: range c8–c11, test c9 → good</text><text class="sm" x="28" y="230">the first bad commit is after c9</text></g><g class="k s3"><rect class="bw" x="476" y="114" width="88" height="48" rx="8" fill-opacity="0.35"/><rect class="okf" x="480" y="120" width="36" height="36" rx="6"/><text class="on13" x="498" y="143" text-anchor="middle">c10</text><text class="lbl" x="28" y="206">Step 4: range c10–c11, test c10 → good</text><text class="sm" x="28" y="230">the first bad commit is after c10</text></g><g class="k fin"><rect class="badf" x="524" y="120" width="36" height="36" rx="6"/><text class="on13" x="542" y="143" text-anchor="middle">c11</text><text class="badt" x="28" y="206" style="font-size:15px">c11 is the first bad commit</text><text class="sm" x="28" y="230">git bisect run pytest -x tests/test_totals.py automates every step</text></g><rect class="bm" x="28" y="256" width="744" height="52" rx="8"/><text class="mono" x="42" y="278" xml:space="preserve">git bisect start HEAD v4      # bad, good</text><text class="mono" x="42" y="298" xml:space="preserve">git bisect run pytest -x -q tests/test_totals.py   # exit 0 = good, 1 = bad</text>
</svg>
