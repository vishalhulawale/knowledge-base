<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Scoring options against shared criteria</title>
  <desc id="d">A decision matrix for the caching disagreement. Three options are scored from 1 to 3 against four criteria both sides agreed on: p95 latency, data freshness, upstream load and operability. Cache everything scores well on latency and load but poorly on freshness, total 9. No caching scores well on freshness but poorly on latency and load, total 8. The hybrid, caching reference data with agreed TTLs and calling live for patient data, scores 11 and becomes the recorded decision in an ADR. Illustrative scores.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Cache vs no cache: agree the criteria first</text>
  <text class="sub" x="28" y="62">Illustrative scores, 1 (poor) to 3 (good). Criteria agreed by both sides before scoring.</text>
  <text class="sm" x="370" y="104" text-anchor="middle" font-weight="700">p95 latency</text>
  <text class="sm" x="466" y="104" text-anchor="middle" font-weight="700">freshness</text>
  <text class="sm" x="562" y="104" text-anchor="middle" font-weight="700">upstream load</text>
  <text class="sm" x="658" y="104" text-anchor="middle" font-weight="700">operability</text>
  <text class="sm" x="744" y="104" text-anchor="middle" font-weight="700">total</text>
  <rect class="box" x="28" y="118" width="744" height="52" rx="10" stroke-width="1"/>
  <text class="lbl" x="44" y="149">Cache everything (A)</text>
  <rect class="okf" x="348" y="130" width="44" height="28" rx="6"/>
  <text class="on" x="370" y="148.5" text-anchor="middle">3</text>
  <rect class="badf" x="444" y="130" width="44" height="28" rx="6"/>
  <text class="on" x="466" y="148.5" text-anchor="middle">1</text>
  <rect class="okf" x="540" y="130" width="44" height="28" rx="6"/>
  <text class="on" x="562" y="148.5" text-anchor="middle">3</text>
  <rect class="wrnf" x="636" y="130" width="44" height="28" rx="6"/>
  <text class="on" x="658" y="148.5" text-anchor="middle">2</text>
  <text class="h2" x="744" y="151" text-anchor="middle">9</text>
  <rect class="box" x="28" y="180" width="744" height="52" rx="10" stroke-width="1"/>
  <text class="lbl" x="44" y="211">No caching (B)</text>
  <rect class="badf" x="348" y="192" width="44" height="28" rx="6"/>
  <text class="on" x="370" y="210.5" text-anchor="middle">1</text>
  <rect class="okf" x="444" y="192" width="44" height="28" rx="6"/>
  <text class="on" x="466" y="210.5" text-anchor="middle">3</text>
  <rect class="badf" x="540" y="192" width="44" height="28" rx="6"/>
  <text class="on" x="562" y="210.5" text-anchor="middle">1</text>
  <rect class="okf" x="636" y="192" width="44" height="28" rx="6"/>
  <text class="on" x="658" y="210.5" text-anchor="middle">3</text>
  <text class="h2" x="744" y="213" text-anchor="middle">8</text>
  <rect class="bo" x="28" y="242" width="744" height="52" rx="10" stroke-width="1.5"/>
  <text class="lbl okt" x="44" y="264">Hybrid</text>
  <text class="sm" x="44" y="282">reference data cached, live patient data</text>
  <rect class="okf" x="348" y="254" width="44" height="28" rx="6"/>
  <text class="on" x="370" y="272.5" text-anchor="middle">3</text>
  <rect class="okf" x="444" y="254" width="44" height="28" rx="6"/>
  <text class="on" x="466" y="272.5" text-anchor="middle">3</text>
  <rect class="wrnf" x="540" y="254" width="44" height="28" rx="6"/>
  <text class="on" x="562" y="272.5" text-anchor="middle">2</text>
  <rect class="okf" x="636" y="254" width="44" height="28" rx="6"/>
  <text class="on" x="658" y="272.5" text-anchor="middle">3</text>
  <text class="h2 okt" x="744" y="275" text-anchor="middle">11</text>
  <text class="tx" x="28" y="334">Arguing positions (&quot;cache&quot; vs &quot;don&#x27;t cache&quot;) goes in circles; scoring against agreed criteria ends in an ADR.</text>
  <text class="sub" x="28" y="358">Then disagree and commit: whoever argued for A or B supports the hybrid fully.</text>
</svg>
