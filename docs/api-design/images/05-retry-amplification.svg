  <line class="lnt" x1="320" y1="324" x2="396" y2="372" marker-end="url(#art)"/>
  <rect class="badf" x="520" y="364" width="16" height="16" rx="3"/>
  <rect class="badf" x="542" y="364" width="16" height="16" rx="3"/>
  <rect class="badf" x="564" y="364" width="16" height="16" rx="3"/>
  <line class="lnw" x1="490" y1="372" x2="516" y2="372"/>
  <text class="h2 badt" x="600" y="200">27 calls to</text>
  <text class="h2 badt" x="600" y="222">claims-service</text>
  <text class="sub" x="28" y="414">Retry at one layer (usually closest to the failure), cap attempts, add jitter and a retry budget (≤ 10% extra load).</text>
</svg>
