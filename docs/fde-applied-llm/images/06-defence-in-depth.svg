<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Guardrails as layers</title>
  <desc id="d">Eight numbered layers around the model: identity and least privilege; input screening; minimisation and redaction of PHI; safe prompt assembly with untrusted content in data tags; the model with constrained output; output validation with schema, grounding and PHI scans; approval gates for side effects; and an audit log of who, purpose, documents, tools and decisions. Design for impact, not prevention.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="370" rx="14"/>
  <text class="h" x="28" y="40">Guardrails are layers, not a filter</text><text class="sub" x="28" y="62">No single layer is reliable alone; each one limits what gets past the others.</text><rect class="bt" x="28" y="92" width="176" height="92" rx="10" stroke-width="1.5"/><text class="teat" x="40" y="116" style="font-size:18px">1</text><text class="sm" x="62" y="116">Identity + least</text><text class="sm" x="62" y="134">privilege</text><text class="sub" x="40" y="158">user's token; tools</text><text class="sub" x="40" y="174">scoped to the task</text><line class="ln" x1="205" y1="138" x2="214" y2="138" marker-end="url(#ar)"/><rect class="bt" x="216" y="92" width="176" height="92" rx="10" stroke-width="1.5"/><text class="teat" x="228" y="116" style="font-size:18px">2</text><text class="sm" x="250" y="116">Input screening</text><text class="sub" x="228" y="158">injection classifier,</text><text class="sub" x="228" y="174">size limits</text><line class="ln" x1="393" y1="138" x2="402" y2="138" marker-end="url(#ar)"/><rect class="bt" x="404" y="92" width="176" height="92" rx="10" stroke-width="1.5"/><text class="teat" x="416" y="116" style="font-size:18px">3</text><text class="sm" x="438" y="116">Minimise + redact</text><text class="sub" x="416" y="158">minimum necessary;</text><text class="sub" x="416" y="174">pseudonymise PHI</text><line class="ln" x1="581" y1="138" x2="590" y2="138" marker-end="url(#ar)"/><rect class="bt" x="592" y="92" width="176" height="92" rx="10" stroke-width="1.5"/><text class="teat" x="604" y="116" style="font-size:18px">4</text><text class="sm" x="626" y="116">Safe prompt</text><text class="sm" x="626" y="134">assembly</text><text class="sub" x="604" y="158">untrusted content inside</text><text class="sub" x="604" y="174">data tags</text><rect class="bp" x="28" y="212" width="176" height="92" rx="10" stroke-width="1.5"/><text class="prit" x="40" y="236" style="font-size:18px">5</text><text class="sm" x="62" y="236">Model</text><text class="sub" x="40" y="278">constrained output</text><line class="ln" x1="205" y1="258" x2="214" y2="258" marker-end="url(#ar)"/><rect class="bt" x="216" y="212" width="176" height="92" rx="10" stroke-width="1.5"/><text class="teat" x="228" y="236" style="font-size:18px">6</text><text class="sm" x="250" y="236">Output validation</text><text class="sub" x="228" y="278">schema, grounding check,</text><text class="sub" x="228" y="294">PHI scan</text><line class="ln" x1="393" y1="258" x2="402" y2="258" marker-end="url(#ar)"/><rect class="bt" x="404" y="212" width="176" height="92" rx="10" stroke-width="1.5"/><text class="teat" x="416" y="236" style="font-size:18px">7</text><text class="sm" x="438" y="236">Approval gates</text><text class="sub" x="416" y="278">humans approve side</text><text class="sub" x="416" y="294">effects</text><line class="ln" x1="581" y1="258" x2="590" y2="258" marker-end="url(#ar)"/><rect class="bw" x="592" y="212" width="176" height="92" rx="10" stroke-width="1.5"/><text class="prit" x="604" y="236" style="font-size:18px">8</text><text class="sm" x="626" y="236">Audit log</text><text class="sub" x="604" y="278">who, purpose, docs,</text><text class="sub" x="604" y="294">tools, decisions</text><path class="ln" d="M 752 138 C 790 160, 790 190, 30 196 L 30 206" opacity="0"/><text class="sm" x="28" y="352">Design for impact, not prevention: assume an injection will sometimes succeed and make sure it can't do much.</text>
</svg>
