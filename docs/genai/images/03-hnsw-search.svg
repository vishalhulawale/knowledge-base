  <g class="a s6"><line class="lnp" x1="525" y1="346" x2="598" y2="378" marker-end="url(#arp)"/><circle class="pri" cx="598" cy="378" r="7"/></g>
  <g class="a s7"><circle class="okf" cx="598" cy="378" r="8"/><circle class="okf" cx="560" cy="362" r="8"/><circle class="okf" cx="525" cy="346" r="8"/><circle class="okf" cx="492" cy="347" r="8"/><text class="okt" x="600" y="452" text-anchor="middle" font-size="13">top-k returned</text></g>
  <rect class="bp" x="644" y="84" width="136" height="346" rx="10" stroke-width="1.2"/>
  <text class="prit" x="712" y="110" text-anchor="middle" font-size="14">Build knobs</text>
  <text class="sm" x="712" y="132" text-anchor="middle">m = 16</text>
  <text class="sm" x="712" y="148" text-anchor="middle">links per node</text>
  <text class="sm" x="712" y="172" text-anchor="middle">ef_construction</text>
  <text class="sm" x="712" y="188" text-anchor="middle">= 64 candidates</text>
  <text class="prit" x="712" y="222" text-anchor="middle" font-size="14">Query knob</text>
  <text class="sm" x="712" y="244" text-anchor="middle">ef_search = 40</text>
  <text class="sm" x="712" y="260" text-anchor="middle">higher = better</text>
  <text class="sm" x="712" y="276" text-anchor="middle">recall, slower</text>
  <text class="prit" x="712" y="310" text-anchor="middle" font-size="14">Cost</text>
  <text class="sm" x="712" y="332" text-anchor="middle">visits ~log N</text>
  <text class="sm" x="712" y="348" text-anchor="middle">nodes; whole</text>
  <text class="sm" x="712" y="364" text-anchor="middle">graph in RAM</text>
  <text class="sub" x="712" y="410" text-anchor="middle">pgvector defaults</text>
  <g class="a s8"><text class="tx" x="28" y="480">Visited about a dozen nodes, not all of them: that is why it is <tspan class="wrnt">approximate</tspan>.</text>
  <text class="sub" x="28" y="500">A greedy path can miss the true nearest neighbour; raising ef_search widens the candidate list.</text></g>
</svg>
