<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">The dependency rule</title>
  <desc id="d">Four concentric rings: Entities at the centre, then Use cases, Interface adapters, and Frameworks and drivers on the outside. Green arrows cross each ring boundary pointing inward. A red dashed arrow from the centre outward is crossed out. A legend lists examples: frameworks and drivers are Spring MVC, JPA, the Kafka client, PostgreSQL and React; interface adapters are controllers, resolvers, listeners, repository implementations and mappers; use cases are services, ports, transactions and orchestration; entities are the Order aggregate, Money, invariants and domain events in plain Java. A JPA annotation, dependency injection annotation or Kafka type inside the inner rings is forbidden.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="498" rx="14"/>
  <text class="h" x="28" y="40">The dependency rule</text><text class="sub" x="28" y="62">Source-code dependencies point inwards only (after Robert C. Martin, 2012).</text><circle class="bm" cx="290" cy="282" r="200" stroke-width="1.5"/><circle class="bt" cx="290" cy="282" r="150" stroke-width="1.5"/><circle class="bp" cx="290" cy="282" r="100" stroke-width="1.5"/><circle class="bw" cx="290" cy="282" r="50" stroke-width="1.5"/><text class="lbl" x="290" y="112" text-anchor="middle">Frameworks &amp; drivers</text><text class="lbl" x="290" y="162" text-anchor="middle">Interface adapters</text><text class="lbl" x="290" y="212" text-anchor="middle">Use cases</text><text class="lbl" x="290" y="288" text-anchor="middle">Entities</text><line class="lno" x1="151.407" y1="420.593" x2="179.691" y2="392.309" marker-end="url(#aro)"/><line class="lno" x1="186.762" y1="385.238" x2="215.047" y2="356.953" marker-end="url(#aro)"/><line class="lno" x1="222.118" y1="349.882" x2="250.402" y2="321.598" marker-end="url(#aro)"/><line class="lnb dash" x1="311.213" y1="303.213" x2="428.593" y2="420.593" marker-end="url(#arb)"/><circle class="card" cx="374.9" cy="366.9" r="13"/><text class="badt" x="374.853" y="372.853" text-anchor="middle" style="font-size:18px">✗</text><text class="lbl" x="520" y="112">Frameworks &amp; drivers</text><text class="sm" x="520" y="132">Spring MVC, JPA/Hibernate,</text><text class="sm" x="520" y="150">Kafka client, PostgreSQL, React</text><text class="lbl" x="520" y="178">Interface adapters</text><text class="sm" x="520" y="198">controllers, resolvers, listeners,</text><text class="sm" x="520" y="216">repository impls, mappers</text><text class="lbl" x="520" y="244">Use cases</text><text class="sm" x="520" y="264">PlaceOrderService, ports,</text><text class="sm" x="520" y="282">transactions, orchestration</text><text class="lbl" x="520" y="310">Entities</text><text class="sm" x="520" y="330">Order, Money, invariants,</text><text class="sm" x="520" y="348">domain events: plain Java</text><rect class="bb" x="512" y="392" width="264" height="70" rx="8" stroke-width="1.5"/><text class="sm" x="526" y="416">Forbidden: @Entity, @Autowired or</text><text class="sm" x="526" y="434">a Kafka type inside Entities or</text><text class="sm" x="526" y="452">Use cases (an outward dependency)</text>
</svg>
