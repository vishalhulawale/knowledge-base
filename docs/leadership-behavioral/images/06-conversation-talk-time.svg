<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Who talks in a difficult conversation</title>
  <desc id="d">Four phases of a 30-minute performance conversation and the rough share of talking in each. Open, about 2 minutes: the lead talks most, stating the topic and intent directly. SBI, about 3 minutes: the lead describes situation, behaviour and impact. Ask and listen, the longest phase at about 15 minutes: the engineer talks most, and this is where the real cause usually comes out. Agree next steps, about 10 minutes: shared, ending in concrete commitments and a follow-up date. Illustrative timings.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .me{fill:#4f46e5}.th{fill:#0ea5a4}@media (prefers-color-scheme: dark){.me{fill:#6366f1}.th{fill:#0d9488}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">A 30-minute conversation, phase by phase</text>
  <text class="sub" x="28" y="62">Bar width = time; colour split = who&#x27;s talking. Illustrative.</text>
  <rect class="me" x="29" y="120" width="38.08" height="50" rx="4"/>
  <rect class="th" x="67.08" y="120" width="9.52" height="50" rx="4"/>
  <text class="sm" x="32" y="96" font-weight="700">Open (2′)</text>
  <rect class="me" x="78.6" y="120" width="54.3" height="50" rx="4"/>
  <rect class="th" x="132.9" y="120" width="18.1" height="50" rx="4"/>
  <text class="sm" x="81.6" y="110" font-weight="700">SBI (3′)</text>
  <rect class="me" x="153" y="120" width="92.5" height="50" rx="4"/>
  <rect class="th" x="245.5" y="120" width="277.5" height="50" rx="4"/>
  <text class="sm" x="156" y="110" font-weight="700">Ask and listen (15′)</text>
  <rect class="me" x="525" y="120" width="123" height="50" rx="4"/>
  <rect class="th" x="648" y="120" width="123" height="50" rx="4"/>
  <text class="sm" x="528" y="110" font-weight="700">Agree next steps (10′)</text>
  <text class="sm" x="158" y="194">&quot;What&#x27;s getting in the way?&quot;</text>
  <text class="sm" x="530" y="194">goals, support, follow-up date</text>
  <text class="sm" x="28" y="222">open: &quot;I want to talk about the missed releases&quot; · SBI: situation, behaviour, impact</text>
  <rect class="me" x="28" y="250" width="16" height="16" rx="3"/>
  <text class="sm" x="52" y="263">tech lead talking</text>
  <rect class="th" x="200" y="250" width="16" height="16" rx="3"/>
  <text class="sm" x="224" y="263">engineer talking</text>
  <text class="tx" x="28" y="310">Most of the time belongs to them: the cause (clarity, skill, context, will) only shows up if you ask and listen.</text>
  <text class="sub" x="28" y="334">Before: facts and examples. After: a written summary and the follow-up on the calendar.</text>
</svg>
