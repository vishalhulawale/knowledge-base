<text class="sub" x="40" y="210" text-anchor="middle" transform="rotate(-90 40 210)">queue wait (× service time)</text>
<text class="sub" x="305.0" y="362" text-anchor="middle">utilisation ρ</text>
<line x1="636" y1="86" x2="636" y2="350" class="sax"/>
<text class="lbl" x="652" y="104">Little's law</text>
<text class="lbl tp" x="652" y="132">L = λ × W</text>
<text class="sm" x="652" y="162">400 req/s × 0.05 s</text>
<text class="sm" x="652" y="180">≈ 20 in flight, so a</text>
<text class="sm" x="652" y="198">pool of ~30–40</text>
<text class="sm" x="652" y="232">A slow dependency</text>
<text class="sm" x="652" y="250">raises W, so L rises</text>
<text class="sm" x="652" y="268">at the same λ and</text>
<text class="sm" x="652" y="286">threads fill up.</text>
<text class="sm b" x="652" y="312">Bound L with limits.</text>
<text class="sub" x="28" y="384">M/M/1 approximation: wait ≈ ρ/(1−ρ) × service time. Capacity targets usually sit at 50–70%.</text>

</svg>
