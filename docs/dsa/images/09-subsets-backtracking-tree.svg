  <g class="fr f2"><rect class="tint" x="212" y="97" width="76" height="30" rx="15"/><text class="t" x="250" y="117" text-anchor="middle">[]</text><rect class="tint" x="62" y="177" width="76" height="30" rx="15"/><text class="t" x="100" y="197" text-anchor="middle">[1]</text><line class="ln spri" x1="250" y1="126" x2="100" y2="178" stroke-width="3"/><line class="ln spri" x1="100" y1="206" x2="50" y2="258" stroke-width="3"/><rect class="pri" x="12" y="257" width="76" height="30" rx="15"/><text class="on" x="50" y="277" text-anchor="middle">[1,2]</text><rect class="pri" x="520" y="114" width="34" height="34" rx="6"/><text class="on" x="537" y="136" text-anchor="middle">1</text><rect class="pri" x="560" y="114" width="34" height="34" rx="6"/><text class="on" x="577" y="136" text-anchor="middle">2</text><text class="t" x="520" y="212">1. []</text><text class="t" x="640" y="212">2. [1]</text><text class="tb" x="520" y="234">3. [1,2]</text><text class="t" x="520" y="320">Choose 2: record [1,2].</text></g>
  <g class="fr f3"><rect class="tint" x="212" y="97" width="76" height="30" rx="15"/><text class="t" x="250" y="117" text-anchor="middle">[]</text><rect class="tint" x="62" y="177" width="76" height="30" rx="15"/><text class="t" x="100" y="197" text-anchor="middle">[1]</text><rect class="tint" x="12" y="257" width="76" height="30" rx="15"/><text class="t" x="50" y="277" text-anchor="middle">[1,2]</text><line class="ln spri" x1="250" y1="126" x2="100" y2="178" stroke-width="3"/><line class="ln spri" x1="100" y1="206" x2="50" y2="258" stroke-width="3"/><line class="ln spri" x1="50" y1="286" x2="50" y2="338" stroke-width="3"/><rect class="pri" x="12" y="337" width="76" height="30" rx="15"/><text class="on" x="50" y="357" text-anchor="middle">[1,2,3]</text><rect class="pri" x="520" y="114" width="34" height="34" rx="6"/><text class="on" x="537" y="136" text-anchor="middle">1</text><rect class="pri" x="560" y="114" width="34" height="34" rx="6"/><text class="on" x="577" y="136" text-anchor="middle">2</text><rect class="pri" x="600" y="114" width="34" height="34" rx="6"/><text class="on" x="617" y="136" text-anchor="middle">3</text><text class="t" x="520" y="212">1. []</text><text class="t" x="640" y="212">2. [1]</text><text class="t" x="520" y="234">3. [1,2]</text><text class="tb" x="640" y="234">4. [1,2,3]</text><text class="t" x="520" y="320">Choose 3: record [1,2,3].</text></g>
