<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Bug catch pipeline</title>
  <desc id="d">Animation: four bugs move through a pipeline of four stages: pull request with unit and slice tests, merge with Testcontainers integration tests, test environment with contract checks and smoke tests, and production with a canary. A logic bug is caught by a unit test at the pull request. A SQL bug is caught by a Postgres integration test at merge. A renamed field is caught by can-i-deploy in the test environment. A configuration bug is only caught by the production canary and rolled back. The cost to fix grows from minutes to an incident. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    .mv{animation:14s infinite ease-in-out}
    @keyframes mv0{0%,3%{transform:translateX(0)}15%,100%{transform:translateX(85px)}}.mv0{animation-name:mv0}
    @keyframes c0{0%,14.99%{opacity:0}15%,100%{opacity:1}}.c0{animation-name:c0}
    @keyframes mv1{0%,25%{transform:translateX(0)}37%,100%{transform:translateX(241px)}}.mv1{animation-name:mv1}
    @keyframes c1{0%,36.99%{opacity:0}37%,100%{opacity:1}}.c1{animation-name:c1}
    @keyframes mv2{0%,47%{transform:translateX(0)}59%,100%{transform:translateX(397px)}}.mv2{animation-name:mv2}
    @keyframes c2{0%,58.99%{opacity:0}59%,100%{opacity:1}}.c2{animation-name:c2}
    @keyframes mv3{0%,69%{transform:translateX(0)}81%,100%{transform:translateX(553px)}}.mv3{animation-name:mv3}
    @keyframes c3{0%,80.99%{opacity:0}81%,100%{opacity:1}}.c3{animation-name:c3}
    @media (prefers-reduced-motion: reduce){.k,.mv{animation:none}.k{opacity:1}.mv0{transform:translateX(85px)}.mv1{transform:translateX(241px)}.mv2{transform:translateX(397px)}.mv3{transform:translateX(553px)}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="410" rx="14"/>
  <text class="h" x="28" y="40">Where each bug gets caught</text><text class="sub" x="28" y="62">Each stage stops only the defects its tests can see. Illustrative.</text><rect class="bp" x="150" y="84" width="150" height="50" rx="8" stroke-width="1.4"/><text class="lbl" x="225" y="105" text-anchor="middle">PR</text><text class="sub" x="225" y="124" text-anchor="middle">unit + slice</text><line class="grid" x1="300" y1="146" x2="300" y2="360"/><rect class="bp" x="306" y="84" width="150" height="50" rx="8" stroke-width="1.4"/><text class="lbl" x="381" y="105" text-anchor="middle">Merge</text><text class="sub" x="381" y="124" text-anchor="middle">Testcontainers IT</text><line class="grid" x1="456" y1="146" x2="456" y2="360"/><rect class="bp" x="462" y="84" width="150" height="50" rx="8" stroke-width="1.4"/><text class="lbl" x="537" y="105" text-anchor="middle">Test env</text><text class="sub" x="537" y="124" text-anchor="middle">contract + smoke</text><line class="grid" x1="612" y1="146" x2="612" y2="360"/><rect class="bw" x="618" y="84" width="150" height="50" rx="8" stroke-width="1.4"/><text class="lbl" x="693" y="105" text-anchor="middle">Production</text><text class="sub" x="693" y="124" text-anchor="middle">canary</text><text class="lbl" x="28" y="175">Logic bug</text><line class="grid" x1="140" y1="170" x2="225" y2="170" stroke-dasharray="4 4"/><g class="mv mv0"><circle class="wrnf" cx="140" cy="170" r="9"/></g><g class="k c0"><circle class="badf" cx="225" cy="170" r="11"/><text class="on13" x="225" y="174" text-anchor="middle">✕</text><text class="badt" x="225" y="197" text-anchor="middle" style="font-size:12px">caught: unit test</text></g><text class="lbl" x="28" y="225">SQL bug</text><line class="grid" x1="140" y1="220" x2="381" y2="220" stroke-dasharray="4 4"/><g class="mv mv1"><circle class="wrnf" cx="140" cy="220" r="9"/></g><g class="k c1"><circle class="badf" cx="381" cy="220" r="11"/><text class="on13" x="381" y="224" text-anchor="middle">✕</text><text class="badt" x="381" y="247" text-anchor="middle" style="font-size:12px">caught: Postgres IT</text></g><text class="lbl" x="28" y="275">Renamed field</text><line class="grid" x1="140" y1="270" x2="537" y2="270" stroke-dasharray="4 4"/><g class="mv mv2"><circle class="wrnf" cx="140" cy="270" r="9"/></g><g class="k c2"><circle class="badf" cx="537" cy="270" r="11"/><text class="on13" x="537" y="274" text-anchor="middle">✕</text><text class="badt" x="537" y="297" text-anchor="middle" style="font-size:12px">caught: can-i-deploy</text></g><text class="lbl" x="28" y="325">Config bug</text><line class="grid" x1="140" y1="320" x2="693" y2="320" stroke-dasharray="4 4"/><g class="mv mv3"><circle class="wrnf" cx="140" cy="320" r="9"/></g><g class="k c3"><circle class="badf" cx="693" cy="320" r="11"/><text class="on13" x="693" y="324" text-anchor="middle">✕</text><text class="badt" x="693" y="347" text-anchor="middle" style="font-size:12px">caught: canary rollback</text></g><path class="lnb" d="M 160 372 L 760 372" marker-end="url(#arb)"/><text class="sub" x="225" y="392" text-anchor="middle">minutes</text><text class="sub" x="381" y="392" text-anchor="middle">tens of minutes</text><text class="sub" x="537" y="392" text-anchor="middle">hours</text><text class="sub" x="693" y="392" text-anchor="middle">incident</text><text class="sub" x="28" y="376">cost</text><text class="sub" x="28" y="392">to fix</text>
</svg>
