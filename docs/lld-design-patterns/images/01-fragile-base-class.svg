<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Fragile base class: InstrumentedSet counts twice</title>
  <desc id="d">Two versions of a set that counts how many elements were added, each given addAll of three elements. Left, extends HashSet: the overridden addAll adds 3 to the count and calls super.addAll, and HashSet&#x27;s addAll internally calls add for each element, which is the subclass&#x27;s overridden add, adding 1 three more times: the count is 6. Right, a wrapper that holds a Set and forwards to it: addAll adds 3 and calls delegate.addAll; the delegate&#x27;s internal add calls are its own, so the count is 3.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">addAll(List.of(a, b, c)): what is getAddCount()?</text>
  <text class="sub" x="28" y="62">Effective Java, Item 18. Same intent, inheritance vs composition.</text>
  <line class="ln dash" x1="400" y1="84" x2="400" y2="320"/>
  <text class="h2 badt" x="28" y="104">extends HashSet</text>
  <rect class="bp" x="28" y="120" width="340" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="198" y="145" text-anchor="middle" font-weight="600">addAll(c): count += 3; super.addAll(c)</text>
  <rect class="bm" x="28" y="190" width="340" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="198" y="215" text-anchor="middle" font-weight="600">HashSet.addAll → this.add(e) for each</text>
  <rect class="bb" x="28" y="260" width="340" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="198" y="285" text-anchor="middle" font-weight="600">our add(e): count += 1   (× 3)</text>
  <line class="ln" x1="198" y1="160" x2="198" y2="186" marker-end="url(#ar)"/>
  <line class="lnb" x1="198" y1="230" x2="198" y2="256" marker-end="url(#arb)"/>
  <text class="sm badt" x="212" y="248">self-use → our override</text>
  <text class="lbl badt" x="28" y="336">count = 6 ✕</text>
  <text class="h2 okt" x="420" y="104">wraps a Set (forwarding)</text>
  <rect class="bp" x="420" y="120" width="352" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="596" y="145" text-anchor="middle" font-weight="600">addAll(c): count += 3; delegate.addAll(c)</text>
  <rect class="bm" x="420" y="190" width="352" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="596" y="215" text-anchor="middle" font-weight="600">delegate (any Set) adds a, b, c itself</text>
  <rect class="bo" x="420" y="260" width="352" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="596" y="285" text-anchor="middle" font-weight="600">our add(e) is never called</text>
  <line class="ln" x1="596" y1="160" x2="596" y2="186" marker-end="url(#ar)"/>
  <line class="ln dash" x1="596" y1="230" x2="596" y2="256"/>
  <text class="lbl okt" x="420" y="336">count = 3 ✓</text>
  <text class="sub" x="28" y="366">The subclass depended on HashSet&#x27;s private implementation choice. The wrapper only depends on the Set contract.</text>
</svg>
