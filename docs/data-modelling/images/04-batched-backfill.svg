  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="426" rx="14"/>
  <text class="h" x="28" y="40">Backfilling 50 million rows</text><text class="sub" x="28" y="62">Same work, two ways. Lag values and timings illustrative.</text><rect class="bm" x="20" y="80" width="372" height="300" rx="10" stroke-width="1.2"/><text class="badt" x="36" y="106" style="font-size:15px">One UPDATE, one transaction</text><text class="sub" x="36" y="136">progress</text><rect class="box" x="36" y="144" width="340" height="26" rx="5" stroke-width="1.2"/><text class="sub" x="36" y="196">row locks held</text><rect class="box" x="36" y="204" width="340" height="18" rx="5" stroke-width="1.2"/><text class="sub" x="36" y="252">replica lag</text><text class="sub" x="36" y="300">if it fails at 90%</text><rect class="bm" x="408" y="80" width="372" height="300" rx="10" stroke-width="1.2"/><text class="okt" x="424" y="106" style="font-size:15px">Batches of 10k rows by id range</text><text class="sub" x="424" y="136">progress</text><rect class="box" x="424" y="144" width="340" height="26" rx="5" stroke-width="1.2"/><text class="sub" x="424" y="196">row locks held</text><rect class="box" x="424" y="204" width="340" height="18" rx="5" stroke-width="1.2"/><text class="sub" x="424" y="252">replica lag</text><text class="sub" x="424" y="300">if it fails at 90%</text><g class="k g0"><rect class="wrnf" x="36" y="146" width="32" height="22" rx="3"/><rect class="badf" x="36" y="206" width="34" height="14" rx="2"/></g><g class="k l0"><text class="badt" x="36" y="280" style="font-size:18px">1 s and growing</text></g><g class="k g1"><rect class="wrnf" x="70" y="146" width="32" height="22" rx="3"/><rect class="badf" x="70" y="206" width="34" height="14" rx="2"/></g><g class="k l1"><text class="badt" x="36" y="280" style="font-size:18px">4 s and growing</text></g><g class="k g2"><rect class="wrnf" x="104" y="146" width="32" height="22" rx="3"/><rect class="badf" x="104" y="206" width="34" height="14" rx="2"/></g><g class="k l2"><text class="badt" x="36" y="280" style="font-size:18px">9 s and growing</text></g><g class="k g3"><rect class="wrnf" x="138" y="146" width="32" height="22" rx="3"/><rect class="badf" x="138" y="206" width="34" height="14" rx="2"/></g><g class="k l3"><text class="badt" x="36" y="280" style="font-size:18px">16 s and growing</text></g><g class="k g4"><rect class="wrnf" x="172" y="146" width="32" height="22" rx="3"/><rect class="badf" x="172" y="206" width="34" height="14" rx="2"/></g><g class="k l4"><text class="badt" x="36" y="280" style="font-size:18px">24 s and growing</text></g><g class="k g5"><rect class="wrnf" x="206" y="146" width="32" height="22" rx="3"/><rect class="badf" x="206" y="206" width="34" height="14" rx="2"/></g><g class="k l5"><text class="badt" x="36" y="280" style="font-size:18px">35 s and growing</text></g><g class="k g6"><rect class="wrnf" x="240" y="146" width="32" height="22" rx="3"/><rect class="badf" x="240" y="206" width="34" height="14" rx="2"/></g><g class="k l6"><text class="badt" x="36" y="280" style="font-size:18px">48 s and growing</text></g><g class="k g7"><rect class="wrnf" x="274" y="146" width="32" height="22" rx="3"/><rect class="badf" x="274" y="206" width="34" height="14" rx="2"/></g><g class="k l7"><text class="badt" x="36" y="280" style="font-size:18px">64 s and growing</text></g><g class="k g8"><rect class="wrnf" x="308" y="146" width="32" height="22" rx="3"/><rect class="badf" x="308" y="206" width="34" height="14" rx="2"/></g><g class="k l8"><text class="badt" x="36" y="280" style="font-size:18px">85 s and growing</text></g><g class="k g9"><rect class="wrnf" x="342" y="146" width="32" height="22" rx="3"/><rect class="badf" x="342" y="206" width="34" height="14" rx="2"/></g><g class="k l9"><text class="badt" x="36" y="280" style="font-size:18px">110 s and growing</text></g><g class="k fx"><text class="badt" x="36" y="280" style="font-size:18px">110 s, replicas far behind</text></g><g class="k fx"><text class="badt" x="36" y="326" style="font-size:15px">all 45M updated rows roll back</text><text class="sm" x="36" y="348">and the next attempt starts from zero</text></g><text class="sub" x="36" y="368">uncommitted until the very end</text><g class="k g0"><rect class="okf" x="424" y="146" width="32" height="22" rx="3"/><rect class="tea" x="438" y="206" width="6" height="14" rx="1"/></g><g class="k l0"><text class="okt" x="424" y="280" style="font-size:16px">under 1 s   ·   last_id = 5,000,000</text></g><g class="k g1"><rect class="okf" x="458" y="146" width="32" height="22" rx="3"/><rect class="tea" x="472" y="206" width="6" height="14" rx="1"/></g><g class="k l1"><text class="okt" x="424" y="280" style="font-size:16px">under 1 s   ·   last_id = 10,000,000</text></g><g class="k g2"><rect class="okf" x="492" y="146" width="32" height="22" rx="3"/><rect class="tea" x="506" y="206" width="6" height="14" rx="1"/></g><g class="k l2"><text class="okt" x="424" y="280" style="font-size:16px">under 1 s   ·   last_id = 15,000,000</text></g><g class="k g3"><rect class="okf" x="526" y="146" width="32" height="22" rx="3"/><rect class="tea" x="540" y="206" width="6" height="14" rx="1"/></g><g class="k l3"><text class="okt" x="424" y="280" style="font-size:16px">under 1 s   ·   last_id = 20,000,000</text></g><g class="k g4"><rect class="okf" x="560" y="146" width="32" height="22" rx="3"/><rect class="tea" x="574" y="206" width="6" height="14" rx="1"/></g><g class="k l4"><text class="okt" x="424" y="280" style="font-size:16px">under 1 s   ·   last_id = 25,000,000</text></g><g class="k g5"><rect class="okf" x="594" y="146" width="32" height="22" rx="3"/><rect class="tea" x="608" y="206" width="6" height="14" rx="1"/></g><g class="k l5"><text class="okt" x="424" y="280" style="font-size:16px">under 1 s   ·   last_id = 30,000,000</text></g><g class="k g6"><rect class="okf" x="628" y="146" width="32" height="22" rx="3"/><rect class="tea" x="642" y="206" width="6" height="14" rx="1"/></g><g class="k l6"><text class="okt" x="424" y="280" style="font-size:16px">under 1 s   ·   last_id = 35,000,000</text></g><g class="k g7"><rect class="okf" x="662" y="146" width="32" height="22" rx="3"/><rect class="tea" x="676" y="206" width="6" height="14" rx="1"/></g><g class="k l7"><text class="okt" x="424" y="280" style="font-size:16px">under 1 s   ·   last_id = 40,000,000</text></g><g class="k g8"><rect class="okf" x="696" y="146" width="32" height="22" rx="3"/><rect class="tea" x="710" y="206" width="6" height="14" rx="1"/></g><g class="k l8"><text class="okt" x="424" y="280" style="font-size:16px">under 1 s   ·   last_id = 45,000,000</text></g><g class="k g9"><rect class="okf" x="730" y="146" width="32" height="22" rx="3"/><rect class="tea" x="744" y="206" width="6" height="14" rx="1"/></g><g class="k l9"><text class="okt" x="424" y="280" style="font-size:16px">under 1 s   ·   last_id = 50,000,000</text></g><g class="k fx"><text class="okt" x="424" y="280" style="font-size:16px">under 1 s   ·   last_id = 45,000,000</text></g><g class="k fx"><text class="okt" x="424" y="326" style="font-size:15px">45M rows already committed</text><text class="sm" x="424" y="348">resume from last_id</text></g><text class="sub" x="424" y="368">each block = 500 committed batches</text><text class="sm" x="28" y="408">Keyset batches, commit each, sleep or check lag between batches, WHERE new_col IS NULL keeps reruns safe.</text>
</svg>
