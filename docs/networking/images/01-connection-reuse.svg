<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Connection reuse vs a new connection per call</title>
  <desc id="d">A timeline comparing three sequential HTTPS calls to the same upstream with a 20 millisecond round-trip time. Top row, a new connection per call: each call pays a TCP handshake (1 RTT), a TLS 1.3 handshake (1 RTT) and the request itself (1 RTT), so three calls take 9 RTT, about 180 milliseconds, and each closed connection leaves a socket in TIME_WAIT. Bottom row, a pooled keep-alive connection: the handshakes are paid once, then the three requests take 1 RTT each, so the total is 5 RTT, about 100 milliseconds. Simplified: ignores server time, TCP slow start and TLS session resumption; TLS 1.2 would add another RTT per handshake.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnb{stroke:#dc2626;stroke-width:3;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnb{stroke:#f87171}.ah{fill:#94a3b8}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .g{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:12s infinite linear}
    .a{opacity:0;animation:12s infinite linear}
    .cur{animation:cur 12s infinite linear}
    @keyframes b00{0%,6.0%{transform:scaleX(0)}14.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b00t{0%,14.0%{opacity:0}14.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b01{0%,14.0%{transform:scaleX(0)}22.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b01t{0%,22.0%{opacity:0}22.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b02{0%,22.0%{transform:scaleX(0)}30.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b02t{0%,30.0%{opacity:0}30.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b03{0%,30.0%{transform:scaleX(0)}38.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b03t{0%,38.0%{opacity:0}38.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b04{0%,38.0%{transform:scaleX(0)}46.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b04t{0%,46.0%{opacity:0}46.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b05{0%,46.0%{transform:scaleX(0)}54.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b05t{0%,54.0%{opacity:0}54.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b06{0%,54.0%{transform:scaleX(0)}62.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b06t{0%,62.0%{opacity:0}62.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b07{0%,62.0%{transform:scaleX(0)}70.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b07t{0%,70.0%{opacity:0}70.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b08{0%,70.0%{transform:scaleX(0)}78.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b08t{0%,78.0%{opacity:0}78.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes tot0{0%,78.0%{opacity:0}79.0%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b10{0%,6.0%{transform:scaleX(0)}14.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b10t{0%,14.0%{opacity:0}14.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b11{0%,14.0%{transform:scaleX(0)}22.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b11t{0%,22.0%{opacity:0}22.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b12{0%,22.0%{transform:scaleX(0)}30.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b12t{0%,30.0%{opacity:0}30.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b13{0%,30.0%{transform:scaleX(0)}38.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b13t{0%,38.0%{opacity:0}38.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b14{0%,38.0%{transform:scaleX(0)}46.0%,92%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
    @keyframes b14t{0%,46.0%{opacity:0}46.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes tot1{0%,46.0%{opacity:0}47.0%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes cur{0%,6%{transform:translateX(0);opacity:1}78%{transform:translateX(576px);opacity:1}80%,100%{transform:translateX(576px);opacity:0}}
    @media (prefers-reduced-motion: reduce){
      .g,.a,.cur{animation:none}.g{transform:none}.a{opacity:1}.cur{opacity:0}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="328" rx="14"/>
  <text class="h" x="28" y="40">Three HTTPS calls: new connections vs a pooled one</text>
  <text class="sub" x="28" y="62">RTT 20 ms, sequential calls, server time ignored. Handshakes are pure network latency.</text>
  <text class="lbl" x="28" y="126">New connection</text>
  <text class="lbl" x="28" y="144">per call</text>
  <rect class="box" x="200" y="106" width="576" height="32" rx="4"/>
  <rect class="pri g" style="animation-name:b00" x="201" y="107" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b00t" x="232" y="126" text-anchor="middle">TCP</text>
  <rect class="tea g" style="animation-name:b01" x="265" y="107" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b01t" x="296" y="126" text-anchor="middle">TLS</text>
  <rect class="okf g" style="animation-name:b02" x="329" y="107" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b02t" x="360" y="126" text-anchor="middle">req</text>
  <rect class="pri g" style="animation-name:b03" x="393" y="107" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b03t" x="424" y="126" text-anchor="middle">TCP</text>
  <rect class="tea g" style="animation-name:b04" x="457" y="107" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b04t" x="488" y="126" text-anchor="middle">TLS</text>
  <rect class="okf g" style="animation-name:b05" x="521" y="107" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b05t" x="552" y="126" text-anchor="middle">req</text>
  <rect class="pri g" style="animation-name:b06" x="585" y="107" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b06t" x="616" y="126" text-anchor="middle">TCP</text>
  <rect class="tea g" style="animation-name:b07" x="649" y="107" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b07t" x="680" y="126" text-anchor="middle">TLS</text>
  <rect class="okf g" style="animation-name:b08" x="713" y="107" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b08t" x="744" y="126" text-anchor="middle">req</text>
  <text class="tx a badt" style="animation-name:tot0" x="776" y="164" text-anchor="end">9 RTT ≈ 180 ms</text>
  <text class="sub a" style="animation-name:tot0" x="200" y="164">+3 sockets left in TIME_WAIT on the side that closes</text>
  <text class="lbl" x="28" y="216">Pooled keep-alive</text>
  <rect class="box" x="200" y="196" width="576" height="32" rx="4"/>
  <rect class="pri g" style="animation-name:b10" x="201" y="197" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b10t" x="232" y="216" text-anchor="middle">TCP</text>
  <rect class="tea g" style="animation-name:b11" x="265" y="197" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b11t" x="296" y="216" text-anchor="middle">TLS</text>
  <rect class="okf g" style="animation-name:b12" x="329" y="197" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b12t" x="360" y="216" text-anchor="middle">req</text>
  <rect class="okf g" style="animation-name:b13" x="393" y="197" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b13t" x="424" y="216" text-anchor="middle">req</text>
  <rect class="okf g" style="animation-name:b14" x="457" y="197" width="62" height="30" rx="3"/><text class="on a" style="animation-name:b14t" x="488" y="216" text-anchor="middle">req</text>
  <text class="tx a okt" style="animation-name:tot1" x="532" y="216">5 RTT ≈ 100 ms</text>
  <path class="ln cur" d="M200 92 L200 238"/>
  <text class="sub" x="200" y="270" text-anchor="middle">0</text>
  <text class="sub" x="264" y="270" text-anchor="middle">20</text>
  <text class="sub" x="328" y="270" text-anchor="middle">40</text>
  <text class="sub" x="392" y="270" text-anchor="middle">60</text>
  <text class="sub" x="456" y="270" text-anchor="middle">80</text>
  <text class="sub" x="520" y="270" text-anchor="middle">100</text>
  <text class="sub" x="584" y="270" text-anchor="middle">120</text>
  <text class="sub" x="648" y="270" text-anchor="middle">140</text>
  <text class="sub" x="712" y="270" text-anchor="middle">160</text>
  <text class="sub" x="776" y="270" text-anchor="middle">180</text>
  <text class="sub" x="28" y="270">time (ms)</text>
  <rect class="pri" x="28" y="287" width="14" height="14" rx="3"/><text class="sub" x="48" y="298">TCP handshake (1 RTT)</text>
  <rect class="tea" x="248" y="287" width="14" height="14" rx="3"/><text class="sub" x="268" y="298">TLS 1.3 handshake (1 RTT)</text>
  <rect class="okf" x="468" y="287" width="14" height="14" rx="3"/><text class="sub" x="488" y="298">request + response (1 RTT)</text>
</svg>
