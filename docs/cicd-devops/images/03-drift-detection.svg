<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Nightly drift detection</title>
  <desc id="d">Animation: a scheduled job runs terraform plan with detailed exit codes against three production stacks: network, data and the claims services stack. On nights one and two every stack returns exit 0. Between night two and three someone opens port 22 to 0.0.0.0/0 in the console. On night three the network stack returns exit 2 while the other two return 0, an alert goes to the platform on-call channel, and the team decides in a pull request whether to codify the change or apply to revert it. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes p1{0%{opacity:0}5.99%{opacity:0}6%{opacity:1}100%{opacity:1}}.p1{animation-name:p1}
    @keyframes p2{0%{opacity:0}19.99%{opacity:0}20%{opacity:1}100%{opacity:1}}.p2{animation-name:p2}
    @keyframes p3{0%{opacity:0}45.99%{opacity:0}46%{opacity:1}100%{opacity:1}}.p3{animation-name:p3}
    @keyframes p4{0%{opacity:0}8.99%{opacity:0}9%{opacity:1}100%{opacity:1}}.p4{animation-name:p4}
    @keyframes p5{0%{opacity:0}22.99%{opacity:0}23%{opacity:1}100%{opacity:1}}.p5{animation-name:p5}
    @keyframes p6{0%{opacity:0}48.99%{opacity:0}49%{opacity:1}100%{opacity:1}}.p6{animation-name:p6}
    @keyframes p7{0%{opacity:0}11.99%{opacity:0}12%{opacity:1}100%{opacity:1}}.p7{animation-name:p7}
    @keyframes p8{0%{opacity:0}25.99%{opacity:0}26%{opacity:1}100%{opacity:1}}.p8{animation-name:p8}
    @keyframes p9{0%{opacity:0}51.99%{opacity:0}52%{opacity:1}100%{opacity:1}}.p9{animation-name:p9}
    @keyframes p10{0%{opacity:0}33.99%{opacity:0}34%{opacity:1}100%{opacity:1}}.p10{animation-name:p10}
    @keyframes p11{0%{opacity:0}59.99%{opacity:0}60%{opacity:1}100%{opacity:1}}.p11{animation-name:p11}
    @keyframes p12{0%{opacity:0}59.99%{opacity:0}60%{opacity:1}100%{opacity:1}}.p12{animation-name:p12}
    @keyframes p13{0%{opacity:0}73.99%{opacity:0}74%{opacity:1}100%{opacity:1}}.p13{animation-name:p13}
    @media (prefers-reduced-motion: reduce){.k{animation:none}.p1,.p2,.p3,.p4,.p5,.p6,.p7,.p8,.p9,.p10,.p11,.p12,.p13{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="394" rx="14"/>
  <text class="h" x="28" y="40">Nightly drift check with plan -detailed-exitcode</text><text class="sub" x="28" y="62">Exit 0 = matches code, 1 = error, 2 = changes pending. Stacks and timings illustrative.</text><text class="lbl" x="380" y="100" text-anchor="middle">night 1</text><text class="lbl" x="500" y="100" text-anchor="middle">night 2</text><text class="lbl" x="680" y="100" text-anchor="middle">night 3</text><text class="mono" x="40" y="140" xml:space="preserve">envs/prod/network</text><rect class="bm" x="344" y="120" width="72" height="30" rx="6"/><g class="k p1"><rect class="okf" x="344" y="120" width="72" height="30" rx="6"/><text class="on13" x="380" y="140" text-anchor="middle">exit 0</text></g><rect class="bm" x="464" y="120" width="72" height="30" rx="6"/><g class="k p2"><rect class="okf" x="464" y="120" width="72" height="30" rx="6"/><text class="on13" x="500" y="140" text-anchor="middle">exit 0</text></g><rect class="bm" x="644" y="120" width="72" height="30" rx="6"/><g class="k p3"><rect class="wrnf" x="644" y="120" width="72" height="30" rx="6"/><text class="on13" x="680" y="140" text-anchor="middle">exit 2</text></g><text class="mono" x="40" y="186" xml:space="preserve">envs/prod/data</text><rect class="bm" x="344" y="166" width="72" height="30" rx="6"/><g class="k p4"><rect class="okf" x="344" y="166" width="72" height="30" rx="6"/><text class="on13" x="380" y="186" text-anchor="middle">exit 0</text></g><rect class="bm" x="464" y="166" width="72" height="30" rx="6"/><g class="k p5"><rect class="okf" x="464" y="166" width="72" height="30" rx="6"/><text class="on13" x="500" y="186" text-anchor="middle">exit 0</text></g><rect class="bm" x="644" y="166" width="72" height="30" rx="6"/><g class="k p6"><rect class="okf" x="644" y="166" width="72" height="30" rx="6"/><text class="on13" x="680" y="186" text-anchor="middle">exit 0</text></g><text class="mono" x="40" y="232" xml:space="preserve">envs/prod/services/claims</text><rect class="bm" x="344" y="212" width="72" height="30" rx="6"/><g class="k p7"><rect class="okf" x="344" y="212" width="72" height="30" rx="6"/><text class="on13" x="380" y="232" text-anchor="middle">exit 0</text></g><rect class="bm" x="464" y="212" width="72" height="30" rx="6"/><g class="k p8"><rect class="okf" x="464" y="212" width="72" height="30" rx="6"/><text class="on13" x="500" y="232" text-anchor="middle">exit 0</text></g><rect class="bm" x="644" y="212" width="72" height="30" rx="6"/><g class="k p9"><rect class="okf" x="644" y="212" width="72" height="30" rx="6"/><text class="on13" x="680" y="232" text-anchor="middle">exit 0</text></g><line class="lnb dash" x1="590" y1="106" x2="590" y2="254"/><g class="k p10"><rect class="badf" x="530" y="262" width="120" height="26" rx="6"/><text class="on13" x="590" y="280" text-anchor="middle">console edit</text><text class="badt" x="590" y="304" text-anchor="middle" style="font-size:12px">port 22 opened to 0.0.0.0/0</text></g><g class="k p11"><rect class="bw" x="40" y="324" width="340" height="54" rx="8" stroke-width="1.5"/><text class="sm" x="210" y="347" text-anchor="middle">alert → #platform-oncall</text><text class="sm" x="210" y="365" text-anchor="middle">Drift in envs/prod/network</text></g><g class="k p12"><line class="lnw" x1="382" y1="351" x2="420" y2="351" marker-end="url(#arw)"/></g><g class="k p13"><rect class="bp" x="424" y="324" width="340" height="54" rx="8" stroke-width="1.5"/><text class="sm" x="594" y="347" text-anchor="middle">decide in a PR: codify the change</text><text class="sm" x="594" y="365" text-anchor="middle">or apply to revert it</text></g>
</svg>
