<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Resolvers fire level by level</title>
  <desc id="d">Execution of a member query with three prescriptions, level by level. Level 1: Query.member calls the Member API, one call. Level 2: Member.name is a default resolver that just reads a property, no call, while Member.prescriptions calls the Rx API, one call. Level 3: Prescription.pharmacy runs once per prescription, three calls to the Pharmacy API. The counter ends at five upstream calls, and the pharmacy level grows with the number of prescriptions: the N plus 1 pattern that DataLoader batching removes.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:15s infinite linear}
    @keyframes n0{0%{opacity:0}3%{opacity:0}4%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .n0{animation-name:n0}
    @keyframes n1{0%{opacity:0}21%{opacity:0}22%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .n1{animation-name:n1}
    @keyframes n2{0%{opacity:0}21%{opacity:0}22%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .n2{animation-name:n2}
    @keyframes n3{0%{opacity:0}41%{opacity:0}42%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .n3{animation-name:n3}
    @keyframes n4{0%{opacity:0}41%{opacity:0}42%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .n4{animation-name:n4}
    @keyframes n5{0%{opacity:0}45%{opacity:0}46%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .n5{animation-name:n5}
    @keyframes n6{0%{opacity:0}49%{opacity:0}50%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .n6{animation-name:n6}
    @keyframes c0{0%{opacity:0}3%{opacity:0}4%,20.5%{opacity:1}21.5%{opacity:0}100%{opacity:0}}
    .c0{animation-name:c0}
    @keyframes c1{0%{opacity:0}21%{opacity:0}22%,40.5%{opacity:1}41.5%{opacity:0}100%{opacity:0}}
    .c1{animation-name:c1}
    @keyframes c2{0%{opacity:0}41%{opacity:0}42%,44.5%{opacity:1}45.5%{opacity:0}100%{opacity:0}}
    .c2{animation-name:c2}
    @keyframes c3{0%{opacity:0}45%{opacity:0}46%,48.5%{opacity:1}49.5%{opacity:0}100%{opacity:0}}
    .c3{animation-name:c3}
    @keyframes c4{0%{opacity:0}49%{opacity:0}50%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .c4{animation-name:c4}
    @keyframes lv1{0%{opacity:0}3%{opacity:0}4%,21%{opacity:1}22%{opacity:0}100%{opacity:0}}
    .lv1{animation-name:lv1}
    @keyframes lv2{0%{opacity:0}21%{opacity:0}22%,41%{opacity:1}42%{opacity:0}100%{opacity:0}}
    .lv2{animation-name:lv2}
    @keyframes lv3{0%{opacity:0}41%{opacity:0}42%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .lv3{animation-name:lv3}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">member { name prescriptions { drugName pharmacy } }</text>
  <text class="sub" x="28" y="62">Each field has a resolver; default ones just read a property.</text>
  <line class="ln" x1="400" y1="144" x2="230" y2="188"/>
  <line class="ln" x1="400" y1="144" x2="540" y2="188"/>
  <line class="ln" x1="540" y1="234" x2="230" y2="288"/>
  <line class="ln" x1="540" y1="234" x2="392" y2="288"/>
  <line class="ln" x1="540" y1="234" x2="546" y2="288"/>
  <line class="ln" x1="540" y1="234" x2="700" y2="288"/>
  <rect class="box" x="330" y="100" width="140" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="400" y="119" text-anchor="middle" font-weight="700">Query.member</text>
  <text class="sm" x="400" y="136" text-anchor="middle">Member API</text>
  <g class="a n0">
  <rect class="pri" x="330" y="100" width="140" height="44" rx="10"/>
  </g>
  <text class="on13 a n0" x="400" y="119" text-anchor="middle">Query.member</text>
  <text class="on13 a n0" style="font-weight:400;font-size:12px" x="400" y="135" text-anchor="middle">Member API</text>
  <rect class="box" x="160" y="190" width="140" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="230" y="209" text-anchor="middle" font-weight="700">name</text>
  <text class="sm" x="230" y="226" text-anchor="middle">property</text>
  <g class="a n1">
  <rect class="mutf" x="160" y="190" width="140" height="44" rx="10"/>
  </g>
  <text class="on13 a n1" x="230" y="209" text-anchor="middle">name</text>
  <text class="on13 a n1" style="font-weight:400;font-size:12px" x="230" y="225" text-anchor="middle">property</text>
  <rect class="box" x="470" y="190" width="140" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="540" y="209" text-anchor="middle" font-weight="700">prescriptions</text>
  <text class="sm" x="540" y="226" text-anchor="middle">Rx API</text>
  <g class="a n2">
  <rect class="pri" x="470" y="190" width="140" height="44" rx="10"/>
  </g>
  <text class="on13 a n2" x="540" y="209" text-anchor="middle">prescriptions</text>
  <text class="on13 a n2" style="font-weight:400;font-size:12px" x="540" y="225" text-anchor="middle">Rx API</text>
  <rect class="box" x="160" y="290" width="140" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="230" y="309" text-anchor="middle" font-weight="700">drugName ×3</text>
  <text class="sm" x="230" y="326" text-anchor="middle">property</text>
  <g class="a n3">
  <rect class="mutf" x="160" y="290" width="140" height="44" rx="10"/>
  </g>
  <text class="on13 a n3" x="230" y="309" text-anchor="middle">drugName ×3</text>
  <text class="on13 a n3" style="font-weight:400;font-size:12px" x="230" y="325" text-anchor="middle">property</text>
  <rect class="box" x="322" y="290" width="140" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="392" y="309" text-anchor="middle" font-weight="700">pharmacy rx0</text>
  <text class="sm" x="392" y="326" text-anchor="middle">Pharmacy API</text>
  <g class="a n4">
  <rect class="wrnf" x="322" y="290" width="140" height="44" rx="10"/>
  </g>
  <text class="on13 a n4" x="392" y="309" text-anchor="middle">pharmacy rx0</text>
  <text class="on13 a n4" style="font-weight:400;font-size:12px" x="392" y="325" text-anchor="middle">Pharmacy API</text>
  <rect class="box" x="476" y="290" width="140" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="546" y="309" text-anchor="middle" font-weight="700">pharmacy rx1</text>
  <text class="sm" x="546" y="326" text-anchor="middle">Pharmacy API</text>
  <g class="a n5">
  <rect class="wrnf" x="476" y="290" width="140" height="44" rx="10"/>
  </g>
  <text class="on13 a n5" x="546" y="309" text-anchor="middle">pharmacy rx1</text>
  <text class="on13 a n5" style="font-weight:400;font-size:12px" x="546" y="325" text-anchor="middle">Pharmacy API</text>
  <rect class="box" x="630" y="290" width="140" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="700" y="309" text-anchor="middle" font-weight="700">pharmacy rx2</text>
  <text class="sm" x="700" y="326" text-anchor="middle">Pharmacy API</text>
  <g class="a n6">
  <rect class="wrnf" x="630" y="290" width="140" height="44" rx="10"/>
  </g>
  <text class="on13 a n6" x="700" y="309" text-anchor="middle">pharmacy rx2</text>
  <text class="on13 a n6" style="font-weight:400;font-size:12px" x="700" y="325" text-anchor="middle">Pharmacy API</text>
  <text class="sm" x="28" y="110">upstream calls</text>
  <text class="h a c0" style="font-size:36px" x="28" y="150">1</text>
  <text class="h a c1" style="font-size:36px" x="28" y="150">2</text>
  <text class="h a c2" style="font-size:36px" x="28" y="150">3</text>
  <text class="h a c3" style="font-size:36px" x="28" y="150">4</text>
  <text class="h a c4" style="font-size:36px" x="28" y="150">5</text>
  <text class="lbl a lv1" x="28" y="404">Level 1: root field resolver</text>
  <text class="lbl a lv2" x="28" y="404">Level 2: children of member; name is a free property read</text>
  <text class="lbl wrnt a lv3" x="28" y="404">Level 3: pharmacy once per prescription → N calls (fix: @BatchMapping)</text>
</svg>
