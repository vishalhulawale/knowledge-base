<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 458" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">N+1 selects vs batch fetching</title>
  <desc id="d">An SQL log for loading 50 orders and then touching each order's lazy items collection. With plain lazy loading the log shows one query for the 50 orders followed by one query per order for its items, 51 queries in total. With hibernate.default_batch_fetch_size set to 50 the log shows the orders query followed by a single items query with an IN list of the 50 order IDs, 2 queries in total.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:700}
    .sub{fill:#64748b;font-size:13px}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .log{fill:#ffffff;stroke:#cbd5e1}
    .q1{fill:#4f46e5;font-size:13px;font-weight:600}
    .qn{fill:#dc2626;font-size:13px}
    .qd{fill:#64748b;font-size:13px;font-style:italic}
    .qb{fill:#0f766e;font-size:13px;font-weight:600}
    .cnt{font-size:28px;font-weight:800}
    .bad{fill:#dc2626}.good{fill:#15803d}
    .cl{fill:#64748b;font-size:13px}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl{fill:#e2e8f0}.sub,.cl,.qd{fill:#94a3b8}
      .log{fill:#111827;stroke:#475569}
      .q1{fill:#a5b4fc}.qn{fill:#f87171}.qb{fill:#5eead4}
      .bad{fill:#f87171}.good{fill:#4ade80}
    }
    /* 10 s loop: lazy log lines 3-46 %, count at 48 %; batch lines at 58 and 66 %, count at 68 %; hold to 92 % */
    .a{opacity:0;animation:10s infinite linear}
    @keyframes L0{0%,3%{opacity:0}4%,92%{opacity:1}96%,100%{opacity:0}}@keyframes L1{0%,9%{opacity:0}10%,92%{opacity:1}96%,100%{opacity:0}}@keyframes L2{0%,15%{opacity:0}16%,92%{opacity:1}96%,100%{opacity:0}}@keyframes L3{0%,21%{opacity:0}22%,92%{opacity:1}96%,100%{opacity:0}}@keyframes L4{0%,27%{opacity:0}28%,92%{opacity:1}96%,100%{opacity:0}}@keyframes L5{0%,33%{opacity:0}34%,92%{opacity:1}96%,100%{opacity:0}}@keyframes L6{0%,39%{opacity:0}40%,92%{opacity:1}96%,100%{opacity:0}}@keyframes L7{0%,45%{opacity:0}46%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes c1{0%,47%{opacity:0}49%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b1{0%,57%{opacity:0}58%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes b2{0%,65%{opacity:0}66%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes c2{0%,67%{opacity:0}69%,92%{opacity:1}96%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="456" rx="14"/>
  <text class="h" x="28" y="40">N+1 selects vs batch fetching</text>
  <text class="sub" x="28" y="62">Load 50 orders, then read order.getItems() for each one. SQL log:</text>

  <text class="lbl" x="28" y="92">Plain lazy loading</text>
  <rect class="log" x="28" y="102" width="600" height="202" rx="8"/>
  <g class="a" style="animation-name:L0"><text class="q1 code" x="44" y="124">select ... from orders where customer_id = ? limit 50</text></g><g class="a" style="animation-name:L1"><text class="qn code" x="44" y="148">select ... from order_items where order_id = 1</text></g><g class="a" style="animation-name:L2"><text class="qn code" x="44" y="172">select ... from order_items where order_id = 2</text></g><g class="a" style="animation-name:L3"><text class="qn code" x="44" y="196">select ... from order_items where order_id = 3</text></g><g class="a" style="animation-name:L4"><text class="qn code" x="44" y="220">select ... from order_items where order_id = 4</text></g><g class="a" style="animation-name:L5"><text class="qn code" x="44" y="244">select ... from order_items where order_id = 5</text></g><g class="a" style="animation-name:L6"><text class="qn code" x="44" y="268">select ... from order_items where order_id = 6</text></g><g class="a" style="animation-name:L7"><text class="qd code" x="44" y="292">... 44 more, one per order</text></g>
  <g class="a" style="animation-name:c1"><text class="cnt bad" x="700" y="200" text-anchor="middle">51</text><text class="cl" x="700" y="222" text-anchor="middle">queries</text></g>

  <text class="lbl" x="28" y="334">With hibernate.default_batch_fetch_size = 50</text>
  <rect class="log" x="28" y="344" width="600" height="78" rx="8"/>
  <g class="a" style="animation-name:b1"><text class="q1 code" x="44" y="370">select ... from orders where customer_id = ? limit 50</text></g>
  <g class="a" style="animation-name:b2"><text class="qb code" x="44" y="394">select ... from order_items where order_id in (?, ... 50 ids)</text></g>
  <g class="a" style="animation-name:c2"><text class="cnt good" x="700" y="390" text-anchor="middle">2</text><text class="cl" x="700" y="412" text-anchor="middle">queries</text></g>

  <text class="sub" x="28" y="446">A projection or an @EntityGraph on ID-paged results also avoids the per-order queries.</text>
</svg>
