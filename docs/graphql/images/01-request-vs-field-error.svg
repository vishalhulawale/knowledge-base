<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Request error vs field error</title>
  <desc id="d">Two ways a GraphQL request can fail. Left, a request error: the query asks for a field that doesn&#x27;t exist in the schema, so validation fails before any resolver runs and the response has an errors array and no data key at all. Right, a field error: the query is valid and executes, but the pharmacy resolver for the first prescription throws because the pharmacy service is down; the response still contains the member name and prescriptions, pharmacy is null, and the errors array holds one entry whose path points to exactly that field.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">Two failure classes, two response shapes</text>
  <text class="sub" x="28" y="62">Where it fails decides whether any data comes back.</text>
  <line class="ln dash" x1="400" y1="84" x2="400" y2="380"/>
  <text class="h2 badt" x="28" y="102">Request error (validation)</text>
  <rect class="okf" x="28" y="116" width="82" height="26" rx="5"/>
  <text class="on13" x="69" y="133.5" text-anchor="middle">parse</text>
  <rect class="badf" x="120" y="116" width="82" height="26" rx="5"/>
  <text class="on13" x="161" y="133.5" text-anchor="middle">validate</text>
  <rect class="mutf" x="212" y="116" width="82" height="26" rx="5"/>
  <text class="on13" x="253" y="133.5" text-anchor="middle">execute</text>
  <text class="sm prit" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="28" y="168">query { member(id: 42) { nmae } }</text>
  <rect class="box" x="28" y="182" width="352" height="148" rx="10" stroke-width="1.2"/>
  <text class="h2 wrnt" x="420" y="102">Field error (execution)</text>
  <rect class="okf" x="420" y="116" width="82" height="26" rx="5"/>
  <text class="on13" x="461" y="133.5" text-anchor="middle">parse</text>
  <rect class="okf" x="512" y="116" width="82" height="26" rx="5"/>
  <text class="on13" x="553" y="133.5" text-anchor="middle">validate</text>
  <rect class="wrnf" x="604" y="116" width="82" height="26" rx="5"/>
  <text class="on13" x="645" y="133.5" text-anchor="middle">execute</text>
  <text class="sm prit" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="420" y="168">pharmacy resolver throws for rx 0</text>
  <rect class="box" x="420" y="182" width="352" height="148" rx="10" stroke-width="1.2"/>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="40" y="204">{</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="40" y="224">  &quot;errors&quot;: [{</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="40" y="244">    &quot;message&quot;: &quot;Field &#x27;nmae&#x27; is undefined&quot;,</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="40" y="264">    &quot;locations&quot;: [{&quot;line&quot;:1,&quot;column&quot;:26}]</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="40" y="284">  }]</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="40" y="304">}</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="430" y="200">{ &quot;data&quot;: { &quot;member&quot;: {</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="430" y="218">    &quot;name&quot;: &quot;A. Patel&quot;,</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="430" y="236">    &quot;prescriptions&quot;: [</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="430" y="254">      { &quot;pharmacy&quot;: null } ] } },</text>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="430" y="272">  &quot;errors&quot;: [{ &quot;message&quot;: &quot;Pharmacy down&quot;,</text>
  <text class="tx wrnt" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="430" y="290">    &quot;path&quot;: [&quot;member&quot;,&quot;prescriptions&quot;,</text>
  <text class="tx wrnt" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;white-space:pre" x="430" y="308">             0,&quot;pharmacy&quot;] }] }</text>
  <text class="tx badt" x="28" y="352">no data key: nothing ran</text>
  <text class="tx wrnt" x="420" y="352">partial data + error with a path</text>
  <text class="sub" x="28" y="396">Both usually arrive as HTTP 200 over application/json: monitor the errors array, not just status codes.</text>
</svg>
