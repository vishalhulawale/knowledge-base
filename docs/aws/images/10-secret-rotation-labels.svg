<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Secrets Manager rotation and its staging labels</title>
  <desc id="d">Version 1 of a secret starts with the AWSCURRENT label. In createSecret, rotation creates version 2 labelled AWSPENDING. In setSecret, the new password is applied in the database. In testSecret, a login with version 2 is tested. In finishSecret, AWSCURRENT moves to version 2, version 1 becomes AWSPREVIOUS and AWSPENDING is removed. Clients that cached version 1 must re-fetch on an authentication failure.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .txt{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .cur{fill:#16a34a}.pen{fill:#d97706}.prev{fill:#64748b}
    .on{fill:#fff;font-size:13px;font-weight:700}
    .stp{fill:#ffffff;stroke:#cbd5e1}
    .stpon{fill:#4f46e5}
    .st{fill:#334155;font-size:14px;font-weight:600}
    .ston{fill:#fff;font-size:14px;font-weight:700}
    .ok{fill:#16a34a;font-size:14px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.txt,.st{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box,.stp{fill:#111827;stroke:#475569}
      .cur,.ok{fill:#4ade80}.cur{fill:#4ade80}.pen{fill:#fbbf24}.prev{fill:#94a3b8}
      .on,.ston{fill:#0f172a}.stpon{fill:#818cf8}.ok{fill:#4ade80}
    }
    /* 12 s loop: createSecret 14 % | setSecret 32 % | testSecret 50 % | finishSecret 68 % | hold to 94 % */
    .a{opacity:0;animation:12s infinite linear}
    @keyframes v2{0%,13%{opacity:0}15%,94%{opacity:1}98%,100%{opacity:0}}
    @keyframes c1{0%,67%{opacity:1}69%,100%{opacity:0}}
    @keyframes p2{0%,13%{opacity:0}15%,67%{opacity:1}69%,100%{opacity:0}}
    @keyframes c2{0%,67%{opacity:0}69%,94%{opacity:1}98%,100%{opacity:0}}
    @keyframes db{0%,31%{opacity:0}33%,94%{opacity:1}98%,100%{opacity:0}}
    @keyframes tk{0%,49%{opacity:0}51%,94%{opacity:1}98%,100%{opacity:0}}
    @keyframes h1{0%,13%{opacity:0}15%,31%{opacity:1}33%,100%{opacity:0}}
    @keyframes h2{0%,31%{opacity:0}33%,49%{opacity:1}51%,100%{opacity:0}}
    @keyframes h3{0%,49%{opacity:0}51%,67%{opacity:1}69%,100%{opacity:0}}
    @keyframes h4{0%,67%{opacity:0}69%,94%{opacity:1}98%,100%{opacity:0}}
    .kv2{animation-name:v2}.kc1{opacity:1;animation-name:c1}.kp2{animation-name:p2}.kc2,.kpv{animation-name:c2}.kdb{animation-name:db}.ktk{animation-name:tk}
    .kh1{animation-name:h1}.kh2{animation-name:h2}.kh3{animation-name:h3}.kh4{animation-name:h4}
    @media (prefers-reduced-motion: reduce){
      .a{animation:none}
      .kc1,.kp2,.kh1,.kh2,.kh3{opacity:0}
      .kv2,.kc2,.kpv,.kdb,.ktk,.kh4{opacity:1}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Secret rotation: the labels move, the secret name stays</text>
  <text class="sub" x="28" y="62">Apps ask for AWSCURRENT. Rotation prepares a new version, then moves the label to it.</text>

  <!-- versions -->
  <rect class="box" x="28" y="86" width="200" height="130" rx="10"/>
  <text class="lbl" x="44" y="110">Version 1</text>
  <text class="sub" x="44" y="130">password: old</text>
  <g class="a kc1"><rect class="cur" x="44" y="150" width="130" height="28" rx="14"/><text class="on" x="109" y="169" text-anchor="middle">AWSCURRENT</text></g>
  <g class="a kpv"><rect class="prev" x="44" y="150" width="130" height="28" rx="14"/><text class="on" x="109" y="169" text-anchor="middle">AWSPREVIOUS</text></g>

  <g class="a kv2">
    <rect class="box" x="256" y="86" width="200" height="130" rx="10"/>
    <text class="lbl" x="272" y="110">Version 2</text>
    <text class="sub" x="272" y="130">password: new</text>
  </g>
  <g class="a kp2"><rect class="pen" x="272" y="150" width="130" height="28" rx="14"/><text class="on" x="337" y="169" text-anchor="middle">AWSPENDING</text></g>
  <g class="a kc2"><rect class="cur" x="272" y="150" width="130" height="28" rx="14"/><text class="on" x="337" y="169" text-anchor="middle">AWSCURRENT</text></g>

  <!-- database -->
  <rect class="box" x="510" y="86" width="262" height="130" rx="10"/>
  <text class="lbl" x="526" y="110">Database user</text>
  <text class="sub" x="526" y="132">password matches version 1</text>
  <g class="a kdb"><rect class="box" x="520" y="118" width="244" height="22" style="stroke:none"/><text class="txt" x="526" y="132">password set to version 2</text></g>
  <text class="ok a ktk" x="526" y="170">✓ test login with v2 works</text>

  <!-- step strip -->
  <rect class="stp" x="28" y="240" width="176" height="44" rx="8"/><text class="st" x="116" y="267" text-anchor="middle">1 createSecret</text>
  <rect class="stp" x="214" y="240" width="176" height="44" rx="8"/><text class="st" x="302" y="267" text-anchor="middle">2 setSecret</text>
  <rect class="stp" x="400" y="240" width="176" height="44" rx="8"/><text class="st" x="488" y="267" text-anchor="middle">3 testSecret</text>
  <rect class="stp" x="586" y="240" width="186" height="44" rx="8"/><text class="st" x="679" y="267" text-anchor="middle">4 finishSecret</text>
  <g class="a kh1"><rect class="stpon" x="28" y="240" width="176" height="44" rx="8"/><text class="ston" x="116" y="267" text-anchor="middle">1 createSecret</text></g>
  <g class="a kh2"><rect class="stpon" x="214" y="240" width="176" height="44" rx="8"/><text class="ston" x="302" y="267" text-anchor="middle">2 setSecret</text></g>
  <g class="a kh3"><rect class="stpon" x="400" y="240" width="176" height="44" rx="8"/><text class="ston" x="488" y="267" text-anchor="middle">3 testSecret</text></g>
  <g class="a kh4"><rect class="stpon" x="586" y="240" width="186" height="44" rx="8"/><text class="ston" x="679" y="267" text-anchor="middle">4 finishSecret</text></g>

  <text class="sub" x="28" y="320">Single-user rotation: once setSecret runs, cached copies of version 1 stop working, so clients must</text>
  <text class="sub" x="28" y="338">re-fetch on an auth failure. The alternating-users strategy avoids that gap by rotating the idle user.</text>
</svg>
