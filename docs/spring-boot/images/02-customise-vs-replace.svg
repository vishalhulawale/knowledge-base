<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Customise vs replace an auto-configured bean</title>
  <desc id="d">Two ways to make Jackson omit null fields. Left, a customizer bean: Boot still builds its ObjectMapper and applies every layer, the spring.jackson properties, the JavaTime, Kotlin and parameter-names modules, all registered customizers, plus the new non-null inclusion, so LocalDate still serialises. Right, declaring your own ObjectMapper bean: Boot&#x27;s ObjectMapper auto-configuration backs off because of ConditionalOnMissingBean, so all those layers are lost and LocalDate fails to serialise.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="408" rx="14"/>
  <text class="h" x="28" y="40">Goal: omit null fields in JSON</text>
  <text class="sub" x="28" y="62">Boot&#x27;s ObjectMapper is built from layers. A customizer adds one; a new @Bean throws them all away.</text>
  <text class="h2 okt" x="28" y="102">Customizer bean (keeps Boot&#x27;s)</text>
  <rect class="box" x="28" y="114" width="352" height="200" rx="12" stroke-width="1.5"/>
  <text class="lbl" x="42" y="136">ObjectMapper</text>
  <rect class="tea" x="42" y="148" width="324" height="28" rx="6"/>
  <text class="on13" x="204" y="166.5" text-anchor="middle">spring.jackson.* properties</text>
  <rect class="tea" x="42" y="182" width="324" height="28" rx="6"/>
  <text class="on13" x="204" y="200.5" text-anchor="middle">JavaTimeModule (LocalDate, Instant)</text>
  <rect class="tea" x="42" y="216" width="324" height="28" rx="6"/>
  <text class="on13" x="204" y="234.5" text-anchor="middle">Kotlin + parameter-names modules</text>
  <rect class="tea" x="42" y="250" width="324" height="28" rx="6"/>
  <text class="on13" x="204" y="268.5" text-anchor="middle">other registered customizers</text>
  <rect class="pri" x="42" y="284" width="324" height="28" rx="6"/>
  <text class="on13" x="204" y="302.5" text-anchor="middle">NON_NULL inclusion (yours)</text>
  <text class="h2 badt" x="420" y="102">Your own @Bean ObjectMapper</text>
  <rect class="box" x="420" y="114" width="352" height="200" rx="12" stroke-width="1.5"/>
  <text class="lbl" x="434" y="136">ObjectMapper</text>
  <rect class="bm" x="434" y="148" width="324" height="28" rx="6" stroke-width="1"/>
  <text class="sm" x="596" y="167" text-anchor="middle">spring.jackson.* properties  ✕</text>
  <rect class="bm" x="434" y="182" width="324" height="28" rx="6" stroke-width="1"/>
  <text class="sm" x="596" y="201" text-anchor="middle">JavaTimeModule (LocalDate, Instant)  ✕</text>
  <rect class="bm" x="434" y="216" width="324" height="28" rx="6" stroke-width="1"/>
  <text class="sm" x="596" y="235" text-anchor="middle">Kotlin + parameter-names modules  ✕</text>
  <rect class="bm" x="434" y="250" width="324" height="28" rx="6" stroke-width="1"/>
  <text class="sm" x="596" y="269" text-anchor="middle">other registered customizers  ✕</text>
  <rect class="pri" x="434" y="284" width="324" height="28" rx="6"/>
  <text class="on13" x="596" y="302.5" text-anchor="middle">NON_NULL inclusion (yours)</text>
  <text class="tx okt" style="font-family:'JetBrains Mono',ui-monospace,monospace" x="28" y="340">LocalDate → &quot;2026-10-05&quot; ✓</text>
  <text class="tx badt" style="font-family:'JetBrains Mono',ui-monospace,monospace" x="420" y="340">LocalDate → InvalidDefinitionException</text>
  <text class="sub" x="28" y="384">@ConditionalOnMissingBean means &quot;only if you didn&#x27;t define one&quot;: defining one opts you out of all of Boot&#x27;s setup.</text>
</svg>
