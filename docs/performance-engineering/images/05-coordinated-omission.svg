<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 454" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Coordinated omission</title>
  <desc id="d">Animation: a cursor sweeps a 200 second timeline in which the server serves 100 requests per second at 1 millisecond for 100 seconds and then freezes for 100 seconds. The closed-model tester, which waits for each reply, sends one request that waits through the whole freeze and sends nothing else. The open-model tester keeps sending 100 requests per second, so a queue of 10,000 builds during the freeze. At the end the results compare: the closed tester reports 10,001 samples, p99 of 1 millisecond and a mean of about 11 milliseconds, while users arriving at 100 per second see 20,000 requests with p99 of about 99 seconds and a mean of about 25 seconds.</desc>
