<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 402" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">The request as the tip of the iceberg</title>
  <desc id="d">An iceberg. Above the waterline, the request: we need a chatbot. Below it, the real problem: the workflow (who does what in which system), the pain (volumes, delays, rework, cost), workarounds such as a side spreadsheet, and who signs off and the date that matters. A side panel lists hidden constraints: PHI or PCI and data residency, integration limits, security and legal review, budget timing, and jobs that change. Ask about the past, not about hypothetical future use.</desc>
  <style>
