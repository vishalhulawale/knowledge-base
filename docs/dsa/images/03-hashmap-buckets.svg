  <rect class="box" x="40" y="337" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="352" text-anchor="middle" font-size="13">11</text>
  <rect class="box" x="40" y="360" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="375" text-anchor="middle" font-size="13">12</text>
  <rect class="box" x="40" y="383" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="398" text-anchor="middle" font-size="13">13</text>
  <line class="ln smut" stroke-width="1.5" x1="85" y1="393" x2="93" y2="393"/><path class="ah mut" d="M99.0,393.0 L93.0,396.0 L93.0,390.0 Z"/>
  <rect class="box" x="100" y="383" width="86" height="20" rx="5"/>
  <text class="t" x="143" y="398" text-anchor="middle" font-size="13">user</text>
  <rect class="box" x="40" y="406" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="421" text-anchor="middle" font-size="13">14</text>
  <rect class="box" x="40" y="429" width="44" height="20" rx="4"/>
  <text class="m" x="62" y="444" text-anchor="middle" font-size="13">15</text>
  <line class="ln smut" stroke-width="1.5" x1="85" y1="439" x2="93" y2="439"/><path class="ah mut" d="M99.0,439.0 L93.0,442.0 L93.0,436.0 Z"/>
  <rect class="box" x="100" y="429" width="86" height="20" rx="5"/>
  <text class="t" x="143" y="444" text-anchor="middle" font-size="13">billing</text>
  <line class="ln smut" stroke-width="1.5" x1="187" y1="439" x2="195" y2="439"/><path class="ah mut" d="M201.0,439.0 L195.0,442.0 L195.0,436.0 Z"/>
  <rect class="box" x="202" y="429" width="86" height="20" rx="5"/>
  <text class="t" x="245" y="444" text-anchor="middle" font-size="13">order</text>
  <text class="ttea" x="308" y="99" font-size="13" font-weight="700">same hashCode 2112</text>
  <line class="ln smut" x1="450" y1="84" x2="450" y2="448" stroke-width="1"/>
  <text class="lb" x="470" y="100">put("member", …)</text>
  <text class="t" x="470" y="128">hashCode()</text>
  <text class="tb" x="598" y="128">0xBFC28A9A</text>
  <text class="t" x="470" y="152">h ^ (h &gt;&gt;&gt; 16)</text>
  <text class="tb" x="598" y="152">0xBFC23558</text>
  <text class="t" x="470" y="176">&amp; (16 − 1)</text>
  <text class="tb" x="598" y="176">bucket 8</text>
  <text class="t" x="470" y="212">Walk bucket 8: pharmacy, claims.</text>
  <text class="t" x="470" y="232">Hashes differ, so equals() isn't</text>
  <text class="t" x="470" y="252">even called. Append member.</text>
  <text class="t" x="470" y="290">Aa and BB: equal hash codes,</text>
  <text class="t" x="470" y="310">so same bucket; equals() tells</text>
  <text class="t" x="470" y="330">them apart.</text>
  <text class="t" x="470" y="368">Resize: the 13th put doubles the</text>
  <text class="t" x="470" y="388">table (16 × 0.75 = 12 allowed).</text>
  <text class="t" x="470" y="418">Tree bin: a bucket with ≥ 8 nodes</text>
  <text class="t" x="470" y="438">becomes a red-black tree (table ≥ 64).</text>
  <text class="m" x="28" y="482">Hash codes are real Java String values. Iteration walks the buckets in order, so HashMap order looks random.</text>
</svg>
