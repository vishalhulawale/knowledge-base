<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 438" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">The microservice test pyramid</title>
  <desc id="d">A pyramid with five layers. From the top: a few end-to-end journey tests, slow and flaky in a shared environment; contract tests per consumer-provider pair, checking the shape of APIs and events; component tests of one service with real infrastructure in containers and other services stubbed; integration tests of one adapter with Testcontainers; and many unit tests that run in milliseconds. Higher layers are slower, costlier and more realistic.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ring{fill:#ffffff;stroke:#d97706;stroke-width:2.5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
      .ring{fill:#111827;stroke:#fbbf24}
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="436" rx="14"/>
  <text class="h" x="28" y="40">The microservice test pyramid</text>
  <polygon class="bp" points="245,78 245,78 285,138 205,138" stroke-width="1.5"/>
  <text class="tx" x="245" y="121.0" text-anchor="middle" font-weight="700">E2E</text>
  <line class="ln dash" x1="274" y1="108" x2="470" y2="108" stroke-width="1"/><text class="tx" x="480" y="107.0">A few critical journeys</text><text class="sub" x="480" y="125.0">minutes, flaky, shared environment</text>
  <polygon class="bt" points="205,138 285,138 325,198 165,198" stroke-width="1.5"/>
  <text class="tx" x="245" y="173.0" text-anchor="middle" font-weight="700">Contract</text>
  <line class="ln dash" x1="314" y1="168" x2="470" y2="168" stroke-width="1"/><text class="tx" x="480" y="167.0">Per consumer-provider pair</text><text class="sub" x="480" y="185.0">seconds; shape of APIs and events</text>
  <polygon class="bo" points="165,198 325,198 365,258 125,258" stroke-width="1.5"/>
  <text class="tx" x="245" y="233.0" text-anchor="middle" font-weight="700">Component</text>
  <line class="ln dash" x1="354" y1="228" x2="470" y2="228" stroke-width="1"/><text class="tx" x="480" y="227.0">One service, real infra in containers</text><text class="sub" x="480" y="245.0">seconds; other services stubbed</text>
  <polygon class="bw" points="125,258 365,258 405,318 85,318" stroke-width="1.5"/>
  <text class="tx" x="245" y="293.0" text-anchor="middle" font-weight="700">Integration</text>
  <line class="ln dash" x1="394" y1="288" x2="470" y2="288" stroke-width="1"/><text class="tx" x="480" y="287.0">One adapter: DB, Kafka, HTTP client</text><text class="sub" x="480" y="305.0">seconds; Testcontainers</text>
  <polygon class="box" points="85,318 405,318 445,378 45,378" stroke-width="1.5"/>
  <text class="tx" x="245" y="353.0" text-anchor="middle" font-weight="700">Unit</text>
  <line class="ln dash" x1="434" y1="348" x2="470" y2="348" stroke-width="1"/><text class="tx" x="480" y="347.0">Logic and edge cases</text><text class="sub" x="480" y="365.0">milliseconds; the most tests</text>
  <line class="ln" x1="22" y1="370" x2="22" y2="88" marker-end="url(#ar)"/>
  <text class="sub" x="0" y="0" transform="translate(16 330) rotate(-90)">slower, costlier, more realistic</text>
  <text class="sub" x="28" y="404">Most confidence comes from the middle: component and contract tests. Keep E2E small; add production checks</text>
  <text class="sub" x="28" y="420">(canary analysis, synthetic monitoring) on top.</text>
</svg>
