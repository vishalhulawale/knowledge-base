<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Agent loop with host controls</title>
  <desc id="d">Animation: a highlight moves around the loop. The model proposes a tool call such as send_letter for a prior-authorisation id. The host validates the schema, arguments and idempotency key. A policy layer requires human approval for irreversible actions. The tool executes with the end user's token, not a super-user key. The result or an actionable error goes back to the model. A budget of 8 turns, 50 cents and 120 seconds stops the loop.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes n0{0%,18.99%{opacity:1}19%,100%{opacity:0}}.n0{animation-name:n0}
    @keyframes n1{0%,18.99%{opacity:0}19%,37.99%{opacity:1}38%,100%{opacity:0}}.n1{animation-name:n1}
    @keyframes n2{0%,37.99%{opacity:0}38%,56.99%{opacity:1}57%,100%{opacity:0}}.n2{animation-name:n2}
    @keyframes n3{0%,56.99%{opacity:0}57%,75.99%{opacity:1}76%,100%{opacity:0}}.n3{animation-name:n3}
    @keyframes n4{0%,75.99%{opacity:0}76%,94.99%{opacity:1}95%,100%{opacity:0}}.n4{animation-name:n4}
    @keyframes t{0%,94.99%{opacity:0}95%,100%{opacity:1}}.t{animation-name:t}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.n2{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="370" rx="14"/>
  <text class="h" x="28" y="40">The agent loop: the model proposes, your code decides</text><text class="sub" x="28" y="62">Permissions, side effects and stopping live in the host, never in the prompt.</text><rect class="bp" x="28" y="100" width="220" height="64" rx="8" stroke-width="1.5"/><text class="sm" x="138" y="127" text-anchor="middle" font-weight="700">Model proposes</text><text class="sm" x="138" y="147" text-anchor="middle">tool: send_letter(pa_id)</text><g class="k n0"><rect class="box" x="25" y="97" width="226" height="70" rx="11" fill="none" stroke-width="3" style="fill:none;stroke:#0ea5a4"/></g><rect class="bm" x="290" y="100" width="220" height="64" rx="8" stroke-width="1.5"/><text class="sm" x="400" y="127" text-anchor="middle" font-weight="700">Host validates</text><text class="sm" x="400" y="147" text-anchor="middle">schema, args, idempotency key</text><g class="k n1"><rect class="box" x="287" y="97" width="226" height="70" rx="11" fill="none" stroke-width="3" style="fill:none;stroke:#0ea5a4"/></g><rect class="bw" x="552" y="100" width="220" height="64" rx="8" stroke-width="1.5"/><text class="sm" x="662" y="127" text-anchor="middle" font-weight="700">Policy + approval</text><text class="sm" x="662" y="147" text-anchor="middle">irreversible → human approves</text><g class="k n2"><rect class="box" x="549" y="97" width="226" height="70" rx="11" fill="none" stroke-width="3" style="fill:none;stroke:#0ea5a4"/></g><rect class="bt" x="552" y="230" width="220" height="64" rx="8" stroke-width="1.5"/><text class="sm" x="662" y="257" text-anchor="middle" font-weight="700">Execute</text><text class="sm" x="662" y="277" text-anchor="middle">user's token, not a super-user</text><g class="k n3"><rect class="box" x="549" y="227" width="226" height="70" rx="11" fill="none" stroke-width="3" style="fill:none;stroke:#0ea5a4"/></g><rect class="bm" x="290" y="230" width="220" height="64" rx="8" stroke-width="1.5"/><text class="sm" x="400" y="257" text-anchor="middle" font-weight="700">Result back</text><text class="sm" x="400" y="277" text-anchor="middle">data or an actionable error</text><g class="k n4"><rect class="box" x="287" y="227" width="226" height="70" rx="11" fill="none" stroke-width="3" style="fill:none;stroke:#0ea5a4"/></g><line class="ln" x1="250" y1="132" x2="286" y2="132" marker-end="url(#ar)"/><line class="ln" x1="512" y1="132" x2="548" y2="132" marker-end="url(#ar)"/><line class="ln" x1="662" y1="166" x2="662" y2="226" marker-end="url(#ar)"/><line class="ln" x1="550" y1="262" x2="514" y2="262" marker-end="url(#ar)"/><path class="ln" d="M 288 262 C 140 262, 120 200, 138 168" marker-end="url(#ar)"/><rect class="bb" x="28" y="230" width="220" height="64" rx="10" stroke-width="1.5"/><text class="badt" x="42" y="254" style="font-size:14px">Budget</text><text class="sm" x="42" y="274">max 8 turns · $0.50 · 120 s</text><text class="sm" x="28" y="330">Stop when the model returns a final answer or any budget runs out; log every proposed and executed call.</text><text class="sub" x="28" y="352">OWASP LLM06 Excessive Agency: few, task-shaped tools; least privilege; approvals on side effects.</text>
</svg>
