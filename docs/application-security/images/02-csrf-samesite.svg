<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">CSRF with and without defences</title>
  <desc id="d">Animation: in two lanes, a hidden auto-submitting form on evil.example sends a POST through the victim's browser to bank.example. In the no-defence lane, the browser attaches the session cookie and the bank replies 200 transfer done. In the lane with SameSite=Lax and a CSRF token, the cookie is withheld on the cross-site POST, there is no valid token, and the bank replies 403.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    .pk{animation:14s infinite ease-in-out}
    @keyframes pa{0%,6%{transform:translate(0px,0px)}22%,30%{transform:translate(170px,0px)}50%,100%{transform:translate(320px,0px)}}.pa{animation-name:pa}
    @keyframes cb{0%,25.99%{opacity:0}26%,100%{opacity:1}}.cb{animation-name:cb}
    @keyframes cm{0%,26%{transform:translate(0px,0px)}50%,100%{transform:translate(170px,0px)}}.cm{animation:cm 14s infinite ease-in-out}
    @keyframes res{0%,53.99%{opacity:0}54%,100%{opacity:1}}.res{animation-name:res}
    @media (prefers-reduced-motion: reduce){.k,.pk,.cm{animation:none}.k{opacity:1}.pa{transform:translate(320px,0px)}.cm{transform:translate(170px,0px)}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="422" rx="14"/>
  <text class="h" x="28" y="40">A forged form, with and without defences</text><text class="sub" x="28" y="62">The victim is logged in to bank.example and opens a page on evil.example.</text><text class="lbl" x="28" y="96">No defence</text><rect class="bb" x="28" y="114" width="170" height="52" rx="8" stroke-width="1.5"/><text class="sub" x="113" y="136.5" text-anchor="middle">evil.example</text><text class="sub" x="113" y="153.5" text-anchor="middle">hidden auto-submit form</text><rect class="box" x="300" y="114" width="150" height="52" rx="8" stroke-width="1.5"/><text class="sub" x="375" y="136.5" text-anchor="middle">Victim browser</text><text class="sub" x="375" y="153.5" text-anchor="middle">has SESSION cookie</text><rect class="bm" x="580" y="114" width="190" height="52" rx="8" stroke-width="1.5"/><text class="sub" x="675" y="136.5" text-anchor="middle">bank.example</text><text class="sub" x="675" y="153.5" text-anchor="middle">POST /transfer</text><line class="ln" x1="200" y1="140" x2="296" y2="140" marker-end="url(#ar)"/><line class="ln" x1="452" y1="140" x2="576" y2="140" marker-end="url(#ar)"/><text class="lbl" x="28" y="256">SameSite=Lax + CSRF token</text><rect class="bb" x="28" y="274" width="170" height="52" rx="8" stroke-width="1.5"/><text class="sub" x="113" y="296.5" text-anchor="middle">evil.example</text><text class="sub" x="113" y="313.5" text-anchor="middle">hidden auto-submit form</text><rect class="box" x="300" y="274" width="150" height="52" rx="8" stroke-width="1.5"/><text class="sub" x="375" y="296.5" text-anchor="middle">Victim browser</text><text class="sub" x="375" y="313.5" text-anchor="middle">has SESSION cookie</text><rect class="bm" x="580" y="274" width="190" height="52" rx="8" stroke-width="1.5"/><text class="sub" x="675" y="296.5" text-anchor="middle">bank.example</text><text class="sub" x="675" y="313.5" text-anchor="middle">POST /transfer</text><line class="ln" x1="200" y1="300" x2="296" y2="300" marker-end="url(#ar)"/><line class="ln" x1="452" y1="300" x2="576" y2="300" marker-end="url(#ar)"/><g class="pk pa"><rect class="pri" x="196" y="172" width="56" height="22" rx="5"/><text class="on13" x="224" y="188" text-anchor="middle">POST</text></g><g class="pk pa"><rect class="pri" x="196" y="332" width="56" height="22" rx="5"/><text class="on13" x="224" y="348" text-anchor="middle">POST</text></g><g class="k cb"><g class="cm"><rect class="wrnf" x="360" y="84" width="112" height="22" rx="5"/><text class="on13" x="416" y="100" text-anchor="middle" style="font-size:12px">Cookie: SESSION</text></g></g><g class="k cb"><rect class="bm" x="319" y="244" width="112" height="22" rx="5"/><text class="sub" x="375" y="260" text-anchor="middle" style="font-size:12px">cookie withheld</text></g><g class="k res"><rect class="bb" x="580" y="176" width="190" height="26" rx="6"/><text class="badt" x="675" y="194" text-anchor="middle" style="font-size:13px">200 transfer done</text><rect class="bo" x="580" y="336" width="190" height="26" rx="6"/><text class="okt" x="675" y="354" text-anchor="middle" style="font-size:13px">403 no valid token</text></g><text class="sm" x="28" y="400">The attacker never reads the cookie or the token; the browser would have sent the cookie for them.</text>
</svg>
