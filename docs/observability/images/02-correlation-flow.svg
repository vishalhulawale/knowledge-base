<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Correlation ID propagation</title>
  <desc id="d">Animation: a token carrying trace ID 4bf9 moves from the API gateway to order-service, to a pool thread, through a Kafka header and into payment-service. Log lines appear as it goes. On the pool thread the first line has an empty trace ID because a plain executor drops the MDC; it is replaced by a line with 4bf9 once the executor uses ContextPropagatingTaskDecorator. Payment-service extracts the ID from the Kafka header, so every line shares one trace ID.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    .tok{animation:tok 14s infinite linear}
    @keyframes tok{0%{transform:translateX(0px)}8%{transform:translateX(0px)}18%{transform:translateX(154px)}26%{transform:translateX(154px)}36%{transform:translateX(308px)}60%{transform:translateX(308px)}70%{transform:translateX(462px)}78%{transform:translateX(462px)}88%{transform:translateX(616px)}100%{transform:translateX(616px)}}
    @keyframes l0{0%,3.99%{opacity:0}4%,100%{opacity:1}}.l0{animation-name:l0}
    @keyframes l1{0%,17.99%{opacity:0}18%,100%{opacity:1}}.l1{animation-name:l1}
    @keyframes l2{0%,35.99%{opacity:0}36%,49.99%{opacity:1}50%,100%{opacity:0}}.l2{animation-name:l2}
    @keyframes l3{0%,49.99%{opacity:0}50%,100%{opacity:1}}.l3{animation-name:l3}
    @keyframes l4{0%,77.99%{opacity:0}78%,100%{opacity:1}}.l4{animation-name:l4}
    @keyframes l5{0%,87.99%{opacity:0}88%,100%{opacity:1}}.l5{animation-name:l5}
    @media (prefers-reduced-motion: reduce){.tok{animation:none;transform:translateX(616px)}.k{animation:none;opacity:1}.l2{opacity:0}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="394" rx="14"/>
  <text class="h" x="28" y="40">One trace ID across HTTP, a thread pool and Kafka</text><text class="sub" x="28" y="62">Network hops carry it in headers. The in-process thread hop is where it gets lost.</text><rect class="box" x="28" y="86" width="128" height="44" rx="8" stroke-width="1.5"/><text class="sm" x="92" y="113" text-anchor="middle">API gateway</text><rect class="box" x="182" y="86" width="128" height="44" rx="8" stroke-width="1.5"/><text class="sm" x="246" y="113" text-anchor="middle">order-service</text><rect class="box" x="336" y="86" width="128" height="44" rx="8" stroke-width="1.5"/><text class="sm" x="400" y="113" text-anchor="middle">pool thread</text><rect class="box" x="490" y="86" width="128" height="44" rx="8" stroke-width="1.5"/><text class="sm" x="554" y="113" text-anchor="middle">Kafka header</text><rect class="box" x="644" y="86" width="128" height="44" rx="8" stroke-width="1.5"/><text class="sm" x="708" y="113" text-anchor="middle">payment-service</text><line class="ln" x1="157" y1="108" x2="181" y2="108" marker-end="url(#ar)"/><line class="ln" x1="311" y1="108" x2="335" y2="108" marker-end="url(#ar)"/><line class="ln" x1="465" y1="108" x2="489" y2="108" marker-end="url(#ar)"/><line class="ln" x1="619" y1="108" x2="643" y2="108" marker-end="url(#ar)"/><g class="tok"><circle class="pri" cx="92" cy="150" r="13"/><text class="on13" x="92" y="155" text-anchor="middle" style="font-size:10px">4bf9</text></g><rect class="bm" x="28" y="180" width="744" height="196" rx="10"/><text class="sub" x="44" y="204">Log lines (JSON fields shown as key=value)</text><g class="k l0"><text class="mono" x="44" y="232" xml:space="preserve">gateway          traceId=4bf9  POST /orders</text></g><g class="k l1"><text class="mono" x="44" y="258" xml:space="preserve">order-service    traceId=4bf9  order placed</text></g><g class="k l2"><rect class="bb" x="36" y="268" width="728" height="22" rx="4" stroke-width="0"/><text class="mono" x="44" y="284" xml:space="preserve">pool thread      traceId=      audit queued</text><text class="badt" x="520" y="284" style="font-size:13px">MDC empty: plain executor</text></g><g class="k l3"><text class="mono" x="44" y="284" xml:space="preserve">pool thread      traceId=4bf9  audit queued</text><text class="okt" x="520" y="284" style="font-size:13px">ContextPropagatingTaskDecorator</text></g><g class="k l4"><text class="mono" x="44" y="310" xml:space="preserve">payment-service  traceId=4bf9  payment charged</text><text class="okt" x="520" y="310" style="font-size:13px">extracted from header</text></g><g class="k l5"><text class="okt" x="44" y="350" style="font-size:14px">Same trace ID on every line: one query finds the whole request.</text></g>
</svg>
