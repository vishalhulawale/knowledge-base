  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">Monotonic stack: days until a warmer temperature</text>
  <text class="m" x="28" y="62">The stack holds days still waiting for a warmer day; their temperatures decrease towards the top.</text>
  <text class="m" x="64" y="310" text-anchor="middle">day 0</text>
  <text class="m" x="126" y="310" text-anchor="middle">day 1</text>
  <text class="m" x="188" y="310" text-anchor="middle">day 2</text>
  <text class="m" x="250" y="310" text-anchor="middle">day 3</text>
  <text class="m" x="312" y="310" text-anchor="middle">day 4</text>
  <text class="m" x="374" y="310" text-anchor="middle">day 5</text>
  <text class="m" x="436" y="310" text-anchor="middle">day 6</text>
  <text class="m" x="498" y="310" text-anchor="middle">day 7</text>
  <line class="ln smut" x1="34" y1="290" x2="528" y2="290" stroke-width="1.5"/>
  <text class="m" x="40" y="340">answer</text>
  <text class="m" x="560" y="96">stack (top first)</text>
  <g class="fr f0"><rect class="pri" x="40" y="173" width="48" height="117" rx="5"/><text class="tb" x="64" y="166" text-anchor="middle">73</text><text class="m" x="64" y="362" text-anchor="middle">?</text><rect class="box" x="102" y="164" width="48" height="126" rx="5"/><text class="m" x="126" y="157" text-anchor="middle">74</text><rect class="box" x="164" y="155" width="48" height="135" rx="5"/><text class="m" x="188" y="148" text-anchor="middle">75</text><rect class="box" x="226" y="191" width="48" height="99" rx="5"/><text class="m" x="250" y="184" text-anchor="middle">71</text><rect class="box" x="288" y="209" width="48" height="81" rx="5"/><text class="m" x="312" y="202" text-anchor="middle">69</text><rect class="box" x="350" y="182" width="48" height="108" rx="5"/><text class="m" x="374" y="175" text-anchor="middle">72</text><rect class="box" x="412" y="146" width="48" height="144" rx="5"/><text class="m" x="436" y="139" text-anchor="middle">76</text><rect class="box" x="474" y="173" width="48" height="117" rx="5"/><text class="m" x="498" y="166" text-anchor="middle">73</text><rect class="pri" x="560" y="106" width="120" height="28" rx="6"/><text class="on" x="620" y="125" text-anchor="middle" font-size="13">day 0 (73)</text><text class="t" x="560" y="256">Empty stack:</text><text class="t" x="560" y="276">push day 0.</text></g>
