<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Elevator LOOK scheduling</title>
  <desc id="d">An elevator at floor 3 moving up, with up-stops 5 and 8 and down-stops 6 and 2. Following LOOK, it keeps its direction while there are stops ahead: it stops at 5, then 8. With no more stops above, it reverses and serves the down-stops in order, 6 then 2, then goes idle. Each served stop is removed from its sorted set; the next stop going up is the ceiling of the current floor in upStops, and going down the floor of the current floor in downStops.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:16s infinite linear}
    @keyframes car{0%{transform:translate(0px,0px)}5%{transform:translate(0px,0px)}15%{transform:translate(0px,-60px)}22%{transform:translate(0px,-60px)}37%{transform:translate(0px,-150px)}44%{transform:translate(0px,-150px)}54%{transform:translate(0px,-90px)}61%{transform:translate(0px,-90px)}81%{transform:translate(0px,30px)}97%{transform:translate(0px,30px)}99%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}
    .car{animation:car 16s infinite linear}
    @keyframes u0{0%,15%{opacity:1}16%{opacity:0}100%{opacity:0}}
    .u0{animation-name:u0}
    @keyframes u1{0%,37%{opacity:1}38%{opacity:0}100%{opacity:0}}
    .u1{animation-name:u1}
    @keyframes d0{0%,54%{opacity:1}55%{opacity:0}100%{opacity:0}}
    .d0{animation-name:d0}
    @keyframes d1{0%,81%{opacity:1}82%{opacity:0}100%{opacity:0}}
    .d1{animation-name:d1}
    @keyframes up{0%,43%{opacity:1}44%{opacity:0}100%{opacity:0}}
    .up{animation-name:up}
    @keyframes dn{0%{opacity:0}43%{opacity:0}44%,89%{opacity:1}90%{opacity:0}100%{opacity:0}}
    .dn{animation-name:dn}
    @keyframes idle{0%{opacity:0}89%{opacity:0}90%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .idle{animation-name:idle}
    @keyframes g0{0%{opacity:0}14%{opacity:0}15%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .g0{animation-name:g0}
    @keyframes g1{0%{opacity:0}36%{opacity:0}37%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .g1{animation-name:g1}
    @keyframes g2{0%{opacity:0}53%{opacity:0}54%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .g2{animation-name:g2}
    @keyframes g3{0%{opacity:0}80%{opacity:0}81%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .g3{animation-name:g3}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .car{transform:translate(0,-150px)}.u0,.u1,.up,.idle{opacity:0!important}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="438" rx="14"/>
  <text class="h" x="28" y="40">LOOK: keep going while there are stops ahead</text>
  <text class="sub" x="28" y="62">Car at floor 3 going up. upStops = {5, 8}, downStops = {6, 2}.</text>
  <line class="grid" x1="60" x2="160" y1="400" y2="400" style="stroke:#cbd5e1;stroke-width:1"/>
  <text class="sm" x="48" y="392" text-anchor="end">0</text>
  <line class="grid" x1="60" x2="160" y1="370" y2="370" style="stroke:#cbd5e1;stroke-width:1"/>
  <text class="sm" x="48" y="362" text-anchor="end">1</text>
  <line class="grid" x1="60" x2="160" y1="340" y2="340" style="stroke:#cbd5e1;stroke-width:1"/>
  <text class="sm" x="48" y="332" text-anchor="end">2</text>
  <line class="grid" x1="60" x2="160" y1="310" y2="310" style="stroke:#cbd5e1;stroke-width:1"/>
  <text class="sm" x="48" y="302" text-anchor="end">3</text>
  <line class="grid" x1="60" x2="160" y1="280" y2="280" style="stroke:#cbd5e1;stroke-width:1"/>
  <text class="sm" x="48" y="272" text-anchor="end">4</text>
  <line class="grid" x1="60" x2="160" y1="250" y2="250" style="stroke:#cbd5e1;stroke-width:1"/>
  <text class="sm" x="48" y="242" text-anchor="end">5</text>
  <line class="grid" x1="60" x2="160" y1="220" y2="220" style="stroke:#cbd5e1;stroke-width:1"/>
  <text class="sm" x="48" y="212" text-anchor="end">6</text>
  <line class="grid" x1="60" x2="160" y1="190" y2="190" style="stroke:#cbd5e1;stroke-width:1"/>
  <text class="sm" x="48" y="182" text-anchor="end">7</text>
  <line class="grid" x1="60" x2="160" y1="160" y2="160" style="stroke:#cbd5e1;stroke-width:1"/>
  <text class="sm" x="48" y="152" text-anchor="end">8</text>
  <line class="grid" x1="60" x2="160" y1="130" y2="130" style="stroke:#cbd5e1;stroke-width:1"/>
  <text class="sm" x="48" y="122" text-anchor="end">9</text>
  <rect class="bm" x="70" y="100" width="80" height="300" rx="6" stroke-width="1"/>
  <text class="sm prit" x="170" y="242">▲ up-stop</text>
  <text class="sm prit" x="170" y="152">▲ up-stop</text>
  <text class="sm teat" x="170" y="212">▼ down-stop</text>
  <text class="sm teat" x="170" y="332">▼ down-stop</text>
  <g class="car">
  <rect class="wrnf" x="80" y="286" width="60" height="22" rx="6"/>
  <text class="on13" x="110" y="301.5" text-anchor="middle">car</text>
  </g>
  <text class="lbl" x="320" y="110">upStops (TreeSet)</text>
  <text class="lbl" x="320" y="200">downStops (TreeSet)</text>
  <g class="a u0">
  <rect class="pri" x="320" y="122" width="50" height="32" rx="6"/>
  <text class="on" x="345" y="142.5" text-anchor="middle">5</text>
  </g>
  <g class="a u1">
  <rect class="pri" x="380" y="122" width="50" height="32" rx="6"/>
  <text class="on" x="405" y="142.5" text-anchor="middle">8</text>
  </g>
  <g class="a d0">
  <rect class="tea" x="320" y="212" width="50" height="32" rx="6"/>
  <text class="on" x="345" y="232.5" text-anchor="middle">6</text>
  </g>
  <g class="a d1">
  <rect class="tea" x="380" y="212" width="50" height="32" rx="6"/>
  <text class="on" x="405" y="232.5" text-anchor="middle">2</text>
  </g>
  <text class="tx prit a up" x="320" y="296">direction: ▲ UP, next = upStops.ceiling(floor)</text>
  <text class="tx teat a dn" x="320" y="296">reversed: ▼ DOWN, next = downStops.floor(floor)</text>
  <text class="tx a idle" x="320" y="296">both sets empty → IDLE</text>
  <text class="tx a g0" x="320" y="334">1. stop at 5</text>
  <text class="tx a g1" x="530" y="334">2. stop at 8</text>
  <text class="tx a g2" x="320" y="356">3. reverse; stop at 6</text>
  <text class="tx a g3" x="530" y="356">4. stop at 2</text>
  <text class="sub" x="28" y="426">No zig-zag (3→6→5→8…) and no starvation: every stop is reached within one sweep in each direction.</text>
</svg>
