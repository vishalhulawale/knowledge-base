    .i08{animation-name:i08}
    @keyframes i09{0%{opacity:0}75%{opacity:0}76%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .i09{animation-name:i09}
    @keyframes i10{0%{opacity:0}3%{opacity:0}4%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .i10{animation-name:i10}
    @keyframes i11{0%{opacity:0}11%{opacity:0}12%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .i11{animation-name:i11}
    @keyframes i12{0%{opacity:0}19%{opacity:0}20%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .i12{animation-name:i12}
    @keyframes i13{0%{opacity:0}27%{opacity:0}28%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .i13{animation-name:i13}
    @keyframes i14{0%{opacity:0}35%{opacity:0}36%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .i14{animation-name:i14}
    @keyframes i15{0%{opacity:0}43%{opacity:0}44%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .i15{animation-name:i15}
    @keyframes i16{0%{opacity:0}51%{opacity:0}52%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .i16{animation-name:i16}
    @keyframes i17{0%{opacity:0}59%{opacity:0}60%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .i17{animation-name:i17}
    @keyframes i18{0%{opacity:0}67%{opacity:0}68%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .i18{animation-name:i18}
