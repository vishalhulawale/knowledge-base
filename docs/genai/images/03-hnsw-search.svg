  <circle class="mutf" cx="80" cy="235" r="6"/>
  <circle class="mutf" cx="190" cy="225" r="6"/>
  <circle class="mutf" cx="300" cy="240" r="6"/>
  <circle class="mutf" cx="420" cy="228" r="6"/>
  <circle class="mutf" cx="520" cy="235" r="6"/>
  <polygon class="badf" points="600.0,218.0 602.4,223.7 608.6,224.2 603.9,228.3 605.3,234.3 600.0,231.1 594.7,234.3 596.1,228.3 591.4,224.2 597.6,223.7"/>
  <rect class="box" x="20" y="304" width="610" height="126" rx="10" stroke-width="1.2"/>
  <text class="sub" x="34" y="322">Layer 0 (every vector)</text>
  <line class="lnm" x1="72" y1="403" x2="112" y2="385"/>
  <line class="lnm" x1="112" y1="385" x2="140" y2="395"/>
