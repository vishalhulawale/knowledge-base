<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Life of kubectl apply</title>
  <desc id="d">kubectl apply sends a Deployment with 3 replicas. The API server authenticates, authorises, runs admission and stores it in etcd, and kubectl returns. The Deployment controller sees it and creates a ReplicaSet. The ReplicaSet controller creates three Pods with no node. The scheduler binds each Pod to a node. Each node&#x27;s kubelet pulls the image, starts the containers, runs probes and reports the Pod as Running and Ready. Every step goes through the API server, and every step after the first is asynchronous.</desc>
