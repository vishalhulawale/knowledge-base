<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">TLS 1.2 vs TLS 1.3 round trips</title>
  <desc id="d">Two handshakes side by side, client on the left and server on the right of each lane, time running down. TLS 1.2 needs two round trips before the client can send its HTTP request: ClientHello, then ServerHello with certificate and key exchange, then the client&#x27;s key exchange and Finished, then the server&#x27;s Finished. TLS 1.3 needs one: the ClientHello already carries the client&#x27;s X25519 key share, the server answers with its key share, the encrypted certificate, CertificateVerify and Finished, and the client sends Finished together with the first request. On a 100 ms round-trip link that saves 100 ms on every new connection.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:16s infinite linear}
    @keyframes a0{0%{opacity:0}1%{opacity:0}2%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a0{animation-name:a0}
    @keyframes a1{0%{opacity:0}13%{opacity:0}14%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a1{animation-name:a1}
    @keyframes a2{0%{opacity:0}25%{opacity:0}26%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a2{animation-name:a2}
    @keyframes a3{0%{opacity:0}37%{opacity:0}38%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a3{animation-name:a3}
    @keyframes a4{0%{opacity:0}49%{opacity:0}50%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .a4{animation-name:a4}
    @keyframes an{0%{opacity:0}53%{opacity:0}54%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .an{animation-name:an}
    @keyframes b0{0%{opacity:0}1%{opacity:0}2%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .b0{animation-name:b0}
    @keyframes b1{0%{opacity:0}13%{opacity:0}14%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .b1{animation-name:b1}
    @keyframes b2{0%{opacity:0}25%{opacity:0}26%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .b2{animation-name:b2}
    @keyframes bn{0%{opacity:0}29%{opacity:0}30%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .bn{animation-name:bn}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      
    }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="458" rx="14"/>
  <text class="h" x="28" y="40">Time to first request byte</text>
  <text class="sub" x="28" y="62">Client left, server right of each lane; time runs down. Each round trip ≈ one RTT of the network.</text>
  <text class="h2" x="28" y="100">TLS 1.2</text>
  <text class="sm" x="28" y="124">client</text>
  <text class="sm" x="358" y="124" text-anchor="end">server</text>
  <line class="ln" x1="38" y1="132" x2="38" y2="372" style="stroke-width:1"/>
  <line class="ln" x1="348" y1="132" x2="348" y2="372" style="stroke-width:1"/>
  <line class="ln a a0" x1="40" y1="140" x2="344" y2="166" marker-end="url(#ar)"/>
  <text class="sm a a0" x="193" y="139" text-anchor="middle" font-weight="700">ClientHello</text>
  <line class="ln a a1" x1="346" y1="180" x2="42" y2="206" marker-end="url(#ar)"/>
  <text class="sm a a1" x="193" y="179" text-anchor="middle" font-weight="700">ServerHello, Cert, KeyExchange</text>
  <line class="ln a a2" x1="40" y1="220" x2="344" y2="246" marker-end="url(#ar)"/>
  <text class="sm a a2" x="193" y="219" text-anchor="middle" font-weight="700">KeyExchange, Finished</text>
  <line class="ln a a3" x1="346" y1="260" x2="42" y2="286" marker-end="url(#ar)"/>
  <text class="sm a a3" x="193" y="259" text-anchor="middle" font-weight="700">Finished</text>
  <line class="lnp a a4" x1="40" y1="300" x2="344" y2="326" marker-end="url(#arp)"/>
  <text class="sm a a4" x="193" y="299" text-anchor="middle" font-weight="700">GET /claims (encrypted)</text>
  <text class="tx badt a an" x="28" y="400">2 RTT before the request</text>
  <text class="h2" x="420" y="100">TLS 1.3</text>
  <text class="sm" x="420" y="124">client</text>
  <text class="sm" x="750" y="124" text-anchor="end">server</text>
  <line class="ln" x1="430" y1="132" x2="430" y2="372" style="stroke-width:1"/>
  <line class="ln" x1="740" y1="132" x2="740" y2="372" style="stroke-width:1"/>
  <line class="ln a b0" x1="432" y1="140" x2="736" y2="166" marker-end="url(#ar)"/>
  <text class="sm a b0" x="585" y="139" text-anchor="middle" font-weight="700">ClientHello + key_share</text>
  <line class="ln a b1" x1="738" y1="180" x2="434" y2="206" marker-end="url(#ar)"/>
  <text class="sm a b1" x="585" y="179" text-anchor="middle" font-weight="700">ServerHello + share, {Cert … Finished}</text>
  <line class="lnp a b2" x1="432" y1="220" x2="736" y2="246" marker-end="url(#arp)"/>
  <text class="sm a b2" x="585" y="219" text-anchor="middle" font-weight="700">{Finished} + GET /claims</text>
  <text class="tx okt a bn" x="420" y="400">1 RTT before the request</text>
  <text class="sub" x="28" y="432">TLS 1.3 also encrypts the certificate and allows only ephemeral (EC)DHE, so forward secrecy is mandatory.</text>
</svg>
