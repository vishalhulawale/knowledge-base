<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Utilisation vs queueing delay</title>
<desc id="d">A curve of queueing wait, in multiples of service time, against utilisation. Using the M/M/1 approximation rho over one minus rho, the wait is 1 times at 50%, 4 times at 80%, 9 times at 90% and 19 times at 95%, and the queue grows forever at 100%. A band from 50 to 70% marks the typical capacity target. A side panel explains Little's law: 400 requests per second times 0.05 seconds is about 20 requests in flight, and a slower dependency raises the time in system and therefore the number in flight.</desc>
