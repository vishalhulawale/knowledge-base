<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Write amplification fan-out</title>
  <desc id="d">Animation in four steps. One INSERT into an orders table writes the heap page holding the row, then four index entries (primary key, member and created date, pharmacy and status, and a unique external reference), then write-ahead log records flushed on commit, then two replicas replay the log and write the same heap and four index pages. A counter goes from 1 to 5 to 15 page writes, plus the log. Counts are simplified.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes w1{0%,3.99%{opacity:0}4%,96.99%{opacity:1}97%,100%{opacity:0}}.w1{animation-name:w1}
    @keyframes w2{0%,21.99%{opacity:0}22%,96.99%{opacity:1}97%,100%{opacity:0}}.w2{animation-name:w2}
    @keyframes w3{0%,41.99%{opacity:0}42%,96.99%{opacity:1}97%,100%{opacity:0}}.w3{animation-name:w3}
    @keyframes w4{0%,59.99%{opacity:0}60%,96.99%{opacity:1}97%,100%{opacity:0}}.w4{animation-name:w4}
    @keyframes c1{0%,3.99%{opacity:0}4%,21.99%{opacity:1}22%,100%{opacity:0}}.c1{animation-name:c1}
    @keyframes c2{0%,21.99%{opacity:0}22%,59.99%{opacity:1}60%,100%{opacity:0}}.c2{animation-name:c2}
    @keyframes c3{0%,59.99%{opacity:0}60%,96.99%{opacity:1}97%,100%{opacity:0}}.c3{animation-name:c3}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}.c1,.c2{opacity:0}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="410" rx="14"/>
  <text class="h" x="28" y="40">One INSERT, many writes</text><text class="sub" x="28" y="62">Orders table with a primary key and three secondary indexes, two replicas. Counts simplified.</text><rect class="bp" x="28" y="150" width="200" height="74" rx="10" stroke-width="1.5"/><text class="mono" x="42" y="176" xml:space="preserve">INSERT INTO rx_order</text><text class="mono" x="42" y="196" xml:space="preserve">VALUES (…)</text><text class="prit" x="128" y="244" text-anchor="middle" style="font-size:14px">1 logical row</text><text class="lbl" x="286" y="88">Primary</text><rect class="box" x="286" y="104" width="236" height="28" rx="6" stroke-width="1.2"/><text class="sm" x="298" y="123">heap page (the row)</text><rect class="box" x="286" y="152" width="236" height="28" rx="6" stroke-width="1.2"/><text class="sm" x="298" y="171">index: primary key</text><rect class="box" x="286" y="186" width="236" height="28" rx="6" stroke-width="1.2"/><text class="sm" x="298" y="205">index: (member_id, created_at)</text><rect class="box" x="286" y="220" width="236" height="28" rx="6" stroke-width="1.2"/><text class="sm" x="298" y="239">index: (pharmacy_id, status)</text><rect class="box" x="286" y="254" width="236" height="28" rx="6" stroke-width="1.2"/><text class="sm" x="298" y="273">index: external_ref UNIQUE</text><rect class="box" x="286" y="300" width="236" height="28" rx="6" stroke-width="1.2"/><text class="sm" x="298" y="319">write-ahead log records</text><rect class="box" x="588" y="110" width="184" height="92" rx="8" stroke-width="1.2"/><text class="lbl" x="602" y="134">Replica 1</text><text class="sm" x="602" y="158">replays WAL:</text><text class="sm" x="602" y="178">heap + 4 index pages</text><rect class="box" x="588" y="236" width="184" height="92" rx="8" stroke-width="1.2"/><text class="lbl" x="602" y="260">Replica 2</text><text class="sm" x="602" y="284">replays WAL:</text><text class="sm" x="602" y="304">heap + 4 index pages</text><g class="k w1"><line class="lnp" x1="228" y1="180" x2="284" y2="118" marker-end="url(#arp)"/><rect class="tea" x="286" y="104" width="236" height="28" rx="6"/><text class="on13" x="298" y="123">heap page (the row)</text></g><g class="k w2"><line class="lnp" x1="228" y1="192" x2="284" y2="166" marker-end="url(#arp)"/><line class="lnp" x1="228" y1="200" x2="284" y2="266" marker-end="url(#arp)"/><rect class="tea" x="286" y="152" width="236" height="28" rx="6"/><text class="on13" x="298" y="171">index: primary key</text><rect class="tea" x="286" y="186" width="236" height="28" rx="6"/><text class="on13" x="298" y="205">index: (member_id, created_at)</text><rect class="tea" x="286" y="220" width="236" height="28" rx="6"/><text class="on13" x="298" y="239">index: (pharmacy_id, status)</text><rect class="tea" x="286" y="254" width="236" height="28" rx="6"/><text class="on13" x="298" y="273">index: external_ref UNIQUE</text></g><g class="k w3"><line class="lnp" x1="228" y1="212" x2="284" y2="312" marker-end="url(#arp)"/><rect class="wrnf" x="286" y="300" width="236" height="28" rx="6"/><text class="on13" x="298" y="319">write-ahead log records</text><text class="wrnt" x="404" y="350" text-anchor="middle" style="font-size:13px">fsync on commit</text></g><g class="k w4"><line class="lnw" x1="522" y1="314" x2="586" y2="160" marker-end="url(#arw)"/><line class="lnw" x1="522" y1="314" x2="586" y2="286" marker-end="url(#arw)"/><rect class="tea" x="588" y="110" width="184" height="92" rx="8"/><text class="on" x="602" y="134">Replica 1</text><text class="on13" x="602" y="158">replays WAL:</text><text class="on13" x="602" y="178">heap + 4 index pages</text><rect class="tea" x="588" y="236" width="184" height="92" rx="8"/><text class="on" x="602" y="260">Replica 2</text><text class="on13" x="602" y="284">replays WAL:</text><text class="on13" x="602" y="304">heap + 4 index pages</text></g><text class="sub" x="28" y="300">page writes</text><g class="k c1"><text class="prit" x="28" y="340" style="font-size:36px">1</text></g><g class="k c2"><text class="prit" x="28" y="340" style="font-size:36px">5</text></g><g class="k c3"><text class="prit" x="28" y="340" style="font-size:36px">15</text></g><text class="sm" x="28" y="392">(1 row + 4 indexes) × 3 copies = 15 page writes, plus WAL. Every extra index adds 3 more.</text>
</svg>
