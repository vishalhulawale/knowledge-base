<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Write concern latency, measured</title>
  <desc id="d">Median and 99th percentile insert latency for each write concern, measured on the page&#x27;s three-member replica set. w 0: median 0.075 ms, p99 0.9 ms, not acknowledged. w 1: 0.85 ms and 2.8 ms, can be rolled back. w majority: 2.2 ms and 5.5 ms, survives a primary crash. w 3: 2.6 ms and 5.7 ms, survives but blocks if any member is down. w majority with j true: 2.2 ms and 3.7 ms.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .rg{stroke:#4f46e5;stroke-width:3}.md{fill:#4f46e5}.grid{stroke:#e2e8f0;stroke-width:1}@media (prefers-color-scheme: dark){.rg{stroke:#6366f1}.md{fill:#6366f1}.grid{stroke:#334155}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Durability costs about a millisecond</text>
  <text class="sub" x="28" y="62">Median (dot) to p99 (tick) insert latency on a 3-member replica set. Measured on the page.</text>
  <line class="grid" x1="190.0" x2="190.0" y1="92" y2="330"/>
  <text class="sm" x="190" y="346" text-anchor="middle">0 ms</text>
  <line class="grid" x1="245.0" x2="245.0" y1="92" y2="330"/>
  <text class="sm" x="245" y="346" text-anchor="middle">1 ms</text>
  <line class="grid" x1="300.0" x2="300.0" y1="92" y2="330"/>
  <text class="sm" x="300" y="346" text-anchor="middle">2 ms</text>
  <line class="grid" x1="355.0" x2="355.0" y1="92" y2="330"/>
  <text class="sm" x="355" y="346" text-anchor="middle">3 ms</text>
  <line class="grid" x1="410.0" x2="410.0" y1="92" y2="330"/>
  <text class="sm" x="410" y="346" text-anchor="middle">4 ms</text>
  <line class="grid" x1="465.0" x2="465.0" y1="92" y2="330"/>
  <text class="sm" x="465" y="346" text-anchor="middle">5 ms</text>
  <line class="grid" x1="520.0" x2="520.0" y1="92" y2="330"/>
  <text class="sm" x="520" y="346" text-anchor="middle">6 ms</text>
  <text class="tx" x="176" y="117" text-anchor="end" font-weight="700">w: 0</text>
  <line class="rg" x1="194.1" x2="239.5" y1="112" y2="112"/>
  <circle class="md" cx="194.1" cy="112" r="6"/>
  <line class="rg" x1="239.5" x2="239.5" y1="104" y2="120"/>
  <text class="sm badt" x="536" y="117">not acknowledged</text>
  <text class="tx" x="176" y="163" text-anchor="end" font-weight="700">w: 1</text>
  <line class="rg" x1="236.8" x2="344.0" y1="158" y2="158"/>
  <circle class="md" cx="236.8" cy="158" r="6"/>
  <line class="rg" x1="344.0" x2="344.0" y1="150" y2="166"/>
  <text class="sm badt" x="536" y="163">can be rolled back</text>
  <text class="tx" x="176" y="209" text-anchor="end" font-weight="700">w: &quot;majority&quot;</text>
  <line class="rg" x1="311.0" x2="492.5" y1="204" y2="204"/>
  <circle class="md" cx="311.0" cy="204" r="6"/>
  <line class="rg" x1="492.5" x2="492.5" y1="196" y2="212"/>
  <text class="sm okt" x="536" y="209">survives a crash (default)</text>
  <text class="tx" x="176" y="255" text-anchor="end" font-weight="700">w: 3</text>
  <line class="rg" x1="333.0" x2="503.5" y1="250" y2="250"/>
  <circle class="md" cx="333.0" cy="250" r="6"/>
  <line class="rg" x1="503.5" x2="503.5" y1="242" y2="258"/>
  <text class="sm wrnt" x="536" y="255">blocks if any member is down</text>
  <text class="tx" x="176" y="301" text-anchor="end" font-weight="700">majority, j: true</text>
  <line class="rg" x1="311.0" x2="393.5" y1="296" y2="296"/>
  <circle class="md" cx="311.0" cy="296" r="6"/>
  <line class="rg" x1="393.5" x2="393.5" y1="288" y2="304"/>
  <text class="sm okt" x="536" y="301">survives a crash</text>
  <text class="sub" x="28" y="370">A write-concern timeout means &quot;not confirmed in time&quot;, not &quot;not applied&quot;: retry idempotently.</text>
</svg>
