<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">hash mod N remaps most keys when N changes</title>
  <desc id="d">Twenty keys with hash values 0 to 19 are placed on shards with hash mod 4 and then with hash mod 5. Only keys 0, 1, 2 and 3 stay on the same shard. The other 16 keys, 80 percent, move to a different shard.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:14px;font-weight:600}
    .sub{fill:#64748b;font-size:13px}
    .cell{fill:#ffffff;stroke:#cbd5e1}
    .num{fill:#334155;font-size:14px}
    .stay{fill:#dcfce7;stroke:#16a34a;stroke-width:1.5}
    .move{fill:#fee2e2;stroke:#dc2626;stroke-width:1.5}
    .good{fill:#16a34a;font-size:15px;font-weight:700}
    .bad{fill:#dc2626;font-size:15px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.num{fill:#e2e8f0}.sub{fill:#94a3b8}
      .cell{fill:#111827;stroke:#475569}
      .stay{fill:#14532d;stroke:#4ade80}.move{fill:#450a0a;stroke:#f87171}
      .good{fill:#4ade80}.bad{fill:#f87171}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="328" rx="14"/>
  <text class="h" x="28" y="40">Why not hash(key) mod N?</text>
  <text class="sub" x="28" y="62">Going from 4 to 5 shards. Each column is one key; the numbers are shard indexes.</text>
  <text class="lbl" x="28" y="111">hash</text>
  <text class="lbl" x="28" y="153">mod 4</text>
  <text class="lbl" x="28" y="195">mod 5</text>
  <rect class="cell" x="104.0" y="88" width="32" height="34" rx="5"/><text class="num" x="120.0" y="110" text-anchor="middle">0</text>
  <rect class="cell" x="104.0" y="130" width="32" height="34" rx="5"/><text class="num" x="120.0" y="152" text-anchor="middle">0</text>
  <rect class="stay" x="104.0" y="172" width="32" height="34" rx="5"/><text class="num" x="120.0" y="194" text-anchor="middle">0</text>
  <rect class="cell" x="137.5" y="88" width="32" height="34" rx="5"/><text class="num" x="153.5" y="110" text-anchor="middle">1</text>
  <rect class="cell" x="137.5" y="130" width="32" height="34" rx="5"/><text class="num" x="153.5" y="152" text-anchor="middle">1</text>
  <rect class="stay" x="137.5" y="172" width="32" height="34" rx="5"/><text class="num" x="153.5" y="194" text-anchor="middle">1</text>
  <rect class="cell" x="171.0" y="88" width="32" height="34" rx="5"/><text class="num" x="187.0" y="110" text-anchor="middle">2</text>
  <rect class="cell" x="171.0" y="130" width="32" height="34" rx="5"/><text class="num" x="187.0" y="152" text-anchor="middle">2</text>
  <rect class="stay" x="171.0" y="172" width="32" height="34" rx="5"/><text class="num" x="187.0" y="194" text-anchor="middle">2</text>
  <rect class="cell" x="204.5" y="88" width="32" height="34" rx="5"/><text class="num" x="220.5" y="110" text-anchor="middle">3</text>
  <rect class="cell" x="204.5" y="130" width="32" height="34" rx="5"/><text class="num" x="220.5" y="152" text-anchor="middle">3</text>
  <rect class="stay" x="204.5" y="172" width="32" height="34" rx="5"/><text class="num" x="220.5" y="194" text-anchor="middle">3</text>
  <rect class="cell" x="238.0" y="88" width="32" height="34" rx="5"/><text class="num" x="254.0" y="110" text-anchor="middle">4</text>
  <rect class="cell" x="238.0" y="130" width="32" height="34" rx="5"/><text class="num" x="254.0" y="152" text-anchor="middle">0</text>
  <rect class="move" x="238.0" y="172" width="32" height="34" rx="5"/><text class="num" x="254.0" y="194" text-anchor="middle">4</text>
  <rect class="cell" x="271.5" y="88" width="32" height="34" rx="5"/><text class="num" x="287.5" y="110" text-anchor="middle">5</text>
  <rect class="cell" x="271.5" y="130" width="32" height="34" rx="5"/><text class="num" x="287.5" y="152" text-anchor="middle">1</text>
  <rect class="move" x="271.5" y="172" width="32" height="34" rx="5"/><text class="num" x="287.5" y="194" text-anchor="middle">0</text>
  <rect class="cell" x="305.0" y="88" width="32" height="34" rx="5"/><text class="num" x="321.0" y="110" text-anchor="middle">6</text>
  <rect class="cell" x="305.0" y="130" width="32" height="34" rx="5"/><text class="num" x="321.0" y="152" text-anchor="middle">2</text>
  <rect class="move" x="305.0" y="172" width="32" height="34" rx="5"/><text class="num" x="321.0" y="194" text-anchor="middle">1</text>
  <rect class="cell" x="338.5" y="88" width="32" height="34" rx="5"/><text class="num" x="354.5" y="110" text-anchor="middle">7</text>
  <rect class="cell" x="338.5" y="130" width="32" height="34" rx="5"/><text class="num" x="354.5" y="152" text-anchor="middle">3</text>
  <rect class="move" x="338.5" y="172" width="32" height="34" rx="5"/><text class="num" x="354.5" y="194" text-anchor="middle">2</text>
  <rect class="cell" x="372.0" y="88" width="32" height="34" rx="5"/><text class="num" x="388.0" y="110" text-anchor="middle">8</text>
  <rect class="cell" x="372.0" y="130" width="32" height="34" rx="5"/><text class="num" x="388.0" y="152" text-anchor="middle">0</text>
  <rect class="move" x="372.0" y="172" width="32" height="34" rx="5"/><text class="num" x="388.0" y="194" text-anchor="middle">3</text>
  <rect class="cell" x="405.5" y="88" width="32" height="34" rx="5"/><text class="num" x="421.5" y="110" text-anchor="middle">9</text>
  <rect class="cell" x="405.5" y="130" width="32" height="34" rx="5"/><text class="num" x="421.5" y="152" text-anchor="middle">1</text>
