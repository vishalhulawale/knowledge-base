<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Transaction markers and read_committed</title>
  <desc id="d">One partition holds records from three transactions. Transaction T1 wrote a and b and then a COMMIT marker. T2 wrote c and was aborted, so an ABORT marker follows. T3 has written d and e and is still open. A read_uncommitted consumer reads up to the high watermark and sees a, b, c and d, e, including the aborted c and the not-yet-committed d and e. A read_committed consumer reads only up to the last stable offset, the first offset of the open transaction T3, and skips the aborted c, so it sees only a and b. Markers take up an offset but are never returned to applications.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <defs><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">What each isolation level sees in the same partition</text>
  <text class="sub" x="28" y="62">Markers occupy offsets but are never handed to applications.</text>
  <rect class="pri" x="40" y="110" width="84" height="44" rx="6"/>
  <text class="on" x="82" y="136.5" text-anchor="middle">a</text>
  <text class="sm" x="82" y="172" text-anchor="middle">0  ·  T1</text>
  <rect class="pri" x="132" y="110" width="84" height="44" rx="6"/>
  <text class="on" x="174" y="136.5" text-anchor="middle">b</text>
  <text class="sm" x="174" y="172" text-anchor="middle">1  ·  T1</text>
  <rect class="bo" x="224" y="110" width="84" height="44" rx="8" stroke-width="1.5"/>
  <text class="sm okt" x="266" y="137" text-anchor="middle">COMMIT</text>
  <text class="sm" x="266" y="172" text-anchor="middle">2  ·  T1</text>
  <rect class="badf" x="316" y="110" width="84" height="44" rx="6"/>
  <text class="on" x="358" y="136.5" text-anchor="middle">c</text>
  <text class="sm" x="358" y="172" text-anchor="middle">3  ·  T2</text>
  <rect class="bb" x="408" y="110" width="84" height="44" rx="8" stroke-width="1.5"/>
  <text class="sm badt" x="450" y="137" text-anchor="middle">ABORT</text>
  <text class="sm" x="450" y="172" text-anchor="middle">4  ·  T2</text>
  <rect class="wrnf" x="500" y="110" width="84" height="44" rx="6"/>
  <text class="on" x="542" y="136.5" text-anchor="middle">d</text>
  <text class="sm" x="542" y="172" text-anchor="middle">5  ·  T3</text>
  <rect class="wrnf" x="592" y="110" width="84" height="44" rx="6"/>
  <text class="on" x="634" y="136.5" text-anchor="middle">e</text>
  <text class="sm" x="634" y="172" text-anchor="middle">6  ·  T3</text>
  <text class="sm okt" x="40" y="100">T1 committed</text>
  <text class="sm badt" x="316" y="100">T2 aborted</text>
  <text class="sm wrnt" x="500" y="100">T3 still open</text>
  <line class="lnt" x1="496" y1="200" x2="496" y2="160" marker-end="url(#art)"/>
  <text class="tx" x="496" y="218" text-anchor="middle" font-weight="700">LSO = 5</text>
  <line class="lnp" x1="680" y1="200" x2="680" y2="160" marker-end="url(#arp)"/>
  <text class="tx" x="680" y="218" text-anchor="middle" font-weight="700">HW = 7</text>
  <text class="lbl" x="28" y="268">read_uncommitted</text>
  <text class="sm" x="28" y="284">(the default)</text>
  <text class="tx badt" x="260" y="268">gets a, b, c, d, e: includes the aborted c and uncommitted d, e</text>
  <text class="lbl" x="28" y="314">read_committed</text>
  <text class="tx okt" x="260" y="314">gets a, b; stops at the LSO, skips aborted c</text>
  <text class="sub" x="28" y="346">An open transaction holds back read_committed consumers on that partition until it commits</text>
  <text class="sub" x="28" y="364">or aborts, so a stuck producer shows up as lag (bounded by transaction.timeout.ms).</text>
</svg>
