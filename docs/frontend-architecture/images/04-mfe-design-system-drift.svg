<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Design system across micro-frontends</title>
  <desc id="d">One page made of three micro-frontends. Top, each bundles its own design-system version: claims uses @org/ui 3.8 with square blue buttons, pharmacy uses 4.1 with rounded indigo buttons, and profile uses 4.3 with another style, so the page looks inconsistent and downloads three copies of the library and three CSS-in-JS runtimes. Bottom, the shell provides tokens as CSS variables and shares the library as a singleton: all three render the same button and load one copy.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Three micro-frontends, one page</text>
  <text class="sub" x="28" y="62">Top: each MFE bundles its own @org/ui. Bottom: shell tokens + shared singleton.</text>
  <text class="h2 badt" x="28" y="104">Each MFE bundles its own version</text>
  <rect class="box" x="28" y="116" width="236" height="90" rx="10" stroke-width="1.2"/>
  <text class="lbl" x="40" y="138">claims MFE</text>
  <text class="sm" x="40" y="156">@org/ui 3.8 + own Emotion</text>
  <rect class="pri" x="40" y="166" width="96" height="30" rx="2"/>
  <text class="on13" x="88" y="186" text-anchor="middle">Submit</text>
  <rect class="box" x="278" y="116" width="236" height="90" rx="10" stroke-width="1.2"/>
  <text class="lbl" x="290" y="138">pharmacy MFE</text>
  <text class="sm" x="290" y="156">@org/ui 4.1 + own Emotion</text>
  <rect class="tea" x="290" y="166" width="96" height="30" rx="14"/>
  <text class="on13" x="338" y="186" text-anchor="middle">Submit</text>
  <rect class="box" x="528" y="116" width="236" height="90" rx="10" stroke-width="1.2"/>
  <text class="lbl" x="540" y="138">profile MFE</text>
  <text class="sm" x="540" y="156">@org/ui 4.3 + own Emotion</text>
  <rect class="wrnf" x="540" y="166" width="96" height="30" rx="6"/>
  <text class="on13" x="588" y="186" text-anchor="middle">SUBMIT</text>
  <text class="tx badt" x="28" y="228">3 button styles · 3 copies of the library · 3 CSS-in-JS runtimes</text>
  <text class="h2 okt" x="28" y="268">Shell tokens + shared singleton</text>
  <rect class="box" x="28" y="280" width="236" height="76" rx="10" stroke-width="1.2"/>
  <text class="lbl" x="40" y="302">claims MFE</text>
  <rect class="pri" x="40" y="314" width="96" height="30" rx="2"/>
  <text class="on13" x="88" y="334" text-anchor="middle">Submit</text>
  <rect class="box" x="278" y="280" width="236" height="76" rx="10" stroke-width="1.2"/>
  <text class="lbl" x="290" y="302">pharmacy MFE</text>
  <rect class="pri" x="290" y="314" width="96" height="30" rx="2"/>
  <text class="on13" x="338" y="334" text-anchor="middle">Submit</text>
  <rect class="box" x="528" y="280" width="236" height="76" rx="10" stroke-width="1.2"/>
  <text class="lbl" x="540" y="302">profile MFE</text>
  <rect class="pri" x="540" y="314" width="96" height="30" rx="2"/>
  <text class="on13" x="588" y="334" text-anchor="middle">Submit</text>
  <text class="sm okt" x="28" y="380">one look, one download: shell CSS-variable tokens, shared @org/ui + MUI + React</text>
</svg>
