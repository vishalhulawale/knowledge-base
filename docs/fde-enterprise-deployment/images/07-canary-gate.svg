<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Canary gate decisions</title>
  <desc id="d">Animation cycling through three canary windows judged against a stable baseline of 18,000 requests, 0.20 percent errors, 4,200 ms p95, 94.0 percent eval pass rate and 0.031 dollars per task. Window 1 has only 300 requests, below the 500 minimum, so the gate holds. Window 2 has 2,000 requests at 0.25 percent errors, 4,400 ms, 93.5 percent eval pass and 0.032 dollars, all within the rules, so it promotes. Window 3 has 2,000 requests at 0.20 percent errors and 4,300 ms but 90.0 percent eval pass and 0.041 dollars per task, failing the quality and cost gates, so it rolls back, a release an error-rate-only gate would have promoted.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
