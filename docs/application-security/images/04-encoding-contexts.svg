<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 458" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Output encoding by context</title>
  <desc id="d">One untrusted value, a ampersand b, quote c quote, angle-bracket d, is written into five contexts. HTML body encoding turns the ampersand, quotes and angle brackets into entities. Attribute encoding does the same except the closing bracket. JavaScript string encoding uses backslash-x escapes. URL encoding uses percent escapes and plus for spaces. For SQL the value is bound as a parameter rather than encoded. Output is simplified and illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="456" rx="14"/>
  <text class="h" x="28" y="40">One value, five output contexts</text><text class="sub" x="28" y="62">Simplified encoder output, illustrative.</text><rect class="bw" x="250" y="82" width="300" height="40" rx="8" stroke-width="1.5"/><text class="mono" x="400" y="107" text-anchor="middle" xml:space="preserve">a&amp;b "c" &lt;d&gt;</text><text class="sub" x="560" y="107">untrusted input, stored raw</text><rect class="bp" x="28" y="142" width="170" height="38" rx="6" stroke-width="1.2"/><text class="sm" x="40" y="166" font-weight="700">HTML body</text><text class="sub" x="214" y="166">Encode.forHtml</text><rect class="box" x="420" y="142" width="352" height="38" rx="6" stroke-width="1"/><text class="mono" x="432" y="166" xml:space="preserve">a&amp;amp;b &amp;#34;c&amp;#34; &amp;lt;d&amp;gt;</text><line class="ln" x1="402" y1="161" x2="416" y2="161" marker-end="url(#ar)"/><rect class="bp" x="28" y="194" width="170" height="38" rx="6" stroke-width="1.2"/><text class="sm" x="40" y="218" font-weight="700">HTML attribute</text><text class="sub" x="214" y="218">Encode.forHtmlAttribute</text><rect class="box" x="420" y="194" width="352" height="38" rx="6" stroke-width="1"/><text class="mono" x="432" y="218" xml:space="preserve">a&amp;amp;b &amp;#34;c&amp;#34; &amp;lt;d&gt;</text><line class="ln" x1="402" y1="213" x2="416" y2="213" marker-end="url(#ar)"/><rect class="bp" x="28" y="246" width="170" height="38" rx="6" stroke-width="1.2"/><text class="sm" x="40" y="270" font-weight="700">JavaScript string</text><text class="sub" x="214" y="270">Encode.forJavaScript</text><rect class="box" x="420" y="246" width="352" height="38" rx="6" stroke-width="1"/><text class="mono" x="432" y="270" xml:space="preserve">a\x26b \x22c\x22 \x3cd\x3e</text><line class="ln" x1="402" y1="265" x2="416" y2="265" marker-end="url(#ar)"/><rect class="bp" x="28" y="298" width="170" height="38" rx="6" stroke-width="1.2"/><text class="sm" x="40" y="322" font-weight="700">URL parameter</text><text class="sub" x="214" y="322">URLEncoder.encode(UTF_8)</text><rect class="box" x="420" y="298" width="352" height="38" rx="6" stroke-width="1"/><text class="mono" x="432" y="322" xml:space="preserve">a%26b+%22c%22+%3Cd%3E</text><line class="ln" x1="402" y1="317" x2="416" y2="317" marker-end="url(#ar)"/><rect class="bt" x="28" y="350" width="170" height="38" rx="6" stroke-width="1.2"/><text class="sm" x="40" y="374" font-weight="700">SQL</text><text class="sub" x="214" y="374">bind, don't encode</text><rect class="box" x="420" y="350" width="352" height="38" rx="6" stroke-width="1"/><text class="mono" x="432" y="374" xml:space="preserve">WHERE note = ?   (value sent separately)</text><line class="ln" x1="402" y1="369" x2="416" y2="369" marker-end="url(#ar)"/><line class="ln" x1="402" y1="124" x2="402" y2="369"/><text class="sm" x="28" y="438">Escaping once on input picks one row and gets the other four wrong.</text>
</svg>
