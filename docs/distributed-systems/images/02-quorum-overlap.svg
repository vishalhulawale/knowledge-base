<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Quorum overlap with W + R &gt; N</title>
<desc id="d">Two panels with three replicas each. Left: W=2 and R=2. The write of v2 reaches replicas A and B, the read asks B and C. They overlap on B, so the read sees v2 and repairs C. Right: W=1 and R=1. The write reaches only A and the read asks only C, so there is no overlap and the read returns the stale value v1.</desc>
<style>
.card{fill:#f8fafc;stroke:#e2e8f0}.cv{fill:#f8fafc}
.h{fill:#0f172a;font-size:20px;font-weight:700}
.lbl{fill:#334155;font-size:15px;font-weight:600}
.txt{fill:#334155;font-size:14px}.sm{fill:#334155;font-size:13px}
.sub{fill:#64748b;font-size:13px}.b{font-weight:700}
.slot{fill:#ffffff;stroke:#cbd5e1}
.fp{fill:#4f46e5}.ft{fill:#0ea5a4}.fg{fill:#16a34a}.fr{fill:#dc2626}.fa{fill:#d97706}.fmu{fill:#64748b}
.zp{fill:#4f46e5;fill-opacity:.1}.zg{fill:#16a34a;fill-opacity:.12}.zr{fill:#dc2626;fill-opacity:.1}.za{fill:#d97706;fill-opacity:.14}
.on{fill:#ffffff}
.sp{stroke:#4f46e5}.st{stroke:#0ea5a4}.sg{stroke:#16a34a}.sr{stroke:#dc2626}.sa{stroke:#d97706}.smu{stroke:#64748b}.sax{stroke:#cbd5e1}
.tp{fill:#4f46e5}.tt{fill:#0f766e}.tg{fill:#15803d}.tr{fill:#dc2626}.ta{fill:#b45309}.tm{fill:#64748b}
.nf{fill:none}
@media (prefers-color-scheme: dark){
.card{fill:#1f2430;stroke:#334155}.cv{fill:#1f2430}
.h{fill:#f1f5f9}.lbl,.txt,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}
.slot{fill:#111827;stroke:#475569}
.fp{fill:#818cf8}.ft{fill:#2dd4bf}.fg{fill:#4ade80}.fr{fill:#f87171}.fa{fill:#fbbf24}.fmu{fill:#94a3b8}
.zp{fill:#818cf8;fill-opacity:.16}.zg{fill:#4ade80;fill-opacity:.14}.zr{fill:#f87171;fill-opacity:.14}.za{fill:#fbbf24;fill-opacity:.14}
.on{fill:#0f172a}
.sp{stroke:#818cf8}.st{stroke:#2dd4bf}.sg{stroke:#4ade80}.sr{stroke:#f87171}.sa{stroke:#fbbf24}.smu{stroke:#94a3b8}.sax{stroke:#475569}
.tp{fill:#818cf8}.tt{fill:#5eead4}.tg{fill:#4ade80}.tr{fill:#f87171}.ta{fill:#fbbf24}.tm{fill:#94a3b8}
}
.zt{fill:#0ea5a4;fill-opacity:.14}@media (prefers-color-scheme: dark){.zt{fill:#2dd4bf;fill-opacity:.16}}
.a,.d,.w{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:linear}
.a{opacity:0}.w{opacity:0}
@keyframes kv1{0%,0%{opacity:1}1%,94%{opacity:0}97%,100%{opacity:1}}.v1{animation-name:kv1}
@keyframes kv2{0%,0%{opacity:1}2%,94%{opacity:0}97%,100%{opacity:1}}.v2{animation-name:kv2}
@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.d{animation:none;opacity:0}.w{animation:none;opacity:0}}
</style>
<defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fmu" d="M0,0L10,5L0,10z"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fp" d="M0,0L10,5L0,10z"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fg" d="M0,0L10,5L0,10z"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fr" d="M0,0L10,5L0,10z"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fa" d="M0,0L10,5L0,10z"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ft" d="M0,0L10,5L0,10z"/></marker>
</defs>
<rect class="card" x="1" y="1" width="798" height="338" rx="14"/>

<text class="h" x="28" y="40">Why W + R &gt; N makes reads see the latest write</text>
<text class="sub" x="28" y="62">N = 3 replicas. The latest write is v2; replicas that missed it still hold v1.</text>
<rect class="slot" x="28" y="80" width="362" height="222" rx="12" fill-opacity="0"/>
<rect class="slot" x="410" y="80" width="362" height="222" rx="12" fill-opacity="0"/>
<text class="lbl tg" x="48" y="106">W = 2, R = 2  (2 + 2 &gt; 3)</text>
<text class="lbl tr" x="430" y="106">W = 1, R = 1  (1 + 1 ≤ 3)</text>
<!-- left -->
<rect class="zp" x="48" y="118" width="190" height="26" rx="6"/><text class="sm tp b" x="143" y="136" text-anchor="middle">write v2 (W = 2)</text>
<rect class="fp" x="48" y="154" width="80" height="50" rx="8"/><text class="sm on" x="88" y="174" text-anchor="middle">Replica A</text><text class="txt on b" x="88" y="194" text-anchor="middle">v2</text><rect class="fp" x="158" y="154" width="80" height="50" rx="8"/><text class="sm on" x="198" y="174" text-anchor="middle">Replica B</text><text class="txt on b" x="198" y="194" text-anchor="middle">v2</text><rect class="slot" x="268" y="154" width="80" height="50" rx="8"/><text class="sm" x="308" y="174" text-anchor="middle">Replica C</text><text class="txt b" x="308" y="194" text-anchor="middle">v1</text>
<rect class="nf sg" x="153" y="149" width="90" height="60" rx="10" stroke-width="3"/>
<rect class="zt" x="158" y="216" width="190" height="26" rx="6"/><text class="sm tt b" x="253" y="234" text-anchor="middle">read (R = 2)</text>
<text class="sm" x="48" y="268">Any 2 replicas read overlap the 2 written, so</text>
<text class="sm" x="48" y="286">the read sees v2 and repairs C to v2.</text>
<!-- right -->
<rect class="zp" x="430" y="118" width="80" height="26" rx="6"/><text class="sm tp b" x="470" y="136" text-anchor="middle">write v2</text>
<rect class="fp" x="430" y="154" width="80" height="50" rx="8"/><text class="sm on" x="470" y="174" text-anchor="middle">Replica A</text><text class="txt on b" x="470" y="194" text-anchor="middle">v2</text><rect class="slot" x="540" y="154" width="80" height="50" rx="8"/><text class="sm" x="580" y="174" text-anchor="middle">Replica B</text><text class="txt b" x="580" y="194" text-anchor="middle">v1</text><rect class="slot" x="650" y="154" width="80" height="50" rx="8"/><text class="sm" x="690" y="174" text-anchor="middle">Replica C</text><text class="txt b" x="690" y="194" text-anchor="middle">v1</text>
<rect class="nf sr" x="645" y="149" width="90" height="60" rx="10" stroke-width="3"/>
<rect class="zt" x="650" y="216" width="80" height="26" rx="6"/><text class="sm tt b" x="690" y="234" text-anchor="middle">read</text>
<text class="sm" x="430" y="268">The write reached only A and the read asked</text>
<text class="sm" x="430" y="286">only C, so the read returns stale v1.</text>
<text class="sub" x="28" y="324">Strict quorums only. Sloppy quorums, partial writes and LWW can still break the overlap.</text>

</svg>
