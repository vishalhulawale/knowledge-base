<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Committed offset, position and log end</title>
  <desc id="d">One partition with offsets 0 to 10. The consumer has processed records 0 to 6, but its last commit was 4, so the committed offset is 4: the next record the group will read after a restart. Its position, the next offset it will fetch, is 7. The log end offset is 11. Records 4 to 6 were processed but not committed, so they are replayed after a crash. Records 7 to 10 haven&#x27;t been fetched yet. Lag, as kafka-consumer-groups reports it, is log end minus committed: 11 minus 4 is 7.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="382" rx="14"/>
  <text class="h" x="28" y="40">Three offsets every consumer has</text>
  <text class="sub" x="28" y="62">One partition. The consumer processed 0–6 but last committed 4.</text>
  <rect class="okf" x="60" y="120" width="50" height="40" rx="6"/>
  <text class="on" x="85" y="144.5" text-anchor="middle">0</text>
  <rect class="okf" x="116" y="120" width="50" height="40" rx="6"/>
  <text class="on" x="141" y="144.5" text-anchor="middle">1</text>
  <rect class="okf" x="172" y="120" width="50" height="40" rx="6"/>
  <text class="on" x="197" y="144.5" text-anchor="middle">2</text>
  <rect class="okf" x="228" y="120" width="50" height="40" rx="6"/>
  <text class="on" x="253" y="144.5" text-anchor="middle">3</text>
  <rect class="wrnf" x="284" y="120" width="50" height="40" rx="6"/>
  <text class="on" x="309" y="144.5" text-anchor="middle">4</text>
  <rect class="wrnf" x="340" y="120" width="50" height="40" rx="6"/>
  <text class="on" x="365" y="144.5" text-anchor="middle">5</text>
  <rect class="wrnf" x="396" y="120" width="50" height="40" rx="6"/>
  <text class="on" x="421" y="144.5" text-anchor="middle">6</text>
  <rect class="pri" x="452" y="120" width="50" height="40" rx="6"/>
  <text class="on" x="477" y="144.5" text-anchor="middle">7</text>
  <rect class="pri" x="508" y="120" width="50" height="40" rx="6"/>
  <text class="on" x="533" y="144.5" text-anchor="middle">8</text>
  <rect class="pri" x="564" y="120" width="50" height="40" rx="6"/>
  <text class="on" x="589" y="144.5" text-anchor="middle">9</text>
  <rect class="pri" x="620" y="120" width="50" height="40" rx="6"/>
  <text class="on" x="645" y="144.5" text-anchor="middle">10</text>
  <rect class="box" x="676" y="120" width="50" height="40" rx="6"/>
  <text class="sub" x="701" y="145" text-anchor="middle">…</text>
  <line class="lno" x1="281" y1="204" x2="281" y2="166" marker-end="url(#aro)"/>
  <text class="tx" x="281" y="224" text-anchor="middle" font-weight="700">committed = 4</text>
  <text class="sm" x="281" y="240" text-anchor="middle">restart reads here</text>
  <line class="lnw" x1="449" y1="204" x2="449" y2="166" marker-end="url(#arw)"/>
  <text class="tx" x="449" y="224" text-anchor="middle" font-weight="700">position = 7</text>
  <text class="sm" x="449" y="240" text-anchor="middle">next fetch</text>
  <line class="lnp" x1="673" y1="204" x2="673" y2="166" marker-end="url(#arp)"/>
  <text class="tx" x="673" y="224" text-anchor="middle" font-weight="700">log end = 11</text>
  <text class="sm" x="673" y="240" text-anchor="middle">next write</text>
  <text class="sm okt" x="60" y="100">processed + committed</text>
  <text class="sm wrnt" x="284" y="100">uncommitted</text>
  <text class="sm prit" x="452" y="100">not fetched</text>
  <line class="lnb" x1="281" y1="262" x2="673" y2="262" marker-end="url(#arb)" marker-start="url(#arb)"/>
  <text class="tx badt" x="480" y="282" text-anchor="middle">lag = 11 − 4 = 7</text>
  <text class="tx" x="28" y="316">After a crash, the group restarts at the committed offset, so 4, 5 and 6 are processed again.</text>
  <text class="tx" x="28" y="336">That is at-least-once delivery, and why consumers must be idempotent.</text>
  <text class="sub" x="28" y="362">The client metric records-lag-max measures from the position (7) instead, so it reads lower: 4.</text>
</svg>
