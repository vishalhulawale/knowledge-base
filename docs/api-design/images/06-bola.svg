<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">BOLA: change the id, get someone else&#x27;s data</title>
  <desc id="d">Member M42 is logged in with a valid token. Their own request, GET claims c-1001, returns their claim. They then edit the id in the URL to c-1002, which belongs to member M77. Left, the endpoint only checks that the token is valid and loads the claim by id, so M77&#x27;s claim, including diagnosis details, is returned with 200. Right, the query also filters by the caller&#x27;s member id, so no row matches and the API returns 404, without revealing that c-1002 exists.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:14s infinite linear}
    @keyframes p0{0%,30%{opacity:1}31%{opacity:0}100%{opacity:0}}
    .p0{animation-name:p0}
    @keyframes p1{0%{opacity:0}30%{opacity:0}31%,99%{opacity:1}100%{opacity:0}100%{opacity:0}}
    .p1{animation-name:p1}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .p0{opacity:0!important}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">GET /claims/c-1002 with M42&#x27;s valid token</text>
  <text class="sub" x="28" y="62">Broken Object Level Authorization: OWASP API Security Top 10, API1.</text>
  <line class="ln dash" x1="400" y1="84" x2="400" y2="330"/>
  <text class="h2 badt" x="28" y="104">Token checked, ownership not</text>
  <text class="h2 okt" x="420" y="104">Ownership checked on every access</text>
  <g class="a p0">
  <rect class="pri" x="28" y="120" width="340" height="28" rx="6"/>
  <text class="on13" x="198" y="138.5" text-anchor="middle">GET /claims/c-1001  (M42&#x27;s own)</text>
  </g>
  <g class="a p1">
  <rect class="wrnf" x="28" y="120" width="340" height="28" rx="6"/>
  <text class="on13" x="198" y="138.5" text-anchor="middle">GET /claims/c-1002  (id edited)</text>
  </g>
  <text class="sm prit" style="font-family:'JetBrains Mono',ui-monospace,monospace" x="28" y="176">WHERE id = :id</text>
  <g class="a p0">
  <rect class="pri" x="420" y="120" width="340" height="28" rx="6"/>
  <text class="on13" x="590" y="138.5" text-anchor="middle">GET /claims/c-1001  (M42&#x27;s own)</text>
  </g>
  <g class="a p1">
  <rect class="wrnf" x="420" y="120" width="340" height="28" rx="6"/>
  <text class="on13" x="590" y="138.5" text-anchor="middle">GET /claims/c-1002  (id edited)</text>
  </g>
  <text class="sm prit" style="font-family:'JetBrains Mono',ui-monospace,monospace" x="420" y="176">WHERE id = :id AND member_id = :caller</text>
  <g class="a p0">
  <rect class="bo" x="28" y="196" width="340" height="60" rx="10" stroke-width="1.5"/>
  <text class="tx" x="198" y="223" text-anchor="middle" font-weight="700">200 OK: claim c-1001</text>
  <text class="sm" x="198" y="240" text-anchor="middle">member M42 · their own data</text>
  </g>
  <g class="a p0">
  <rect class="bo" x="420" y="196" width="340" height="60" rx="10" stroke-width="1.5"/>
  <text class="tx" x="590" y="223" text-anchor="middle" font-weight="700">200 OK: claim c-1001</text>
  <text class="sm" x="590" y="240" text-anchor="middle">member M42 · their own data</text>
  </g>
  <g class="a p1">
  <rect class="bb" x="28" y="196" width="340" height="60" rx="10" stroke-width="1.5"/>
  <text class="tx" x="198" y="223" text-anchor="middle" font-weight="700">200 OK: claim c-1002</text>
  <text class="sm" x="198" y="240" text-anchor="middle">member M77 · diagnosis, pharmacy, amount</text>
  </g>
  <g class="a p1">
  <rect class="bo" x="420" y="196" width="340" height="60" rx="10" stroke-width="1.5"/>
  <text class="tx" x="590" y="223" text-anchor="middle" font-weight="700">404 Not Found</text>
  <text class="sm" x="590" y="240" text-anchor="middle">no row for this caller; existence not revealed</text>
  </g>
  <text class="tx badt a p1" x="28" y="290">Data breach with a perfectly valid token</text>
  <text class="tx okt a p1" x="420" y="290">Same response as a claim that doesn&#x27;t exist</text>
  <text class="sub" x="28" y="356">UUIDs make ids harder to guess but are not authorisation; ids leak through links, logs and shared screens.</text>
  <text class="sub" x="28" y="376">Test it: for every endpoint with an id, call it with another tenant&#x27;s id and expect 404 or 403.</text>
</svg>
