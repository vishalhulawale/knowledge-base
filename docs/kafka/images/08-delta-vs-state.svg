<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Replay of a delta event vs a state event</title>
  <desc id="d">The same event is delivered twice, as happens after a crash before commit. A delta event, add 20 to the balance, applied twice takes the balance from 100 to 140 instead of 120. A state event, set the balance to 120, applied twice still leaves 120. State-based events are naturally idempotent; delta events need a dedupe store or version check.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <defs><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="298" rx="14"/>
  <text class="h" x="28" y="40">The same event delivered twice</text>
  <text class="sub" x="28" y="62">Balance starts at 100. The event is redelivered after a crash.</text>
  <text class="h2" x="28" y="104">Delta event</text>
  <rect class="box" x="28" y="124" width="92" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="74" y="151" text-anchor="middle" font-weight="700">100</text>
  <line class="lnp" x1="122" y1="146" x2="154" y2="146" marker-end="url(#arp)"/>
  <text class="sm prit" x="138" y="194" text-anchor="middle">+20</text>
  <text class="sm" x="138" y="210" text-anchor="middle">1st</text>
  <rect class="box" x="158" y="124" width="92" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="204" y="151" text-anchor="middle" font-weight="700">120</text>
  <line class="lnp" x1="252" y1="146" x2="284" y2="146" marker-end="url(#arp)"/>
  <text class="sm prit" x="268" y="194" text-anchor="middle">+20</text>
  <text class="sm" x="268" y="210" text-anchor="middle">2nd (dup)</text>
  <rect class="bb" x="288" y="124" width="92" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="334" y="151" text-anchor="middle" font-weight="700">140</text>
  <text class="tx badt" x="28" y="248">Expected 120, got 140</text>
  <text class="h2" x="420" y="104">State event</text>
  <rect class="box" x="420" y="124" width="92" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="466" y="151" text-anchor="middle" font-weight="700">100</text>
  <line class="lnp" x1="514" y1="146" x2="546" y2="146" marker-end="url(#arp)"/>
  <text class="sm prit" x="530" y="194" text-anchor="middle">balance = 120</text>
  <text class="sm" x="530" y="210" text-anchor="middle">1st</text>
  <rect class="box" x="550" y="124" width="92" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="596" y="151" text-anchor="middle" font-weight="700">120</text>
  <line class="lnp" x1="644" y1="146" x2="676" y2="146" marker-end="url(#arp)"/>
  <text class="sm prit" x="660" y="194" text-anchor="middle">balance = 120</text>
  <text class="sm" x="660" y="210" text-anchor="middle">2nd (dup)</text>
  <rect class="bo" x="680" y="124" width="92" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="726" y="151" text-anchor="middle" font-weight="700">120</text>
  <text class="tx okt" x="420" y="248">Still 120: idempotent</text>
  <text class="sub" x="28" y="284">Prefer state transfer when consumers need current state; deltas need dedupe or versions.</text>
</svg>
