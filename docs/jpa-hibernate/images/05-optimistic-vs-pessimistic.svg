<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 462" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Optimistic versus pessimistic locking timelines</title>
  <desc id="d">Two transactions each debit 10 from a balance of 100. Top, optimistic locking: both read balance 100 at version 7. T1 updates where version is 7, succeeds and commits 90 at version 8. T2's update where version is 7 then matches 0 rows and throws an optimistic lock exception; it retries, reads 90 at version 8 and writes 80 at version 9. Bottom, pessimistic locking: T1 locks the row with FOR NO KEY UPDATE, reads 100, writes 90 and commits, releasing the lock. T2 is blocked waiting for the lock the whole time, then reads 90 and writes 80. Both end at 80 with no lost update.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .row{fill:#0f172a;font-size:16px;font-weight:700}
    .sub{fill:#64748b;font-size:13px}
    .panel{fill:#ffffff;stroke:#e2e8f0}
    .lane{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:4 6}
    .pri{fill:#4f46e5}.ok{fill:#16a34a}.bad{fill:#dc2626}
    .pt{fill:#fff;font-size:13px;font-weight:600}
    .wait{fill:#d97706;fill-opacity:.18;stroke:#d97706;stroke-width:2;stroke-dasharray:6 4}
    .wt{fill:#b45309;font-size:13px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.row{fill:#f1f5f9}.lbl{fill:#e2e8f0}.sub{fill:#94a3b8}
      .panel{fill:#111827;stroke:#334155}.lane{stroke:#475569}
      .pri{fill:#818cf8}.ok{fill:#4ade80}.bad{fill:#f87171}.pt{fill:#0f172a}
      .wait{fill:#fbbf24;stroke:#fbbf24}.wt{fill:#fbbf24}
    }
    /* 10 s loop: one time slot every 1.6 s (6%, 22%, 38%, 54%, 70%); end state held to 94% */
    .a{opacity:0;animation:10s infinite linear}
        @keyframes s0{0%,6%{opacity:0}8%,94%{opacity:1}97%,100%{opacity:0}}.s0{animation-name:s0}
    @keyframes s1{0%,22%{opacity:0}24%,94%{opacity:1}97%,100%{opacity:0}}.s1{animation-name:s1}
    @keyframes s2{0%,38%{opacity:0}40%,94%{opacity:1}97%,100%{opacity:0}}.s2{animation-name:s2}
    @keyframes s3{0%,54%{opacity:0}56%,94%{opacity:1}97%,100%{opacity:0}}.s3{animation-name:s3}
    @keyframes s4{0%,70%{opacity:0}72%,94%{opacity:1}97%,100%{opacity:0}}.s4{animation-name:s4}
    .wbar{opacity:0;animation:wbar 10s infinite linear}
    @keyframes wbar{0%,6%{opacity:0}8%,94%{opacity:1}97%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.a,.wbar{animation:none;opacity:1}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="460" rx="14"/>
  <text class="h" x="28" y="40">Two debits of 10 from a balance of 100</text>
  <text class="sub" x="28" y="62">Time runs left to right. Both approaches end at 80; they differ in who waits and who fails.</text>
  <rect class="panel" x="28" y="80" width="744" height="170" rx="12"/>
  <text class="lbl" x="44" y="106">Optimistic: @Version, no locks held</text>
  <text class="sub" x="44" y="126">UPDATE … WHERE id = 1 AND version = 7</text>
  <text class="row" x="44" y="166">T1</text>
  <text class="row" x="44" y="220">T2</text>
  <line class="lane" x1="150" y1="161" x2="760" y2="161"/>
  <line class="lane" x1="150" y1="215" x2="760" y2="215"/>
  
  <g class="a s0"><rect class="pri" x="160" y="140" width="112" height="42" rx="8"/><text class="pt" x="216.0" y="158" text-anchor="middle">read</text><text class="pt" x="216.0" y="175" text-anchor="middle">100, v7</text></g>
  <g class="a s1"><rect class="pri" x="280" y="140" width="112" height="42" rx="8"/><text class="pt" x="336.0" y="158" text-anchor="middle">UPDATE</text><text class="pt" x="336.0" y="175" text-anchor="middle">version = 7 ✓</text></g>
  <g class="a s2"><rect class="ok" x="400" y="140" width="112" height="42" rx="8"/><text class="pt" x="456.0" y="158" text-anchor="middle">COMMIT</text><text class="pt" x="456.0" y="175" text-anchor="middle">90, v8</text></g>
  <g class="a s0"><rect class="pri" x="160" y="194" width="112" height="42" rx="8"/><text class="pt" x="216.0" y="212" text-anchor="middle">read</text><text class="pt" x="216.0" y="229" text-anchor="middle">100, v7</text></g>
  <g class="a s3"><rect class="bad" x="520" y="194" width="112" height="42" rx="8"/><text class="pt" x="576.0" y="212" text-anchor="middle">0 rows</text><text class="pt" x="576.0" y="229" text-anchor="middle">exception ✗</text></g>
  <g class="a s4"><rect class="ok" x="640" y="194" width="112" height="42" rx="8"/><text class="pt" x="696.0" y="212" text-anchor="middle">retry: 90, v8</text><text class="pt" x="696.0" y="229" text-anchor="middle">write 80, v9 ✓</text></g>
  <rect class="panel" x="28" y="270" width="744" height="170" rx="12"/>
  <text class="lbl" x="44" y="296">Pessimistic: PESSIMISTIC_WRITE (FOR NO KEY UPDATE)</text>
  <text class="sub" x="44" y="316">The second transaction waits instead of failing</text>
  <text class="row" x="44" y="356">T1</text>
  <text class="row" x="44" y="410">T2</text>
  <line class="lane" x1="150" y1="351" x2="760" y2="351"/>
  <line class="lane" x1="150" y1="405" x2="760" y2="405"/>
  <g class="wbar"><rect class="wait" x="160" y="384" width="352" height="42" rx="8"/><text class="wt" x="336" y="410" text-anchor="middle">blocked: waiting for T1's row lock</text></g>
  <g class="a s0"><rect class="pri" x="160" y="330" width="112" height="42" rx="8"/><text class="pt" x="216.0" y="348" text-anchor="middle">lock + read</text><text class="pt" x="216.0" y="365" text-anchor="middle">100</text></g>
  <g class="a s1"><rect class="pri" x="280" y="330" width="112" height="42" rx="8"/><text class="pt" x="336.0" y="348" text-anchor="middle">write</text><text class="pt" x="336.0" y="365" text-anchor="middle">90</text></g>
  <g class="a s2"><rect class="ok" x="400" y="330" width="112" height="42" rx="8"/><text class="pt" x="456.0" y="348" text-anchor="middle">COMMIT</text><text class="pt" x="456.0" y="365" text-anchor="middle">lock released</text></g>
  <g class="a s3"><rect class="pri" x="520" y="384" width="112" height="42" rx="8"/><text class="pt" x="576.0" y="402" text-anchor="middle">lock granted</text><text class="pt" x="576.0" y="419" text-anchor="middle">read 90</text></g>
  <g class="a s4"><rect class="ok" x="640" y="384" width="112" height="42" rx="8"/><text class="pt" x="696.0" y="402" text-anchor="middle">write 80</text><text class="pt" x="696.0" y="419" text-anchor="middle">COMMIT ✓</text></g>
</svg>
