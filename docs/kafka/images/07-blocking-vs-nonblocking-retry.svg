  </style>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">Record 100 fails with a timeout</text>
  <text class="sub" x="28" y="62">Same partition, same failure. Blocking retries in place vs a retry topic.</text>
  <line class="ln dash" x1="400" y1="84" x2="400" y2="330"/>
  <text class="h2" x="28" y="100">Blocking (DefaultErrorHandler)</text>
  <text class="sm" x="28" y="120">orders, partition 3</text>
  <rect class="box" x="28" y="130" width="52" height="34" rx="6"/>
  <text class="tx" x="54" y="152" text-anchor="middle">100</text>
  <rect class="box" x="86" y="130" width="52" height="34" rx="6"/>
  <text class="tx" x="112" y="152" text-anchor="middle">101</text>
  <rect class="box" x="144" y="130" width="52" height="34" rx="6"/>
  <text class="tx" x="170" y="152" text-anchor="middle">102</text>
  <rect class="box" x="202" y="130" width="52" height="34" rx="6"/>
  <text class="tx" x="228" y="152" text-anchor="middle">103</text>
  <rect class="box" x="260" y="130" width="52" height="34" rx="6"/>
  <text class="tx" x="286" y="152" text-anchor="middle">104</text>
  <rect class="box" x="318" y="130" width="52" height="34" rx="6"/>
  <text class="tx" x="344" y="152" text-anchor="middle">105</text>
  <g class="a lf">
  <rect class="badf" x="28" y="130" width="52" height="34" rx="6"/>
  <text class="on13" x="54" y="151.5" text-anchor="middle">100</text>
  </g>
  <text class="sm badt a lr1" x="28" y="190">retry 1 after 1 s: timeout</text>
  <text class="sm badt a lr2" x="28" y="190">retry 2 after 2 s: timeout</text>
  <text class="sm wrnt a lr3" x="28" y="190">retry 3 after 4 s: …</text>
  <text class="sm a lf" x="86" y="210">101–105 wait; partition stalled</text>
  <g class="a l0">
  <rect class="okf" x="28" y="130" width="52" height="34" rx="6"/>
  <text class="on13" x="54" y="151.5" text-anchor="middle">100</text>
  </g>
  <g class="a l1">
  <rect class="okf" x="86" y="130" width="52" height="34" rx="6"/>
  <text class="on13" x="112" y="151.5" text-anchor="middle">101</text>
  </g>
  <g class="a l2">
  <rect class="okf" x="144" y="130" width="52" height="34" rx="6"/>
  <text class="on13" x="170" y="151.5" text-anchor="middle">102</text>
  </g>
  <g class="a l3">
  <rect class="okf" x="202" y="130" width="52" height="34" rx="6"/>
  <text class="on13" x="228" y="151.5" text-anchor="middle">103</text>
  </g>
  <g class="a l4">
  <rect class="okf" x="260" y="130" width="52" height="34" rx="6"/>
  <text class="on13" x="286" y="151.5" text-anchor="middle">104</text>
  </g>
  <g class="a l5">
  <rect class="okf" x="318" y="130" width="52" height="34" rx="6"/>
  <text class="on13" x="344" y="151.5" text-anchor="middle">105</text>
  </g>
  <text class="sm okt a l0" x="28" y="190">succeeded on retry 3</text>
  <text class="sm" x="28" y="256">processed in order:</text>
  <text class="tx okt a lo0" x="28" y="280">100</text>
  <text class="tx okt a lo1" x="68" y="280">101</text>
  <text class="tx okt a lo2" x="108" y="280">102</text>
  <text class="tx okt a lo3" x="148" y="280">103</text>
  <text class="tx okt a lo4" x="188" y="280">104</text>
  <text class="tx okt a lo5" x="228" y="280">105</text>
  <text class="h2" x="420" y="100">Non-blocking (@RetryableTopic)</text>
  <text class="sm" x="420" y="120">orders, partition 3</text>
  <rect class="box" x="420" y="130" width="52" height="34" rx="6"/>
  <text class="tx" x="446" y="152" text-anchor="middle">100</text>
  <rect class="box" x="478" y="130" width="52" height="34" rx="6"/>
  <text class="tx" x="504" y="152" text-anchor="middle">101</text>
  <rect class="box" x="536" y="130" width="52" height="34" rx="6"/>
  <text class="tx" x="562" y="152" text-anchor="middle">102</text>
  <rect class="box" x="594" y="130" width="52" height="34" rx="6"/>
  <text class="tx" x="620" y="152" text-anchor="middle">103</text>
  <rect class="box" x="652" y="130" width="52" height="34" rx="6"/>
  <text class="tx" x="678" y="152" text-anchor="middle">104</text>
  <rect class="box" x="710" y="130" width="52" height="34" rx="6"/>
  <text class="tx" x="736" y="152" text-anchor="middle">105</text>
  <g class="a rf">
  <rect class="badf" x="420" y="130" width="52" height="34" rx="6"/>
  <text class="on13" x="446" y="151.5" text-anchor="middle">100</text>
  </g>
  <rect class="bm a rm" x="420" y="130" width="52" height="34" rx="6"/>
  <text class="sm a rm" x="446" y="152" text-anchor="middle">moved</text>
  <g class="a r1">
  <rect class="okf" x="478" y="130" width="52" height="34" rx="6"/>
  <text class="on13" x="504" y="151.5" text-anchor="middle">101</text>
  </g>
  <g class="a r2">
  <rect class="okf" x="536" y="130" width="52" height="34" rx="6"/>
  <text class="on13" x="562" y="151.5" text-anchor="middle">102</text>
  </g>
  <g class="a r3">
  <rect class="okf" x="594" y="130" width="52" height="34" rx="6"/>
  <text class="on13" x="620" y="151.5" text-anchor="middle">103</text>
  </g>
  <g class="a r4">
  <rect class="okf" x="652" y="130" width="52" height="34" rx="6"/>
  <text class="on13" x="678" y="151.5" text-anchor="middle">104</text>
  </g>
  <g class="a r5">
  <rect class="okf" x="710" y="130" width="52" height="34" rx="6"/>
  <text class="on13" x="736" y="151.5" text-anchor="middle">105</text>
  </g>
  <text class="sm" x="420" y="196">orders-retry-1000</text>
  <rect class="box" x="420" y="204" width="52" height="34" rx="6"/>
  <g class="a rq">
  <rect class="wrnf" x="420" y="204" width="52" height="34" rx="6"/>
  <text class="on13" x="446" y="225.5" text-anchor="middle">100</text>
  </g>
  <g class="a rq2">
  <rect class="okf" x="420" y="204" width="52" height="34" rx="6"/>
  <text class="on13" x="446" y="225.5" text-anchor="middle">100</text>
  </g>
  <text class="sm a rq" x="482" y="226">waits ≥ 1 s, then retried</text>
  <text class="sm wrnt a rq2" x="482" y="226">succeeded, but last</text>
  <text class="sm" x="420" y="256">processing order:</text>
  <text class="tx okt a ro0" x="420" y="280">101</text>
  <text class="tx okt a ro1" x="460" y="280">102</text>
  <text class="tx okt a ro2" x="500" y="280">103</text>
  <text class="tx okt a ro3" x="540" y="280">104</text>
  <text class="tx okt a ro4" x="580" y="280">105</text>
  <text class="tx wrnt a ro5" x="620" y="280">100</text>
  <text class="tx badt" x="28" y="312">Ordering kept, throughput 0 while retrying</text>
  <text class="tx wrnt" x="420" y="312">No stall, but 100 now lands after 105</text>
  <text class="sub" x="28" y="360">Long blocking back-offs also risk max.poll.interval.ms (5 min) and a rebalance.</text>
  <text class="sub" x="28" y="380">Common hybrid: a few fast blocking retries for blips, then retry topics, then the DLT.</text>
</svg>
