  </style>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">[] == ![]  →  true</text>
  <text class="sub" x="28" y="62">Each step applies one rule of the == algorithm (IsLooselyEqual).</text>
  <text class="h2 a s0" style="font-family:'JetBrains Mono',ui-monospace,monospace;white-space:pre" x="28" y="122">[] == ![]</text>
  <text class="sm a s0" x="220" y="122">start</text>
  <text class="h2 a s1" style="font-family:'JetBrains Mono',ui-monospace,monospace;white-space:pre" x="28" y="166">[] == false</text>
  <text class="sm a s1" x="220" y="166">![] → false: every object is truthy</text>
  <text class="h2 a s2" style="font-family:'JetBrains Mono',ui-monospace,monospace;white-space:pre" x="28" y="210">[] == 0</text>
  <text class="sm a s2" x="220" y="210">boolean operand → ToNumber(false) = 0</text>
  <text class="h2 a s3" style="font-family:'JetBrains Mono',ui-monospace,monospace;white-space:pre" x="28" y="254">&quot;&quot; == 0</text>
  <text class="sm a s3" x="220" y="254">object vs number → ToPrimitive([]) = &quot;&quot; (valueOf → itself, toString → &quot;&quot;)</text>
  <text class="h2 a s4" style="font-family:'JetBrains Mono',ui-monospace,monospace;white-space:pre" x="28" y="298">0 == 0</text>
  <text class="sm a s4" x="220" y="298">string vs number → ToNumber(&quot;&quot;) = 0</text>
  <text class="h2 okt a s5" style="font-family:'JetBrains Mono',ui-monospace,monospace;white-space:pre" x="28" y="342">true</text>
  <text class="sm a s5" x="220" y="342">same type, same value</text>
  <text class="tx okt" x="28" y="386">[] === ![] is false: no coercion. Prefer ===, and use == null only to test for null or undefined.</text>
</svg>
