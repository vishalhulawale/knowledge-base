    @keyframes rm0{0%,27.99%{opacity:1}28%,100%{opacity:0}}.rm0{animation-name:rm0}
    @keyframes rm1{0%,27.99%{opacity:0}28%,43.99%{opacity:1}44%,100%{opacity:0}}.rm1{animation-name:rm1}
