    .dot{fill:#b45309;font-size:15px}
    .dotk{fill:#0f766e;font-size:15px;font-weight:700}
    .inc{fill:#fde68a;opacity:.6}
    .res{fill:#f8fafc;stroke:#cbd5e1}
    .lg{fill:#334155;font-size:13px}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .panel{fill:#111827;stroke:#475569}
      .h,.mono{fill:#f1f5f9}.lbl,.lg{fill:#e2e8f0}.sub{fill:#94a3b8}
      .q{fill:#818cf8}.dot{fill:#fbbf24}.dotk{fill:#5eead4}
      .inc{fill:#78350f;opacity:.7}.res{fill:#1f2430;stroke:#475569}
    }
  </style>
