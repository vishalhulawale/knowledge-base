<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Performance improvement loop</title>
  <desc id="d">Animation: four boxes, Measure, Profile, Fix and Verify, light up in turn while a bar chart of p99 latency fills in. The baseline p99 is 820 ms against a goal of 400 ms. Profiling shows 61 percent of time waiting for a database connection; growing the pool from 10 to 24 brings p99 to 510 ms, still above the goal, so the loop runs again. The second pass finds an N+1 query; batching it brings p99 to 310 ms, under the goal, and the loop stops with a regression guard. Numbers are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes s0{0%,11.99%{opacity:1}12%,100%{opacity:0}}.s0{animation-name:s0}
    @keyframes s1{0%,11.99%{opacity:0}12%,24.99%{opacity:1}25%,100%{opacity:0}}.s1{animation-name:s1}
    @keyframes s2{0%,24.99%{opacity:0}25%,36.99%{opacity:1}37%,100%{opacity:0}}.s2{animation-name:s2}
    @keyframes s3{0%,36.99%{opacity:0}37%,49.99%{opacity:1}50%,100%{opacity:0}}.s3{animation-name:s3}
    @keyframes s4{0%,49.99%{opacity:0}50%,61.99%{opacity:1}62%,100%{opacity:0}}.s4{animation-name:s4}
    @keyframes s5{0%,61.99%{opacity:0}62%,74.99%{opacity:1}75%,100%{opacity:0}}.s5{animation-name:s5}
    @keyframes s6{0%,74.99%{opacity:0}75%,100%{opacity:1}}.s6{animation-name:s6}
    @keyframes b1{0%,36.99%{opacity:0}37%,100%{opacity:1}}.b1{animation-name:b1}
    @keyframes b2{0%,74.99%{opacity:0}75%,100%{opacity:1}}.b2{animation-name:b2}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.s6,.b1,.b2{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <rect class="bm" x="28" y="306" width="352" height="80" rx="10"/><text class="h" x="28" y="40">The loop runs until the goal is met</text><text class="sub" x="28" y="62">p99 of POST /claims at 300 req/s. Illustrative numbers from the page's example.</text><rect class="box" x="40" y="92" width="140" height="64" rx="10" stroke-width="1.5"/><text class="lbl" x="110" y="129" text-anchor="middle">Measure</text><rect class="box" x="220" y="92" width="140" height="64" rx="10" stroke-width="1.5"/><text class="lbl" x="290" y="129" text-anchor="middle">Profile</text><rect class="box" x="220" y="222" width="140" height="64" rx="10" stroke-width="1.5"/><text class="lbl" x="290" y="259" text-anchor="middle">Fix</text><rect class="box" x="40" y="222" width="140" height="64" rx="10" stroke-width="1.5"/><text class="lbl" x="110" y="259" text-anchor="middle">Verify</text><line class="ln" x1="181" y1="124" x2="218" y2="124" marker-end="url(#ar)"/><line class="ln" x1="290" y1="157" x2="290" y2="220" marker-end="url(#ar)"/><line class="ln" x1="219" y1="254" x2="182" y2="254" marker-end="url(#ar)"/><line class="ln" x1="110" y1="221" x2="110" y2="158" marker-end="url(#ar)"/><g class="k s0"><rect class="pri" x="40" y="92" width="140" height="64" rx="10"/><text class="on" x="110" y="129" text-anchor="middle">Measure</text><text class="sub" x="48" y="330">Step 1</text><text class="sm" x="48" y="352">Baseline, 3 runs: p50 180 ms, p99 820 ms.</text><text class="sm" x="48" y="372">Goal: p99 under 400 ms.</text></g><g class="k s1"><rect class="tea" x="220" y="92" width="140" height="64" rx="10"/><text class="on" x="290" y="129" text-anchor="middle">Profile</text><text class="sub" x="48" y="330">Step 2</text><text class="sm" x="48" y="352">Trace + wall-clock profile: 61% of time</text><text class="sm" x="48" y="372">waiting in HikariPool.getConnection.</text></g><g class="k s2"><rect class="wrnf" x="220" y="222" width="140" height="64" rx="10"/><text class="on" x="290" y="259" text-anchor="middle">Fix</text><text class="sub" x="48" y="330">Step 3</text><text class="sm" x="48" y="352">One change: maximumPoolSize 10 → 24</text><text class="sm" x="48" y="372">(sized with Little's law).</text></g><g class="k s3"><rect class="okf" x="40" y="222" width="140" height="64" rx="10"/><text class="on" x="110" y="259" text-anchor="middle">Verify</text><text class="sub" x="48" y="330">Step 4</text><text class="sm" x="48" y="352">Same test: p99 510 ms. Better, but still</text><text class="sm" x="48" y="372">above 400 ms, so loop again.</text></g><g class="k s4"><rect class="tea" x="220" y="92" width="140" height="64" rx="10"/><text class="on" x="290" y="129" text-anchor="middle">Profile</text><text class="sub" x="48" y="330">Step 5</text><text class="sm" x="48" y="352">Pass 2: trace shows N+1, 1 + 40 queries</text><text class="sm" x="48" y="372">per claim for the claim lines.</text></g><g class="k s5"><rect class="wrnf" x="220" y="222" width="140" height="64" rx="10"/><text class="on" x="290" y="259" text-anchor="middle">Fix</text><text class="sub" x="48" y="330">Step 6</text><text class="sm" x="48" y="352">One change: fetch the lines in one</text><text class="sm" x="48" y="372">batched query.</text></g><g class="k s6"><rect class="okf" x="40" y="222" width="140" height="64" rx="10"/><text class="on" x="110" y="259" text-anchor="middle">Verify</text><text class="sub" x="48" y="330">Step 7</text><text class="sm" x="48" y="352">Same test: p99 310 ms, under 400 ms.</text><text class="sm" x="48" y="372">Stop and add a regression guard.</text></g><text class="sub" x="420" y="92">p99 (ms)</text><line class="grid" x1="470" y1="340" x2="760" y2="340"/><text class="sub" x="462" y="344" text-anchor="end">0</text><line class="grid" x1="470" y1="286.667" x2="760" y2="286.667"/><text class="sub" x="462" y="290.667" text-anchor="end">200</text><line class="grid" x1="470" y1="233.333" x2="760" y2="233.333"/><text class="sub" x="462" y="237.333" text-anchor="end">400</text><line class="grid" x1="470" y1="180" x2="760" y2="180"/><text class="sub" x="462" y="184" text-anchor="end">600</text><line class="grid" x1="470" y1="126.667" x2="760" y2="126.667"/><text class="sub" x="462" y="130.667" text-anchor="end">800</text><rect class="badf" x="494" y="121.333" width="64" height="218.667" rx="4"/><text class="on13" x="526" y="141.333" text-anchor="middle">820</text><text class="sm" x="526" y="360" text-anchor="middle">baseline</text><g class="k b1"><rect class="wrnf" x="586" y="204" width="64" height="136" rx="4"/><text class="on13" x="618" y="224" text-anchor="middle">510</text></g><text class="sm" x="618" y="360" text-anchor="middle">pass 1</text><g class="k b2"><rect class="okf" x="678" y="257.333" width="64" height="82.6667" rx="4"/><text class="on13" x="710" y="277.333" text-anchor="middle">310</text></g><text class="sm" x="710" y="360" text-anchor="middle">pass 2</text><line class="lnp dash" x1="470" y1="233.333" x2="760" y2="233.333"/><text class="prit" x="760" y="225.333" text-anchor="end" style="font-size:13px">goal 400 ms</text>
</svg>
