  <text class="h" x="28" y="40">Round trips before the first byte</text><text class="sub" x="28" y="62">A cold page load with a 100 ms round trip and 50 ms of server work. Illustrative.</text><line class="grid" x1="200" y1="84" x2="200" y2="352"/><text class="sub" x="200" y="372" text-anchor="middle">0</text><line class="grid" x1="280" y1="84" x2="280" y2="352"/><text class="sub" x="280" y="372" text-anchor="middle">100</text><line class="grid" x1="360" y1="84" x2="360" y2="352"/><text class="sub" x="360" y="372" text-anchor="middle">200</text><line class="grid" x1="440" y1="84" x2="440" y2="352"/><text class="sub" x="440" y="372" text-anchor="middle">300</text><line class="grid" x1="520" y1="84" x2="520" y2="352"/><text class="sub" x="520" y="372" text-anchor="middle">400</text><line class="grid" x1="600" y1="84" x2="600" y2="352"/><text class="sub" x="600" y="372" text-anchor="middle">500</text><line class="grid" x1="680" y1="84" x2="680" y2="352"/><text class="sub" x="680" y="372" text-anchor="middle">600</text><line class="grid" x1="760" y1="84" x2="760" y2="352"/><text class="sub" x="760" y="372" text-anchor="middle">700</text><text class="sub" x="480" y="394" text-anchor="middle">milliseconds since Enter</text><text class="sm" x="28" y="108">Typed http://</text><text class="sm" x="28" y="125">then 301 to https</text><g class="seg g1"><rect class="tea" x="201" y="96" width="78" height="30" rx="4"/></g><g class="k t1"><text class="on13" x="240" y="116" text-anchor="middle">DNS</text></g><g class="seg g2"><rect class="pri" x="281" y="96" width="78" height="30" rx="4"/></g><g class="k t2"><text class="on13" x="320" y="116" text-anchor="middle">TCP</text></g><g class="seg g3"><rect class="badf" x="361" y="96" width="78" height="30" rx="4"/></g><g class="k t3"><text class="on13" x="400" y="116" text-anchor="middle">301</text></g><g class="seg g4"><rect class="pri" x="441" y="96" width="78" height="30" rx="4"/></g><g class="k t4"><text class="on13" x="480" y="116" text-anchor="middle">TCP</text></g><g class="seg g5"><rect class="wrnf" x="521" y="96" width="78" height="30" rx="4"/></g><g class="k t5"><text class="on13" x="560" y="116" text-anchor="middle">TLS</text></g><g class="seg g6"><rect class="okf" x="601" y="96" width="118" height="30" rx="4"/></g><g class="k t6"><text class="on13" x="660" y="116" text-anchor="middle">GET + server</text></g><g class="k f0"><text class="prit" x="720" y="144" text-anchor="end" style="font-size:13px">first byte at 650 ms</text></g><text class="sm" x="28" y="174">Cold HTTPS</text><text class="sm" x="28" y="191">TCP + TLS 1.3</text><g class="seg g7"><rect class="tea" x="201" y="162" width="78" height="30" rx="4"/></g><g class="k t7"><text class="on13" x="240" y="182" text-anchor="middle">DNS</text></g><g class="seg g8"><rect class="pri" x="281" y="162" width="78" height="30" rx="4"/></g><g class="k t8"><text class="on13" x="320" y="182" text-anchor="middle">TCP</text></g><g class="seg g9"><rect class="wrnf" x="361" y="162" width="78" height="30" rx="4"/></g><g class="k t9"><text class="on13" x="400" y="182" text-anchor="middle">TLS</text></g><g class="seg g10"><rect class="okf" x="441" y="162" width="118" height="30" rx="4"/></g><g class="k t10"><text class="on13" x="500" y="182" text-anchor="middle">GET + server</text></g><g class="k f1"><text class="prit" x="560" y="210" text-anchor="end" style="font-size:13px">first byte at 450 ms</text></g><text class="sm" x="28" y="240">Cold HTTP/3</text><text class="sm" x="28" y="257">QUIC, TLS built in</text><g class="seg g11"><rect class="tea" x="201" y="228" width="78" height="30" rx="4"/></g><g class="k t11"><text class="on13" x="240" y="248" text-anchor="middle">DNS</text></g><g class="seg g12"><rect class="wrnf" x="281" y="228" width="78" height="30" rx="4"/></g><g class="k t12"><text class="on13" x="320" y="248" text-anchor="middle">QUIC+TLS</text></g><g class="seg g13"><rect class="okf" x="361" y="228" width="118" height="30" rx="4"/></g><g class="k t13"><text class="on13" x="420" y="248" text-anchor="middle">GET + server</text></g><g class="k f2"><text class="prit" x="480" y="276" text-anchor="end" style="font-size:13px">first byte at 350 ms</text></g><text class="sm" x="28" y="306">Revisit</text><text class="sm" x="28" y="323">DNS cached, conn reused</text><g class="seg g14"><rect class="okf" x="201" y="294" width="118" height="30" rx="4"/></g><g class="k t14"><text class="on13" x="260" y="314" text-anchor="middle">GET + server</text></g><g class="k f3"><text class="prit" x="320" y="342" text-anchor="end" style="font-size:13px">first byte at 150 ms</text></g><g class="ph"><line class="lnb" x1="200" y1="84" x2="200" y2="352" style="stroke-width:2"/></g><rect class="tea" x="28" y="410" width="14" height="14" rx="3"/><text class="sm" x="48" y="422">DNS</text><rect class="pri" x="80.8" y="410" width="14" height="14" rx="3"/><text class="sm" x="100.8" y="422">TCP</text><rect class="wrnf" x="133.6" y="410" width="14" height="14" rx="3"/><text class="sm" x="153.6" y="422">TLS / QUIC</text><rect class="badf" x="239.6" y="410" width="14" height="14" rx="3"/><text class="sm" x="259.6" y="422">redirect</text><rect class="okf" x="330.4" y="410" width="14" height="14" rx="3"/><text class="sm" x="350.4" y="422">request + server</text>
