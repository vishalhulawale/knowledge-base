<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Webhook retry schedule</title>
  <desc id="d">Ten delivery attempts following the Standard Webhooks suggested schedule: immediately, then after 5 seconds, 5 minutes, 30 minutes, 2 hours, 5 hours, 10 hours, 14 hours, 20 hours and 24 hours, so the attempts happen at 0 seconds, 5 seconds, 5 minutes, 35 minutes, 2 hours 35, 7 hours 35, 17 hours 35, 31 hours 35, 51 hours 35 and 75 hours 35 after the first. A true-scale bar over about three days shows the first four attempts bunched in the first 35 minutes and the rest spread across the days. Outcome boxes say a 2xx stops retries, 410 Gone disables the endpoint, 429 with Retry-After waits longer, and after the tenth attempt the delivery is dead-lettered for replay and the owner is notified.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">A webhook retry schedule</text><text class="sub" x="28" y="62">Standard Webhooks' suggested delays (add jitter). Top: one slot per attempt. Bottom: true time scale.</text><line class="ln" x1="60" y1="132" x2="744" y2="132"/><text class="tx" x="60" y="108" text-anchor="middle" style="font-size:13px">now</text><circle class="pri" cx="60" cy="132" r="13"/><text class="on13" x="60" y="137" text-anchor="middle">1</text><text class="sm" x="60" y="168" text-anchor="middle">0 s</text><text class="prit" x="136" y="108" text-anchor="middle" style="font-size:13px">+5 s</text><circle class="pri" cx="136" cy="132" r="13"/><text class="on13" x="136" y="137" text-anchor="middle">2</text><text class="sm" x="136" y="168" text-anchor="middle">5 s</text><text class="prit" x="212" y="108" text-anchor="middle" style="font-size:13px">+5 min</text><circle class="pri" cx="212" cy="132" r="13"/><text class="on13" x="212" y="137" text-anchor="middle">3</text><text class="sm" x="212" y="168" text-anchor="middle">5 min</text><text class="prit" x="288" y="108" text-anchor="middle" style="font-size:13px">+30 min</text><circle class="pri" cx="288" cy="132" r="13"/><text class="on13" x="288" y="137" text-anchor="middle">4</text><text class="sm" x="288" y="168" text-anchor="middle">35 min</text><text class="prit" x="364" y="108" text-anchor="middle" style="font-size:13px">+2 h</text><circle class="pri" cx="364" cy="132" r="13"/><text class="on13" x="364" y="137" text-anchor="middle">5</text><text class="sm" x="364" y="168" text-anchor="middle">2 h 35</text><text class="prit" x="440" y="108" text-anchor="middle" style="font-size:13px">+5 h</text><circle class="pri" cx="440" cy="132" r="13"/><text class="on13" x="440" y="137" text-anchor="middle">6</text><text class="sm" x="440" y="168" text-anchor="middle">7 h 35</text><text class="prit" x="516" y="108" text-anchor="middle" style="font-size:13px">+10 h</text><circle class="pri" cx="516" cy="132" r="13"/><text class="on13" x="516" y="137" text-anchor="middle">7</text><text class="sm" x="516" y="168" text-anchor="middle">17 h 35</text><text class="prit" x="592" y="108" text-anchor="middle" style="font-size:13px">+14 h</text><circle class="pri" cx="592" cy="132" r="13"/><text class="on13" x="592" y="137" text-anchor="middle">8</text><text class="sm" x="592" y="168" text-anchor="middle">31 h 35</text><text class="prit" x="668" y="108" text-anchor="middle" style="font-size:13px">+20 h</text><circle class="pri" cx="668" cy="132" r="13"/><text class="on13" x="668" y="137" text-anchor="middle">9</text><text class="sm" x="668" y="168" text-anchor="middle">51 h 35</text><text class="prit" x="744" y="108" text-anchor="middle" style="font-size:13px">+24 h</text><circle class="badf" cx="744" cy="132" r="13"/><text class="on13" x="744" y="137" text-anchor="middle">10</text><text class="sm" x="744" y="168" text-anchor="middle">75 h 35</text><text class="sub" x="28" y="190" style="font-size:12px">attempt number in circles; elapsed time since the first attempt below</text><text class="lbl" x="28" y="224">True scale: 0 to 75 h 35 min</text><rect class="bm" x="60" y="236" width="684" height="18" rx="4" stroke-width="1"/><line class="grid" x1="277.187" y1="232" x2="277.187" y2="258" style="stroke-width:1.5"/><text class="sub" x="277.187" y="274" text-anchor="middle">day 1</text><line class="grid" x1="494.373" y1="232" x2="494.373" y2="258" style="stroke-width:1.5"/><text class="sub" x="494.373" y="274" text-anchor="middle">day 2</text><line class="grid" x1="711.56" y1="232" x2="711.56" y2="258" style="stroke-width:1.5"/><text class="sub" x="711.56" y="274" text-anchor="middle">day 3</text><rect class="pri" x="58" y="234" width="4" height="22" rx="1"/><rect class="pri" x="58.0126" y="234" width="4" height="22" rx="1"/><rect class="pri" x="58.7667" y="234" width="4" height="22" rx="1"/><rect class="pri" x="63.2914" y="234" width="4" height="22" rx="1"/><rect class="pri" x="81.3903" y="234" width="4" height="22" rx="1"/><rect class="pri" x="126.638" y="234" width="4" height="22" rx="1"/><rect class="pri" x="217.132" y="234" width="4" height="22" rx="1"/><rect class="pri" x="343.824" y="234" width="4" height="22" rx="1"/><rect class="pri" x="524.813" y="234" width="4" height="22" rx="1"/><rect class="badf" x="742" y="234" width="4" height="22" rx="1"/><path class="lnp" d="M64,260 L64,290 L82,290" marker-end="url(#arp)"/><text class="sm" x="88" y="295">attempts 1 to 4 all land in the first 35 minutes: they catch blips</text><rect class="bo" x="28" y="330" width="236" height="76" rx="10" stroke-width="1.2"/><text class="sm" x="44" y="356">2xx within the timeout</text><text class="sm" x="44" y="378">→ delivered, stop</text><rect class="bw" x="282" y="330" width="236" height="76" rx="10" stroke-width="1.2"/><text class="sm" x="298" y="356">410 Gone → disable endpoint</text><text class="sm" x="298" y="378">429 / Retry-After → wait longer</text><rect class="bb" x="536" y="330" width="236" height="76" rx="10" stroke-width="1.2"/><text class="sm" x="552" y="356">after attempt 10: dead letter,</text><text class="sm" x="552" y="378">replay later, notify owner</text>
</svg>
