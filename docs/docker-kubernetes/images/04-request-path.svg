<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">From the internet to a pod</title>
  <desc id="d">Requests travel from a client through the cloud load balancer to an Ingress controller pod, which matches the host and path rule for /orders and sends the request to the orders Service&#x27;s ClusterIP. The ClusterIP is not a process: it is a rule on each node, programmed by kube-proxy or eBPF, that rewrites the destination to one of the ready endpoints in the EndpointSlice. Three requests in a row land on pod A, pod B and pod A. Pod C is not ready, so it is excluded from the EndpointSlice and receives nothing.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:15s infinite linear}
    @keyframes k1{0%{transform:translate(92px,160px);opacity:0}1.5%{opacity:0;transform:translate(92px,160px)}2%{transform:translate(92px,160px);opacity:1}8%{transform:translate(232px,160px);opacity:1}14%{transform:translate(382px,160px);opacity:1}20%{transform:translate(556px,160px);opacity:1}26%{transform:translate(722px,106px);opacity:1}29%{transform:translate(722px,106px);opacity:0}100%{opacity:0;transform:translate(722px,106px)}}.k1{animation:k1 15s infinite linear}
    @keyframes k2{0%{transform:translate(92px,160px);opacity:0}31.5%{opacity:0;transform:translate(92px,160px)}32%{transform:translate(92px,160px);opacity:1}38%{transform:translate(232px,160px);opacity:1}44%{transform:translate(382px,160px);opacity:1}50%{transform:translate(556px,160px);opacity:1}56%{transform:translate(722px,196px);opacity:1}59%{transform:translate(722px,196px);opacity:0}100%{opacity:0;transform:translate(722px,196px)}}.k2{animation:k2 15s infinite linear}
    @keyframes k3{0%{transform:translate(92px,160px);opacity:0}61.5%{opacity:0;transform:translate(92px,160px)}62%{transform:translate(92px,160px);opacity:1}68%{transform:translate(232px,160px);opacity:1}74%{transform:translate(382px,160px);opacity:1}80%{transform:translate(556px,160px);opacity:1}86%{transform:translate(722px,106px);opacity:1}89%{transform:translate(722px,106px);opacity:0}100%{opacity:0;transform:translate(722px,106px)}}.k3{animation:k3 15s infinite linear}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .k1,.k2,.k3{opacity:0}
    }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">GET api.example.com/orders</text>
  <text class="sub" x="28" y="62">Each hop decides one thing. Readiness decides the last hop.</text>
  <rect class="box" x="28" y="170" width="130" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="93" y="200" text-anchor="middle" font-weight="700">Client</text>
  <rect class="bm" x="168" y="170" width="130" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="233" y="192" text-anchor="middle" font-weight="700">Cloud LB</text>
  <text class="sm" x="233" y="209" text-anchor="middle">ALB / NLB</text>
  <rect class="bp" x="318" y="170" width="130" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="383" y="192" text-anchor="middle" font-weight="700">Ingress ctrl</text>
  <text class="sm" x="383" y="209" text-anchor="middle">host + path rules</text>
  <rect class="bt" x="488" y="170" width="140" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="558" y="192" text-anchor="middle" font-weight="700">Service orders</text>
  <text class="sm" x="558" y="209" text-anchor="middle">ClusterIP = node rule</text>
  <line class="ln" x1="158" y1="195" x2="164" y2="195" marker-end="url(#ar)"/>
  <line class="ln" x1="298" y1="195" x2="314" y2="195" marker-end="url(#ar)"/>
  <line class="ln" x1="448" y1="195" x2="484" y2="195" marker-end="url(#ar)"/>
  <rect class="bo" x="672" y="110" width="100" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="722" y="129" text-anchor="middle" font-weight="700">pod A</text>
  <text class="sm" x="722" y="146" text-anchor="middle">ready</text>
  <rect class="bo" x="672" y="200" width="100" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="722" y="219" text-anchor="middle" font-weight="700">pod B</text>
  <text class="sm" x="722" y="236" text-anchor="middle">ready</text>
  <rect class="bm" x="672" y="290" width="100" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="722" y="309" text-anchor="middle" font-weight="700">pod C</text>
  <text class="sm" x="722" y="326" text-anchor="middle">not ready</text>
  <line class="lno" x1="628" y1="190" x2="668" y2="134" marker-end="url(#aro)"/>
  <line class="lno" x1="628" y1="198" x2="668" y2="222" marker-end="url(#aro)"/>
  <line class="ln dash" x1="628" y1="206" x2="668" y2="300"/>
  <text class="lbl badt" x="640" y="286">✕</text>
  <text class="sm teat" x="488" y="240">EndpointSlice: A, B</text>
  <circle class="pri k1" cx="0" cy="0" r="7"/>
  <circle class="pri k2" cx="0" cy="0" r="7"/>
  <circle class="pri k3" cx="0" cy="0" r="7"/>
  <text class="sm" x="28" y="268">1  DNS → cloud LB (L4/L7 edge)</text>
  <text class="sm" x="28" y="288">2  Ingress / Gateway controller: TLS, host, path</text>
  <text class="sm" x="28" y="308">3  Service VIP: a DNAT rule in each node&#x27;s kernel</text>
  <text class="sm" x="28" y="328">4  Only ready endpoints are in the slice</text>
  <text class="tx" x="28" y="372">Readiness failing on pod C removes it from traffic without restarting it.</text>
  <text class="sub" x="28" y="396">With the AWS LB Controller in IP mode the ALB targets pod IPs directly, skipping NodePort and kube-proxy.</text>
</svg>
