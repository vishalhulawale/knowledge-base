<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">TDD red green refactor</title>
  <desc id="d">Animation: three circles labelled red, green and refactor light up in turn for three turns of TDD on a refill window rule. Turn one: a failing test that seven days is allowed, then return true, nothing to refactor. Turn two: a failing test that eight days is not allowed, then return days at most seven, then extract a REFILL_WINDOW_DAYS constant. Turn three: a failing test that negative days throw, then a guard clause, then tidy names and tests. The test count grows from one to three, and every refactor step starts and ends green.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes p0{0%,1.99%{opacity:0}2%,12.79%{opacity:1}12.8%,100%{opacity:0}}.p0{animation-name:p0}
    @keyframes p1{0%,12.79%{opacity:0}12.8%,23.59%{opacity:1}23.6%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,23.59%{opacity:0}23.6%,34.39%{opacity:1}34.4%,100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%,34.39%{opacity:0}34.4%,45.19%{opacity:1}45.2%,100%{opacity:0}}.p3{animation-name:p3}
    @keyframes p4{0%,45.19%{opacity:0}45.2%,55.99%{opacity:1}56%,100%{opacity:0}}.p4{animation-name:p4}
    @keyframes p5{0%,55.99%{opacity:0}56%,66.79%{opacity:1}66.8%,100%{opacity:0}}.p5{animation-name:p5}
    @keyframes p6{0%,66.79%{opacity:0}66.8%,77.59%{opacity:1}77.6%,100%{opacity:0}}.p6{animation-name:p6}
    @keyframes p7{0%,77.59%{opacity:0}77.6%,88.39%{opacity:1}88.4%,100%{opacity:0}}.p7{animation-name:p7}
    @keyframes p8{0%,88.39%{opacity:0}88.4%,100%{opacity:1}}.p8{animation-name:p8}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.p5{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="390" rx="14"/>
  <text class="h" x="28" y="40">Red, green, refactor: three turns</text><text class="sub" x="28" y="62">Refill window rule: a refill is allowed with 7 or fewer days of supply left.</text><circle class="box" cx="160" cy="120" r="46" stroke-width="1.5"/><text class="lbl" x="160" y="125" text-anchor="middle">Red</text><circle class="box" cx="250" cy="280" r="46" stroke-width="1.5"/><text class="lbl" x="250" y="285" text-anchor="middle">Green</text><circle class="box" cx="70" cy="280" r="46" stroke-width="1.5"/><text class="lbl" x="70" y="285" text-anchor="middle">Refactor</text><line class="ln" x1="185.494" y1="165.322" x2="223.526" y2="232.935" marker-end="url(#ar)"/><line class="ln" x1="198" y1="280" x2="124" y2="280" marker-end="url(#ar)"/><line class="ln" x1="95.4936" y1="234.678" x2="133.526" y2="167.065" marker-end="url(#ar)"/><rect class="bm" x="350" y="90" width="424" height="250" rx="10"/><g class="k p0"><circle class="badf" cx="160" cy="120" r="46"/><text class="on" x="160" y="125" text-anchor="middle">Red</text><text class="h2" x="370" y="122">Turn 1 of 3 · Red</text><text class="sub" x="370" y="152">Write a failing test</text><rect class="box" x="370" y="168" width="384" height="40" rx="6"/><text class="mono" x="386" y="194" xml:space="preserve">isAllowed(7) is true</text><text class="sub" x="370" y="246">tests</text><text class="badt" x="370" y="276" style="font-size:20px">1 failing</text><text class="sub" x="560" y="246">suite after this step</text><circle class="badf" cx="572" cy="270" r="10"/></g><g class="k p1"><circle class="okf" cx="250" cy="280" r="46"/><text class="on" x="250" y="285" text-anchor="middle">Green</text><text class="h2" x="370" y="122">Turn 1 of 3 · Green</text><text class="sub" x="370" y="152">Simplest code to pass</text><rect class="box" x="370" y="168" width="384" height="40" rx="6"/><text class="mono" x="386" y="194" xml:space="preserve">return true;</text><text class="sub" x="370" y="246">tests</text><text class="okt" x="370" y="276" style="font-size:20px">1 passing</text><text class="sub" x="560" y="246">suite after this step</text><circle class="okf" cx="572" cy="270" r="10"/></g><g class="k p2"><circle class="tea" cx="70" cy="280" r="46"/><text class="on" x="70" y="285" text-anchor="middle">Refactor</text><text class="h2" x="370" y="122">Turn 1 of 3 · Refactor</text><text class="sub" x="370" y="152">Improve the design</text><rect class="box" x="370" y="168" width="384" height="40" rx="6"/><text class="mono" x="386" y="194" xml:space="preserve">nothing yet</text><text class="sub" x="370" y="246">tests</text><text class="okt" x="370" y="276" style="font-size:20px">1 passing</text><text class="sub" x="560" y="246">suite after this step</text><circle class="okf" cx="572" cy="270" r="10"/></g><g class="k p3"><circle class="badf" cx="160" cy="120" r="46"/><text class="on" x="160" y="125" text-anchor="middle">Red</text><text class="h2" x="370" y="122">Turn 2 of 3 · Red</text><text class="sub" x="370" y="152">Write a failing test</text><rect class="box" x="370" y="168" width="384" height="40" rx="6"/><text class="mono" x="386" y="194" xml:space="preserve">isAllowed(8) is false</text><text class="sub" x="370" y="246">tests</text><text class="badt" x="370" y="276" style="font-size:20px">1 failing</text><text class="sub" x="560" y="246">suite after this step</text><circle class="okf" cx="572" cy="270" r="10"/><circle class="badf" cx="602" cy="270" r="10"/></g><g class="k p4"><circle class="okf" cx="250" cy="280" r="46"/><text class="on" x="250" y="285" text-anchor="middle">Green</text><text class="h2" x="370" y="122">Turn 2 of 3 · Green</text><text class="sub" x="370" y="152">Simplest code to pass</text><rect class="box" x="370" y="168" width="384" height="40" rx="6"/><text class="mono" x="386" y="194" xml:space="preserve">return days &lt;= 7;</text><text class="sub" x="370" y="246">tests</text><text class="okt" x="370" y="276" style="font-size:20px">2 passing</text><text class="sub" x="560" y="246">suite after this step</text><circle class="okf" cx="572" cy="270" r="10"/><circle class="okf" cx="602" cy="270" r="10"/></g><g class="k p5"><circle class="tea" cx="70" cy="280" r="46"/><text class="on" x="70" y="285" text-anchor="middle">Refactor</text><text class="h2" x="370" y="122">Turn 2 of 3 · Refactor</text><text class="sub" x="370" y="152">Improve the design</text><rect class="box" x="370" y="168" width="384" height="40" rx="6"/><text class="mono" x="386" y="194" xml:space="preserve">extract REFILL_WINDOW_DAYS</text><text class="sub" x="370" y="246">tests</text><text class="okt" x="370" y="276" style="font-size:20px">2 passing</text><text class="sub" x="560" y="246">suite after this step</text><circle class="okf" cx="572" cy="270" r="10"/><circle class="okf" cx="602" cy="270" r="10"/></g><g class="k p6"><circle class="badf" cx="160" cy="120" r="46"/><text class="on" x="160" y="125" text-anchor="middle">Red</text><text class="h2" x="370" y="122">Turn 3 of 3 · Red</text><text class="sub" x="370" y="152">Write a failing test</text><rect class="box" x="370" y="168" width="384" height="40" rx="6"/><text class="mono" x="386" y="194" xml:space="preserve">isAllowed(-1) throws</text><text class="sub" x="370" y="246">tests</text><text class="badt" x="370" y="276" style="font-size:20px">1 failing</text><text class="sub" x="560" y="246">suite after this step</text><circle class="okf" cx="572" cy="270" r="10"/><circle class="okf" cx="602" cy="270" r="10"/><circle class="badf" cx="632" cy="270" r="10"/></g><g class="k p7"><circle class="okf" cx="250" cy="280" r="46"/><text class="on" x="250" y="285" text-anchor="middle">Green</text><text class="h2" x="370" y="122">Turn 3 of 3 · Green</text><text class="sub" x="370" y="152">Simplest code to pass</text><rect class="box" x="370" y="168" width="384" height="40" rx="6"/><text class="mono" x="386" y="194" xml:space="preserve">guard clause for &lt; 0</text><text class="sub" x="370" y="246">tests</text><text class="okt" x="370" y="276" style="font-size:20px">3 passing</text><text class="sub" x="560" y="246">suite after this step</text><circle class="okf" cx="572" cy="270" r="10"/><circle class="okf" cx="602" cy="270" r="10"/><circle class="okf" cx="632" cy="270" r="10"/></g><g class="k p8"><circle class="tea" cx="70" cy="280" r="46"/><text class="on" x="70" y="285" text-anchor="middle">Refactor</text><text class="h2" x="370" y="122">Turn 3 of 3 · Refactor</text><text class="sub" x="370" y="152">Improve the design</text><rect class="box" x="370" y="168" width="384" height="40" rx="6"/><text class="mono" x="386" y="194" xml:space="preserve">rename, tidy the tests</text><text class="sub" x="370" y="246">tests</text><text class="okt" x="370" y="276" style="font-size:20px">3 passing</text><text class="sub" x="560" y="246">suite after this step</text><circle class="okf" cx="572" cy="270" r="10"/><circle class="okf" cx="602" cy="270" r="10"/><circle class="okf" cx="632" cy="270" r="10"/></g><text class="sm" x="28" y="372">Behaviour changes only in red and green; refactoring starts and ends with every test passing.</text>
</svg>
