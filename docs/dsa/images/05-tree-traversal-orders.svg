<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Pre-order, in-order and post-order on the same BST</title>
  <desc id="d">Three copies of the BST with root 4, children 2 and 6, and leaves 1, 3, 5, 7. Nodes light up one at a time in visit order and the output grows underneath. Pre-order visits 4 2 1 3 6 5 7, in-order visits 1 2 3 4 5 6 7, which is sorted, and post-order visits 1 3 2 5 7 6 4, so children always come before their parent.</desc>
  <style>.card{fill:#f8fafc;stroke:#e2e8f0}
.h{fill:#0f172a;font-size:19px;font-weight:700}
.t{fill:#334155;font-size:14px}
.tb{fill:#334155;font-size:14px;font-weight:700}
.lb{fill:#334155;font-size:15px;font-weight:600}
.m{fill:#64748b;font-size:13px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.box{fill:#ffffff;stroke:#cbd5e1}
.pri{fill:#4f46e5}.spri{stroke:#4f46e5}.tpri{fill:#4f46e5}
.tea{fill:#0ea5a4}.stea{stroke:#0ea5a4}.ttea{fill:#0f766e}
.ok{fill:#16a34a}.sok{stroke:#16a34a}.tok{fill:#16a34a}
.bad{fill:#dc2626}.sbad{stroke:#dc2626}.tbad{fill:#dc2626}
.warn{fill:#d97706}.swarn{stroke:#d97706}.twarn{fill:#d97706}
.smut{stroke:#94a3b8}.mut{fill:#94a3b8}
.tint{fill:#4f46e5;fill-opacity:.14}.ttint{fill:#0ea5a4;fill-opacity:.16}
.gtint{fill:#16a34a;fill-opacity:.16}.rtint{fill:#dc2626;fill-opacity:.14}.atint{fill:#d97706;fill-opacity:.16}
.on{fill:#ffffff;font-size:14px;font-weight:700}
.ln{fill:none;stroke-width:2}
.ah{stroke:none}
@media (prefers-color-scheme: dark){
.card{fill:#1f2430;stroke:#334155}
.h{fill:#f1f5f9}.t,.tb,.lb{fill:#e2e8f0}.m{fill:#94a3b8}
.box{fill:#111827;stroke:#475569}
.pri,.tint{fill:#818cf8}.spri{stroke:#818cf8}.tpri{fill:#818cf8}
.tea,.ttint{fill:#2dd4bf}.stea{stroke:#2dd4bf}.ttea{fill:#5eead4}
.ok,.gtint{fill:#4ade80}.sok{stroke:#4ade80}.tok{fill:#4ade80}
.bad,.rtint{fill:#f87171}.sbad{stroke:#f87171}.tbad{fill:#f87171}
.warn,.atint{fill:#fbbf24}.swarn{stroke:#fbbf24}.twarn{fill:#fbbf24}
.smut{stroke:#64748b}.mut{fill:#64748b}
.on{fill:#0f172a}
}
.a{opacity:0;animation:11.5s infinite linear}
@keyframes v0{0%,5.22%{opacity:0}6.72%,96%{opacity:1}100%{opacity:0}}.s0{animation-name:v0}
@keyframes v1{0%,14.78%{opacity:0}16.28%,96%{opacity:1}100%{opacity:0}}.s1{animation-name:v1}
@keyframes v2{0%,24.35%{opacity:0}25.85%,96%{opacity:1}100%{opacity:0}}.s2{animation-name:v2}
@keyframes v3{0%,33.91%{opacity:0}35.41%,96%{opacity:1}100%{opacity:0}}.s3{animation-name:v3}
@keyframes v4{0%,43.48%{opacity:0}44.98%,96%{opacity:1}100%{opacity:0}}.s4{animation-name:v4}
@keyframes v5{0%,53.04%{opacity:0}54.54%,96%{opacity:1}100%{opacity:0}}.s5{animation-name:v5}
@keyframes v6{0%,62.61%{opacity:0}64.11%,96%{opacity:1}100%{opacity:0}}.s6{animation-name:v6}
@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}}</style>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Three DFS orders on the same BST</text>
  <text class="m" x="28" y="62">Numbers in the small badges give the visit order; the output row grows as nodes are visited.</text>
  <text class="lb" x="140" y="100" text-anchor="middle">Pre-order</text>
  <text class="m" x="140" y="120" text-anchor="middle">(node, left, right)</text>
  <line class="ln smut" x1="140" y1="160" x2="80" y2="215"/>
  <line class="ln smut" x1="140" y1="160" x2="200" y2="215"/>
  <line class="ln smut" x1="80" y1="215" x2="50" y2="270"/>
  <line class="ln smut" x1="80" y1="215" x2="110" y2="270"/>
  <line class="ln smut" x1="200" y1="215" x2="170" y2="270"/>
  <line class="ln smut" x1="200" y1="215" x2="230" y2="270"/>
