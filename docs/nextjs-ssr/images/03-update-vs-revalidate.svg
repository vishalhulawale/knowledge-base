<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">updateTag versus revalidateTag</title>
  <desc id="d">Animation: two lanes of four steps after a reviewer approves claim 42. With updateTag, the action updates the database and expires the tag immediately, so the first and second views both show Approved. With revalidateTag and the max profile, the tag is only marked stale, so the first view still shows Pending while a background refresh runs, and the second view shows Approved.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes l0s0{0%,3.99%{opacity:0}4%,98.99%{opacity:1}99%,100%{opacity:0}}.l0s0{animation-name:l0s0}
    @keyframes l0s1{0%,23.99%{opacity:0}24%,98.99%{opacity:1}99%,100%{opacity:0}}.l0s1{animation-name:l0s1}
    @keyframes l0s2{0%,43.99%{opacity:0}44%,98.99%{opacity:1}99%,100%{opacity:0}}.l0s2{animation-name:l0s2}
    @keyframes l0s3{0%,63.99%{opacity:0}64%,98.99%{opacity:1}99%,100%{opacity:0}}.l0s3{animation-name:l0s3}
    @keyframes l1s0{0%,3.99%{opacity:0}4%,98.99%{opacity:1}99%,100%{opacity:0}}.l1s0{animation-name:l1s0}
    @keyframes l1s1{0%,23.99%{opacity:0}24%,98.99%{opacity:1}99%,100%{opacity:0}}.l1s1{animation-name:l1s1}
    @keyframes l1s2{0%,43.99%{opacity:0}44%,98.99%{opacity:1}99%,100%{opacity:0}}.l1s2{animation-name:l1s2}
    @keyframes l1s3{0%,63.99%{opacity:0}64%,98.99%{opacity:1}99%,100%{opacity:0}}.l1s3{animation-name:l1s3}
    @keyframes bg{0%,49.99%{opacity:0}50%,98.99%{opacity:1}99%,100%{opacity:0}}.bg{animation-name:bg}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="414" rx="14"/>
  <text class="h" x="28" y="40">After the save: updateTag vs revalidateTag</text><text class="sub" x="28" y="62">A reviewer approves claim 42 in a Server Action, then views the claim list.</text><text class="lbl" x="40" y="104" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px">updateTag('claim-42')</text><g class="k l0s0"><rect class="bp" x="40" y="118" width="160" height="58" rx="8" stroke-width="1.5"/><text class="lbl" x="120" y="142" text-anchor="middle">Approve</text><text class="sm" x="120" y="164" text-anchor="middle" style="font-size:13px">action runs</text></g><g class="k l0s1"><rect class="bp" x="220" y="118" width="160" height="58" rx="8" stroke-width="1.5"/><text class="lbl" x="300" y="142" text-anchor="middle">DB updated</text><text class="sm" x="300" y="164" text-anchor="middle" style="font-size:13px">tag expired now</text><line class="ln" x1="202" y1="147" x2="216" y2="147" marker-end="url(#ar)"/></g><g class="k l0s2"><rect class="bo" x="400" y="118" width="160" height="58" rx="8" stroke-width="1.5"/><text class="lbl" x="480" y="142" text-anchor="middle">View 1</text><text class="okt" x="480" y="164" text-anchor="middle" style="font-size:13px">Approved</text><line class="ln" x1="382" y1="147" x2="396" y2="147" marker-end="url(#ar)"/></g><g class="k l0s3"><rect class="bo" x="590" y="118" width="160" height="58" rx="8" stroke-width="1.5"/><text class="lbl" x="670" y="142" text-anchor="middle">View 2</text><text class="okt" x="670" y="164" text-anchor="middle" style="font-size:13px">Approved</text><line class="ln" x1="562" y1="147" x2="586" y2="147" marker-end="url(#ar)"/></g><text class="lbl" x="40" y="238" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px">revalidateTag('claim-42', 'max')</text><g class="k l1s0"><rect class="bp" x="40" y="252" width="160" height="58" rx="8" stroke-width="1.5"/><text class="lbl" x="120" y="276" text-anchor="middle">Approve</text><text class="sm" x="120" y="298" text-anchor="middle" style="font-size:13px">action runs</text></g><g class="k l1s1"><rect class="bp" x="220" y="252" width="160" height="58" rx="8" stroke-width="1.5"/><text class="lbl" x="300" y="276" text-anchor="middle">DB updated</text><text class="sm" x="300" y="298" text-anchor="middle" style="font-size:13px">tag marked stale</text><line class="ln" x1="202" y1="281" x2="216" y2="281" marker-end="url(#ar)"/></g><g class="k l1s2"><rect class="bw" x="400" y="252" width="160" height="58" rx="8" stroke-width="1.5"/><text class="lbl" x="480" y="276" text-anchor="middle">View 1</text><text class="wrnt" x="480" y="298" text-anchor="middle" style="font-size:13px">Pending (stale)</text><line class="ln" x1="382" y1="281" x2="396" y2="281" marker-end="url(#ar)"/></g><g class="k l1s3"><rect class="bo" x="590" y="252" width="160" height="58" rx="8" stroke-width="1.5"/><text class="lbl" x="670" y="276" text-anchor="middle">View 2</text><text class="okt" x="670" y="298" text-anchor="middle" style="font-size:13px">Approved</text><line class="ln" x1="562" y1="281" x2="586" y2="281" marker-end="url(#ar)"/></g><g class="k bg"><rect class="tea" x="400" y="322" width="350" height="20" rx="5"/><text class="on13" x="575" y="336" text-anchor="middle">background refresh after View 1</text></g><text class="sm" x="28" y="376">updateTag: Server Actions only, read-your-writes. revalidateTag(tag, 'max'): also from Route Handlers,</text><text class="sm" x="28" y="396">never blocks, so the first view after the change can still be stale. Fine for a CMS webhook, not for a form.</text>
</svg>
