<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Minimum necessary projections</title>
  <desc id="d">Animation: a member record with seven fields (name, member ID, date of birth, plan and copay, drug, diagnosis code, allergies) and three roles highlighted in turn. The pharmacist gets name, member ID, date of birth and all clinical fields but not copay. The call-centre agent gets name, member ID, date of birth and plan, and no clinical fields. The analytics job gets no name, a surrogate key instead of the member ID, year of birth only, plan and copay, and drug class instead of the drug. Roles and fields are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes c0{0%,33.29%{opacity:1}33.3%,100%{opacity:0}}.c0{animation-name:c0}
    @keyframes c1{0%,33.29%{opacity:0}33.3%,66.59%{opacity:1}66.6%,100%{opacity:0}}.c1{animation-name:c1}
    @keyframes c2{0%,66.59%{opacity:0}66.6%,100%{opacity:1}}.c2{animation-name:c2}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.c1{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="454" rx="14"/>
  <text class="h" x="28" y="40">Minimum necessary: one record, three projections</text><text class="sub" x="28" y="62">The API decides which fields leave for each role. Illustrative roles and fields.</text><g class="k c0"><rect class="bt" x="334" y="80" width="132" height="296" rx="10" stroke-width="2"/></g><g class="k c1"><rect class="bt" x="474" y="80" width="132" height="296" rx="10" stroke-width="2"/></g><g class="k c2"><rect class="bt" x="614" y="80" width="132" height="296" rx="10" stroke-width="2"/></g><text class="lbl" x="400" y="104" text-anchor="middle">Pharmacist</text><text class="lbl" x="540" y="104" text-anchor="middle">Call centre</text><text class="lbl" x="680" y="104" text-anchor="middle">Analytics job</text><text class="lbl" x="40" y="104">Field</text><rect class="bm" x="28" y="122" width="290" height="28" rx="6" stroke-width="0"/><text class="tx" x="40" y="140">Name</text><circle class="tea" cx="400" cy="135" r="7"/><circle class="tea" cx="540" cy="135" r="7"/><line class="ln" x1="672" y1="135" x2="688" y2="135" style="stroke-width:3"/><text class="tx" x="40" y="172">Member ID</text><circle class="tea" cx="400" cy="167" r="7"/><circle class="tea" cx="540" cy="167" r="7"/><text class="wrnt" x="680" y="173" text-anchor="middle" style="font-size:13px">surrogate key</text><rect class="bm" x="28" y="186" width="290" height="28" rx="6" stroke-width="0"/><text class="tx" x="40" y="204">Date of birth</text><circle class="tea" cx="400" cy="199" r="7"/><circle class="tea" cx="540" cy="199" r="7"/><text class="wrnt" x="680" y="205" text-anchor="middle" style="font-size:13px">year only</text><text class="tx" x="40" y="236">Plan / copay</text><line class="ln" x1="392" y1="231" x2="408" y2="231" style="stroke-width:3"/><circle class="tea" cx="540" cy="231" r="7"/><circle class="tea" cx="680" cy="231" r="7"/><rect class="bm" x="28" y="250" width="290" height="28" rx="6" stroke-width="0"/><text class="tx" x="40" y="268">Drug</text><circle class="tea" cx="400" cy="263" r="7"/><line class="ln" x1="532" y1="263" x2="548" y2="263" style="stroke-width:3"/><text class="wrnt" x="680" y="269" text-anchor="middle" style="font-size:13px">drug class</text><text class="tx" x="40" y="300">Diagnosis code</text><circle class="tea" cx="400" cy="295" r="7"/><line class="ln" x1="532" y1="295" x2="548" y2="295" style="stroke-width:3"/><line class="ln" x1="672" y1="295" x2="688" y2="295" style="stroke-width:3"/><rect class="bm" x="28" y="314" width="290" height="28" rx="6" stroke-width="0"/><text class="tx" x="40" y="332">Allergies</text><circle class="tea" cx="400" cy="327" r="7"/><line class="ln" x1="532" y1="327" x2="548" y2="327" style="stroke-width:3"/><line class="ln" x1="672" y1="327" x2="688" y2="327" style="stroke-width:3"/><g class="k c0"><text class="teat" x="28" y="404" style="font-size:14px">Pharmacist (treatment): clinical fields are needed; copay is not.</text></g><g class="k c1"><text class="teat" x="28" y="404" style="font-size:14px">Call centre: verify identity and explain benefits; no clinical fields.</text></g><g class="k c2"><text class="teat" x="28" y="404" style="font-size:14px">Analytics: no name; surrogate key, year of birth and drug class only.</text></g><circle class="tea" cx="40" cy="432" r="6"/><text class="sub" x="54" y="437">returned</text><line class="ln" x1="122" y1="432" x2="136" y2="432" style="stroke-width:3"/><text class="sub" x="144" y="437">not returned</text><text class="wrnt" x="250" y="437" style="font-size:13px">amber text = transformed before release</text>
</svg>
