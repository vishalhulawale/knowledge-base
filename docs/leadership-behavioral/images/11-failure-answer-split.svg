<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Failure answer time split</title>
  <desc id="d">Two ways to spend a two-minute failure answer. The weak answer spends most of the time on the situation and on what went wrong, with a few seconds of a generic lesson and no evidence. The strong answer keeps the situation short, owns the decision plainly, states the impact factually, and spends about half the time on recovery, a specific lesson and evidence of a later situation handled differently. Illustrative proportions.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Where the two minutes go</text>
  <text class="sub" x="28" y="62">Illustrative split of a 2-minute answer to &quot;Tell me about a failure&quot;.</text>
  <rect class="mutf" x="28" y="82" width="14" height="14" rx="3"/>
  <text class="sm" x="48" y="94">situation</text>
  <rect class="pri" x="118.8" y="82" width="14" height="14" rx="3"/>
  <text class="sm" x="138.8" y="94">my decision</text>
  <rect class="badf" x="224" y="82" width="14" height="14" rx="3"/>
  <text class="sm" x="244" y="94">what went wrong</text>
  <rect class="wrnf" x="358" y="82" width="14" height="14" rx="3"/>
  <text class="sm" x="378" y="94">recovery</text>
  <rect class="tea" x="441.6" y="82" width="14" height="14" rx="3"/>
  <text class="sm" x="461.6" y="94">lesson</text>
  <rect class="okf" x="510.8" y="82" width="14" height="14" rx="3"/>
  <text class="sm" x="530.8" y="94">evidence</text>
  <text class="h2 badt" x="28" y="150">Weak</text>
  <rect class="mutf" x="121" y="120" width="258" height="46" rx="5"/>
  <text class="on13" x="250" y="147.5" text-anchor="middle">situation</text>
  <rect class="pri" x="381" y="120" width="30.5" height="46" rx="5"/>
  <rect class="badf" x="413.5" y="120" width="290.5" height="46" rx="5"/>
  <text class="on13" x="558.75" y="147.5" text-anchor="middle">what went wrong</text>
  <rect class="tea" x="706" y="120" width="63" height="46" rx="5"/>
  <text class="on13" x="737.5" y="147.5" text-anchor="middle">lesson</text>
  <text class="sm" x="120" y="186">mostly story and blame-adjacent detail; nothing after the mistake</text>
  <text class="h2 okt" x="28" y="246">Strong</text>
  <rect class="mutf" x="121" y="216" width="76" height="46" rx="5"/>
  <rect class="pri" x="199" y="216" width="63" height="46" rx="5"/>
  <rect class="badf" x="264" y="216" width="115" height="46" rx="5"/>
  <text class="on13" x="321.5" y="243.5" text-anchor="middle">went wrong</text>
  <rect class="wrnf" x="381" y="216" width="141" height="46" rx="5"/>
  <text class="on13" x="451.5" y="243.5" text-anchor="middle">recovery</text>
  <rect class="tea" x="524" y="216" width="115" height="46" rx="5"/>
  <text class="on13" x="581.5" y="243.5" text-anchor="middle">lesson</text>
  <rect class="okf" x="641" y="216" width="128" height="46" rx="5"/>
  <text class="on13" x="705" y="243.5" text-anchor="middle">evidence</text>
  <text class="sm" x="120" y="282">about 60% on what happened after: recovery, lesson, evidence</text>
  <text class="tx" x="28" y="330">Interviewers learn little from the mistake itself and a lot from what you did next and what changed.</text>
  <text class="sub" x="28" y="354">Pick a real failure with real stakes and your own decision, and end with evidence that the lesson stuck.</text>
</svg>
