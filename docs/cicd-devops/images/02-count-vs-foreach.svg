<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">count versus for_each</title>
  <desc id="d">Two panels showing the plan after removing claims from the list claims, pharmacy, members. With count, index zero changes from claims to pharmacy, index one changes from pharmacy to members, and index two is destroyed: two changed and one destroyed. With for_each, the claims key is destroyed and the pharmacy and members keys are unchanged: zero changed and one destroyed. A note says that when the name forces replacement, each change on the count side becomes a destroy and recreate.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="414" rx="14"/>
  <text class="h" x="28" y="40">Removing the first item: count vs for_each</text><text class="sub" x="28" y="62">From the page's lab: svcs = [claims, pharmacy, members] → [pharmacy, members].</text><rect class="box" x="20" y="80" width="370" height="290" rx="10" stroke-width="1.2"/><text class="mono" x="205" y="106" text-anchor="middle" xml:space="preserve">count = length(var.svcs)</text><text class="sub" x="115" y="132" text-anchor="middle">before</text><text class="sub" x="295" y="132" text-anchor="middle">after</text><rect class="bm" x="40" y="146" width="150" height="42" rx="8" stroke-width="1.5"/><text class="sm" x="115" y="172" text-anchor="middle">[0] claims</text><rect class="bw" x="220" y="146" width="150" height="42" rx="8" stroke-width="1.5"/><text class="sm" x="295" y="164" text-anchor="middle">[0] pharmacy</text><text class="sm" x="295" y="180" text-anchor="middle">~ changed</text><line class="lnw" x1="192" y1="167" x2="216" y2="167" marker-end="url(#arw)"/><rect class="bm" x="40" y="204" width="150" height="42" rx="8" stroke-width="1.5"/><text class="sm" x="115" y="230" text-anchor="middle">[1] pharmacy</text><rect class="bw" x="220" y="204" width="150" height="42" rx="8" stroke-width="1.5"/><text class="sm" x="295" y="222" text-anchor="middle">[1] members</text><text class="sm" x="295" y="238" text-anchor="middle">~ changed</text><line class="lnw" x1="192" y1="225" x2="216" y2="225" marker-end="url(#arw)"/><rect class="bm" x="40" y="262" width="150" height="42" rx="8" stroke-width="1.5"/><text class="sm" x="115" y="288" text-anchor="middle">[2] members</text><rect class="bb" x="220" y="262" width="150" height="42" rx="8" stroke-width="1.5"/><text class="sm" x="295" y="288" text-anchor="middle">[2] destroyed</text><line class="lnb" x1="192" y1="283" x2="216" y2="283" marker-end="url(#arb)"/><text class="badt" x="205" y="348" text-anchor="middle" style="font-size:15px">2 changed, 1 destroyed</text><rect class="box" x="410" y="80" width="370" height="290" rx="10" stroke-width="1.2"/><text class="mono" x="595" y="106" text-anchor="middle" xml:space="preserve">for_each = toset(var.svcs)</text><text class="sub" x="505" y="132" text-anchor="middle">before</text><text class="sub" x="685" y="132" text-anchor="middle">after</text><rect class="bm" x="430" y="146" width="150" height="42" rx="8" stroke-width="1.5"/><text class="sm" x="505" y="172" text-anchor="middle">["claims"]</text><rect class="bb" x="610" y="146" width="150" height="42" rx="8" stroke-width="1.5"/><text class="sm" x="685" y="172" text-anchor="middle">["claims"] destroyed</text><line class="lnb" x1="582" y1="167" x2="606" y2="167" marker-end="url(#arb)"/><rect class="bm" x="430" y="204" width="150" height="42" rx="8" stroke-width="1.5"/><text class="sm" x="505" y="230" text-anchor="middle">["pharmacy"]</text><rect class="bo" x="610" y="204" width="150" height="42" rx="8" stroke-width="1.5"/><text class="sm" x="685" y="222" text-anchor="middle">["pharmacy"]</text><text class="sm" x="685" y="238" text-anchor="middle">unchanged</text><line class="lno" x1="582" y1="225" x2="606" y2="225" marker-end="url(#aro)"/><rect class="bm" x="430" y="262" width="150" height="42" rx="8" stroke-width="1.5"/><text class="sm" x="505" y="288" text-anchor="middle">["members"]</text><rect class="bo" x="610" y="262" width="150" height="42" rx="8" stroke-width="1.5"/><text class="sm" x="685" y="280" text-anchor="middle">["members"]</text><text class="sm" x="685" y="296" text-anchor="middle">unchanged</text><line class="lno" x1="582" y1="283" x2="606" y2="283" marker-end="url(#aro)"/><text class="okt" x="595" y="348" text-anchor="middle" style="font-size:15px">0 changed, 1 destroyed</text><text class="sm" x="28" y="396">If the name forces replacement (a queue, a bucket), each "changed" on the left is a destroy and recreate.</text>
</svg>
