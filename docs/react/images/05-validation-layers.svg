<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Form validation layers</title>
  <desc id="d">In the browser, a form submission passes HTML constraints such as required, pattern and type, then client schema validation with Zod on blur and submit. These give fast feedback but the user can change or skip them. The request then reaches server validation, which uses the same schema and is authoritative, before the data is saved. A second path shows a script or curl request that skips the browser entirely and goes straight to the server, where server validation still rejects bad input.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .sub{fill:#64748b;font-size:13px}
    .zone{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .cli{fill:#ffffff;stroke:#0ea5a4;stroke-width:2}
    .srv{fill:#ffffff;stroke:#4f46e5;stroke-width:2.5}
    .atk{fill:#ffffff;stroke:#dc2626;stroke-width:2}
    .arr{fill:none;stroke:#64748b;stroke-width:2}
    .ah{fill:#64748b}
    .bp{fill:none;stroke:#dc2626;stroke-width:2;stroke-dasharray:6 4}
    .bph{fill:#dc2626}
    .teat{fill:#0f766e;font-size:14px;font-weight:700}
    .prit{fill:#4f46e5;font-size:14px;font-weight:700}
    .badt{fill:#dc2626;font-size:13px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl{fill:#e2e8f0}.sub{fill:#94a3b8}
      .zone{stroke:#64748b}
      .box{fill:#111827;stroke:#475569}
      .cli{fill:#111827;stroke:#2dd4bf}.srv{fill:#111827;stroke:#818cf8}.atk{fill:#111827;stroke:#f87171}
      .arr{stroke:#94a3b8}.ah{fill:#94a3b8}
      .bp{stroke:#f87171}.bph,.badt{fill:#f87171}
      .teat{fill:#5eead4}.prit{fill:#818cf8}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Three validation layers, one you can trust</text>
  <text class="sub" x="28" y="62">Client checks are UX. The server check is the only one an attacker can't skip.</text>

  <!-- browser zone -->
  <rect class="zone" x="28" y="82" width="452" height="140" rx="12"/>
  <text class="teat" x="44" y="106">Browser: fast feedback</text>
  <text class="sub" x="464" y="106" text-anchor="end">user can change or skip</text>
  <rect class="cli" x="44" y="122" width="196" height="76" rx="10"/>
  <text class="lbl" x="58" y="152">HTML constraints</text>
  <text class="sub" x="58" y="174">required, pattern, type</text>
  <path class="arr" d="M242 160 H258"/><path class="ah" d="M256 154 L266 160 L256 166 Z"/>
  <rect class="cli" x="268" y="122" width="196" height="76" rx="10"/>
  <text class="lbl" x="282" y="152">Client schema</text>
  <text class="sub" x="282" y="174">Zod, on blur and submit</text>

  <!-- server zone -->
  <rect class="zone" x="524" y="82" width="256" height="214" rx="12"/>
  <text class="prit" x="540" y="106">Server: always runs</text>
  <rect class="srv" x="540" y="122" width="226" height="76" rx="10"/>
  <text class="lbl" x="554" y="152">Server validation</text>
  <text class="sub" x="554" y="174">same schema, authoritative</text>
  <path class="arr" d="M653 200 V222"/><path class="ah" d="M647 220 L653 230 L659 220 Z"/>
  <rect class="box" x="540" y="232" width="226" height="46" rx="10"/>
  <text class="lbl" x="554" y="260">Save / business logic</text>

  <!-- normal request -->
  <path class="arr" d="M466 146 H528"/><path class="ah" d="M528 140 L538 146 L528 152 Z"/>
  <text class="sub" x="502" y="136" text-anchor="middle">POST</text>

  <!-- bypass -->
  <rect class="atk" x="44" y="252" width="236" height="44" rx="10"/>
  <text class="lbl" x="58" y="279">curl / script / edited JS</text>
  <path class="bp" d="M282 274 H502 V178 H528"/><path class="bph" d="M528 172 L538 178 L528 184 Z"/>
  <text class="badt" x="296" y="266">skips every browser check</text>

  <text class="sub" x="28" y="332">Share one schema (Zod, Yup, Valibot) between client and server, so messages match and the</text>
  <text class="sub" x="28" y="350">server rejects what the client would have caught. Return field errors the form can show.</text>
</svg>
