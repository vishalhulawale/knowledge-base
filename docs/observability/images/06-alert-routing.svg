<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Alertmanager routing pipeline</title>
  <desc id="d">Prometheus rules fire 50 pod alerts plus a cluster-down alert into Alertmanager. Alertmanager groups them by alert name and service so 50 become one, inhibits service alerts while the cluster is down, applies time-boxed maintenance silences, and routes by severity and team labels. Pages go to PagerDuty, which escalates from primary to secondary after 15 minutes; tickets go to a Jira queue for business hours; and everything is posted to the team's Slack channel for context without paging.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">From alert storm to one actionable page</text><text class="sub" x="28" y="62">Prometheus decides what's firing; Alertmanager decides who hears about it.</text><rect class="box" x="28" y="92" width="130" height="130" rx="10" stroke-width="1.5"/><text class="sm" x="93" y="122" text-anchor="middle" font-weight="700">Prometheus</text><text class="sm" x="93" y="142" text-anchor="middle">rules</text><text class="sm" x="93" y="162" text-anchor="middle"></text><text class="sm" x="93" y="182" text-anchor="middle">50 pod alerts</text><text class="sm" x="93" y="202" text-anchor="middle">+ cluster down</text><line class="ln" x1="160" y1="157" x2="190" y2="157" marker-end="url(#ar)"/><rect class="bp" x="192" y="84" width="304" height="248" rx="12" stroke-width="1.5"/><text class="prit" x="342" y="108" text-anchor="middle" style="font-size:15px">Alertmanager</text><rect class="box" x="208" y="122" width="276" height="40" rx="8" stroke-width="1.2"/><text class="sm" x="220" y="147" font-weight="700">Group</text><text class="sub" x="282" y="147">by alertname, service: 50 → 1</text><line class="ln" x1="342" y1="163" x2="342" y2="171" marker-end="url(#ar)"/><rect class="box" x="208" y="172" width="276" height="40" rx="8" stroke-width="1.2"/><text class="sm" x="220" y="197" font-weight="700">Inhibit</text><text class="sub" x="282" y="197">cluster down mutes services</text><line class="ln" x1="342" y1="213" x2="342" y2="221" marker-end="url(#ar)"/><rect class="box" x="208" y="222" width="276" height="40" rx="8" stroke-width="1.2"/><text class="sm" x="220" y="247" font-weight="700">Silence</text><text class="sub" x="282" y="247">maintenance, time-boxed</text><line class="ln" x1="342" y1="263" x2="342" y2="271" marker-end="url(#ar)"/><rect class="box" x="208" y="272" width="276" height="40" rx="8" stroke-width="1.2"/><text class="sm" x="220" y="297" font-weight="700">Route</text><text class="sub" x="282" y="297">match severity + team labels</text><path class="ln" d="M 486 292 C 520 292 520 120 556 120" marker-end="url(#ar)"/><rect class="bb" x="558" y="92" width="214" height="70" rx="10" stroke-width="1.5"/><text class="badt" x="572" y="114" style="font-size:14px">PagerDuty</text><text class="sub" x="760" y="114" text-anchor="end">severity=page</text><text class="sm" x="572" y="134">primary → secondary</text><text class="sm" x="572" y="150">after 15 min</text><path class="ln" d="M 486 292 C 520 292 520 220 556 220" marker-end="url(#ar)"/><rect class="bw" x="558" y="192" width="214" height="56" rx="10" stroke-width="1.5"/><text class="wrnt" x="572" y="214" style="font-size:14px">Jira queue</text><text class="sub" x="760" y="214" text-anchor="end">severity=ticket</text><text class="sm" x="572" y="234">business hours</text><path class="ln" d="M 486 292 C 520 292 520 300 556 300" marker-end="url(#ar)"/><rect class="bm" x="558" y="272" width="214" height="56" rx="10" stroke-width="1.5"/><text class="sub" x="572" y="294" style="font-size:14px">Slack</text><text class="sub" x="760" y="294" text-anchor="end">all, team channel</text><text class="sm" x="572" y="314">context, no paging</text><text class="sm" x="28" y="360">Every paging alert carries runbook_url, dashboard and team labels. A Watchdog alert proves the pipeline works.</text>
</svg>
