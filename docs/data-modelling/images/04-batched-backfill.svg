    @keyframes g2{0%,16.99%{opacity:0}17%,96.99%{opacity:1}97%,100%{opacity:0}}.g2{animation-name:g2}
    @keyframes l2{0%,16.99%{opacity:0}17%,25.49%{opacity:1}25.5%,100%{opacity:0}}.l2{animation-name:l2}
    @keyframes g3{0%,25.49%{opacity:0}25.5%,96.99%{opacity:1}97%,100%{opacity:0}}.g3{animation-name:g3}
    @keyframes l3{0%,25.49%{opacity:0}25.5%,33.99%{opacity:1}34%,100%{opacity:0}}.l3{animation-name:l3}
    @keyframes g4{0%,33.99%{opacity:0}34%,96.99%{opacity:1}97%,100%{opacity:0}}.g4{animation-name:g4}
    @keyframes l4{0%,33.99%{opacity:0}34%,42.49%{opacity:1}42.5%,100%{opacity:0}}.l4{animation-name:l4}
    @keyframes g5{0%,42.49%{opacity:0}42.5%,96.99%{opacity:1}97%,100%{opacity:0}}.g5{animation-name:g5}
    @keyframes l5{0%,42.49%{opacity:0}42.5%,50.99%{opacity:1}51%,100%{opacity:0}}.l5{animation-name:l5}
    @keyframes g6{0%,50.99%{opacity:0}51%,96.99%{opacity:1}97%,100%{opacity:0}}.g6{animation-name:g6}
    @keyframes l6{0%,50.99%{opacity:0}51%,59.49%{opacity:1}59.5%,100%{opacity:0}}.l6{animation-name:l6}
    @keyframes g7{0%,59.49%{opacity:0}59.5%,96.99%{opacity:1}97%,100%{opacity:0}}.g7{animation-name:g7}
    @keyframes l7{0%,59.49%{opacity:0}59.5%,67.99%{opacity:1}68%,100%{opacity:0}}.l7{animation-name:l7}
    @keyframes g8{0%,67.99%{opacity:0}68%,96.99%{opacity:1}97%,100%{opacity:0}}.g8{animation-name:g8}
    @keyframes l8{0%,67.99%{opacity:0}68%,76.49%{opacity:1}76.5%,100%{opacity:0}}.l8{animation-name:l8}
    @keyframes g9{0%,76.49%{opacity:0}76.5%,96.99%{opacity:1}97%,100%{opacity:0}}.g9{animation-name:g9}
    @keyframes l9{0%,76.49%{opacity:0}76.5%,85.99%{opacity:1}86%,100%{opacity:0}}.l9{animation-name:l9}
    @keyframes fx{0%,85.99%{opacity:0}86%,96.99%{opacity:1}97%,100%{opacity:0}}.fx{animation-name:fx}
