<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Idempotent versus append loads</title>
  <desc id="d">Animation: Tuesday's three fills are loaded, then the job is retried. With a plain append INSERT, the retry adds three duplicate rows, six in total, so Tuesday's revenue doubles. With delete-the-day and insert in one transaction, the retry replaces the same three rows, so the table looks exactly as if the load ran once. Each run touches only its own partition, keyed by logical date.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes r1{0%,9.99%{opacity:0}10%,96.99%{opacity:1}97%,100%{opacity:0}}.r1{animation-name:r1}
    @keyframes r2{0%,44.99%{opacity:0}45%,96.99%{opacity:1}97%,100%{opacity:0}}.r2{animation-name:r2}
    @keyframes o1{0%,9.99%{opacity:0}10%,44.99%{opacity:1}45%,100%{opacity:0}}.o1{animation-name:o1}
    @keyframes o2{0%,44.99%{opacity:0}45%,96.99%{opacity:1}97%,100%{opacity:0}}.o2{animation-name:o2}
    @keyframes v{0%,59.99%{opacity:0}60%,96.99%{opacity:1}97%,100%{opacity:0}}.v{animation-name:v}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}.o1{opacity:0}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="374" rx="14"/>
  <text class="h" x="28" y="40">Run the same load twice: append vs partition overwrite</text><text class="sub" x="28" y="62">Tuesday's fills (3 rows) are loaded, then the job is retried after a timeout.</text><text class="mono" x="28" y="100" xml:space="preserve">INSERT INTO fills SELECT … (append)</text><rect class="bm" x="28" y="110" width="360" height="190" rx="8"/><text class="sub" x="40" y="132">fills where day = 2026-10-06</text><text class="mono" x="412" y="100" xml:space="preserve">DELETE day + INSERT, one transaction</text><rect class="bm" x="412" y="110" width="360" height="190" rx="8"/><text class="sub" x="424" y="132">fills where day = 2026-10-06</text><g class="k r1"><rect class="bt" x="40" y="142" width="336" height="22" rx="4"/><text class="mono" x="52" y="158" xml:space="preserve">fill_1</text></g><g class="k r2"><rect class="bb" x="40" y="214" width="336" height="22" rx="4"/><text class="mono" x="52" y="230" xml:space="preserve">fill_1  (duplicate)</text></g><g class="k o1"><rect class="bt" x="424" y="142" width="336" height="22" rx="4"/><text class="mono" x="436" y="158" xml:space="preserve">fill_1</text></g><g class="k o2"><rect class="bo" x="424" y="142" width="336" height="22" rx="4"/><text class="mono" x="436" y="158" xml:space="preserve">fill_1  (replaced)</text></g><g class="k r1"><rect class="bt" x="40" y="166" width="336" height="22" rx="4"/><text class="mono" x="52" y="182" xml:space="preserve">fill_2</text></g><g class="k r2"><rect class="bb" x="40" y="238" width="336" height="22" rx="4"/><text class="mono" x="52" y="254" xml:space="preserve">fill_2  (duplicate)</text></g><g class="k o1"><rect class="bt" x="424" y="166" width="336" height="22" rx="4"/><text class="mono" x="436" y="182" xml:space="preserve">fill_2</text></g><g class="k o2"><rect class="bo" x="424" y="166" width="336" height="22" rx="4"/><text class="mono" x="436" y="182" xml:space="preserve">fill_2  (replaced)</text></g><g class="k r1"><rect class="bt" x="40" y="190" width="336" height="22" rx="4"/><text class="mono" x="52" y="206" xml:space="preserve">fill_3</text></g><g class="k r2"><rect class="bb" x="40" y="262" width="336" height="22" rx="4"/><text class="mono" x="52" y="278" xml:space="preserve">fill_3  (duplicate)</text></g><g class="k o1"><rect class="bt" x="424" y="190" width="336" height="22" rx="4"/><text class="mono" x="436" y="206" xml:space="preserve">fill_3</text></g><g class="k o2"><rect class="bo" x="424" y="190" width="336" height="22" rx="4"/><text class="mono" x="436" y="206" xml:space="preserve">fill_3  (replaced)</text></g><g class="k v"><text class="badt" x="28" y="326" style="font-size:15px">6 rows: Tuesday revenue doubles</text><text class="okt" x="412" y="326" style="font-size:15px">3 rows: same as running it once</text></g><text class="sm" x="28" y="356">Every run reads and writes only its own partition, keyed by the logical date, never now().</text>
</svg>
