<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Erasure fan-out</title>
  <desc id="d">Animation: a verified erasure request goes to a privacy orchestrator, which publishes one event on Kafka. Five stores act on it in turn: profile deletes the row, orders anonymise but keep invoice totals for tax, search deletes documents, the cache evicts keys and backups destroy the subject's data key. Each sends an acknowledgement and when all five have answered the request is complete, with evidence recording the request ID, stores and counts but no personal data. Order and timing are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes a0{0%,11.99%{opacity:0}12%,96.99%{opacity:1}97%,100%{opacity:0}}.a0{animation-name:a0}
    @keyframes a1{0%,23.99%{opacity:0}24%,96.99%{opacity:1}97%,100%{opacity:0}}.a1{animation-name:a1}
    @keyframes a2{0%,35.99%{opacity:0}36%,96.99%{opacity:1}97%,100%{opacity:0}}.a2{animation-name:a2}
    @keyframes a3{0%,47.99%{opacity:0}48%,96.99%{opacity:1}97%,100%{opacity:0}}.a3{animation-name:a3}
    @keyframes a4{0%,59.99%{opacity:0}60%,96.99%{opacity:1}97%,100%{opacity:0}}.a4{animation-name:a4}
    @keyframes done{0%,77.99%{opacity:0}78%,96.99%{opacity:1}97%,100%{opacity:0}}.done{animation-name:done}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="410" rx="14"/>
  <text class="h" x="28" y="40">Erasure fan-out with acknowledgements</text><text class="sub" x="28" y="62">One event, every store, proof of completion. Order and timing illustrative.</text><rect class="bp" x="30" y="190" width="150" height="64" rx="8" stroke-width="1.5"/><text class="sm" x="105" y="218" text-anchor="middle">Erasure</text><text class="sm" x="105" y="236" text-anchor="middle">request verified</text><rect class="bp" x="206" y="190" width="120" height="64" rx="8" stroke-width="1.5"/><text class="sm" x="266" y="218" text-anchor="middle">Privacy</text><text class="sm" x="266" y="236" text-anchor="middle">orchestrator</text><line class="lnp" x1="180" y1="222" x2="204" y2="222" marker-end="url(#arp)"/><line class="lnp" x1="326" y1="222" x2="352" y2="222" marker-end="url(#arp)"/><rect class="pri" x="354" y="92" width="18" height="262" rx="6"/><text class="sub" x="363" y="372" text-anchor="middle">Kafka</text><line class="ln" x1="372" y1="112" x2="396" y2="112" marker-end="url(#ar)"/><rect class="box" x="398" y="92" width="300" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="412" y="117">Profile</text><text class="sm" x="480" y="117">delete row</text><g class="k a0"><rect class="bo" x="398" y="92" width="300" height="40" rx="8" stroke-width="2" fill-opacity="0"/><circle class="okf" cx="730" cy="112" r="12"/><text class="on13" x="730" y="117" text-anchor="middle" style="font-size:11px">ack</text></g><line class="ln" x1="372" y1="166" x2="396" y2="166" marker-end="url(#ar)"/><rect class="box" x="398" y="146" width="300" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="412" y="171">Orders</text><text class="sm" x="480" y="171">anonymise; keep tax totals</text><g class="k a1"><rect class="bo" x="398" y="146" width="300" height="40" rx="8" stroke-width="2" fill-opacity="0"/><circle class="okf" cx="730" cy="166" r="12"/><text class="on13" x="730" y="171" text-anchor="middle" style="font-size:11px">ack</text></g><line class="ln" x1="372" y1="220" x2="396" y2="220" marker-end="url(#ar)"/><rect class="box" x="398" y="200" width="300" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="412" y="225">Search</text><text class="sm" x="480" y="225">delete documents</text><g class="k a2"><rect class="bo" x="398" y="200" width="300" height="40" rx="8" stroke-width="2" fill-opacity="0"/><circle class="okf" cx="730" cy="220" r="12"/><text class="on13" x="730" y="225" text-anchor="middle" style="font-size:11px">ack</text></g><line class="ln" x1="372" y1="274" x2="396" y2="274" marker-end="url(#ar)"/><rect class="box" x="398" y="254" width="300" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="412" y="279">Cache</text><text class="sm" x="480" y="279">evict keys</text><g class="k a3"><rect class="bo" x="398" y="254" width="300" height="40" rx="8" stroke-width="2" fill-opacity="0"/><circle class="okf" cx="730" cy="274" r="12"/><text class="on13" x="730" y="279" text-anchor="middle" style="font-size:11px">ack</text></g><line class="ln" x1="372" y1="328" x2="396" y2="328" marker-end="url(#ar)"/><rect class="box" x="398" y="308" width="300" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="412" y="333">Backups</text><text class="sm" x="480" y="333">destroy subject data key</text><g class="k a4"><rect class="bo" x="398" y="308" width="300" height="40" rx="8" stroke-width="2" fill-opacity="0"/><circle class="okf" cx="730" cy="328" r="12"/><text class="on13" x="730" y="333" text-anchor="middle" style="font-size:11px">ack</text></g><g class="k done"><rect class="bo" x="30" y="280" width="296" height="74" rx="10" stroke-width="2"/><text class="okt" x="178" y="308" text-anchor="middle" style="font-size:15px">All 5 acknowledged</text><text class="sm" x="178" y="330" text-anchor="middle">evidence: request ID, stores, counts</text><text class="sub" x="178" y="346" text-anchor="middle">(no personal data in the record)</text></g><text class="sm" x="28" y="392">Missing ack after the deadline → retry, then alert. The reply to the person is due within one month.</text>
</svg>
