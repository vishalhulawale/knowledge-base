<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Where a good failure story sits</title>
  <desc id="d">A map with stakes on the horizontal axis, from trivial to disqualifying, and ownership on the vertical axis, from someone else's decision to my own decision. The bottom band, someone else's decision, is blame risk. The left column, trivial, gives no signal. The right column, integrity, ethics or security negligence, is disqualifying. The good zone is in the middle top: real stakes and my own decision. The page's examples are placed on it: "the client kept changing requirements and QA was slow" sits in the blame band; "I accidentally deleted the production database" sits at the disqualifying edge with no recovery or lesson; "I committed a date before spiking the upstream integration and we slipped" sits in the good zone. A note says even the good zone needs a lesson and evidence of change.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .sub{fill:#64748b;font-size:13px}
    .zg{fill:#dcfce7;stroke:#16a34a}
    .zr{fill:#fee2e2}
    .zn{fill:#f1f5f9}
    .zl{font-size:13px;font-weight:700}
    .lg{fill:#15803d}.lr{fill:#b91c1c}.ln{fill:#475569}
    .ax{fill:#334155;font-size:13px;font-weight:600}
    .axl{stroke:#64748b;stroke-width:2}
    .ah{fill:#64748b}
    .pt{fill:#4f46e5}
    .pb{fill:#ffffff;stroke:#cbd5e1}
    .pl{fill:#0f172a;font-size:13px}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.sub{fill:#94a3b8}
      .zg{fill:#14532d;stroke:#4ade80}.zr{fill:#450a0a}.zn{fill:#273042}
      .lg{fill:#4ade80}.lr{fill:#fca5a5}.ln{fill:#cbd5e1}
      .ax{fill:#e2e8f0}.axl{stroke:#94a3b8}.ah{fill:#94a3b8}
      .pt{fill:#818cf8}.pb{fill:#111827;stroke:#475569}.pl{fill:#f1f5f9}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">Pick a failure from the green zone</text>
  <text class="sub" x="28" y="62">Your decision, real stakes, not disqualifying. Then add the lesson and evidence that you changed.</text>

  <!-- zones: plot x 120..760, y 84..344 -->
  <rect class="zn" x="120" y="84" width="150" height="196"/>
  <rect class="zg" x="270" y="84" width="330" height="196"/>
  <rect class="zr" x="600" y="84" width="160" height="196"/>
  <rect class="zr" x="120" y="280" width="640" height="64"/>
  <text class="zl ln" x="132" y="104">Trivial:</text><text class="zl ln" x="132" y="121">no signal</text>
  <text class="zl lg" x="284" y="104">Good story zone</text>
  <text class="zl lr" x="612" y="104">Disqualifying:</text><text class="zl lr" x="612" y="121">integrity, ethics,</text><text class="zl lr" x="612" y="138">security negligence</text>
  <text class="zl lr" x="132" y="300">Someone else's decision: blame risk</text>

  <!-- axes -->
  <line class="axl" x1="120" y1="344" x2="752" y2="344"/><path class="ah" d="M764 344 l-12 -6 v12 z"/>
  <line class="axl" x1="120" y1="344" x2="120" y2="92"/><path class="ah" d="M120 80 l-6 12 h12 z"/>
  <text class="ax" x="440" y="366" text-anchor="middle">Stakes and impact →</text>
  <text class="ax" x="28" y="160">My own</text><text class="ax" x="28" y="177">decision</text>
  <text class="ax" x="28" y="300">Others'</text><text class="ax" x="28" y="317">decision</text>

  <!-- examples from the page -->
  <circle class="pt" cx="420" cy="180" r="8"/>
  <rect class="pb" x="290" y="196" width="296" height="60" rx="8"/>
  <text class="pl" x="300" y="216">"Committed a date before spiking the</text>
  <text class="pl" x="300" y="233">upstream integration; we slipped and</text>
  <text class="pl" x="300" y="250">I re-planned with options."</text>

  <circle class="pt" cx="604" cy="170" r="8"/>
  <rect class="pb" x="612" y="152" width="140" height="78" rx="8"/>
  <text class="pl" x="620" y="171">"Deleted the</text>
  <text class="pl" x="620" y="188">production DB"</text>
  <text class="pl" x="620" y="207">no recovery,</text>
  <text class="pl" x="620" y="223">no lesson</text>

  <circle class="pt" cx="420" cy="322" r="8"/>
  <text class="pl" x="434" y="327">"The client kept changing requirements"</text>

  <text class="sub" x="28" y="396">Examples from the page's answers. "I've never really failed" isn't on the map: there is no story.</text>
</svg>
