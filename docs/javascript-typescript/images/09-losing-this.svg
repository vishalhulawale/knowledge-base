<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Losing this</title>
  <desc id="d">An object member has a greet method that reads this.name. Called as member.greet, this is member and it returns Hi Asha. Extracting the method into a variable and calling it plainly, loses the receiver: in strict mode this is undefined and reading name throws a TypeError. Passing it to setTimeout calls it with this set to window in browsers or a Timeout object in Node, so it silently greets the wrong name. Binding it with member.greet.bind(member), or wrapping it in an arrow function that calls member.greet, keeps this as member.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">member.greet() reads this.name</text>
  <text class="sub" x="28" y="62">this is decided at the call site, not where the function was written.</text>
  <text class="sm" x="28" y="104">call site</text>
  <text class="sm" x="420" y="104">this</text>
  <text class="sm" x="640" y="104">result</text>
  <rect class="bo" x="28" y="116" width="744" height="38" rx="8" stroke-width="1.2"/>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;white-space:pre;font-size:13px" x="40" y="140">member.greet()</text>
  <text class="sm" x="420" y="140">this = member</text>
  <text class="tx okt" x="640" y="140" font-weight="700">&quot;Hi Asha&quot;</text>
  <rect class="bb" x="28" y="162" width="744" height="38" rx="8" stroke-width="1.2"/>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;white-space:pre;font-size:13px" x="40" y="186">const g = member.greet; g()</text>
  <text class="sm" x="420" y="186">this = undefined (strict)</text>
  <text class="tx badt" x="640" y="186" font-weight="700">TypeError</text>
  <rect class="bb" x="28" y="208" width="744" height="38" rx="8" stroke-width="1.2"/>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;white-space:pre;font-size:13px" x="40" y="232">setTimeout(member.greet, 0)</text>
  <text class="sm" x="420" y="232">this = window / Timeout</text>
  <text class="tx badt" x="640" y="232" font-weight="700">&quot;Hi &quot; (wrong)</text>
  <rect class="bo" x="28" y="254" width="744" height="38" rx="8" stroke-width="1.2"/>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;white-space:pre;font-size:13px" x="40" y="278">setTimeout(member.greet.bind(member))</text>
  <text class="sm" x="420" y="278">bound: this = member</text>
  <text class="tx okt" x="640" y="278" font-weight="700">&quot;Hi Asha&quot;</text>
  <rect class="bo" x="28" y="300" width="744" height="38" rx="8" stroke-width="1.2"/>
  <text class="tx" style="font-family:'JetBrains Mono',ui-monospace,monospace;white-space:pre;font-size:13px" x="40" y="324">setTimeout(() =&gt; member.greet())</text>
  <text class="sm" x="420" y="324">called as member.greet()</text>
  <text class="tx okt" x="640" y="324" font-weight="700">&quot;Hi Asha&quot;</text>
  <text class="sub" x="28" y="372">Same trap with React class handlers and event listeners: bind in the constructor or use arrow fields.</text>
</svg>
