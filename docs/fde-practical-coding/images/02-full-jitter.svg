  <text class="h" x="28" y="40">Why backoff needs jitter</text><text class="sub" x="28" y="62">20 clients hit a 503 at t = 0 and keep failing. Retry requests per 0.25 s; simulated.</text><text class="lbl" x="28" y="88">No jitter: base × 2ⁿ</text><line class="ln" x1="90" y1="200" x2="730" y2="200"/><line class="lnw dash" x1="90" y1="170" x2="730" y2="170"/><text class="wrnt" x="736" y="174" style="font-size:12px">server</text><text class="wrnt" x="736" y="188" style="font-size:12px">capacity</text><g class="k b2"><rect class="badf" x="132" y="100" width="16" height="100" rx="2"/></g><g class="k b6"><rect class="badf" x="212" y="100" width="16" height="100" rx="2"/></g><g class="k b14"><rect class="badf" x="372" y="100" width="16" height="100" rx="2"/></g><g class="k b30"><rect class="badf" x="692" y="100" width="16" height="100" rx="2"/></g><text class="sub" x="90" y="218" text-anchor="middle">0s</text><text class="sub" x="250" y="218" text-anchor="middle">2s</text><text class="sub" x="410" y="218" text-anchor="middle">4s</text><text class="sub" x="570" y="218" text-anchor="middle">6s</text><text class="sub" x="730" y="218" text-anchor="middle">8s</text><text class="badt" x="28" y="196" style="font-size:13px">peak 20</text><text class="lbl" x="28" y="248">Full jitter: random(0, base × 2ⁿ)</text><line class="ln" x1="90" y1="360" x2="730" y2="360"/><line class="lnw dash" x1="90" y1="330" x2="730" y2="330"/><text class="wrnt" x="736" y="334" style="font-size:12px">server</text><text class="wrnt" x="736" y="348" style="font-size:12px">capacity</text><g class="k b0"><rect class="tea" x="92" y="300" width="16" height="60" rx="2"/></g><g class="k b1"><rect class="tea" x="112" y="295" width="16" height="65" rx="2"/></g><g class="k b2"><rect class="tea" x="132" y="310" width="16" height="50" rx="2"/></g><g class="k b3"><rect class="tea" x="152" y="320" width="16" height="40" rx="2"/></g><g class="k b4"><rect class="tea" x="172" y="350" width="16" height="10" rx="2"/></g><g class="k b5"><rect class="tea" x="192" y="330" width="16" height="30" rx="2"/></g><g class="k b6"><rect class="tea" x="212" y="350" width="16" height="10" rx="2"/></g><g class="k b7"><rect class="tea" x="232" y="350" width="16" height="10" rx="2"/></g><g class="k b8"><rect class="tea" x="252" y="340" width="16" height="20" rx="2"/></g><g class="k b9"><rect class="tea" x="272" y="345" width="16" height="15" rx="2"/></g><g class="k b10"><rect class="tea" x="292" y="355" width="16" height="5" rx="2"/></g><g class="k b11"><rect class="tea" x="312" y="345" width="16" height="15" rx="2"/></g><g class="k b12"><rect class="tea" x="332" y="350" width="16" height="10" rx="2"/></g><g class="k b13"><rect class="tea" x="352" y="350" width="16" height="10" rx="2"/></g><g class="k b14"><rect class="tea" x="372" y="355" width="16" height="5" rx="2"/></g><g class="k b15"><rect class="tea" x="392" y="355" width="16" height="5" rx="2"/></g><g class="k b16"><rect class="tea" x="412" y="345" width="16" height="15" rx="2"/></g><g class="k b18"><rect class="tea" x="452" y="350" width="16" height="10" rx="2"/></g><g class="k b19"><rect class="tea" x="472" y="355" width="16" height="5" rx="2"/></g><g class="k b20"><rect class="tea" x="492" y="355" width="16" height="5" rx="2"/></g><g class="k b24"><rect class="tea" x="572" y="355" width="16" height="5" rx="2"/></g><text class="sub" x="90" y="378" text-anchor="middle">0s</text><text class="sub" x="250" y="378" text-anchor="middle">2s</text><text class="sub" x="410" y="378" text-anchor="middle">4s</text><text class="sub" x="570" y="378" text-anchor="middle">6s</text><text class="sub" x="730" y="378" text-anchor="middle">8s</text><text class="teat" x="28" y="356" style="font-size:13px">peak 13</text><text class="sm" x="28" y="400">Without jitter every client retries at 0.5 s, 1.5 s, 3.5 s and 7.5 s: four synchronised waves that</text><text class="sm" x="28" y="418">knock the recovering server over again. Full jitter spreads the same retries out (AWS Architecture Blog).</text>
