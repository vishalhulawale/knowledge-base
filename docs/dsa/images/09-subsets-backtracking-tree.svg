  <text class="m" x="69" y="236" text-anchor="end">+2</text>
  <line class="ln smut" x1="100" y1="206" x2="160" y2="258"/>
  <text class="m" x="136" y="236" text-anchor="start">+3</text>
  <line class="ln smut" x1="280" y1="206" x2="280" y2="258"/>
  <text class="m" x="286" y="236" text-anchor="start">+3</text>
  <line class="ln smut" x1="50" y1="286" x2="50" y2="338"/>
  <text class="m" x="56" y="316" text-anchor="start">+3</text>
  <rect class="box" x="212" y="97" width="76" height="30" rx="15"/>
  <text class="t" x="250" y="117" text-anchor="middle">[]</text>
  <rect class="box" x="62" y="177" width="76" height="30" rx="15"/>
  <text class="t" x="100" y="197" text-anchor="middle">[1]</text>
  <rect class="box" x="242" y="177" width="76" height="30" rx="15"/>
  <text class="t" x="280" y="197" text-anchor="middle">[2]</text>
  <rect class="box" x="382" y="177" width="76" height="30" rx="15"/>
  <text class="t" x="420" y="197" text-anchor="middle">[3]</text>
  <rect class="box" x="12" y="257" width="76" height="30" rx="15"/>
  <text class="t" x="50" y="277" text-anchor="middle">[1,2]</text>
