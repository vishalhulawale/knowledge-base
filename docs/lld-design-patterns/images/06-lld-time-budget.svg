<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Time budget for a 45-minute LLD round</title>
  <desc id="d">A 45-minute low-level design round split into steps. Design takes the first 20 minutes: clarify requirements 5, entities and responsibilities 5, class diagram and patterns 5, APIs 3, state and concurrency 2. Coding the core path takes 15 minutes. The last 10 minutes go to tests and a walkthrough, 5, and the interviewer&#x27;s extension twist, 5. Design is about a third to a half of the time; code starts no later than minute 20.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="328" rx="14"/>
  <text class="h" x="28" y="40">A 45-minute LLD round</text>
  <text class="sub" x="28" y="62">Rough budget. Code starts by minute 20 so there&#x27;s time to run it and handle the twist.</text>
  <rect class="pri" x="29" y="120" width="80.6667" height="50" rx="6"/>
  <text class="on" x="69.3333" y="149.5" text-anchor="middle">5′</text>
  <text class="sm" x="69.3333" y="196" text-anchor="middle">Clarify</text>
  <rect class="pri" x="111.667" y="120" width="80.6667" height="50" rx="6"/>
  <text class="on" x="152" y="149.5" text-anchor="middle">5′</text>
  <text class="sm" x="152" y="196" text-anchor="middle">Entities</text>
  <rect class="pri" x="194.333" y="120" width="80.6667" height="50" rx="6"/>
  <text class="on" x="234.667" y="149.5" text-anchor="middle">5′</text>
  <text class="sm" x="234.667" y="196" text-anchor="middle">Classes</text>
  <rect class="pri" x="277" y="120" width="47.6" height="50" rx="6"/>
  <text class="on" x="300.8" y="149.5" text-anchor="middle">3′</text>
  <text class="sm" x="300.8" y="214" text-anchor="middle">APIs</text>
  <rect class="pri" x="326.6" y="120" width="31.0667" height="50" rx="6"/>
  <text class="on" x="342.133" y="149.5" text-anchor="middle">2′</text>
  <text class="sm" x="342.133" y="196" text-anchor="middle">State</text>
  <rect class="tea" x="359.667" y="120" width="246" height="50" rx="6"/>
  <text class="on" x="482.667" y="149.5" text-anchor="middle">15′</text>
  <text class="sm" x="482.667" y="196" text-anchor="middle">Code the core path</text>
  <rect class="wrnf" x="607.667" y="120" width="80.6667" height="50" rx="6"/>
  <text class="on" x="648" y="149.5" text-anchor="middle">5′</text>
  <text class="sm" x="648" y="196" text-anchor="middle">Tests</text>
  <rect class="wrnf" x="690.333" y="120" width="80.6667" height="50" rx="6"/>
  <text class="on" x="730.667" y="149.5" text-anchor="middle">5′</text>
  <text class="sm" x="730.667" y="196" text-anchor="middle">Twist</text>
  <line class="ln" x1="28.0" y1="112" x2="28.0" y2="178"/>
  <text class="sm" x="28" y="106" text-anchor="middle">0′</text>
  <line class="ln" x1="358.7" y1="112" x2="358.7" y2="178"/>
  <text class="sm" x="358.667" y="106" text-anchor="middle">20′</text>
  <line class="ln" x1="606.7" y1="112" x2="606.7" y2="178"/>
  <text class="sm" x="606.667" y="106" text-anchor="middle">35′</text>
  <line class="ln" x1="772.0" y1="112" x2="772.0" y2="178"/>
  <text class="sm" x="772" y="106" text-anchor="middle">45′</text>
  <text class="lbl prit" x="28" y="250">Design (20 min)</text>
  <text class="lbl teat" x="358.667" y="250">Code (15 min)</text>
  <text class="lbl wrnt" x="606.667" y="250">Prove it (10 min)</text>
  <text class="tx" x="28" y="284">Most failed rounds run out of time in design, or start coding before the entities are agreed.</text>
  <text class="sub" x="28" y="306">Say the plan out loud at minute 0, and check the clock at 20 and 35.</text>
</svg>
