<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">AWS KMS authorisation: three Decrypt requests</title>
  <desc id="d">Three Decrypt requests pass through the same checks in order: the key policy, the caller&#x27;s IAM policy when the key policy delegates to the account, and conditions such as the encryption context. Request A, role claims-api with context tenant acme, passes all three and is allowed; CloudTrail records it. Request B, an account administrator who is a key administrator but not a key user, fails at the key policy. Request C, claims-api with context tenant evil, passes the policies but fails the encryption-context condition. Every outcome is logged.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:16s infinite linear}
    @keyframes l0{0%{opacity:0}1%{opacity:0}2%,32%{opacity:1}33%{opacity:0}100%{opacity:0}}
    .l0{animation-name:l0}
    @keyframes c00{0%{opacity:0}5%{opacity:0}6%,32%{opacity:1}33%{opacity:0}100%{opacity:0}}
    .c00{animation-name:c00}
    @keyframes c01{0%{opacity:0}10%{opacity:0}11%,32%{opacity:1}33%{opacity:0}100%{opacity:0}}
    .c01{animation-name:c01}
    @keyframes c02{0%{opacity:0}15%{opacity:0}16%,32%{opacity:1}33%{opacity:0}100%{opacity:0}}
    .c02{animation-name:c02}
    @keyframes c03{0%{opacity:0}20%{opacity:0}21%,32%{opacity:1}33%{opacity:0}100%{opacity:0}}
    .c03{animation-name:c03}
    @keyframes z0{0%{opacity:0}25%{opacity:0}26%,32%{opacity:1}33%{opacity:0}100%{opacity:0}}
    .z0{animation-name:z0}
    @keyframes l1{0%{opacity:0}33%{opacity:0}34%,64%{opacity:1}65%{opacity:0}100%{opacity:0}}
    .l1{animation-name:l1}
    @keyframes c10{0%{opacity:0}37%{opacity:0}38%,64%{opacity:1}65%{opacity:0}100%{opacity:0}}
    .c10{animation-name:c10}
    @keyframes z1{0%{opacity:0}42%{opacity:0}43%,64%{opacity:1}65%{opacity:0}100%{opacity:0}}
    .z1{animation-name:z1}
    @keyframes l2{0%{opacity:0}65%{opacity:0}66%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .l2{animation-name:l2}
    @keyframes c20{0%{opacity:0}69%{opacity:0}70%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .c20{animation-name:c20}
    @keyframes c21{0%{opacity:0}74%{opacity:0}75%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .c21{animation-name:c21}
    @keyframes c22{0%{opacity:0}79%{opacity:0}80%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .c22{animation-name:c22}
    @keyframes z2{0%{opacity:0}84%{opacity:0}85%,96%{opacity:1}97%{opacity:0}100%{opacity:0}}
    .z2{animation-name:z2}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .l1,.l2,.c10,.c20,.c21,.c22,.z1,.z2{opacity:0!important}
    }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">Decrypt(wrappedDek, context)</text>
  <text class="sub" x="28" y="62">Checks run in order; any deny wins. Every call, allowed or not, lands in CloudTrail.</text>
  <rect class="bm" x="180" y="110" width="136" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="248" y="137" text-anchor="middle" font-weight="700">key policy</text>
  <rect class="bm" x="330" y="110" width="136" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="398" y="137" text-anchor="middle" font-weight="700">IAM policy</text>
  <rect class="bm" x="480" y="110" width="136" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="548" y="137" text-anchor="middle" font-weight="700">conditions</text>
  <rect class="bo" x="630" y="110" width="136" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="698" y="137" text-anchor="middle" font-weight="700">allow → HSM</text>
  <line class="ln" x1="316" y1="132" x2="328" y2="132" marker-end="url(#ar)"/>
  <line class="ln" x1="466" y1="132" x2="478" y2="132" marker-end="url(#ar)"/>
  <line class="ln" x1="616" y1="132" x2="628" y2="132" marker-end="url(#ar)"/>
  <text class="lbl a l0" x="28" y="214">A  claims-api, tenant=acme</text>
  <g class="a c00">
  <rect class="okf" x="180" y="168" width="136" height="28" rx="6"/>
  <text class="on13" x="248" y="186.5" text-anchor="middle">pass ✓</text>
  </g>
  <g class="a c01">
  <rect class="okf" x="330" y="168" width="136" height="28" rx="6"/>
  <text class="on13" x="398" y="186.5" text-anchor="middle">pass ✓</text>
  </g>
  <g class="a c02">
  <rect class="okf" x="480" y="168" width="136" height="28" rx="6"/>
  <text class="on13" x="548" y="186.5" text-anchor="middle">pass ✓</text>
  </g>
  <g class="a c03">
  <rect class="okf" x="630" y="168" width="136" height="28" rx="6"/>
  <text class="on13" x="698" y="186.5" text-anchor="middle">pass ✓</text>
  </g>
  <text class="tx okt a z0" x="28" y="248">Allowed: the HSM unwraps the DEK</text>
  <text class="lbl a l1" x="28" y="214">B  admin (key admin only)</text>
  <g class="a c10">
  <rect class="badf" x="180" y="168" width="136" height="28" rx="6"/>
  <text class="on13" x="248" y="186.5" text-anchor="middle">DENY ✕</text>
  </g>
  <text class="tx badt a z1" x="28" y="248">Denied: key admins manage the key but can&#x27;t use it</text>
  <text class="lbl a l2" x="28" y="214">C  claims-api, tenant=evil</text>
  <g class="a c20">
  <rect class="okf" x="180" y="168" width="136" height="28" rx="6"/>
  <text class="on13" x="248" y="186.5" text-anchor="middle">pass ✓</text>
  </g>
  <g class="a c21">
  <rect class="okf" x="330" y="168" width="136" height="28" rx="6"/>
  <text class="on13" x="398" y="186.5" text-anchor="middle">pass ✓</text>
  </g>
  <g class="a c22">
  <rect class="badf" x="480" y="168" width="136" height="28" rx="6"/>
  <text class="on13" x="548" y="186.5" text-anchor="middle">DENY ✕</text>
  </g>
  <text class="tx badt a z2" x="28" y="248">Denied: context doesn&#x27;t match kms:EncryptionContext:tenant</text>
  <text class="tx" x="28" y="300">Without a key policy statement (or delegation to the account root), even administrators can&#x27;t use a key.</text>
  <text class="sub" x="28" y="324">Grants add scoped, revocable delegation; SCPs and permission boundaries can still deny on top.</text>
  <text class="sub" x="28" y="344">Separate key administrators (manage, not use) from key users (use, not manage).</text>
</svg>
