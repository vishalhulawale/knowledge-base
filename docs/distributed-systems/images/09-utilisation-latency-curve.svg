<rect class="card" x="1" y="1" width="798" height="398" rx="14"/>

<text class="h" x="28" y="40">Why latency explodes near full utilisation</text>
<text class="sub" x="28" y="62">Queueing wait grows as ρ/(1−ρ): gentle at 50%, steep past 80%, unbounded at 100%.</text>
<rect class="zg" x="305.0" y="100" width="86.0" height="220"/>
<text class="sm tg b" x="348.0" y="116" text-anchor="middle">typical</text><text class="sm tg b" x="348.0" y="132" text-anchor="middle">target</text>
<line x1="90.0" y1="320" x2="90.0" y2="326" class="smu"/><text class="sub" x="90.0" y="342" text-anchor="middle">0%</text><line x1="197.5" y1="320" x2="197.5" y2="326" class="smu"/><text class="sub" x="197.5" y="342" text-anchor="middle">25%</text><line x1="305.0" y1="320" x2="305.0" y2="326" class="smu"/><text class="sub" x="305.0" y="342" text-anchor="middle">50%</text><line x1="412.5" y1="320" x2="412.5" y2="326" class="smu"/><text class="sub" x="412.5" y="342" text-anchor="middle">75%</text><line x1="520.0" y1="320" x2="520.0" y2="326" class="smu"/><text class="sub" x="520.0" y="342" text-anchor="middle">100%</text><line x1="84" y1="320.0" x2="90" y2="320.0" class="smu"/><text class="sub" x="80" y="324.0" text-anchor="end">0×</text><line x1="84" y1="265.0" x2="90" y2="265.0" class="smu"/><text class="sub" x="80" y="269.0" text-anchor="end">5×</text><line x1="90" y1="265.0" x2="520" y2="265.0" class="sax" stroke-dasharray="2 4"/><line x1="84" y1="210.0" x2="90" y2="210.0" class="smu"/><text class="sub" x="80" y="214.0" text-anchor="end">10×</text><line x1="90" y1="210.0" x2="520" y2="210.0" class="sax" stroke-dasharray="2 4"/><line x1="84" y1="155.0" x2="90" y2="155.0" class="smu"/><text class="sub" x="80" y="159.0" text-anchor="end">15×</text><line x1="90" y1="155.0" x2="520" y2="155.0" class="sax" stroke-dasharray="2 4"/><line x1="84" y1="100.0" x2="90" y2="100.0" class="smu"/><text class="sub" x="80" y="104.0" text-anchor="end">20×</text><line x1="90" y1="100.0" x2="520" y2="100.0" class="sax" stroke-dasharray="2 4"/>
<line x1="90" y1="96" x2="90" y2="320" class="smu" stroke-width="1.5"/>
<line x1="90" y1="320" x2="530" y2="320" class="smu" stroke-width="1.5"/>
<line x1="520" y1="96" x2="520" y2="320" class="sr" stroke-width="2" stroke-dasharray="6 4"/>
<text class="sm tr b" x="528" y="112">100%: queue</text><text class="sm tr b" x="528" y="128">grows forever</text>
