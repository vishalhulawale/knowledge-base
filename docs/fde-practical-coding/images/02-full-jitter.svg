<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 444" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Backoff with and without jitter</title>
  <desc id="d">Animation: two histograms of retry requests per quarter second fill from left to right over eight seconds. Twenty clients hit a 503 at time zero and keep failing. Without jitter they all retry at 0.5, 1.5, 3.5 and 7.5 seconds, making four spikes of 20 requests that exceed the server's capacity line. With full jitter, each wait is random between zero and the capped exponential, so the same retries spread out with a peak of 13. Simulated data.</desc>
