<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Indirect prompt injection and the lethal trifecta</title>
  <desc id="d">Two rows show the same agent request, "Summarise ticket #42". In the top row the agent has the same tool set for every request. read_ticket returns text written by an attacker that is hidden in the ticket and tells the agent to look up all members in a zip code and email them to an outside address. The agent calls search_members, which returns member health data, and then send_email to the attacker's address, so private data leaves the organisation although nobody typed a malicious prompt. The three legs are labelled: untrusted content from read_ticket, private data from search_members, and external communication from send_email. In the bottom row the route that summarises tickets has no send_email tool, or any write needs human approval, so the injected instruction still reaches the model but has no way out: the summary may be wrong but no data leaks. Simplified illustration of the pattern behind the 2025 GitHub MCP disclosure; names and data are made up.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:12px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }
    .a{opacity:0;animation:16s infinite linear}
    @keyframes k1{0%,12%{opacity:0}13.5%,44%{opacity:1}45.5%,100%{opacity:0}} .k1{animation-name:k1}
    @keyframes k2{0%,56%{opacity:0}57.5%,92%{opacity:1}93.5%,100%{opacity:0}} .k2{animation-name:k2}
    @keyframes k3{0%,2%{opacity:0}3.5%,46%{opacity:1}47.5%,100%{opacity:0}} .k3{animation-name:k3}
    @keyframes k4{0%,8%{opacity:0}9.5%,46%{opacity:1}47.5%,100%{opacity:0}} .k4{animation-name:k4}
    @keyframes k5{0%,18%{opacity:0}19.5%,46%{opacity:1}47.5%,100%{opacity:0}} .k5{animation-name:k5}
    @keyframes k6{0%,28%{opacity:0}29.5%,46%{opacity:1}47.5%,100%{opacity:0}} .k6{animation-name:k6}
    @keyframes k7{0%,34%{opacity:0}35.5%,46%{opacity:1}47.5%,100%{opacity:0}} .k7{animation-name:k7}
    @keyframes k8{0%,50%{opacity:0}51.5%,94%{opacity:1}95.5%,100%{opacity:0}} .k8{animation-name:k8}
    @keyframes k9{0%,54%{opacity:0}55.5%,94%{opacity:1}95.5%,100%{opacity:0}} .k9{animation-name:k9}
    @keyframes k10{0%,62%{opacity:0}63.5%,94%{opacity:1}95.5%,100%{opacity:0}} .k10{animation-name:k10}
    @keyframes k11{0%,70%{opacity:0}71.5%,94%{opacity:1}95.5%,100%{opacity:0}} .k11{animation-name:k11}
