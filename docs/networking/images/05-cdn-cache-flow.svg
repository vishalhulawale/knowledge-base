  <g class="ph" style="animation-name:p0"><rect class="wrnf" x="228" y="158" width="50" height="22" rx="11"/><text class="on" x="253.0" y="173.5" text-anchor="middle" font-size="12">MISS</text><rect class="wrnf" x="448" y="221" width="50" height="22" rx="11"/><text class="on" x="473.0" y="236.5" text-anchor="middle" font-size="12">MISS</text><rect class="okf" x="658" y="221" width="66" height="22" rx="11"/><text class="on" x="691.0" y="236.5" text-anchor="middle" font-size="12">200 OK</text><text class="lbl" x="28" y="352">1. Cold cache: edge and shield miss, one request goes to the origin; both cache the reply.</text></g>
  <g class="ph" style="animation-name:p1"><rect class="wrnf" x="228" y="284" width="50" height="22" rx="11"/><text class="on" x="253.0" y="299.5" text-anchor="middle" font-size="12">MISS</text><rect class="okf" x="448" y="221" width="42" height="22" rx="11"/><text class="on" x="469.0" y="236.5" text-anchor="middle" font-size="12">HIT</text><text class="sub" x="650" y="236">not contacted</text><text class="lbl" x="28" y="352">2. Delhi edge misses, but the shield already has it: the origin is spared.</text></g>
  <g class="ph" style="animation-name:p2"><rect class="okf" x="228" y="158" width="42" height="22" rx="11"/><text class="on" x="249.0" y="173.5" text-anchor="middle" font-size="12">HIT</text><text class="sub" x="440" y="236">not contacted</text><text class="sub" x="650" y="236">not contacted</text><text class="lbl" x="28" y="352">3. Later Mumbai users hit the edge: milliseconds, zero load behind the edge.</text></g>
  <g class="ph" style="animation-name:p3"><rect class="wrnf" x="228" y="158" width="58" height="22" rx="11"/><text class="on" x="257.0" y="173.5" text-anchor="middle" font-size="12">STALE</text><rect class="okf" x="658" y="221" width="42" height="22" rx="11"/><text class="on" x="679.0" y="236.5" text-anchor="middle" font-size="12">304</text><text class="lbl" x="28" y="352">4. max-age expired: edge serves the stale copy now, revalidates in the background (304).</text></g>
  <text class="sub" x="28" y="384">Request collapsing: concurrent misses for the same object wait for one fetch instead of each going to the origin.</text>
  <text class="sub" x="28" y="404">Versioned file names (app.3f9a.js) avoid purges: a new build is simply a new cache key.</text>
