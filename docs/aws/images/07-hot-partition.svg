<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Hot partition with a low-cardinality key versus even spread with a high-cardinality key</title>
  <desc id="d">Two bar charts with the same total write load of 2,100 WCU spread over three partitions, each limited to 1,000 WCU. With the partition key set to status, the PENDING partition receives 1,800 WCU: 1,000 are served and 800 are throttled, while the SHIPPED and CANCELLED partitions sit nearly idle at 200 and 100 WCU. With the partition key set to orderId, each partition receives about 700 WCU and nothing is throttled.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .txt{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .base{stroke:#94a3b8;stroke-width:1.5}
    .bar{fill:#4f46e5}
    .ok{fill:#16a34a}
    .thr{fill:#dc2626;fill-opacity:.25;stroke:#dc2626;stroke-width:2;stroke-dasharray:5 4}
    .lim{stroke:#dc2626;stroke-width:2;stroke-dasharray:7 5}
    .limt{fill:#dc2626;font-size:13px;font-weight:700}
    .val{fill:#0f172a;font-size:14px;font-weight:700}
    .badt{fill:#dc2626;font-size:15px;font-weight:700}
    .okt{fill:#16a34a;font-size:15px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.val{fill:#f1f5f9}.lbl,.txt{fill:#e2e8f0}.sub{fill:#94a3b8}
      .base{stroke:#64748b}.bar{fill:#818cf8}.ok{fill:#4ade80}
      .thr{fill:#f87171;stroke:#f87171}.lim{stroke:#f87171}.limt,.badt{fill:#f87171}.okt{fill:#4ade80}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">Same 2,100 WCU, different partition keys</text>
  <text class="sub" x="28" y="62">Each partition serves at most 1,000 WCU, whatever capacity the table as a whole has.</text>

  <text class="lbl" x="28" y="98">✗ PK = status</text>
  <text class="badt" x="28" y="120">Hot partition: writes throttle</text>
  <line class="base" x1="28" y1="340" x2="368" y2="340"/>
  <line class="lim" x1="28" y1="240" x2="368" y2="240"/>
  <text class="limt" x="368" y="234" text-anchor="end">1,000 WCU limit</text>
  <rect class="bar" x="52" y="320" width="70" height="20" rx="3"/>
  <text class="val" x="87.0" y="312" text-anchor="middle">200</text>
  <text class="txt" x="87.0" y="360" text-anchor="middle">SHIPPED</text>
  <text class="sub" x="87.0" y="377" text-anchor="middle">1 key</text>
  <rect class="bar" x="162" y="240" width="70" height="100" rx="3"/>
  <rect class="thr" x="162" y="160" width="70" height="80" rx="3"/>
  <text class="badt" x="240" y="205">800 throttled</text>
  <text class="val" x="197.0" y="152" text-anchor="middle">1,800</text>
  <text class="txt" x="197.0" y="360" text-anchor="middle">PENDING</text>
  <text class="sub" x="197.0" y="377" text-anchor="middle">1 key</text>
  <rect class="bar" x="272" y="330" width="70" height="10" rx="3"/>
  <text class="val" x="307.0" y="322" text-anchor="middle">100</text>
  <text class="txt" x="307.0" y="360" text-anchor="middle">CANCELLED</text>
  <text class="sub" x="307.0" y="377" text-anchor="middle">1 key</text>
  <text class="lbl" x="420" y="98">✓ PK = orderId</text>
  <text class="okt" x="420" y="120">Spread evenly: no throttling</text>
  <line class="base" x1="420" y1="340" x2="760" y2="340"/>
  <line class="lim" x1="420" y1="240" x2="760" y2="240"/>
  <text class="limt" x="760" y="234" text-anchor="end">1,000 WCU limit</text>
  <rect class="ok" x="444" y="270" width="70" height="70" rx="3"/>
  <text class="val" x="479.0" y="262" text-anchor="middle">700</text>
  <text class="txt" x="479.0" y="360" text-anchor="middle">P1</text>
  <text class="sub" x="479.0" y="377" text-anchor="middle">many keys</text>
  <rect class="ok" x="554" y="270" width="70" height="70" rx="3"/>
  <text class="val" x="589.0" y="262" text-anchor="middle">700</text>
  <text class="txt" x="589.0" y="360" text-anchor="middle">P2</text>
  <text class="sub" x="589.0" y="377" text-anchor="middle">many keys</text>
  <rect class="ok" x="664" y="270" width="70" height="70" rx="3"/>
  <text class="val" x="699.0" y="262" text-anchor="middle">700</text>
  <text class="txt" x="699.0" y="360" text-anchor="middle">P3</text>
  <text class="sub" x="699.0" y="377" text-anchor="middle">many keys</text>
  <text class="sub" x="28" y="404">Illustrative numbers. One key needing over 1,000 WCU needs write sharding (PENDING#0..N), not more capacity.</text>
</svg>
