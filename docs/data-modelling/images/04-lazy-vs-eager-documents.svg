="17" height="24" rx="3"/><rect class="tea" x="680" y="248" width="17" height="24" rx="3"/><rect class="tea" x="701" y="248" width="17" height="24" rx="3"/><rect class="tea" x="722" y="248" width="17" height="24" rx="3"/><rect class="tea" x="743" y="248" width="17" height="24" rx="3"/><text class="okt" x="764" y="288" text-anchor="end" style="font-size:12px">0 of 12 still v1</text><text class="sm" x="424" y="324">Job rewrites v1 in batches</text><text class="sm" x="424" y="344">Readers still handle both meanwhile</text><text class="sm" x="424" y="364">v1 count hits zero: delete v1 code</text><text class="sm" x="28" y="436">Use lazy when old data is rarely read; add the sweep when you need to delete the old reader branch.</text>
