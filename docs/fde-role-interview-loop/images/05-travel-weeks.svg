<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 306" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Travel percentages as weeks</title>
  <desc id="d">Two rows of 52 squares, one per week of a year. In the first row, 25 percent travel, every fourth week is filled: about 13 weeks at the customer site. In the second row, 50 percent travel, two weeks on and two weeks off: about 26 weeks away. Postings commonly state 25 to 50 percent travel and some Palantir strategist roles 25 to 75 percent; settle the details in the first call.</desc>
