<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Contexts to services</title>
  <desc id="d">Animation in four steps. Three dashed bounded contexts appear: Intake, Fulfilment and Claims. Aggregates appear inside them: Prescription and Verification; DispenseOrder and Shipment; Claim and Eligibility. Service boundaries are drawn: Intake becomes one intake service; Fulfilment is split into a dispensing service and a shipping service because scaling and the carrier API differ; Claims stays one small service to limit PHI scope. Finally a red box rejects a refill service cut out of the Prescription aggregate, because the refills-authorised invariant would then span two services. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes c1{0%,96.99%{opacity:1}97%,100%{opacity:0}}.c1{animation-name:c1}
    @keyframes c2{0%,19.99%{opacity:0}20%,96.99%{opacity:1}97%,100%{opacity:0}}.c2{animation-name:c2}
    @keyframes c3{0%,41.99%{opacity:0}42%,96.99%{opacity:1}97%,100%{opacity:0}}.c3{animation-name:c3}
    @keyframes c4{0%,67.99%{opacity:0}68%,96.99%{opacity:1}97%,100%{opacity:0}}.c4{animation-name:c4}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="402" rx="14"/>
  <text class="h" x="28" y="40">From bounded contexts to services</text><text class="sub" x="28" y="62">Online pharmacy, illustrative. Context = upper bound, aggregate = lower bound.</text><g class="k c1"><rect class="lnp dash" x="28" y="86" width="232" height="196" rx="12" fill="none"/><text class="prit" x="42" y="110" style="font-size:14px">Intake context</text><rect class="lnt dash" x="282" y="86" width="254" height="196" rx="12" fill="none"/><text class="teat" x="296" y="110" style="font-size:14px">Fulfilment context</text><rect class="lnw dash" x="558" y="86" width="214" height="196" rx="12" fill="none"/><text class="wrnt" x="572" y="110" style="font-size:14px">Claims context</text></g><g class="k c2"><rect class="box" x="44" y="150" width="100" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="94" y="175" text-anchor="middle">Prescription</text><rect class="box" x="152" y="150" width="100" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="202" y="175" text-anchor="middle">Verification</text><rect class="box" x="296" y="150" width="108" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="350" y="175" text-anchor="middle">DispenseOrder</text><rect class="box" x="420" y="150" width="108" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="474" y="175" text-anchor="middle">Shipment</text><rect class="box" x="574" y="150" width="88" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="618" y="175" text-anchor="middle">Claim</text><rect class="box" x="670" y="150" width="92" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="716" y="175" text-anchor="middle">Eligibility</text><text class="sub" x="400" y="306" text-anchor="middle">aggregates: the smallest unit a service may own</text></g><g class="k c3"><rect class="lnt" x="38" y="138" width="220" height="64" rx="8" style="stroke-width:3"/><text class="teat" x="148" y="224" text-anchor="middle" style="font-size:13px">intake-service</text><text class="sm" x="148" y="246" text-anchor="middle">1 context = 1 service</text><rect class="lnt" x="290" y="138" width="120" height="64" rx="8" style="stroke-width:3"/><text class="teat" x="350" y="224" text-anchor="middle" style="font-size:13px">dispensing-svc</text><text class="sm" x="350" y="246" text-anchor="middle">split: scaling</text><rect class="lnt" x="416" y="138" width="116" height="64" rx="8" style="stroke-width:3"/><text class="teat" x="474" y="224" text-anchor="middle" style="font-size:13px">shipping-svc</text><text class="sm" x="474" y="246" text-anchor="middle">and carrier API</text><rect class="lnt" x="568" y="138" width="200" height="64" rx="8" style="stroke-width:3"/><text class="teat" x="668" y="224" text-anchor="middle" style="font-size:13px">claims-service</text><text class="sm" x="668" y="246" text-anchor="middle">kept small: PHI scope</text></g><g class="k c4"><rect class="bb" x="28" y="320" width="744" height="64" rx="8" stroke-width="1.5"/><text class="badt" x="44" y="346" style="font-size:14px">✗ "refill-service" cut out of the Prescription aggregate</text><text class="sm" x="44" y="368">The refills-authorised invariant now spans two services: distributed transaction or lost updates.</text></g>
</svg>
