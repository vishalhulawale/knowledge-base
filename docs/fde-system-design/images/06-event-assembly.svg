<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Assembling a bed lifecycle from events</title>
  <desc id="d">Animation: four events arrive from three systems with different bed IDs: the EHR's ADT discharge for NUR4-B-012 at 14:05, the bed system's dirty status for 4B-12 at 14:06, and the cleaning system's task started and completed for Room 412 bed 2 at 14:40 and 15:25. A crosswalk maps all three IDs to BED-0412-2, and the event log builds up. The turnaround from patient left to available, 1 hour 20 minutes, is a metric no single system can compute. Times are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes e0{0%,4.99%{opacity:0}5%,96.99%{opacity:1}97%,100%{opacity:0}}.e0{animation-name:e0}
    @keyframes e1{0%,20.99%{opacity:0}21%,96.99%{opacity:1}97%,100%{opacity:0}}.e1{animation-name:e1}
    @keyframes e2{0%,36.99%{opacity:0}37%,96.99%{opacity:1}97%,100%{opacity:0}}.e2{animation-name:e2}
    @keyframes e3{0%,52.99%{opacity:0}53%,96.99%{opacity:1}97%,100%{opacity:0}}.e3{animation-name:e3}
    @keyframes m{0%,73.99%{opacity:0}74%,96.99%{opacity:1}97%,100%{opacity:0}}.m{animation-name:m}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="370" rx="14"/>
  <text class="h" x="28" y="40">One bed, three systems, three names</text><text class="sub" x="28" y="62">Events arrive with source IDs; the crosswalk maps them to one bed; metrics come from the assembled log.</text><rect class="bw" x="300" y="92" width="150" height="200" rx="10" stroke-width="1.5"/><text class="wrnt" x="314" y="116" style="font-size:14px">crosswalk</text><text class="mono" x="314" y="146" xml:space="preserve" style="font-size:11.5px">NUR4-B-012</text><text class="mono" x="314" y="170" xml:space="preserve" style="font-size:11.5px">4B-12</text><text class="mono" x="314" y="194" xml:space="preserve" style="font-size:11.5px">Room 412 bed 2</text><text class="prit" x="314" y="230" style="font-size:13px">→ BED-0412-2</text><text class="sm" x="500" y="100" font-weight="700">BED-0412-2 event log</text><g class="k e0"><rect class="bm" x="28" y="100" width="250" height="42" rx="6"/><text class="sm" x="38" y="117">EHR: ADT A03 patient left</text><text class="mono" x="38" y="134" xml:space="preserve" style="font-size:11.5px">id NUR4-B-012</text><line class="ln" x1="280" y1="121" x2="296" y2="121" marker-end="url(#ar)"/><rect class="bt" x="500" y="114" width="272" height="30" rx="6"/><text class="mono" x="512" y="134" xml:space="preserve">14:05  Dirty</text></g><g class="k e0"><line class="ln" x1="452" y1="190" x2="496" y2="129" marker-end="url(#ar)" opacity="0.5"/></g><g class="k e1"><rect class="bm" x="28" y="150" width="250" height="42" rx="6"/><text class="sm" x="38" y="167">Bed system: status VACANT_DIRTY</text><text class="mono" x="38" y="184" xml:space="preserve" style="font-size:11.5px">id 4B-12</text><line class="ln" x1="280" y1="171" x2="296" y2="171" marker-end="url(#ar)"/><rect class="bt" x="500" y="164" width="272" height="30" rx="6"/><text class="mono" x="512" y="184" xml:space="preserve">14:06  Dirty</text></g><g class="k e1"><line class="ln" x1="452" y1="190" x2="496" y2="179" marker-end="url(#ar)" opacity="0.5"/></g><g class="k e2"><rect class="bm" x="28" y="200" width="250" height="42" rx="6"/><text class="sm" x="38" y="217">Cleaning (EVS): task started</text><text class="mono" x="38" y="234" xml:space="preserve" style="font-size:11.5px">id Room 412 bed 2</text><line class="ln" x1="280" y1="221" x2="296" y2="221" marker-end="url(#ar)"/><rect class="bt" x="500" y="214" width="272" height="30" rx="6"/><text class="mono" x="512" y="234" xml:space="preserve">14:40  Cleaning</text></g><g class="k e2"><line class="ln" x1="452" y1="190" x2="496" y2="229" marker-end="url(#ar)" opacity="0.5"/></g><g class="k e3"><rect class="bm" x="28" y="250" width="250" height="42" rx="6"/><text class="sm" x="38" y="267">Cleaning (EVS): task completed</text><text class="mono" x="38" y="284" xml:space="preserve" style="font-size:11.5px">id Room 412 bed 2</text><line class="ln" x1="280" y1="271" x2="296" y2="271" marker-end="url(#ar)"/><rect class="bt" x="500" y="264" width="272" height="30" rx="6"/><text class="mono" x="512" y="284" xml:space="preserve">15:25  Available</text></g><g class="k e3"><line class="ln" x1="452" y1="190" x2="496" y2="279" marker-end="url(#ar)" opacity="0.5"/></g><g class="k m"><rect class="bp" x="28" y="312" width="744" height="40" rx="8"/><text class="sm" x="44" y="337">Turnaround (patient left → available) = 15:25 − 14:05 = 1 h 20 min, a metric no single system can compute.</text></g>
</svg>
