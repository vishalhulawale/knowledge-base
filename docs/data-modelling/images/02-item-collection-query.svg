  <text class="h" x="28" y="40">Query reads a slice; Scan reads everything</text><text class="sub" x="28" y="62">DynamoDB table, items sorted by sort key inside each partition. Item counts illustrative.</text><text class="mono" x="28" y="96" xml:space="preserve">Query  PK = MEMBER#42</text><text class="mono" x="28" y="114" xml:space="preserve">  begins_with(SK, "ORDER#"), newest first, Limit 3</text><rect class="bm" x="28" y="128" width="340" height="236" rx="10" stroke-width="1.2"/><text class="sub" x="42" y="150">partition MEMBER#42 (sorted by SK)</text><rect class="box" x="42" y="160" width="312" height="24" rx="5" stroke-width="1"/><text class="mono" x="54" y="177" xml:space="preserve">ADDR#home</text><rect class="box" x="42" y="188" width="312" height="24" rx="5" stroke-width="1"/><text class="mono" x="54" y="205" xml:space="preserve">ADDR#work</text><rect class="box" x="42" y="216" width="312" height="24" rx="5" stroke-width="1"/><text class="mono" x="54" y="233" xml:space="preserve">ORDER#2026-06-12#o-511</text><rect class="box" x="42" y="244" width="312" height="24" rx="5" stroke-width="1"/><text class="mono" x="54" y="261" xml:space="preserve">ORDER#2026-08-30#o-702</text><rect class="box" x="42" y="272" width="312" height="24" rx="5" stroke-width="1"/><text class="mono" x="54" y="289" xml:space="preserve">ORDER#2026-09-01#o-877</text><rect class="box" x="42" y="300" width="312" height="24" rx="5" stroke-width="1"/><text class="mono" x="54" y="317" xml:space="preserve">ORDER#2026-10-03#o-981</text><rect class="box" x="42" y="328" width="312" height="24" rx="5" stroke-width="1"/><text class="mono" x="54" y="345" xml:space="preserve">PROFILE</text><g class="k a1"><rect class="tea" x="42" y="300" width="312" height="24" rx="5"/><text class="on13" x="54" y="317">ORDER#2026-10-03#o-981</text><text class="on13" x="342" y="317" text-anchor="end">1</text></g><g class="k a2"><rect class="tea" x="42" y="272" width="312" height="24" rx="5"/><text class="on13" x="54" y="289">ORDER#2026-09-01#o-877</text><text class="on13" x="342" y="289" text-anchor="end">2</text></g><g class="k a3"><rect class="tea" x="42" y="244" width="312" height="24" rx="5"/><text class="on13" x="54" y="261">ORDER#2026-08-30#o-702</text><text class="on13" x="342" y="261" text-anchor="end">3</text></g><g class="k a4"><text class="okt" x="28" y="390" style="font-size:15px">1 request, 3 items read, 3 returned</text><text class="sm" x="28" y="410">reads a contiguous range, newest first</text></g><text class="mono" x="420" y="96" xml:space="preserve">Scan  FilterExpression memberId = 42</text><text class="mono" x="420" y="114" xml:space="preserve">  and type = ORDER</text><rect class="bm" x="420" y="128" width="352" height="236" rx="10" stroke-width="1.2"/><text class="sub" x="434" y="150">every partition in the table</text><rect class="box" x="434" y="162" width="50" height="40" rx="5" stroke-width="1"/><text class="sm" x="459" y="187" text-anchor="middle">#7</text><rect class="box" x="490" y="162" width="50" height="40" rx="5" stroke-width="1"/><text class="sm" x="515" y="187" text-anchor="middle">#42</text><rect class="box" x="546" y="162" width="50" height="40" rx="5" stroke-width="1"/><text class="sm" x="571" y="187" text-anchor="middle">#13</text><rect class="box" x="602" y="162" width="50" height="40" rx="5" stroke-width="1"/><text class="sm" x="627" y="187" text-anchor="middle">#99</text><rect class="box" x="658" y="162" width="50" height="40" rx="5" stroke-width="1"/><text class="sm" x="683" y="187" text-anchor="middle">#42</text><rect class="box" x="714" y="162" width="50" height="40" rx="5" stroke-width="1"/><text class="sm" x="739" y="187" text-anchor="middle">#5</text><rect class="box" x="434" y="210" width="50" height="40" rx="5" stroke-width="1"/><text class="sm" x="459" y="235" text-anchor="middle">#61</text><rect class="box" x="490" y="210" width="50" height="40" rx="5" stroke-width="1"/><text class="sm" x="515" y="235" text-anchor="middle">#42</