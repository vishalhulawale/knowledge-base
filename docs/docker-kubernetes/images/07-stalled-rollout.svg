<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">A stalled rollout keeps the old version serving</title>
  <desc id="d">Measured on the page: release 1.4 never becomes Ready. With maxSurge 1 and maxUnavailable 0 the Deployment creates one surge pod for 1.4, which stays not ready; the four 1.3 pods are never removed and keep serving, so availability stays 4 of 4. After progressDeadlineSeconds the Deployment reports Progressing False with reason ProgressDeadlineExceeded and kubectl rollout status exits non-zero, failing the pipeline. Kubernetes does not roll back by itself; kubectl rollout undo scales the 1.4 ReplicaSet back to zero.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="358" rx="14"/>
  <text class="h" x="28" y="40">Release 1.4 never becomes Ready</text>
  <text class="sub" x="28" y="62">Measured on the page: maxSurge 1, maxUnavailable 0, progressDeadlineSeconds 30.</text>
  <text class="lbl" x="28" y="112">ReplicaSet shop:1.3</text>
  <rect class="pri" x="220" y="94" width="66" height="34" rx="6"/>
  <text class="on13" x="253" y="115.5" text-anchor="middle">1.3 ✓</text>
  <rect class="pri" x="294" y="94" width="66" height="34" rx="6"/>
  <text class="on13" x="327" y="115.5" text-anchor="middle">1.3 ✓</text>
  <rect class="pri" x="368" y="94" width="66" height="34" rx="6"/>
  <text class="on13" x="401" y="115.5" text-anchor="middle">1.3 ✓</text>
  <rect class="pri" x="442" y="94" width="66" height="34" rx="6"/>
  <text class="on13" x="475" y="115.5" text-anchor="middle">1.3 ✓</text>
  <text class="tx okt" x="530" y="116">4 ready: still serving</text>
  <text class="lbl" x="28" y="168">ReplicaSet shop:1.4</text>
  <rect class="bb" x="220" y="150" width="66" height="34" rx="6" stroke-width="1.5"/>
  <text class="sm badt" x="253" y="172" text-anchor="middle">0/1</text>
  <text class="tx badt" x="304" y="172">surge pod never Ready → no old pod removed</text>
  <rect class="bm" x="28" y="210" width="744" height="70" rx="10" stroke-width="1"/>
  <text class="sm" x="44" y="234" font-weight="700">Deployment conditions</text>
  <text class="tx okt" x="44" y="254">Available=True (4/4)</text>
  <text class="tx badt" x="260" y="254">Progressing=False  ProgressDeadlineExceeded</text>
  <text class="sm" x="44" y="272">kubectl rollout status → exit 1, so CI fails</text>
  <text class="tx" x="28" y="316">No automatic rollback: kubectl rollout undo (or the pipeline) scales 1.4 to zero.</text>
  <text class="sub" x="28" y="340">Undo re-applies the old template as a new revision; rev 2 came back as rev 4 in ~0.6 s.</text>
</svg>
