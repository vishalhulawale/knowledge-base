<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Python and Java tracebacks</title>
  <desc id="d">Two error listings. A Python 3.11 traceback is read bottom-up: its last line, a ValueError converting 'abc' to float, is the exception, and the frame above it in totals.py line 12, with the failing sub-expression underlined, is where it happened. A Java stack trace is read top-down: the first line names the exception and the next frame in your own code, RefundService line 58, and the last Caused by line, a SocketTimeoutException from PaymentsClient line 77, is the root cause. Arrows show the reading direction.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="402" rx="14"/>
  <text class="h" x="28" y="40">Reading the error: Python bottom-up, Java top-down</text><text class="sub" x="28" y="62">Find the exception first, then the frame in your code that raised it.</text><text class="lbl" x="28" y="96">Python 3.11+</text><rect class="bm" x="28" y="106" width="360" height="196" rx="8"/><text class="mono" x="38" y="130" xml:space="preserve" style="font-size:11.5px">Traceback (most recent call last):</text><text class="mono" x="38" y="154" xml:space="preserve" style="font-size:11.5px">  File "app.py", line 41, in main</text><text class="mono" x="38" y="178" xml:space="preserve" style="font-size:11.5px">    report(rows)</text><rect class="wrnf" x="32" y="186" width="352" height="22" rx="4" opacity="0.22"/><text class="mono" x="38" y="202" xml:space="preserve" style="font-size:11.5px">  File "totals.py", line 12, in report</text><text class="mono" x="38" y="226" xml:space="preserve" style="font-size:11.5px">    t += float(r["amount"])</text><text class="mono" x="38" y="250" xml:space="preserve" style="font-size:11.5px">                 ~~~~~^^^^^^^^^^^^^^</text><rect class="badf" x="32" y="258" width="352" height="22" rx="4" opacity="0.22"/><text class="mono" x="38" y="274" xml:space="preserve" style="font-size:11.5px">ValueError: could not convert string to float:</text><text class="lbl" x="412" y="96">Java</text><rect class="bm" x="412" y="106" width="360" height="196" rx="8"/><rect class="wrnf" x="416" y="114" width="352" height="22" rx="4" opacity="0.22"/><text class="mono" x="422" y="130" xml:space="preserve" style="font-size:11.5px">IllegalStateException: refund failed</text><text class="mono" x="422" y="154" xml:space="preserve" style="font-size:11.5px">  at RefundService.refund(...:58)</text><text class="mono" x="422" y="178" xml:space="preserve" style="font-size:11.5px">  at RefundController.post(...:31)</text><text class="mono" x="422" y="202" xml:space="preserve" style="font-size:11.5px">  at ... 40 framework frames ...</text><rect class="badf" x="416" y="210" width="352" height="22" rx="4" opacity="0.22"/><text class="mono" x="422" y="226" xml:space="preserve" style="font-size:11.5px">Caused by: SocketTimeoutException</text><text class="mono" x="422" y="250" xml:space="preserve" style="font-size:11.5px">  at SocketInputStream.read(...)</text><rect class="wrnf" x="416" y="258" width="352" height="22" rx="4" opacity="0.22"/><text class="mono" x="422" y="274" xml:space="preserve" style="font-size:11.5px">  at PaymentsClient.call(...:77)</text><path class="lnb" d="M 396 290 L 396 120" marker-end="url(#arb)"/><path class="lnb" d="M 780 120 L 780 290" marker-end="url(#arb)"/><text class="sm" x="28" y="330">1. Red: the exception (Python's last line; Java's last "Caused by:" is the root cause).</text><text class="sm" x="28" y="350">2. Amber: the deepest frame in your own code. Python 3.11+ underlines the failing sub-expression.</text><text class="sm" x="28" y="370">3. Then reproduce with the smallest input that still fails.</text>
</svg>
