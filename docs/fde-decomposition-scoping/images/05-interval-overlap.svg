<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Interval overlap check</title>
  <desc id="d">Animation: appointment A is fixed at 10:00 to 11:00 while appointment B moves through five positions on a timeline from 08:00 to 13:00. For each position the two conditions are evaluated: a.start less than b.end, and b.start less than a.end. 08:30 to 09:30 does not overlap because the first is false. 09:30 to 10:30, 10:15 to 10:45 and 10:45 to 11:45 overlap because both are true. 11:00 to 12:00 does not overlap because 11:00 is not less than 11:00: with half-open intervals, back-to-back slots do not overlap.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .p{opacity:0;animation:15s infinite linear}
    @keyframes p0{0%,19.99%{opacity:1}20%,100%{opacity:0}}.p0{animation-name:p0}
    @keyframes p1{0%,19.99%{opacity:0}20%,39.99%{opacity:1}40%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,39.99%{opacity:0}40%,59.99%{opacity:1}60%,100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%,59.99%{opacity:0}60%,79.99%{opacity:1}80%,100%{opacity:0}}.p3{animation-name:p3}
    @keyframes p4{0%,79.99%{opacity:0}80%,100%{opacity:1}}.p4{animation-name:p4}
    @media (prefers-reduced-motion: reduce){.p{animation:none;opacity:0}.p4{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="358" rx="14"/>
  <text class="h" x="28" y="40">Do two appointments overlap?</text><text class="sub" x="28" y="62">Half-open intervals [start, end): back-to-back slots do not overlap.</text><line class="grid" x1="100" y1="100" x2="100" y2="216"/><text class="sub" x="100" y="94" text-anchor="middle">08:00</text><line class="grid" x1="228" y1="100" x2="228" y2="216"/><text class="sub" x="228" y="94" text-anchor="middle">09:00</text><line class="grid" x1="356" y1="100" x2="356" y2="216"/><text class="sub" x="356" y="94" text-anchor="middle">10:00</text><line class="grid" x1="484" y1="100" x2="484" y2="216"/><text class="sub" x="484" y="94" text-anchor="middle">11:00</text><line class="grid" x1="612" y1="100" x2="612" y2="216"/><text class="sub" x="612" y="94" text-anchor="middle">12:00</text><line class="grid" x1="740" y1="100" x2="740" y2="216"/><text class="sub" x="740" y="94" text-anchor="middle">13:00</text><text class="lbl" x="28" y="132">A</text><rect class="pri" x="356" y="110" width="128" height="34" rx="6"/><text class="on13" x="420" y="132" text-anchor="middle">10:00–11:00</text><text class="lbl" x="28" y="190">B</text><g class="p p0"><rect class="okf" x="164" y="168" width="128" height="34" rx="6"/><text class="on13" x="228" y="190" text-anchor="middle">08:30–09:30</text><text class="mono" x="28" y="248">a.start &lt; b.end   →  10:00 &lt; 09:30  →  false</text><text class="mono" x="28" y="272">b.start &lt; a.end   →  08:30 &lt; 11:00  →  true</text><text class="okt" x="28" y="306" font-size="16">No overlap: at least one is false</text></g><g class="p p1"><rect class="badf" x="292" y="168" width="128" height="34" rx="6"/><text class="on13" x="356" y="190" text-anchor="middle">09:30–10:30</text><text class="mono" x="28" y="248">a.start &lt; b.end   →  10:00 &lt; 10:30  →  true</text><text class="mono" x="28" y="272">b.start &lt; a.end   →  09:30 &lt; 11:00  →  true</text><text class="badt" x="28" y="306" font-size="16">Overlap: both true</text></g><g class="p p2"><rect class="badf" x="388" y="168" width="64" height="34" rx="6"/><text class="on13" x="420" y="190" text-anchor="middle">10:15–10:45</text><text class="mono" x="28" y="248">a.start &lt; b.end   →  10:00 &lt; 10:45  →  true</text><text class="mono" x="28" y="272">b.start &lt; a.end   →  10:15 &lt; 11:00  →  true</text><text class="badt" x="28" y="306" font-size="16">Overlap: both true</text></g><g class="p p3"><rect class="badf" x="452" y="168" width="128" height="34" rx="6"/><text class="on13" x="516" y="190" text-anchor="middle">10:45–11:45</text><text class="mono" x="28" y="248">a.start &lt; b.end   →  10:00 &lt; 11:45  →  true</text><text class="mono" x="28" y="272">b.start &lt; a.end   →  10:45 &lt; 11:00  →  true</text><text class="badt" x="28" y="306" font-size="16">Overlap: both true</text></g><g class="p p4"><rect class="okf" x="484" y="168" width="128" height="34" rx="6"/><text class="on13" x="548" y="190" text-anchor="middle">11:00–12:00</text><text class="mono" x="28" y="248">a.start &lt; b.end   →  10:00 &lt; 12:00  →  true</text><text class="mono" x="28" y="272">b.start &lt; a.end   →  11:00 &lt; 11:00  →  false</text><text class="okt" x="28" y="306" font-size="16">No overlap: at least one is false</text></g><text class="mono" x="28" y="340">overlaps(a, b) = a.start &lt; b.end and b.start &lt; a.end</text>
</svg>
