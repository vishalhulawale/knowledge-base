<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Statements per use case: N+1 versus batch fetching versus join fetch</title>
  <desc id="d">Three lanes load 20 members with their plan, one bar per JDBC statement, sent one after another. The lazy loop sends one query for the members and then one SELECT per member: 21 statements. With default_batch_fetch_size 10 it sends the member query and two IN queries of 10 ids each: 3 statements. A join fetch, entity graph or DTO projection sends one query with a join: 1 statement. The first lane keeps going long after the others have finished.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .txt{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .track{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.am{fill:#d97706}.te{fill:#0ea5a4}.gr{fill:#16a34a}
    .cnt{font-size:28px;font-weight:700}
    .c1{fill:#dc2626}.c2{fill:#0f766e}.c3{fill:#16a34a}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.txt{fill:#e2e8f0}.sub{fill:#94a3b8}
      .track{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.am{fill:#fbbf24}.te{fill:#2dd4bf}.gr{fill:#4ade80}
      .c1{fill:#f87171}.c2{fill:#5eead4}.c3{fill:#4ade80}
    }
    /* 10 s loop: one statement every 0.34 s in every lane */
    .a{opacity:0;animation:10s infinite linear}
        @keyframes b0{0%,4.0%{opacity:0}5.0%,94%{opacity:1}97%,100%{opacity:0}}.b0{animation-name:b0}
    @keyframes b1{0%,7.4%{opacity:0}8.4%,94%{opacity:1}97%,100%{opacity:0}}.b1{animation-name:b1}
    @keyframes b2{0%,10.8%{opacity:0}11.8%,94%{opacity:1}97%,100%{opacity:0}}.b2{animation-name:b2}
    @keyframes b3{0%,14.2%{opacity:0}15.2%,94%{opacity:1}97%,100%{opacity:0}}.b3{animation-name:b3}
    @keyframes b4{0%,17.6%{opacity:0}18.6%,94%{opacity:1}97%,100%{opacity:0}}.b4{animation-name:b4}
    @keyframes b5{0%,21.0%{opacity:0}22.0%,94%{opacity:1}97%,100%{opacity:0}}.b5{animation-name:b5}
    @keyframes b6{0%,24.4%{opacity:0}25.4%,94%{opacity:1}97%,100%{opacity:0}}.b6{animation-name:b6}
    @keyframes b7{0%,27.8%{opacity:0}28.8%,94%{opacity:1}97%,100%{opacity:0}}.b7{animation-name:b7}
    @keyframes b8{0%,31.2%{opacity:0}32.2%,94%{opacity:1}97%,100%{opacity:0}}.b8{animation-name:b8}
    @keyframes b9{0%,34.6%{opacity:0}35.6%,94%{opacity:1}97%,100%{opacity:0}}.b9{animation-name:b9}
    @keyframes b10{0%,38.0%{opacity:0}39.0%,94%{opacity:1}97%,100%{opacity:0}}.b10{animation-name:b10}
    @keyframes b11{0%,41.4%{opacity:0}42.4%,94%{opacity:1}97%,100%{opacity:0}}.b11{animation-name:b11}
    @keyframes b12{0%,44.8%{opacity:0}45.8%,94%{opacity:1}97%,100%{opacity:0}}.b12{animation-name:b12}
    @keyframes b13{0%,48.2%{opacity:0}49.2%,94%{opacity:1}97%,100%{opacity:0}}.b13{animation-name:b13}
    @keyframes b14{0%,51.6%{opacity:0}52.6%,94%{opacity:1}97%,100%{opacity:0}}.b14{animation-name:b14}
    @keyframes b15{0%,55.0%{opacity:0}56.0%,94%{opacity:1}97%,100%{opacity:0}}.b15{animation-name:b15}
    @keyframes b16{0%,58.4%{opacity:0}59.4%,94%{opacity:1}97%,100%{opacity:0}}.b16{animation-name:b16}
    @keyframes b17{0%,61.8%{opacity:0}62.8%,94%{opacity:1}97%,100%{opacity:0}}.b17{animation-name:b17}
    @keyframes b18{0%,65.2%{opacity:0}66.2%,94%{opacity:1}97%,100%{opacity:0}}.b18{animation-name:b18}
    @keyframes b19{0%,68.6%{opacity:0}69.6%,94%{opacity:1}97%,100%{opacity:0}}.b19{animation-name:b19}
    @keyframes b20{0%,72.0%{opacity:0}73.0%,94%{opacity:1}97%,100%{opacity:0}}.b20{animation-name:b20}
    @keyframes d1{0%,73.0%{opacity:0}74.0%,94%{opacity:1}97%,100%{opacity:0}}.d1{animation-name:d1}
    @keyframes d2{0%,11.8%{opacity:0}12.8%,94%{opacity:1}97%,100%{opacity:0}}.d2{animation-name:d2}
    @keyframes d3{0%,5.0%{opacity:0}6.0%,94%{opacity:1}97%,100%{opacity:0}}.d3{animation-name:d3}
    @media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="410" rx="14"/>
  <text class="h" x="28" y="40">Loading 20 members with their plan: statements sent</text>
  <text class="sub" x="28" y="62">Each bar is one JDBC statement, a full round trip to the database.</text>

  <rect class="track" x="224" y="96" width="474" height="60" rx="8"/>
  <rect class="track" x="224" y="186" width="474" height="60" rx="8"/>
  <rect class="track" x="224" y="276" width="474" height="60" rx="8"/>

  <text class="lbl" x="28" y="120">Lazy loop (N+1)</text>
  <text class="sub" x="28" y="140">1 + 20 = 21</text>
  <text class="lbl" x="28" y="210">Batch size 10</text>
  <text class="sub" x="28" y="230">1 + ceil(20 / 10) = 3</text>
  <text class="lbl" x="28" y="300">JOIN FETCH, entity</text>
  <text class="lbl" x="28" y="318">graph or DTO</text>

    <rect class="a b0 pri" x="232" y="104" width="18" height="44" rx="4"/>
  <rect class="a b1 am" x="254" y="104" width="18" height="44" rx="4"/>
  <rect class="a b2 am" x="276" y="104" width="18" height="44" rx="4"/>
