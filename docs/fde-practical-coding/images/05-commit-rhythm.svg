<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 304" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Refactoring commit rhythm</title>
  <desc id="d">Animation: a sequence of steps appears along a line. Golden master, extract rate function and rules table are green and committed. Inline helper turns the tests red, so the next step reverts it with git restore. Rename fields is green and committed. Finally, wearing the feature hat, a Germany row is added to the rules table, test-first. All steps before it wear the refactor hat with behaviour unchanged. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes c0{0%,4.99%{opacity:0}5%,96.99%{opacity:1}97%,100%{opacity:0}}.c0{animation-name:c0}
    @keyframes c1{0%,16.99%{opacity:0}17%,96.99%{opacity:1}97%,100%{opacity:0}}.c1{animation-name:c1}
    @keyframes c2{0%,28.99%{opacity:0}29%,96.99%{opacity:1}97%,100%{opacity:0}}.c2{animation-name:c2}
    @keyframes c3{0%,40.99%{opacity:0}41%,96.99%{opacity:1}97%,100%{opacity:0}}.c3{animation-name:c3}
    @keyframes c4{0%,52.99%{opacity:0}53%,96.99%{opacity:1}97%,100%{opacity:0}}.c4{animation-name:c4}
    @keyframes c5{0%,64.99%{opacity:0}65%,96.99%{opacity:1}97%,100%{opacity:0}}.c5{animation-name:c5}
    @keyframes c6{0%,76.99%{opacity:0}77%,96.99%{opacity:1}97%,100%{opacity:0}}.c6{animation-name:c6}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="302" rx="14"/>
  <text class="h" x="28" y="40">Small green steps; revert, don't debug forward</text><text class="sub" x="28" y="62">Make the change easy (refactor), then make the easy change (one new rule). Illustrative.</text><line class="ln" x1="76" y1="150" x2="724" y2="150"/><g class="k c0"><circle class="okf" cx="76" cy="150" r="16"/><text class="on" x="76" y="156" text-anchor="middle">✓</text><text class="sm" x="76" y="196" text-anchor="middle">golden master</text><text class="sub" x="76" y="216" text-anchor="middle">commit</text></g><g class="k c1"><circle class="okf" cx="184" cy="150" r="16"/><text class="on" x="184" y="156" text-anchor="middle">✓</text><text class="sm" x="184" y="196" text-anchor="middle">extract rate()</text><text class="sub" x="184" y="216" text-anchor="middle">commit</text></g><g class="k c2"><circle class="okf" cx="292" cy="150" r="16"/><text class="on" x="292" y="156" text-anchor="middle">✓</text><text class="sm" x="292" y="196" text-anchor="middle">rules table</text><text class="sub" x="292" y="216" text-anchor="middle">commit</text></g><g class="k c3"><circle class="badf" cx="400" cy="150" r="16"/><text class="on" x="400" y="156" text-anchor="middle">✗</text><text class="sm" x="400" y="196" text-anchor="middle">inline helper</text><text class="badt" x="400" y="216" text-anchor="middle" style="font-size:12px">tests red</text></g><g class="k c4"><circle class="wrnf" cx="508" cy="150" r="16"/><text class="on" x="508" y="156" text-anchor="middle">↶</text><text class="sm" x="508" y="196" text-anchor="middle">revert</text><text class="mono" x="508" y="216" text-anchor="middle" xml:space="preserve">git restore .</text></g><g class="k c5"><circle class="okf" cx="616" cy="150" r="16"/><text class="on" x="616" y="156" text-anchor="middle">✓</text><text class="sm" x="616" y="196" text-anchor="middle">rename fields</text><text class="sub" x="616" y="216" text-anchor="middle">commit</text></g><g class="k c6"><circle class="pri" cx="724" cy="150" r="16"/><text class="on" x="724" y="156" text-anchor="middle">+</text><text class="sm" x="724" y="196" text-anchor="middle">+ Germany row</text><text class="sub" x="724" y="216" text-anchor="middle">commit</text></g><text class="teat" x="76" y="112" style="font-size:13px">refactor hat: behaviour unchanged</text><path class="lnt" d="M 60 122 L 632 122"/><text class="prit" x="724" y="112" text-anchor="middle" style="font-size:13px">feature hat</text><text class="sm" x="28" y="262">Every green step is a commit you can return to, so a red step costs one revert, not twenty minutes</text><text class="sm" x="28" y="280">of debugging. The new country ends up as one row in a rules table, added test-first.</text>
</svg>
