    @keyframes mk{0%,33%{opacity:0}35%,94%{opacity:1}97%,100%{opacity:0}}
.p0{animation-name:p0}.s0{animation-name:s0}.p1{animation-name:p1}.s1{animation-name:s1}.p2{animation-name:p2}.s2{animation-name:s2}.p3{animation-name:p3}.s3{animation-name:s3}.p4{animation-name:p4}.s4{animation-name:s4}.p5{animation-name:p5}.s5{animation-name:s5}.p6{animation-name:p6}.s6{animation-name:s6}.p7{animation-name:p7}.s7{animation-name:s7}.p8{animation-name:p8}.s8{animation-name:s8}.p9{animation-name:p9}.s9{animation-name:s9}.rd{animation-name:rd}.ok{animation-name:ok}.mk{animation-name:mk}
