<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">publishOn versus subscribeOn</title>
  <desc id="d">Two chains of operators are coloured by the thread that runs them. In the first, Flux.range and map(a) run on the caller thread, such as a Reactor Netty event loop, and after publishOn(parallel()) the second map and the subscriber run on a parallel scheduler thread, so the position of publishOn matters. In the second, subscribeOn(boundedElastic()) is written at the end, yet the source and every operator run on a boundedElastic thread, because subscribeOn changes where the source is subscribed regardless of position.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="458" rx="14"/>
  <text class="h" x="28" y="40">Which thread runs each operator?</text><text class="sub" x="28" y="62">Colour = thread. The same four-step chain, two ways of switching threads.</text><text class="lbl" x="28" y="96">publishOn(parallel()) in the middle</text><rect class="tea" x="28" y="110" width="128" height="46" rx="8"/><text class="on13" x="92" y="138" text-anchor="middle">Flux.range</text><line class="ln" x1="158" y1="133" x2="176" y2="133" marker-end="url(#ar)"/><rect class="tea" x="178" y="110" width="128" height="46" rx="8"/><text class="on13" x="242" y="138" text-anchor="middle">map(a)</text><line class="ln" x1="308" y1="133" x2="326" y2="133" marker-end="url(#ar)"/><rect class="mutf" x="328" y="110" width="128" height="46" rx="8"/><text class="on13" x="392" y="138" text-anchor="middle">publishOn</text><line class="ln" x1="458" y1="133" x2="476" y2="133" marker-end="url(#ar)"/><rect class="pri" x="478" y="110" width="128" height="46" rx="8"/><text class="on13" x="542" y="138" text-anchor="middle">map(b)</text><line class="ln" x1="608" y1="133" x2="626" y2="133" marker-end="url(#ar)"/><rect class="pri" x="628" y="110" width="128" height="46" rx="8"/><text class="on13" x="692" y="138" text-anchor="middle">subscriber</text><text class="sm" x="28" y="184">Before publishOn: caller thread. After it: parallel-1. Position matters.</text><text class="lbl" x="28" y="246">subscribeOn(boundedElastic()) at the end</text><rect class="wrnf" x="28" y="260" width="128" height="46" rx="8"/><text class="on13" x="92" y="288" text-anchor="middle">Flux.range</text><line class="ln" x1="158" y1="283" x2="176" y2="283" marker-end="url(#ar)"/><rect class="wrnf" x="178" y="260" width="128" height="46" rx="8"/><text class="on13" x="242" y="288" text-anchor="middle">map(a)</text><line class="ln" x1="308" y1="283" x2="326" y2="283" marker-end="url(#ar)"/><rect class="wrnf" x="328" y="260" width="128" height="46" rx="8"/><text class="on13" x="392" y="288" text-anchor="middle">map(b)</text><line class="ln" x1="458" y1="283" x2="476" y2="283" marker-end="url(#ar)"/><rect class="mutf" x="478" y="260" width="128" height="46" rx="8"/><text class="on13" x="542" y="288" text-anchor="middle">subscribeOn</text><line class="ln" x1="608" y1="283" x2="626" y2="283" marker-end="url(#ar)"/><rect class="wrnf" x="628" y="260" width="128" height="46" rx="8"/><text class="on13" x="692" y="288" text-anchor="middle">subscriber</text><text class="sm" x="28" y="334">The source runs on boundedElastic-1, so the whole chain does. Position does not matter.</text><rect class="tea" x="28" y="387" width="16" height="16" rx="4"/><text class="sm" x="52" y="400">caller thread, e.g. reactor-http-nio-1</text><rect class="pri" x="408" y="387" width="16" height="16" rx="4"/><text class="sm" x="432" y="400">parallel-1</text><rect class="wrnf" x="28" y="413" width="16" height="16" rx="4"/><text class="sm" x="52" y="426">boundedElastic-1</text><rect class="mutf" x="408" y="413" width="16" height="16" rx="4"/><text class="sm" x="432" y="426">thread switch</text><line class="grid" x1="28" y1="382" x2="772" y2="382"/>
</svg>
