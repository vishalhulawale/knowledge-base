<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Consumer-driven contract</title>
  <desc id="d">The graphql-consumer's pact says GET /pharmacies/7 returns id and name as strings, the only fields it uses. The pharmacy-api provider returns id, name, address and phone. When the provider removes phone, which no consumer uses, verification passes and can-i-deploy says yes. When the provider renames name to displayName, verification of the pact fails and can-i-deploy says no, so the change is blocked before production.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ring{fill:#ffffff;stroke:#d97706;stroke-width:2.5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
      .ring{fill:#111827;stroke:#fbbf24}
    }

    .ph{animation:14s infinite steps(1,end)}
    @keyframes p0{0%,17%{opacity:1}18%,100%{opacity:0}}
@keyframes p1{0%,17%{opacity:0}18%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes p2{0%,49%{opacity:0}50%,57%{opacity:1}58%,100%{opacity:0}}
@keyframes p3{0%,57%{opacity:0}58%,97%{opacity:1}100%{opacity:0}}

    .p0{animation-name:p0}.p1{animation-name:p1;opacity:0}.p2{animation-name:p2;opacity:0}.p3{animation-name:p3;opacity:0}
    @media (prefers-reduced-motion: reduce){.ph{animation:none}.p0,.p1,.p2{opacity:0}.p3{opacity:1}}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="388" rx="14"/>
  <text class="h" x="28" y="40">Consumer-driven contract: what breaks, and what doesn't</text>
  <rect class="bp" x="28" y="88" width="236" height="190" rx="10" stroke-width="1.5"/><text class="tx" x="44" y="112" font-weight="700">Consumer: graphql-consumer</text>
  <text class="sub" x="44" y="136">pact (only what it uses)</text>
  <text class="tx" x="44" y="162" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">GET /pharmacies/7</text>
  <text class="tx" x="44" y="186" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">200 {</text>
  <text class="tx" x="60" y="208" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"id":   string,</text>
  <text class="tx" x="60" y="230" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"name": string</text>
  <text class="tx" x="44" y="252" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">}</text>
  <rect class="box" x="296" y="136" width="212" height="100" rx="10" stroke-width="1.5"/><text class="lbl" x="402" y="168" text-anchor="middle">Pact Broker</text><text class="sub" x="402" y="190" text-anchor="middle">pacts + verification</text><text class="sub" x="402" y="208" text-anchor="middle">results per version</text>
  <line class="ln" x1="264" y1="186" x2="292" y2="186" marker-end="url(#ar)"/>
  <line class="ln" x1="508" y1="186" x2="530" y2="186" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <rect class="bt" x="534" y="88" width="238" height="190" rx="10" stroke-width="1.5"/><text class="tx" x="548" y="112" font-weight="700">Provider: pharmacy-api</text>
  <text class="sub" x="548" y="134">response fields</text>
  <g class="ph p0"><text class="tx" x="560" y="158" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"id": …</text><circle class="tea" cx="548" cy="153" r="4"/><text class="tx" x="560" y="186" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"name": …</text><circle class="tea" cx="548" cy="181" r="4"/><text class="tx" x="560" y="214" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"address": …</text><text class="tx" x="560" y="242" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"phone": …</text><text class="lbl teat" x="28" y="68">Consumer pact: GET /pharmacies/7 returns id and name (strings)</text></g>
  <g class="ph p1"><text class="tx" x="560" y="158" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"id": …</text><circle class="tea" cx="548" cy="153" r="4"/><text class="tx" x="560" y="186" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"name": …</text><circle class="tea" cx="548" cy="181" r="4"/><text class="tx" x="560" y="214" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"address": …</text><line class="lnb" x1="560" y1="237" x2="660" y2="237"/><text class="sub" x="560" y="242" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"phone": …</text><text class="lbl okt" x="28" y="68">Change 1: provider removes phone. Nobody uses it: verification passes</text><rect class="bo" x="296" y="292" width="212" height="52" rx="10" stroke-width="1.5"/><text class="tx okt" x="312" y="314">can-i-deploy? yes</text><text class="sub" x="312" y="332">provider ships</text><circle class="okf" cx="752" cy="104" r="11"/><text class="on13" x="752" y="109" text-anchor="middle">✓</text></g>
  <g class="ph p2"><text class="tx" x="560" y="158" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"id": …</text><circle class="tea" cx="548" cy="153" r="4"/><text class="tx" x="560" y="186" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"name": …</text><circle class="tea" cx="548" cy="181" r="4"/><text class="tx" x="560" y="214" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"address": …</text><text class="tx" x="560" y="242" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"phone": …</text><text class="lbl teat" x="28" y="68"></text></g>
  <g class="ph p3"><text class="tx" x="560" y="158" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"id": …</text><circle class="tea" cx="548" cy="153" r="4"/><text class="tx badt" x="560" y="186" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"displayName": …</text><circle class="tea" cx="548" cy="181" r="4"/><text class="tx" x="560" y="214" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"address": …</text><text class="tx" x="560" y="242" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">"phone": …</text><text class="lbl badt" x="28" y="68">Change 2: provider renames name to displayName: verification fails</text><rect class="bb" x="296" y="292" width="212" height="52" rx="10" stroke-width="1.5"/><text class="tx badt" x="312" y="314">can-i-deploy? no</text><text class="sub" x="312" y="332">blocked before production</text><circle class="badf" cx="752" cy="104" r="11"/><text class="on13" x="752" y="109" text-anchor="middle">✕</text></g>
  <circle class="tea" cx="548" cy="300" r="4"/><text class="sub" x="560" y="305">field the consumer uses</text>
  <text class="sub" x="28" y="372">The provider verifies every consumer's pact in its own pipeline. Fields no consumer uses can change freely.</text>
</svg>
