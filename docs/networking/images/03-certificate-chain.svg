<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Certificate chain of trust</title>
  <desc id="d">A certificate chain of trust. The server sends its leaf certificate for api.example.com and the intermediate CA certificate that signed it. The intermediate was signed by a root CA whose self-signed certificate is already in the client's trust store, such as the JDK cacerts file, and is not sent. The client checks each signature up to the trusted root, the validity dates, that the hostname matches a Subject Alternative Name, the key usage, and revocation status. A callout shows the common failure: if the server is configured with only the leaf certificate, browsers may hide the problem by fetching the intermediate, but Java clients fail with PKIX path building failed. Example names and lifetimes are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:12px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">How the client decides to trust the server</text>
  <text class="sub" x="28" y="62">The server proves it holds the leaf key (CertificateVerify); the chain proves who that key belongs to.</text>
  <rect class="bp" x="28" y="86" width="200" height="150" rx="10" stroke-width="1.8"/>
  <text class="tx prit" x="42" y="112">Leaf certificate</text>
  <text class="sm" x="42" y="136">Subject: api.example.com</text>
  <text class="sm" x="42" y="156">SAN: api.example.com</text>
  <text class="sm" x="42" y="176">Issuer: Example Issuing CA 1</text>
  <text class="sm" x="42" y="196">Valid: ≤ 200 days (2026 cap)</text>
  <text class="sm" x="42" y="216">EKU: serverAuth</text>
  <rect class="bt" x="300" y="86" width="200" height="150" rx="10" stroke-width="1.8"/>
  <text class="tx teat" x="314" y="112">Intermediate CA</text>
  <text class="sm" x="314" y="136">Subject: Example Issuing CA 1</text>
  <text class="sm" x="314" y="156">Issuer: Example Root CA</text>
  <text class="sm" x="314" y="176">CA:true, pathLen 0</text>
  <text class="sm" x="314" y="196">Valid: years</text>
  <text class="sm" x="314" y="216">Rotated by the CA</text>
  <rect class="bo" x="572" y="86" width="200" height="150" rx="10" stroke-width="1.8"/>
  <text class="tx okt" x="586" y="112">Root CA (trust anchor)</text>
  <text class="sm" x="586" y="136">Subject = Issuer (self-signed)</text>
  <text class="sm" x="586" y="156">Pre-installed in trust store</text>
  <text class="sm" x="586" y="176">JDK cacerts, OS, browser</text>
  <text class="sm" x="586" y="196">Valid: 20+ years</text>
  <text class="sm" x="586" y="216">Never sent by server</text>
  <line class="ln" x1="234" y1="150" x2="294" y2="150" marker-end="url(#ar)"/><text class="sub" x="264" y="140" text-anchor="middle">signed by</text>
  <line class="ln" x1="506" y1="150" x2="566" y2="150" marker-end="url(#ar)"/><text class="sub" x="536" y="140" text-anchor="middle">signed by</text>
  <path class="lnp" d="M30,250 v10 h468 v-10"/><text class="tx prit" x="264" y="280" text-anchor="middle">Server sends in Certificate message: leaf + intermediate</text>
  <path class="lno" d="M574,250 v10 h196 v-10"/><text class="tx okt" x="672" y="280" text-anchor="middle">Client already has this</text>
  <text class="lbl" x="28" y="316">Client checks</text>
  <text class="sm" x="28" y="340">1. Each signature verifies up to a root in the trust store</text>
  <text class="sm" x="28" y="360">2. Now is inside notBefore / notAfter for every cert</text>
  <text class="sm" x="28" y="380">3. Hostname matches a SAN DNS entry, not the CN</text>
  <text class="sm" x="28" y="400">4. Key usage, EKU, basicConstraints; revocation (CRL, stapled OCSP)</text>
  <rect class="bb" x="440" y="300" width="330" height="108" rx="10" stroke-width="1.8"/>
  <text class="tx badt" x="456" y="324">Common failure: missing intermediate</text>
  <text class="sm" x="456" y="346">Server configured with the leaf only.</text>
  <text class="sm" x="456" y="364">Browsers may fetch the intermediate (AIA)</text>
  <text class="sm" x="456" y="382">and hide it; Java and curl clients fail with:</text>
  <text class="sm badt" x="456" y="400">PKIX path building failed</text>
</svg>
