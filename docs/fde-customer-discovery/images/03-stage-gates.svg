<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 382" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Demo, POC, pilot, production gates</title>
  <desc id="d">Four stages left to right, each with its question and length: demo (worth exploring, hours), proof of concept (works on their data, 1 to 4 weeks), pilot (moves the metric, 4 to 12 weeks) and production (safe at scale every day, ongoing). Green go arrows connect them; dashed red arrows from the first three lead to a Stopped bar (no real pain, data or feasibility fails, no impact or adoption). The pilot can extend once. Below, a production-readiness track runs from the POC on: security review, SSO, data access, monitoring, evals in CI and a support owner.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="380" rx="14"/>
  <text class="h" x="28" y="40">Each stage answers one question and ends in a decision</text><text class="sub" x="28" y="62">Go, extend once (named gap, new date) or stop. Stopping is a valid outcome.</text><rect class="bp" x="28" y="90" width="162" height="84" rx="10" stroke-width="1.5"/><text class="lbl" x="109" y="114" text-anchor="middle">Demo</text><text class="sm" x="109" y="138" text-anchor="middle">Worth exploring?</text><text class="sm" x="109" y="156" text-anchor="middle">hours</text><line class="lno" x1="192" y1="132" x2="218" y2="132" marker-end="url(#aro)"/><text class="okt" x="206" y="124" text-anchor="middle" style="font-size:12px">go</text><line class="lnb dash" x1="109" y1="176" x2="109" y2="214" marker-end="url(#arb)"/><rect class="bp" x="222" y="90" width="162" height="84" rx="10" stroke-width="1.5"/><text class="lbl" x="303" y="114" text-anchor="middle">POC</text><text class="sm" x="303" y="138" text-anchor="middle">Works on their</text><text class="sm" x="303" y="156" text-anchor="middle">data? 1–4 weeks</text><line class="lno" x1="386" y1="132" x2="412" y2="132" marker-end="url(#aro)"/><text class="okt" x="400" y="124" text-anchor="middle" style="font-size:12px">go</text><line class="lnb dash" x1="303" y1="176" x2="303" y2="214" marker-end="url(#arb)"/><rect class="bp" x="416" y="90" width="162" height="84" rx="10" stroke-width="1.5"/><text class="lbl" x="497" y="114" text-anchor="middle">Pilot</text><text class="sm" x="497" y="138" text-anchor="middle">Moves the metric?</text><text class="sm" x="497" y="156" text-anchor="middle">4–12 weeks</text><line class="lno" x1="580" y1="132" x2="606" y2="132" marker-end="url(#aro)"/><text class="okt" x="594" y="124" text-anchor="middle" style="font-size:12px">go</text><line class="lnb dash" x1="497" y1="176" x2="497" y2="214" marker-end="url(#arb)"/><rect class="bo" x="610" y="90" width="162" height="84" rx="10" stroke-width="1.5"/><text class="lbl" x="691" y="114" text-anchor="middle">Production</text><text class="sm" x="691" y="138" text-anchor="middle">Safe at scale,</text><text class="sm" x="691" y="156" text-anchor="middle">every day? ongoing</text><rect class="bb" x="28" y="218" width="550" height="30" rx="15" stroke-width="1.2"/><text class="sm" x="44" y="238">Stopped: no real pain · data or feasibility fails · no impact or adoption</text><path class="lnw" d="M 456 90 C 456 66, 520 66, 520 88" marker-end="url(#arw)"/><text class="wrnt" x="530" y="78" style="font-size:12px">extend once</text><text class="sm" x="28" y="286" font-weight="700">Production-readiness track: start in week 0, not after the pilot</text><rect class="tea" x="222" y="298" width="550" height="34" rx="8"/><text class="on13" x="236" y="320">security review · SSO · data access · monitoring · evals in CI · support owner</text><text class="sub" x="28" y="320">from the POC on →</text><text class="sub" x="28" y="362">Most "pilot purgatory" is production work nobody started.</text>
</svg>
