<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Write-behind buffer and flush</title>
  <desc id="d">Animation in four steps. 1: the app sends HINCRBY to a Redis hash called views:pending for each view event and gets an immediate acknowledgement; counts grow to product 42: 3, product 7: 2, product 13: 1. 2: the flusher atomically renames views:pending to views:flushing, and new events start a fresh views:pending hash. 3: the flusher reads views:flushing and writes the database once with a batched upsert adding 3, 2 and 1 views. 4: it deletes views:flushing only after the database write succeeds. Until then the buffered counts exist only in Redis.</desc>
  <style>
    .arr{stroke:#64748b;stroke-width:1.8;fill:none}
    .ah{fill:#64748b}
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .pt{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:14px;font-weight:600}
    .body{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .panel{fill:#ffffff;stroke:#e2e8f0}
    .pri{fill:#4f46e5}.prs{stroke:#4f46e5}
    .teal{fill:#0ea5a4}.tls{stroke:#0ea5a4}
    .okf{fill:#16a34a}.oks{stroke:#16a34a}
    .badf{fill:#dc2626}.bads{stroke:#dc2626}
    .warnf{fill:#d97706}.warns{stroke:#d97706}
    .soft-ok{fill:#16a34a;fill-opacity:.14;stroke:#16a34a}
    .soft-bad{fill:#dc2626;fill-opacity:.12;stroke:#dc2626}
    .soft-warn{fill:#d97706;fill-opacity:.16;stroke:#d97706}
    .soft-pri{fill:#4f46e5;fill-opacity:.12;stroke:#4f46e5}
    .soft-teal{fill:#0ea5a4;fill-opacity:.14;stroke:#0ea5a4}
    .tl{fill:#ffffff;font-size:13px;font-weight:700}
    .tlb{fill:#ffffff;font-size:14px;font-weight:700}
    .prt{fill:#4f46e5;font-weight:700}
    .tealt{fill:#0f766e;font-weight:700}
    .okt{fill:#15803d;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}
    .warnt{fill:#b45309;font-weight:700}
    .dash{stroke-dasharray:5 4}
    @media (prefers-color-scheme: dark){
      .arr{stroke:#94a3b8}.ah{fill:#94a3b8}
      .card{fill:#1f2430;stroke:#334155}
      .h,.pt{fill:#f1f5f9}.lbl,.body,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .panel{fill:#171b24;stroke:#334155}
      .pri{fill:#818cf8}.prs{stroke:#818cf8}
      .teal{fill:#2dd4bf}.tls{stroke:#2dd4bf}
      .okf{fill:#4ade80}.oks{stroke:#4ade80}
      .badf{fill:#f87171}.bads{stroke:#f87171}
      .warnf{fill:#fbbf24}.warns{stroke:#fbbf24}
      .soft-ok{fill:#4ade80;stroke:#4ade80}
      .soft-bad{fill:#f87171;stroke:#f87171}
      .soft-warn{fill:#fbbf24;stroke:#fbbf24}
      .soft-pri{fill:#818cf8;stroke:#818cf8}
      .soft-teal{fill:#2dd4bf;stroke:#2dd4bf}
      .tl,.tlb{fill:#0f172a}
      .prt{fill:#a5b4fc}.tealt{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.warnt{fill:#fbbf24}
    }
    @keyframes kw5_8p5{0%,3.5%{opacity:0}5%,7.0%{opacity:1}8.5%,100%{opacity:0}}
    .w5_8p5{opacity:0;animation:kw5_8p5 12s infinite linear}
    @keyframes kw10_13p5{0%,8.5%{opacity:0}10%,12.0%{opacity:1}13.5%,100%{opacity:0}}
    .w10_13p5{opacity:0;animation:kw10_13p5 12s infinite linear}
    @keyframes kw15_18p5{0%,13.5%{opacity:0}15%,17.0%{opacity:1}18.5%,100%{opacity:0}}
    .w15_18p5{opacity:0;animation:kw15_18p5 12s infinite linear}
    @keyframes kw20_23p5{0%,18.5%{opacity:0}20%,22.0%{opacity:1}23.5%,100%{opacity:0}}
    .w20_23p5{opacity:0;animation:kw20_23p5 12s infinite linear}
    @keyframes kw25_28p5{0%,23.5%{opacity:0}25%,27.0%{opacity:1}28.5%,100%{opacity:0}}
    .w25_28p5{opacity:0;animation:kw25_28p5 12s infinite linear}
    @keyframes kw30_33p5{0%,28.5%{opacity:0}30%,32.0%{opacity:1}33.5%,100%{opacity:0}}
    .w30_33p5{opacity:0;animation:kw30_33p5 12s infinite linear}
    @keyframes kw50_53p5{0%,48.5%{opacity:0}50%,52.0%{opacity:1}53.5%,100%{opacity:0}}
    .w50_53p5{opacity:0;animation:kw50_53p5 12s infinite linear}
    @keyframes kw0_36{0%,34.5%{opacity:1}36%,97.5%{opacity:0}100%{opacity:1}}
    .w0_36{opacity:0;animation:kw0_36 12s infinite linear}
    @keyframes kw36_99{0%,34.5%{opacity:0}36%,97.5%{opacity:1}99%,100%{opacity:0}}
    .w36_99{opacity:0;animation:kw36_99 12s infinite linear}
    @keyframes kw5_99{0%,3.5%{opacity:0}5%,97.5%{opacity:1}99%,100%{opacity:0}}
    .w5_99{opacity:0;animation:kw5_99 12s infinite linear}
    @keyframes kw5_15{0%,3.5%{opacity:0}5%,13.5%{opacity:1}15%,100%{opacity:0}}
    .w5_15{opacity:0;animation:kw5_15 12s infinite linear}
    @keyframes kw15_25{0%,13.5%{opacity:0}15%,23.5%{opacity:1}25%,100%{opacity:0}}
    .w15_25{opacity:0;animation:kw15_25 12s infinite linear}
    @keyframes kw25_99{0%,23.5%{opacity:0}25%,97.5%{opacity:1}99%,100%{opacity:0}}
    .w25_99{opacity:0;animation:kw25_99 12s infinite linear}
    @keyframes kw10_99{0%,8.5%{opacity:0}10%,97.5%{opacity:1}99%,100%{opacity:0}}
    .w10_99{opacity:0;animation:kw10_99 12s infinite linear}
    @keyframes kw10_20{0%,8.5%{opacity:0}10%,18.5%{opacity:1}20%,100%{opacity:0}}
    .w10_20{opacity:0;animation:kw10_20 12s infinite linear}
    @keyframes kw20_99{0%,18.5%{opacity:0}20%,97.5%{opacity:1}99%,100%{opacity:0}}
    .w20_99{opacity:0;animation:kw20_99 12s infinite linear}
    @keyframes kw30_99{0%,28.5%{opacity:0}30%,97.5%{opacity:1}99%,100%{opacity:0}}
    .w30_99{opacity:0;animation:kw30_99 12s infinite linear}
    @keyframes kw40_96{0%,38.5%{opacity:0}40%,94.5%{opacity:1}96%,100%{opacity:0}}
