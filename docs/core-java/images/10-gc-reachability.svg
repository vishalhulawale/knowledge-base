<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Reachability from GC roots</title>
  <desc id="d">Two GC roots, a local variable order on a thread stack and a static field CACHE. The collector traces references from them: Order and Map first, then Customer, List and Plan, then Item. These are marked live. Temp is referenced by nothing, and Session and Token reference each other but no root reaches them, so all three stay unmarked, are treated as garbage, and are reclaimed. The cycle does not keep them alive.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .body{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .root{fill:#334155}.rt{fill:#ffffff;font-size:13px;font-weight:700}
    .node{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}
    .live{fill:#dcfce7;stroke:#16a34a;stroke-width:2.5}
    .dead{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}
    .nt{fill:#0f172a;font-size:14px;font-weight:600}.dt{fill:#991b1b;font-size:14px;font-weight:700}
    .e{stroke:#64748b;stroke-width:1.8;fill:none}.eh{fill:#64748b}
    .ok{fill:#16a34a;font-size:14px;font-weight:700}.bad{fill:#dc2626;font-size:14px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.body{fill:#e2e8f0}.sub{fill:#94a3b8}
      .root{fill:#e2e8f0}.rt{fill:#0f172a}
      .node{fill:#111827;stroke:#64748b}.nt{fill:#f1f5f9}
      .live{fill:#052e16;stroke:#4ade80}.dead{fill:#450a0a;stroke:#f87171}.dt{fill:#fecaca}
      .e{stroke:#94a3b8}.eh{fill:#94a3b8}.ok{fill:#4ade80}.bad{fill:#f87171}
    }
    /* 10 s loop: mark waves at 14, 28, 42%; garbage at 56%; reclaimed at 75%; reset 97% */
    .a{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:linear}
    @keyframes mOrder{0%,13%{opacity:0}15%,95%{opacity:1}97%,100%{opacity:0}}
  @keyframes mMap{0%,13%{opacity:0}15%,95%{opacity:1}97%,100%{opacity:0}}
  @keyframes mCustomer{0%,27%{opacity:0}29%,95%{opacity:1}97%,100%{opacity:0}}
  @keyframes mList{0%,27%{opacity:0}29%,95%{opacity:1}97%,100%{opacity:0}}
  @keyframes mPlan{0%,27%{opacity:0}29%,95%{opacity:1}97%,100%{opacity:0}}
  @keyframes mItem{0%,41%{opacity:0}43%,95%{opacity:1}97%,100%{opacity:0}}
  @keyframes red{0%,55%{opacity:0}57%,95%{opacity:1}97%,100%{opacity:0}}
  @keyframes fade{0%,73%{opacity:1}76%,95%{opacity:.15}97%,100%{opacity:1}}
  @keyframes s1{0%,1%{opacity:0}3%,54%{opacity:1}56%,100%{opacity:0}}
  @keyframes s2{0%,55%{opacity:0}57%,73%{opacity:1}75%,100%{opacity:0}}
  @keyframes s3{0%,74%{opacity:0}76%,95%{opacity:1}97%,100%{opacity:0}}
    .gg{animation:fade 10s infinite linear}
    @media (prefers-reduced-motion: reduce){
      .a,.gg{animation:none !important}
      .st1,.st3{opacity:0}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="418" rx="14"/>
  <text class="h" x="28" y="40">Garbage = not reachable from a GC root</text>
  <g class="a st1" style="animation-name:s1"><text class="ok" x="28" y="64">Mark: follow references outward from the roots</text></g>
  <g class="a st2" style="animation-name:s2"><text class="bad" x="28" y="64">Unmarked objects are garbage, even the Session ⇄ Token cycle</text></g>
  <g class="a st3" style="animation-name:s3"><text class="sub" x="28" y="64">Their memory is reclaimed; when exactly is up to the collector</text></g>

  <text class="lbl" x="40" y="92">GC roots</text>
  <rect class="root" x="40" y="100" width="150" height="40" rx="8"/><text class="rt" x="115" y="125" text-anchor="middle">stack: order</text>
  <rect class="root" x="40" y="230" width="150" height="40" rx="8"/><text class="rt" x="115" y="255" text-anchor="middle">static CACHE</text>
  <line class="e" x1="190" y1="120" x2="227.0" y2="120.0"/><path class="eh" d="M238.0 120.0 L227.0 125.0 L227.0 115.0 Z"/>
  <line class="e" x1="190" y1="250" x2="227.0" y2="250.0"/><path class="eh" d="M238.0 250.0 L227.0 255.0 L227.0 245.0 Z"/>
  <line class="e" x1="380" y1="112" x2="417.9" y2="96.8"/><path class="eh" d="M428.1 92.7 L419.8 101.5 L416.1 92.2 Z"/>
  <line class="e" x1="380" y1="128" x2="417.9" y2="143.2"/><path class="eh" d="M428.1 147.3 L416.1 147.8 L419.8 138.5 Z"/>
  <line class="e" x1="570" y1="150" x2="607.0" y2="150.0"/><path class="eh" d="M618.0 150.0 L607.0 155.0 L607.0 145.0 Z"/>
  <line class="e" x1="380" y1="250" x2="417.0" y2="250.0"/><path class="eh" d="M428.0 250.0 L417.0 255.0 L417.0 245.0 Z"/>
  <path class="e" d="M570 312 Q595 296 610 312"/><path class="eh" d="M620 318 L607 316 L613 306 Z"/>
  <path class="e" d="M620 330 Q595 346 580 330"/><path class="eh" d="M570 324 L583 326 L577 336 Z"/>
  
  <rect class="node" x="240" y="100" width="140" height="40" rx="8"/><g class="a" style="animation-name:mOrder"><rect class="live" x="240" y="100" width="140" height="40" rx="8"/></g><text class="nt" x="310.0" y="125" text-anchor="middle">Order</text>
  <rect class="node" x="430" y="70" width="140" height="40" rx="8"/><g class="a" style="animation-name:mCustomer"><rect class="live" x="430" y="70" width="140" height="40" rx="8"/></g><text class="nt" x="500.0" y="95" text-anchor="middle">Customer</text>
  <rect class="node" x="430" y="130" width="140" height="40" rx="8"/><g class="a" style="animation-name:mList"><rect class="live" x="430" y="130" width="140" height="40" rx="8"/></g><text class="nt" x="500.0" y="155" text-anchor="middle">List</text>
  <rect class="node" x="620" y="130" width="140" height="40" rx="8"/><g class="a" style="animation-name:mItem"><rect class="live" x="620" y="130" width="140" height="40" rx="8"/></g><text class="nt" x="690.0" y="155" text-anchor="middle">Item</text>
  <rect class="node" x="240" y="230" width="140" height="40" rx="8"/><g class="a" style="animation-name:mMap"><rect class="live" x="240" y="230" width="140" height="40" rx="8"/></g><text class="nt" x="310.0" y="255" text-anchor="middle">Map</text>
  <rect class="node" x="430" y="230" width="140" height="40" rx="8"/><g class="a" style="animation-name:mPlan"><rect class="live" x="430" y="230" width="140" height="40" rx="8"/></g><text class="nt" x="500.0" y="255" text-anchor="middle">Plan</text>
  <g class="gg">
  <rect class="node" x="620" y="60" width="140" height="40" rx="8"/><text class="nt" x="690.0" y="85" text-anchor="middle">Temp</text><g class="a" style="animation-name:red"><rect class="dead" x="620" y="60" width="140" height="40" rx="8"/><text class="dt" x="690.0" y="85" text-anchor="middle">Temp</text></g>
  <rect class="node" x="430" y="300" width="140" height="40" rx="8"/><text class="nt" x="500.0" y="325" text-anchor="middle">Session</text><g class="a" style="animation-name:red"><rect class="dead" x="430" y="300" width="140" height="40" rx="8"/><text class="dt" x="500.0" y="325" text-anchor="middle">Session</text></g>
  <rect class="node" x="620" y="300" width="140" height="40" rx="8"/><text class="nt" x="690.0" y="325" text-anchor="middle">Token</text><g class="a" style="animation-name:red"><rect class="dead" x="620" y="300" width="140" height="40" rx="8"/><text class="dt" x="690.0" y="325" text-anchor="middle">Token</text></g>
  </g>
  <text class="sub" x="28" y="376">Java traces from roots; it does not count references. Roots include thread stacks, static fields,</text>
  <text class="sub" x="28" y="396">JNI references and objects held as monitors.</text>
</svg>
