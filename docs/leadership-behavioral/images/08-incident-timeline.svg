<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">An incident timeline and the action items that shrink it</title>
  <desc id="d">The error rate on a timeline from 10:00 to 10:30, using the page's postmortem template. The deploy completes at 10:02 and errors jump. The p95 alert fires at 10:09, SEV2 is declared at 10:12, rollback starts at 10:20 and errors are normal at 10:27. Brackets show 7 minutes to detect, 3 minutes to triage and declare, and 15 minutes to mitigate. Below, each action item type is placed where it helps: prevent (load test in CI, per-upstream timeouts) stops the incident before 10:02, detect (alert on p95 latency) shortens the 7 minutes, and mitigate (rollback runbook, automated rollback) shortens the 15 minutes.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .sub{fill:#64748b;font-size:13px}
    .area{fill:#fee2e2}
    .err{fill:none;stroke:#dc2626;stroke-width:3;stroke-linejoin:round}
    .axl{stroke:#94a3b8}
    .ev{stroke:#94a3b8;stroke-dasharray:3 4}
    .ax{fill:#64748b;font-size:13px}
    .et{fill:#0f172a;font-size:13px;font-weight:600}
    .cov{fill:#f8fafc}
    .br{stroke:#4f46e5;stroke-width:2;fill:none}
    .bt{fill:#4f46e5;font-size:13px;font-weight:700}
    .chip{fill:#ffffff;stroke:#0ea5a4;stroke-width:1.5}
    .ct{fill:#0f766e;font-size:13px;font-weight:700}
    .cb{fill:#334155;font-size:13px}
    .yl{fill:#dc2626;font-size:13px;font-weight:600}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.sub,.ax{fill:#94a3b8}
      .area{fill:#450a0a}.err{stroke:#f87171}.yl{fill:#f87171}
      .axl,.ev{stroke:#64748b}.et{fill:#f1f5f9}.cov{fill:#1f2430}
      .br{stroke:#818cf8}.bt{fill:#a5b4fc}
      .chip{fill:#111827;stroke:#2dd4bf}.ct{fill:#5eead4}.cb{fill:#e2e8f0}
    }
    /* 10 s loop: the timeline is revealed left to right (0-60%), then the action items appear */
    .cov{transform-box:fill-box;transform-origin:right center;animation:wipe 10s linear infinite}
    @keyframes wipe{0%{transform:scaleX(1)}60%,95%{transform:scaleX(0)}100%{transform:scaleX(1)}}
    .late{opacity:0;animation:late 10s linear infinite}
    @keyframes late{0%,62%{opacity:0}66%,95%{opacity:1}100%{opacity:0}}
    .late2{opacity:0;animation:late2 10s linear infinite}
    @keyframes late2{0%,70%{opacity:0}74%,95%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.cov{animation:none;transform:scaleX(0)}.late,.late2{animation:none;opacity:1}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="438" rx="14"/>
  <text class="h" x="28" y="40">Read the timeline, then shrink each segment</text>
  <text class="sub" x="28" y="62">Every action item targets one part of the incident: before it, detection, or mitigation.</text>

  <!-- chart: x = 140 + 20 px per minute after 10:00 -->
  <text class="yl" x="28" y="118">Error rate</text>
  <path class="area" d="M180 220 L215 112 L540 112 L680 220 Z"/>
  <path class="err" d="M140 220 L180 220 L215 112 L540 112 L680 220 L740 220"/>
  <line class="axl" x1="140" y1="228" x2="740" y2="228"/>
  <g>
    <line class="ev" x1="180" y1="96" x2="180" y2="228"/><line class="ev" x1="320" y1="96" x2="320" y2="228"/>
    <line class="ev" x1="380" y1="96" x2="380" y2="228"/><line class="ev" x1="540" y1="96" x2="540" y2="228"/>
    <line class="ev" x1="680" y1="96" x2="680" y2="228"/>
  </g>
  <g class="ax" text-anchor="middle">
    <text x="180" y="246">10:02</text><text x="320" y="246">10:09</text><text x="380" y="246">10:12</text>
    <text x="540" y="246">10:20</text><text x="680" y="246">10:27</text>
  </g>
  <g class="et">
    <text x="180" y="266" text-anchor="middle">Deploy</text><text x="180" y="282" text-anchor="middle">completes</text>
    <text x="330" y="266" text-anchor="end">p95 alert</text><text x="330" y="282" text-anchor="end">fires</text>
    <text x="372" y="266">SEV2 declared,</text><text x="372" y="282">IC named</text>
    <text x="540" y="266" text-anchor="middle">Rollback</text><text x="540" y="282" text-anchor="middle">started</text>
    <text x="680" y="266" text-anchor="middle">Errors</text><text x="680" y="282" text-anchor="middle">normal</text>
  </g>
  <rect class="cov" x="160" y="90" width="590" height="200"/>

  <!-- segments -->
  <g class="late">
    <path class="br" d="M182 300 v8 h136 v-8"/><text class="bt" x="250" y="326" text-anchor="middle">Detect: 7 min</text>
    <path class="br" d="M322 300 v8 h56 v-8"/><text class="bt" x="350" y="326" text-anchor="middle">3 min</text>
    <path class="br" d="M382 300 v8 h296 v-8"/><text class="bt" x="530" y="326" text-anchor="middle">Mitigate: 15 min</text>
  </g>
  <g class="late2">
    <rect class="chip" x="28" y="344" width="146" height="58" rx="10"/>
    <text class="ct" x="40" y="365">Prevent</text>
    <text class="cb" x="40" y="383">load test in CI,</text>
    <text class="cb" x="40" y="398">timeouts</text>
    <rect class="chip" x="184" y="344" width="136" height="58" rx="10"/>
    <text class="ct" x="196" y="365">Detect faster</text>
    <text class="cb" x="196" y="383">alert on p95,</text>
    <text class="cb" x="196" y="398">not CPU</text>
    <rect class="chip" x="400" y="344" width="260" height="58" rx="10"/>
    <text class="ct" x="412" y="365">Mitigate faster</text>
    <text class="cb" x="412" y="383">runbook, automated rollback,</text>
    <text class="cb" x="412" y="398">breaker on the slow upstream</text>
  </g>
  <text class="sub" x="28" y="426">Times from the page's postmortem template, as an example. Each action item needs an owner and a date.</text>
</svg>
