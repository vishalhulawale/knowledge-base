<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 352" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">ArrayList growth: why add is amortised O(1)</title>
  <desc id="d">An ArrayList starts with capacity 10. Adds 1 to 10 fill it. Add number 11 allocates a new array of capacity 15 and copies the 10 existing elements. Adds 12 to 15 are cheap. Add 16 allocates 22 and copies 15. Add 23 allocates 33 and copies 22. After 23 adds there were 3 resizes and 47 copied elements, about 2 copies per add, which stays constant as n grows (2.43 per add measured over 1,000,000 adds).</desc>
