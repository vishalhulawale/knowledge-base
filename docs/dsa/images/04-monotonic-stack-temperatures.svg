e. Days 6 and 7 are</text><text class="t" x="560" y="276">still waiting: their answer is 0.</text></g>
  <text class="m" x="28" y="404">Indigo = current day, amber = on the stack, green = popped now. Each day is pushed and popped once: O(n).</text>
</svg>
