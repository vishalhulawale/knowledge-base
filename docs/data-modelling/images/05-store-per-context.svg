<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 452" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Store per context map</title>
  <desc id="d">A map of an illustrative online pharmacy platform. Five services each own one system of record: Members in MongoDB for profiles, Orders in PostgreSQL with an outbox, Claims in PostgreSQL with an outbox, Catalog in PostgreSQL for drugs and prices, and Documents in S3. Changes flow via outbox or change data capture into Kafka, keyed by entity id, which feeds four derived stores drawn dashed: OpenSearch for drug and order search, Redis for sessions and reference data, an order history read model, and a warehouse for analytics. Solid boxes are sources of truth with one writer; dashed boxes are rebuildable and may lag.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="450" rx="14"/>
  <text class="h" x="28" y="40">One source of truth per fact, derived stores downstream</text><text class="sub" x="28" y="62">An online pharmacy platform (illustrative).</text><rect class="bp" x="28" y="82" width="140" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="98" y="104" text-anchor="middle" font-weight="700">Members service</text><line class="lnp" x1="98" y1="116" x2="98" y2="132" marker-end="url(#arp)"/><rect class="box" x="28" y="134" width="140" height="56" rx="8" stroke-width="2"/><text class="lbl" x="98" y="157" text-anchor="middle">MongoDB</text><text class="sub" x="98" y="177" text-anchor="middle">profiles</text><line class="ln" x1="98" y1="190" x2="98" y2="222" marker-end="url(#ar)"/><rect class="bp" x="178" y="82" width="140" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="248" y="104" text-anchor="middle" font-weight="700">Orders service</text><line class="lnp" x1="248" y1="116" x2="248" y2="132" marker-end="url(#arp)"/><rect class="box" x="178" y="134" width="140" height="56" rx="8" stroke-width="2"/><text class="lbl" x="248" y="157" text-anchor="middle">PostgreSQL</text><text class="sub" x="248" y="177" text-anchor="middle">orders + outbox</text><line class="ln" x1="248" y1="190" x2="248" y2="222" marker-end="url(#ar)"/><rect class="bp" x="328" y="82" width="140" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="398" y="104" text-anchor="middle" font-weight="700">Claims service</text><line class="lnp" x1="398" y1="116" x2="398" y2="132" marker-end="url(#arp)"/><rect class="box" x="328" y="134" width="140" height="56" rx="8" stroke-width="2"/><text class="lbl" x="398" y="157" text-anchor="middle">PostgreSQL</text><text class="sub" x="398" y="177" text-anchor="middle">claims + outbox</text><line class="ln" x1="398" y1="190" x2="398" y2="222" marker-end="url(#ar)"/><rect class="bp" x="478" y="82" width="140" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="548" y="104" text-anchor="middle" font-weight="700">Catalog service</text><line class="lnp" x1="548" y1="116" x2="548" y2="132" marker-end="url(#arp)"/><rect class="box" x="478" y="134" width="140" height="56" rx="8" stroke-width="2"/><text class="lbl" x="548" y="157" text-anchor="middle">PostgreSQL</text><text class="sub" x="548" y="177" text-anchor="middle">drugs, prices</text><line class="ln" x1="548" y1="190" x2="548" y2="222" marker-end="url(#ar)"/><rect class="bp" x="628" y="82" width="140" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="698" y="104" text-anchor="middle" font-weight="700">Documents service</text><line class="lnp" x1="698" y1="116" x2="698" y2="132" marker-end="url(#arp)"/><rect class="box" x="628" y="134" width="140" height="56" rx="8" stroke-width="2"/><text class="lbl" x="698" y="157" text-anchor="middle">S3</text><text class="sub" x="698" y="177" text-anchor="middle">scans, PDFs</text><text class="sub" x="772" y="208" text-anchor="end">outbox / CDC</text><rect class="bw" x="28" y="224" width="590" height="34" rx="8" stroke-width="1.5"/><text class="lbl" x="323" y="246" text-anchor="middle">Kafka: events keyed by entity id</text><line class="ln" x1="114" y1="258" x2="114" y2="302" marker-end="url(#ar)"/><rect class="box" x="28" y="304" width="172" height="56" rx="8" stroke-width="1.5" stroke-dasharray="6 4"/><text class="lbl" x="114" y="327" text-anchor="middle">OpenSearch</text><text class="sub" x="114" y="347" text-anchor="middle">drug + order search</text><line class="ln" x1="304" y1="258" x2="304" y2="302" marker-end="url(#ar)"/><rect class="box" x="218" y="304" width="172" height="56" rx="8" stroke-width="1.5" stroke-dasharray="6 4"/><text class="lbl" x="304" y="327" text-anchor="middle">Redis</text><text class="sub" x="304" y="347" text-anchor="middle">sessions, reference data</text><line class="ln" x1="494" y1="258" x2="494" y2="302" marker-end="url(#ar)"/><rect class="box" x="408" y="304" width="172" height="56" rx="8" stroke-width="1.5" stroke-dasharray="6 4"/><text class="lbl" x="494" y="327" text-anchor="middle">Order history</text><text class="sub" x="494" y="347" text-anchor="middle">read model</text><line class="ln" x1="600" y1="258" x2="684" y2="302" marker-end="url(#ar)"/><rect class="box" x="598" y="304" width="172" height="56" rx="8" stroke-width="1.5" stroke-dasharray="6 4"/><text class="lbl" x="684" y="327" text-anchor="middle">Warehouse</text><text class="sub" x="684" y="347" text-anchor="middle">analytics via CDC</text><rect class="box" x="28" y="384" width="22" height="16" rx="4" stroke-width="2"/><text class="sm" x="58" y="397">source of truth: one writer, backed up and restored</text><rect class="box" x="420" y="384" width="22" height="16" rx="4" stroke-width="1.5" stroke-dasharray="4 3"/><text class="sm" x="450" y="397">derived: rebuildable, may lag</text><text class="sm" x="28" y="432">No service writes another service's store, and nothing writes a derived store except its projector.</text>
</svg>
