<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Air-gapped install preflight</title>
  <desc id="d">Animation: a values file copied from the hosted profile into an air-gapped install is checked line by line. Six settings fail in turn: llm.provider bedrock is not allowed, telemetry is enabled, the global image registry is empty instead of the internal mirror, the model endpoint host is empty, the OIDC issuer is the public login.microsoftonline.com, and the image digest is not pinned. The install is refused in seconds with nothing deployed; without a preflight the same problems appear as start-up failures inside the enclave, debugged only through exported logs.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes f0{0%,7.99%{opacity:0}8%,96.99%{opacity:1}97%,100%{opacity:0}}.f0{animation-name:f0}
    @keyframes f1{0%,16.99%{opacity:0}17%,96.99%{opacity:1}97%,100%{opacity:0}}.f1{animation-name:f1}
    @keyframes f2{0%,25.99%{opacity:0}26%,96.99%{opacity:1}97%,100%{opacity:0}}.f2{animation-name:f2}
    @keyframes f3{0%,34.99%{opacity:0}35%,96.99%{opacity:1}97%,100%{opacity:0}}.f3{animation-name:f3}
    @keyframes f4{0%,43.99%{opacity:0}44%,96.99%{opacity:1}97%,100%{opacity:0}}.f4{animation-name:f4}
    @keyframes f5{0%,52.99%{opacity:0}53%,96.99%{opacity:1}97%,100%{opacity:0}}.f5{animation-name:f5}
    @keyframes v{0%,65.99%{opacity:0}66%,96.99%{opacity:1}97%,100%{opacity:0}}.v{animation-name:v}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="422" rx="14"/>
  <text class="h" x="28" y="40">Preflight: refuse the install, not the enclave</text><text class="sub" x="28" y="62">A values file copied from the hosted profile into an air-gapped install. Checks from profile_check.py on this page.</text><rect class="box" x="28" y="80" width="368" height="252" rx="10" stroke-width="1.2"/><text class="sm" x="42" y="104" font-weight="700">values.yaml (copied from hosted)</text><text class="mono" x="42" y="132" xml:space="preserve" style="font-size:12px">mode: air-gapped</text><rect class="box" x="412" y="80" width="360" height="252" rx="10" stroke-width="1.2"/><text class="sm" x="426" y="104" font-weight="700">preflight result</text><g class="k f0"><rect class="bb" x="34" y="147" width="356" height="22" rx="4" stroke-width="0.8"/></g><text class="mono" x="42" y="162" xml:space="preserve" style="font-size:12px">llm.provider: bedrock</text><g class="k f0"><rect class="badf" x="424" y="147" width="42" height="21" rx="4"/><text class="on13" x="445" y="162" text-anchor="middle" style="font-size:11px">FAIL</text><text class="sm" x="474" y="162">llm.provider=bedrock not allowed</text><line class="lnb" x1="392" y1="158" x2="420" y2="158" marker-end="url(#arb)"/></g><g class="k f1"><rect class="bb" x="34" y="175" width="356" height="22" rx="4" stroke-width="0.8"/></g><text class="mono" x="42" y="190" xml:space="preserve" style="font-size:12px">telemetry.enabled: true</text><g class="k f1"><rect class="badf" x="424" y="175" width="42" height="21" rx="4"/><text class="on13" x="445" y="190" text-anchor="middle" style="font-size:11px">FAIL</text><text class="sm" x="474" y="190">telemetry must be disabled</text><line class="lnb" x1="392" y1="186" x2="420" y2="186" marker-end="url(#arb)"/></g><g class="k f2"><rect class="bb" x="34" y="203" width="356" height="22" rx="4" stroke-width="0.8"/></g><text class="mono" x="42" y="218" xml:space="preserve" style="font-size:12px">global.imageRegistry: ""</text><g class="k f2"><rect class="badf" x="424" y="203" width="42" height="21" rx="4"/><text class="on13" x="445" y="218" text-anchor="middle" style="font-size:11px">FAIL</text><text class="sm" x="474" y="218">imageRegistry must be the internal mirror</text><line class="lnb" x1="392" y1="214" x2="420" y2="214" marker-end="url(#arb)"/></g><g class="k f3"><rect class="bb" x="34" y="231" width="356" height="22" rx="4" stroke-width="0.8"/></g><text class="mono" x="42" y="246" xml:space="preserve" style="font-size:12px">llm.endpoint: ""</text><g class="k f3"><rect class="badf" x="424" y="231" width="42" height="21" rx="4"/><text class="on13" x="445" y="246" text-anchor="middle" style="font-size:11px">FAIL</text><text class="sm" x="474" y="246">llm.endpoint host '' is not internal</text><line class="lnb" x1="392" y1="242" x2="420" y2="242" marker-end="url(#arb)"/></g><g class="k f4"><rect class="bb" x="34" y="259" width="356" height="22" rx="4" stroke-width="0.8"/></g><text class="mono" x="42" y="274" xml:space="preserve" style="font-size:12px">auth.oidc.issuerUri: login.microsoftonline.com</text><g class="k f4"><rect class="badf" x="424" y="259" width="42" height="21" rx="4"/><text class="on13" x="445" y="274" text-anchor="middle" style="font-size:11px">FAIL</text><text class="sm" x="474" y="274">issuerUri host is not internal</text><line class="lnb" x1="392" y1="270" x2="420" y2="270" marker-end="url(#arb)"/></g><g class="k f5"><rect class="bb" x="34" y="287" width="356" height="22" rx="4" stroke-width="0.8"/></g><text class="mono" x="42" y="302" xml:space="preserve" style="font-size:12px">image.digest: ""</text><g class="k f5"><rect class="badf" x="424" y="287" width="42" height="21" rx="4"/><text class="on13" x="445" y="302" text-anchor="middle" style="font-size:11px">FAIL</text><text class="sm" x="474" y="302">image.digest must be pinned</text><line class="lnb" x1="392" y1="298" x2="420" y2="298" marker-end="url(#arb)"/></g><g class="k v"><rect class="bo" x="28" y="346" width="744" height="58" rx="8" stroke-width="1.5"/><text class="okt" x="42" y="369" style="font-size:14px">6 problems found in seconds; nothing deployed. Fix the values file and rerun.</text><text class="sm" x="42" y="391">Without the preflight these surface as start-up failures inside the enclave, debugged only via exported logs.</text></g>
</svg>
