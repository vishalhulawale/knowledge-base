<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Eager vs cooperative rebalance when a consumer joins</title>
  <desc id="d">A group of two consumers owns six partitions: C1 has P0, P1 and P2, and C2 has P3, P4 and P5. A third consumer, C3, joins. With the eager protocol every consumer revokes all its partitions and stops until the new assignment arrives, so nothing is consumed during the rebalance. With the cooperative sticky protocol only the partitions that move, P2 and P5, are revoked; C1 keeps P0 and P1 and C2 keeps P3 and P4 and they carry on processing. In both cases the final assignment is C1 P0 P1, C2 P3 P4, C3 P2 P5.</desc>
