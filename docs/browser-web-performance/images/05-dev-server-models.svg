<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Bundle-first vs native-ESM dev server start-up</title>
  <desc id="d">Two development servers starting the same React app side by side. On the left, a bundle-first dev server such as webpack's reads and transforms all 1,200 modules, shown as 40 squares of about 30 modules each filling row by row while a progress bar fills; only when the whole graph is bundled into memory does it report server ready, and an edit to Button.tsx triggers a rebuild of the affected chunk before the update is pushed. On the right, a native ES module dev server such as Vite pre-bundles node_modules once and reports ready almost at once; the browser then requests main.tsx, App.tsx, routes.tsx, Claims.tsx and Button.tsx, and only those five squares light up because only requested files are transformed. Editing Button.tsx sends one hot module replacement update for that one module. Simplified: timings are illustrative, not measurements, and webpack's persistent cache shortens warm restarts.</desc>
