  <polyline class="s3" points="38.0,208.0 54.5,207.3 71.0,204.4 87.5,198.0 104.0,198.2 120.5,194.6 137.0,193.8 153.5,190.2 170.0,188.3 186.5,185.9 203.0,182.2 219.5,179.6 236.0,175.5 252.5,174.1 269.0,170.2 285.5,168.1 302.0,164.9 318.5,164.0 335.0,164.1 351.5,157.9 368.0,157.2"/>
  <text class="lbl" x="408" y="96">One partition rising</text>
  <text class="sm" x="408" y="114">stuck record or hot key</text>
  <line class="axis" x1="418" x2="748" y1="214" y2="214"/>
  <polyline class="ctx" points="418.0,209.7 434.5,207.2 451.0,207.4 467.5,209.1 484.0,208.3 500.5,210.8 517.0,207.5 533.5,208.7 550.0,210.1 566.5,211.2 583.0,207.0 599.5,206.2 616.0,210.8 632.5,207.0 649.0,209.0 665.5,210.2 682.0,209.4 698.5,206.9 715.0,206.2 731.5,210.4 748.0,208.0"/>
