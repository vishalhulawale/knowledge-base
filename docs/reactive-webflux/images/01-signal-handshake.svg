<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 462" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Reactive Streams handshake</title>
  <desc id="d">Animation: a subscriber calls subscribe on a publisher and receives a subscription in onSubscribe. A demand counter starts at zero. The subscriber requests two items, the publisher sends a and b, and the counter drops to zero, at which point the publisher waits. The subscriber requests two more, the publisher sends c, then signals onComplete, leaving one request unused. A side panel lists the rules: at most one terminal signal, never emit more than requested, and signals are delivered serially.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes p0{0%,99.99%{opacity:1}100%,100%{opacity:0}}.p0{animation-name:p0}
    @keyframes d0{0%,11.99%{opacity:1}12%,100%{opacity:0}}.d0{animation-name:d0}
    @keyframes p1{0%,11.99%{opacity:0}12%,100%{opacity:1}}.p1{animation-name:p1}
    @keyframes d1{0%,11.99%{opacity:0}12%,23.99%{opacity:1}24%,100%{opacity:0}}.d1{animation-name:d1}
    @keyframes p2{0%,23.99%{opacity:0}24%,100%{opacity:1}}.p2{animation-name:p2}
    @keyframes d2{0%,23.99%{opacity:0}24%,35.99%{opacity:1}36%,100%{opacity:0}}.d2{animation-name:d2}
    @keyframes p3{0%,35.99%{opacity:0}36%,100%{opacity:1}}.p3{animation-name:p3}
    @keyframes d3{0%,35.99%{opacity:0}36%,45.99%{opacity:1}46%,100%{opacity:0}}.d3{animation-name:d3}
    @keyframes p4{0%,45.99%{opacity:0}46%,100%{opacity:1}}.p4{animation-name:p4}
    @keyframes d4{0%,45.99%{opacity:0}46%,57.99%{opacity:1}58%,100%{opacity:0}}.d4{animation-name:d4}
    @keyframes p5{0%,57.99%{opacity:0}58%,100%{opacity:1}}.p5{animation-name:p5}
    @keyframes d5{0%,57.99%{opacity:0}58%,69.99%{opacity:1}70%,100%{opacity:0}}.d5{animation-name:d5}
    @keyframes p6{0%,69.99%{opacity:0}70%,100%{opacity:1}}.p6{animation-name:p6}
    @keyframes d6{0%,69.99%{opacity:0}70%,81.99%{opacity:1}82%,100%{opacity:0}}.d6{animation-name:d6}
    @keyframes p7{0%,81.99%{opacity:0}82%,100%{opacity:1}}.p7{animation-name:p7}
    @keyframes d7{0%,81.99%{opacity:0}82%,100%{opacity:1}}.d7{animation-name:d7}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}.d0{opacity:0}.d1{opacity:0}.d2{opacity:0}.d3{opacity:0}.d4{opacity:0}.d5{opacity:0}.d6{opacity:0}.d7{opacity:0}.d4{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="460" rx="14"/>
  <text class="h" x="28" y="40">The Reactive Streams handshake</text><text class="sub" x="28" y="62">Items flow only while outstanding demand is above zero.</text><rect class="bp" x="80" y="82" width="160" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="160" y="107" text-anchor="middle">Subscriber</text><rect class="bt" x="440" y="82" width="160" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="520" y="107" text-anchor="middle">Publisher</text><line class="grid dash" x1="160" y1="122" x2="160" y2="412"/><line class="grid dash" x1="520" y1="122" x2="520" y2="412"/><rect class="bm" x="616" y="82" width="164" height="150" rx="10" stroke-width="1.2"/><text class="lbl" x="698" y="106" text-anchor="middle">Demand</text><g class="k p0"><line class="lnp" x1="164" y1="150" x2="514" y2="150" marker-end="url(#arp)"/><text class="mono" x="340" y="143" text-anchor="middle" xml:space="preserve">subscribe(subscriber)</text></g><g class="k d0"><text class="sm" x="698" y="150" text-anchor="middle">no subscription yet</text></g><g class="k p1"><line class="lnt dash" x1="516" y1="184" x2="166" y2="184" marker-end="url(#art)"/><text class="mono" x="340" y="177" text-anchor="middle" xml:space="preserve">onSubscribe(subscription)</text></g><g class="k d1"><text class="badt" x="698" y="160" text-anchor="middle" style="font-size:44px">0</text><text class="sm" x="698" y="192" text-anchor="middle">nothing requested</text></g><g class="k p2"><line class="lnp" x1="164" y1="218" x2="514" y2="218" marker-end="url(#arp)"/><text class="mono" x="340" y="211" text-anchor="middle" xml:space="preserve">request(2)</text></g><g class="k d2"><text class="prit" x="698" y="160" text-anchor="middle" style="font-size:44px">2</text></g><g class="k p3"><line class="lnt" x1="516" y1="252" x2="166" y2="252" marker-end="url(#art)"/><text class="mono" x="340" y="245" text-anchor="middle" xml:space="preserve">onNext(a)</text></g><g class="k d3"><text class="prit" x="698" y="160" text-anchor="middle" style="font-size:44px">1</text></g><g class="k p4"><line class="lnt" x1="516" y1="286" x2="166" y2="286" marker-end="url(#art)"/><text class="mono" x="340" y="279" text-anchor="middle" xml:space="preserve">onNext(b)</text></g><g class="k d4"><text class="badt" x="698" y="160" text-anchor="middle" style="font-size:44px">0</text><text class="sm" x="698" y="192" text-anchor="middle">publisher waits</text></g><g class="k p5"><line class="lnp" x1="164" y1="320" x2="514" y2="320" marker-end="url(#arp)"/><text class="mono" x="340" y="313" text-anchor="middle" xml:space="preserve">request(2)</text></g><g class="k d5"><text class="prit" x="698" y="160" text-anchor="middle" style="font-size:44px">2</text></g><g class="k p6"><line class="lnt" x1="516" y1="354" x2="166" y2="354" marker-end="url(#art)"/><text class="mono" x="340" y="347" text-anchor="middle" xml:space="preserve">onNext(c)</text></g><g class="k d6"><text class="prit" x="698" y="160" text-anchor="middle" style="font-size:44px">1</text></g><g class="k p7"><line class="lno" x1="516" y1="388" x2="166" y2="388" marker-end="url(#aro)"/><text class="mono" x="340" y="381" text-anchor="middle" xml:space="preserve">onComplete()</text></g><g class="k d7"><text class="sm" x="698" y="150" text-anchor="middle">done:</text><text class="sm" x="698" y="168" text-anchor="middle">1 request unused</text></g><rect class="bw" x="616" y="248" width="164" height="164" rx="10" stroke-width="1.2"/><text class="sm" x="630" y="274">Rules</text><text class="sm" x="630" y="296">• at most one terminal</text><text class="sm" x="630" y="318">  signal</text><text class="sm" x="630" y="340">• never emit more</text><text class="sm" x="630" y="362">  than requested</text><text class="sm" x="630" y="384">• signals are serial</text><text class="sm" x="28" y="440">Subscribing builds the link; request(n) starts the flow; onComplete or onError ends it.</text>
</svg>
