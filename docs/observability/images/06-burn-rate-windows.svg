    @media (prefers-color-scheme: dark){.cover{fill:#1f2430}}
    @keyframes sweep{0%{transform:translateX(0)}80%,100%{transform:translateX(656.0px)}}
    .sweep{animation:sweep 14s infinite linear}
    @keyframes pg{0%,27.6567%{opacity:0}27.6667%,42.3233%{opacity:1}42.3333%,100%{opacity:0}}.pg{animation-name:pg}
    @keyframes lr{0%,65.99%{opacity:0}66%,100%{opacity:1}}.lr{animation-name:lr}
    @media (prefers-reduced-motion: reduce){.sweep{animation:none;opacity:0}.k{animation:none;opacity:1}.lr{opacity:1}}
