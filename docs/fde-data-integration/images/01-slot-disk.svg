<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 378" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Replication slot filling the disk</title>
  <desc id="d">Animation: a database volume bar holds 45 percent data while retained WAL grows into the rest. Friday 18:00 the connector is running and WAL is recycled. Friday 19:00 the connector crashes and nobody is paged, so the slot stops advancing. Over the weekend every write is kept as WAL. Monday 03:00 the disk is full and the customer's production database stops accepting writes. Mitigations: alert on slot lag, cap retention with max_slot_wal_keep_size, heartbeat events, and a runbook to drop and re-snapshot.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .g{transform-box:fill-box;transform-origin:0 50%;animation:g 14s infinite linear}
    @keyframes g{0%,10%{transform:scaleX(0.05)}70%,100%{transform:scaleX(1)}}
    .k{opacity:0;animation:14s infinite linear}
    @keyframes p0{0%,9.99%{opacity:1}10%,100%{opacity:0}}.p0{animation-name:p0}
    @keyframes p1{0%,9.99%{opacity:0}10%,39.99%{opacity:1}40%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,39.99%{opacity:0}40%,69.99%{opacity:1}70%,100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%,69.99%{opacity:0}70%,100%{opacity:1}}.p3{animation-name:p3}
    @media (prefers-reduced-motion: reduce){.g{animation:none;transform:none}.k{animation:none;opacity:0}.p3{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="376" rx="14"/>
  <text class="h" x="28" y="40">A stalled CDC connector fills the customer's disk</text><text class="sub" x="28" y="62">PostgreSQL keeps WAL for a replication slot until Debezium confirms it. Illustrative weekend.</text><rect class="box" x="90" y="120" width="620" height="46" rx="8"/><text class="sm" x="90" y="110" font-weight="700">Database volume</text><rect class="pri" x="90" y="120" width="279" height="46" rx="8"/><text class="on13" x="102" y="148">data 45%</text><rect class="wrnf g" x="371.0" y="120" width="339.0" height="46" rx="8"/><text class="wrnt" x="698" y="186" text-anchor="end" style="font-size:13px">retained WAL grows</text><g class="k p0"><rect class="bm" x="28" y="206" width="744" height="40" rx="8"/><text class="sm" x="44" y="231">Fri 18:00 · connector running, slot advancing, WAL recycled</text></g><g class="k p1"><rect class="bm" x="28" y="206" width="744" height="40" rx="8"/><text class="sm" x="44" y="231">Fri 19:00 · connector crashes; nobody is paged; slot stops advancing</text></g><g class="k p2"><rect class="bm" x="28" y="206" width="744" height="40" rx="8"/><text class="sm" x="44" y="231">Sat–Sun · every write is kept as WAL for the stalled slot</text></g><g class="k p3"><rect class="bb" x="28" y="206" width="744" height="40" rx="8"/><text class="badt" x="44" y="231" style="font-size:14px">Mon 03:00 · disk full: the customer's production database stops accepting writes</text></g><rect class="bt" x="28" y="266" width="744" height="92" rx="10" stroke-width="1.5"/><text class="teat" x="44" y="290" style="font-size:14px">Mitigations to agree with the DBA up front</text><text class="sm" x="44" y="312">alert on pg_replication_slots lag · cap with max_slot_wal_keep_size (slot is invalidated,</text><text class="sm" x="44" y="331">not the database) · heartbeat events on quiet tables · a runbook to drop and re-snapshot</text>
</svg>
