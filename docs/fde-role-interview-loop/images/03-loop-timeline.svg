<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 448" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">FDE interview loop timeline</title>
  <desc id="d">A five-week timeline. Week 1 holds a recruiter screen of about 30 minutes and the start of a technical screen or past-work deep dive, which runs into week 2. A take-home with a presentation, optional at some companies, runs from late week 2 through week 3. The onsite, one or two days, sits in week 4, followed by the decision and offer in week 5. Below, six chips list the onsite menu: practical coding, decomposition, learning round, customer simulation, system design and behavioral. The timing is a prep-site estimate of four to six rounds over three to five weeks.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="446" rx="14"/>
  <text class="h" x="28" y="40">A typical FDE loop over five weeks</text><text class="sub" x="28" y="62">Prep-site estimate: 4–6 rounds over 3–5 weeks. No company runs every round.</text><text class="sm" x="253.5" y="94" text-anchor="middle" font-weight="600">Week 1</text><line class="grid" x1="196" y1="102" x2="196" y2="296"/><text class="sm" x="368.5" y="94" text-anchor="middle" font-weight="600">Week 2</text><line class="grid" x1="311" y1="102" x2="311" y2="296"/><text class="sm" x="483.5" y="94" text-anchor="middle" font-weight="600">Week 3</text><line class="grid" x1="426" y1="102" x2="426" y2="296"/><text class="sm" x="598.5" y="94" text-anchor="middle" font-weight="600">Week 4</text><line class="grid" x1="541" y1="102" x2="541" y2="296"/><text class="sm" x="713.5" y="94" text-anchor="middle" font-weight="600">Week 5</text><line class="grid" x1="656" y1="102" x2="656" y2="296"/><line class="grid" x1="771" y1="102" x2="771" y2="296"/><text class="sm" x="28" y="132" font-weight="600">Recruiter screen</text><rect class="pri" x="207.5" y="114" width="40.25" height="26" rx="13"/><text class="sm" x="255.75" y="132">≈30 min</text><text class="sm" x="28" y="168" font-weight="600">Technical screen</text><rect class="pri" x="253.5" y="150" width="126.5" height="26" rx="13"/><text class="sm" x="388" y="168">past-work deep dive</text><text class="sm" x="28" y="204" font-weight="600">Take-home</text><rect class="wrnf" x="391.5" y="186" width="138" height="26" rx="13" stroke-dasharray="6 5"/><text class="on13" x="401.5" y="204">build + present</text><text class="sm" x="28" y="240" font-weight="600">Onsite (1–2 days)</text><rect class="tea" x="541" y="222" width="115" height="26" rx="13"/><text class="on13" x="551" y="240">menu below</text><text class="sm" x="28" y="276" font-weight="600">Decision + offer</text><rect class="okf" x="667.5" y="258" width="92" height="26" rx="13"/><text class="on13" x="677.5" y="276">debrief</text><text class="sub" x="537.5" y="202">(optional at some companies)</text><rect class="bt" x="28" y="330" width="236" height="32" rx="16" stroke-width="1.5"/><text class="sm" x="146" y="351" text-anchor="middle">Practical coding</text><rect class="bt" x="278" y="330" width="236" height="32" rx="16" stroke-width="1.5"/><text class="sm" x="396" y="351" text-anchor="middle">Decomposition</text><rect class="bt" x="528" y="330" width="236" height="32" rx="16" stroke-width="1.5"/><text class="sm" x="646" y="351" text-anchor="middle">Learning round</text><rect class="bt" x="28" y="370" width="236" height="32" rx="16" stroke-width="1.5"/><text class="sm" x="146" y="391" text-anchor="middle">Customer simulation</text><rect class="bt" x="278" y="370" width="236" height="32" rx="16" stroke-width="1.5"/><text class="sm" x="396" y="391" text-anchor="middle">System design</text><rect class="bt" x="528" y="370" width="236" height="32" rx="16" stroke-width="1.5"/><text class="sm" x="646" y="391" text-anchor="middle">Behavioral</text><text class="sm" x="28" y="318" font-weight="700">Onsite menu: your loop picks some of these</text><text class="sub" x="28" y="428">Confirm the exact rounds with your recruiter, round by round.</text>
</svg>
