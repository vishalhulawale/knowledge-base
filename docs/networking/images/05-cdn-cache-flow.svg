<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">CDN cache miss, shield hit, edge hit and stale-while-revalidate</title>
  <desc id="d">A CDN with two edge locations, Mumbai and Delhi, a regional origin shield and the origin server, shown in four steps. Step 1, cold cache: a user in Mumbai requests app.js; the Mumbai edge misses, the shield misses, and one request goes to the origin; the response is cached at the shield and the edge on the way back. Step 2: a user in Delhi requests the same file; the Delhi edge misses but the shield hits, so the origin is not contacted. Step 3: more Mumbai users hit the edge cache and get the file in a few milliseconds with no traffic behind the edge. Step 4: the cached copy's max-age has expired; with stale-while-revalidate the edge returns the stale copy immediately and revalidates in the background, and the origin answers 304 Not Modified. Simplified: real CDNs have hundreds of edge locations and times depend on distance.</desc>
