  <text class="h" x="28" y="40">Unbounded buffer vs demand</text><text class="sub" x="28" y="62">Producer: 1 item per tick. Consumer: 1 item per 3 ticks. Illustrative.</text><rect class="box" x="28" y="80" width="360" height="340" rx="10" stroke-width="1.2"/><text class="badt" x="44" y="106" style="font-size:15px">No backpressure: request(∞)</text><rect class="bt" x="44" y="122" width="120" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="104" y="147" text-anchor="middle">Producer</text><rect class="bp" x="252" y="344" width="120" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="312" y="369" text-anchor="middle">Consumer</text><text class="sub" x="44" y="196">buffer</text><rect class="box" x="412" y="80" width="360" height="340" rx="10" stroke-width="1.2"/><text class="okt" x="428" y="106" style="font-size:15px">Backpressure: request(4)</text><rect class="bt" x="428" y="122" width="120" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="488" y="147" text-anchor="middle">Producer</text><rect class="bp" x="636" y="344" width="120" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="696" y="369" text-anchor="middle">Consumer</text><text class="sub" x="428" y="196">buffer</text><rect class="bm" x="44" y="206" width="48" height="40" rx="6" stroke-width="1" stroke-dasharray="4 4"/><g class="k lb0"><rect class="wrnf" x="44" y="206" width="48" height="40" rx="6"/><text class="on13" x="68" y="231" text-anchor="middle">1</text></g><rect class="bm" x="44" y="256" width="48" height="40" rx="6" stroke-width="1" stroke-dasharray="4 4"/><g class="k lb1"><rect class="wrnf" x="44" y="256" width="48" height="40" rx="6"/><text class="on13" x="68" y="281" text-anchor="middle">2</text></g><rect class="bm" x="100" y="206" width="48" height="40" rx="6" stroke-width="1" stroke-dasharray="4 4"/><g class="k lb2"><rect class="wrnf" x="100" y="206" width="48" height="40" rx="6"/><text class="on13" x="124" y="231" text-anchor="middle">3</text></g><rect class="bm" x="100" y="256" width="48" height="40" rx="6" stroke-width="1" stroke-dasharray="4 4"/><g class="k lb3"><rect class="wrnf" x="100" y="256" width="48" height="40" rx="6"/><text class="on13" x="124" y="281" text-anchor="middle">4</text></g><rect class="bm" x="156" y="206" width="48" height="40" rx="6" stroke-width="1" stroke-dasharray="4 4"/><g class="k lb4"><rect class="wrnf" x="156" y="206" width="48" height="40" rx="6"/><text class="on13" x="180" y="231" text-anchor="middle">5</text></g><rect class="bm" x="156" y="256" width="48" height="40" rx="6" stroke-width="1" stroke-dasharray="4 4"/><g class="k lb5"><rect class="wrnf" x="156" y="256" width="48" height="40" rx="6"/><text class="on13" x="180" y="281" text-anchor="middle">6</text></g><rect class="bm" x="212" y="206" width="48" height="40" rx="6" stroke-width="1" stroke-dasharray="4 4"/><g class="k lb6"><rect class="wrnf" x="212" y="206" width="48" height="40" rx="6"/><text class="on13" x="236" y="231" text-anchor="middle">7</text></g><rect class="bm" x="212" y="256" width="48" height="40" rx="6" stroke-width="1" stroke-dasharray="4 4"/><g class="k lb7"><rect class="wrnf" x="212" y="256" width="48" height="40" rx="6"/><text class="on13" x="236" y="281" text-anchor="middle">8</text></g><rect class="bm" x="268" y="206" width="48" height="40" rx="6" stroke-width="1" stroke-dasharray="4 4"/><g class="k lb8"><rect class="badf" x="268" y="206" width="48" height="40" rx="6"/><text class="on13" x="292" y="231" text-anchor="middle">9</text></g><rect class="bm" x="268" y="256" width="48" height="40" rx="6" stroke-width="1" stroke-dasharray="4 4"/><g class="k lb9"><rect class="badf" x="268" y="256" width="48" height="40" rx="6"/><text class="on13" x="292" y="281" text-anchor="middle">10</text></g><rect class="bm" x="324" y="206" width="48" height="40" rx="6" stroke-width="1" stroke-dasharray="4 4"/><g class="k lb10"><rect class="badf" x="324" y="206" width="48" height="40" rx="6"/><text class="on13" x="348" y="231" 