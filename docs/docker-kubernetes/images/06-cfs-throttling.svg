  <rect class="card" x="1" y="1" width="798" height="438" rx="14"/>
  <text class="h" x="28" y="40">limits.cpu: 1 with 4 busy JVM threads</text>
  <text class="sub" x="28" y="62">CFS gives the container 100 ms of CPU time per 100 ms period, shared by all its threads.</text>
