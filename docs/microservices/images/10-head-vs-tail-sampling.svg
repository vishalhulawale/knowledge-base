    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="452" rx="14"/>
  <text class="h" x="28" y="40">Head versus tail sampling</text>
  <text class="sub" x="28" y="62">Ten traces arrive. Which ones reach the tracing backend?</text>
  <text class="h2" x="28" y="96">Head-based, probability 0.1: decided at the root, before the outcome is known</text>
  <text class="sub" x="28" y="136">decide</text><text class="sub" x="28" y="152">at start</text>
  <text class="h2" x="28" y="246">Tail-based in the Collector: decided after the trace completes</text>
  <text class="sub" x="28" y="286">decide</text><text class="sub" x="28" y="302">at end</text>
  <g class="c" style="animation-name:h0"><rect class="box" x="150" y="112" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="176" y="136" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:t0"><rect class="box" x="150" y="262" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="176" y="286" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:wt0"><text class="sub" x="176" y="316" text-anchor="middle">buffered</text></g>
  <g class="c" style="animation-name:h1"><rect class="box" x="210" y="112" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="236" y="136" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:t1"><rect class="box" x="210" y="262" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="236" y="286" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:kt1"><circle class="okf" cx="256" cy="262" r="9"/><text class="on13" x="256" y="266" text-anchor="middle">✓</text></g>
  <g class="c" style="animation-name:wt1"><text class="sub" x="236" y="316" text-anchor="middle">buffered</text></g>
  <g class="c" style="animation-name:h2"><rect class="box" x="270" y="112" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="296" y="136" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:t2"><rect class="box" x="270" y="262" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="296" y="286" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:wt2"><text class="sub" x="296" y="316" text-anchor="middle">buffered</text></g>
  <g class="c" style="animation-name:h3"><rect class="box" x="330" y="112" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="356" y="136" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:kh3"><circle class="okf" cx="376" cy="112" r="9"/><text class="on13" x="376" y="116" text-anchor="middle">✓</text></g>
  <g class="c" style="animation-name:t3"><rect class="box" x="330" y="262" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="356" y="286" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:wt3"><text class="sub" x="356" y="316" text-anchor="middle">buffered</text></g>
  <g class="c" style="animation-name:h4"><rect class="box" x="390" y="112" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="416" y="136" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:t4"><rect class="box" x="390" y="262" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="416" y="286" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:wt4"><text class="sub" x="416" y="316" text-anchor="middle">buffered</text></g>
  <g class="c" style="animation-name:h5"><rect class="box" x="450" y="112" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="476" y="136" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:t5"><rect class="box" x="450" y="262" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="476" y="286" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:wt5"><text class="sub" x="476" y="316" text-anchor="middle">buffered</text></g>
  <g class="c" style="animation-name:h6"><rect class="bb" x="510" y="112" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="536" y="136" text-anchor="middle">error</text></g>
  <g class="c" style="animation-name:t6"><rect class="bb" x="510" y="262" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="536" y="286" text-anchor="middle">error</text></g>
  <g class="c" style="animation-name:kt6"><circle class="okf" cx="556" cy="262" r="9"/><text class="on13" x="556" y="266" text-anchor="middle">✓</text></g>
  <g class="c" style="animation-name:wt6"><text class="sub" x="536" y="316" text-anchor="middle">buffered</text></g>
  <g class="c" style="animation-name:h7"><rect class="box" x="570" y="112" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="596" y="136" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:t7"><rect class="box" x="570" y="262" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="596" y="286" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:wt7"><text class="sub" x="596" y="316" text-anchor="middle">buffered</text></g>
  <g class="c" style="animation-name:h8"><rect class="bw" x="630" y="112" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="656" y="136" text-anchor="middle">1.4 s</text></g>
  <g class="c" style="animation-name:t8"><rect class="bw" x="630" y="262" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="656" y="286" text-anchor="middle">1.4 s</text></g>
  <g class="c" style="animation-name:kt8"><circle class="okf" cx="676" cy="262" r="9"/><text class="on13" x="676" y="266" text-anchor="middle">✓</text></g>
  <g class="c" style="animation-name:wt8"><text class="sub" x="656" y="316" text-anchor="middle">buffered</text></g>
  <g class="c" style="animation-name:h9"><rect class="box" x="690" y="112" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="716" y="136" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:t9"><rect class="box" x="690" y="262" width="52" height="38" rx="6" stroke-width="1.5"/><text class="sub" x="716" y="286" text-anchor="middle">120 ms</text></g>
  <g class="c" style="animation-name:wt9"><text class="sub" x="716" y="316" text-anchor="middle">buffered</text></g>
  <circle class="okf" cx="38" cy="360" r="8"/><text class="sub" x="52" y="365">kept</text>
  <text class="sub" x="100" y="365">faded = dropped</text>
  <text class="tx" x="28" y="392">Head: one random trace in ten is kept; the error and the slow trace are usually lost.</text>
  <text class="tx" x="28" y="412">Tail (decision_wait 10s): keep every error, every trace over 1000 ms, plus a small random baseline.</text>
  <text class="sub" x="28" y="436">Which normal trace each sampler keeps is random; one is shown.</text>
</svg>
