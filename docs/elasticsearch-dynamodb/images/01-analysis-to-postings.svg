<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Analysis to postings</title>
  <desc id="d">Animation. Document 1, the HTML string Refill reminders for Members in bold tags, passes through an analyzer one stage at a time: the html_strip character filter removes the tags, the standard tokenizer splits four tokens, the lowercase filter lowercases them, the stop filter drops for, and the stemmer turns them into refil, remind and member. These terms enter an inverted index with document 1. Document 2, Member refill history, adds document 2 to member and refil and a new term histori. Then the query Refilled Member goes through the same chain, becomes refil and member, and both postings lists light up, matching documents 1 and 2.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes r1{0%,7.99%{opacity:0}8%,96.99%{opacity:1}97%,100%{opacity:0}}.r1{animation-name:r1}
    @keyframes r2{0%,15.99%{opacity:0}16%,96.99%{opacity:1}97%,100%{opacity:0}}.r2{animation-name:r2}
    @keyframes r3{0%,23.99%{opacity:0}24%,96.99%{opacity:1}97%,100%{opacity:0}}.r3{animation-name:r3}
    @keyframes r4{0%,31.99%{opacity:0}32%,96.99%{opacity:1}97%,100%{opacity:0}}.r4{animation-name:r4}
    @keyframes r5{0%,39.99%{opacity:0}40%,96.99%{opacity:1}97%,100%{opacity:0}}.r5{animation-name:r5}
    @keyframes p1{0%,47.99%{opacity:0}48%,96.99%{opacity:1}97%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,57.99%{opacity:0}58%,96.99%{opacity:1}97%,100%{opacity:0}}.p2{animation-name:p2}
    @keyframes q1{0%,67.99%{opacity:0}68%,96.99%{opacity:1}97%,100%{opacity:0}}.q1{animation-name:q1}
    @keyframes q2{0%,77.99%{opacity:0}78%,96.99%{opacity:1}97%,100%{opacity:0}}.q2{animation-name:q2}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="464" rx="14"/>
  <text class="h" x="28" y="40">From text to terms to postings</text><text class="sub" x="28" y="62">Document 1 through an english-style analyzer; document 2 and the query use the same chain.</text><text class="lbl" x="28" y="104" style="font-size:14px">input</text><rect class="box" x="150" y="92" width="292.5" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="158" y="108.5" xml:space="preserve">&lt;b&gt;Refill&lt;/b&gt; reminders for Members</text><g class="k r1"><text class="lbl" x="28" y="146" style="font-size:14px">html_strip</text><text class="sub" x="28" y="162" style="font-size:12px">char filter</text><rect class="box" x="150" y="134" width="237.2" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="158" y="150.5" xml:space="preserve">Refill reminders for Members</text></g><g class="k r2"><text class="lbl" x="28" y="188" style="font-size:14px">standard</text><text class="sub" x="28" y="204" style="font-size:12px">tokenizer</text><rect class="box" x="150" y="176" width="63.4" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="158" y="192.5" xml:space="preserve">Refill</text><rect class="box" x="221.4" y="176" width="87.1" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="229.4" y="192.5" xml:space="preserve">reminders</text><rect class="box" x="316.5" y="176" width="39.7" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="324.5" y="192.5" xml:space="preserve">for</text><rect class="box" x="364.2" y="176" width="71.3" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="372.2" y="192.5" xml:space="preserve">Members</text></g><g class="k r3"><text class="lbl" x="28" y="230" style="font-size:14px">lowercase</text><text class="sub" x="28" y="246" style="font-size:12px">token filter</text><rect class="box" x="150" y="218" width="63.4" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="158" y="234.5" xml:space="preserve">refill</text><rect class="box" x="221.4" y="218" width="87.1" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="229.4" y="234.5" xml:space="preserve">reminders</text><rect class="box" x="316.5" y="218" width="39.7" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="324.5" y="234.5" xml:space="preserve">for</text><rect class="box" x="364.2" y="218" width="71.3" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="372.2" y="234.5" xml:space="preserve">members</text></g><g class="k r4"><text class="lbl" x="28" y="272" style="font-size:14px">stop</text><text class="sub" x="28" y="288" style="font-size:12px">token filter</text><rect class="box" x="150" y="260" width="63.4" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="158" y="276.5" xml:space="preserve">refill</text><rect class="box" x="221.4" y="260" width="87.1" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="229.4" y="276.5" xml:space="preserve">reminders</text><rect class="box" x="316.5" y="260" width="71.3" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="324.5" y="276.5" xml:space="preserve">members</text></g><g class="k r4"><text class="wrnt" x="396" y="277" style="font-size:12px">“for” dropped</text></g><g class="k r5"><text class="lbl" x="28" y="314" style="font-size:14px">stemmer</text><text class="sub" x="28" y="330" style="font-size:12px">token filter</text><rect class="bt" x="150" y="302" width="55.5" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="158" y="318.5" xml:space="preserve">refil</text><rect class="bt" x="213.5" y="302" width="63.4" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="221.5" y="318.5" xml:space="preserve">remind</text><rect class="bt" x="284.9" y="302" width="63.4" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="292.9" y="318.5" xml:space="preserve">member</text></g><rect class="bm" x="490" y="84" width="282" height="226" rx="10" stroke-width="1.2"/><text class="lbl" x="504" y="106" style="font-size:14px">inverted index: term → doc IDs</text><g class="k p2"><rect class="box" x="502" y="120" width="258" height="34" rx="6" stroke-width="1"/><text class="mono" x="514" y="142" xml:space="preserve">histori</text></g><g class="k p2"><rect class="tea" x="674" y="126" width="26" height="22" rx="5"/><text class="on13" x="687" y="142" text-anchor="middle">2</text></g><g class="k p1"><rect class="box" x="502" y="164" width="258" height="34" rx="6" stroke-width="1"/><text class="mono" x="514" y="186" xml:space="preserve">member</text></g><g class="k p1"><rect class="pri" x="640" y="170" width="26" height="22" rx="5"/><text class="on13" x="653" y="186" text-anchor="middle">1</text></g><g class="k p2"><rect class="tea" x="674" y="170" width="26" height="22" rx="5"/><text class="on13" x="687" y="186" text-anchor="middle">2</text></g><g class="k p1"><rect class="box" x="502" y="208" width="258" height="34" rx="6" stroke-width="1"/><text class="mono" x="514" y="230" xml:space="preserve">refil</text></g><g class="k p1"><rect class="pri" x="640" y="214" width="26" height="22" rx="5"/><text class="on13" x="653" y="230" text-anchor="middle">1</text></g><g class="k p2"><rect class="tea" x="674" y="214" width="26" height="22" rx="5"/><text class="on13" x="687" y="230" text-anchor="middle">2</text></g><g class="k p1"><rect class="box" x="502" y="252" width="258" height="34" rx="6" stroke-width="1"/><text class="mono" x="514" y="274" xml:space="preserve">remind</text></g><g class="k p1"><rect class="pri" x="640" y="258" width="26" height="22" rx="5"/><text class="on13" x="653" y="274" text-anchor="middle">1</text></g><g class="k p2"><text class="sub" x="504" y="300" style="font-size:12px">teal = from doc 2, “Member refill history”</text></g><line class="grid" x1="28" y1="352" x2="772" y2="352"/><g class="k q1"><text class="lbl" x="28" y="380" style="font-size:14px">query</text><rect class="box" x="90" y="364" width="134.5" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="98" y="380.5" xml:space="preserve">Refilled Member</text><text class="sm" x="262" y="381">same chain →</text><rect class="bt" x="360" y="364" width="55.5" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="368" y="380.5" xml:space="preserve">refil</text><rect class="bt" x="423.5" y="364" width="63.4" height="24" rx="5" stroke-width="1.2"/><text class="mono" x="431.5" y="380.5" xml:space="preserve">member</text></g><g class="k q2"><rect class="lnt" x="502" y="208" width="258" height="34" rx="6" style="fill:none;stroke-width:3"/></g><g class="k q2"><rect class="lnt" x="502" y="164" width="258" height="34" rx="6" style="fill:none;stroke-width:3"/></g><g class="k q2"><text class="okt" x="28" y="420" style="font-size:15px">Both postings lists list docs 1 and 2 → both match; BM25 ranks them.</text><text class="sm" x="28" y="442">“Refilled” never appears in either document: stemming makes it meet “refill”.</text></g>
</svg>
