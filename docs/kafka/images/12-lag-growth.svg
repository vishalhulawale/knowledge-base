<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Consumer lag grows when consumption is slower than production</title>
  <desc id="d">Two charts over 12 minutes. Top: produce rate is a steady 1,000 records per second. The consumers manage only 800 per second for the first 6 minutes, then are scaled out to 1,300 per second; once the backlog is gone at minute 10 they consume at the produce rate, 1,000 per second. Bottom: lag in records. It climbs by 200 records every second, reaching 72,000 at minute 6, then drains by 300 per second and is back to zero at minute 10. At the peak the oldest unprocessed record is about 72 seconds old. Illustrative numbers.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

    .a{opacity:0;animation:14s infinite linear}
    .s1{stroke:#4f46e5;stroke-width:2;fill:none}.s2{stroke:#0ea5a4;stroke-width:2;fill:none;stroke-dasharray:7 4}.s3{stroke:#dc2626;stroke-width:2;fill:none}.ctx{stroke:#cbd5e1;stroke-width:2;fill:none}.ar3{fill:#dc2626;opacity:.12}.grid{stroke:#e2e8f0;stroke-width:1}.axis{stroke:#94a3b8;stroke-width:1}@media (prefers-color-scheme: dark){.s1{stroke:#6366f1}.s2{stroke:#0d9488}.s3{stroke:#f87171}.ctx{stroke:#475569}.ar3{fill:#f87171}.grid{stroke:#334155}.axis{stroke:#64748b}}
    @keyframes rv{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}.rv{transform-box:fill-box;transform-origin:0 50%;animation:rv 14s infinite linear}
    @keyframes pk{0%{opacity:0}35%{opacity:0}36%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .pk{animation-name:pk}
    @keyframes dr{0%{opacity:0}57%{opacity:0}58%,97%{opacity:1}98%{opacity:0}100%{opacity:0}}
    .dr{animation-name:dr}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important}
      .a{opacity:1}
      .rmh{opacity:0!important}
      .rv{transform:none}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="468" rx="14"/>
  <text class="h" x="28" y="40">Lag is the gap between two rates, accumulated</text>
  <text class="sub" x="28" y="62">Produce 1,000/s; consumers do 800/s, then scale out at minute 6. Illustrative numbers.</text>
  <line class="grid" x1="90" x2="740" y1="230.0" y2="230.0"/>
  <text class="sm" x="82" y="234" text-anchor="end">0</text>
  <line class="grid" x1="90" x2="740" y1="189.3" y2="189.3"/>
  <text class="sm" x="82" y="193.286" text-anchor="end">500</text>
  <line class="grid" x1="90" x2="740" y1="148.6" y2="148.6"/>
  <text class="sm" x="82" y="152.571" text-anchor="end">1,000</text>
  <line class="axis" x1="90" x2="740" y1="230" y2="230"/>
  <text class="sm" x="28" y="102">records/s</text>
  <line class="grid" x1="90" x2="740" y1="400.0" y2="400.0"/>
  <text class="sm" x="82" y="404" text-anchor="end">0k</text>
  <line class="grid" x1="90" x2="740" y1="348.0" y2="348.0"/>
  <text class="sm" x="82" y="352" text-anchor="end">40k</text>
  <line class="grid" x1="90" x2="740" y1="296.0" y2="296.0"/>
  <text class="sm" x="82" y="300" text-anchor="end">80k</text>
  <line class="axis" x1="90" x2="740" y1="400" y2="400"/>
  <text class="sm" x="28" y="282">lag</text>
  <text class="sm" x="90" y="420" text-anchor="middle">0 min</text>
  <text class="sm" x="198.333" y="420" text-anchor="middle">2 min</text>
  <text class="sm" x="306.667" y="420" text-anchor="middle">4 min</text>
  <text class="sm" x="415" y="420" text-anchor="middle">6 min</text>
  <text class="sm" x="523.333" y="420" text-anchor="middle">8 min</text>
  <text class="sm" x="631.667" y="420" text-anchor="middle">10 min</text>
  <text class="sm" x="740" y="420" text-anchor="middle">12 min</text>
  <clipPath id="reveal"><rect class="rv" x="90" y="90" width="670" height="330"/></clipPath>
  <g clip-path="url(#reveal)">
  <polyline class="s1" points="90.0,148.6 740.0,148.6"/>
  <polyline class="s2" points="90.0,164.9 415.0,164.9 415.0,124.1 631.7,124.1 631.7,148.6 740.0,148.6"/>
  <polygon class="ar3" points="90.0,400.0 415.0,306.4 631.7,400.0 740.0,400.0 740.0,400.0"/>
  <polyline class="s3" points="90.0,400.0 415.0,306.4 631.7,400.0 740.0,400.0"/>
  </g>
  <text class="sm" x="746" y="142.571">produce</text>
  <text class="sm" x="100.833" y="182.857">consume 800/s</text>
  <text class="sm" x="425.833" y="116.143">scaled out: 1,300/s</text>
  <text class="sm a pk" x="423" y="310.4">72k records ≈ 72 s behind</text>
  <text class="sm a dr" x="639.667" y="392">drained</text>
  <text class="sub" x="28" y="450">Lag slope = produce rate − consume rate. Alert on time lag or a sustained rise, not a raw count.</text>
</svg>
