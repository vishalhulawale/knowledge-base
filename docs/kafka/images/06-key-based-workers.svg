<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Thread pool vs key-based workers</title>
  <desc id="d">One partition delivers rx-1 #1, rx-2 #1, rx-1 #2 and rx-1 #3 in that order. Left: submitting each record to a thread pool spreads them over threads T1, T2 and T3; rx-1 #2 runs on T3 while rx-1 #3 runs on T1, so #3 can finish before #2 and per-key order is lost. Right: routing by hash of the key modulo 2 sends every rx-1 record to worker W0, which processes them one at a time in order, and rx-2 to worker W1, so the two keys run in parallel while each key stays ordered. Offsets still have to be committed only up to the lowest unfinished record.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .txt{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .k1{fill:#4f46e5}.k2{fill:#0ea5a4}
    .on{fill:#ffffff;font-size:13px;font-weight:700}
    .badt{fill:#dc2626;font-size:14px;font-weight:700}
    .okt{fill:#15803d;font-size:14px;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}.arw{fill:#64748b}
    .sep{stroke:#e2e8f0;stroke-width:2}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.txt{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .k1{fill:#818cf8}.k2{fill:#2dd4bf}.on{fill:#0f172a}
      .badt{fill:#f87171}.okt{fill:#4ade80}
      .ln{stroke:#94a3b8}.arw{fill:#94a3b8}.sep{stroke:#334155}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="370" rx="14"/>
  <text class="h" x="28" y="40">Parallelism inside one consumer: keep per-key order</text>
  <line class="sep" x1="400" y1="62" x2="400" y2="320"/>

  <!-- shared input, drawn in each panel -->
  <text class="sub" x="28" y="80">one partition, in offset order →</text>
  <g>
    <rect class="k1" x="28" y="90" width="80" height="28" rx="6"/><text class="on" x="68" y="109" text-anchor="middle">rx-1 #1</text>
    <rect class="k2" x="114" y="90" width="80" height="28" rx="6"/><text class="on" x="154" y="109" text-anchor="middle">rx-2 #1</text>
    <rect class="k1" x="200" y="90" width="80" height="28" rx="6"/><text class="on" x="240" y="109" text-anchor="middle">rx-1 #2</text>
    <rect class="k1" x="286" y="90" width="80" height="28" rx="6"/><text class="on" x="326" y="109" text-anchor="middle">rx-1 #3</text>
  </g>
  <text class="sub" x="424" y="80">one partition, in offset order →</text>
  <g>
    <rect class="k1" x="424" y="90" width="80" height="28" rx="6"/><text class="on" x="464" y="109" text-anchor="middle">rx-1 #1</text>
    <rect class="k2" x="510" y="90" width="80" height="28" rx="6"/><text class="on" x="550" y="109" text-anchor="middle">rx-2 #1</text>
    <rect class="k1" x="596" y="90" width="80" height="28" rx="6"/><text class="on" x="636" y="109" text-anchor="middle">rx-1 #2</text>
    <rect class="k1" x="682" y="90" width="80" height="28" rx="6"/><text class="on" x="722" y="109" text-anchor="middle">rx-1 #3</text>
  </g>

  <!-- left: thread pool -->
  <path class="ln" d="M196 126 V148"/><path class="arw" d="M190 146 L196 156 L202 146 Z"/>
  <text class="lbl" x="208" y="146">pool.submit(...)</text>
  <rect class="box" x="28" y="162" width="108" height="100" rx="10"/><text class="lbl" x="82" y="182" text-anchor="middle">T1</text>
  <rect class="box" x="146" y="162" width="108" height="100" rx="10"/><text class="lbl" x="200" y="182" text-anchor="middle">T2</text>
  <rect class="box" x="264" y="162" width="108" height="100" rx="10"/><text class="lbl" x="318" y="182" text-anchor="middle">T3</text>
  <rect class="k1" x="42" y="192" width="80" height="26" rx="6"/><text class="on" x="82" y="210" text-anchor="middle">rx-1 #1</text>
  <rect class="k1" x="42" y="224" width="80" height="26" rx="6"/><text class="on" x="82" y="242" text-anchor="middle">rx-1 #3</text>
  <rect class="k2" x="160" y="192" width="80" height="26" rx="6"/><text class="on" x="200" y="210" text-anchor="middle">rx-2 #1</text>
  <rect class="k1" x="278" y="192" width="80" height="26" rx="6"/><text class="on" x="318" y="210" text-anchor="middle">rx-1 #2</text>
  <text class="badt" x="28" y="290">rx-1 #3 (T1) can finish before</text>
  <text class="badt" x="28" y="310">rx-1 #2 (T3): order lost</text>

  <!-- right: key-hash workers -->
  <path class="ln" d="M592 126 V148"/><path class="arw" d="M586 146 L592 156 L598 146 Z"/>
  <text class="lbl" x="604" y="146">hash(key) % 2</text>
  <rect class="box" x="424" y="162" width="160" height="100" rx="10"/><text class="lbl" x="504" y="182" text-anchor="middle">W0 (one thread)</text>
  <rect class="box" x="602" y="162" width="160" height="100" rx="10"/><text class="lbl" x="682" y="182" text-anchor="middle">W1 (one thread)</text>
  <rect class="k1" x="438" y="192" width="64" height="26" rx="6"/><text class="on" x="470" y="210" text-anchor="middle">#1</text>
  <rect class="k1" x="506" y="192" width="64" height="26" rx="6"/><text class="on" x="538" y="210" text-anchor="middle">#2</text>
  <rect class="k1" x="438" y="224" width="64" height="26" rx="6"/><text class="on" x="470" y="242" text-anchor="middle">#3</text>
  <text class="sub" x="510" y="242">all rx-1</text>
  <rect class="k2" x="642" y="192" width="80" height="26" rx="6"/><text class="on" x="682" y="210" text-anchor="middle">rx-2 #1</text>
  <text class="okt" x="424" y="290">Same key → same worker → in order.</text>
  <text class="okt" x="424" y="310">Different keys still run in parallel.</text>

  <text class="sub" x="28" y="356">Workers still need offset tracking: commit only below the lowest unfinished record.</text>
</svg>
