  <text class="sm" x="760" y="308" text-anchor="middle">200</text>
  <text class="sm" x="28" y="308">time (ms)</text>
  <rect class="bp" x="120" y="92" width="318" height="16" rx="4"/>
  <text class="sm" x="128" y="104" font-weight="700">period 1: quota 100 ms</text>
  <rect class="bp" x="440" y="92" width="318" height="16" rx="4"/>
