<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Threads share the heap but each has its own stack</title>
  <desc id="d">One JVM process. At the top, the heap is shared by every thread and holds objects such as an OrderService singleton, the map referenced by a static field, and an Order created for one request. At the bottom, three threads each have their own stack of frames with local variables, plus their own program counter and native stack. Arrows from local variables in the frames point up to heap objects. Threads A and B both reference the OrderService, and threads B and C both reference the static map, so those objects are shared. Locals themselves are never shared.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:19px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .t{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .zone{fill:#eef2ff;stroke:#c7d2fe}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .obj{fill:#ffffff;stroke:#4f46e5;stroke-width:2}
    .shared{fill:#ffffff;stroke:#d97706;stroke-width:2.5}
    .frame{fill:#e0f2f1;stroke:#0ea5a4}
    .ref{stroke:#4f46e5;stroke-width:2;fill:none}
    .mk{fill:#4f46e5}
    .tw{fill:#b45309;font-size:13px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h{fill:#f1f5f9}.lbl,.t{fill:#e2e8f0}.sub{fill:#94a3b8}
      .zone{fill:#262b47;stroke:#4f46e5}
      .box,.obj,.shared{fill:#111827}.box{stroke:#475569}.obj{stroke:#818cf8}.shared{stroke:#fbbf24}
      .frame{fill:#123b3b;stroke:#2dd4bf}
      .ref{stroke:#818cf8}.mk{fill:#818cf8}.tw{fill:#fbbf24}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="430" rx="14"/>
  <text class="h" x="28" y="40">One JVM: shared heap, private stacks</text>
  <text class="sub" x="28" y="62">Every thread can reach heap objects it has a reference to. Its own stack frames are invisible to other threads.</text>

  <!-- heap -->
  <rect class="zone" x="28" y="80" width="744" height="118" rx="12"/>
  <text class="lbl" x="44" y="104">Heap: shared by every thread</text>
  <rect class="shared" x="60" y="118" width="190" height="62" rx="10"/>
  <text class="lbl" x="155" y="144" text-anchor="middle">OrderService</text>
  <text class="sub" x="155" y="164" text-anchor="middle">singleton bean</text>
  <rect class="shared" x="305" y="118" width="190" height="62" rx="10"/>
  <text class="lbl" x="400" y="144" text-anchor="middle">Map (static CACHE)</text>
  <text class="sub" x="400" y="164" text-anchor="middle">reached via a static field</text>
  <rect class="obj" x="550" y="118" width="190" height="62" rx="10"/>
  <text class="lbl" x="645" y="144" text-anchor="middle">Order #42</text>
  <text class="sub" x="645" y="164" text-anchor="middle">created by one request</text>

  <!-- threads -->
  <g>
    <rect class="box" x="44" y="236" width="200" height="132" rx="12"/>
    <text class="lbl" x="232" y="258" text-anchor="end">Thread A</text>
    <rect class="frame" x="56" y="268" width="176" height="24" rx="5"/><text class="t" x="66" y="285">handle(): svc</text>
    <rect class="frame" x="56" y="296" width="176" height="24" rx="5"/><text class="t" x="66" y="313">run(): request</text>
    <text class="sub" x="58" y="352">own PC + native stack</text>
  </g>
  <g>
    <rect class="box" x="300" y="236" width="200" height="132" rx="12"/>
    <text class="lbl" x="488" y="258" text-anchor="end">Thread B</text>
    <rect class="frame" x="312" y="268" width="176" height="24" rx="5"/><text class="t" x="322" y="285">load(): svc, map</text>
    <rect class="frame" x="312" y="296" width="176" height="24" rx="5"/><text class="t" x="322" y="313">qty = 3 (int)</text>
    <text class="sub" x="314" y="352">own PC + native stack</text>
  </g>
  <g>
    <rect class="box" x="556" y="236" width="200" height="132" rx="12"/>
    <text class="lbl" x="744" y="258" text-anchor="end">Thread C</text>
    <rect class="frame" x="568" y="268" width="176" height="24" rx="5"/><text class="t" x="578" y="285">total(): o, map</text>
    <rect class="frame" x="568" y="296" width="176" height="24" rx="5"/><text class="t" x="578" y="313">id = "42"</text>
    <text class="sub" x="570" y="352">own PC + native stack</text>
  </g>

  <!-- references: stack locals -> heap objects -->
  <path class="ref" d="M110,268 L140,184" marker-end="url(#ar)"/>
  <path class="ref" d="M330,268 L200,184" marker-end="url(#ar)"/>
  <path class="ref" d="M385,268 L400,184" marker-end="url(#ar)"/>
  <path class="ref" d="M590,268 L440,184" marker-end="url(#ar)"/>
  <path class="ref" d="M640,268 L648,184" marker-end="url(#ar)"/>

  <text class="tw" x="28" y="400">Amber border = reachable from two threads: shared mutable state needs safe sharing (page 2).</text>
  <text class="sub" x="28" y="418">ThreadLocal values are also per thread. Frames shown are simplified.</text>
</svg>
