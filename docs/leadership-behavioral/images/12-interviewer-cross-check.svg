<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Cross-check what each interviewer says</title>
  <desc id="d">Notes from four interviewers answering the same three questions about a tech lead role. On what success looks like after six months, the hiring manager says owning the claims platform, the peer engineer says shipping features faster, and the architect says leading the Kafka migration: three different jobs. On who makes design decisions, answers range from the lead to the architects. On on-call, all agree on a one-in-six rotation. The mismatched rows are the questions to clarify before accepting. Illustrative notes.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="398" rx="14"/>
  <text class="h" x="28" y="40">Same questions, four interviewers</text>
  <text class="sub" x="28" y="62">Illustrative notes. Agreement = green; contradictions = amber, clarify before accepting.</text>
  <text class="sm" x="240" y="104" text-anchor="middle" font-weight="700">Hiring manager</text>
  <text class="sm" x="390" y="104" text-anchor="middle" font-weight="700">Peer engineer</text>
  <text class="sm" x="540" y="104" text-anchor="middle" font-weight="700">Architect</text>
  <text class="sm" x="690" y="104" text-anchor="middle" font-weight="700">Director</text>
  <text class="tx" x="28" y="146" font-weight="700">6-month success?</text>
  <rect class="bw" x="172" y="118" width="142" height="48" rx="8" stroke-width="1.2"/>
  <text class="sm" x="243" y="147" text-anchor="middle">own claims platform</text>
  <rect class="bw" x="322" y="118" width="142" height="48" rx="8" stroke-width="1.2"/>
  <text class="sm" x="393" y="147" text-anchor="middle">ship features faster</text>
  <rect class="bw" x="472" y="118" width="142" height="48" rx="8" stroke-width="1.2"/>
  <text class="sm" x="543" y="147" text-anchor="middle">lead Kafka migration</text>
  <rect class="bw" x="622" y="118" width="142" height="48" rx="8" stroke-width="1.2"/>
  <text class="sm" x="693" y="147" text-anchor="middle">stabilise on-call</text>
  <text class="tx" x="28" y="208" font-weight="700">Who decides?</text>
  <rect class="bw" x="172" y="180" width="142" height="48" rx="8" stroke-width="1.2"/>
  <text class="sm" x="243" y="209" text-anchor="middle">the lead</text>
  <rect class="bw" x="322" y="180" width="142" height="48" rx="8" stroke-width="1.2"/>
  <text class="sm" x="393" y="209" text-anchor="middle">the architects</text>
  <rect class="bw" x="472" y="180" width="142" height="48" rx="8" stroke-width="1.2"/>
  <text class="sm" x="543" y="209" text-anchor="middle">architects approve</text>
  <rect class="bw" x="622" y="180" width="142" height="48" rx="8" stroke-width="1.2"/>
  <text class="sm" x="693" y="209" text-anchor="middle">the team</text>
  <text class="tx" x="28" y="270" font-weight="700">On-call?</text>
  <rect class="bo" x="172" y="242" width="142" height="48" rx="8" stroke-width="1.2"/>
  <text class="sm" x="243" y="271" text-anchor="middle">1 week in 6</text>
  <rect class="bo" x="322" y="242" width="142" height="48" rx="8" stroke-width="1.2"/>
  <text class="sm" x="393" y="271" text-anchor="middle">1 week in 6</text>
  <rect class="bo" x="472" y="242" width="142" height="48" rx="8" stroke-width="1.2"/>
  <text class="sm" x="543" y="271" text-anchor="middle">1 week in 6</text>
  <rect class="bo" x="622" y="242" width="142" height="48" rx="8" stroke-width="1.2"/>
  <text class="sm" x="693" y="271" text-anchor="middle">1 week in 6</text>
  <text class="tx wrnt" x="28" y="330">Contradictions on scope and decision rights mean the role isn&#x27;t agreed internally yet.</text>
  <text class="sub" x="28" y="354">Ask the hiring manager to reconcile them, in writing if possible, before you accept.</text>
</svg>
