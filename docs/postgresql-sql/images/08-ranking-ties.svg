<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">ROW_NUMBER, RANK and DENSE_RANK on ties</title>
  <desc id="d">Employees ordered by salary descending: Asha 250,000, Dev 185,000, Ben 180,000, Chen 180,000, Eva 140,000. ROW_NUMBER gives 1, 2, 3, 4, 5, breaking the Ben and Chen tie arbitrarily. RANK gives 1, 2, 3, 3, 5, skipping 4 after the tie. DENSE_RANK gives 1, 2, 3, 3, 4 with no gap, so the Nth highest distinct salary is DENSE_RANK = N.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .t{fill:#334155;font-size:14px}
    .b{fill:#0f172a;font-size:14px;font-weight:700}
    .sub{fill:#64748b;font-size:13px}
    .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#4f46e5;font-weight:600}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#334155}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.ok{fill:#16a34a}.bad{fill:#dc2626}.warn{fill:#d97706}.mut{fill:#94a3b8}
    .pris{stroke:#4f46e5}.teas{stroke:#0ea5a4}.oks{stroke:#16a34a}.bads{stroke:#dc2626}.warns{stroke:#d97706}.muts{stroke:#94a3b8}
    .prit{fill:#4f46e5}.teat{fill:#0f766e}.okt{fill:#16a34a}.badt{fill:#dc2626}.warnt{fill:#b45309}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .onm{fill:#ffffff;font-size:13px}
    .okbg{fill:#16a34a;fill-opacity:.10;stroke:#16a34a;stroke-width:1.5}
    .badbg{fill:#dc2626;fill-opacity:.08;stroke:#dc2626;stroke-width:1.5}
    .pribg{fill:#4f46e5;fill-opacity:.10;stroke:#4f46e5;stroke-width:1.5}
    .teabg{fill:#0ea5a4;fill-opacity:.12;stroke:#0ea5a4;stroke-width:1.5}
    .line{stroke:#94a3b8;stroke-width:2;fill:none}
    .ah{fill:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.b{fill:#f1f5f9}.lbl,.t,.mono{fill:#e2e8f0}.sub{fill:#94a3b8}
      .code{fill:#818cf8}.box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.ok{fill:#4ade80}.bad{fill:#f87171}.warn{fill:#fbbf24}.mut{fill:#64748b}
      .pris{stroke:#818cf8}.teas{stroke:#2dd4bf}.oks{stroke:#4ade80}.bads{stroke:#f87171}.warns{stroke:#fbbf24}.muts{stroke:#64748b}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.warnt{fill:#fbbf24}
      .on,.onm{fill:#0f172a}
      .okbg{fill:#4ade80;stroke:#4ade80;fill-opacity:.12}.badbg{fill:#f87171;stroke:#f87171;fill-opacity:.10}
      .pribg{fill:#818cf8;stroke:#818cf8;fill-opacity:.14}.teabg{fill:#2dd4bf;stroke:#2dd4bf;fill-opacity:.14}
      .line{stroke:#64748b}.ah{fill:#64748b}
    }

  </style>
  <rect class="card" x="1" y="1" width="798" height="338" rx="14"/>
  <text class="h" x="28" y="40">Ranking functions on a tie</text>
  <text class="sub" x="28" y="62">ORDER BY salary DESC. Ben and Chen both earn 180,000.</text>
  <rect class="box" x="24" y="80" width="752" height="210" rx="10"/>
  <g class="sub" font-weight="700"><text x="44" y="108">name</text><text x="150" y="108">salary</text><text x="300" y="108">row_number</text><text x="460" y="108">rank</text><text x="600" y="108">dense_rank</text></g>
  <rect class="warn" x="34" y="174" width="732" height="58" rx="8" fill-opacity=".14"/>
  <g class="t"><text x="44" y="134">Asha</text><text x="150" y="134">250,000</text></g>
  <text class="b" x="330" y="134">1</text>
  <text class="b" x="470" y="134" font-size="14" font-weight="700">1</text>
  <text class="b" x="630" y="134" font-size="14" font-weight="700">1</text>
  <g class="t"><text x="44" y="164">Dev</text><text x="150" y="164">185,000</text></g>
  <text class="b" x="330" y="164">2</text>
  <text class="b" x="470" y="164" font-size="14" font-weight="700">2</text>
  <text class="b" x="630" y="164" font-size="14" font-weight="700">2</text>
  <g class="t"><text x="44" y="194">Ben</text><text x="150" y="194">180,000</text></g>
  <text class="b" x="330" y="194">3</text>
  <text class="warnt" x="470" y="194" font-size="14" font-weight="700">3</text>
  <text class="warnt" x="630" y="194" font-size="14" font-weight="700">3</text>
  <g class="t"><text x="44" y="224">Chen</text><text x="150" y="224">180,000</text></g>
  <text class="b" x="330" y="224">4</text>
  <text class="warnt" x="470" y="224" font-size="14" font-weight="700">3</text>
  <text class="warnt" x="630" y="224" font-size="14" font-weight="700">3</text>
  <g class="t"><text x="44" y="254">Eva</text><text x="150" y="254">140,000</text></g>
  <text class="b" x="330" y="254">5</text>
  <text class="badt" x="470" y="254" font-size="14" font-weight="700">5</text>
  <text class="okt" x="630" y="254" font-size="14" font-weight="700">4</text>
  <text class="badt" x="490" y="254" font-size="13">4 skipped</text>
  <text class="okt" x="650" y="254" font-size="13">no gap</text>
  <text class="sub" x="44" y="278">ROW_NUMBER breaks the tie arbitrarily unless you add a tie-breaker such as id.</text>
  <text class="sub" x="28" y="318">"Nth highest distinct salary" is DENSE_RANK = N: the third highest is 180,000.</text>
</svg>
