name: Build & deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write          # lets wrangler-action create GitHub deployment entries
  pull-requests: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_PAGES_PROJECT: interview-prep-kb   # must match the Cloudflare Pages project name

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install Zensical
        run: pip install -r requirements.txt

      - name: Build site
        run: zensical build

      - name: Deploy to Cloudflare Pages
        # Fork PRs don't get secrets; skip deploy there (build still validates the site)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # main → production; PR branches → preview URLs (<branch>.<project>.pages.dev)
          command: >-
            pages deploy site
            --project-name=${{ env.CF_PAGES_PROJECT }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
