iddle" font-size="13">day 6 (76)</text><text class="t" x="560" y="256">76 is warmer: pop day 5, day 2.</text><text class="t" x="560" y="276">answer = today − popped day.</text><text class="t" x="560" y="296">Then push day 6.</text></g>
