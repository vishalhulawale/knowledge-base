<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 334" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">The U-D-D-C-S framing chain</title>
  <desc id="d">Five boxes in a chain: Users (who acts on the output, giving one primary user), Decisions (what they decide, how often and how fast, giving one decision for version one), Data (what they decide with and where it lives, giving a field list and grain), Constraints (time, systems, law, people, cost, giving three to five including hidden ones) and Success (metric, baseline, target and guardrail, giving one computable number). The Decisions box is highlighted as the hinge. A dashed arrow loops from Success back to Data: if the metric needs data nobody has, revisit the data lens. Spend 5 to 10 minutes framing, then commit to one user and one decision.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="332" rx="14"/>
  <text class="h" x="28" y="40">U-D-D-C-S: the fixed opening for an ambiguous prompt</text><text class="sub" x="28" y="62">Decisions are the hinge: every object, screen and line of code traces back to one.</text><rect class="bp" x="28" y="110" width="136" height="64" rx="10" stroke-width="1.5"/><text class="prit" x="96" y="140" text-anchor="middle" style="font-size:22px">U</text><text class="sm" x="96" y="162" text-anchor="middle" font-weight="700">Users</text><line class="ln" x1="165" y1="142" x2="176" y2="142" marker-end="url(#ar)"/><text class="sm" x="32" y="200">Who acts on</text><text class="sm" x="32" y="217">the output?</text><text class="teat" x="32" y="248" font-size="13">→ One primary user</text><rect class="pri" x="178" y="110" width="136" height="64" rx="10" stroke-width="1.5"/><text class="on" x="246" y="140" text-anchor="middle" style="font-size:22px">D</text><text class="on13" x="246" y="162" text-anchor="middle" font-weight="700">Decisions</text><line class="ln" x1="315" y1="142" x2="326" y2="142" marker-end="url(#ar)"/><text class="sm" x="182" y="200">What do they decide,</text><text class="sm" x="182" y="217">how often, how fast?</text><text class="teat" x="182" y="248" font-size="13">→ One decision for v1</text><rect class="bp" x="328" y="110" width="136" height="64" rx="10" stroke-width="1.5"/><text class="prit" x="396" y="140" text-anchor="middle" style="font-size:22px">D</text><text class="sm" x="396" y="162" text-anchor="middle" font-weight="700">Data</text><line class="ln" x1="465" y1="142" x2="476" y2="142" marker-end="url(#ar)"/><text class="sm" x="332" y="200">What do they decide</text><text class="sm" x="332" y="217">with, and where?</text><text class="teat" x="332" y="248" font-size="13">→ Field list + grain</text><rect class="bp" x="478" y="110" width="136" height="64" rx="10" stroke-width="1.5"/><text class="prit" x="546" y="140" text-anchor="middle" style="font-size:22px">C</text><text class="sm" x="546" y="162" text-anchor="middle" font-weight="700">Constraints</text><line class="ln" x1="615" y1="142" x2="626" y2="142" marker-end="url(#ar)"/><text class="sm" x="482" y="200">Time, systems, law,</text><text class="sm" x="482" y="217">people, cost?</text><text class="teat" x="482" y="248" font-size="13">→ 3–5, incl. hidden</text><rect class="bp" x="628" y="110" width="136" height="64" rx="10" stroke-width="1.5"/><text class="prit" x="696" y="140" text-anchor="middle" style="font-size:22px">S</text><text class="sm" x="696" y="162" text-anchor="middle" font-weight="700">Success</text><text class="sm" x="632" y="200">Metric, baseline,</text><text class="sm" x="632" y="217">target, guardrail?</text><text class="teat" x="632" y="248" font-size="13">→ One number</text><path class="lnw dash" d="M 696 108 C 696 82, 396 82, 396 106" marker-end="url(#arw)"/><text class="wrnt" x="546" y="80" text-anchor="middle" font-size="13">metric needs data nobody has? revisit Data</text><text class="sm" x="28" y="290">Spend 5–10 minutes here, say assumptions aloud with a default for each question,</text><text class="sm" x="28" y="308">then commit to one user and one decision and start building.</text>
</svg>
