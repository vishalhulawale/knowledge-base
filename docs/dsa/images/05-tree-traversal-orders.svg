  <text class="lb" x="750" y="275" text-anchor="middle">7</text>
  <g class="a s0"><circle class="pri" cx="570" cy="270" r="18"/><text class="on" x="570" y="275" text-anchor="middle">1</text><circle class="warn" cx="587" cy="254" r="11"/><text class="on" x="587" y="258.5" text-anchor="middle" font-size="13">1</text><text class="tb" x="576" y="322" text-anchor="middle" font-size="17" font-weight="700">1</text></g>
  <g class="a s1"><circle class="pri" cx="630" cy="270" r="18"/><text class="on" x="630" y="275" text-anchor="middle">3</text><circle class="warn" cx="647" cy="254" r="11"/><text class="on" x="647" y="258.5" text-anchor="middle" font-size="13">2</text><text class="tb" x="604" y="322" text-anchor="middle" font-size="17" font-weight="700">3</text></g>
