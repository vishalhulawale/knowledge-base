<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Scope of the first- and second-level caches</title>
  <desc id="d">Pod A runs two transactions. Each has its own first-level cache holding its own Drug instance for the same id, and each dies with its transaction. Below them, the second-level cache region for Drug is shared by all sessions in Pod A's JVM and stores dehydrated state, an array of field values keyed by id, not Java objects. Pod B, with a local provider, has its own separate second-level region holding its own copy. Both read from the same database. A distributed provider would replace the per-pod regions with one shared cache.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .txt{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#0f172a}
    .pod{fill:none;stroke:#64748b;stroke-width:2}
    .tx{fill:#ffffff;stroke:#cbd5e1}
    .l1t{fill:#4f46e5;font-size:13px;font-weight:700}
    .inst{fill:#4f46e5}
    .instt{fill:#fff;font-size:13px;font-weight:700}
    .l2{fill:#0ea5a4;fill-opacity:.12;stroke:#0ea5a4;stroke-width:2}
    .l2t{fill:#0f766e;font-size:13px;font-weight:700}
    .db{fill:#ffffff;stroke:#cbd5e1}
    .ln{stroke:#94a3b8;stroke-width:2;fill:none}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.mono{fill:#f1f5f9}.lbl,.txt{fill:#e2e8f0}.sub{fill:#94a3b8}
      .pod{stroke:#94a3b8}
      .tx,.db{fill:#111827;stroke:#475569}
      .l1t{fill:#818cf8}.inst{fill:#818cf8}.instt{fill:#0f172a}
      .l2{fill:#2dd4bf;fill-opacity:.12;stroke:#2dd4bf}.l2t{fill:#5eead4}
      .ln{stroke:#64748b}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="448" rx="14"/>
  <text class="h" x="28" y="40">L1 lives per transaction, L2 per JVM</text>
  <text class="sub" x="28" y="62">Same Drug row (ndc 123) in two transactions and two pods, with a local L2 provider.</text>

  <!-- Pod A -->
  <rect class="pod" x="28" y="80" width="500" height="270" rx="12"/>
  <text class="lbl" x="44" y="104">Pod A (one JVM, one EntityManagerFactory)</text>

  <rect class="tx" x="44" y="118" width="226" height="96" rx="10"/>
  <text class="l1t" x="58" y="140">Transaction 1: L1 cache</text>
  <rect class="inst" x="58" y="152" width="198" height="30" rx="8"/>
  <text class="instt" x="157" y="172" text-anchor="middle">Drug instance #1</text>
  <text class="sub" x="58" y="204">gone at commit</text>

  <rect class="tx" x="286" y="118" width="226" height="96" rx="10"/>
  <text class="l1t" x="300" y="140">Transaction 2: L1 cache</text>
  <rect class="inst" x="300" y="152" width="198" height="30" rx="8"/>
  <text class="instt" x="399" y="172" text-anchor="middle">Drug instance #2</text>
  <text class="sub" x="300" y="204">a different object</text>

  <path class="ln" d="M157 214 V246"/><path class="ln" d="M399 214 V246"/>

  <rect class="l2" x="44" y="246" width="468" height="88" rx="10"/>
  <text class="l2t" x="58" y="268">L2 region "drug": shared by all sessions in Pod A</text>
  <text class="mono" x="58" y="294">123 → ["Amoxicillin", "500 mg", v3]</text>
  <text class="sub" x="58" y="318">Dehydrated field values, assembled into a new instance on a hit</text>

  <!-- Pod B -->
  <rect class="pod" x="548" y="80" width="224" height="270" rx="12"/>
  <text class="lbl" x="564" y="104">Pod B</text>
  <rect class="tx" x="564" y="118" width="192" height="96" rx="10"/>
  <text class="l1t" x="578" y="140">Transaction 3: L1</text>
  <rect class="inst" x="578" y="152" width="164" height="30" rx="8"/>
  <text class="instt" x="660" y="172" text-anchor="middle">Drug instance #3</text>
  <path class="ln" d="M660 214 V246"/>
  <rect class="l2" x="564" y="246" width="192" height="88" rx="10"/>
  <text class="l2t" x="578" y="268">Its own L2 region</text>
  <text class="sub" x="578" y="292">A separate copy that</text>
  <text class="sub" x="578" y="310">Pod A's writes don't</text>
  <text class="sub" x="578" y="328">update</text>

  <!-- DB -->
  <path class="ln" d="M278 334 V374"/><path class="ln" d="M660 334 V374"/>
  <rect class="db" x="28" y="374" width="744" height="40" rx="10"/>
  <text class="lbl" x="400" y="399" text-anchor="middle">Database: drug table</text>
  <text class="sub" x="28" y="436">A distributed provider (Infinispan, Hazelcast, Redisson) replaces the per-pod regions with one shared cache.</text>
</svg>
