<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Hybrid fan-out for a news feed</title>
  <desc id="d">A normal author with 200 followers posts p1, and the fan-out service pushes the post id into each follower's timeline cache. A celebrity with 50 million followers posts c1, and the fan-out service skips the push and only records the post in a celebrity posts index. When follower 1 opens the feed, the feed service reads the follower's timeline and merges in recent posts from followed celebrities at read time.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:14px;font-weight:600}
    .tx{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
    .ln{stroke:#cbd5e1;stroke-width:2}
    .dl{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:5 5}
    .p{fill:#4f46e5}.c{fill:#d97706}
    .pt{fill:#fff;font-size:12px;font-weight:700}
    .hl{fill:none;stroke:#16a34a;stroke-width:3}
    .step{fill:#0f172a;font-size:15px;font-weight:700}
    .good{fill:#16a34a;font-size:14px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.step{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}.ln,.dl{stroke:#475569}
      .p{fill:#818cf8}.c{fill:#fbbf24}.pt{fill:#0f172a}.hl{stroke:#4ade80}.good{fill:#4ade80}
    }
    /* 12 s loop: normal post 0-30%, celebrity post 32-60%, read 62-95% */
    .a{animation:12s infinite ease-in-out}
    .f{animation:12s infinite linear}
    @keyframes a1{0%,2%{transform:translate(0,0);opacity:1}10%{transform:translate(52px,75px);opacity:1}12%,100%{transform:translate(52px,75px);opacity:0}}
    @keyframes fo1{0%,12%{transform:translate(0,0);opacity:0}13%{opacity:1}22%{transform:translate(90px,-88px);opacity:1}24%,100%{transform:translate(90px,-88px);opacity:0}}
    @keyframes fo2{0%,12%{transform:translate(0,0);opacity:0}13%{opacity:1}22%{transform:translate(90px,-28px);opacity:1}24%,100%{transform:translate(90px,-28px);opacity:0}}
    @keyframes fo3{0%,12%{transform:translate(0,0);opacity:0}13%{opacity:1}22%{transform:translate(90px,32px);opacity:1}24%,100%{transform:translate(90px,32px);opacity:0}}
    @keyframes c1{0%,32%{transform:translate(0,0);opacity:0}33%{opacity:1}42%{transform:translate(52px,-75px);opacity:1}44%,100%{transform:translate(52px,-75px);opacity:0}}
    @keyframes ci{0%,44%{transform:translate(0,0);opacity:0}45%{opacity:1}54%{transform:translate(90px,112px);opacity:1}56%,100%{transform:translate(90px,112px);opacity:0}}
    @keyframes chP{0%,22%{opacity:0}24%,95%{opacity:1}98%,100%{opacity:0}}
    @keyframes chC{0%,54%{opacity:0}56%,95%{opacity:1}98%,100%{opacity:0}}
    @keyframes s1{0%,30%{opacity:1}32%,97%{opacity:0}98%,100%{opacity:1}}
    @keyframes s2{0%,31%{opacity:0}32%,60%{opacity:1}62%,100%{opacity:0}}
    @keyframes s3{0%,61%{opacity:0}62%,95%{opacity:1}98%,100%{opacity:0}}
    .a1{animation-name:a1}.fo1{animation-name:fo1}.fo2{animation-name:fo2}.fo3{animation-name:fo3}.c1{animation-name:c1}.ci{animation-name:ci}
    .chP{animation-name:chP}.chC{animation-name:chC}.s1{animation-name:s1}.s2{animation-name:s2}.s3{animation-name:s3}
    @media (prefers-reduced-motion: reduce){.a,.f{animation:none}.a,.s1,.s2{opacity:0}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="428" rx="14"/>
  <text class="h" x="28" y="40">Hybrid fan-out: push for most, pull for celebrities</text>
  <text class="sub" x="28" y="62">Timelines hold post ids only. Follower numbers from this page's example.</text>

  <!-- links -->
  <line class="ln" x1="198" y1="125" x2="250" y2="200"/>
  <line class="ln" x1="198" y1="275" x2="250" y2="200"/>
  <line class="ln" x1="380" y1="200" x2="470" y2="112"/>
  <line class="ln" x1="380" y1="200" x2="470" y2="172"/>
  <line class="ln" x1="380" y1="200" x2="470" y2="232"/>
  <line class="dl" x1="380" y1="200" x2="470" y2="312"/>

  <rect class="box" x="28" y="100" width="170" height="50" rx="10"/>
  <text class="lbl" x="44" y="122">Normal author</text><text class="sub" x="44" y="140">200 followers</text>
  <rect class="box" x="28" y="250" width="170" height="50" rx="10"/>
  <text class="lbl" x="44" y="272">Celebrity</text><text class="sub" x="44" y="290">50M followers</text>
  <rect class="box" x="250" y="170" width="130" height="60" rx="10"/>
  <text class="lbl" x="315" y="197" text-anchor="middle">Fan-out</text><text class="lbl" x="315" y="215" text-anchor="middle">service</text>

  <rect class="box" x="470" y="90" width="200" height="44" rx="8"/><text class="tx" x="484" y="117">Timeline: follower 1</text>
  <rect class="box" x="470" y="150" width="200" height="44" rx="8"/><text class="tx" x="484" y="177">Timeline: follower 2</text>
  <rect class="box" x="470" y="210" width="200" height="44" rx="8"/><text class="tx" x="484" y="237">Timeline: follower 3</text>
  <rect class="box" x="470" y="290" width="200" height="44" rx="8"/><text class="tx" x="484" y="317">Celebrity posts index</text>
  <text class="sub" x="425" y="282" text-anchor="middle">no push</text>

  <!-- stored ids -->
  <g class="f chP">
    <rect class="p" x="630" y="100" width="30" height="24" rx="5"/><text class="pt" x="645" y="117" text-anchor="middle">p1</text>
    <rect class="p" x="630" y="160" width="30" height="24" rx="5"/><text class="pt" x="645" y="177" text-anchor="middle">p1</text>
    <rect class="p" x="630" y="220" width="30" height="24" rx="5"/><text class="pt" x="645" y="237" text-anchor="middle">p1</text>
  </g>
  <g class="f chC"><rect class="c" x="630" y="300" width="30" height="24" rx="5"/><text class="pt" x="645" y="317" text-anchor="middle">c1</text></g>

  <!-- moving posts -->
  <circle class="p a a1" cx="198" cy="125" r="8"/>
  <circle class="p a fo1" cx="380" cy="200" r="7"/><circle class="p a fo2" cx="380" cy="200" r="7"/><circle class="p a fo3" cx="380" cy="200" r="7"/>
  <circle class="c a c1" cx="198" cy="275" r="8"/>
  <circle class="c a ci" cx="380" cy="200" r="7"/>

  <!-- read phase -->
  <g class="f s3">
    <rect class="hl" x="470" y="90" width="200" height="44" rx="8"/>
    <rect class="hl" x="470" y="290" width="200" height="44" rx="8"/>
    <text class="good" x="688" y="200">feed for</text>
    <text class="good" x="688" y="218">follower 1</text>
    <text class="good" x="688" y="236">= p1 + c1</text>
  </g>

  <text class="step f s1" x="28" y="374">Normal post: push p1 into every follower's timeline (fan-out on write).</text>
  <text class="step f s2" x="28" y="374">Celebrity post: skip 50M writes, only record c1 in the index.</text>
  <text class="step f s3" x="28" y="374">Follower opens the feed: timeline + celebrity posts merged at read time.</text>
  <text class="sub" x="28" y="410">Only 3 of the 200 timelines are drawn. Ranking and hydration happen after the merge.</text>
</svg>
