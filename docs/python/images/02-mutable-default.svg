<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Mutable default argument</title>
  <desc id="d">Animation: on the left, add_tag with a default tags=[] is called three times without tags. The single list stored in add_tag.__defaults__ grows from empty to a, then a and b, then a, b and c, and each call returns that same growing list. On the right, the fixed version with tags=None creates a fresh list on every call, returning ['a'], ['b'] and ['c'].</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes p0{0%,24.99%{opacity:1}25%,100%{opacity:0}}.p0{animation-name:p0}
    @keyframes p1{0%,24.99%{opacity:0}25%,49.99%{opacity:1}50%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,49.99%{opacity:0}50%,74.99%{opacity:1}75%,100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%,74.99%{opacity:0}75%,100%{opacity:1}}.p3{animation-name:p3}
    @keyframes c0{0%,24.99%{opacity:0}25%,100%{opacity:1}}.c0{animation-name:c0}
    @keyframes c1{0%,49.99%{opacity:0}50%,100%{opacity:1}}.c1{animation-name:c1}
    @keyframes c2{0%,74.99%{opacity:0}75%,100%{opacity:1}}.c2{animation-name:c2}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}.p0,.p1,.p2{opacity:0}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="348" rx="14"/>
  <text class="h" x="28" y="40">Default values are evaluated once, at def time</text><text class="sub" x="28" y="62">The default list lives on the function object, so every call shares it.</text><rect class="bb" x="20" y="80" width="420" height="254" rx="10" stroke-width="1.2"/><rect class="bo" x="456" y="80" width="324" height="254" rx="10" stroke-width="1.2"/><text class="mono" x="36" y="106" xml:space="preserve">def add_tag(tag, tags=[]):</text><text class="mono" x="472" y="106" xml:space="preserve">def add_tag(tag, tags=None):</text><text class="mono" x="472" y="126" xml:space="preserve">    if tags is None: tags = []</text><rect class="box" x="36" y="124" width="170" height="46" rx="8" stroke-width="1.5"/><text class="sm" x="121" y="143.5" text-anchor="middle" font-weight="700">add_tag</text><text class="sm" x="121" y="160.5" text-anchor="middle">function object</text><text class="sub" x="244" y="190">add_tag.__defaults__[0]</text><line class="ln" x1="206" y1="147" x2="236" y2="147" marker-end="url(#ar)"/><g class="k p0"><rect class="bm" x="244" y="129" width="44" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="266" y="152" text-anchor="middle" xml:space="preserve">[ ]</text></g><g class="k p1"><rect class="bw" x="244" y="129" width="44" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="266" y="152" text-anchor="middle" xml:space="preserve">'a'</text></g><g class="k p2"><rect class="bw" x="244" y="129" width="44" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="266" y="152" text-anchor="middle" xml:space="preserve">'a'</text><rect class="bw" x="288" y="129" width="44" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="310" y="152" text-anchor="middle" xml:space="preserve">'b'</text></g><g class="k p3"><rect class="bw" x="244" y="129" width="44" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="266" y="152" text-anchor="middle" xml:space="preserve">'a'</text><rect class="bw" x="288" y="129" width="44" height="36" rx="0" stroke-width="1.2"/><text class="mono" x="310" y="152" text-anchor="middle" xml:space="preserve">'b'</text><rect class="bw" x="332" y="129" width="44" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="354" y="152" text-anchor="middle" xml:space="preserve">'c'</text></g><g class="k c0"><text class="mono" x="36" y="232" xml:space="preserve">add_tag("a") → ['a']</text><text class="mono" x="472" y="172" xml:space="preserve">add_tag("a") → ['a']</text></g><g class="k c1"><text class="mono" x="36" y="260" xml:space="preserve">add_tag("b") → ['a', 'b']</text><text class="mono" x="472" y="200" xml:space="preserve">add_tag("b") → ['b']</text></g><g class="k c2"><text class="mono" x="36" y="288" xml:space="preserve">add_tag("c") → ['a', 'b', 'c']</text><text class="mono" x="472" y="228" xml:space="preserve">add_tag("c") → ['c']</text></g><text class="badt" x="36" y="320" style="font-size:14px">one list, growing across calls</text><text class="okt" x="472" y="260" style="font-size:14px">a fresh list on every call</text><text class="sm" x="472" y="286">dataclass: field(default_factory=list)</text>
</svg>
