    @keyframes kw50_96{0%,48.5%{opacity:0}50%,94.5%{opacity:1}96%,100%{opacity:0}}
    .w50_96{opacity:0;animation:kw50_96 12s infinite linear}
    @keyframes kw35_55{0%,33.5%{opacity:0}35%,53.5%{opacity:1}55%,100%{opacity:0}}
    .w35_55{opacity:0;animation:kw35_55 12s infinite linear}
    @keyframes kw70_90{0%,68.5%{opacity:0}70%,88.5%{opacity:1}90%,100%{opacity:0}}
    .w70_90{opacity:0;animation:kw70_90 12s infinite linear}
    @keyframes kw60_96{0%,58.5%{opacity:0}60%,94.5%{opacity:1}96%,100%{opacity:0}}
    .w60_96{opacity:0;animation:kw60_96 12s infinite linear}
    @keyframes kw55_72{0%,53.5%{opacity:0}55%,70.5%{opacity:1}72%,100%{opacity:0}}
    .w55_72{opacity:0;animation:kw55_72 12s infinite linear}
    @keyframes kw0_35{0%,33.5%{opacity:1}35%,97.5%{opacity:0}100%{opacity:1}}
    .w0_35{opacity:0;animation:kw0_35 12s infinite linear}
    @keyframes kw55_70{0%,53.5%{opacity:0}55%,68.5%{opacity:1}70%,100%{opacity:0}}
    .w55_70{opacity:0;animation:kw55_70 12s infinite linear}
    @keyframes kw70_96{0%,68.5%{opacity:0}70%,94.5%{opacity:1}96%,100%{opacity:0}}
    .w70_96{opacity:0;animation:kw70_96 12s infinite linear}

    @keyframes kmv{0%,34%{transform:translateY(0)}40%,74%{transform:translateY(124px)}75%,100%{transform:translateY(0)}}
    @keyframes kfd{0%,70%{opacity:1}73%,98%{opacity:0}100%{opacity:1}}
