<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Targeted vs scatter-gather queries</title>
  <desc id="d">Claims sharded on memberId then serviceDate across three shards. Left, a query that includes the key prefix, memberId M000042: mongos looks up the routing table and sends it to the one shard that owns that range: SINGLE_SHARD, 5 documents examined, 7 ms in the measured run. Right, a query on status and amount, which aren&#x27;t in the shard key: mongos must send it to every shard and merge the results: SHARD_MERGE, 100,000 documents examined, 44 ms. Adding shards adds work to every scatter-gather query.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <defs><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">Does the query contain the shard key prefix?</text>
  <text class="sub" x="28" y="62">Shard key {memberId: 1, serviceDate: 1}. Times measured on the page with two shards.</text>
  <text class="sm prit" x="28" y="100">find({memberId: &#x27;M000042&#x27;})</text>
  <rect class="bp" x="138" y="116" width="132" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="204" y="141" text-anchor="middle" font-weight="700">mongos</text>
  <rect class="bo" x="28" y="240" width="110" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="83" y="259" text-anchor="middle" font-weight="700">Shard 1</text>
  <text class="sm" x="83" y="276" text-anchor="middle">low members</text>
  <line class="lnt" x1="204" y1="156" x2="83" y2="236" marker-end="url(#art)"/>
  <rect class="box" x="148" y="240" width="110" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="203" y="259" text-anchor="middle" font-weight="700">Shard 2</text>
  <text class="sm" x="203" y="276" text-anchor="middle">mid members</text>
  <rect class="box" x="268" y="240" width="110" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="323" y="259" text-anchor="middle" font-weight="700">Shard 3</text>
  <text class="sm" x="323" y="276" text-anchor="middle">high members</text>
  <text class="lbl okt" x="28" y="310">SINGLE_SHARD</text>
  <text class="sm" x="28" y="330">5 docs examined · 7 ms</text>
  <text class="sm prit" x="420" y="100">find({status: &#x27;DENIED&#x27;, amount: {$gt: 499}})</text>
  <rect class="bp" x="530" y="116" width="132" height="40" rx="10" stroke-width="1.5"/>
  <text class="tx" x="596" y="141" text-anchor="middle" font-weight="700">mongos</text>
  <rect class="bw" x="420" y="240" width="110" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="475" y="259" text-anchor="middle" font-weight="700">Shard 1</text>
  <text class="sm" x="475" y="276" text-anchor="middle">low members</text>
  <line class="lnw" x1="596" y1="156" x2="475" y2="236" marker-end="url(#arw)"/>
  <rect class="bw" x="540" y="240" width="110" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="595" y="259" text-anchor="middle" font-weight="700">Shard 2</text>
  <text class="sm" x="595" y="276" text-anchor="middle">mid members</text>
  <line class="lnw" x1="596" y1="156" x2="595" y2="236" marker-end="url(#arw)"/>
  <rect class="bw" x="660" y="240" width="110" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="715" y="259" text-anchor="middle" font-weight="700">Shard 3</text>
  <text class="sm" x="715" y="276" text-anchor="middle">high members</text>
  <line class="lnw" x1="596" y1="156" x2="715" y2="236" marker-end="url(#arw)"/>
  <text class="lbl badt" x="420" y="310">SHARD_MERGE</text>
  <text class="sm" x="420" y="330">100,000 docs examined · 44 ms</text>
  <line class="ln dash" x1="400" y1="92" x2="400" y2="340"/>
  <text class="sub" x="28" y="364">A query on only a suffix of the key (serviceDate alone) is scatter-gather too.</text>
</svg>
