<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Power of two random choices</title>
  <desc id="d">A load balancer and six servers with bars showing outstanding requests: S1 has 3, S2 has 1, S3 has 4, S4 has 2, S5 has 5 and S6 has 2. For each new request the balancer picks two servers at random and sends the request to the less loaded one. First it picks S3 and S6 and sends to S6. Then S1 and S5, sending to S1. Then S2 and S4, sending to S2.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .lbl{fill:#334155;font-size:14px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
    .u{fill:#4f46e5}
    .nu{fill:#0ea5a4}
    .pk{fill:none;stroke:#d97706;stroke-width:2;stroke-dasharray:6 4}
    .ch{fill:none;stroke:#16a34a;stroke-width:3}
    .dot{fill:#0ea5a4}
    .step{fill:#0f172a;font-size:15px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.step{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .u{fill:#818cf8}.nu,.dot{fill:#2dd4bf}.pk{stroke:#fbbf24}.ch{stroke:#4ade80}
    }
    /* 9 s loop, three rounds starting at 0%, 32%, 64% */
    .a{animation:9s infinite linear}
    @keyframes p1{0%,2%{opacity:0}3%,28%{opacity:1}30%,100%{opacity:0}}
    @keyframes c1{0%,9%{opacity:0}10%,28%{opacity:1}30%,100%{opacity:0}}
    @keyframes d1{0%,11%{opacity:0;transform:translate(0,0)}12%{opacity:1;transform:translate(0,0)}22%{opacity:1;transform:translate(174px,105px)}23%,100%{opacity:0;transform:translate(174px,105px)}}
    @keyframes n1{0%,22%{opacity:0}23%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes t1{0%,30%{opacity:1}31%,97%{opacity:0}99%,100%{opacity:1}}
    @keyframes p2{0%,34%{opacity:0}35%,60%{opacity:1}62%,100%{opacity:0}}
    @keyframes c2{0%,41%{opacity:0}42%,60%{opacity:1}62%,100%{opacity:0}}
    @keyframes d2{0%,43%{opacity:0;transform:translate(0,0)}44%{opacity:1;transform:translate(0,0)}54%{opacity:1;transform:translate(174px,-105px)}55%,100%{opacity:0;transform:translate(174px,-105px)}}
    @keyframes n2{0%,54%{opacity:0}55%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes t2{0%,31%{opacity:0}32%,62%{opacity:1}63%,100%{opacity:0}}
    @keyframes p3{0%,66%{opacity:0}67%,94%{opacity:1}96%,100%{opacity:0}}
    @keyframes c3{0%,73%{opacity:0}74%,94%{opacity:1}96%,100%{opacity:0}}
    @keyframes d3{0%,75%{opacity:0;transform:translate(0,0)}76%{opacity:1;transform:translate(0,0)}86%{opacity:1;transform:translate(174px,-63px)}87%,100%{opacity:0;transform:translate(174px,-63px)}}
    @keyframes n3{0%,86%{opacity:0}87%,96%{opacity:1}99%,100%{opacity:0}}
    @keyframes t3{0%,63%{opacity:0}64%,96%{opacity:1}98%,100%{opacity:0}}
    .p1{animation-name:p1}.c1{animation-name:c1}.d1{animation-name:d1}.n1{animation-name:n1}.t1{animation-name:t1}
    .p2{animation-name:p2}.c2{animation-name:c2}.d2{animation-name:d2}.n2{animation-name:n2}.t2{animation-name:t2}
    .p3{animation-name:p3}.c3{animation-name:c3}.d3{animation-name:d3}.n3{animation-name:n3}.t3{animation-name:t3}
    @media (prefers-reduced-motion: reduce){
      .a{animation:none;opacity:0}
      .n1,.n2,.n3,.p3,.c3,.t3{opacity:1}
    }
  </style>
  <rect class="card" x="1" y="1" width="798" height="408" rx="14"/>
  <text class="h" x="28" y="40">Power of two random choices</text>
  <text class="sub" x="28" y="62">Bars show outstanding requests per server.</text>

  <rect class="box" x="28" y="185" width="120" height="50" rx="10"/>
  <text class="lbl" x="88" y="207" text-anchor="middle">Load</text>
  <text class="lbl" x="88" y="224" text-anchor="middle">balancer</text>

  <!-- servers: row centres 105,147,189,231,273,315 -->
  <g>
    <rect class="box" x="330" y="90" width="76" height="30" rx="7"/><text class="lbl" x="368" y="110" text-anchor="middle">S1</text>
    <rect class="box" x="330" y="132" width="76" height="30" rx="7"/><text class="lbl" x="368" y="152" text-anchor="middle">S2</text>
    <rect class="box" x="330" y="174" width="76" height="30" rx="7"/><text class="lbl" x="368" y="194" text-anchor="middle">S3</text>
    <rect class="box" x="330" y="216" width="76" height="30" rx="7"/><text class="lbl" x="368" y="236" text-anchor="middle">S4</text>
    <rect class="box" x="330" y="258" width="76" height="30" rx="7"/><text class="lbl" x="368" y="278" text-anchor="middle">S5</text>
    <rect class="box" x="330" y="300" width="76" height="30" rx="7"/><text class="lbl" x="368" y="320" text-anchor="middle">S6</text>
  </g>
  <!-- initial load: 3,1,4,2,5,2 -->
  <g class="u">
    <rect x="420" y="94" width="30" height="22" rx="4"/><rect x="456" y="94" width="30" height="22" rx="4"/><rect x="492" y="94" width="30" height="22" rx="4"/>
    <rect x="420" y="136" width="30" height="22" rx="4"/>
    <rect x="420" y="178" width="30" height="22" rx="4"/><rect x="456" y="178" width="30" height="22" rx="4"/><rect x="492" y="178" width="30" height="22" rx="4"/><rect x="528" y="178" width="30" height="22" rx="4"/>
    <rect x="420" y="220" width="30" height="22" rx="4"/><rect x="456" y="220" width="30" height="22" rx="4"/>
    <rect x="420" y="262" width="30" height="22" rx="4"/><rect x="456" y="262" width="30" height="22" rx="4"/><rect x="492" y="262" width="30" height="22" rx="4"/><rect x="528" y="262" width="30" height="22" rx="4"/><rect x="564" y="262" width="30" height="22" rx="4"/>
    <rect x="420" y="304" width="30" height="22" rx="4"/><rect x="456" y="304" width="30" height="22" rx="4"/>
  </g>
  <!-- new requests -->
  <rect class="nu a n1" x="492" y="304" width="30" height="22" rx="4"/>
  <rect class="nu a n2" x="528" y="94" width="30" height="22" rx="4"/>
  <rect class="nu a n3" x="456" y="136" width="30" height="22" rx="4"/>

  <!-- round 1: S3 vs S6 -->
  <rect class="pk a p1" x="322" y="168" width="290" height="42" rx="9"/>
  <rect class="pk a p1" x="322" y="294" width="290" height="42" rx="9"/>
  <rect class="ch a c1" x="322" y="294" width="290" height="42" rx="9"/>
  <circle class="dot a d1" cx="148" cy="210" r="7"/>
  <!-- round 2: S1 vs S5 -->
  <rect class="pk a p2" x="322" y="84" width="290" height="42" rx="9"/>
  <rect class="pk a p2" x="322" y="252" width="290" height="42" rx="9"/>
  <rect class="ch a c2" x="322" y="84" width="290" height="42" rx="9"/>
  <circle class="dot a d2" cx="148" cy="210" r="7"/>
  <!-- round 3: S2 vs S4 -->
  <rect class="pk a p3" x="322" y="126" width="290" height="42" rx="9"/>
  <rect class="pk a p3" x="322" y="210" width="290" height="42" rx="9"/>
  <rect class="ch a c3" x="322" y="126" width="290" height="42" rx="9"/>
  <circle class="dot a d3" cx="148" cy="210" r="7"/>

  <!-- rule -->
  <text class="lbl" x="636" y="110">For each request</text>
  <text class="tx" x="636" y="136">1. Pick 2 servers</text>
  <text class="tx" x="636" y="154">at random.</text>
  <text class="tx" x="636" y="180">2. Send to the one</text>
  <text class="tx" x="636" y="198">with fewer</text>
  <text class="tx" x="636" y="216">outstanding</text>
  <text class="tx" x="636" y="234">requests.</text>
  <text class="sub" x="636" y="266">No global "least</text>
  <text class="sub" x="636" y="284">loaded" lookup, so</text>
  <text class="sub" x="636" y="302">balancers don't herd.</text>

  <text class="step a t1" x="28" y="370">Picked S3 (4 in flight) and S6 (2) → send to S6</text>
  <text class="step a t2" x="28" y="370">Picked S1 (3) and S5 (5) → send to S1</text>
  <text class="step a t3" x="28" y="370">Picked S2 (1) and S4 (2) → send to S2</text>
  <text class="sub" x="28" y="394">Completed requests are not shown, to keep the example readable.</text>
</svg>
