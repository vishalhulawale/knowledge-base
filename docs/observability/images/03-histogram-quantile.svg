<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 422" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Histogram quantile estimate</title>
  <desc id="d">Animation: five cumulative bucket bars grow for 1,000 requests: 700 at or under 100 ms, 950 under 250 ms, 995 under 500 ms, 1,000 under 1 second and 1,000 in plus infinity. A dashed line at rank 990, the 99th percentile, crosses the 250 to 500 ms bucket. histogram_quantile interpolates linearly: 250 plus 40 out of 45 times 250 ms gives about 472 ms. Numbers are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes b0{0%,4%{transform:scaleY(0)}12%,100%{transform:scaleY(1)}}.b0{transform-box:fill-box;transform-origin:center bottom;animation:b0 14s infinite ease-out}
    @keyframes b1{0%,12%{transform:scaleY(0)}20%,100%{transform:scaleY(1)}}.b1{transform-box:fill-box;transform-origin:center bottom;animation:b1 14s infinite ease-out}
    @keyframes b2{0%,20%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}.b2{transform-box:fill-box;transform-origin:center bottom;animation:b2 14s infinite ease-out}
    @keyframes b3{0%,28%{transform:scaleY(0)}36%,100%{transform:scaleY(1)}}.b3{transform-box:fill-box;transform-origin:center bottom;animation:b3 14s infinite ease-out}
    @keyframes b4{0%,36%{transform:scaleY(0)}44%,100%{transform:scaleY(1)}}.b4{transform-box:fill-box;transform-origin:center bottom;animation:b4 14s infinite ease-out}
    @keyframes p{0%,55.99%{opacity:0}56%,100%{opacity:1}}.p{animation-name:p}
    @media (prefers-reduced-motion: reduce){[class*=' b'],[class^='b']{animation:none}.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="420" rx="14"/>
  <text class="h" x="28" y="40">How histogram_quantile finds p99</text><text class="sub" x="28" y="62">1,000 requests in cumulative buckets (le). Illustrative numbers.</text><line class="grid" x1="90" y1="330" x2="560" y2="330"/><text class="sub" x="82" y="334" text-anchor="end">900</text><line class="grid" x1="90" y1="271.5" x2="560" y2="271.5"/><text class="sub" x="82" y="275.5" text-anchor="end">925</text><line class="grid" x1="90" y1="213" x2="560" y2="213"/><text class="sub" x="82" y="217" text-anchor="end">950</text><line class="grid" x1="90" y1="154.5" x2="560" y2="154.5"/><text class="sub" x="82" y="158.5" text-anchor="end">975</text><line class="grid" x1="90" y1="96" x2="560" y2="96"/><text class="sub" x="82" y="100" text-anchor="end">1,000</text><rect class="tea b0" x="110" y="330" width="64" height="0" rx="4"/><text class="sm" x="142" y="322" text-anchor="middle">700 ↓</text><text class="sm" x="142" y="350" text-anchor="middle">≤ 100 ms</text><rect class="tea b1" x="200" y="213" width="64" height="117" rx="4"/><text class="on13" x="232" y="235" text-anchor="middle">950</text><text class="sm" x="232" y="350" text-anchor="middle">≤ 250 ms</text><rect class="wrnf b2" x="290" y="107.7" width="64" height="222.3" rx="4"/><text class="on13" x="322" y="129.7" text-anchor="middle">995</text><text class="sm" x="322" y="350" text-anchor="middle">≤ 500 ms</text><rect class="tea b3" x="380" y="96" width="64" height="234" rx="4"/><text class="on13" x="412" y="118" text-anchor="middle">1,000</text><text class="sm" x="412" y="350" text-anchor="middle">≤ 1 s</text><rect class="tea b4" x="470" y="96" width="64" height="234" rx="4"/><text class="on13" x="502" y="118" text-anchor="middle">1,000</text><text class="sm" x="502" y="350" text-anchor="middle">+Inf</text><line class="lnb dash" x1="90" y1="119.4" x2="560" y2="119.4"/><g class="k p"><text class="badt" x="112" y="111.4" style="font-size:12px">rank 990 = p99</text></g><text class="sub" x="90" y="374">y-axis starts at 900; the 700 bucket is off scale</text><rect class="bw" x="590" y="96" width="182" height="236" rx="10" stroke-width="1.5"/><g class="k p"><text class="sm" x="606" y="124">p99 = rank 990</text><text class="sm" x="606" y="146">falls in 250–500 ms</text><text class="sm" x="606" y="168">(950 → 995)</text><text class="sm" x="606" y="190"></text><text class="sm" x="606" y="212">250 + (990−950)/45</text><text class="sm" x="606" y="234">× 250 ms</text><text class="wrnt" x="606" y="256" style="font-size:16px">≈ 472 ms</text></g><text class="sm" x="28" y="402">Linear interpolation inside one bucket: put a bucket edge at your SLO threshold to make it exact.</text>
</svg>
