<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Trace context propagation</title>
  <desc id="d">Animation: a React app calls graphql-service, which calls member-api and claims-api in parallel and then publishes to Kafka, consumed by a notifier, each hop carrying the traceparent header with trace ID 4bf9. Beneath, a waterfall builds span by span: the graphql server span lasts 950 ms, the member-api client span 200 ms, the claims-api client span 900 ms and marked as the critical path, the Kafka producer span 20 ms, and the notifier consumer span runs after the response in the same trace. Durations are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes w0{0%,6%{transform:scaleX(0)}16%,100%{transform:scaleX(1)}}.w0{transform-box:fill-box;transform-origin:left center;animation:w0 14s infinite linear}
    @keyframes w1{0%,20%{transform:scaleX(0)}30%,100%{transform:scaleX(1)}}.w1{transform-box:fill-box;transform-origin:left center;animation:w1 14s infinite linear}
    @keyframes w2{0%,34%{transform:scaleX(0)}44%,100%{transform:scaleX(1)}}.w2{transform-box:fill-box;transform-origin:left center;animation:w2 14s infinite linear}
    @keyframes w3{0%,48%{transform:scaleX(0)}58%,100%{transform:scaleX(1)}}.w3{transform-box:fill-box;transform-origin:left center;animation:w3 14s infinite linear}
    @keyframes w4{0%,62%{transform:scaleX(0)}72%,100%{transform:scaleX(1)}}.w4{transform-box:fill-box;transform-origin:left center;animation:w4 14s infinite linear}
    @keyframes c{0%,79.99%{opacity:0}80%,100%{opacity:1}}.c{animation-name:c}
    @media (prefers-reduced-motion: reduce){rect[class*=' w']{animation:none}.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="422" rx="14"/>
  <text class="h" x="28" y="40">traceparent builds one tree across services</text><text class="sub" x="28" y="62">Each hop sends 00-4bf9…-&lt;parent span&gt;-01. Durations illustrative, from the page's example.</text><rect class="box" x="28" y="92" width="124" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="90" y="114" text-anchor="middle">React app</text><rect class="box" x="188" y="92" width="124" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="250" y="114" text-anchor="middle">graphql-service</text><rect class="box" x="380" y="80" width="124" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="442" y="102" text-anchor="middle">member-api</text><rect class="box" x="380" y="128" width="124" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="442" y="150" text-anchor="middle">claims-api</text><rect class="box" x="556" y="104" width="124" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="618" y="126" text-anchor="middle">Kafka</text><rect class="box" x="680" y="104" width="92" height="34" rx="8" stroke-width="1.5"/><text class="sm" x="726" y="126" text-anchor="middle">notifier</text><line class="ln" x1="153" y1="109" x2="186" y2="109" marker-end="url(#ar)"/><line class="ln" x1="313" y1="104" x2="378" y2="97" marker-end="url(#ar)"/><line class="ln" x1="313" y1="116" x2="378" y2="143" marker-end="url(#ar)"/><path class="ln" d="M 250 127 L 250 172 L 600 172 L 600 140" marker-end="url(#ar)"/><line class="ln" x1="650" y1="121" x2="678" y2="121" marker-end="url(#ar)"/><rect class="bm" x="28" y="196" width="744" height="214" rx="10"/><line class="grid" x1="210" y1="210" x2="210" y2="372"/><text class="sub" x="210" y="392" text-anchor="middle">0 ms</text><line class="grid" x1="335" y1="210" x2="335" y2="372"/><text class="sub" x="335" y="392" text-anchor="middle">250 ms</text><line class="grid" x1="460" y1="210" x2="460" y2="372"/><text class="sub" x="460" y="392" text-anchor="middle">500 ms</text><line class="grid" x1="585" y1="210" x2="585" y2="372"/><text class="sub" x="585" y="392" text-anchor="middle">750 ms</text><line class="grid" x1="710" y1="210" x2="710" y2="372"/><text class="sub" x="710" y="392" text-anchor="middle">1000 ms</text><text class="sm" x="44" y="232">graphql-service SERVER</text><rect class="pri w0" x="210" y="218" width="475" height="20" rx="4"/><text class="sm" x="44" y="262">→ member-api CLIENT</text><rect class="tea w1" x="220" y="248" width="100" height="20" rx="4"/><text class="sm" x="44" y="292">→ claims-api CLIENT</text><rect class="badf w2" x="220" y="278" width="450" height="20" rx="4"/><text class="sm" x="44" y="322">→ Kafka PRODUCER</text><rect class="wrnf w3" x="672.5" y="308" width="10" height="20" rx="4"/><text class="sm" x="44" y="352">notifier CONSUMER</text><rect class="okf w4" x="690" y="338" width="60" height="20" rx="4"/><g class="k c"><text class="on13" x="664" y="292" text-anchor="end">critical path: 900 ms</text></g>
</svg>
