  </defs>
  <rect class="card" x="1" y="1" width="798" height="518" rx="14"/>
  <text class="h" x="28" y="40">HNSW: zoom in layer by layer instead of scanning everything</text>
  <text class="sub" x="28" y="62">Greedy hop to the neighbour closest to the query; drop a layer when no neighbour is closer.</text>
  <rect class="box" x="20" y="84" width="610" height="66" rx="10" stroke-width="1.2"/>
  <text class="sub" x="34" y="102">Layer 2 (few nodes, long links)</text>
