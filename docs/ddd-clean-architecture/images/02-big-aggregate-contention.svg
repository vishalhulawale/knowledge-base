<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Aggregate size and contention</title>
  <desc id="d">Animation in three steps. Left: one large Product aggregate containing backlog item 1, backlog item 2, sprint 4 and release 2 with a single version number. Users A and B both load version 7 and edit different backlog items. A saves first and the version becomes 8; B's save with version 7 fails with an optimistic lock error. Right: the same two backlog items as separate small aggregates with their own versions 3 and 5; both saves succeed, becoming 4 and 6, because there is no shared version. Version numbers are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes s1{0%,96.99%{opacity:1}97%,100%{opacity:0}}.s1{animation-name:s1}
    @keyframes s2{0%,29.99%{opacity:0}30%,96.99%{opacity:1}97%,100%{opacity:0}}.s2{animation-name:s2}
    @keyframes s3{0%,57.99%{opacity:0}58%,96.99%{opacity:1}97%,100%{opacity:0}}.s3{animation-name:s3}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="438" rx="14"/>
  <text class="h" x="28" y="40">Big aggregates turn unrelated edits into conflicts</text><text class="sub" x="28" y="62">Optimistic locking with one @Version per aggregate. Version numbers illustrative.</text><text class="lbl" x="28" y="96">One Product aggregate</text><rect class="bm" x="28" y="108" width="360" height="150" rx="10" stroke-width="1.5"/><text class="h2" x="44" y="132">Product (root)</text><text class="sub" x="372" y="132" text-anchor="end">@Version</text><rect class="box" x="44" y="148" width="160" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="124" y="173" text-anchor="middle">BacklogItem 1</text><rect class="box" x="212" y="148" width="160" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="292" y="173" text-anchor="middle">BacklogItem 2</text><rect class="box" x="44" y="200" width="160" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="124" y="225" text-anchor="middle">Sprint 4</text><rect class="box" x="212" y="200" width="160" height="40" rx="8" stroke-width="1.5"/><text class="sm" x="292" y="225" text-anchor="middle">Release 2</text><text class="lbl" x="412" y="96">Two small aggregates</text><rect class="bm" x="412" y="108" width="176" height="150" rx="10" stroke-width="1.5"/><text class="h2" x="426" y="132">BacklogItem 1</text><text class="sub" x="426" y="156">own @Version</text><rect class="bm" x="596" y="108" width="176" height="150" rx="10" stroke-width="1.5"/><text class="h2" x="610" y="132">BacklogItem 2</text><text class="sub" x="610" y="156">own @Version</text><g class="k s1"><text class="sm" x="204" y="288" text-anchor="middle">A and B both load v7</text><text class="sm" x="500" y="288" text-anchor="middle">A loads v3</text><text class="sm" x="684" y="288" text-anchor="middle">B loads v5</text></g><g class="k s1"><rect class="lnp" x="40" y="144" width="166" height="48" rx="8"/><rect class="lnt" x="210" y="144" width="166" height="48" rx="8"/></g><g class="k s1"><text class="prit" x="36" y="318" style="font-size:13px">User A edits item 1</text><text class="teat" x="220" y="318" style="font-size:13px">User B edits item 2</text></g><g class="k s2"><text class="okt" x="204" y="344" text-anchor="middle" style="font-size:14px">A saves: v7 → v8 ✓</text><text class="okt" x="500" y="318" text-anchor="middle" style="font-size:14px">A saves: v3 → v4 ✓</text></g><g class="k s3"><rect class="bb" x="48" y="356" width="312" height="34" rx="6" stroke-width="1.5"/><text class="badt" x="204" y="378" text-anchor="middle" style="font-size:14px">B saves with v7: OptimisticLock ✗</text><text class="okt" x="684" y="318" text-anchor="middle" style="font-size:14px">B saves: v5 → v6 ✓</text><text class="okt" x="592" y="378" text-anchor="middle" style="font-size:14px">No shared version, no conflict</text></g><text class="sm" x="28" y="420">Keep only true invariants inside one aggregate; reference the rest by ID.</text>
</svg>
