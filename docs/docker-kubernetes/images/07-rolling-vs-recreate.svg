<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Rolling update vs Recreate</title>
  <desc id="d">Four replicas move from version 1.0 to 1.1. Top, RollingUpdate with maxSurge 1 and maxUnavailable 0: one 1.1 pod is added (five pods), and only when it is Ready is one 1.0 pod removed; this repeats four times, so at least four Ready pods serve traffic throughout. Bottom, Recreate: all four 1.0 pods are terminated first, there is a window with no Ready pod at all, then four 1.1 pods start and become Ready.</desc>
