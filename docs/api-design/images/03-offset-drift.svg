<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Offset drift vs a keyset cursor</title>
  <desc id="d">Claims sorted newest first, pages of 4. The client reads page 1: claims 9, 8, 7 and 6. Before it asks for page 2 a new claim 10 is inserted at the top. With offset paging, page 2 is offset 4 of the new ordering, which starts at claim 6 again: claim 6 is returned twice. With a keyset cursor, page 2 asks for claims older than claim 6, so it returns 5, 4, 3 and 2 with no duplicate, and the new claim 10 simply appears when the list is refreshed.</desc>
