<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 452" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Rotating a database password without downtime</title>
  <desc id="d">A timeline of AWS Secrets Manager rotation: createSecret, setSecret, testSecret and finishSecret. The old password is AWSCURRENT until finishSecret, then AWSPREVIOUS, and is disabled later. The new password is AWSPENDING from setSecret and becomes AWSCURRENT at finishSecret. App pods use the old password, switch by re-fetching or restarting after finishSecret, and are all on the new one before the old is disabled. The overlap shown matches the alternating-users strategy; with single-user rotation the old password stops working at setSecret.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ring{fill:#ffffff;stroke:#d97706;stroke-width:2.5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
      .ring{fill:#111827;stroke:#fbbf24}
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="450" rx="14"/>
  <text class="h" x="28" y="40">Rotating a database password without downtime</text>
  <text class="sub" x="28" y="62">AWS Secrets Manager rotation Lambda steps, and which credential works when.</text>
  <line class="ln" x1="150" y1="300" x2="770" y2="300" marker-end="url(#ar)"/><text class="sub" x="770" y="320" text-anchor="end">time</text>
  <line class="ln dash" x1="200" y1="108" x2="200" y2="300" stroke-width="1"/><circle class="pri" cx="200" cy="300" r="5"/><text class="sub" x="200" y="100" text-anchor="middle">createSecret</text>
  <line class="ln dash" x1="290" y1="108" x2="290" y2="300" stroke-width="1"/><circle class="pri" cx="290" cy="300" r="5"/><text class="sub" x="290" y="100" text-anchor="middle">setSecret</text>
  <line class="ln dash" x1="380" y1="108" x2="380" y2="300" stroke-width="1"/><circle class="pri" cx="380" cy="300" r="5"/><text class="sub" x="380" y="100" text-anchor="middle">testSecret</text>
  <line class="ln dash" x1="470" y1="108" x2="470" y2="300" stroke-width="1"/><circle class="pri" cx="470" cy="300" r="5"/><text class="sub" x="470" y="100" text-anchor="middle">finishSecret</text>
  <text class="tx" x="28" y="144" font-weight="700">Old password</text>
  <rect class="pri" x="150" y="130" width="470" height="20" rx="5"/><text class="on13" x="160" y="145">AWSCURRENT</text>
  <text class="on13" x="478" y="145">AWSPREVIOUS</text>
  <line class="lnb" x1="620" y1="120" x2="620" y2="160" stroke-width="3"/><text class="sub badt" x="628" y="145">old disabled</text>
  <text class="tx" x="28" y="194" font-weight="700">New password</text>
  <rect class="tea" x="290" y="180" width="480" height="20" rx="5"/><text class="on13" x="300" y="195">AWSPENDING</text><text class="on13" x="478" y="195">AWSCURRENT</text>
  <text class="tx" x="28" y="244" font-weight="700">App pods</text>
  <rect class="pri" x="150" y="230" width="330" height="20" rx="5"/><text class="on13" x="160" y="245">use the old password</text>
  <rect class="tea" x="560" y="230" width="210" height="20" rx="5"/><text class="on13" x="570" y="245">all on the new one</text>
  <rect class="wrnf" x="480" y="230" width="80" height="20" rx="5"/>
  <text class="sub wrnt" x="520" y="276" text-anchor="middle">re-fetch / restart</text>
  <rect class="bo" x="150" y="338" width="470" height="50" rx="10" stroke-width="1.5"/><text class="sub" x="166" y="360">Overlap: both passwords work from setSecret until the old</text>
  <text class="sub" x="166" y="378">one is disabled. Apps must switch inside this window.</text>
  <text class="sub" x="28" y="416">Overlap as in the alternating-users rotation strategy. With single-user rotation the old password</text>
  <text class="sub" x="28" y="434">stops working at setSecret, so clients must retry with a fresh read of the secret.</text>
</svg>
