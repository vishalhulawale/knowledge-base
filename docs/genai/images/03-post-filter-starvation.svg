<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Filtering after an approximate search starves results</title>
  <desc id="d">Animation comparing two ways to combine a metadata filter with approximate vector search. Top row, post-filtering: the HNSW index returns its ef_search of 40 nearest candidates, then the WHERE tenant = 'acme' filter removes every candidate that belongs to another tenant. Only 10 percent match, so 4 rows survive and a query asking for LIMIT 10 silently returns 4. Bottom row, iterative index scan or filtered search: the index keeps fetching batches of 40 candidates and filtering them until 10 matching rows are found, after three batches. Simplified: the 10 percent match rate and batch sizes are illustrative; the 40 is pgvector's default hnsw.ef_search.</desc>
