<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 454" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Head versus tail sampling</title>
  <desc id="d">Ten traces arrive one after another: most take 120 ms, one ends in an error and one takes 1.4 seconds. With head-based sampling at probability 0.1 the decision is made at the root, before the outcome is known, so one random normal trace is kept and the error and slow traces are dropped. With tail-based sampling in the OpenTelemetry Collector each trace is buffered until it completes, then every error, every trace over 1000 ms and a small random baseline are kept.</desc>
