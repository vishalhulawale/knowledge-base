  <rect class="a b17 am" x="606" y="104" width="18" height="44" rx="4"/>
  <rect class="a b18 am" x="628" y="104" width="18" height="44" rx="4"/>
  <rect class="a b19 am" x="650" y="104" width="18" height="44" rx="4"/>
  <rect class="a b20 am" x="672" y="104" width="18" height="44" rx="4"/>
  <rect class="a b0 pri" x="232" y="194" width="18" height="44" rx="4"/>
  <rect class="a b1 te" x="254" y="194" width="18" height="44" rx="4"/>
  <rect class="a b2 te" x="276" y="194" width="18" height="44" rx="4"/>
  <rect class="a b0 gr" x="232" y="284" width="18" height="44" rx="4"/>

  <text class="a d1 cnt c1" x="738" y="137" text-anchor="middle">21</text>
  <text class="a d2 cnt c2" x="738" y="227" text-anchor="middle">3</text>
  <text class="a d3 cnt c3" x="738" y="317" text-anchor="middle">1</text>

  <rect class="pri" x="28" y="356" width="14" height="14" rx="3"/><text class="sub" x="48" y="368">member query</text>
  <rect class="am" x="150" y="356" width="14" height="14" rx="3"/><text class="sub" x="170" y="368">plan WHERE id = ?</text>
  <rect class="te" x="306" y="356" width="14" height="14" rx="3"/><text class="sub" x="326" y="368">plan WHERE id IN (10 ids)</text>
  <rect class="gr" x="508" y="356" width="14" height="14" rx="3"/><text class="sub" x="528" y="368">member JOIN plan</text>
  <text class="sub" x="28" y="394">Counts measured on PostgreSQL 16 with the page's dataset (20 members, each on a different plan).</text>
