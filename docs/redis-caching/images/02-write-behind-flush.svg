    @media (prefers-reduced-motion: reduce){.w10_99,.w20_99,.w25_99,.w30_99,.w36_99,.w40_96,.w50_96,.w55_70,.w55_72,.w5_99,.w60_96{animation:none;opacity:1}.w0_35,.w0_36,.w10_13p5,.w10_20,.w15_18p5,.w15_25,.w20_23p5,.w25_28p5,.w30_33p5,.w35_55,.w50_53p5,.w5_15,.w5_8p5,.w70_90,.w70_96{animation:none;opacity:0}.mvp{animation:none;transform:translateY(124px)}.fdp{animation:none;opacity:1}}
  </style>
  <rect class="card" x="1" y="1" width="798" height="458" rx="14"/>
  <text class="h" x="28" y="40">Write-behind: buffer in Redis, flush in one batch</text>
  <text class="sub" x="28" y="62">View events increment a hash. A scheduled flusher swaps it out and writes the database once.</text>
  <rect class="panel" x="20" y="84" width="196" height="120" rx="10"/>
  <text class="pt" x="36" y="110">App</text>
  <text class="sm" x="36" y="136">each view event:</text>
  <text class="sm mono" x="36" y="158">HINCRBY</text>
  <text class="sm mono" x="36" y="178">views:pending id 1</text>
  <g class="w5_8p5"><line class="arr prs " x1="220" y1="140" x2="253.0" y2="140.0"/><path class="pri " d="M262 140 L253.0 144.5 L253.0 135.5z"/></g>
  <g class="w10_13p5"><line class="arr prs " x1="220" y1="140" x2="253.0" y2="140.0"/><path class="pri " d="M262 140 L253.0 144.5 L253.0 135.5z"/></g>
  <g class="w15_18p5"><line class="arr prs " x1="220" y1="140" x2="253.0" y2="140.0"/><path class="pri " d="M262 140 L253.0 144.5 L253.0 135.5z"/></g>
  <g class="w20_23p5"><line class="arr prs " x1="220" y1="140" x2="253.0" y2="140.0"/><path class="pri " d="M262 140 L253.0 144.5 L253.0 135.5z"/></g>
  <g class="w25_28p5"><line class="arr prs " x1="220" y1="140" x2="253.0" y2="140.0"/><path class="pri " d="M262 140 L253.0 144.5 L253.0 135.5z"/></g>
  <g class="w30_33p5"><line class="arr prs " x1="220" y1="140" x2="253.0" y2="140.0"/><path class="pri " d="M262 140 L253.0 144.5 L253.0 135.5z"/></g>
  <g class="w50_53p5"><line class="arr prs " x1="220" y1="140" x2="253.0" y2="140.0"/><path class="pri " d="M262 140 L253.0 144.5 L253.0 135.5z"/></g>
  <line class="arr dash " x1="220" y1="140" x2="253.0" y2="140.0"/><path class="ah " d="M262 140 L253.0 144.5 L253.0 135.5z"/>
  <text class="sub" x="222" y="128">fast ack</text>
  <rect class="panel" x="276" y="84" width="252" height="304" rx="10"/>
  <text class="pt" x="292" y="110">Redis</text>
  <g class="mvp"><g class="fdp"><rect class="box" x="292" y="122" width="220" height="112" rx="8"/><text class="tealt mono w0_36" x="304" y="144" font-size="14">views:pending</text><text class="warnt mono w36_99" x="304" y="144" font-size="14">views:flushing</text><line class="arr" x1="292" y1="154" x2="512" y2="154" stroke-width="1"/><text class="sm mono w5_99" x="304" y="176">product 42</text><text class="lbl w5_15" x="470" y="176">1</text><text class="lbl w15_25" x="470" y="176">2</text><text class="lbl w25_99" x="470" y="176">3</text><text class="sm mono w10_99" x="304" y="198">product 7</text><text class="lbl w10_20" x="470" y="198">1</text><text class="lbl w20_99" x="470" y="198">2</text><text class="sm mono w30_99" x="304" y="220">product 13</text><text class="lbl w30_99" x="470" y="220">1</text></g></g>
  <g class="w40_96"><rect class="box" x="292" y="122" width="220" height="112" rx="8"/><text class="tealt mono" x="304" y="144" font-size="14">views:pending</text><line class="arr" x1="292" y1="154" x2="512" y2="154" stroke-width="1"/></g>
  <g class="w50_96"><text class="sm mono" x="304" y="176">product 42</text><text class="lbl" x="470" y="176">1</text></g>
  <text class="warnt w35_55" x="300" y="246" font-size="13">RENAME (atomic)</text>
  <text class="badt w70_90" x="300" y="378" font-size="13">DEL views:flushing</text>
  <rect class="panel" x="584" y="84" width="196" height="304" rx="10"/>
  <text class="pt" x="600" y="110">Database</text>
  <text class="sm mono" x="600" y="136">view_count</text>
  <text class="sm" x="600" y="264">product 42</text>
  <text class="okt w60_96" x="700" y="264" font-size="14">views +3</text>
  <text class="sm" x="600" y="288">product 7</text>
  <text class="okt w60_96" x="700" y="288" font-size="14">views +2</text>
  <text class="sm" x="600" y="312">product 13</text>
  <text class="okt w60_96" x="700" y="312" font-size="14">views +1</text>
  <text class="sub" x="600" y="160">one batched upsert</text>
  <text class="sub" x="600" y="178">per flush</text>
  <g class="w55_72"><line class="arr oks " x1="516" y1="300" x2="569.2" y2="289.7"/><path class="okf " d="M578 288 L570.0 294.1 L568.3 285.3z"/></g>
  <line class="arr dash " x1="516" y1="300" x2="569.2" y2="289.7"/><path class="ah " d="M578 288 L570.0 294.1 L568.3 285.3z"/>
  <text class="sub" x="519" y="326">every 5 s</text>
  <text class="body w0_35" x="28" y="418">1  Each event is an HINCRBY on views:pending, acknowledged at once.</text>
  <text class="body w35_55" x="28" y="418">2  RENAME pending to flushing. New events start a fresh pending hash.</text>
  <text class="body w55_70" x="28" y="418">3  HGETALL views:flushing, then one batched upsert to the database.</text>
  <text class="body w70_96" x="28" y="418">4  DEL views:flushing, only after the database write succeeded.</text>
  <text class="sub" x="28" y="444">Until step 4, the buffered counts live only in Redis: a crash there loses them.</text>
</svg>
