<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 436" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Sidecar versus ambient</title>
  <desc id="d">Two panels with the same three pods on two nodes. In sidecar mode each pod holds an app container and its own Envoy, so three pods mean three Envoys, each about 0.20 vCPU and 60 MB at 1,000 requests per second, and an upgrade restarts every pod. In ambient mode the pods hold only the app; each node runs one ztunnel for L4 at about 0.06 vCPU and 12 MB, connected by an HBONE tunnel, and an optional per-namespace waypoint handles L7 at about 0.25 vCPU and 60 MB. Figures are from Istio's 1.24 benchmark.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="434" rx="14"/>
  <text class="h" x="28" y="40">Sidecar mode vs ambient mode</text><text class="sub" x="28" y="62">Same three pods on two nodes. Per-proxy cost from Istio's 1.24 benchmark at 1,000 req/s.</text><text class="h2" x="205" y="98" text-anchor="middle">Sidecar mode</text><rect class="bm" x="30" y="112" width="160" height="214" rx="10" stroke-width="1.2"/><text class="sub" x="40" y="132">Node 1</text><rect class="bm" x="220" y="112" width="160" height="214" rx="10" stroke-width="1.2"/><text class="sub" x="230" y="132">Node 2</text><rect class="box" x="42" y="136" width="136" height="84" rx="8" stroke-width="1.2"/><text class="sub" x="50" y="154" style="font-size:12px">pod: orders</text><rect class="bp" x="50" y="164" width="56" height="46" rx="6" stroke-width="1.2"/><text class="prit" x="78" y="192" text-anchor="middle" style="font-size:13px">app</text><rect class="bw" x="114" y="164" width="56" height="46" rx="6" stroke-width="1.2"/><text class="wrnt" x="142" y="192" text-anchor="middle" style="font-size:13px">Envoy</text><rect class="box" x="42" y="232" width="136" height="84" rx="8" stroke-width="1.2"/><text class="sub" x="50" y="250" style="font-size:12px">pod: pricing</text><rect class="bp" x="50" y="260" width="56" height="46" rx="6" stroke-width="1.2"/><text class="prit" x="78" y="288" text-anchor="middle" style="font-size:13px">app</text><rect class="bw" x="114" y="260" width="56" height="46" rx="6" stroke-width="1.2"/><text class="wrnt" x="142" y="288" text-anchor="middle" style="font-size:13px">Envoy</text><rect class="box" x="232" y="136" width="136" height="84" rx="8" stroke-width="1.2"/><text class="sub" x="240" y="154" style="font-size:12px">pod: payments</text><rect class="bp" x="240" y="164" width="56" height="46" rx="6" stroke-width="1.2"/><text class="prit" x="268" y="192" text-anchor="middle" style="font-size:13px">app</text><rect class="bw" x="304" y="164" width="56" height="46" rx="6" stroke-width="1.2"/><text class="wrnt" x="332" y="192" text-anchor="middle" style="font-size:13px">Envoy</text><text class="sm" x="232" y="250" font-weight="700">3 pods → 3 Envoys</text><text class="sub" x="232" y="270" style="font-size:12px">500 pods → 500 Envoys</text><rect class="bw" x="30" y="340" width="350" height="50" rx="8" stroke-width="1.2"/><text class="wrnt" x="205" y="360" text-anchor="middle" style="font-size:14px">Envoy sidecar: ≈0.20 vCPU, 60 MB each</text><text class="sm" x="205" y="380" text-anchor="middle">upgrade = restart every pod</text><text class="h2" x="595" y="98" text-anchor="middle">Ambient mode</text><rect class="bm" x="420" y="112" width="160" height="214" rx="10" stroke-width="1.2"/><text class="sub" x="430" y="132">Node 1</text><rect class="bm" x="610" y="112" width="160" height="214" rx="10" stroke-width="1.2"/><text class="sub" x="620" y="132">Node 2</text><rect class="box" x="432" y="136" width="136" height="54" rx="8" stroke-width="1.2"/><text class="sub" x="440" y="154" style="font-size:12px">pod: orders</text><rect class="bp" x="440" y="160" width="120" height="24" rx="6" stroke-width="1.2"/><text class="prit" x="500" y="177" text-anchor="middle" style="font-size:13px">app only</text><rect class="box" x="432" y="200" width="136" height="54" rx="8" stroke-width="1.2"/><text class="sub" x="440" y="218" style="font-size:12px">pod: pricing</text><rect class="bp" x="440" y="224" width="120" height="24" rx="6" stroke-width="1.2"/><text class="prit" x="500" y="241" text-anchor="middle" style="font-size:13px">app only</text><rect class="box" x="622" y="136" width="136" height="54" rx="8" stroke-width="1.2"/><text class="sub" x="630" y="154" style="font-size:12px">pod: payments</text><rect class="bp" x="630" y="160" width="120" height="24" rx="6" stroke-width="1.2"/><text class="prit" x="690" y="177" text-anchor="middle" style="font-size:13px">app only</text><rect class="bt" x="432" y="278" width="136" height="36" rx="8" stroke-width="1.5"/><text class="teat" x="500" y="301" text-anchor="middle" style="font-size:13px">ztunnel (L4)</text><rect class="bt" x="622" y="278" width="136" height="36" rx="8" stroke-width="1.5"/><text class="teat" x="690" y="301" text-anchor="middle" style="font-size:13px">ztunnel (L4)</text><rect class="bw" x="622" y="200" width="136" height="54" rx="8" stroke-width="1.2" stroke-dasharray="5 4"/><text class="wrnt" x="690" y="222" text-anchor="middle" style="font-size:13px">waypoint (L7)</text><text class="sub" x="690" y="241" text-anchor="middle" style="font-size:12px">optional, per ns</text><line class="lnt" x1="568" y1="296" x2="618" y2="296" marker-end="url(#art)"/><text class="teat" x="593" y="287" text-anchor="middle" style="font-size:11px">HBONE</text><rect class="bt" x="420" y="340" width="350" height="50" rx="8" stroke-width="1.2"/><text class="teat" x="595" y="360" text-anchor="middle" style="font-size:14px">ztunnel ≈0.06 vCPU, 12 MB per node</text><text class="sm" x="595" y="380" text-anchor="middle">waypoint ≈0.25 vCPU, 60 MB, only if L7 needed</text><line class="grid" x1="400" y1="90" x2="400" y2="392"/><text class="sub" x="400" y="418" text-anchor="middle">Numbers are per proxy at 1,000 req/s with 1 KB payloads; memory grows with mesh config size.</text>
</svg>
