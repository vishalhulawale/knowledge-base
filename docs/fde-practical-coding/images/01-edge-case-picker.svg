<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Edge cases mapped to tests</title>
  <desc id="d">A ten-item edge-case checklist on the left: size, duplicates, missing and null, types and format, boundaries, time, money, ordering, dependencies and security. Five are highlighted for the customer_totals task and linked to pytest parametrize ids on the right: size to empty, money to decimal (10.10 plus 0.20 equals 10.30 exactly), duplicates to duplicate, missing and null to bad-rows, and types and format to whitespace and bad-rows. A business rule from a clarifying question links to the refund test. The other five categories were considered and skipped out loud.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="468" rx="14"/>
  <text class="h" x="28" y="40">Edge cases first: pick five, say why, write them as tests</text><text class="sub" x="28" y="62">Task from the page: customer_totals(rows) over a messy transaction export.</text><text class="sm" x="28" y="96" font-weight="700">Checklist (10 categories)</text><rect class="bt" x="470" y="110" width="302" height="34" rx="8" stroke-width="1.5"/><text class="mono" x="482" y="132" xml:space="preserve">[empty]</text><text class="sub" x="580" y="132">[] → {}</text><rect class="bt" x="470" y="156" width="302" height="34" rx="8" stroke-width="1.5"/><text class="mono" x="482" y="178" xml:space="preserve">[decimal]</text><text class="sub" x="580" y="178">10.10 + 0.20 = 10.30 exactly</text><rect class="bt" x="470" y="202" width="302" height="34" rx="8" stroke-width="1.5"/><text class="mono" x="482" y="224" xml:space="preserve">[duplicate]</text><text class="sub" x="580" y="224">same id twice counts once</text><rect class="bt" x="470" y="248" width="302" height="34" rx="8" stroke-width="1.5"/><text class="mono" x="482" y="270" xml:space="preserve">[refund]</text><text class="sub" x="580" y="270">status refunded excluded</text><rect class="bt" x="470" y="294" width="302" height="34" rx="8" stroke-width="1.5"/><text class="mono" x="482" y="316" xml:space="preserve">[bad-rows]</text><text class="sub" x="580" y="316">no customer / "abc" skipped</text><rect class="bt" x="470" y="340" width="302" height="34" rx="8" stroke-width="1.5"/><text class="mono" x="482" y="362" xml:space="preserve">[whitespace]</text><text class="sub" x="580" y="362">" 7.5 " parses</text><text class="sm" x="470" y="96" font-weight="700">pytest parametrize ids</text><rect class="bp" x="28" y="110" width="200" height="24" rx="12" stroke-width="1.2"/><text class="sm" x="42" y="127" font-weight="700">Size</text><line class="lnp" x1="230" y1="122" x2="466" y2="127" marker-end="url(#arp)" opacity="0.7"/><rect class="bp" x="28" y="140" width="200" height="24" rx="12" stroke-width="1.2"/><text class="sm" x="42" y="157" font-weight="700">Duplicates</text><line class="lnp" x1="230" y1="152" x2="466" y2="219" marker-end="url(#arp)" opacity="0.7"/><rect class="bp" x="28" y="170" width="200" height="24" rx="12" stroke-width="1.2"/><text class="sm" x="42" y="187" font-weight="700">Missing and null</text><line class="lnp" x1="230" y1="182" x2="466" y2="311" marker-end="url(#arp)" opacity="0.7"/><rect class="bp" x="28" y="200" width="200" height="24" rx="12" stroke-width="1.2"/><text class="sm" x="42" y="217" font-weight="700">Types and format</text><line class="lnp" x1="230" y1="212" x2="466" y2="357" marker-end="url(#arp)" opacity="0.7"/><line class="lnp" x1="230" y1="212" x2="466" y2="311" marker-end="url(#arp)" opacity="0.7"/><rect class="box" x="28" y="230" width="200" height="24" rx="12" stroke-width="1.2"/><text class="sub" x="42" y="247">Boundaries</text><rect class="box" x="28" y="260" width="200" height="24" rx="12" stroke-width="1.2"/><text class="sub" x="42" y="277">Time</text><rect class="bp" x="28" y="290" width="200" height="24" rx="12" stroke-width="1.2"/><text class="sm" x="42" y="307" font-weight="700">Money</text><line class="lnp" x1="230" y1="302" x2="466" y2="173" marker-end="url(#arp)" opacity="0.7"/><rect class="box" x="28" y="320" width="200" height="24" rx="12" stroke-width="1.2"/><text class="sub" x="42" y="337">Ordering</text><rect class="box" x="28" y="350" width="200" height="24" rx="12" stroke-width="1.2"/><text class="sub" x="42" y="367">Dependencies</text><rect class="box" x="28" y="380" width="200" height="24" rx="12" stroke-width="1.2"/><text class="sub" x="42" y="397">Security</text><rect class="bw" x="250" y="300" width="190" height="34" rx="8" stroke-width="1.5"/><text class="wrnt" x="262" y="322" style="font-size:13px">Business rule (asked)</text><line class="lnw" x1="442" y1="316" x2="466" y2="269" marker-end="url(#arw)"/><text class="sm" x="28" y="432">Five categories plus one clarifying question produce six tests before the function body exists.</text><text class="sm" x="28" y="450">Grey categories were considered and skipped out loud: "no time zones in this export".</text>
</svg>
