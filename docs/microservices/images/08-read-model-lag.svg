<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Reads lag writes in CQRS</title>
  <desc id="d">A write model with its event store, a dashboard projection and a read database. The member sends an ApproveRefill command and the write model changes to APPROVED at once. The event takes a while to reach the projection, so a first dashboard query still reads REQUESTED from the read database, which is stale. After the projection upserts the document, a second query reads APPROVED. Lag is exaggerated; usually it is milliseconds to seconds.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ring{fill:#ffffff;stroke:#d97706;stroke-width:2.5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
      .ring{fill:#111827;stroke:#fbbf24}
    }

    .a{opacity:0;animation:13s infinite linear}
    .tok{opacity:0;animation:13s infinite linear}
    @keyframes cm{0%{transform:translate(110px,300px);opacity:0}4%{transform:translate(110px,300px);opacity:0}5%{transform:translate(110px,300px);opacity:1}14%{transform:translate(110px,200px);opacity:1}15%{transform:translate(110px,200px);opacity:0}100%{transform:translate(110px,200px);opacity:0}}
@keyframes r1{0%,15%{opacity:0}17%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes ev{0%{transform:translate(190px,160px);opacity:0}17%{transform:translate(190px,160px);opacity:0}18%{transform:translate(190px,160px);opacity:1}52%{transform:translate(330px,160px);opacity:1}53%{transform:translate(330px,160px);opacity:0}100%{transform:translate(330px,160px);opacity:0}}
@keyframes q1{0%{transform:translate(650px,300px);opacity:0}30%{transform:translate(650px,300px);opacity:0}31%{transform:translate(650px,300px);opacity:1}38%{transform:translate(650px,200px);opacity:1}39%{transform:translate(650px,200px);opacity:0}100%{transform:translate(650px,200px);opacity:0}}
@keyframes r2{0%,39%{opacity:0}41%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes r3{0%,56%{opacity:0}58%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes q2{0%{transform:translate(650px,300px);opacity:0}66%{transform:translate(650px,300px);opacity:0}67%{transform:translate(650px,300px);opacity:1}74%{transform:translate(650px,200px);opacity:1}75%{transform:translate(650px,200px);opacity:0}100%{transform:translate(650px,200px);opacity:0}}
@keyframes r4{0%,75%{opacity:0}77%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes r5{0%,18%{opacity:0}20%,56%{opacity:1}58%,100%{opacity:0}}

    @media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.tok{animation:none;opacity:0}}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="430" rx="14"/>
  <text class="h" x="28" y="40">Reads lag writes in CQRS</text>
  <text class="sub" x="28" y="62">The member approves a refill, then reloads the dashboard twice.</text>
  <rect class="bp" x="28" y="96" width="164" height="116" rx="10" stroke-width="1.5"/><text class="lbl" x="110" y="120" text-anchor="middle">Write model</text><text class="sub" x="110" y="140" text-anchor="middle">+ event store</text>
  <rect class="bt" x="330" y="96" width="140" height="116" rx="10" stroke-width="1.5"/><text class="lbl" x="400" y="120" text-anchor="middle">Projection</text><text class="sub" x="400" y="140" text-anchor="middle">dashboard</text>
  <rect class="box" x="568" y="96" width="164" height="116" rx="10" stroke-width="1.5"/><text class="lbl" x="650" y="120" text-anchor="middle">Read DB</text><text class="sub" x="650" y="140" text-anchor="middle">dashboard doc</text>
  <line class="ln" x1="192" y1="154" x2="326" y2="154" marker-end="url(#ar)"/><text class="sub" x="260" y="146" text-anchor="middle">events</text>
  <line class="ln" x1="470" y1="154" x2="564" y2="154" marker-end="url(#ar)"/><text class="sub" x="517" y="146" text-anchor="middle">upsert</text>
  <rect class="mutf" x="40" y="164" width="140" height="30" rx="6" stroke-width="1.5"/><text class="on13" x="110" y="184" text-anchor="middle">REQUESTED</text><rect class="mutf" x="580" y="164" width="140" height="30" rx="6" stroke-width="1.5"/><text class="on13" x="650" y="184" text-anchor="middle">REQUESTED</text>
  <rect class="box" x="40" y="300" width="140" height="40" rx="10" stroke-width="1.5"/><text class="tx" x="110" y="325" text-anchor="middle">command</text>
  <line class="ln" x1="110" y1="300" x2="110" y2="216" marker-end="url(#ar)"/><text class="sub" x="122" y="262">ApproveRefill</text>
  <rect class="box" x="580" y="268" width="140" height="30" rx="6" stroke-width="1.5"/><text class="sub" x="650" y="288" text-anchor="middle">dashboard query</text>
  <line class="ln" x1="650" y1="268" x2="650" y2="216" marker-end="url(#ar)"/>
  <circle class="tok pri" style="animation-name:cm" r="8"/>
  <g class="a" style="animation-name:r1"><rect class="okf" x="40" y="164" width="140" height="30" rx="6" stroke-width="1.5"/><text class="on13" x="110" y="184" text-anchor="middle">APPROVED</text></g>
  <circle class="tok tea" style="animation-name:ev" r="8"/>
  <circle class="tok wrnf" style="animation-name:q1" r="8"/>
  <g class="a" style="animation-name:r2"><text class="tx wrnt" x="650" y="336" text-anchor="middle">query 1 → REQUESTED (stale)</text></g>
  <g class="a" style="animation-name:r3"><rect class="okf" x="580" y="164" width="140" height="30" rx="6" stroke-width="1.5"/><text class="on13" x="650" y="184" text-anchor="middle">APPROVED</text></g>
  <circle class="tok okf" style="animation-name:q2" r="8"/>
  <g class="a" style="animation-name:r4"><text class="tx okt" x="650" y="358" text-anchor="middle">query 2 → APPROVED</text></g>
  <g class="a" style="animation-name:r5"><text class="sub" x="260" y="196" text-anchor="middle">projection lag</text></g>
  <text class="sub" x="28" y="396">Fixes in the UX: return the new state from the command, read your own writes from the write side,</text>
  <text class="sub" x="28" y="414">or show a “processing” state. Lag is usually milliseconds to seconds; exaggerated here.</text>
</svg>
