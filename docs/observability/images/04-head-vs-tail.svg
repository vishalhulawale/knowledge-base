<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Head versus tail sampling</title>
  <desc id="d">Two rows of ten traces, one returning a 500 error and one taking 4 seconds. With head sampling at 10 percent the decision is made at the root span before the outcome is known: one ordinary trace is kept and the error and slow traces are dropped. With tail sampling the Collector buffers all spans for a decision wait of 10 seconds and keeps the error and slow traces, plus 5 percent of ordinary ones over time. Tail sampling needs all spans of a trace routed to one Collector by trace ID.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="430" rx="14"/>
  <text class="h" x="28" y="40">Head sampling flips a coin; tail sampling reads the outcome</text><text class="sub" x="28" y="62">Ten traces, one with an error and one slow. 10% head rate; tail policy keeps errors, slow, 5% of rest.</text><rect class="bb" x="28" y="92" width="744" height="136" rx="10" stroke-width="1.2"/><text class="lbl" x="44" y="118">Head: decided at the root span, before the outcome is known</text><rect class="mutf" x="60" y="136" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="84" y="159" text-anchor="middle">200</text><text class="sub" x="84" y="190" text-anchor="middle" style="font-size:12px">drop</text><rect class="mutf" x="130" y="136" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="154" y="159" text-anchor="middle">200</text><text class="sub" x="154" y="190" text-anchor="middle" style="font-size:12px">drop</text><rect class="badf" x="200" y="136" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="224" y="159" text-anchor="middle">500</text><text class="sub" x="224" y="190" text-anchor="middle" style="font-size:12px">drop</text><rect class="mutf" x="270" y="136" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="294" y="159" text-anchor="middle">200</text><text class="sub" x="294" y="190" text-anchor="middle" style="font-size:12px">drop</text><rect class="mutf" x="340" y="136" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="364" y="159" text-anchor="middle">200</text><text class="sub" x="364" y="190" text-anchor="middle" style="font-size:12px">drop</text><rect class="wrnf" x="410" y="136" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="434" y="159" text-anchor="middle">4 s</text><text class="sub" x="434" y="190" text-anchor="middle" style="font-size:12px">drop</text><rect class="mutf" x="480" y="136" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="504" y="159" text-anchor="middle">200</text><text class="sub" x="504" y="190" text-anchor="middle" style="font-size:12px">drop</text><rect class="mutf" x="550" y="136" width="48" height="36" rx="6" fill-opacity="0.9"/><text class="on13" x="574" y="159" text-anchor="middle">200</text><text class="okt" x="574" y="190" text-anchor="middle" style="font-size:12px">kept</text><rect class="mutf" x="620" y="136" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="644" y="159" text-anchor="middle">200</text><text class="sub" x="644" y="190" text-anchor="middle" style="font-size:12px">drop</text><rect class="mutf" x="690" y="136" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="714" y="159" text-anchor="middle">200</text><text class="sub" x="714" y="190" text-anchor="middle" style="font-size:12px">drop</text><text class="sm" x="44" y="216">Kept 1 ordinary trace. The error and the slow trace were dropped at the door.</text><rect class="bt" x="28" y="244" width="744" height="136" rx="10" stroke-width="1.2"/><text class="lbl" x="44" y="270">Tail: Collector buffers all spans (decision_wait 10 s), then decides</text><rect class="mutf" x="60" y="288" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="84" y="311" text-anchor="middle">200</text><text class="sub" x="84" y="342" text-anchor="middle" style="font-size:12px">drop</text><rect class="mutf" x="130" y="288" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="154" y="311" text-anchor="middle">200</text><text class="sub" x="154" y="342" text-anchor="middle" style="font-size:12px">drop</text><rect class="badf" x="200" y="288" width="48" height="36" rx="6" fill-opacity="0.9"/><text class="on13" x="224" y="311" text-anchor="middle">500</text><text class="okt" x="224" y="342" text-anchor="middle" style="font-size:12px">kept</text><rect class="mutf" x="270" y="288" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="294" y="311" text-anchor="middle">200</text><text class="sub" x="294" y="342" text-anchor="middle" style="font-size:12px">drop</text><rect class="mutf" x="340" y="288" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="364" y="311" text-anchor="middle">200</text><text class="sub" x="364" y="342" text-anchor="middle" style="font-size:12px">drop</text><rect class="wrnf" x="410" y="288" width="48" height="36" rx="6" fill-opacity="0.9"/><text class="on13" x="434" y="311" text-anchor="middle">4 s</text><text class="okt" x="434" y="342" text-anchor="middle" style="font-size:12px">kept</text><rect class="mutf" x="480" y="288" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="504" y="311" text-anchor="middle">200</text><text class="sub" x="504" y="342" text-anchor="middle" style="font-size:12px">drop</text><rect class="mutf" x="550" y="288" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="574" y="311" text-anchor="middle">200</text><text class="sub" x="574" y="342" text-anchor="middle" style="font-size:12px">drop</text><rect class="mutf" x="620" y="288" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="644" y="311" text-anchor="middle">200</text><text class="sub" x="644" y="342" text-anchor="middle" style="font-size:12px">drop</text><rect class="mutf" x="690" y="288" width="48" height="36" rx="6" fill-opacity="0.25"/><text class="sm" x="714" y="311" text-anchor="middle">200</text><text class="sub" x="714" y="342" text-anchor="middle" style="font-size:12px">drop</text><text class="sm" x="44" y="368">Kept the error and the slow trace; ordinary ones kept at 5% over time.</text><text class="sm" x="28" y="412">Tail sampling needs every span of a trace on one Collector: route by trace ID (load-balancing exporter).</text>
</svg>
