<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Graceful pod shutdown</title>
  <desc id="d">Animation of a timeline from 0 to 40 seconds with a moving playhead. Routing to the pod stops about 2 seconds after it is marked terminating. A preStop sleep runs from 0 to 10 seconds while the app keeps serving. At 10 seconds SIGTERM arrives and Spring Boot drains three in-flight requests, the last finishing at about 13.5 seconds, and exits cleanly at about 14 seconds, well before the SIGKILL deadline at 40 seconds. Timings are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes ph{0%{transform:translateX(0)}86%,100%{transform:translateX(232px)}}
    .ph{animation:ph 14s infinite linear}
    @keyframes p1{0%{opacity:1}10.74%{opacity:1}10.75%{opacity:0}100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%{opacity:0}10.74%{opacity:0}10.75%{opacity:1}53.74%{opacity:1}53.75%{opacity:0}100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%{opacity:0}53.74%{opacity:0}53.75%{opacity:1}75.24%{opacity:1}75.25%{opacity:0}100%{opacity:0}}.p3{animation-name:p3}
    @keyframes p4{0%{opacity:0}75.24%{opacity:0}75.25%{opacity:1}100%{opacity:1}}.p4{animation-name:p4}
    @media (prefers-reduced-motion: reduce){.k{animation:none}.p4{opacity:1}.ph{animation:none;transform:translateX(203px)}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="390" rx="14"/>
  <text class="h" x="28" y="40">A graceful pod shutdown, second by second</text><text class="sub" x="28" y="62">terminationGracePeriodSeconds 40, preStop sleep 10 s, Spring drain up to 20 s. Timings illustrative.</text><text class="lbl" x="28" y="122" style="font-size:14px">Routing to pod</text><text class="lbl" x="28" y="164" style="font-size:14px">preStop hook</text><text class="lbl" x="28" y="206" style="font-size:14px">Spring Boot</text><text class="lbl" x="28" y="254" style="font-size:14px">In-flight requests</text><line class="grid" x1="170" y1="92" x2="170" y2="300"/><text class="sub" x="170" y="318" text-anchor="middle" style="font-size:12px">0s</text><line class="grid" x1="242.5" y1="92" x2="242.5" y2="300"/><text class="sub" x="242.5" y="318" text-anchor="middle" style="font-size:12px">5s</text><line class="grid" x1="315" y1="92" x2="315" y2="300"/><text class="sub" x="315" y="318" text-anchor="middle" style="font-size:12px">10s</text><line class="grid" x1="387.5" y1="92" x2="387.5" y2="300"/><text class="sub" x="387.5" y="318" text-anchor="middle" style="font-size:12px">15s</text><line class="grid" x1="460" y1="92" x2="460" y2="300"/><text class="sub" x="460" y="318" text-anchor="middle" style="font-size:12px">20s</text><line class="grid" x1="532.5" y1="92" x2="532.5" y2="300"/><text class="sub" x="532.5" y="318" text-anchor="middle" style="font-size:12px">25s</text><line class="grid" x1="605" y1="92" x2="605" y2="300"/><text class="sub" x="605" y="318" text-anchor="middle" style="font-size:12px">30s</text><line class="grid" x1="677.5" y1="92" x2="677.5" y2="300"/><text class="sub" x="677.5" y="318" text-anchor="middle" style="font-size:12px">35s</text><line class="grid" x1="750" y1="92" x2="750" y2="300"/><text class="sub" x="750" y="318" text-anchor="middle" style="font-size:12px">40s</text><rect class="okf" x="170" y="104" width="29" height="26" rx="4"/><rect class="mutf" x="199" y="104" width="551" height="26" rx="4" style="opacity:.35"/><text class="sm" x="416.5" y="122" style="font-size:12px">removed from endpoints after ~2 s</text><rect class="wrnf" x="170" y="146" width="145" height="26" rx="4"/><text class="on13" x="242.5" y="164" text-anchor="middle">sleep 10</text><rect class="pri" x="170" y="188" width="145" height="26" rx="4"/><text class="on13" x="242.5" y="206" text-anchor="middle">serving</text><rect class="tea" x="315" y="188" width="58" height="26" rx="4"/><text class="on13" x="344" y="206" text-anchor="middle">drain</text><line class="lnb" x1="315" y1="182" x2="315" y2="222"/><text class="okt" x="381" y="206" style="font-size:13px">exit 0 at ~14 s</text><rect class="bt" x="170" y="236" width="87" height="12" rx="3" stroke-width="1"/><rect class="bt" x="177.25" y="254" width="166.75" height="12" rx="3" stroke-width="1"/><rect class="bt" x="191.75" y="272" width="174" height="12" rx="3" stroke-width="1"/><line class="lnb dash" x1="315" y1="86" x2="315" y2="300"/><text class="badt" x="315" y="84" text-anchor="middle" style="font-size:12px">SIGTERM</text><line class="lnb" x1="750" y1="86" x2="750" y2="300"/><text class="badt" x="746" y="84" text-anchor="end" style="font-size:12px">SIGKILL deadline</text><g class="ph"><line class="lnp" x1="170.0" y1="92" x2="170.0" y2="300" style="stroke-width:3"/></g><rect class="box" x="28" y="334" width="744" height="40" rx="8" stroke-width="1.2"/><g class="k p1"><text class="tx" x="44" y="359">0 s: pod marked terminating; endpoint removal starts, requests still arriving</text></g><g class="k p2"><text class="tx" x="44" y="359">2 s: routing has caught up; preStop sleep keeps the app serving in-flight work</text></g><g class="k p3"><text class="tx" x="44" y="359">10 s: SIGTERM; Spring Boot stops accepting and drains in-flight requests</text></g><g class="k p4"><text class="tx" x="44" y="359">~14 s: last request done, offsets committed, exit 0, 26 s before the deadline</text></g>
</svg>
