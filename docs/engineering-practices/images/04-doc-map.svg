<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Documentation map</title>
  <desc id="d">A two by two grid of Diátaxis documentation types. Tutorials, for learning by doing, hold a getting-started guide and an onboarding lab. How-to guides, for solving a known task, hold runbooks for each alert and guides such as DLQ replay and secret rotation. Explanation, for understanding why, holds ADRs, C4 context and container diagrams and postmortems. Reference, for looking up facts, holds generated OpenAPI or GraphQL schema docs, configuration properties and error codes. A README sits in the centre as the entry point linking to all four.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="430" rx="14"/>
  <text class="h" x="28" y="40">Where each kind of document belongs</text><text class="sub" x="28" y="62">Diátaxis quadrants, with typical engineering documents placed in each.</text><text class="sub" x="280" y="94" text-anchor="middle">while studying (learning)</text><text class="sub" x="610" y="94" text-anchor="middle">while working (applying)</text><text class="sub" x="100" y="173" text-anchor="end">doing</text><text class="sub" x="100" y="313" text-anchor="end">knowing</text><rect class="bp" x="120" y="104" width="320" height="130" rx="10" stroke-width="1.5"/><text class="prit" x="136" y="130" style="font-size:16px">Tutorials</text><text class="sub" x="424" y="130" text-anchor="end">learning by doing</text><rect class="box" x="136" y="144" width="288" height="22" rx="5" stroke-width="1"/><text class="sm" x="148" y="160">Getting-started: run it locally</text><rect class="box" x="136" y="172" width="288" height="22" rx="5" stroke-width="1"/><text class="sm" x="148" y="188">Onboarding lab</text><rect class="bt" x="450" y="104" width="320" height="130" rx="10" stroke-width="1.5"/><text class="teat" x="466" y="130" style="font-size:16px">How-to guides</text><text class="sub" x="754" y="130" text-anchor="end">solve a known task</text><rect class="box" x="466" y="144" width="288" height="22" rx="5" stroke-width="1"/><text class="sm" x="478" y="160">Runbooks (one per alert)</text><rect class="box" x="466" y="172" width="288" height="22" rx="5" stroke-width="1"/><text class="sm" x="478" y="188">DLQ replay, secret rotation</text><rect class="bw" x="120" y="244" width="320" height="130" rx="10" stroke-width="1.5"/><text class="wrnt" x="136" y="270" style="font-size:16px">Explanation</text><text class="sub" x="424" y="270" text-anchor="end">understand why</text><rect class="box" x="136" y="284" width="288" height="22" rx="5" stroke-width="1"/><text class="sm" x="148" y="300">ADRs</text><rect class="box" x="136" y="312" width="288" height="22" rx="5" stroke-width="1"/><text class="sm" x="148" y="328">C4 context + container diagrams</text><rect class="box" x="136" y="340" width="288" height="22" rx="5" stroke-width="1"/><text class="sm" x="148" y="356">Postmortems</text><rect class="bo" x="450" y="244" width="320" height="130" rx="10" stroke-width="1.5"/><text class="okt" x="466" y="270" style="font-size:16px">Reference</text><text class="sub" x="754" y="270" text-anchor="end">look up facts</text><rect class="box" x="466" y="284" width="288" height="22" rx="5" stroke-width="1"/><text class="sm" x="478" y="300">OpenAPI / GraphQL schema (generated)</text><rect class="box" x="466" y="312" width="288" height="22" rx="5" stroke-width="1"/><text class="sm" x="478" y="328">Config properties, error codes</text><rect class="box" x="353" y="221" width="184" height="36" rx="18" stroke-width="2"/><text class="lbl" x="445" y="244" text-anchor="middle">README: entry point</text><text class="sm" x="28" y="412">A README links to all four. Most stale docs are pages that try to be all four at once.</text>
</svg>
