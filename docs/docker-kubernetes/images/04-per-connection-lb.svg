<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Service load balancing is per connection</title>
  <desc id="d">Left: a gRPC client opens one long-lived HTTP/2 connection through a ClusterIP Service. kube-proxy picks a backend once, when the connection is made, so every request multiplexed on that connection goes to pod A while pods B and C sit idle. Right: with a headless Service the client resolves all pod IPs and keeps a connection to each, balancing requests itself, or a service mesh does it per request; load spreads across all three pods.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .sm{fill:#64748b;font-size:12px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}.bm{fill:#f1f5f9;stroke:#94a3b8}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub,.sm{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}.bm{fill:#1e293b;stroke:#64748b}
    }

  </style>
  <defs><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="378" rx="14"/>
  <text class="h" x="28" y="40">One HTTP/2 connection = one pod</text>
  <text class="sub" x="28" y="62">kube-proxy balances when a connection opens, never per request.</text>
  <line class="ln dash" x1="400" y1="84" x2="400" y2="320"/>
  <text class="h2" x="28" y="102">ClusterIP + one gRPC connection</text>
  <rect class="box" x="28" y="160" width="110" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="83" y="182" text-anchor="middle" font-weight="700">client</text>
  <text class="sm" x="83" y="199" text-anchor="middle">gRPC</text>
  <rect class="bo" x="268" y="116" width="110" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="323" y="135" text-anchor="middle" font-weight="700">pod A</text>
  <text class="sm" x="323" y="152" text-anchor="middle">busy</text>
  <line class="lnp" x1="140" y1="185" x2="264" y2="138" marker-end="url(#arp)"/>
  <rect class="bm" x="268" y="180" width="110" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="323" y="199" text-anchor="middle" font-weight="700">pod B</text>
  <text class="sm" x="323" y="216" text-anchor="middle">idle</text>
  <rect class="bm" x="268" y="244" width="110" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="323" y="263" text-anchor="middle" font-weight="700">pod C</text>
  <text class="sm" x="323" y="280" text-anchor="middle">idle</text>
  <text class="sm prit" x="152" y="214">1 conn, all streams</text>
  <text class="h2" x="420" y="102">Headless + client-side balancing</text>
  <rect class="box" x="420" y="160" width="110" height="50" rx="10" stroke-width="1.5"/>
  <text class="tx" x="475" y="182" text-anchor="middle" font-weight="700">client</text>
  <text class="sm" x="475" y="199" text-anchor="middle">gRPC</text>
  <rect class="bo" x="660" y="116" width="110" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="715" y="135" text-anchor="middle" font-weight="700">pod A</text>
  <text class="sm" x="715" y="152" text-anchor="middle">busy</text>
  <line class="lnt" x1="532" y1="185" x2="656" y2="138" marker-end="url(#art)"/>
  <rect class="bo" x="660" y="180" width="110" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="715" y="199" text-anchor="middle" font-weight="700">pod B</text>
  <text class="sm" x="715" y="216" text-anchor="middle">busy</text>
  <line class="lnt" x1="532" y1="185" x2="656" y2="202" marker-end="url(#art)"/>
  <rect class="bo" x="660" y="244" width="110" height="44" rx="10" stroke-width="1.5"/>
  <text class="tx" x="715" y="263" text-anchor="middle" font-weight="700">pod C</text>
  <text class="sm" x="715" y="280" text-anchor="middle">busy</text>
  <line class="lnt" x1="532" y1="185" x2="656" y2="266" marker-end="url(#art)"/>
  <text class="tx badt" x="28" y="316">100% of requests on pod A</text>
  <text class="tx okt" x="420" y="316">spread over A, B, C</text>
  <text class="sub" x="28" y="352">Fix for gRPC/HTTP2: a headless Service with client-side load balancing, or a mesh (Envoy) that balances per request.</text>
</svg>
