<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 334" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Filter then score</title>
  <desc id="d">Three stages left to right. Forty nurses in the pool pass through a red filter stage of yes-or-no hard constraints (licensed for ICU, free for the shift, under the weekly-hours cap), leaving nine eligible. A teal scoring stage ranks them on soft preferences (distance, unit preference, fairness): N-12 scores 0.86, N-07 0.79 and N-31 0.71. Putting a hard rule into the score would let a bonus outweigh a missing licence. Counts and scores are illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="332" rx="14"/>
  <text class="h" x="28" y="40">Hard constraints filter, soft preferences score</text><text class="sub" x="28" y="62">Marketplace prompt: fill a last-minute ICU shift. Counts and scores are illustrative.</text><rect class="bm" x="28" y="86" width="210" height="170" rx="10"/><text class="sm" x="40" y="108" font-weight="700">40 nurses in the pool</text><circle class="mutf" cx="48" cy="128" r="6"/><circle class="mutf" cx="67" cy="128" r="6"/><circle class="mutf" cx="86" cy="128" r="6"/><circle class="mutf" cx="105" cy="128" r="6"/><circle class="mutf" cx="124" cy="128" r="6"/><circle class="mutf" cx="143" cy="128" r="6"/><circle class="mutf" cx="162" cy="128" r="6"/><circle class="mutf" cx="181" cy="128" r="6"/><circle class="mutf" cx="200" cy="128" r="6"/><circle class="mutf" cx="219" cy="128" r="6"/><circle class="mutf" cx="48" cy="150" r="6"/><circle class="mutf" cx="67" cy="150" r="6"/><circle class="mutf" cx="86" cy="150" r="6"/><circle class="mutf" cx="105" cy="150" r="6"/><circle class="mutf" cx="124" cy="150" r="6"/><circle class="mutf" cx="143" cy="150" r="6"/><circle class="mutf" cx="162" cy="150" r="6"/><circle class="mutf" cx="181" cy="150" r="6"/><circle class="mutf" cx="200" cy="150" r="6"/><circle class="mutf" cx="219" cy="150" r="6"/><circle class="mutf" cx="48" cy="172" r="6"/><circle class="mutf" cx="67" cy="172" r="6"/><circle class="mutf" cx="86" cy="172" r="6"/><circle class="mutf" cx="105" cy="172" r="6"/><circle class="mutf" cx="124" cy="172" r="6"/><circle class="mutf" cx="143" cy="172" r="6"/><circle class="mutf" cx="162" cy="172" r="6"/><circle class="mutf" cx="181" cy="172" r="6"/><circle class="mutf" cx="200" cy="172" r="6"/><circle class="mutf" cx="219" cy="172" r="6"/><circle class="mutf" cx="48" cy="194" r="6"/><circle class="mutf" cx="67" cy="194" r="6"/><circle class="mutf" cx="86" cy="194" r="6"/><circle class="mutf" cx="105" cy="194" r="6"/><circle class="mutf" cx="124" cy="194" r="6"/><circle class="mutf" cx="143" cy="194" r="6"/><circle class="mutf" cx="162" cy="194" r="6"/><circle class="mutf" cx="181" cy="194" r="6"/><circle class="mutf" cx="200" cy="194" r="6"/><circle class="mutf" cx="219" cy="194" r="6"/><line class="ln" x1="240" y1="170" x2="262" y2="170" marker-end="url(#ar)"/><rect class="bb" x="266" y="86" width="200" height="170" rx="10" stroke-width="1.5"/><text class="badt" x="278" y="108" font-size="14">Filter: yes / no</text><text class="sm" x="278" y="134">licensed for ICU</text><text class="sm" x="278" y="154">free for the shift</text><text class="sm" x="278" y="174">under weekly-hours cap</text><circle class="tea" cx="286" cy="224" r="6"/><circle class="tea" cx="306" cy="224" r="6"/><circle class="tea" cx="326" cy="224" r="6"/><circle class="tea" cx="346" cy="224" r="6"/><circle class="tea" cx="366" cy="224" r="6"/><circle class="tea" cx="386" cy="224" r="6"/><circle class="tea" cx="406" cy="224" r="6"/><circle class="tea" cx="426" cy="224" r="6"/><circle class="tea" cx="446" cy="224" r="6"/><text class="sub" x="278" y="248">9 eligible</text><line class="ln" x1="468" y1="170" x2="490" y2="170" marker-end="url(#ar)"/><rect class="bt" x="494" y="86" width="278" height="170" rx="10" stroke-width="1.5"/><text class="teat" x="506" y="108" font-size="14">Score: more / less</text><text class="sm" x="506" y="132">distance · unit preference · fairness</text><text class="sm" x="506" y="168">1.</text><text class="mono" x="526" y="168">N-12</text><rect class="tea" x="580" y="156" width="129" height="16" rx="4"/><text class="sub" x="715" y="169">0.86</text><text class="sm" x="506" y="200">2.</text><text class="mono" x="526" y="200">N-07</text><rect class="tea" x="580" y="188" width="118.5" height="16" rx="4"/><text class="sub" x="704.5" y="201">0.79</text><text class="sm" x="506" y="232">3.</text><text class="mono" x="526" y="232">N-31</text><rect class="tea" x="580" y="220" width="106.5" height="16" rx="4"/><text class="sub" x="692.5" y="233">0.71</text><text class="sm" x="28" y="292">Put a hard rule into the score and a big distance bonus can outweigh a missing licence.</text><text class="sm" x="28" y="310">Offers go out in rank order; the first acceptance wins and the other offers are withdrawn.</text>
</svg>
