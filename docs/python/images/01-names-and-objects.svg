<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Names and shared objects</title>
  <desc id="d">Animation in four steps. a = [1, 2] binds name a to a list. b = a binds name b to the same list. b.append(3) mutates that list, so a and b both show [1, 2, 3] and a is b is True. a = a + [4] builds a new list [1, 2, 3, 4] and moves only a's arrow to it; b still points to [1, 2, 3].</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:14s infinite linear}
    @keyframes p0{0%,24.99%{opacity:1}25%,100%{opacity:0}}.p0{animation-name:p0}
    @keyframes p1{0%,24.99%{opacity:0}25%,49.99%{opacity:1}50%,100%{opacity:0}}.p1{animation-name:p1}
    @keyframes p2{0%,49.99%{opacity:0}50%,74.99%{opacity:1}75%,100%{opacity:0}}.p2{animation-name:p2}
    @keyframes p3{0%,74.99%{opacity:0}75%,100%{opacity:1}}.p3{animation-name:p3}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:0}.p3{opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="348" rx="14"/>
  <text class="h" x="28" y="40">Names point to objects; assignment never copies</text><text class="sub" x="28" y="62">Mutation changes the shared object. Rebinding moves one arrow.</text><rect class="box" x="28" y="86" width="270" height="170" rx="10" stroke-width="1.2"/><text class="sub" x="44" y="108">code</text><text class="sub" x="390" y="108" text-anchor="middle">names</text><text class="sub" x="560" y="108">objects (heap)</text><text class="mono" x="48" y="140" xml:space="preserve">a = [1, 2]</text><text class="mono" x="48" y="172" xml:space="preserve">b = a</text><text class="mono" x="48" y="204" xml:space="preserve">b.append(3)</text><text class="mono" x="48" y="236" xml:space="preserve">a = a + [4]</text><g class="k p0"><rect class="bp" x="38" y="120" width="250" height="28" rx="6" stroke-width="1.2"/><text class="mono" x="48" y="140" xml:space="preserve">a = [1, 2]</text><rect class="box" x="360" y="130" width="60" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="390" y="155" text-anchor="middle">a</text><rect class="bt" x="560" y="132" width="40" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="580" y="155" text-anchor="middle" xml:space="preserve">1</text><rect class="bt" x="600" y="132" width="40" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="620" y="155" text-anchor="middle" xml:space="preserve">2</text><text class="sub" x="560" y="186">list object #1</text><line class="lnt" x1="422" y1="150" x2="554" y2="148" marker-end="url(#art)"/><text class="teat" x="28" y="300" style="font-size:15px">one name, one object</text><text class="mono" x="28" y="326" xml:space="preserve">a → a new list object</text></g><g class="k p1"><rect class="bp" x="38" y="152" width="250" height="28" rx="6" stroke-width="1.2"/><text class="mono" x="48" y="172" xml:space="preserve">b = a</text><rect class="box" x="360" y="130" width="60" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="390" y="155" text-anchor="middle">a</text><rect class="box" x="360" y="210" width="60" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="390" y="235" text-anchor="middle">b</text><rect class="bt" x="560" y="132" width="40" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="580" y="155" text-anchor="middle" xml:space="preserve">1</text><rect class="bt" x="600" y="132" width="40" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="620" y="155" text-anchor="middle" xml:space="preserve">2</text><text class="sub" x="560" y="186">list object #1</text><line class="lnt" x1="422" y1="150" x2="554" y2="148" marker-end="url(#art)"/><line class="lnt" x1="422" y1="230" x2="554" y2="160" marker-end="url(#art)"/><text class="teat" x="28" y="300" style="font-size:15px">two names, still one object</text><text class="mono" x="28" y="326" xml:space="preserve">b → the same object as a</text></g><g class="k p2"><rect class="bp" x="38" y="184" width="250" height="28" rx="6" stroke-width="1.2"/><text class="mono" x="48" y="204" xml:space="preserve">b.append(3)</text><rect class="box" x="360" y="130" width="60" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="390" y="155" text-anchor="middle">a</text><rect class="box" x="360" y="210" width="60" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="390" y="235" text-anchor="middle">b</text><rect class="bw" x="560" y="132" width="40" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="580" y="155" text-anchor="middle" xml:space="preserve">1</text><rect class="bw" x="600" y="132" width="40" height="36" rx="0" stroke-width="1.2"/><text class="mono" x="620" y="155" text-anchor="middle" xml:space="preserve">2</text><rect class="bw" x="640" y="132" width="40" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="660" y="155" text-anchor="middle" xml:space="preserve">3</text><text class="sub" x="560" y="186">list object #1</text><line class="lnt" x1="422" y1="150" x2="554" y2="148" marker-end="url(#art)"/><line class="lnt" x1="422" y1="230" x2="554" y2="160" marker-end="url(#art)"/><text class="teat" x="28" y="300" style="font-size:15px">mutated in place: both names see it</text><text class="mono" x="28" y="326" xml:space="preserve">print(a, a is b)  →  [1, 2, 3] True</text></g><g class="k p3"><rect class="bp" x="38" y="216" width="250" height="28" rx="6" stroke-width="1.2"/><text class="mono" x="48" y="236" xml:space="preserve">a = a + [4]</text><rect class="box" x="360" y="130" width="60" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="390" y="155" text-anchor="middle">a</text><rect class="box" x="360" y="210" width="60" height="40" rx="8" stroke-width="1.5"/><text class="lbl" x="390" y="235" text-anchor="middle">b</text><rect class="bt" x="560" y="132" width="40" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="580" y="155" text-anchor="middle" xml:space="preserve">1</text><rect class="bt" x="600" y="132" width="40" height="36" rx="0" stroke-width="1.2"/><text class="mono" x="620" y="155" text-anchor="middle" xml:space="preserve">2</text><rect class="bt" x="640" y="132" width="40" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="660" y="155" text-anchor="middle" xml:space="preserve">3</text><text class="sub" x="560" y="186">list object #1</text><rect class="bp" x="560" y="222" width="40" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="580" y="245" text-anchor="middle" xml:space="preserve">1</text><rect class="bp" x="600" y="222" width="40" height="36" rx="0" stroke-width="1.2"/><text class="mono" x="620" y="245" text-anchor="middle" xml:space="preserve">2</text><rect class="bp" x="640" y="222" width="40" height="36" rx="0" stroke-width="1.2"/><text class="mono" x="660" y="245" text-anchor="middle" xml:space="preserve">3</text><rect class="bp" x="680" y="222" width="40" height="36" rx="6" stroke-width="1.2"/><text class="mono" x="700" y="245" text-anchor="middle" xml:space="preserve">4</text><text class="sub" x="560" y="276">list object #2 (new)</text><line class="lnp" x1="422" y1="150" x2="554" y2="238" marker-end="url(#arp)"/><line class="lnt" x1="422" y1="230" x2="554" y2="156" marker-end="url(#art)"/><text class="prit" x="28" y="300" style="font-size:15px">a rebound to a new list; b unchanged</text><text class="mono" x="28" y="326" xml:space="preserve">print(a, b, a is b)  →  [1, 2, 3, 4] [1, 2, 3] False</text></g>
</svg>
