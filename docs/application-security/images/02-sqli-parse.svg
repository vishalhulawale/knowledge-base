<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Concatenation versus parameters</title>
  <desc id="d">Two parse trees for the input quote OR quote 1 equals 1. On the left, the string is concatenated into the SQL, so the input closes the literal and adds an OR node whose right side, 1 equals 1, is always true and returns every row. On the right, the prepared statement has a fixed tree with member equals a placeholder, and the whole input sits inside the value slot as one string literal, matching zero rows.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="430" rx="14"/>
  <text class="h" x="28" y="40">Where the input lands</text><text class="sub" x="28" y="62">Input for the member field:  ' OR '1'='1</text><rect class="bb" x="28" y="80" width="360" height="300" rx="10" stroke-width="1.5"/><text class="badt" x="44" y="106" style="font-size:15px">Concatenated string</text><rect class="bo" x="412" y="80" width="360" height="300" rx="10" stroke-width="1.5"/><text class="okt" x="428" y="106" style="font-size:15px">Prepared statement</text><text class="mono" x="44" y="134" xml:space="preserve">WHERE member = '' OR '1'='1'</text><rect class="box" x="163" y="156" width="90" height="28" rx="6" stroke-width="1.5"/><text class="sm" x="208" y="175" text-anchor="middle">WHERE</text><rect class="bb" x="173" y="208" width="70" height="28" rx="6" stroke-width="1.5"/><text class="badt" x="208" y="227" text-anchor="middle">OR</text><line class="ln" x1="208" y1="184" x2="208" y2="206"/><rect class="box" x="50" y="266" width="140" height="28" rx="6" stroke-width="1.5"/><text class="sm" x="120" y="285" text-anchor="middle">member = ''</text><rect class="bb" x="236" y="266" width="120" height="28" rx="6" stroke-width="1.5"/><text class="badt" x="296" y="285" text-anchor="middle">'1' = '1'</text><line class="ln" x1="196" y1="236" x2="130" y2="266"/><line class="ln" x1="220" y1="236" x2="290" y2="266"/><text class="badt" x="296" y="312" text-anchor="middle" style="font-size:13px">always true</text><text class="badt" x="44" y="360" style="font-size:14px">Input became grammar → every row returned</text><text class="mono" x="428" y="134" xml:space="preserve">WHERE member = ?</text><rect class="box" x="547" y="156" width="90" height="28" rx="6" stroke-width="1.5"/><text class="sm" x="592" y="175" text-anchor="middle">WHERE</text><rect class="box" x="562" y="208" width="60" height="28" rx="6" stroke-width="1.5"/><text class="sm" x="592" y="227" text-anchor="middle">=</text><line class="ln" x1="592" y1="184" x2="592" y2="208"/><rect class="box" x="460" y="266" width="100" height="28" rx="6" stroke-width="1.5"/><text class="sm" x="510" y="285" text-anchor="middle">member</text><line class="ln" x1="580" y1="236" x2="520" y2="266"/><line class="ln" x1="604" y1="236" x2="670" y2="266"/><rect class="bt" x="600" y="262" width="160" height="40" rx="6" stroke-width="1.5"/><text class="sub" x="680" y="278" text-anchor="middle">value slot ?</text><text class="mono" x="680" y="295" text-anchor="middle" xml:space="preserve">' OR '1'='1</text><text class="okt" x="680" y="324" text-anchor="middle" style="font-size:13px">one string literal</text><text class="okt" x="428" y="360" style="font-size:14px">Input stayed data → zero rows match</text><text class="sm" x="28" y="412">The parse happens before binding, so nothing in the value can change the tree.</text>
</svg>
