<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Expand and contract across releases</title>
  <desc id="d">Four releases change the pharmacy table to a new npi column. Release N expands: npi is added as nullable, the app writes both columns and reads the old one. Release N+1 migrates: npi is backfilled, the app still writes both and reads npi. Release N+2 contracts: the app writes and reads only npi, and the old column is left unused. A later release drops the old column. At every step rolling back one release is safe, because the previous version still finds the columns it uses.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sub{fill:#64748b;font-size:13px}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ring{fill:#ffffff;stroke:#d97706;stroke-width:2.5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx{fill:#e2e8f0}.sub{fill:#94a3b8}
      .box{fill:#111827;stroke:#475569}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
      .ring{fill:#111827;stroke:#fbbf24}
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker>
  </defs>
  <rect class="card" x="1" y="1" width="798" height="412" rx="14"/>
  <text class="h" x="28" y="40">Expand and contract: a column change across releases</text>
  <text class="sub" x="28" y="62">Table pharmacy, moving to the new npi column. Old and new code overlap during every rollout.</text>
  <text class="lbl" x="28" y="136">Schema</text><text class="lbl" x="28" y="236">App writes</text><text class="lbl" x="28" y="274">App reads</text>
  <text class="lbl" x="28" y="312">Roll back</text><text class="sub" x="28" y="330">one release?</text>
  <rect class="box" x="140" y="78" width="150" height="272" rx="10" stroke-width="1.5"/><text class="tx" x="152" y="100" font-weight="700">Release N</text><text class="sub teat" x="152" y="118">expand</text>
  <rect class="bp" x="150" y="132" width="130" height="32" rx="6" stroke-width="1.5"/><text class="sub" x="160" y="153">old column</text>
  <rect class="bt" x="150" y="172" width="130" height="32" rx="6" stroke-width="1.5"/><text class="sub" x="160" y="193">npi (nullable)</text>
  <text class="tx" x="152" y="236">both</text><text class="tx" x="152" y="274">old</text>
  <text class="tx okt" x="152" y="312">✓ safe</text><text class="sub" x="152" y="330">N−1 ignores npi</text>
  <rect class="box" x="298" y="78" width="150" height="272" rx="10" stroke-width="1.5"/><text class="tx" x="310" y="100" font-weight="700">Release N+1</text><text class="sub teat" x="310" y="118">migrate</text>
  <rect class="bp" x="308" y="132" width="130" height="32" rx="6" stroke-width="1.5"/><text class="sub" x="318" y="153">old column</text>
  <rect class="bt" x="308" y="172" width="130" height="32" rx="6" stroke-width="1.5"/><text class="sub" x="318" y="193">npi (backfilled)</text>
  <text class="tx" x="310" y="236">both</text><text class="tx" x="310" y="274">npi</text>
  <text class="tx okt" x="310" y="312">✓ safe</text><text class="sub" x="310" y="330">N still writes both</text>
  <rect class="box" x="456" y="78" width="150" height="272" rx="10" stroke-width="1.5"/><text class="tx" x="468" y="100" font-weight="700">Release N+2</text><text class="sub teat" x="468" y="118">contract</text>
  <rect class="bw" x="466" y="132" width="130" height="32" rx="6" stroke-width="1.5"/><text class="sub" x="476" y="153">old (unused)</text>
  <rect class="bt" x="466" y="172" width="130" height="32" rx="6" stroke-width="1.5"/><text class="sub" x="476" y="193">npi</text>
  <text class="tx" x="468" y="236">npi only</text><text class="tx" x="468" y="274">npi</text>
  <text class="tx okt" x="468" y="312">✓ safe</text><text class="sub" x="468" y="330">N+1 finds both</text>
  <rect class="box" x="614" y="78" width="150" height="272" rx="10" stroke-width="1.5"/><text class="tx" x="626" y="100" font-weight="700">Later release</text><text class="sub teat" x="626" y="118">drop old column</text>
  <rect class="bb" x="624" y="132" width="130" height="32" rx="6" stroke-width="1.5" style="stroke-dasharray:5 4"/><text class="sub badt" x="634" y="153">old dropped</text>
  <rect class="bt" x="624" y="172" width="130" height="32" rx="6" stroke-width="1.5"/><text class="sub" x="634" y="193">npi</text>
  <text class="tx" x="626" y="236">npi only</text><text class="tx" x="626" y="274">npi</text>
  <text class="tx okt" x="626" y="312">✓ safe</text><text class="sub" x="626" y="330">N+2 uses npi only</text>
  <text class="sub" x="28" y="378">Never rename or drop a column in the same release that stops using it: stop writing it first,</text>
  <text class="sub" x="28" y="396">and drop it in its own changeSet once no running version reads or writes it.</text>
</svg>
