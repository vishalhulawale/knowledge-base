<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 394" role="img" aria-labelledby="t d" font-family="Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">ISR stale-while-revalidate</title>
  <desc id="d">Animation: a timeline after deploy with a 60 second revalidate window. Request 1 at 20 seconds gets the fresh v1 page from cache. After the window ends, request A at 75 seconds still gets the stale v1 page and triggers a background regeneration. Once v2 is built, request B at 110 seconds gets v2. If regeneration fails, v1 keeps being served; on-demand revalidation marks v1 stale without waiting. Illustrative.</desc>
  <style>
    .card{fill:#f8fafc;stroke:#e2e8f0}
    .h{fill:#0f172a;font-size:20px;font-weight:700}
    .h2{fill:#0f172a;font-size:16px;font-weight:700}
    .lbl{fill:#334155;font-size:15px;font-weight:600}
    .tx{fill:#334155;font-size:14px}
    .sm{fill:#334155;font-size:13px}
    .sub{fill:#64748b;font-size:13px}
    .mono{fill:#0f172a;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;stroke:#cbd5e1}
    .bm{fill:#f1f5f9;stroke:#cbd5e1}
    .grid{stroke:#e2e8f0;stroke-width:1}
    .pri{fill:#4f46e5}.tea{fill:#0ea5a4}.okf{fill:#16a34a}.badf{fill:#dc2626}.wrnf{fill:#d97706}.mutf{fill:#94a3b8}
    .on{fill:#ffffff;font-size:14px;font-weight:700}
    .on13{fill:#ffffff;font-size:13px;font-weight:700}
    .prit{fill:#4f46e5;font-weight:700}.teat{fill:#0f766e;font-weight:700}.okt{fill:#16a34a;font-weight:700}
    .badt{fill:#dc2626;font-weight:700}.wrnt{fill:#b45309;font-weight:700}
    .ln{stroke:#64748b;stroke-width:2;fill:none}
    .lnp{stroke:#4f46e5;stroke-width:2.5;fill:none}.lnt{stroke:#0ea5a4;stroke-width:2.5;fill:none}
    .lno{stroke:#16a34a;stroke-width:2.5;fill:none}.lnb{stroke:#dc2626;stroke-width:2.5;fill:none}
    .lnw{stroke:#d97706;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:6 5}
    .ah{fill:#64748b}.ahp{fill:#4f46e5}.aht{fill:#0ea5a4}.aho{fill:#16a34a}.ahb{fill:#dc2626}.ahw{fill:#d97706}
    .bp{fill:#eef2ff;stroke:#4f46e5}.bt{fill:#f0fdfa;stroke:#0ea5a4}.bo{fill:#f0fdf4;stroke:#16a34a}
    .bb{fill:#fef2f2;stroke:#dc2626}.bw{fill:#fffbeb;stroke:#d97706}
    @media (prefers-color-scheme: dark){
      .card{fill:#1f2430;stroke:#334155}
      .h,.h2{fill:#f1f5f9}.lbl,.tx,.sm{fill:#e2e8f0}.sub{fill:#94a3b8}.mono{fill:#e2e8f0}
      .box{fill:#111827;stroke:#475569}.bm{fill:#1e293b;stroke:#475569}.grid{stroke:#334155}
      .pri{fill:#818cf8}.tea{fill:#2dd4bf}.okf{fill:#4ade80}.badf{fill:#f87171}.wrnf{fill:#fbbf24}.mutf{fill:#64748b}
      .on,.on13{fill:#0f172a}
      .prit{fill:#818cf8}.teat{fill:#5eead4}.okt{fill:#4ade80}.badt{fill:#f87171}.wrnt{fill:#fbbf24}
      .ln{stroke:#94a3b8}.lnp{stroke:#818cf8}.lnt{stroke:#2dd4bf}.lno{stroke:#4ade80}.lnb{stroke:#f87171}.lnw{stroke:#fbbf24}
      .ah{fill:#94a3b8}.ahp{fill:#818cf8}.aht{fill:#2dd4bf}.aho{fill:#4ade80}.ahb{fill:#f87171}.ahw{fill:#fbbf24}
      .bp{fill:#1e1b4b;stroke:#818cf8}.bt{fill:#042f2e;stroke:#2dd4bf}.bo{fill:#052e16;stroke:#4ade80}
      .bb{fill:#450a0a;stroke:#f87171}.bw{fill:#451a03;stroke:#fbbf24}
    }

    .k{opacity:0;animation:15s infinite linear}
    @keyframes v2{0%,61.99%{opacity:0}62%,98.99%{opacity:1}99%,100%{opacity:0}}.v2{animation-name:v2}
    @keyframes e20{0%,11.99%{opacity:0}12%,98.99%{opacity:1}99%,100%{opacity:0}}.e20{animation-name:e20}
    @keyframes e75{0%,35.99%{opacity:0}36%,98.99%{opacity:1}99%,100%{opacity:0}}.e75{animation-name:e75}
    @keyframes e110{0%,69.99%{opacity:0}70%,98.99%{opacity:1}99%,100%{opacity:0}}.e110{animation-name:e110}
    @keyframes rg{0%,43.99%{opacity:0}44%,98.99%{opacity:1}99%,100%{opacity:0}}.rg{animation-name:rg}
    @media (prefers-reduced-motion: reduce){.k{animation:none;opacity:1}}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0L10,5L0,10z"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0L10,5L0,10z"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aht" d="M0,0L10,5L0,10z"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aho" d="M0,0L10,5L0,10z"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0L10,5L0,10z"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahw" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect class="card" x="1" y="1" width="798" height="392" rx="14"/>
  <text class="h" x="28" y="40">ISR: serve stale, regenerate in the background</text><text class="sub" x="28" y="62">Revalidate window of 60 s; times in seconds after deploy. Illustrative.</text><text class="lbl" x="28" y="112">Cache</text><rect class="bo" x="90" y="94" width="335" height="28" rx="6" stroke-width="1.5"/><text class="okt" x="257.5" y="113" text-anchor="middle" style="font-size:13px">v1 fresh</text><rect class="bw" x="425" y="94" width="156.333" height="28" rx="6" stroke-width="1.5"/><text class="wrnt" x="503.167" y="113" text-anchor="middle" style="font-size:13px">v1 stale</text><g class="k v2"><rect class="bo" x="581.333" y="94" width="178.667" height="28" rx="6" stroke-width="1.5"/><text class="okt" x="670.667" y="113" text-anchor="middle" style="font-size:13px">v2 fresh</text></g><line class="ln" x1="90" y1="300" x2="760" y2="300"/><line class="ln" x1="90" y1="296" x2="90" y2="304"/><text class="sub" x="90" y="322" text-anchor="middle">0 s</text><line class="ln" x1="201.667" y1="296" x2="201.667" y2="304"/><text class="sub" x="201.667" y="322" text-anchor="middle">20 s</text><line class="ln" x1="313.333" y1="296" x2="313.333" y2="304"/><text class="sub" x="313.333" y="322" text-anchor="middle">40 s</text><line class="ln" x1="425" y1="296" x2="425" y2="304"/><text class="sub" x="425" y="322" text-anchor="middle">60 s</text><line class="ln" x1="536.667" y1="296" x2="536.667" y2="304"/><text class="sub" x="536.667" y="322" text-anchor="middle">80 s</text><line class="ln" x1="648.333" y1="296" x2="648.333" y2="304"/><text class="sub" x="648.333" y="322" text-anchor="middle">100 s</text><line class="ln" x1="760" y1="296" x2="760" y2="304"/><text class="sub" x="760" y="322" text-anchor="middle">120 s</text><line class="lnw dash" x1="425" y1="84" x2="425" y2="300"/><text class="wrnt" x="419" y="140" text-anchor="end" style="font-size:12px">window ends</text><text class="sub" x="94" y="140">deploy: v1 built</text><g class="k e20"><circle class="okf" cx="201.667" cy="300" r="7"/><line class="lnp" x1="201.667" y1="244" x2="201.667" y2="128" marker-end="url(#arp)"/><text class="lbl" x="201.667" y="262" text-anchor="middle">Request 1</text><text class="okt" x="201.667" y="280" text-anchor="middle" style="font-size:13px">gets v1 (hit)</text></g><g class="k e75"><circle class="wrnf" cx="508.75" cy="300" r="7"/><line class="lnw" x1="508.75" y1="244" x2="508.75" y2="128" marker-end="url(#arw)"/><text class="lbl" x="508.75" y="262" text-anchor="middle">Request A</text><text class="wrnt" x="508.75" y="280" text-anchor="middle" style="font-size:13px">gets v1 (stale)</text></g><g class="k e110"><circle class="okf" cx="704.167" cy="300" r="7"/><line class="lnp" x1="704.167" y1="244" x2="704.167" y2="128" marker-end="url(#arp)"/><text class="lbl" x="704.167" y="262" text-anchor="middle">Request B</text><text class="okt" x="704.167" y="280" text-anchor="middle" style="font-size:13px">gets v2</text></g><g class="k rg"><rect class="tea" x="514.333" y="176" width="67" height="24" rx="5"/><text class="teat" x="587.333" y="186" style="font-size:13px">regenerate v2</text><text class="teat" x="587.333" y="202" style="font-size:13px">in background</text></g><text class="sm" x="28" y="352">Request A triggers the rebuild but is not made to wait. If regeneration fails, v1 keeps being served.</text><text class="sm" x="28" y="374">On-demand: revalidateTag(tag, 'max') marks v1 stale at once instead of waiting for the timer.</text>
</svg>
