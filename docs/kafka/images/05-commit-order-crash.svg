  <text class="tx a p2" x="420" y="240">restart reads from 100</text>
  <text class="tx badt a p2" x="28" y="262">105–109 never processed: LOST</text>
  <text class="tx wrnt a p2" x="420" y="262">100–109 processed twice: DUPLICATES</text>
  <text class="sm a p2" x="420" y="282">safe only if the consumer is idempotent</text>
  <text class="lbl a p0" x="28" y="332">1  poll() returns 100–109</text>
  <text class="lbl badt a p1" x="28" y="332">2  Crash: left after processing 100–104, right before its commit</text>
  <text class="lbl a p2" x="28" y="332">3  Restart from the committed offset</text>
  <text class="sub" x="28" y="360">Grey = not processed, green = processed, red = lost, amber = processed again.</text>
  <text class="sub" x="28" y="380">Exactly-once needs the output and the offset commit in one transaction (or one DB transaction).</text>
